<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昇腾知识浏览器 · ascend-sleuth references</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#view">跳到内容</a>

<!-- 顶栏 -->
<header class="topbar">
  <div class="topbar-in container">
    <a class="brand" href="#/" aria-label="昇腾知识浏览器 总览">
      <span class="logo">昇</span>
      <b>昇腾知识浏览器</b><span class="ver">REFERENCES</span>
    </a>
    <div class="gsearch" id="gsearch"><div class="search-host"></div></div>
    <nav class="top-actions" aria-label="主导航">
      <a class="navlink" href="#/">总览</a>
      <a class="navlink" href="#/triage">症状路由</a>
      <span style="width:2px;height:18px;background:var(--line);border-radius:2px;margin:0 4px"></span>
      <button class="icon-btn" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题"><span id="themeIcon">☾</span></button>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<!-- ⌘K 命令面板 -->
<div id="palette" class="palette" hidden>
  <div class="pal-backdrop" data-pal-close></div>
  <div class="pal" role="dialog" aria-modal="true" aria-label="命令面板">
    <div class="pal-input">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="palQ" type="text" autocomplete="off" spellcheck="false" placeholder="搜索词条 / 输入命令…" aria-label="命令面板搜索">
      <kbd>esc</kbd>
    </div>
    <div class="pal-list" id="palList" role="listbox"></div>
    <div class="pal-foot">↑↓ 选择 · <b>↵</b> 打开 · <b>esc</b> 关闭 · 动作直达</div>
  </div>
</div>

<div id="toasts" role="status" aria-live="polite"></div>

<script src="kb-data.js"></script>
<script src="app.js"></script>
</body>
</html>
