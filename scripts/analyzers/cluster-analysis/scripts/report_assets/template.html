<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{title}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>{css}</style>
</head>
<body>
<div class="report-nav">
  <div class="nav-brand">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="1" y="11" width="4" height="8" rx="1" fill="#38bdf8"></rect>
      <rect x="8" y="6" width="4" height="13" rx="1" fill="#34d399"></rect>
      <rect x="15" y="2" width="4" height="17" rx="1" fill="#fb923c"></rect>
    </svg>
    <span class="nav-brand-text">NPU 性能分析报告</span>
    <span class="side-mode">{mode_label}</span>
  </div>
  <nav class="nav-links">{nav}</nav>
  <button id="toggle-all" type="button" class="nav-ctl">全部收起</button>
  <div class="progress"></div>
</div>
<div class="main">
<div class="page-head pb-4 mb-2 border-b border-slate-700">
  <h1>{title}</h1>
  <p class="text-slate-400 mt-2 text-sm">{subtitle}</p>
  <div class="header-meta">数据路径：{data_path} · 生成时间：{gen_time} · 执行模式：{exec_mode}</div>
</div>
{body}
<footer class="text-center text-xs text-slate-500 pt-8 pb-4">
  由 cluster-analysis skill 生成 · 中间件均在本目录 · 各章节可折叠 · 建议配合 MindStudio Insight 时间线交叉验证
</footer>
</div>
<script>{spy_js}</script>
</body>
</html>
