# traces 的生命周期词表（**数据，不是散文**）
#
# 谁读：诊断面板（按钮语义与配色）、`skills/diagnose`、`skills/resume-diagnosis`（写 trace 时取值）、
#       `scripts/settle_trace_feedback.py`（结算时按 outcome 分类）。
#
# 为什么单独成文件（2026-09 阶段一）：`status` 的取值原先散在三处——`diagnosis_state.yaml.example`
# 的注释、skill 正文的散文、面板代码里的常量表。散文那两处**脚本读不到**，于是
# 「词表加了新值而面板不认」或「面板写的值与 skill 写的不一致」都不会报错。
# 闭环按钮要落地就必须先有这一份：面板写入的值要能被校验、被 skill 认同、被指标脚本正确分类。
#
# 位置说明：放仓库根（与 `triage-tree.yaml` 同类：顶层数据文件）。**不能放 `traces/`**——那目录
# 是 gitignored 的运行时件，面板与脚本在别的检出读不到。
#
# 改这里 = 改判据：同步 `diagnosis_state.yaml.example`、`skills/diagnose`、`skills/resume-diagnosis`；
# 改 `sedimented` 段还要同步 `skills/to-postmortem`、`skills/knowledge-groom`（写侧）与
# 诊断面板的列表筛选（读侧，`dsh-plugins/ascend-panel/panel-client.js`）。

status:
  - value: in_progress
    label: 进行中
    resumable: true          # 可被 /skill:resume-diagnosis 续接
    terminal: false
    meaning: 诊断尚未给出结论，或结论已给但用户在跟进
    when_to_set: 诊断开始时写入；续接时刷新 updated_at 但不改状态
  - value: resolved
    label: 已定位
    resumable: false
    terminal: true
    meaning: >-
      诊断已给出结论（根因定位明确，fix 或明确的下一步已给出）并收尾。
      **不表示 fix 在用户环境里生效**——那件事由 `feedback.outcome` 记（见本文件 `outcome:` 段）。
    when_to_set: >-
      诊断走到结论即可写：根因定位明确、给了 fix 或明确的下一步（**有无命中 case 均可**）。
      fix 是否生效不写这里：命中单在给 fix 时写 `feedback.outcome: pending`，有人回报结果时
      再追加 `feedback` 事件把它改成 `resolved` / `not_resolved` / `partial`；
      无命中单没有 case 可归属，结果只落在 status，不写 feedback 事件
      （升格闸门对这一类读 status，见 `scripts/verify_case_draft.py`）。
    writes_feedback: false   # 收尾不连带给 feedback 赋值（两条轴各写各的，见本文件 `outcome:` 段）
  - value: escalated
    label: 已转交他人
    resumable: false
    terminal: true
    meaning: 本地不再跟进，已交给别人（厂商 / 技术支持 / 同事）
    when_to_set: >-
      本地无法定位，或问题归属别人；必须记 `ending.handed_to`（转交给谁）。
      旧标签叫「已转上游」，2026-11 起扩到任何接手方。
    writes_feedback: false
  - value: archived
    label: 不再跟进
    resumable: false
    terminal: true
    meaning: 不再跟进这单，**且没有人接手**，且不对"fix 是否有效"下判断
    when_to_set: >-
      问题自行消失 / 环境变更后不复现 / 与已有单重复 / 没有走诊断就结束 / 主动撤回——
      **不是** agent 给出的 fix 生效。收尾方式记在 `ending.kind`，见本文件 `ending_kinds:` 段。
      「有人接手了」不写这里，写 `escalated` + `ending.handed_to`。
    writes_feedback: false
  - value: unknown
    label: 状态未记录
    resumable: false
    terminal: false
    meaning: 初期记录或手工写入的 trace 未带状态
    when_to_set: 兼容旧 trace；新写入不使用

# 反馈结果（命中 case 的 fix 是否生效）。**与 status 正交**：
# status 说"这单结束了没"，outcome 说"那个 case 给的 fix 到底行不行"。
outcome:
  - value: pending
    label: 待回报
    counts_as: none          # 结算时**既不计 hit 也不计误诊**——"没回报"不等于"没解决"
    meaning: 还没测、或还没回报；保留为反馈债
  - value: resolved
    label: 生效
    counts_as: hit           # settle_trace_feedback.py: hits += 1
    meaning: 用户确认 fix 在自己环境里解决了问题
  - value: not_resolved
    label: 未生效
    counts_as: misdiagnosis  # misdiagnoses += 1（负信号）
    meaning: 用户确认 fix 没解决问题
  - value: partial
    label: 部分生效
    counts_as: misdiagnosis  # 命中的 case 给出的 fix 不完整
    meaning: 症状缓解但未根治

# 知识沉淀状态（trace 顶层 `sedimented`）——**第三条轴**，与上面两条不是同一件事：
#   status    说"这单还管不管"（诊断收尾）；
#   outcome   说"命中 case 的 fix 行不行"（诊断闭环，升格依据）；
#   sedimented 说"结论进知识库了没"（本段）。
# 三条轴不是互不相干：无命中单没有 case 可写 outcome，它的闭环落在 status 上
# （`scripts/verify_case_draft.py` 的闸门对这一类读 `status: resolved` 且要求没有显式 outcome）。
# 谁读：诊断面板的列表筛选与徽标（「待沉淀」= 已闭环、none、且命中的 case 不在库；
#       「待升格」= submitted 且来源诊断未闭环）。
# 判据同源：`scripts/verify_case_draft.py` 的升格闸门按前两条轴决定放行，本轴只记进度。
# 字段写法以 `diagnosis_state.yaml.example` 为准：`case_id`、`inbox_path`；面板的读端同时认旧
# trace 里的 `caseId`（camelCase，历史件就是这么写的）。
sedimented:
  - value: none
    label: 未沉淀
    meaning: 结论还没进知识库（含从未尝试沉淀）
    when_to_set: 不显式写；字段缺失即按 none 读
  - value: submitted
    label: 已提交待升格
    meaning: 草稿已落 `postmortems/inbox/`，等 groom 审核升格
    when_to_set: to-postmortem 产出草稿时回写来源 trace（动作发生时写，零推断）
  - value: knowledge
    label: 已升格（Tier 2）
    meaning: 已升格为 `knowledge/<ns>/` 下的 case
    when_to_set: knowledge-groom 按 new_pattern / variant_of 转正后回写，并记 case_id
  - value: archived
    label: 已归档（Tier 3）
    meaning: 只沉淀为 postmortem（covered_by：已有 case 覆盖）
    when_to_set: knowledge-groom 按 covered_by 转正后回写，并记 case_id

# ── 状态转移表（数据，不是散文）────────────────────────────────────────────────
#
# 谁读：`scripts/trace_transition.py`（按它校验必填与合法转移）、`scripts/_trace_state.py`
# （生成面板可用的动作）、`scripts/verify_trace_status.py`（校验词表自洽）。
# 加一个状态 = 改本文件 `status:` 段；加一条转移 = 加下面的一条；改必填 = 改 requires/fillable。
# 面板不实现任何判据，只渲染 `trace_state.py --json` 给出的动作。
#
# 字段三类：
#   requires  —— 本次调用必须提供并写盘（如 ended 时刻、转交给谁）
#   fillable  —— 已存在就沿用；缺失时面板给输入位，写入口一并写盘
#   must_exist —— 必须已存在；写入口不写、面板不给输入位（缺失时给「先去回报」引导）
axes:
  - { field: status,     writer: scripts/trace_transition.py,                    stage: PR1 }
  - { field: outcome,    writer: scripts/trace_transition.py --field outcome,    stage: PR2 }
  - { field: sedimented, writer: scripts/trace_transition.py --field sedimented, stage: PR1 }

# `stop_reason` 的其余取值仍在 `scripts/trace_metrics.py`（停止点统计的唯一判据）；
# 本段只登记面板新增的那一个，两处必须同步（见 trace_metrics.py:107-110）。
stop_reasons:
  - { value: closed_by_user, label: 用户在面板收尾 }

ending_kinds:
  - { value: root_cause,       label: 根因明确,     statuses: [resolved] }
  - { value: handed_off,       label: 转交他人跟进, statuses: [escalated], requires: [ending.handed_to] }
  - { value: not_reproducible, label: 问题未复现,   statuses: [archived] }
  - { value: duplicate,        label: 与已有单重复, statuses: [archived], requires: [ending.duplicate_of] }
  - { value: no_diagnosis,     label: 未走诊断,     statuses: [archived] }
  - { value: withdrawn,        label: 主动撤回,     statuses: [archived] }
# withdrawn 与 no_diagnosis 的边界：前者是「诊断进行过但主动中止且没有结论」（如材料不足），
# 后者是「从未开始诊断」。两者都不下 fix 是否有效的判断。

transitions:
  - { from: [in_progress, unknown], to: resolved, action: close-resolved, action_label: 已定位,
      ending: root_cause, requires: [resolved_at], fillable: [summary, severity, fix_emitted],
      must_exist_if_case: [feedback.outcome], expands_to: [] }
  - { from: [in_progress, unknown], to: escalated, action: close-escalated, action_label: 转交他人跟进,
      ending: handed_off, requires: [ending.handed_to], fillable: [summary], expands_to: [] }
  - { from: [in_progress, unknown], to: archived, action: close-archived, action_label: 不再跟进,
      ending_choices: [not_reproducible, duplicate, no_diagnosis, withdrawn],
      requires: [ending.kind], fillable: [summary], expands_to: [] }
  - { from: [resolved, escalated, archived], to: in_progress, action: reopen,
      action_label: 重新打开, expands_to: [] }
  - { from: [resolved, escalated, archived], to: [resolved, escalated, archived], except_same: true,
      action: correct-ending, action_label: 改收尾方式,
      expands_to: [reopen, close-resolved, close-escalated, close-archived] }
  - { from: [resolved, escalated, archived], to: [resolved, escalated, archived], same_status: true,
      action: backfill-ending, action_label: 补记收尾方式,
      requires: [ending.kind], expands_to: [] }
