# 训练侧精度（loss NaN、收敛、权重错位、训推不一致）
# 本文件是 Tier 1 路由数据的一族（分支 id: training_precision）；改词只改这里，不要改 triage-tree.yaml。
# 聚合：python3 scripts/build_triage_tree.py（生成 triage-tree.yaml；--check 校验一致）。
# 合并：本目录在 .gitattributes 里配了 merge=union——两人同一天给同一族加词会自动都留住（行级并集），
#       无需人工判断留哪份；重复行由聚合器报出来，删掉其中一行即可。

branches:
  - id: training_precision
    category: precision
    symptoms:
      - ['\bnan\b', "loss.*nan", '\binf\b']
      - ["fp8.*precision", '\boverflow\b', '\bunderflow\b']
      - ["bf16.*mismatch", "allreduce.*round"]
      - ['\bdiverg', "not converg"]        # 收敛问题走 precision.convergence 子类型
      - ["乱码", "garbled", "weight.*mismatch", "权重.*错位"]   # 权重错位/输出乱码（MSLLM-1532 mg2hf GQA 拆分 / MSLLM-1437 grad norm 0）
      - ["日志.*异常", "统计失真", "被错误除以", "除以.*global_step", "日志失真"]   # 日志统计/数值呈现异常（MSLLM-1780 FSDP2 续训首步 lm loss 被除 global_step）
      - ["重复训练.*(不一致|差异)", "确定性.*(不一致|失效|无法固定)", "grad_norm.*(偏大|异常)"]   # 重复训练/确定性类（COMMON-SEED-RESET-DETERMINISM 业务装饰器重置确定性开关 / COMMON-RMSNORM-WEIGHT-SCALE 加载权重数值放大 / COMMON-FA-RACE-DETERMINISM 算子数据竞争）
      - ["log_?prob.*(差异|不一致)", "训推.*(不一致|差异|对齐)", "reward.*(下降|崩溃)"]   # 训推一致性类（VERL-LOGPROB-CONFIG-MISMATCH）
    search_namespaces:
      - training/<detected_framework>/
      - common/
    fallback: Tier 3

