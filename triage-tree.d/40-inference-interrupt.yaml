# 推理侧中断（超时 / hang / OOM / 启动失败 / 架构不支持）
# 本文件是 Tier 1 路由数据的一族（分支 id: inference_interrupt）；改词只改这里，不要改 triage-tree.yaml。
# 聚合：python3 scripts/build_triage_tree.py（生成 triage-tree.yaml；--check 校验一致）。
# 合并：本目录在 .gitattributes 里配了 merge=union——两人同一天给同一族加词会自动都留住（行级并集），
#       无需人工判断留哪份；重复行由聚合器报出来，删掉其中一行即可。

branches:
  - id: inference_interrupt
    category: interrupt
    symptoms:
      - ["\\btimeout\\b", "超时", "synchronize.*timeout", "广播.*超时", "timed out", "TimeoutError"]   # 推理侧通信/同步超时（timed out/TimeoutError 补录：2026-W37 #13639 sample_tokens RPC 超时）
      - ["\\bhang\\b", "\\bstuck\\b", "死锁", "挂起", "deadlock"]   # 推理侧 hang/死锁（2026-W37 #13639 fullgraph deadlock 补录——原只有 timeout 变体，hang 被 training 分支独占）
      - ["\\bpreempt\\b", "抢占", "无法.*调度", "调度.*(卡|死锁|楔)", "admission.*fail", "排队.*堆积", "waiting.*递增"]   # 调度/接纳层（preemption/admission）——PD 分离静默冻结/调度楔（2026-09-08 ascend_store PD prefill hang；真实支点常是调度/控制循环层而非 load/传输组件）
      - ["kv.*cache.*full", "out of memory", "\\bOOM\\b", "内存泄漏", "memory leak", "内存.*持续增长"]   # 长跑内存泄漏/OOM（#12345：CANN host buffer 不驱逐，中文/大写 OOM 补录）
      - ["serving.*crash", "engine.*error"]
      - ['ErrCode=\d+', 'EE9999', 'rtStream\w*.*fail', 'aclrt\w+.*fail']   # 错误码型签名（评估 0001 §四.2：12983 型靠退化兜底的缺口）
      - ['internal error', '\babort\b', '\bcrash\b', '\bdied\b']
      - ["failed to start", "cannot start", "unable to start", "启动失败", "service.*start.*fail"]   # 启动失败类（10610/11208/13508/9167 等）
      - ["ModuleNotFoundError", "ImportError", "KeyError", "AttributeError", "RuntimeError", "AssertionError", "ValueError", "TypeError"]   # 启动期异常类（ValueError 补录：2026-W36 #7023；TypeError 补录：2026-W37 #13446 Reranker config 类型错配——原缺 TypeError 致被 training 的 failed to start 误吸）
      - ["are not supported for now", "not supported for now", "Model architectures.*not supported"]   # 架构不支持（#15086：K3 版本错位，OOD 补录）
    search_namespaces:
      - inference/<detected_framework>/
      - common/
    fallback: Tier 3

