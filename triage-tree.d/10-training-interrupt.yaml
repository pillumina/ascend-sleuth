# 训练侧中断（启动失败 / 崩溃 / 资源耗尽 / 通信超时）
# 本文件是 Tier 1 路由数据的一族（分支 id: training_interrupt）；改词只改这里，不要改 triage-tree.yaml。
# 聚合：python3 scripts/build_triage_tree.py（生成 triage-tree.yaml；--check 校验一致）。
# 合并：本目录在 .gitattributes 里配了 merge=union——两人同一天给同一族加词会自动都留住（行级并集），
#       无需人工判断留哪份；重复行由聚合器报出来，删掉其中一行即可。

branches:
  - id: training_interrupt
    category: interrupt
    symptoms:
      - ['\btimeout\b', '\bhang\b', "stuck at step"]
      - ["NCCL.*timeout", "HCCL.*timeout", "all_to_all.*timeout"]
      - ['\bOOM\b', "out of memory", '\bkilled\b']
      - ["core dumped", "segmentation fault"]
      - ["HCCL.*(error|fail)", "hcclCommInit"]                      # HCCL 通信初始化错误（VERL-5074 error code 5 / VERL-6608 error code 7）
      - ["aclnn\\w+"]                                               # aclnn 算子调用错误（VERL-6885 ConvolutionBackward）
      - ["CPU-only actor", "registered but not available"]          # 设备平台注册失败（VERL-6741 Ray actor CPU-only）
      - ["RuntimeError", "AssertionError", "patch.*fail"]           # 训练期异常（VERL-6707 npu_patch / VERL-6756 设备检测兜底）
      - ["ImportError", "ModuleNotFoundError", "FileNotFoundError"]  # 启动期 import/文件错误（MSLLM-1554/1555 features_manager 缺符号 / MSLLM-1465 数据预处理路径）
      - ["cannot start", "启动失败", "failed to start", "训练无法启动", "训练无法拉起", "启动即失败"]   # 训练启动失败类（MSLLM-1459/1667 等）
      - ["重复注册", "register.*multiple times"]                     # 算子重复注册（MSLLM-1550 GMMOpBuilder / MSLLM-1707 npu_moe 算子）
      - ["build_train_valid_test_data"]                              # 数据集构建阶段（MSLLM-1526 helpers_cpp 缓存）
      - ["recv_forward", "p2p_communication"]                        # p2p 通信路径（MSLLM-1525 batch_p2p_comm）
    search_namespaces:            # 按顺序搜索，最多加载 3 个
      - training/<detected_framework>/
      - common/
    fallback: Tier 3

