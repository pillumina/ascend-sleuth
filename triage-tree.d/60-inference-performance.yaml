# 推理侧性能（延迟、接受率、缓存命中、生成停摆）
# 本文件是 Tier 1 路由数据的一族（分支 id: inference_performance）；改词只改这里，不要改 triage-tree.yaml。
# 聚合：python3 scripts/build_triage_tree.py（生成 triage-tree.yaml；--check 校验一致）。
# 合并：本目录在 .gitattributes 里配了 merge=union——两人同一天给同一族加词会自动都留住（行级并集），
#       无需人工判断留哪份；重复行由聚合器报出来，删掉其中一行即可。

branches:
  - id: inference_performance
    category: performance
    symptoms:
      - ["latency.*high", "p99.*slo", "qps.*low", "吞吐.*下降", "throughput.*drop", "tpot", "TPOT.*劣化", "tpot.*劣化"]
      - ["cold.*start.*slow", "first.*token.*slow"]
      - ["accept.*rate.*drop", "accept_len.*下降", "acceptance.*rate.*drop", "acceptance_per_pos", "接受率低", "接受率.*低", "投机.*接受率"]   # 投机接受率下降=生成效率退化（性能；无输出内容错误前提——伴随输出错误/乱码走 inference_precision，见 precision 分支注释）
      - ["cache.*hit.*0", "命中.*为0", "prefix.*cache.*miss", "缓存命中.*0"]    # 前缀缓存失效=性能退化
      - ["generation.*stall", "generation.*slow", "卡住.*生成"]
      # Host/Device 侧性能指标形态（profiling 驱动；2026-09-09 msprof 案例沉淀时补录，
      # 覆盖「吞吐/延迟族」之外的系统层与采集层判据）
      - ["利用率.*(低|偏低)", "util.*low", "idle.*(高|占比)", "free.*(占比|时间)", "无效空闲", "空档"]
      - ["上下文切换", "context.?switch", "锁等待", "lock.*wait", "\\bGIL\\b", "GC.*(抖动|耗时|回收)", "syscall", "malloc.*耗时", "中断.*(偏高|集中|次数)", "\\bIRQ\\b", "cache miss", "透明大页", "\\bTHP\\b"]
      - ["通信.*耗时.*占比", "AllReduce.*(波动|耗时)", "慢卡", "快等慢", "带宽使用率", "等待时长比例"]
      - ["显存.*(缓慢|持续).*(增长|上涨)", "reserved.*(上涨|增长)", "allocated.*不涨", "显存.*(累积|泄漏)", "显存.*OOM"]
      - ["op_statistic", "aclopCompile", "算子编译", "访存密集", "\\bNonZero\\b", "batch.*(过小|偏小)"]
      - ["dequeue", "同步接口", "aclrtSynchronizeStream", "耗时.*抖动", "吞吐.*(不足|偏低|下降)"]
    search_namespaces:
      - inference/<detected_framework>/
      - common/
    fallback: Tier 3

