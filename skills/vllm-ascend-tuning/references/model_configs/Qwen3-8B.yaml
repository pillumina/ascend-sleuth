# Qwen3-8B 模型配置
# 类型: Dense
# 最后更新: 2026-02-27

model:
  name: Qwen3-8B
  type: Dense
  description: "Qwen3 8B Dense 通用文本生成模型"
  huggingface_path: Qwen/Qwen3-8B
  architecture: Qwen3ForCausalLM

deployment:
  recommended_tp: 1
  min_npu_count: 1
  recommended_memory: "32 GB"

performance:
  max_model_len: 32768
  max_num_seqs: 256
  max_num_batched_tokens: 4096
  block_size: 128
  gpu_memory_utilization: 0.9

environment_variables:
  TASK_QUEUE_ENABLE: "1"
  VLLM_ASCEND_ENABLE_DENSE_OPTIMIZE: "1"
  VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
  ASCEND_RT_VISIBLE_DEVICES: "0"

vllm_parameters:
  - "trust-remote-code"
  - "quantization ascend"
  - "async-scheduling"
  - "no-enable-prefix-caching"
  - "distributed-executor-backend mp"

additional_config:
  enable_cpu_binding: true

compilation_config:
  cudagraph_mode: FULL_DECODE_ONLY

feature_support:
  chunked_prefill: "支持"
  automatic_prefix_cache: "不支持"
  speculative_decoding: "支持 (Eagle3)"
  lora: "不支持"

quantization_support:
  ascend: "支持 (W8A8, MXFP8)"
  gptq: "不支持"
  awq: "不支持"

launch_command: |
  vllm serve /path/to/Qwen3-8B \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name Qwen3-8B \
    --trust-remote-code \
    --max-num-seqs 256 \
    --max-model-len 32768 \
    --max-num-batched-tokens 4096 \
    --tensor-parallel-size 1 \
    --quantization ascend \
    --gpu-memory-utilization 0.9 \
    --block-size 128 \
    --no-enable-prefix-caching \
    --async-scheduling \
    --additional-config '{"enable_cpu_binding":true}' \
    --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
