# Qwen3-Embedding 模型配置
# 类型: Embedding
# 最后更新: 2026-02-27

model:
  name: Qwen3-Embedding
  type: Embedding
  description: "Qwen3 文本嵌入模型"
  huggingface_path: Qwen/Qwen3-Embedding
  architecture: Qwen3ForCausalLM

deployment:
  recommended_tp: 1
  min_npu_count: 1
  recommended_memory: "16 GB"

performance:
  max_model_len: 8192
  max_num_seqs: 512
  max_num_batched_tokens: 8192
  block_size: 128
  gpu_memory_utilization: 0.9

environment_variables:
  TASK_QUEUE_ENABLE: "1"
  ASCEND_RT_VISIBLE_DEVICES: "0"

vllm_parameters:
  - "trust-remote-code"
  - "async-scheduling"
  - "distributed-executor-backend mp"

additional_config:
  enable_cpu_binding: true

compilation_config:
  cudagraph_mode: FULL_DECODE_ONLY

embedding_config:
  embedding_mode: true
  pooling_method: last

feature_support:
  chunked_prefill: "支持"
  automatic_prefix_cache: "支持"
  speculative_decoding: "不支持"
  lora: "不支持"

launch_command: |
  vllm serve /path/to/Qwen3-Embedding \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name Qwen3-Embedding \
    --trust-remote-code \
    --max-num-seqs 512 \
    --max-model-len 8192 \
    --max-num-batched-tokens 8192 \
    --tensor-parallel-size 1 \
    --gpu-memory-utilization 0.9 \
    --async-scheduling \
    --additional-config '{"enable_cpu_binding":true}' \
    --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
