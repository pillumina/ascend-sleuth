# Qwen3-235B-A22B 模型配置
# 类型: MoE
# 最后更新: 2026-02-27

model:
  name: Qwen3-235B-A22B
  type: MoE
  description: "Qwen3 235B MoE 模型, 22B 激活参数"
  huggingface_path: Qwen/Qwen3-235B-A22B
  architecture: Qwen3MoeForCausalLM

deployment:
  recommended_tp: 4
  min_npu_count: 4
  recommended_memory: "256 GB"

performance:
  max_model_len: 32768
  max_num_seqs: 128
  max_num_batched_tokens: 4096
  block_size: 128
  gpu_memory_utilization: 0.85

environment_variables:
  VLLM_USE_V1: "1"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  CPU_AFFINITY_CONF: "2"
  TASK_QUEUE_ENABLE: "1"
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "2048"
  HCCL_CONNECT_TIMEOUT: "1200"
  HCCL_EXEC_TIMEOUT: "1200"
  VLLM_ASCEND_ENABLE_MOE_OPTIMIZE: "1"

vllm_parameters:
  - "trust-remote-code"
  - "quantization ascend"
  - "async-scheduling"
  - "no-enable-prefix-caching"
  - "distributed-executor-backend mp"

additional_config:
  enable_cpu_binding: true

compilation_config:
  cudagraph_mode: FULL_DECODE_ONLY

moe_config:
  num_experts: 64
  num_experts_per_tok: 8
  expert_parallel_size: 4

feature_support:
  chunked_prefill: "支持"
  automatic_prefix_cache: "不支持"
  speculative_decoding: "不支持"
  lora: "不支持"
  expert_parallel: "支持"

quantization_support:
  ascend: "支持"
  gptq: "不支持"
  awq: "不支持"

launch_command: |
  vllm serve /path/to/Qwen3-235B-A22B \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name Qwen3-235B-A22B \
    --trust-remote-code \
    --max-num-seqs 128 \
    --max-model-len 32768 \
    --max-num-batched-tokens 4096 \
    --tensor-parallel-size 4 \
    --distributed-executor-backend mp \
    --quantization ascend \
    --gpu-memory-utilization 0.85 \
    --no-enable-prefix-caching \
    --async-scheduling \
    --additional-config '{"enable_cpu_binding":true}' \
    --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
