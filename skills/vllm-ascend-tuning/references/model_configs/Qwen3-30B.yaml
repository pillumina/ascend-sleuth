# Qwen3-30B 模型配置
# 类型: Dense
# 最后更新: 2026-02-27

model:
  name: Qwen3-30B
  type: Dense
  description: "Qwen3 30B Dense 模型, 需TP2部署"
  huggingface_path: Qwen/Qwen3-30B-A3B
  architecture: Qwen3ForCausalLM

deployment:
  recommended_tp: 2
  min_npu_count: 2
  recommended_memory: "64 GB"

performance:
  max_model_len: 32768
  max_num_seqs: 256
  max_num_batched_tokens: 4096
  block_size: 128
  gpu_memory_utilization: 0.9

environment_variables:
  VLLM_USE_V1: "1"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  CPU_AFFINITY_CONF: "2"
  TASK_QUEUE_ENABLE: "1"
  ASCEND_RT_VISIBLE_DEVICES: "0,1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "1024"
  HCCL_CONNECT_TIMEOUT: "600"
  HCCL_EXEC_TIMEOUT: "600"

vllm_parameters:
  - "trust-remote-code"
  - "quantization ascend"
  - "async-scheduling"
  - "no-enable-prefix-caching"
  - "no-enforce-eager"
  - "distributed-executor-backend mp"

additional_config:
  enable_cpu_binding: true

compilation_config:
  cudagraph_mode: FULL_DECODE_ONLY

feature_support:
  chunked_prefill: "支持"
  automatic_prefix_cache: "不支持"
  speculative_decoding: "不支持"
  lora: "不支持"

quantization_support:
  ascend: "支持 (W8A8, MXFP8)"
  gptq: "不支持"
  awq: "不支持"

launch_command: |
  vllm serve /path/to/Qwen3-30B \
    --host 0.0.0.0 \
    --port 8000 \
    --served-model-name Qwen3-30B-TP2 \
    --trust-remote-code \
    --max-num-seqs 256 \
    --max-model-len 32768 \
    --max-num-batched-tokens 4096 \
    --tensor-parallel-size 2 \
    --distributed-executor-backend mp \
    --quantization ascend \
    --gpu-memory-utilization 0.9 \
    --no-enable-prefix-caching \
    --async-scheduling \
    --no-enforce-eager \
    --additional-config '{"enable_cpu_binding":true}' \
    --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
