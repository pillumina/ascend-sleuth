# MiniMax-M2.5 模型配置
# 类型: MoE
# 最后更新: 2026-02-27

model:
  name: MiniMax-M2.5
  type: MoE
  description: "MiniMax-M2.5 MoE 模型, 支持投机解码 (Eagle3)"
  huggingface_path: MiniMaxAI/MiniMax-M2.5
  architecture: MiniMaxForCausalLM

deployment:
  recommended_tp: 8
  recommended_dp: 1
  recommended_pcp: 2
  min_npu_count: 8
  recommended_memory: "256 GB"
  quantization_format: W8A8C16

performance:
  max_model_len: 196608
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  gpu_memory_utilization: 0.85

environment_variables:
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "512"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  OMP_NUM_THREADS: "1"
  LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2"
  TASK_QUEUE_ENABLE: "1"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  VLLM_ASCEND_BALANCE_SCHEDULING: "1"
  VLLM_ASCEND_ENABLE_NZ: "1"

vllm_parameters:
  - "trust-remote-code"
  - "quantization ascend"
  - "no-enable-prefix-caching"
  - "async-scheduling"
  - "enable-expert-parallel"

speculative_decoding:
  enforce_eager: true
  method: eagle3
  model: /path/to/MiniMax-M2-Eagle3-1
  num_speculative_tokens: 1

compilation_config:
  cudagraph_mode: FULL_DECODE_ONLY

additional_config:
  enable_cpu_binding: true

launch_command: |
  vllm serve /path/to/MiniMax-M2.5-w8a8-QuaRot \
    --served-model-name "minimax" \
    --host 0.0.0.0 \
    --port 8004 \
    --tensor-parallel-size 8 \
    --data-parallel-size 1 \
    --decode-context-parallel-size 1 \
    --prefill-context-parallel-size 2 \
    --enable-expert-parallel \
    --no-enable-prefix-caching \
    --async-scheduling \
    --max-num-seqs 32 \
    --max-model-len 196608 \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.85 \
    --trust-remote-code \
    --quantization ascend \
    --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
    --additional-config '{"enable_cpu_binding":true}' \
    --speculative_config '{"enforce_eager": true, "method": "eagle3", "model": "/path/to/MiniMax-M2-Eagle3-1/", "num_speculative_tokens": 1}'
