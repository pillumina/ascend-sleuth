# case tag 词表（registry）—— 由 scripts/tag_hygiene.py 读取
#
# 为什么需要它：tag 归一与 R8 聚类原先把映射与类别写死在脚本里，新增一个同义词/
# 模型名就要改代码（2026-09-09 review 指出"写死了很多"）。本文件把**决策**从
# **逻辑**里分出来：脚本只做通用处理（解析/改写/聚类），词表在这里维护。
#
# ── 语言约定 ────────────────────────────────────────────────
# tag 是**词法检索键**（grep 目标），统一用英文小写 kebab-case。
# 语义层（title / summary / diagnosis / root_cause）用中文——按**层**分工，不是按偏好：
# 词法层混语言会让「中文 tag 搜不到英文查询」，与"同义 tag 分裂"是同一类失败
# （后者已在 2026-09-09 归一修复：startup 四种拼法互相看不见）。
# 当前词表 511 个 tag 中仅 1 个中文（`混部`），统一成本极低；两套并行词表则长期分裂。
#
# ── 自动识别的删除项（无需在此登记）────────────────────────
# 脚本自动删除「与 case 字段重复」的 tag：
#   - category 值（interrupt / precision / performance）——与 category 字段重复
#   - namespace 叶子名（vllm-ascend / verl / mindspeed-llm / sglang / common）——与目录重复
# 这两类随 KB 增长自动跟进，不用维护。

# ── 同义 / 变体 / 语言变体（alias → canonical）─────────────
synonyms:
  # 同义（同一现象多种拼法，实测零重叠——互相检索不到）
  startup: startup-failure
  startup-fail: startup-failure
  startup-crash: startup-failure
  pd-disaggregation: pd-separation
  pd-disagg: pd-separation
  speculative-decode: spec-decode
  # 拼写变体
  fusedmoe: fused-moe
  # 产品名变体
  dsv4: deepseek-v4
  # 语义变体（"升级解决"类问题的统一检索键）
  upgrade: version-upgrade
  # 语言变体（中文 → 英文）
  混部: mixed-parallelism
  hybrid: mixed-parallelism     # VLLM-ASC-7854 的 hybrid 亦指混合并行部署
  # 更名（消除歧义）：mixed-parallel 易被读成「PD 混部」，改为 mixed-parallelism——
  # 核心词是 parallelism，明确指"并行策略叠加"这一维度
  mixed-parallel: mixed-parallelism

# ── 「混部」的三种口径（2026-09-09 查证，防止后来者打错 tag）─────
# 官方文档（华为云 ModelArts）把推理部署分为并列三档：
#   ①单机部署（基础模式）—— P/D 串行在同一容器；
#   ②多机 PD 混部（多角色分离 - 混部）—— P/D 为独立单元，部署在**同一组计算节点**、共享 KV Cache；
#   ③多机 PD 分离（多角色分离 - 隔离）—— P/D 为独立单元，部署在**不同物理节点**、资源完全隔离。
#   出处：https://support.huaweicloud.com/inference-modelarts/inference2.0-modelarts-0038.html（PD 混部）
#         https://support.huaweicloud.com/inference-modelarts/inference2.0-modelarts-0086.html（PD 分离）
#   → 所以「混部 vs 分离」的关系取决于口径：把"PD 分离"当**物理隔离部署**时两者互斥（②vs③）；
#     把"PD 分离"当**多角色分离架构**时混部是其中一种（文档标题即"多角色分离 - 混部"）。
#
# 本词表的 `mixed-parallelism` 取**第三义：混合并行部署**（TP/DP/EP 等并行策略叠加），
# 命名刻意让核心词落在 parallelism 上，避免 mixed-* 被读成"PD 混部"；
# 依据是本库两条来源 case 的实际文本——VLLM-ASC-9418「双机混部（TP16+DP2+EP）」、
# VLLM-ASC-7854「混部部署（TP4×DP4+EP）」并附对照句「只改部署策略为 TP16DP1（无 EP 混部）」，
# 两者全文均**无 P/D 单元分离的表述**。因此：
#   - `mixed-parallelism` ≠ PD 混部（第②义）；
#   - 将来若出现真正的 PD 混部 case，应新增与 `pd-separation` 成对的 `pd-mixed`（本文件暂不登记，
#     无 case 支撑的 tag 不预先创建——避免空 tag 污染聚类信号）；
#   - 另有第④义「训练推理混部」（训推共卡/共集群），同样与 PD 无关，需要时另立 tag。

# ── tag 类别（R8 聚类输出用；未列出的默认 mechanism）────────
# 只有 mechanism 族值得提炼成 case-derived reference：
#   model       —— 同模型 ≠ 同根因，提炼出来是"该模型排障清单"
#   env-feature —— "用了什么"（精度格式/特性/平台），不是"哪里坏了"
kinds:
  model:
    - glm5
    - glm
    - qwen3.5
    - qwen3
    - qwen2.5
    - qwen3-embedding
    - qwen-image-edit
    - minimax
    - deepseek-v4
    - deepseek
    - kimi
    - llama
    - gemma
    - gemma2
    - mova
    - tora
  env-feature:
    - 310p
    - w8a8
    - w4a8
    - cudagraph
    - mtp
    - spec-decode
    - quantization
    - fp8

# ── 额外删除（自动识别之外的人工补充；当前为空）─────────────
drop: []

# ── 明确不合并（非近义，是不同 facet——防止后来者"顺手"合并）──
keep_separate:
  - [kv-transfer, kv-pool, hybrid-kv]      # 传输 / 池 / 混合压缩 KV：三条不同链路
  - [module-not-found, import-error]       # 具体错误 vs 错误类别
  - [quantization, modelslim, w8a8, w4a8]  # 量化总类 / 工具 / 精度格式
  - [mtp, spec-decode]                     # 具体特性 vs 方法类
  - [a2, a5, 910b]                         # 平台名（与 platforms 字段并存，保留 grep 便利）
