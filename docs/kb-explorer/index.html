e：Call the following APIs in order: %s and %s.","module":"DVPP Errors"}]}}},{"id":"driver-error-codes","type":"error-code","dir":"errors","file":"references/errors/driver.yaml","title":"Driver（驱动） 错误码（EL，15 条）","summary":"CANN 商用版 9.0.0《错误码参考》Driver（驱动）族 15 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"driver-error-codes","type":"error-code","title":"Driver（驱动） 错误码（EL，15 条）","summary":"CANN 商用版 9.0.0《错误码参考》Driver（驱动）族 15 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"EL0001","meaning":"Device_Absent/Abnormal：Device not found or invalid.","solution":"Check the error messages in the log.","module":"Driver Errors"},{"code":"EL0002","meaning":"Invalid_Device_ID：The device ID is invalid.","module":"Driver Errors"},{"code":"EL0003","meaning":"Invalid_Argument：The argument is invalid.","solution":"Try again with a valid argument.","module":"Driver Errors"},{"code":"EL0004","meaning":"Memory_Allocation_Failure：Failed to allocate memory requested by %s module.","solution":"Close applications not in use.","module":"Driver Errors"},{"code":"EL0005","meaning":"Resource_Busy：The resources are busy.","solution":"- Close applications not in use. - Wait for a while and try again.","module":"Driver Errors"},{"code":"EL0006","meaning":"Insufficient_Resources：The resources are insufficient.","solution":"Close applications not in use.","module":"Driver Errors"},{"code":"EL0007","meaning":"No_Permission：You have no permission.","solution":"- Close applications not in use. - Check that you have the required permission.","module":"Driver Errors"},{"code":"EL0008","meaning":"Insufficient_Event_Resources：The event resources are insufficient.","solution":"Close applications not in use.","module":"Driver Errors"},{"code":"EL0009","meaning":"Insufficient_Stream_Resources：The stream resources are insufficient.","solution":"Close applications not in use.","module":"Driver Errors"},{"code":"EL0010","meaning":"Insufficient_Notify_Resources：The Notify resources are insufficient.","solution":"Close applications not in use.","module":"Driver Errors"},{"code":"EL0011","meaning":"Insufficient_Model_Resources：The model resources are insufficient.","solution":"Close applications not in use.","module":"Driver Errors"},{"code":"EL0012","meaning":"Full_Service_Queue：The service queue is full.","solution":"Reduce service loads.","module":"Driver Errors"},{"code":"EL0013","meaning":"Insufficient_CDQM_Resources：The CDQM resources are insufficient.","solution":"Reduce service loads.","module":"Driver Errors"},{"code":"EL0014","meaning":"Operation_Unsupported：The operation is unsupported.","module":"Driver Errors"},{"code":"EL0015","meaning":"Invalid_Device_Access：The device access is invalid.","solution":"- Check your configurations. - Check whether there are residual container processes.","module":"Driver Errors"}]}}},{"id":"misc-error-codes","type":"error-code","dir":"errors","file":"references/errors/misc.yaml","title":"Dump / RLTune / 队列调度（极小族合并） 错误码（EP/ED/EM，9 条）","summary":"CANN 商用版 9.0.0《错误码参考》Dump / RLTune / 队列调度（极小族合并）族 9 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"misc-error-codes","type":"error-code","title":"Dump / RLTune / 队列调度（极小族合并） 错误码（EP/ED/EM，9 条）","summary":"CANN 商用版 9.0.0《错误码参考》Dump / RLTune / 队列调度（极小族合并）族 9 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"ED0000","meaning":"Communication_Error：Failed to obtain the basic information about the remote device.","solution":"Check that the device is operating normally.","module":"RLTune Errors"},{"code":"ED0001","meaning":"Invalid_Argument：Value %s for parameter --soc_version is invalid. Reason: The SoC version does not match device %s.","module":"RLTune Errors"},{"code":"ED0002","meaning":"Config_Error_Invalid_Environment_Variable：The environment variable argument is invalid. Value %s for environment variable %s must be less than %s.","module":"RLTune Errors"},{"code":"EM9001","meaning":"Inner_Error_Group_Attach_Failed：Failed to attach the queue_schedule process to the shared memory group.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"Queue Schedule Errors"},{"code":"EM9002","meaning":"Inner_Error_Queue_Scheduler_Init_Failed：Failed to initialize the queue_schedule process.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"Queue Schedule Errors"},{"code":"EP0001","meaning":"Config_Error：The content of configuration item %s in configuration file %s is invalid. Reason: %s.","module":"DUMP Errors"},{"code":"EP0002","meaning":"Config_Error：Value %s for configuration item %s in configuration file %s is invalid. Expected value: %s.","module":"DUMP Errors"},{"code":"EP0003","meaning":"Config_Error：Value %s for configuration item %s in configuration file %s is invalid. Reason: %s.","module":"DUMP Errors"},{"code":"EP0004","meaning":"File_Operation_Error_Parse：Failed to parse file %s. Reason: %s.","module":"DUMP Errors"}]}}},{"id":"fe-error-codes","type":"error-code","dir":"errors","file":"references/errors/fe.yaml","title":"FE（前向引擎） 错误码（E2，9 条）","summary":"CANN 商用版 9.0.0《错误码参考》FE（前向引擎）族 9 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"fe-error-codes","type":"error-code","title":"FE（前向引擎） 错误码（E2，9 条）","summary":"CANN 商用版 9.0.0《错误码参考》FE（前向引擎）族 9 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"E20001","meaning":"Compilation_Error：Operator %s compilation failed.Optype is %s.","solution":"For a custom operator, check the operator implementation and arguments based on the error log. For a Huawei built-in operator, obtain the host log and contact technical support at https://www.hiascend.com/support.","module":"FE Errors"},{"code":"E20002","meaning":"Config_Error_Invalid_Environment_Variable：Value %s for environment variable %s is invalid. Reason: %s.","solution":"Reset the environment variable by referring to the Environment Variable Reference.","module":"FE Errors"},{"code":"E20003","meaning":"Config_Error：Configuration item %s in configuration file %s is invalid. Reason: %s.","solution":"Modify the configuration file by referring to the specifications in the user guide.","module":"FE Errors"},{"code":"E20007","meaning":"Compilation_Error_Execute_Fusion_Pass：Graph fusion pass %s failed. The pass type is %s.","solution":"- If the pass code is custom, check the implementation logic of the pass. - If the pass code is not custom, obtain the host log and contact technical support at https://www.hiascend.com/support.","module":"FE Errors"},{"code":"E20101","meaning":"Invalid_Argument：Value %s for parameter %s is invalid. Reason: %s.","solution":"Please adjust the parameter according to the documentation or contact Huawei technical support.","module":"FE Errors"},{"code":"E20103","meaning":"Invalid_Argument：Value %s for parameter %s is invalid. The value must be in the range of (0, %s].","solution":"NA","module":"FE Errors"},{"code":"E21001","meaning":"File_Operation_Error_Open：Failed to open file %s. Reason: %s.","solution":"- Configure the file path correctly. - Configure the file permissions correctly. - Reinstall the package.","module":"FE Errors"},{"code":"E21002","meaning":"File_Operation_Error_Parse：Failed to parse file %s. Reason: %s.","solution":"Configure the file path correctly.","module":"FE Errors"},{"code":"E22001","meaning":"Compilation_Error：Compilation result for operator %s not found. Optype is %s.","solution":"Check the process cause of the segmentation fault.","module":"FE Errors"}]}}},{"id":"ge-error-codes","type":"error-code","dir":"errors","file":"references/errors/ge.yaml","title":"GE（Graph Engine 图引擎） 错误码（E1，120 条）","summary":"CANN 商用版 9.0.0《错误码参考》GE（Graph Engine 图引擎）族 120 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"ge-error-codes","type":"error-code","title":"GE（Graph Engine 图引擎） 错误码（E1，120 条）","summary":"CANN 商用版 9.0.0《错误码参考》GE（Graph Engine 图引擎）族 120 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"E10001","meaning":"Invalid_Argument：Value %s for parameter %s is invalid. Reason: %s","module":"GE Errors"},{"code":"E10002","meaning":"Invalid_Argument_Tensor_Input_Shape：Value %s for parameter --input_shape is invalid. Reason: %s. The value must be formatted as %s.","solution":"The valid format is input_name1:n1,c1,h1,w1;input_name2:n2,c2,h2,w2. Replace input_name with node names. Ensure that the shape values are integers.","module":"GE Errors"},{"code":"E10003","meaning":"Invalid_Argument：Value %s for parameter --%s is invalid. Reason: %s","module":"GE Errors"},{"code":"E10004","meaning":"Invalid_Argument：Value for --%s is empty.","solution":"Set a valid parameter value.","module":"GE Errors"},{"code":"E10005","meaning":"Invalid_Argument：Value %s for parameter --%s is invalid. The value must be either true or false.","solution":"Set a valid parameter value. The parameter value can only be true or false.","module":"GE Errors"},{"code":"E10006","meaning":"Invalid_Argument：Value %s for parameter --%s is invalid. The value must be either 1 or 0.","solution":"Set a valid parameter value. The parameter value can only be 1 or 0.","module":"GE Errors"},{"code":"E10007","meaning":"Invalid_Argument：--%s is required. The value must be %s.","solution":"Set a valid parameter value.","module":"GE Errors"},{"code":"E10008","meaning":"Invalid_Argument：--weight must not be empty when --framework is set to 0 (Caffe).","solution":"- If the source model framework is Caffe, try again with a valid --weight argument. - If the source model framework is not Caffe, try again with a valid --framework argument.","module":"GE Errors"},{"code":"E10009","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：--dynamic_batch_size, --dynamic_image_size, --input_shape_range, and --dynamic_dims are mutually exclusive.","solution":"- In dynamic shape scenarios, include only one of these options in your command line. - In static shape scenarios, remove these options from your command line.","module":"GE Errors"},{"code":"E10010","meaning":"Invalid_Argument：Value %s for parameter --log is invalid.","solution":"Select the value from debug, info, warning, error, and null.","module":"GE Errors"},{"code":"E10011","meaning":"Invalid_Argument_Tensor_Input_Shape：Value %s for parameter --input_shape is invalid. Shape values must be positive integers. The error value in the shape is %s.","solution":"- In static shape scenarios, set the shape values in --input_shape to positive integers. - In dynamic shape scenarios, add the related dynamic-input option in your command line, such as --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims.","module":"GE Errors"},{"code":"E10012","meaning":"Invalid_Argument_Tensor_Input_Shape：--dynamic_batch_size is included, but the dimension count of the dynamic-shape input configured in --input_shape is less than 1.","solution":"- In static shape scenarios, remove the --dynamic_batch_size option from your command line. - In dynamic shape scenarios, set the corresponding axis of the dynamic-shape input in --input_shape to -1.","module":"GE Errors"},{"code":"E10013","meaning":"Invalid_Argument：Value %s for --%s is out of range.","solution":"Run the \"atc -h\" command to view the usage. For details, see ATC Instructions.","module":"GE Errors"},{"code":"E10014","meaning":"Invalid_Argument：Value %s for parameter --%s is invalid.","solution":"Run the \"atc -h\" command to view the usage. For details, see ATC Instructions.","module":"GE Errors"},{"code":"E10016","meaning":"Invalid_Argument_Operator_Name：Opname %s specified in --%s is not found in the model. Confirm whether this node name exists, or the node is not split with the specified delimiter ';'.","solution":"Specify the name of an existing node in the graph.","module":"GE Errors"},{"code":"E10017","meaning":"Invalid_Argument：Input Op %s specified in --%s is invalid. The Op type must be Data.","module":"GE Errors"},{"code":"E10018","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：Value %s for shape %s is invalid. When --dynamic_batch_size is included, only batch size N can be -1 in --input_shape.","solution":"Try again with a valid --input_shape argument. Make sure that non-batch size axes are not -1.","module":"GE Errors"},{"code":"E10019","meaning":"Invalid_Argument_Tensor_Input_Shape：When --dynamic_image_size is included, only the height and width axes can be -1 in --input_shape.","solution":"Try again with a valid --input_shape argument. Make sure that axes other than height and width are not -1.","module":"GE Errors"},{"code":"E10020","meaning":"Invalid_Argument：Value %s for parameter --dynamic_image_size is invalid.","solution":"The value must be formatted as \"imagesize1_height,imagesize1_width;imagesize2_height,imagesize2_width\". Make sure that each profile has two dimensions.","module":"GE Errors"},{"code":"E10021","meaning":"Invalid_Argument：Path for parameter --%s is too long. Keep the length within %s.","solution":"The path name exceeds the maximum length. Specify a valid path name.","module":"GE Errors"},{"code":"E10022","meaning":"Invalid_Argument：Path %s for parameter --%s does not include the file name.","solution":"Add the file name to the path.","module":"GE Errors"},{"code":"E10023","meaning":"Invalid_Argument：Value %s for parameter --singleop is invalid.","solution":"Check whether the input file exists.","module":"GE Errors"},{"code":"E10024","meaning":"Invalid_Argument：Failed to open file %s specified by --singleop.","solution":"Check the owner group and permission settings and ensure that the user who runs the ATC command has enough permission to open the file.","module":"GE Errors"},{"code":"E10025","meaning":"Invalid_Argument：File %s specified by --singleop is not a valid JSON file. Reason: %s.","solution":"Check that the file is in valid JSON format.","module":"GE Errors"},{"code":"E10026","meaning":"Invalid_Argument：The Op name is empty in the file specified by --singleop.","solution":"Check that the Op name is not empty in the file.","module":"GE Errors"},{"code":"E10027","meaning":"Invalid_Argument：Attribute %s of %s tensor %s for Op %s is invalid when --singleop is specified.","solution":"Try again with a valid tensor dtype and format.","module":"GE Errors"},{"code":"E10029","meaning":"Invalid_Argument：Attribute name of Op %s is empty in the file specified by --singleop.","solution":"Check that the Op attribute name is not empty in the file.","module":"GE Errors"},{"code":"E10030","meaning":"Invalid_Argument：There is an invalid value for attribute name %s of Op %s in the file specified by --singleop.","solution":"Check that the Op attribute value is valid in the file.","module":"GE Errors"},{"code":"E10031","meaning":"Invalid_Argument_Tensor_Input_Shape：--dynamic_batch_size is included, but none of the nodes specified in --input_shape has a batch size equaling -1.","solution":"- In static shape scenarios, remove the --dynamic_batch_size option from your command line. - In dynamic shape scenarios, set the corresponding axis of the dynamic-shape input in --input_shape to -1.","module":"GE Errors"},{"code":"E10032","meaning":"File_Operation_Error_Parse：Parse json file %s failed. Reason: %s.","solution":"Check whether the json file is valid.","module":"GE Errors"},{"code":"E10034","meaning":"Invalid_Argument：Nodes (for example, %s) connected to AIPP must not be of type fp16.","solution":"- To enable AIPP, remove the nodes connected to AIPP from the --input_fp16_nodes argument. - If AIPP is not required, remove the --insert_op_conf option from your ATC command line.","module":"GE Errors"},{"code":"E10035","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：--dynamic_batch_size, --dynamic_image_size, or --dynamic_dims has %s profiles, which is less than the minimum %s.","solution":"Ensure that the number of profiles configured in --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims is at least the minimum.","module":"GE Errors"},{"code":"E10036","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：--dynamic_batch_size, --dynamic_image_size, or --dynamic_dims has %s profiles, which is greater than the maximum %s.","solution":"Ensure that the number of profiles configured in --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims is at most the maximum.","module":"GE Errors"},{"code":"E10037","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：The profiles configured in --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims have inconsistent dimension counts. A profile has %s dimensions while another has %s dimensions.","solution":"Ensure that the profiles configured in --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims have the same dimension count.","module":"GE Errors"},{"code":"E10038","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：Dimension size %s is invalid. The value must be greater than 0.","solution":"Set the shape values of each profile to positive in --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims.","module":"GE Errors"},{"code":"E10039","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：The --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims argument have duplicate profiles.","solution":"Check that the profiles configured in --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims are unique.","module":"GE Errors"},{"code":"E10040","meaning":"Invalid_Argument_Tensor_Input_Shape：As the --dynamic_batch_size, --dynamic_image_size, or --dynamic_dims argument is included, the corresponding nodes specified in --input_shape must have -1 axes and cannot have '~'.","solution":"- In static shape scenarios, remove the --dynamic_batch_size, --dynamic_image_size or --dynamic_dims option from your command line. - In dynamic multi-batch scenarios, set the corresponding axis of the dynamic-shape input in --input_shape to -1. - In dynamic shape scenarios, remove the --dynamic_batch_size, --dynamic_image_size or --dynamic_dims option from your command line and set --input_shape to -1 or n1~n2.","module":"GE Errors"},{"code":"E10041","meaning":"Invalid_Argument_Model：Failed to load the model from %s.","solution":"- Check that the model file is valid. - Check that the weight file or path is valid when the model is more than 2 GB. - Check that the --framework argument matches the actual framework of the model file.","module":"GE Errors"},{"code":"E10045","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：The number of -1 axes in the --input_shape argument exceeds the dimension count per profile in --dynamic_dims.","solution":"Ensure that the number of -1 axes in the --input_shape argument matches the dimension count per profile in --dynamic_dims.","module":"GE Errors"},{"code":"E10046","meaning":"Invalid_Argument_Tensor_Dynamic_Shape：The total number of -1 axes in the --input_shape argument is greater than the dimension count per profile in --dynamic_dims.","solution":"Ensure that the total number of -1 axes in the --input_shape argument is less than the dimension count per profile in --dynamic_dims.","module":"GE Errors"},{"code":"E10047","meaning":"Invalid_Argument：--%s and --%s are mutually exclusive.","solution":"Remove either of them and try again.","module":"GE Errors"},{"code":"E10048","meaning":"Invalid_Argument：Value %s for parameter --input_shape_range or dynamic_inputs_shape_range is invalid. Reason: %s. The value must be formatted as %s.","solution":"Try again with a valid argument.","module":"GE Errors"},{"code":"E10049","meaning":"Invalid_Argument_Tensor_Input_Shape：Dimension count %s configured in --input_shape does not match dimension count %s of the node.","solution":"Set the dimension count in --input_shape according to the dimension count of the node.","module":"GE Errors"},{"code":"E10050","meaning":"Invalid_Argument_Tensor_Input_Shape_Range：Current dimension size %s is not in the range of %s–%s specified by --input_shape.","solution":"Set the dimension size according to --input_shape.","module":"GE Errors"},{"code":"E10051","meaning":"Invalid_Argument：Value %s for parameter --job_id exceeds the allowed maximum %s.","solution":"Try again with a valid argument.","module":"GE Errors"},{"code":"E10052","meaning":"Invalid_Argument：AIPP configuration is invalid. Reason: %s.","module":"GE Errors"},{"code":"E10054","meaning":"Invalid_Argument：The required parameter %s for ATC is empty. Another possible reason is that the values of some parameters are not enclosed by quotation marks (\\\"\\\").","solution":"Check whether the command line parameter format is correct.","module":"GE Errors"},{"code":"E10055","meaning":"Not_Supported：The operation is not supported. Reason: %s.","solution":"Check whether the configured parameter or used function is supported.","module":"GE Errors"},{"code":"E10056","meaning":"Invalid_Argument：Cannot configure both parameters %s and %s simultaneously.","solution":"The two parameters cannot be set at the same time. View the parameter descriptions by referring to the documentation.","module":"GE Errors"},{"code":"E10057","meaning":"Invalid_Argument：--%s and --%s can only be used together","solution":"If the value of --mode is 6, it only needs to be used with --om. Please check and try again.","module":"GE Errors"},{"code":"E10058","meaning":"Invalid_Argument：Parameter %s is not configured or is empty.","module":"GE Errors"},{"code":"E10059","meaning":"Invalid_Argument：%s failed. Reason: %s.","module":"GE Errors"},{"code":"E10060","meaning":"Invalid_Argument：Parameter is invalid. Reason: %s.","module":"GE Errors"},{"code":"E10061","meaning":"Invalid_Argument：Value %s for parameter %s is invalid. Expected value: %s.","module":"GE Errors"},{"code":"E10401","meaning":"Invalid_Argument_Operator_Input_Count：The number of operator inputs %s exceeds the allowed maximum %s.","solution":"Try again with a valid number of inputs.","module":"GE Errors"},{"code":"E10402","meaning":"Invalid_Argument_Operator_Input_Buffer：Input indexed %s requires a %s buffer, but %s aligned buffer is allocated.","solution":"Check whether the data type, dimensions, and shape are correctly set. For details, see the aclGetTensorDescSize API description in API Reference.","module":"GE Errors"},{"code":"E10403","meaning":"Invalid_Argument_Operator_Output_Count：The number of operator outputs %s exceeds the allowed maximum %s.","solution":"Check whether the number of elements in numoutputs is correctly set. The aclopCompile, aclopExecuteV2, and aclopCompileAndExecute APIs may be involved. For details, see API Reference.","module":"GE Errors"},{"code":"E10404","meaning":"Invalid_Argument_Operator_Output_Buffer：Output indexed %s requires a %s buffer, but %s aligned buffer is allocated.","solution":"Check whether the data type, dimensions, and shape are correctly set. For details, see the aclGetTensorDescSize API description in API Reference.","module":"GE Errors"},{"code":"E10405","meaning":"Invalid_Argument：The number of input buffers is %s, which does not match the number of input tensors %s.","solution":"Check whether the number of elements in inputDesc and inputs of the operator is correctly set. The aclopExecuteV2 and aclopCompileAndExecute APIs may be involved. For details, see API Reference.","module":"GE Errors"},{"code":"E10406","meaning":"Invalid_Argument：The number of output buffers is %s, which does not match the number of output tensors %s.","solution":"Check whether the number of elements in outputDesc and outputs of the operator is correctly set. The aclopExecuteV2 and aclopCompileAndExecute APIs may be involved. For details, see API Reference.","module":"GE Errors"},{"code":"E10410","meaning":"File_Operation_Error_File_Not_Exist：File %s does not exist.","solution":"Try again with a valid file directory.","module":"GE Errors"},{"code":"E10501","meaning":"Not_Supported_Operator：IR for Op %s with optype %s is not registered.","solution":"- Check whether ASCEND_OPP_PATH is correctly set. - Check whether the operator prototype has been registered. For details, see the operator developer guide.","module":"GE Errors"},{"code":"E11001","meaning":"Invalid_Argument_Caffe_Model_Data：input_dim and input_shape are mutually exclusive in NetParameter for Caffe model conversion.","solution":"Remove either --input_dim or --input_shape from your atc command line.","module":"GE Errors"},{"code":"E11003","meaning":"Invalid_Argument_Caffe_Model_Data：The number of input_dim fields in the model is %s, which is not 4x the input count %s.","solution":"Modify your Caffe model and try again.","module":"GE Errors"},{"code":"E11004","meaning":"Invalid_Argument_Caffe_Model_Data：The number of input shapes is %s, which does not match the number of inputs %s.","solution":"Modify your Caffe model and try again.","module":"GE Errors"},{"code":"E11005","meaning":"Invalid_Argument_Tensor_Input_Shape：The shape is not defined by using --input_shape for input %s.","solution":"Modify your Caffe model, or add the input shape to the --input_shape argument in your atc command line.","module":"GE Errors"},{"code":"E11008","meaning":"Invalid_Argument_Caffe_Model_Data：Optype DetectionOutput is unsupported.","solution":"Modify your Caffe model and replace DetectionOutput operators with FSRDetectionOutput or SSDDetectionOutput.","module":"GE Errors"},{"code":"E11009","meaning":"Not_Supported_Operator：No Caffe parser is registered for Op %s with optype %s.","solution":"Check whether the Caffe plugin of the operator has been registered.","module":"GE Errors"},{"code":"E11012","meaning":"Invalid_Argument_Caffe_Model_Data：Unknown bottom blob %s at layer %s. The bottom blob is indexed %s.","solution":"Modify your Caffe model and try again.","module":"GE Errors"},{"code":"E11014","meaning":"Invalid_Argument_Caffe_Model_Data：Failed to find the top blob for layer %s.","solution":"Modify your Caffe model and try again.","module":"GE Errors"},{"code":"E11015","meaning":"Invalid_Argument_Caffe_Model_Data：Failed to find the bottom blob for layer %s.","solution":"Modify your Caffe model and try again.","module":"GE Errors"},{"code":"E11016","meaning":"Invalid_Argument：Failed to add Op %s to NetOutput. Op output index %s is not less than %s. NetOutput input_index %s is not less than %s.","solution":"Try again with a valid --out_nodes argument.","module":"GE Errors"},{"code":"E11017","meaning":"Invalid_Argument：Failed to find node %s specified by --out_nodes.","solution":"Try again with a valid --out_nodes argument.","module":"GE Errors"},{"code":"E11018","meaning":"Invalid_Argument_Caffe_Model_Data：Op name %s contains invalid characters.","solution":"Allowed characters include: letters, digits, hyphens (-), periods (.), underscores (_), and slashes (/). Modify the Op name and try again.","module":"GE Errors"},{"code":"E11021","meaning":"Invalid_Argument_Caffe_Model_Data：Model file %s contains \"layers\" structures, which have been deprecated in Caffe and unsupported by ATC.","solution":"Replace layers with layer.","module":"GE Errors"},{"code":"E11022","meaning":"Invalid_Argument_Caffe_Model_Data：Invalid prototxt file.","solution":"Invalid Caffe model. Modify the Caffe model and add the layer field.","module":"GE Errors"},{"code":"E11023","meaning":"Invalid_Argument_Caffe_Model_Data：Weight file contains \"layers\" structures, which have been deprecated in Caffe and unsupported by ATC.\"","solution":"Replace layers with layer.","module":"GE Errors"},{"code":"E11024","meaning":"Invalid_Argument_Caffe_Model_Data：Invalid Caffe weight file.","solution":"Invalid Caffe weight file. Modify the Caffe weight file and add the layer field.","module":"GE Errors"},{"code":"E11027","meaning":"Invalid_Argument_Caffe_Model_Data：Op %s with optype %s in the Caffe model has an input node with shape size 0.","solution":"Invalid Caffe model. Modify the input shape of the node.","module":"GE Errors"},{"code":"E11029","meaning":"Invalid_Argument_Caffe_Model_Data：Op %s exists in model file but not found in weight file.","solution":"Try again with a valid Caffe model or weight file. Ensure that the two files match with each other.","module":"GE Errors"},{"code":"E11032","meaning":"Invalid_Argument_Caffe_Model_Data：Failed to parse message %s. The error field is %s. Reason: %s.","solution":"Check whether the Caffe model supports the field.","module":"GE Errors"},{"code":"E11033","meaning":"Invalid_Argument_Caffe_Model_Weight：Failed to convert the weight file. Blob %s of size %s is invalid. Reason: %s.","solution":"Try again with a valid Caffe model or weight file. Ensure that the two files match with each other.","module":"GE Errors"},{"code":"E11035","meaning":"Invalid_Argument_Caffe_Model_Data：The top size of data node %s is not 1 but %s.","solution":"Invalid Caffe model. Change the number of outputs for the data node to 1.","module":"GE Errors"},{"code":"E11036","meaning":"Invalid_Argument_Caffe_Model_Data：Data nodes have duplicate top blobs %s.","solution":"Invalid Caffe model. Make sure the data node has a unique output name.","module":"GE Errors"},{"code":"E11037","meaning":"Invalid_Argument_Caffe_Model_Data：Op %s has zero outputs.","solution":"Nodes in the Caffe model must have at least one output.","module":"GE Errors"},{"code":"E12004","meaning":"Invalid_Argument_Operator_Input_Index：Failed to register the prototype of Op %s. If input index is less than 0, then input index –%s (absolute value) must be less than the input count %s","solution":"When the Const input is converted to an attribute, check whether the input index is correctly set.","module":"GE Errors"},{"code":"E12009","meaning":"Invalid_Argument_TensorFlow_Model_Data：Input %s for Op %s is not found in graph_def.","solution":"Try again with a valid TensorFlow model.","module":"GE Errors"},{"code":"E12013","meaning":"Invalid_Argument_TensorFlow_Model_Data：Failed to find a subgraph by the name %s.","solution":"- To use function subgraphs to convert a TensorFlow model, place the subgraph .proto description file in the same directory as the model file and name it graph_def_library.pbtxt. - Run the func2graph.py script in the ATC installation directory to save the subgraphs to graph_def_library.pbtxt.","module":"GE Errors"},{"code":"E12029","meaning":"Invalid_Argument_TensorFlow_Model_Data：Failed to find the subgraph library.","solution":"- To use function subgraphs to convert a TensorFlow model, place the subgraph .proto description file in the same directory as the model file and name it graph_def_library.pbtxt. - Run the func2graph.py script in the ATC installation directory to save the subgraphs to graph_def_library.pbtxt.","module":"GE Errors"},{"code":"E13000","meaning":"File_Operation_Error_Invalid_Path：Path %s is empty. Reason: %s.","solution":"Try again with a valid directory.","module":"GE Errors"},{"code":"E13001","meaning":"File_Operation_Error_Open：Failed to open file %s. Reason: %s.","solution":"Fix the error according to the error message.","module":"GE Errors"},{"code":"E13002","meaning":"Directory_Operation_Error_Name_Too_Long：Directory %s is too long. Keep the length within %s characters.","solution":"Try again with a valid file directory.","module":"GE Errors"},{"code":"E13003","meaning":"File_Operation_Error_Read：Failed to read file %s. Reason: %s.","solution":"Fix the error according to the error message.","module":"GE Errors"},{"code":"E13004","meaning":"File_Operation_Error_Write：Failed to write file %s. Reason: %s.","solution":"NA","module":"GE Errors"},{"code":"E13005","meaning":"File_Operation_Error_Parse：Failed to parse file %s.","solution":"Check that a matched Protobuf version is installed and try again with a valid file. For details, see section \"--framework\" in ATC Instructions.","module":"GE Errors"},{"code":"E13006","meaning":"File_Operation_Error_Parse：Type %s of file %s is incorrect. Expected type: %s.","solution":"NA","module":"GE Errors"},{"code":"E13009","meaning":"Invalid_Argument_Operator_Name：Operator %s already exists in the graph. Ensure that operator names are unique.","solution":"Ensure that the operators in the graph have unique names.","module":"GE Errors"},{"code":"E13010","meaning":"Not_Supported_Operator：No operator plugin is registered for Op: %s, optype: %s.","solution":"- If the operator is a custom operator, register related deliverables. - If the operator is a built-in operator, install the package that supports this operator version.","module":"GE Errors"},{"code":"E13014","meaning":"Invalid_Argument：Value %s of parameter %s for Op %s is invalid. Reason: %s.","solution":"NA","module":"GE Errors"},{"code":"E13015","meaning":"File_Operation_Error_Invalid_File_Size：File %s has a size of %s, which is out of valid range (0, %s].","solution":"NA","module":"GE Errors"},{"code":"E13018","meaning":"File_Operation_Error_Parse：Failed to parse file %s through google::protobuf::TextFormat::Parse.","solution":"Check whether the Protobuf file is valid.","module":"GE Errors"},{"code":"E13023","meaning":"Invalid_Argument_OM_Model_Size：Model %s has a size of %s bytes, which exceeds system limit of %s bytes.","solution":"Reduce the model size.","module":"GE Errors"},{"code":"E13024","meaning":"Config_Error_Invalid_Environment_Variable：Value %s for environment variable %s is invalid. Reason: %s.","solution":"Reset the environment variable by referring to the setup guide.","module":"GE Errors"},{"code":"E13025","meaning":"Invalid_Argument：Input tensor is invalid. Reason: %s.","solution":"NA","module":"GE Errors"},{"code":"E13026","meaning":"File_Operation_Error_Invalid_Path：Input path %s is invalid. Reason: %s","solution":"NA","module":"GE Errors"},{"code":"E13027","meaning":"Invalid_Argument_Network_Connection：Failed to connect to the peer address %s.","solution":"Check ipaddr, port or token in the configuration file, ensure that the configuration is correct.","module":"GE Errors"},{"code":"E13028","meaning":"Compilation_Error_Execute_Custom_Fusion_Pass：Failed to run custom fusion pass %s. Return code: %s. Reason: %s.","solution":"Check the error log for details and verify whether the fusion logic is correct.","module":"GE Errors"},{"code":"E13029","meaning":"Compilation_Error_Load_Custom_Fusion_Pass：Failed to load custom fusion pass lib %s. Reason: %s.","solution":"Analyze the failure reason mentioned above. Below are some typical solutions for common dlopen failures: - Verify that the library path is correct and the file exists. - Ensure the library and its dependencies have the correct permissions. - Check that all dependencies are available using the 'ldd' command.","module":"GE Errors"},{"code":"E13030","meaning":"Initialization_Error_Register_Custom_Fusion_Pass：Failed to get custom fusion pass func %s. Reason: %s.","solution":"Check that custom pass registration is valid.","module":"GE Errors"},{"code":"E13031","meaning":"Invalid_Argument：Output tensor is invalid. Reason: %s.","solution":"NA","module":"GE Errors"},{"code":"E14001","meaning":"Invalid_Argument_Operator_Compilation_Parameter：Argument %s for Op %s with optype %s is invalid. Reason: %s.","solution":"Check whether the type, input, and output of the operator match the configured parameters.","module":"GE Errors"},{"code":"E14002","meaning":"Invalid_Argument_Tensor_Attribute：In the current process, the attribute of %s must be obtained successfully. Reason: %s.","solution":"The attribute in the error message must be set for the operator.","module":"GE Errors"},{"code":"E16001","meaning":"Invalid_Argument_ONNX_Model_Data：The model has no %s node.","solution":"Check whether the ONNX model contains the input node.","module":"GE Errors"},{"code":"E16002","meaning":"Invalid_Argument_ONNX_Model_Data：No ONNX parser is registered for optype %s.","solution":"Check the version of the installation package and reinstall the package. For details, see the installation reference.","module":"GE Errors"},{"code":"E16004","meaning":"Invalid_Argument_ONNX_Model_Data：ONNX model has no graph.","solution":"Invalid ONNX model. Modify the ONNX model and add the graph information.","module":"GE Errors"},{"code":"E16005","meaning":"Invalid_Argument_ONNX_Model_Data：The model has %s --domain_version fields, but only one is allowed.","solution":"Invalid ONNX model. Modify the ONNX model. If no domain is specified on the operator node, only one domain can be specified on the model.","module":"GE Errors"},{"code":"E19999","meaning":"Inner_Error：Unknown error occurred. Please check the log.","solution":"In this scenario, collect the logs generated when the fault occurs and locate the fault based on the logs.","module":"GE Errors"},{"code":"W11001","meaning":"Performance_Not_Optimal_Operator：Op %s does not hit the high-priority operator information library, which might result in compromised performance.","solution":"Submit an issue to request for support at https://gitcode.com/cann.","module":"GE Errors"},{"code":"W11002","meaning":"Config_Error_Weight_Configuration：In the compression weight configuration file %s, some nodes do not exist in graph: %s.","solution":"Check whether the weight file matches the model file.","module":"GE Errors"},{"code":"W11003","meaning":"Config_Error_Operator_Missing_Implementation：Operator %s lacks required %s implementation.","solution":"Ensure all operator required implementations(e.g., tiling) are provided. See acl API Reference for details.","module":"GE Errors"}]}}},{"id":"hccl-error-codes","type":"error-code","dir":"errors","file":"references/errors/hccl.yaml","title":"HCCL（集合通信） 错误码（EI，20 条）","summary":"CANN 商用版 9.0.0《错误码参考》HCCL（集合通信）族 20 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"hccl-error-codes","type":"error-code","title":"HCCL（集合通信） 错误码（EI，20 条）","summary":"CANN 商用版 9.0.0《错误码参考》HCCL（集合通信）族 20 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"EI0001","meaning":"Config_Error_Invalid_Environment_Variable：Value %s for environment variable [%s] is invalid. Expected value: %s.","module":"HCCL Errors"},{"code":"EI0002","meaning":"Communication_Error_Timeout：An timeout occurs when the Notify register waits for execution. Waiting peer end: %s; task information: %s; communication operator information: %s; communicator: %s.","solution":"1. If this error is reported on part of these ranks, check other ranks to see whether other errors have been reported earlier. 2. If this error is reported for all ranks, check whether the error reporting time is consistent (the maximum difference must not exceed 1800s). If not, locate the cause or set the HCCL_EXEC_TIMEOUT environment variable to a larger value. 3. Ensure that the number of training samples of each NPU is consistent. 4. Check whether the completion queue element (CQE) of the error exists in the plog(grep -rn 'error cqe'). If so, check the network connection status. For details about the troubleshooting method, search for the keyword \\\"EI0002\\\" on https://www.hiascend.com/en/document/.","module":"HCCL Errors"},{"code":"EI0003","meaning":"Invalid_Argument_Collective_Communication_Operator：Failed to verify parameters of operator %s (operator name). Value %s for parameter %s is invalid. The expected value is %s.","module":"HCCL Errors"},{"code":"EI0004","meaning":"File_Operation_Error_Parse：Failed to parse the ranktable file %s. Reason: %s","module":"HCCL Errors"},{"code":"EI0005","meaning":"Invalid_Argument：The arguments for collective communication are inconsistent between ranks, ccl_op %s, group %s, parameter %s, local end %s, remote end %s.","module":"HCCL Errors"},{"code":"EI0006","meaning":"Communication_Error_Get_Socket：Getting socket times out. Reason: %s","module":"HCCL Errors"},{"code":"EI0007","meaning":"Resource_Error：Failed to allocate resource %s with info %s. Reason: Resources are exhausted.","module":"HCCL Errors"},{"code":"EI0008","meaning":"Package_Error_Incorrect_HCCL_Version：The HCCL versions are inconsistent. The local version is %s, while the remote version is %s.","solution":"Install the same HCCL version.","module":"HCCL Errors"},{"code":"EI0009","meaning":"Communication_Error_Initialize_Transport：Device %s transport init error. Reason: %s.","solution":"Use the following hccn_tool commands to check whether the port link is down. (The scope of i represents the number of NPUs of each node. 8 is used as an example.) 1. for i in {0..7}; do hccn_tool -i $i -optical -g; done | grep present: Check whether the optical module is in position. 2. for i in {0..7}; do hccn_tool -i $i -ip -g; done. Check whether the IP address is configured. 3. for i in {0..7}; do hccn_tool -i $i -lldp -g: Check whether the switch is connected.","module":"HCCL Errors"},{"code":"EI0010","meaning":"Communication_Error_P2P：P2P communication failed. Reason: %s","solution":"Ensure that the NPU card is normal and entering environment variables 'export HCCL_INTRA_ROCE_ENABLE=1'.","module":"HCCL Errors"},{"code":"EI0011","meaning":"Resource_Error_Insufficient_Device_Memory：Failed to allocate [%s] bytes of NPU memory.","solution":"Stop unnecessary processes and ensure the required memory is available.","module":"HCCL Errors"},{"code":"EI0012","meaning":"Execution_Error_SDMA：SDMA memory copy task exception occurred. Remote rank: [%s]. Base information: [%s]. Task information: [%s]. Communicator information: [%s].","solution":"1. Check whether the network link is abnormal during the execution. 2. Check whether a process in the cluster exits before an error is reported. If yes, locate the cause of the process exit. 3. Check whether the size of the input/output memory passed to the communication operator meets the expectation, and whether the input/output memory or communicator is freed or destroyed before the operator execution is complete.","module":"HCCL Errors"},{"code":"EI0013","meaning":"Execution_Error_ROCE_CQE：An error CQE occurred during operator execution. Local information: server %s, device ID %s, device IP %s. Peer information: server %s, device ID %s, device IP %s.","solution":"1. Check whether the network devices between the two ends are abnormal. 2. Check whether the peer process exits first. If yes, check the cause of the process exit.","module":"HCCL Errors"},{"code":"EI0014","meaning":"Config_Error_Ranktable：Value %s for ranktable variable %s is invalid. Expected value: %s.","solution":"Try again with a valid cluster configuration in the ranktable file. Ensure that the configuration matches the operating environment.","module":"HCCL Errors"},{"code":"EI0015","meaning":"Communication_Error_Ranktable_Detect：Failed to collect cluster information of the communicator based on rootInfo detection. Reason: %s.","solution":"1. Check whether all ranks in the communicator have delivered the communicator creation interface. 2. Check the connectivity between the host networks of all nodes and the server node. 3. Check whether the HCCL_SOCKET_IFNAME environment variable of all nodes is correctly configured. 4. Increase the timeout by configuring the HCCL_CONNECT_TIMEOUT environment variable.","module":"HCCL Errors"},{"code":"EI0016","meaning":"Config_Error：Value %s for config %s is invalid. Expected value: %s.","module":"HCCL Errors"},{"code":"EI0017","meaning":"Config_Error_Ranktable：Config %s is missing in the ranktable file.","module":"HCCL Errors"},{"code":"EI0018","meaning":"Execution_Error_UB_CQE：An error CQE occurred during operator execution. Local information: server %s, device ID %s, device IP %s. Peer information: server %s, device ID %s, device IP %s.","solution":"1. Check whether the network devices between the two ends are abnormal. Generally, packet loss occurs due to intermittent disconnection of the port. If the ping test fails, check whether the port is linkdown or the network configuration is incorrect. 2. Check whether the peer process exits first. If yes, check the reason why the process exit. 3.Use the RAS fault check mechanism to check whether the hardware of the HBM or UB chip processing module of either device is abnormal.If the hardware is abnormal, contact Huawei technical support.","module":"HCCL Errors"},{"code":"EI0019","meaning":"Communication_Error_Bind_IP_Port：Failed to enable listening for the host network adapter socket. Reason: %s","solution":"1. Check whether this port has been occupied by another process. If yes, you can make adjustment using the environment variable HCCL_IF_BASE_PORT and use sysctl -w net.ipv4.ip_local_reserved_ports=****-**** to adjust the scope of reserved ports. 2. Check whether the service process is started multiple times on a device during this service.","module":"HCCL Errors"},{"code":"EI0020","meaning":"Communication_Error_Bind_IP_Port：Failed to enable listening for the host network adapter socket. Reason: %s","solution":"Check whether the single-card multi-process scenario is used. If yes, configure the port number using the environment variable HCCL_NPU_SOCKET_PORT_RANGE.","module":"HCCL Errors"}]}}},{"id":"lxfusion-error-codes","type":"error-code","dir":"errors","file":"references/errors/lxfusion.yaml","title":"LxFusion&AutoDeploy 错误码（EF，6 条）","summary":"CANN 商用版 9.0.0《错误码参考》LxFusion&AutoDeploy族 6 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"lxfusion-error-codes"," he ErrMessage.","module":"TBE Pass Compiler Errors"},{"code":"EB1000","meaning":"Compilation_Error_Invalid_Primitives：Primitives check failed. Reason: %s","solution":"Check the schedule and compute statements to ensure that the schedule is correct.","module":"TBE Pass Compiler Errors"},{"code":"EB3000","meaning":"Compilation_Error：Memory allocation check failed. Reason: %s","solution":"Check whether the size of the specified memory is incorrectly calculated.","module":"TBE Pass Compiler Errors"},{"code":"EB4000","meaning":"Compilation_Error_Invalid_Emit_Insn：Insn check failed. Reason: %s","solution":"Check whether the offset address of the instruction map is aligned and whether the correct instruction is selected.","module":"TBE Pass Compiler Errors"},{"code":"EB9000","meaning":"Compilation_Error：Compiler Error check failed. Reason: %s","module":"TBE Pass Compiler Errors"}]}}},{"id":"tefusion-error-codes","type":"error-code","dir":"errors","file":"references/errors/tefusion.yaml","title":"TEFusion（融合算子） 错误码（E4，11 条）","summary":"CANN 商用版 9.0.0《错误码参考》TEFusion（融合算子）族 11 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"tefusion-error-codes","type":"error-code","title":"TEFusion（融合算子） 错误码（E4，11 条）","summary":"CANN 商用版 9.0.0《错误码参考》TEFusion（融合算子）族 11 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"E40001","meaning":"Config_Error_Invalid_Environment_Variable：Value %s for environment variable %s is .","solution":"NA","module":"TEFusion Errors"},{"code":"W40011","meaning":"Directory_Operation_Error_Create_Failed：Failed to create disk cache directory %s. Result: %s. Reason: %s.","solution":"Modify the permission or directory name and try again.","module":"TEFusion Errors"},{"code":"W40012","meaning":"Invalid_Argument：Value %s for parameter %s is invalid. The value must be in the range of %s and defaults to %s.","solution":"Modify the parameter according to the effective value range.","module":"TEFusion Errors"}]}}},{"id":"operator-error-codes","type":"error-code","dir":"errors","file":"references/errors/operator.yaml","title":"算子公共错误码与算子 API（EZ） 错误码（EZ，16 条）","summary":"CANN 商用版 9.0.0《错误码参考》算子公共错误码与算子 API（EZ）族 16 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"operator-error-codes","type":"error-code","title":"算子公共错误码与算子 API（EZ） 错误码（EZ，16 条）","summary":"CANN 商用版 9.0.0《错误码参考》算子公共错误码与算子 API（EZ）族 16 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"E76002","meaning":"ONNX_Model_Data_Error：No ONNX parser is registered for optype [%s].","solution":"Submit an issue to request for support at https://gitee.com/ascend, or remove this type of operators from your model.","module":"Vector Operator Plugin Errors"},{"code":"E80001","meaning":"Invalid_Config_Value：The %s information is missing in the %s configuration file of OPP package","solution":"Try to reinstall the OPP package.","module":"Vector Operator Errors"},{"code":"EZ0001","meaning":"Invalid_Input_Shape：OP[%s] %sth input has incorrect shape[: %s], it should be[: %s].","solution":"- Check whether the input shape is correct. - Dump GE Graph, find error node in graph and check the shape. 如何获取GE Graph以及GE Graph的详细介绍，请参见《ATC离线模型编译工具》中的“参考 > dump图详细信息”章节。 父主题： Public Operator Errors","module":"Public Operator Errors"},{"code":"EZ0002","meaning":"Invalid_Attr：OP[%s] attr[: %s], has incorrect value[: %s], it should be[: %s].","solution":"Check the value of the attribute in this api.","module":"Public Operator Errors"},{"code":"EZ0003","meaning":"Invalid_Attr_Size：OP[%s] attr[: %s], has incorrect size[: %s], it should be[: %s].","solution":"Check the size of the attribute in this api.","module":"Public Operator Errors"},{"code":"EZ0004","meaning":"Invalid_Input：OP[%s] get [%s] failed.","solution":"- Check the input information of the operator. - Dump GE Graph and check the input in graph. 如何获取GE Graph以及GE Graph的详细介绍，请参见《ATC离线模型编译工具》中的“参考 > dump图详细信息”章节。 父主题： Public Operator Errors","module":"Public Operator Errors"},{"code":"EZ0005","meaning":"Invalid_Input_ShapeSize：OP[%s] %sth input has incorrect shape size[: %s], it should be[: %s].","solution":"- Check input dimensions. - Dump GE Graph, find error node in graph and check input dimension. 如何获取GE Graph以及GE Graph的详细介绍，请参见《ATC离线模型编译工具》中的“参考 > dump图详细信息”章节。 父主题： Public Operator Errors","module":"Public Operator Errors"},{"code":"EZ0006","meaning":"Invalid_Input_Format：OP[%s] %s has incorrect format[: %s], it should be %s.","solution":"- Check input format. - Dump GE Graph, find error node in graph and check input format. 如何获取GE Graph以及GE Graph的详细介绍，请参见《ATC离线模型编译工具》中的“参考 > dump图详细信息”章节。 父主题： Public Operator Errors","module":"Public Operator Errors"},{"code":"EZ0007","meaning":"Invalid_Input_Dtype：OP[%s] %s has incorrect dtype[: %s], it should be %s.","solution":"- Check input dtype. - Dump GE Graph, find error node in graph and check input dtype. 如何获取GE Graph以及GE Graph的详细介绍，请参见《ATC离线模型编译工具》中的“参考 > dump图详细信息”章节。 父主题： Public Operator Errors","module":"Public Operator Errors"},{"code":"EZ0501","meaning":"Unsupported_Operator：IR for Op [%s, optype [%s]], is not registered.","solution":"Submit an issue to request for support at https://gitee.com/ascend, or remove this type of operators from your model.","module":"Public Operator Errors"},{"code":"EZ1001","meaning":"AclNN_Parameter_Error：Parameter validation failed. Please check the log.","solution":"Check whether the aclnn input param is correct.","module":"AclNN Errors"},{"code":"EZ3002","meaning":"Unsupported_Operator：Optype [%s] of Ops kernel [%s] is unsupported. Reason: %s.","solution":"Submit an issue to request for support at https://gitee.com/ascend, or remove this type of operators from your model.","module":"Public Operator Errors"},{"code":"EZ3003","meaning":"Unsupported_Operator：No supported Ops kernel and engine are found for [%s], optype [%s].","solution":"- Check that the OPP component is installed properly. - Submit an issue to request for the support of this operator type.","module":"Public Operator Errors"},{"code":"EZ9010","meaning":"Unsupported_Operator：No parser is registered for Op [%s, optype [%s]].","solution":"Submit an issue to request for support at https://www.hiascend.com/support.","module":"Public Operator Errors"},{"code":"EZ9903","meaning":"AclNN_Runtime_Error：The error information is not fixed. Check the error information according to the specific prompt.","solution":"In this scenario, collect the plog when the fault occurs and locate the fault based on the plog.","module":"AclNN Errors"},{"code":"EZ9999","meaning":"AclNN_Inner_Error：The error information is not fixed. Check the error information according to the specific prompt.","solution":"- Check whether the CANN package is correct. - Check whether the environment variable is correct.","module":"AclNN Errors"}]}}},{"id":"aicore-error-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/aicore-error.yaml","title":"AI Core Error 典型问题案例（12 条）","summary":"AI Core Error 典型案例：HBM 比特 ECC / icache 校验 / AI Core 硬件故障 / 索引越界 / 系统环境硬件 / 单算子运行报错 / atomic 溢出 / 地址异常 / args 不一致 / Dump 失败 / args 错误 / AI Core 超时","doc":{"id":"aicore-error-fault-patterns","type":"fault-pattern","title":"AI Core Error 典型问题案例（12 条）","summary":"AI Core Error 典型案例：HBM 比特 ECC / icache 校验 / AI Core 硬件故障 / 索引越界 / 系统环境硬件 / 单算子运行报错 / atomic 溢出 / 地址异常 / args 不一致 / Dump 失败 / args 错误 / AI Core 超时","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0009.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0009-0019/0500）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-aicore-error-triage","ascend-msaicerr"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"HBM 比特 ECC 故障","symptoms":["event_id=0x80E01809","event_id=0x80E01801","Hardware Error","memory error","multi-bit ECC"],"cause":"HBM 内存颗粒多 bit ECC 错误（黑匣子 Hardware Error section_type: memory error, error_type: multi-bit ECC）导致 AI Core Error","fix":"查《健康管理故障定义》对应版本手册（HBM 内存颗粒巡检多 bit ECC 错误处理）"},{"pattern":"icache 数据校验故障","symptoms":["event_id=0x80C98000","stars_print_error_pc_icache_and_hbm_info","check_error_pc_icache_and_hbm_info","compare_fail_num"],"cause":"icache 数据与 GM 校验不一致（icache 数据跳变或 GM 数据被改写）——compare_fail_num 值不等于 0 即 icache 内存跳变硬件故障","fix":"查《健康管理故障定义》AICORE 指令数据校验失败（0x80C98000）：AI 任务退出重执行或重新发起推理；异常则复位 SOC，持续故障返厂送修"},{"pattern":"AI Core 硬件故障","symptoms":["A 2-bit ECC error occurs in the data-cache data-ram","EMERGENCY_WARN","ascend-dmi"],"cause":"ascend-dmi 压测 AI Core 异常提示 EMERGENCY_WARN——AI Core 硬件故障","fix":"ascend-dmi --dg -i aicore 压测确认，联系技术支持更换硬件"},{"pattern":"索引类算子索引越界","symptoms":["error code = 0x800000","GatherV2","Scatter","GatherElements","index","indices"],"cause":"索引类算子（GatherV2=index_select、Scatter=scatter_update、GatherElements=gather）因性能原因自身无法做索引越界检查，索引越界时报 0x800000","fix":"用 python 打印 input 的 shape、dim、index 值确认索引越界，查 index 来源修正"},{"pattern":"系统环境/硬件问题（msaicerr 标杆算子失败）","symptoms":["Failed to execute the built-in sample operator. Check the environment.","Root cause conclusion"],"cause":"msaicerr 分析时标杆算子（GM↔UB 搬运+vector+cube 最小流程）运行失败——系统环境/硬件功能异常，一般为网络中第一个算子报 AI Core error","fix":"用 MindCluster ToolBox 检查系统环境/硬件；无法排除则用 asys 收集故障信息 + msaicerr 分析结果提交 issue（gitee.com/ascend）"},{"pattern":"单算子运行报错或 pass 异常","symptoms":["Failed to execute the single-operator test case. The operator logic may be incorrect."],"cause":"算子自身逻辑错误（读写未分配地址）、编译器错误（逻辑正确但编译成错误汇编）、输入数据错误（错误索引导致非法访问）、tilingdata 数据计算/选择问题","fix":"单算子复现定位——执行 msaicerr.py 同级目录生成的 test_single_op.py 复现 AI Core error，结合 info.txt 的 Basic information / AICERROR code / 报错 cce 行号定位"},{"pattern":"atomic add 精度溢出","symptoms":["Atomic add has a precision overflow","error code = 0x800000","Vm fault failed"],"cause":"算子运算中极端数据遇 atomic 累加指令，累加溢出报 0x800000；slog 无 Vm fault failed 关键字则确定是 atomic 溢出（非内存越界）；Atlas A2 系列硬件优化不会出现","fix":"精度调优（推理参考应用开发精度/性能优化；训练按 TensorFlow/PyTorch 精度调优指南）"},{"pattern":"算子输入输出数据地址异常","symptoms":["The input/output memory address of the operator is abnormal","input[1] is out of range","cannot find alloc log"],"cause":"input/output 地址不在 Device 内存申请-释放差集范围内（地址非法），框架或应用分配错误","fix":"查框架或应用的内存分配逻辑"},{"pattern":"算子输入 args 下发前后不一致","symptoms":["If the arguments are inconsistent before and after operator execution","args before execute","args after execute"],"cause":"args（kernel 入参：输入/输出/workspace/tiling_gm 地址）下发前后不一致，args 错误导致 AI Core error","fix":"打开算子踩内存检测开关，用 asys 复跑业务收集故障信息提交 issue（gitee.com/ascend）"},{"pattern":"Dump 数据失败","symptoms":["Failed to get dump data of error op","The input/output memory address of the operator is abnormal"],"cause":"AI Core Error 后框架尝试 dump 输入/输出数据失败——算子的输入/输出地址本身有错误，AI Core 无法读取该地址","fix":"查看 info.txt 输入/输出地址；推理首算子则查用户推理脚本是否分配足够地址空间，非首算子联系技术支持分析错误地址来源"},{"pattern":"算子输入 args 错误","symptoms":["args(0 to 9) after execute","Aicore kernel execute failed","fault kernel_name"],"cause":"args after execute 地址不合理（Atlas 训练系列非 0x1240 开头的地址是 Host 内存地址而非 Device 地址），如 cpu_tensor/npu_tensor 混用导致 AI Core 读取错误","fix":"排查训练脚本，将 cpu_tensor/npu_tensor 都改为 Device 内存地址（Atlas A2 系列相反：非 0x1240 开头正常、0x1240 开头异常）"},{"pattern":"AI Core 超时故障","symptoms":["timeout or trap error","event_id=0x80C98001","event_id=0x80CB8001","a timeout error occurred"],"cause":"AI Core 超时（ascend-dmi 压测报 a timeout error occurred）","fix":"下电重启后重新用 ascend-dmi 压测（ascend-dmi --dg -i aicore -s -q），仍 timeout 则判断硬件故障联系技术支持更换硬件"}]}}},{"id":"audio-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/audio.yaml","title":"Audio 处理声音问题（4 条）","summary":"播音故障：无法正常播音（0xa0168009 ao ko 未插入）/ 属性设置无效（0xa0168003 参数越界）/ 音调语速不对（pcm 格式与参数不一致）/ 音量调节失效（超 0-127 或误用接口）；适用 Atlas 200I/500 A2 推理产品 EP/RC","doc":{"id":"audio-fault-patterns","type":"fault-pattern","title":"Audio 处理声音问题（4 条）","summary":"播音故障：无法正常播音（0xa0168009 ao ko 未插入）/ 属性设置无效（0xa0168003 参数越界）/ 音调语速不对（pcm 格式与参数不一致）/ 音量调节失效（超 0-127 或误用接口）；适用 Atlas 200I/500 A2 推理产品 EP/RC","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0210.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0210-0213）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 200I/500 A2"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"无法正常播音","symptoms":["hi_mpi_ao_set_pub_attr(2) failed","0xa0168009"],"cause":"没有插入播音相关的 ko","fix":"lsmod 检查 ko，insmod /var/davinci/driver/drv_ao.ko 后重跑播音命令"},{"pattern":"播音属性设置无效","symptoms":["hi_mpi_ao_set_pub_attr failed","0xa0168003","0xa016800c"],"cause":"播音涉及的参数设置有误（位宽、采样率、声道数等超出取值范围）","fix":"检查 Audio 接口各输入参数是否在有效范围内并修正，重跑播音命令"},{"pattern":"播音音调、语速不对","symptoms":["播放速度变快/变慢","音调变高/变低","pcm"],"cause":"播音参数设置与 pcm 音频文件格式不一致——pcm 是 raw 数据不带文件头，无法从数据判断声道/位宽/采样率；如单声道文件按双声道读取，播放速度为正常两倍、音调变高","fix":"按 pcm 文件实际格式（声道、位宽、采样率）设置播音参数"},{"pattern":"音量调节失效","symptoms":["HI_ACODEC_SET_ADCL_VOLUME failed"],"cause":"音量调节超出范围（音量参数 0-127），或播音误用录音音量调节接口（反之亦然）","fix":"检查音量调节范围配置正确；播音用 DAC 相关接口、录音用 ADC 相关接口"}]}}},{"id":"camera-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/camera.yaml","title":"Camera 处理图片问题（4 条）","summary":"Camera 出图故障：找不到设备（0xa01c8040 isp ko 未插入）/ 不出图（sensor I2C 错误）/ 一直丢帧（pipe depth 不足）/ 出图花图（pixel format 不匹配）；适用 Atlas 200I/500 A2 推理产品 EP/RC","doc":{"id":"camera-fault-patterns","type":"fault-pattern","title":"Camera 处理图片问题（4 条）","summary":"Camera 出图故障：找不到设备（0xa01c8040 isp ko 未插入）/ 不出图（sensor I2C 错误）/ 一直丢帧（pipe depth 不足）/ 出图花图（pixel format 不匹配）；适用 Atlas 200I/500 A2 推理产品 EP/RC","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0205.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0205-0208）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 200I/500 A2"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"Camera 找不到设备","symptoms":["open ISP device error","0xa01c8040"],"cause":"没有插入 isp ko","fix":"lsmod 检查 ko 插入情况，insmod /var/davinci/driver/drv_isp.ko 后重跑 Camera 业务"},{"pattern":"Camera 不出图","symptoms":["I2C WRITER DATA error","imx477_sensor_ctl"],"cause":"sensor 没有安装好，或 sensor 型号与预期设置不匹配","fix":"插拔 sensor 或检查相应配置，仍无法解决则替换新 sensor 设备"},{"pattern":"Camera 一直丢帧，无图片 dump 出来","symptoms":["get buffer fail","hi_size"],"cause":"申请的 pipe depth 小于等于 dump raw depth，导致无多余 buffer 送给后端 chn","fix":"调整 depth 使 pipe depth + chn attr depth - dump attr depth 大于零后重启 Camera"},{"pattern":"Camera 出图效果不对（花图）","symptoms":["dump 图片花图"],"cause":"pixel format 和看图工具不一致，或分辨率大小不一致","fix":"检查 pixel format（如 YUV420 选对应 420 格式）与分辨率，设置后重启 Camera"}]}}},{"id":"dvpp-decode-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/dvpp-decode.yaml","title":"DVPP JPEGD 解码 / VDEC 视频解码问题（23 条）","summary":"JPEGD/VDEC 解码故障：内存申请/释放时序、花屏（坏帧/提前释放）、丢帧丢包（缺帧）、解码失败（码流格式/annex-B/0x31/类型不一致/多帧一帧）、回调不触发/无结果、卡死/OOM/卡住、通道创建失败（虚拟化模板/上限）、性能问题","doc":{"id":"dvpp-decode-fault-patterns","type":"fault-pattern","title":"DVPP JPEGD 解码 / VDEC 视频解码问题（23 条）","summary":"JPEGD/VDEC 解码故障：内存申请/释放时序、花屏（坏帧/提前释放）、丢帧丢包（缺帧）、解码失败（码流格式/annex-B/0x31/类型不一致/多帧一帧）、回调不触发/无结果、卡死/OOM/卡住、通道创建失败（虚拟化模板/上限）、性能问题","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0172.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0172-0194）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"调用错误的内存申请接口，导致内存地址校验出错","symptoms":["内存地址校验出错"],"cause":"未使用指定的 DVPP 内存申请接口（V1 acldvppMalloc / V2 hi_mpi_dvpp_malloc），或接口传入的 buffer size 小于实际申请的内存大小","fix":"检查代码，使用 acldvppMalloc（V1）或 hi_mpi_dvpp_malloc（V2）申请 JPEGD/VDEC 输入输出内存，核对 buffer size"},{"pattern":"内存被提前释放，导致解码数据花屏","symptoms":["解码数据花屏"],"cause":"输出内存被别人复用/被踩或提前释放；或解码需要的输出内存比实际申请的大（如 VDEC 输出预期 RGB 仍按 YUV420sp 申请）","fix":"在 DVPP 内存申请/释放接口与 hi_mpi_vdec_get_frame/aclvdecCallback/acldvppJpegDecodeAsync 处打印内存大小与地址，检查申请大小与使用是否一致、内存是否解码完成前提前释放"},{"pattern":"JPEGD 图像解码进程超时退出","symptoms":["解码进程超时退出"],"cause":"多路并发解码 JPEG 且每路含带旋转信息的大分辨率图片（3840*2160 及以上）时解码时间过长导致用户进程超时退出","fix":"用 JPEG 码流分析工具（如 JPEGsnoop）解析确认 Orientation 信息（1 表示不旋转）；带旋转的大图先调用第三方库（如 OpenCV）解码"},{"pattern":"JPEGD 图片解码失败","symptoms":["JPEGD 解码失败"],"cause":"JPEGD 只支持 huffman 编码（colorspace: yuv, subsample 444/422/420/400），不支持算术编码/渐进编码/jpeg2000 格式；或图像数据不完整","fix":"超规格图像格式用第三方软件解码；检查图像数据完整性"},{"pattern":"VDEC 视频解码丢帧、丢包","symptoms":["丢帧","丢包"],"cause":"H264/H265 码流缺少 IDR 帧/I 帧/P 帧/B 帧","fix":"检查码流关键帧完整性，补充缺失帧类型"},{"pattern":"VDEC 视频解码花屏","symptoms":["解码花屏"],"cause":"输入的码流中某些帧数据不完整、存在坏帧，硬件解码产生花屏","fix":"用第三方工具（如 eseye u）解码源码流确认是否花屏；正常则用 fwrite 保存送 VDEC 的码流检查是否传输中被破坏；用对应版本 sample 解码验证码流/VDEC 格式，sample 正常则优化自身代码逻辑"},{"pattern":"VDEC 视频解码性能问题","symptoms":["解码卡顿","性能下降"],"cause":"视频解码回调函数中耗时过长；输入码流 I 帧比例过大（解码 I 帧耗时比 P 帧长）；输入码流存在异常帧","fix":"优化回调函数耗时，控制 I 帧比例，排查异常帧"},{"pattern":"输入码流不符合要求导致 VDEC 视频解码失败","symptoms":["VDEC 解码失败（码流规格）"],"cause":"输入码流规格不符合软硬件约束（码流类型、宽高等）","fix":"按 VDEC 功能约束文档，用第三方工具（如 eseye u）检查码流类型/宽高，不满足则替换码流"},{"pattern":"VDEC 视频帧解码失败不触发回调函数","symptoms":["解码失败不触发回调"],"cause":"码流中某些帧是坏帧，语法解析不出帧含义或解码失败，不调用回调函数","fix":"查是否有 VDEC 丢帧/丢包日志（有则异常帧解码失败）；调整 DVPP 或全局日志为 info，对比回调打印次数与输入帧数"},{"pattern":"VDEC 视频解码异常导致进程卡死，无法退出","symptoms":["进程卡死，无法退出"],"cause":"Device 内存不足，AI CPU 无法处理 VDEC 解码任务导致任务超时","fix":"按 VDEC 内存消耗计算公式预估 Device 内存并合理规划；增加异常处理机制（aclrtSetExceptionInfoCallback 设异常回调，获取 Device/Stream/Task ID 判断异常强制退出进程）"},{"pattern":"retCode 返回值设置错误，导致 VDEC 视频解码异常","symptoms":["acldvppGetPicDescRetCode 返回非 0"],"cause":"前一帧码流解码失败 retCode 被置 2，复用 output 图片描述信息时 retCode 继承失败状态，后续帧一直判断解码失败","fix":"复用 output 图片描述信息前先调用 acldvppSetPicDescRetCode 设置为 0"},{"pattern":"VDEC 视频解码无报错，但无解码结果数据、CPU 占用率高","symptoms":["无解码结果","CPU 占用率高","aclrtProcessReport failed, ret = 107012"],"cause":"aclvdecSendFrame 调用正常但未触发回调——未调用 aclvdecSetChannelDescThreadId 绑定用户线程，导致无法触发 aclrtProcessReport 进而触发回调（107012=线程未订阅或重复订阅）","fix":"创建独立线程调用 aclrtProcessReport；调用 aclvdecSetChannelDescThreadId 绑定用户线程；在线程内配置超时等待触发回调获取解码结果"},{"pattern":"复用输出图片描述类型，VDEC 解码报错提示有不支持的图片格式","symptoms":["不支持的图片格式"],"cause":"复用 acldvppPicDesc 时未重设 format/width/height/widthStride/heightStride——前一帧解码失败后参数变默认值 0，format=0 表示 YUV400，VDEC 不支持该格式解码输出","fix":"复用 acldvppPicDesc 时在下一次解码前重新设置 format、width、height、widthStride、heightStride"},{"pattern":"异常码流导致 VDEC 视频解码失败","symptoms":["frame_flag = 1 解码失败"],"cause":"输入码流存在异常，或网络不稳定播包丢帧导致码流异常","fix":"调用 hi_mpi_vdec_send_stream 成功后写文件保存输入码流（EP 形态先 aclrtMemcpy HOST_TO_DEVICE），用第三方工具检查码流是否异常（花屏/报错）"},{"pattern":"非 annex-B 格式的码流导致 VDEC 视频解码失败","symptoms":["VDEC 解码失败（码流格式）"],"cause":"VDEC 只支持 annex-B 格式裸码流，不支持其它格式（如 AVCC）","fix":"用第三方工具以 16 进制查看码流，确认固定以 0x00000001 起始的 annex-B 格式"},{"pattern":"不支持的协议字段 0x31 导致 JPEGD 图片解码结果异常","symptoms":["协议字段 0x31","解码结果异常"],"cause":"JPEGD 不支持的协议字段 0x31，硬解软解都失败，无输出解码数据（内存中数据都是默认值 0）","fix":"用第三方工具检查码流标记，存在 0x31 则更换图片重新解码"},{"pattern":"码流大小校验失败导致 VDEC 视频解码失败","symptoms":["stream len can't be zero!"],"cause":"stream->len 为 0，被 VDEC 代码参数校验拦截","fix":"检查代码中 stream->len 参数赋值逻辑"},{"pattern":"实际码流类型与接口中设置的解码器类型不一致导致 VDEC 解码失败","symptoms":["VDEC 解码失败（类型不一致）"],"cause":"创建 VDEC 通道时设置的解码协议类型（HI_PT_H264/HI_PT_H265）与实际码流类型不一致","fix":"检查 hi_mpi_vdec_create_chn 入参 attr->type 与码流实际类型是否一致"},{"pattern":"多帧码流当一帧送入解码导致 VDEC 视频解码异常","symptoms":["除第一帧外其余帧被丢弃","多帧当一帧"],"cause":"VDEC 仅支持按帧发送模式，一次送入多帧数据时只解第一帧其余丢弃","fix":"检查 hi_mpi_vdec_send_stream 的 stream->addr 是否一次读入多帧，调整代码逐帧送入"},{"pattern":"送帧太快，VDEC 视频解码发生 OOM","symptoms":["VDEC OOM"],"cause":"每送一帧申请一个输出 buffer，送帧间隔太短远超解码帧率时申请大量 buffer 占用大量内存导致 OOM","fix":"按 VDEC 性能指标数据调整送帧间隔"},{"pattern":"解码器帧存大小以及参考帧个数设置过小，VDEC 视频解码卡住","symptoms":["VDEC 解码卡住"],"cause":"创建通道时设置的帧存大小*帧存个数小于解码器实际需要的帧存大小*帧存个数","fix":"调整 hi_mpi_vdec_create_chn 的 attr->frame_buf_size、attr->frame_buf_cnt，或直接设为 0 由解码器内部自适应"},{"pattern":"昇腾虚拟化实例场景使用不含 DVPP 的算力模板时，创建 VDEC 通道失败","symptoms":["最大通道数为 0","创建 VDEC 通道失败"],"cause":"算力模板不含 DVPP（该算力下无 DVPP 能力），属于正常报错","fix":"查算力模板 DVPP 资源（EP 用 msnpureport -a 导出看 module_info\\dev-os-0\\dvpp\\dvpp_proc.log，RC 用 cat /proc/umap/sys）；需 DVPP 能力则使用含 DVPP 的算力模板（如 vir04_4c_dvpp，vir04_3c_ndvpp 无 DVPP）"},{"pattern":"昇腾虚拟化实例场景下 VDEC 通道数量达到上限，无法创建通道","symptoms":["VDEC 通道数量达到上限"],"cause":"不同算力模板有不同总通道数上限，超过上限无法继续创建","fix":"查所用算力模板 VDEC 资源；解码通道总数上限=(JPEGD + VDEC) / (16 + 12) * 256（如 vir01 模板上限 27）"}]}}},{"id":"dvpp-encode-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/dvpp-encode.yaml","title":"DVPP JPEGE 图片编码 / VENC 视频编码问题（8 条）","summary":"JPEGE/VENC 编码故障：内存申请接口错误/大小传值错误/提前释放花屏/创建通道失败（通道 ID 越界）/送帧失败（参数非法/格式不支持）/buf_size 不合理/编码无输出（看门狗）/码流亮暗与原始 YUV 不一致（full_range）","doc":{"id":"dvpp-encode-fault-patterns","type":"fault-pattern","title":"DVPP JPEGE 图片编码 / VENC 视频编码问题（8 条）","summary":"JPEGE/VENC 编码故障：内存申请接口错误/大小传值错误/提前释放花屏/创建通道失败（通道 ID 越界）/送帧失败（参数非法/格式不支持）/buf_size 不合理/编码无输出（看门狗）/码流亮暗与原始 YUV 不一致（full_range）","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0196.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0196-0203）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"调用错误的内存申请接口，导致内存地址校验出错","symptoms":["内存地址校验出错"],"cause":"未使用指定的 DVPP 内存申请接口","fix":"使用 acldvppMalloc（V1）或 hi_mpi_dvpp_malloc（V2）申请 JPEGE/VENC 输入输出内存"},{"pattern":"使用正确的内存申请接口，但内存大小传值错误","symptoms":["结束地址校验出错"],"cause":"传入的 buffer size 太大，超出实际申请的 buffer 范围","fix":"dvpp 内存申请接口增加地址及长度日志，检查 hi_mpi_venc_send_frame/hi_mpi_venc_send_jpege_frame/aclvencSendFrame/acldvppJpegEncodeAsync 传入 buffer 长度是否一致"},{"pattern":"内存被提前释放，导致 VENC 编码数据花屏","symptoms":["VENC 编码数据花屏"],"cause":"VENC 输入内存（YUV 图片数据）被踩或被提前释放","fix":"在 DVPP 内存释放接口与 hi_mpi_venc_get_stream/aclvencCallback/acldvppJpegEncodeAsync 处打印内存大小与地址，确认输入内存在编码完成前是否被提前释放"},{"pattern":"VENC 创建通道失败","symptoms":["hi_mpi_venc_create_chn 失败"],"cause":"用户传入的通道 ID 超出合法范围（VENC 通道 ID 在 [0,255] 共 256 个）","fix":"确定 hi_mpi_venc_create_chn 失败返回的错误码，检查通道 ID 在合法范围内"},{"pattern":"VENC 送入待编码图像帧失败","symptoms":["0xa0088003","0xa0088008","H.265 don't support format"],"cause":"用户传入的图像帧参数不在合理范围内或设置了暂不支持的参数（如 YUV 格式不正确：H.265 只支持 NV12/NV21）；入参结构体未 memset 初始化导致参数为随机值","fix":"进一步查看内核日志定位具体参数（如 YUV 格式）；入参结构体先 memset 初始化再设置参数"},{"pattern":"buf_size 参数设置不合理导致视频编码异常","symptoms":["视频编码异常（buf_size）"],"cause":"创建编码通道时 buf_size 参数设置不合理","fix":"按 hi_venc_attr 结构体 buf_size 成员说明合理设置"},{"pattern":"VENC 编码无输出","symptoms":["chnl_watch_dog_timer_isr","venc watchdog fail enter blackbox","find VEDU_0 down"],"cause":"用户传入的图像帧内存不是用 DVPP 内存申请接口（hi_mpi_dvpp_malloc）申请的","fix":"查看日志是否有看门狗打印（出现基本确认内存使用问题）；用 hi_mpi_dvpp_malloc 申请图像帧内存"},{"pattern":"播放 VENC 编码的码流，亮暗与原始 YUV 不一致","symptoms":["码流亮暗与原始 YUV 不一致"],"cause":"播放器目标像素值域范围与 VENC 编码时的 video_full_range_flag 标志位不一致，播放器做像素值域映射（VENC 默认值：Atlas 推理系列 H.264/H.265 均 0=limited_range；Atlas 200I/500 A2 上 H.265 为 0、H.264 为 1=full_range）","fix":"不建议用播放器验收亮暗；将 VENC 码流解码为 YUV 文件与原始 YUV 对比，并确保编码/解码 video_full_range_flag 一致；需改默认值用 hi_mpi_venc_set_h264_vui/hi_mpi_venc_set_h265_vui"}]}}},{"id":"dvpp-vpc-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/dvpp-vpc.yaml","title":"DVPP VPC 图片处理问题（8 条）","summary":"VPC 图片处理故障：内存申请接口错误/内存大小传值错误/读写地址无效中断/调用失败（4 类参数）/参数校验失败（4 类）/创建通道失败（通道号重复）/获取结果失败（task id 非法）/输出花屏绿边（对齐数据）","doc":{"id":"dvpp-vpc-fault-patterns","type":"fault-pattern","title":"DVPP VPC 图片处理问题（8 条）","summary":"VPC 图片处理故障：内存申请接口错误/内存大小传值错误/读写地址无效中断/调用失败（4 类参数）/参数校验失败（4 类）/创建通道失败（通道号重复）/获取结果失败（task id 非法）/输出花屏绿边（对齐数据）","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0163.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0163-0170）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"调用错误的内存申请接口，导致内存地址校验出错","symptoms":["内存地址校验出错"],"cause":"未使用指定的接口申请 VPC 输入/输出内存（V1 用 acldvppMalloc、V2 用 hi_mpi_dvpp_malloc）","fix":"检查代码，用 acldvppMalloc（V1）或 hi_mpi_dvpp_malloc（V2）申请 VPC 输入/输出数据内存"},{"pattern":"使用正确的内存申请接口，但内存大小传值错误","symptoms":["结束地址非法","buffer size 校验失败"],"cause":"申请的内存大小小于该格式所需的输入/输出内存大小，或任务接口传入的 buffer size 与实际申请长度不一致","fix":"按文档检查对应格式的内存大小要求；增加打印内存长度日志，对比 buffer size 与实际申请长度"},{"pattern":"读/写内存地址无效，导致异常中断","symptoms":["cvdr_axi_rd_resp_err","cvdr_axi_wr_resp_err"],"cause":"cvdr_axi_rd_resp_err=读地址越界（输入内存太小或无效），cvdr_axi_wr_resp_err=写地址越界（输出内存太小或无效）","fix":"在申请 DVPP 内存接口处与 VPC 异常任务接口处打印日志对比申请/使用大小；在释放接口处打印，检查 VPC 任务完成前内存是否被提前释放"},{"pattern":"VPC 调用失败","symptoms":["VPC 调用失败日志"],"cause":"①抠图区域右偏移坐标需是奇数（如 1918 偶数不符）；②输出内存大小需 ≥ 宽stride*高stride*3/2；③输入图片宽 stride 必须 16 倍数且最小值 32（如 300 不满足）；④VPC 输入内存需用 acldvppMalloc 申请","fix":"按四种原因分别修正：坐标奇偶、输出内存大小、宽 stride 对齐（对齐后设置对齐值）、内存申请接口"},{"pattern":"VPC 参数校验失败","symptoms":["VPC 参数校验失败"],"cause":"①VPC 缩放宽大于输出宽；②VPC 抠图宽大于输入宽；③输入的缩放算法不正确；④图片内存大小不够","fix":"按四种原因分别修正缩放参数/抠图参数/缩放算法/内存大小"},{"pattern":"VPC 创建通道失败","symptoms":["hi_mpi_vpc_create_chn 失败"],"cause":"通道号重复——该通道号已存在","fix":"规划通道号，hi_mpi_vpc_create_chn 创建时传入未被使用的通道号"},{"pattern":"VPC 获取结果失败","symptoms":["hi_mpi_vpc_get_process_result 失败"],"cause":"传入非法的 task id","fix":"将功能接口中传出的 task id 传入 hi_mpi_vpc_get_process_result"},{"pattern":"VPC 输出图片存在花屏、绿边等","symptoms":["花屏","绿边"],"cause":"VPC 对输出图片宽/高有对齐要求（不同版本硬件对齐要求不同），不满足对齐时多余的对齐数据显示为绿边（如宽 100 需 16 对齐则配 128，多出 28 为无效对齐数据）；抠图缩放贴图大小与输出图片不一致时底图为输出内存随机值导致花屏","fix":"检查输出图片宽与对齐后宽，绿边为对齐数据时按输出宽逐行写文件剔除对齐数据；抠图缩放贴图不一致时检查输出内存是否提前 memset_s 去除随机值"}]}}},{"id":"dvpp-common-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/dvpp-common.yaml","title":"DVPP 通用问题（2 条）","summary":"DVPP 通用故障：驱动引擎异常返回码（-512 等待解码异常中断）/ 两个版本 DVPP 接口混用导致应用报错退出","doc":{"id":"dvpp-common-fault-patterns","type":"fault-pattern","title":"DVPP 通用问题（2 条）","summary":"DVPP 通用故障：驱动引擎异常返回码（-512 等待解码异常中断）/ 两个版本 DVPP 接口混用导致应用报错退出","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0159.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0159/0161）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"DVPP 驱动引擎异常返回码","symptoms":["-512","VPC 引擎返回异常码"],"cause":"VPC 引擎返回 -512 表示等待视频解码异常中断——用户态进程退出导致等待解码时被异常中断","fix":"查看 Host 侧日志，检查用户态进程异常退出原因"},{"pattern":"两个版本的 DVPP 接口混用导致应用程序报错退出","symptoms":["V1/V2 接口混用","应用程序报错退出"],"cause":"媒体数据处理 V1 版（acldvpp* 接口）与 V2 版（hi_mpi_* 接口）混用导致应用程序报错退出","fix":"统一使用同一版本的 DVPP 接口，避免 V1/V2 混用"}]}}},{"id":"hdmi-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/hdmi.yaml","title":"HDMI 显示数据问题（3 条）","summary":"HDMI 送显故障：OPEN 失败（未先 init）/ 与 VO 多进程报错（must work in the same pid）/ 接口无显示（未 start 或参数/分辨率不符）；适用 Atlas 200I/500 A2 推理产品 EP/RC","doc":{"id":"hdmi-fault-patterns","type":"fault-pattern","title":"HDMI 显示数据问题（3 条）","summary":"HDMI 送显故障：OPEN 失败（未先 init）/ 与 VO 多进程报错（must work in the same pid）/ 接口无显示（未 start 或参数/分辨率不符）；适用 Atlas 200I/500 A2 推理产品 EP/RC","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0215.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0215-0217）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 200I/500 A2"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"HDMI OPEN 失败","symptoms":["HDMI device not init","mpi_hdmi_com_open"],"cause":"调用 hi_mpi_hdmi_open 接口前没有调用 hi_mpi_hdmi_init 接口","fix":"检查用例中 hi_mpi_hdmi_open 与 hi_mpi_hdmi_init 的调用顺序并修正"},{"pattern":"HDMI 与 VO 模块多进程时报错","symptoms":["VO functions must work in the same pid","HDMI functions must work in the same pid","open HDMI err"],"cause":"VO/HDMI 模块不支持多进程使用——多个进程同时操作 VO/HDMI 驱动","fix":"确保 VO/HDMI 相关操作在同一进程内完成，避免多进程并发调用"},{"pattern":"HDMI 接口无显示","symptoms":["无报错日志","HDMI 接口不显示"],"cause":"用例最后未调用 hi_mpi_hdmi_start 或开启错误；hdmi 属性/信息帧参数错误（avi infoframe video_format、hi_hdmi_attr timing_mode/pix_clk 与前级 VO 输出不符）；显示器不支持当前分辨率","fix":"检查 hi_mpi_hdmi_start 调用；排查信息帧时序与属性参数是否与前级 VO 输出一致；读显示器 edid 确认支持的分辨率，不支持则换显示器"}]}}},{"id":"model-inference-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/model-inference.yaml","title":"模型推理问题（5 条）","summary":"模型推理故障：dump 未获取结果（模型名不匹配）/ 动态 shape 申请内存失败（size=0）/ 注册算子数超规格（507032）/ 动态 shape 输出 buffer 不匹配 / 动态 shape 输入大小校验失败","doc":{"id":"model-inference-fault-patterns","type":"fault-pattern","title":"模型推理问题（5 条）","summary":"模型推理故障：dump 未获取结果（模型名不匹配）/ 动态 shape 申请内存失败（size=0）/ 注册算子数超规格（507032）/ 动态 shape 输出 buffer 不匹配 / 动态 shape 输入大小校验失败","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0124.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0124-0128）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"使用 dump 功能未获取 dump 结果","symptoms":["HandleDumpConfig end","set HandleDumpConfig success"],"cause":"Dump 配置的模型名与实际的模型名不匹配","fix":"检查 Dump 配置文件 acl.json 合法性与 model_name 配置"},{"pattern":"动态 shape 推理申请内存失败","symptoms":["malloc size must be greater than zero","start to execute aclrtMalloc, size = 0"],"cause":"动态 shape 模型输出 shape 含 -1，aclmdlGetOutputSizeByIndex 取到 size=0，申请 0 大小内存失败","fix":"aclmdlGetOutputSizeByIndex 取到 size=0 时，预估一块较大的内存"},{"pattern":"注册算子数超过最大规格","symptoms":["Program register failed, program out of 40000000","ErrCode=507032","program register num out of use"],"cause":"一个进程内算子等资源注册超过最大规格","fix":"简化模型或降低动态 batch 档次；model 太大建议一个进程 open 一个 device；避免同一算子在不同模型反复注册"},{"pattern":"动态 shape 模型用户输入和模型推导结果不匹配","symptoms":["mem size out of range","Expected size: 128, but given input size: 2","Output Size mismatch"],"cause":"用户分配的 output_buffer 大小与模型 infershape 推导出的输出大小不匹配（模型执行或单算子执行场景）","fix":"按模型 infershape 推导结果分配 output_buffer 大小"},{"pattern":"动态 shape 模型输入大小校验失败","symptoms":["tensor size mismatches","expected: 768032, but given 32"],"cause":"动态 s
