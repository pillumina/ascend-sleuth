<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昇腾知识浏览器 · ascend-sleuth references</title>
<style>
  :root{
    --bg:      oklch(0.972 0.007 82);   /* 暖纸底 */
    --bg-deep: oklch(0.945 0.012 80);
    --panel:   oklch(0.995 0.004 82);
    --ink:     oklch(0.24 0.012 70);
    --ink-2:   oklch(0.46 0.016 70);
    --ink-3:   oklch(0.60 0.014 70);
    --line:    oklch(0.88 0.016 80);
    --line-2:  oklch(0.80 0.02 78);
    --accent:      oklch(0.52 0.15 35);   /* 赤陶 vermilion */
    --accent-ink:  oklch(0.44 0.15 35);
    --accent-soft: oklch(0.93 0.035 40);
    --code-bg:  oklch(0.235 0.012 78);
    --code-ink: oklch(0.92 0.006 80);
    --ok:  oklch(0.50 0.11 150);
    --warn: oklch(0.55 0.11 75);
    --blue:  oklch(0.52 0.11 250);  --blue-bg:  oklch(0.94 0.03 250);
    --violet:oklch(0.50 0.14 300);  --violet-bg:oklch(0.93 0.04 300);
    --teal:  oklch(0.48 0.09 180);  --teal-bg:  oklch(0.93 0.035 180);
    --gray-bg: oklch(0.90 0.008 80);
    --mono: ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
    --sans: "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif: Georgia,"Songti SC","STSong",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.65;
       -webkit-font-smoothing:antialiased}
  a{color:var(--accent-ink);text-decoration:none;cursor:pointer}
  a:hover{text-decoration:underline;text-underline-offset:3px}
  code{font-family:var(--mono);font-size:.9em}
  ::selection{background:var(--accent-soft)}

  .app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
  /* ============ 侧栏 ============ */
  .rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);
        background:linear-gradient(180deg,var(--panel),var(--bg-deep));padding:20px 14px 40px}
  .brand{display:flex;align-items:baseline;gap:8px;padding:2px 8px 14px}
  .brand b{font-size:17px;letter-spacing:.02em}
  .brand .ver{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
  .rail .hint{font-size:11px;color:var(--ink-3);padding:0 8px 12px;line-height:1.6}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:9px;
          background:var(--panel);padding:7px 10px;margin:0 6px 14px;box-shadow:0 1px 0 var(--panel)}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{flex:none;color:var(--ink-3)}
  .search input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:var(--ink)}
  .nav{padding:0 4px}
  .nav .nav-home{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:7px;color:var(--ink-2);
         font-size:13px;letter-spacing:.02em}
  .nav .nav-home:hover{background:var(--bg-deep);text-decoration:none;color:var(--ink)}
  .nav details{margin-top:10px}
  .nav details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
        padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);
        letter-spacing:.03em;user-select:none}
  .nav details>summary::-webkit-details-marker{display:none}
  .nav details>summary:hover{background:var(--bg-deep);color:var(--ink)}
  .nav details>summary .cnt{margin-left:auto;font-weight:500;font-family:var(--mono);font-size:10.5px;
        color:var(--ink-3);background:var(--gray-bg);padding:0 6px;border-radius:99px}
  .nav details>summary .tw{font-size:9px;color:var(--ink-3);transition:transform .18s ease}
  .nav details[open]>summary .tw{transform:rotate(90deg)}
  .nav .kind-dot{width:6px;height:6px;border-radius:50%;flex:none}
  .nav .flow .kind-dot{background:var(--accent)}
  .nav .table .kind-dot{background:var(--blue)}
  .nav .fact .kind-dot{background:var(--teal)}
  .nav .entry{display:flex;gap:8px;align-items:baseline;padding:3.5px 10px 3.5px 25px;border-radius:6px;
        color:var(--ink-2);font-size:12.5px}
  .nav .entry .id{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
  .nav .entry:hover{background:var(--bg-deep);text-decoration:none}
  .nav .entry.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .rail .foot{margin:22px 8px 0;font-size:10.5px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}

  /* ============ 主区 ============ */
  .main{padding:0 clamp(20px,4vw,56px) 90px;min-width:0}
  .crumb{padding:22px 0 6px;font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
  .crumb .sep{color:var(--line-2)}
  .crumb a{color:var(--ink-3)} .crumb a:hover{color:var(--accent-ink)}

  /* 首页 */
  .hero{padding:clamp(28px,6vh,64px) 0 8px;max-width:860px}
  .hero .kicker{font-size:11.5px;letter-spacing:.22em;color:var(--accent);font-weight:700;text-transform:uppercase}
  .hero h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,46px);line-height:1.12;margin:10px 0 14px;
        font-weight:600;letter-spacing:.005em}
  .hero p{color:var(--ink-2);font-size:15px;max-width:62ch;margin:0 0 24px}
  .hero .bigsearch{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line-2);
        border-radius:12px;padding:13px 16px;max-width:640px;box-shadow:0 1px 2px oklch(0.4 0 0 / .04)}
  .hero .bigsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .hero .bigsearch svg{color:var(--ink-3)}
  .hero .bigsearch input{border:0;outline:0;background:transparent;font:inherit;font-size:15px;flex:1;color:var(--ink)}
  .hero .bigsearch kbd{margin-left:auto;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;
        font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding:2px 7px;background:var(--bg)}
  .starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:34px 0 8px}
  .start{background:var(--panel);padding:18px 18px 16px;display:block;position:relative;transition:background .15s ease}
  .start:hover{background:var(--bg-deep);text-decoration:none}
  .start .no{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--accent);line-height:1}
  .start h3{margin:10px 0 6px;font-size:14.5px;color:var(--ink);font-weight:700}
  .start p{margin:0;font-size:12px;color:var(--ink-3);line-height:1.6}
  .start .to{display:inline-block;margin-top:10px;font-size:11px;color:var(--accent);font-weight:600}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 4px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .sec-head h2{font-size:15px;margin:0;letter-spacing:.04em}
  .sec-head .sub{color:var(--ink-3);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 14px;padding-top:14px}
  .tile{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;display:block;transition:border-color .15s ease,transform .15s ease}
  .tile:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
  .tile .t-top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
  .tile .t-title{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.45}
  .tile .t-id{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .tile .t-sum{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.6;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
  .empty .big{font-size:34px;margin-bottom:8px}

  /* 类型列表页 */
  .dir-head{padding:24px 0 6px;max-width:820px}
  .dir-head h1{font-family:var(--serif);font-size:clamp(26px,3.6vw,38px);margin:6px 0 10px;font-weight:600}
  .dir-head p{color:var(--ink-2);margin:0;font-size:14px}
  .stat-line{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;font-size:12px;color:var(--ink-3)}
  .stat-line b{color:var(--ink-2);font-weight:600}

  /* 词条详情 */
  .ehead{padding:18px 0 4px;max-width:900px}
  .ehead .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ehead .file-tag{font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line);
        padding:1px 7px;border-radius:99px;background:var(--panel)}
  .ehead h1{font-family:var(--serif);font-size:clamp(23px,3.2vw,34px);line-height:1.22;margin:12px 0 10px;font-weight:600}
  .esum{color:var(--ink-2);font-size:14px;margin:0 0 14px;max-width:75ch}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-3);align-items:center}
  .meta-row .kv{display:flex;gap:6px;align-items:center}
  .meta-row .kv b{font-weight:600;color:var(--ink-2)}
  .provenance{margin:16px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .provenance summary{cursor:pointer;padding:10px 16px;font-size:13px;color:var(--ink-2);list-style:none;display:flex;gap:10px;align-items:center;user-select:none}
  .provenance summary::-webkit-details-marker{display:none}
  .provenance summary:hover{color:var(--ink)}
  .provenance summary .tw{margin-left:auto;font-size:10px;color:var(--ink-3);transition:transform .18s}
  .provenance[open] summary .tw{transform:rotate(90deg)}
  .srcs{padding:2px 16px 16px;display:grid;gap:10px}
  .src{border:1px solid var(--line);border-left:3px solid var(--gray-bg);border-radius:8px;padding:10px 12px;background:var(--bg)}
  .src .s-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .src .s-url{font-size:12px;word-break:break-all}
  .src .s-meta{font-size:11.5px;color:var(--ink-3);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
  .src .s-cases{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .kbox{display:block}
  .kbox h3{font-size:13px;letter-spacing:.06em;margin:26px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);
        color:var(--ink-2);font-weight:700}
  .kbox .claim{font-size:14.5px;line-height:1.8;color:var(--ink);margin:14px 0 0;max-width:85ch}
  .kbox .claim code{background:var(--gray-bg);padding:.5px 5px;border-radius:4px;color:var(--ink)}
  .kbox p.lead{font-size:14px;margin:14px 0 0;max-width:85ch}
  details.ev{max-width:85ch;margin-top:12px}
  details.ev summary{font-size:12px;color:var(--accent);cursor:pointer;user-select:none;list-style:none;display:inline-flex;gap:6px}
  details.ev summary::-webkit-details-marker{display:none}
  details.ev .ev-body{font-size:12.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);
        border-radius:8px;padding:10px 13px;margin-top:8px;line-height:1.7}
  .subblock{margin-top:12px}
  .subblock .lbl{font-size:11px;letter-spacing:.1em;color:var(--ink-3);font-weight:700;text-transform:uppercase}
  .subblock .lbl .zh{letter-spacing:.02em;text-transform:none}
  .gen-list{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
  .gen-list li{position:relative;padding-left:16px;color:var(--ink-2);font-size:13px;line-height:1.7;max-width:85ch}
  .gen-list li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--line-2)}

  /* 步骤流 */
  .flow{margin:18px 0 0;max-width:860px}
  .flow .f-cap{font-size:12px;color:var(--ink-3);margin:0 0 6px;display:flex;gap:8px;align-items:center}
  .steps{position:relative;padding-left:2px}
  .step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 14px;position:relative}
  .step .s-rail{display:flex;flex-direction:column;align-items:center}
  .step .s-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
        font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
        box-shadow:0 0 0 4px var(--accent-soft);z-index:1;flex:none}
  .step .s-line{flex:1;width:1px;background:var(--line-2);margin:6px 0}
  .step:last-child .s-line{display:none}
  .step .s-body{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .step .s-name{font-size:14.5px;font-weight:700;color:var(--ink)}
  .step .s-name .n{font-family:var(--serif);font-style:italic;color:var(--accent);font-weight:600;margin-right:8px}
  .when{margin-top:8px;font-size:12.5px;color:var(--ink-2);display:flex;gap:7px;align-items:baseline}
  .when b{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--warn)}
  .action{margin-top:7px;font-size:13.5px;line-height:1.75;color:var(--ink);max-width:80ch}
  .checks{margin-top:10px}
  .checks .c-cap{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;margin-bottom:5px;display:flex;gap:6px;align-items:center}
  .cmd-row{display:flex;align-items:stretch;margin:4px 0;max-width:100%}
  .cmd-row .cmd{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:12px;
        padding:6px 12px;border-radius:7px 0 0 7px;flex:1 1 auto;min-width:0;overflow-x:auto;white-space:pre;line-height:1.5}
  .cmd-row button{background:oklch(0.30 0.012 78);border:0;color:var(--code-ink);border-radius:0 7px 7px 0;
        padding:0 11px;cursor:pointer;font-size:11px;flex:none}
  .cmd-row button:hover{background:var(--accent);color:#fff}
  .cmd-row button.copied{background:var(--ok);color:#fff}

  /* 表格 */
  .tblwrap{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:var(--panel);max-width:1040px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--ink-3);font-weight:700;
        background:var(--bg-deep);padding:8px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7;color:var(--ink-2)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr:hover td{background:oklch(0.985 0.004 82)}
  .tbl .mono{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
  .tbl .mono.wrap{white-space:normal;word-break:break-all}
  .tbl td.cell-main{color:var(--ink);font-size:12.5px}
  .tbl .yn{font-family:var(--mono);font-weight:700}
  .tbl .yn.Y{color:var(--ok)} .tbl .yn.N{color:var(--warn)}
  .table-note{font-size:11.5px;color:var(--ink-3);margin-top:8px}

  /* 徽章与 chips */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.5;padding:3px 9px;border-radius:99px;
        background:var(--gray-bg);color:var(--ink-2)}
  .tbl .chip{white-space:normal;vertical-align:middle}
  .chip code{font-size:10.5px}
  .type-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.02em}
  .type-badge.flow{background:var(--accent-soft);color:var(--accent-ink)}
  .type-badge.table{background:var(--blue-bg);color:var(--blue)}
  .type-badge.fact{background:var(--teal-bg);color:var(--teal)}
  .kind-tag{font-size:10px;color:var(--ink-3);border:1px solid var(--line);padding:2px 7px;border-radius:5px}
  .badge-src{font-weight:700;padding:2px 8px;border-radius:5px;font-size:11px}
  .badge-src.official-doc{background:var(--blue-bg);color:var(--blue)}
  .badge-src.case-derived{background:var(--violet-bg);color:var(--violet)}
  .badge-src.engineer-input{background:var(--teal-bg);color:var(--teal)}
  .ok-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
  .st-active{color:var(--ok);font-weight:600}
  .chip-plat{background:var(--blue-bg);color:var(--blue)}
  .chip-cat{background:oklch(0.95 0.03 75);color:oklch(0.5 0.11 55)}
  .chip-link{border:1px solid var(--line);background:var(--panel);color:var(--accent-ink)}
  a.chip:hover{border-color:var(--accent);text-decoration:none}
  .casechip{font-family:var(--mono);font-size:10px;background:var(--violet-bg);color:var(--violet);padding:1.5px 7px;border-radius:5px}
  .rel-box{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
  .rel-box .lbl{font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .rel-box .chips{display:flex;gap:6px;flex-wrap:wrap}
  .pager{margin-top:26px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px}
  .pager a{font-size:12.5px;color:var(--ink-2);max-width:46%}
  .pager a:hover{color:var(--accent-ink)}
  .pager .dir{color:var(--ink-3);font-size:11px;display:block}

  /* 搜索结果 */
  .qhead{padding:22px 0 8px}
  .qhead h1{font-family:var(--serif);font-size:26px;margin:4px 0 2px;font-weight:600}
  .qhead .q{color:var(--accent)}
  .qhead .n{color:var(--ink-3);font-size:13px}
  mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}
  .res-group{margin-top:20px}
  .res-group .g-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .res-group .g-head h2{font-size:13px;margin:0;letter-spacing:.05em;color:var(--ink-2)}
  .res-group .g-head .cnt{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .res-item{display:block;padding:9px 12px;border-bottom:1px solid var(--line)}
  .res-item:hover{background:var(--panel);text-decoration:none}
  .res-item .r1{display:flex;gap:10px;align-items:baseline}
  .res-item .r-t{font-weight:600;color:var(--ink);font-size:13.5px}
  .res-item .r-id{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .res-item .r-sum{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.6}

  /* triage */
  .triage-head{padding:24px 0 4px;max-width:820px}
  .triage-head h1{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);margin:6px 0 10px;font-weight:600}
  .triage-head p{color:var(--ink-2);max-width:72ch}
  .branches{display:grid;gap:10px;margin-top:16px}
  .branch{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
  .branch .b-head{display:flex;align-items:center;gap:12px;padding:11px 16px;flex-wrap:wrap}
  .branch .b-id{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink)}
  .branch .b-ns{display:flex;gap:5px;flex-wrap:wrap}
  .branch .b-sym{margin:0 16px 14px}
  .branch details summary{font-size:11.5px;color:var(--accent);cursor:pointer;list-style:none}
  .branch .b-list{background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:6px;
        font-family:var(--mono);font-size:11px;color:var(--ink-2);line-height:1.9;white-space:pre-wrap;max-height:240px;overflow:auto}

  .note-box{margin-top:20px;border-left:3px solid var(--warn);background:oklch(0.97 0.02 80);
        padding:10px 14px;font-size:12px;color:var(--ink-2);border-radius:0 8px 8px 0;max-width:820px}
  .rail-toggle{display:none}
  @media (max-width:960px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;z-index:50;width:min(320px,86vw);left:0;top:0;transform:translateX(-105%);

ister|重复注册|batch_p2p_comm|UNKNOWN application exception' {{log_path}}","when_to_use":"mindspeed-llm 训练启动即失败，环境校验（torch_npu/CANN/卡可用）可能已通过"},{"step":2,"name":"import 失败判别——版本/安装面 vs 代码漂移面","action":"报 ModuleNotFoundError / ImportError（import 阶段失败）→ 先判别根因面，勿直接按版本处理：①报错模块是 mindspeed.features_manager 的符号（cannot import name X from 'mindspeed.features_manager'）→ 版本/安装面（走 step3）；②报错模块是仓库内已删除的路径（No module named 'mindspeed_llm.tasks.checkpoint.models'，mindspore 启动）→ 代码漂移面（走 step4）；③其他模块 → 核对安装完整性后回 Tier 3","check":"grep -E \"cannot import name .* from 'mindspeed.features_manager'|No module named 'mindspeed_llm\\.\" {{log_path}}","when_to_use":"任何 import 阶段失败的启动报错——先分清是环境装错还是仓库代码变了"},{"step":3,"name":"形态 A——mindspeed.features_manager 缺符号（版本不配套）","action":"报 ImportError: cannot import name 'X' from 'mindspeed.features_manager'（如 PipelineModelParallelLayoutFeature / HcclOpModeSetFeature）→ MindSpeed-LLM master 依赖新版 mindspeed 才有的符号。先 pip show mindspeed 核对版本，再分两种：mindspeed 版本过旧 → 升级到配套版本；镜像预装 + 同版本重装未覆盖 → pip uninstall mindspeed 后重装","check":"grep \"cannot import name .* from 'mindspeed.features_manager'\" {{log_path}}","when_to_use":"dsv4/DeepSeek 系列按指导文档安装后拉起报 features_manager import 错误"},{"step":4,"name":"形态 B——代码漂移（上游删模块未同步后端）","action":"报 No module named 'mindspeed_llm.tasks.checkpoint.models'（--ai-framework mindspore 启动）→ master 已删除 checkpoint-v1（commit f107818 'delete ckpt-v1'），MindSpore 侧 models.py:11 与 mindspore_adaptor_v2.py:157-161 仍引用旧模块（共 4 处悬挂引用）。核对源码：master 上 mindspeed_llm/tasks/checkpoint/models.py 是否已不存在、mindspore/tasks/checkpoint/models.py 是否仍引用 → 是 → 代码漂移，fix=同步迁移到 checkpoint-v2 或移除旧引用（维护者合入），用户侧 workaround=改用 pytorch 后端","check":"grep \"No module named 'mindspeed_llm\\.tasks\\.checkpoint\\.models'\" {{log_path}}","when_to_use":"mindspore 后端启动失败报仓库内模块缺失——注意与 step3 版本面区分（此形态升级/重装无效）"},{"step":5,"name":"形态 C——算子重复注册（CANN 过旧 vs 多版本 mindspeed）","action":"报算子重复注册（Tried to register an operator ... multiple times 如 npu_moe_distribute_dispatch_v2；或 GMMOpBuilder 重复注册）→ 先查 CANN 版本（过旧如 9.0.0 → 升级 9.1.0B120+），再查 pip list 是否多个 mindspeed 版本（是 → 卸载多余版本仅留单一版本）","check":"grep -E 'Tried to register an operator|GMMOpBuilder|重复注册' {{log_path}}","when_to_use":"LoRA 微调（deepseek-v4-flash）或 Qwen3 预训练启动时算子编译/加载阶段报重复注册"},{"step":6,"name":"形态 D——特性未适配（需升级 PTA 或关闭特性）","action":"开启某优化特性后训练崩在特定通信/计算路径（如 batch_p2p_comm 崩在 pipeline parallel recv_forward）→ 特性在 MindSpeed 仓库尚未适配（版本功能缺口）→ 升级最新 PTA（昇腾 PyTorch Adapter）或关闭该特性配置","check":"grep -E 'recv_forward|p2p_communication|batch_p2p_comm' {{log_path}}","when_to_use":"开启 config.batch_p2p_comm 等优化特性后 dsv4 + 流水线并行训练崩溃"},{"step":7,"name":"非版本/环境面排除","action":"以上形态均不命中（报错为数据/路径/转换/精度类，如 FileNotFoundError、helpers_cpp 缓存、QKV 权重错位、grad norm 0）→ 转向对应 case（MSLLM-1465/1526/1532/1437）或 Tier 3 兜底，勿在版本面继续排查","check":"grep -E \"Couldn't find any data file|helpers_cpp|grad.?norm.*0\" {{log_path}}","when_to_use":"启动失败但无版本/环境配套特征时"}],"verified_by_testing":false}}},{"id":"ascend-oom-triage","type":"methodology","dir":"methodologies","file":"references/methodologies/ascend-oom-triage.yaml","title":"内存 OOM 问题定位（C 接口 → CANN Host 内存 → CANN Device 内存 → 业务进程异常）","summary":"OOM 按申请方分流：C 标准接口 malloc/memset 申请 Host 内存→asan 检测；CANN 接口 aclrtMallocHost 申请 Host 内存→日志搜 mem_stats 看组件统计；aclrtMalloc/aclrtMallocPhysical/hi_mpi_dvpp_malloc 申请 Device 内存→mem_stats；其它报错→搜 DEV_PROC_MEM 看业务进程统计；各统计不符合预期联系技术支持","doc":{"id":"ascend-oom-triage","type":"methodology","title":"内存 OOM 问题定位（C 接口 → CANN Host 内存 → CANN Device 内存 → 业务进程异常）","summary":"OOM 按申请方分流：C 标准接口 malloc/memset 申请 Host 内存→asan 检测；CANN 接口 aclrtMallocHost 申请 Host 内存→日志搜 mem_stats 看组件统计；aclrtMalloc/aclrtMallocPhysical/hi_mpi_dvpp_malloc 申请 Device 内存→mem_stats；其它报错→搜 DEV_PROC_MEM 看业务进程统计；各统计不符合预期联系技术支持","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0050.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0050/0051/0052/0054/0055/0056）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"categories":["interrupt"]},"status":"active","last_verified":"2026-08-28","content":{"flow":[{"step":1,"name":"识别 OOM","action":"报错含 ErrCode=207001 desc=[driver error:out of memory]、rtMalloc/rtMallocPhysical/aclrtMalloc 系列接口失败即命中；Device 侧系统内存不足时，从 Device 导出的 syslog（{导出目录}/{时间戳}/message/dev-os-{id}/messages.*）中存在 oom 关键字（kbox catch oom event）","check":"grep 207001|out of memory|rtMalloc；syslog grep oom","when_to_use":"训练/推理报内存申请失败、OOM"},{"step":2,"name":"排查 C 原生接口问题","action":"检查应用是否用 C 标准接口 malloc/memset 等申请 Host 内存；命中则用第三方 asan 工具检测内存错误并优化代码逻辑","check":"代码审查 malloc/memset；asan 检测","when_to_use":"应用使用 C 标准接口申请 Host 内存"},{"step":3,"name":"排查 CANN Host 内存申请问题","action":"在 Host 应用类日志 ${HOME}/err_log_info/log/[run|debug]/plog/plog-pid_*.log 中找 OOM 附近时间日志，根据报错接口判断；报错处使用 aclrtMallocHost 申请 Host 内存 → Host 内存问题，日志搜 mem_stats 关键字查看各组件申请内存统计；统计不符合预期联系技术支持","check":"grep aclrtMallocHost；grep mem_stats","when_to_use":"报错接口为 aclrtMallocHost"},{"step":4,"name":"排查 CANN Device 内存申请问题","action":"报错处使用 aclrtMalloc、aclrtMallocPhysical、hi_mpi_dvpp_malloc 等接口申请 Device 内存 → Device 内存问题；日志搜 mem_stats 关键字查看各组件或框架申请内存统计；统计不符合预期联系技术支持","check":"grep aclrtMalloc|aclrtMallocPhysical|hi_mpi_dvpp_malloc；grep mem_stats","when_to_use":"报错接口为 Device 内存申请接口"},{"step":5,"name":"排查 Device 业务进程异常","action":"其它报错提示信息一般为 Device 业务进程异常导致 OOM；日志搜 DEV_PROC_MEM 关键字查看各业务进程内存统计；业务进程占用不符合预期联系技术支持","check":"grep DEV_PROC_MEM","when_to_use":"报错非 aclrtMallocHost 也非 Device 内存申请接口"}],"verified_by_testing":false}}},{"id":"ascend-log-troubleshooting","type":"methodology","dir":"methodologies","file":"references/methodologies/ascend-log-troubleshooting.yaml","title":"日志异常排查（不落盘 / 时间戳不对 / 多余打屏）","summary":"日志故障按现象分流：不落盘按部署形态分支排查（EP/RC/Control CPU × 应用/系统：系统日志报错 → df -h 磁盘 → ldd 动态库 → ps 查 slogd → 重启日志进程）；时间戳不对是 AI 任务启动后改系统时区所致（重启任务或 timedatectl 改回）；多余打屏是日志模块与 slogd 建 Socket 失败降级打屏（fd 超限用 ulimit -n 调大）","doc":{"id":"ascend-log-troubleshooting","type":"methodology","title":"日志异常排查（不落盘 / 时间戳不对 / 多余打屏）","summary":"日志故障按现象分流：不落盘按部署形态分支排查（EP/RC/Control CPU × 应用/系统：系统日志报错 → df -h 磁盘 → ldd 动态库 → ps 查 slogd → 重启日志进程）；时间戳不对是 AI 任务启动后改系统时区所致（重启任务或 timedatectl 改回）；多余打屏是日志模块与 slogd 建 Socket 失败降级打屏（fd 超限用 ulimit -n 调大）","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/logreference/logreference_0024.html","version":"CANN 商用版 9.0.0（日志参考 logreference_0024/0025/0026）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"},"categories":["interrupt"]},"related_references":["ascend-restart-slogd","ascend-slog-conf"],"status":"active","last_verified":"2026-08-28","content":{"flow":[{"step":1,"name":"识别故障现象","action":"按现象分流——日志文件缺失或为空（不落盘）/ 日志时间戳与系统时间不一致 / 未设置打印环境变量但屏幕仍有日志（多余打屏）","check":"现象归类三选一","when_to_use":"日志收集阶段发现日志异常"},{"step":2,"name":"不落盘——Ascend EP 应用类日志","action":"查 Host 侧系统日志报错（aarch64 看 /var/log/messages，x86_64 看 /var/log/syslog）；再 df -h 查日志落盘路径（$HOME/ascend/log）所在磁盘是否满；仍不行用 msnpureport 导出 Device 侧系统日志查错误；最后获取日志联系技术支持","check":"cat /var/log/messages 或 cat /var/log/syslog；df -h","when_to_use":"EP 形态 $HOME/ascend/log 下 plog 日志或 device-id 日志未落盘"},{"step":3,"name":"不落盘——msnpureport 导出失败","action":"查看 msnpureport 命令打印的提示信息定位问题；再 df -h 查运行 msnpureport 所在路径的磁盘空间是否已满；仍失败联系技术支持","check":"df -h","when_to_use":"EP 形态 msnpureport 导出 Device 侧系统日志失败"},{"step":4,"name":"不落盘——RC / Control CPU 开放形态应用类日志","action":"ldd <应用进程> 查应用进程依赖的动态库是否正确；df -h 查 /var/log/npu/slog 所在磁盘是否满；ps -elf | grep slogd 确认 slogd 进程存在（Atlas 200I/500 A2 若进程不存在联系技术支持）；以上无问题则重启日志进程","check":"ldd <进程>；df -h；ps -elf | grep slogd","when_to_use":"RC 或 Control CPU 开放形态 /var/log/npu/slog 下应用类日志未落盘"},{"step":5,"name":"不落盘——RC / Control CPU 开放形态系统类日志","action":"ps -elf | grep log 查 slogd、sklogd 进程是否存在（Atlas 200I/500 A2 若进程不存在联系技术支持）；df -h 查 /var/log/npu/slog 所在磁盘是否满；以上无问题则重启日志进程","check":"ps -elf | grep log；df -h","when_to_use":"RC 或 Control CPU 开放形态系统类日志未落盘"},{"step":6,"name":"日志时间戳与系统时间不一致","action":"根因是启动 AI 任务后修改了系统环境时区；处理方式一：重新启动 AI 任务；方式二：修改系统时区（timedatectl 查看当前时区，sudo timedatectl set-timezone Asia/Shanghai 设置新时区）","check":"timedatectl；sudo timedatectl set-timezone <时区>","when_to_use":"日志打印信息中的时间戳与系统环境时间不一致"},{"step":7,"name":"未设打印变量但屏幕仍有日志","action":"根因是日志模块创建与 slogd 的 Socket 失败时降级把日志打印到屏幕，通常因执行用例时打开文件数超过系统默认最大值；ulimit -a 查看 open files 限制、lsof | wc -l 查看当前已打开文件数，超限用 ulimit -n 调大","check":"ulimit -a；lsof | wc -l；ulimit -n <n>","when_to_use":"未 export ASCEND_SLOG_PRINT_TO_STDOUT=1 但屏幕仍有日志显示"}],"verified_by_testing":false}}},{"id":"ascend-process-interrupt-triage","type":"methodology","dir":"methodologies","file":"references/methodologies/ascend-process-interrupt-triage.yaml","title":"进程中断问题定位（首报错 → 接口错误 → 任务执行错误 → 心跳丢失 → 资源未释放）","summary":"进程异常退出按五层排查：①plog 首报错有错误码（非 E*9***）查错误码参考；②acl***/rt*** 接口报错（对外接口查 API 参考，内部接口联系技术支持）；③fault kernel_name 算子执行报错 / Task run failed 内部任务报错（ascend-dmi 压测）；④Device lost heartbeat+HEARTBEAT EXCEPTION 或 fatal panic 心跳丢失；⑤RESOURCE_ALLOC_FAIL 资源未释放","doc":{"id":"ascend-process-interrupt-triage","type":"methodology","title":"进程中断问题定位（首报错 → 接口错误 → 任务执行错误 → 心跳丢失 → 资源未释放）","summary":"进程异常退出按五层排查：①plog 首报错有错误码（非 E*9***）查错误码参考；②acl***/rt*** 接口报错（对外接口查 API 参考，内部接口联系技术支持）；③fault kernel_name 算子执行报错 / Task run failed 内部任务报错（ascend-dmi 压测）；④Device lost heartbeat+HEARTBEAT EXCEPTION 或 fatal panic 心跳丢失；⑤RESOURCE_ALLOC_FAIL 资源未释放","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0061.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0061/0062/0063）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"categories":["interrupt"]},"status":"active","last_verified":"2026-08-28","content":{"flow":[{"step":1,"name":"识别进程中断并定位首报错","action":"在 Host 应用类日志 ${HOME}/err_log_info/log/[run|debug]/plog/plog-pid_*.log 执行 grep -rn ERROR，取首报错；首报错存在错误码且非 E*9*** 类（E*9*** 为系统内部错误码）→ 查错误码参考解决方法；无错误码继续后续排查","check":"grep -rn \"ERROR\" plog-pid_*.log","when_to_use":"进程异常退出、应用中断"},{"step":2,"name":"排查接口使用类错误","action":"检查首报错附近是否有 acl***、[drv api]、rt*** 等接口报错；对外发布接口（一般 acl 开头）→ 按 API 参考检查接口使用与参数说明；内部接口报错 → 联系技术支持（典型案例：SetDevice 错误无可用 Context、rtMemcpyAsync 异步参数校验）","check":"grep acl|drv api|rt***","when_to_use":"日志含接口调用报错"},{"step":3,"name":"排查任务执行错误","action":"先查算子执行类任务报错：grep fault kernel_name 或 kernelName，命中则取报错 kernel 名称联系技术支持；再查其它任务执行：grep Task run failed 表示 CANN 内部组件任务报错，用 ascend-dmi 故障诊断压测并提供压测报告与报错日志（sqe_type=notify wait 时先区分是否模型算子报错，再搜 fault kernel_name 定位算子）","check":"grep fault kernel_name|kernelName；grep \"Task run failed\"；ascend-dmi 压测","when_to_use":"无接口类报错或已排除"},{"step":4,"name":"排查心跳丢失问题","action":"Host plog 有 Device lost heartbeat 且黑匣子 history.log（${HOME}/err_log_info/report/*/hisi_logs 目录）有 HEARTBEAT EXCEPTION → TaskScheduler CPU 心跳丢失；Device syslog（report/*/message）有 fatal panic → Control CPU 心跳丢失；均联系技术支持","check":"grep \"Device lost heartbeat\"；grep HEARTBEAT EXCEPTION；grep \"fatal panic\"","when_to_use":"任务执行错误已排除"},{"step":5,"name":"排查资源未释放","action":"plog 有 RESOURCE_ALLOC_FAIL → 存在资源未释放，检查应用代码逻辑，内存等资源使用完成后及时释放","check":"grep RESOURCE_ALLOC_FAIL","when_to_use":"以上均未命中"}],"verified_by_testing":false}}},{"id":"ascend-process-hang-triage","type":"methodology","dir":"methodologies","file":"references/methodologies/ascend-process-hang-triage.yaml","title":"进程卡住问题定位（调用栈定位下发/执行阶段 → 卡住任务 → 编译耗时）","summary":"进程卡住先用 asys collect -r=stacktrace 取调用栈：栈无 CANN 内部函数→任务未下发查客户脚本；有 SendTask→卡在任务下发；有 Synchronize→卡在任务执行，用 trace 日志 stream_id+head/pos 定位卡住任务；plog 有 watchdog timeout 或算子停留 Compile process status/init disk cache→算子在线编译卡住","doc":{"id":"ascend-process-hang-triage","type":"methodology","title":"进程卡住问题定位（调用栈定位下发/执行阶段 → 卡住任务 → 编译耗时）","summary":"进程卡住先用 asys collect -r=stacktrace 取调用栈：栈无 CANN 内部函数→任务未下发查客户脚本；有 SendTask→卡在任务下发；有 Synchronize→卡在任务执行，用 trace 日志 stream_id+head/pos 定位卡住任务；plog 有 watchdog timeout 或算子停留 Compile process status/init disk cache→算子在线编译卡住","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0071.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0071/0072/0073）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-asys"],"applies_to":{"platforms":["cross"],"categories":["interrupt"]},"status":"active","last_verified":"2026-08-28","content":{"flow":[{"step":1,"name":"收集日志并获取卡住进程调用栈","action":"收集 CANN 日志（目录以 ${HOME}/err_log_info/ 为例）；用 asys collect -r=stacktrace --remote=<pid> --all --quiet 获取卡住进程调用栈（终端提示 stackcore file path 为结果文件；也可用 gdb）；结合 plog 排查","check":"asys collect -r=stacktrace --remote=<pid> --all --quiet","when_to_use":"进程卡住、无响应"},{"step":2,"name":"按调用栈定位卡住阶段","action":"栈中无任何 CANN 内部关键函数（CANN 库默认 /usr/local/Ascend）→ 任务未下发到 CANN，定位客户脚本任务下发问题；栈含 SendTask → 卡在 CANN 任务下发阶段，联系技术支持定位下发代码逻辑；栈含 Synchronize → 卡在任务执行阶段，跳转追溯卡住任务","check":"调用栈函数名分类（无 CANN 函数 / SendTask / Synchronize）","when_to_use":"已拿到调用栈"},{"step":3,"name":"追溯卡住任务","action":"在 trace 日志 schedule_tracer_*.txt 中查 ERROR 报错处流信息（stars_wait_sqe_is_timeout / wait task timeout 定位超时流与 task_id）；grep stream_id 找到 dump 出的流信息：sq_en=1 流激活，head 为当前执行任务索引，pos[head] 即卡住的任务","check":"grep -rn \"stream_id=<n>\" schedule_tracer_*.txt","when_to_use":"卡在任务执行阶段（Synchronize）"},{"step":4,"name":"排查算子在线编译卡住","action":"plog 有 watchdog timeout → 可能算子在线编译时间长导致卡住；用 trace 日志确认：schedule_tracer_FE_Global_Trace.txt 搜 Compile process status（编译中）/ Finish subgraph compile（编译结束）；算子停留 init disk cache 状态 → 编译卡住，进入 reuse task cache / dispatch online compile / reuse binary 则正常；schedule_tracer_FE_Statistics_Trace.txt 看缓存/编译统计","check":"find -name schedule_tracer_FE_Global_Trace.txt|FE_CompileTd_*.txt|FE_Statistics_Trace.txt；grep watchdog timeout","when_to_use":"疑似算子编译耗时长"}],"verified_by_testing":false}}},{"id":"acl-error-codes","type":"error-code","dir":"errors","file":"references/errors/acl.yaml","title":"ACL（AscendCL） 错误码（EH，6 条）","summary":"CANN 商用版 9.0.0《错误码参考》ACL（AscendCL）族 6 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"acl-error-codes","type":"error-code","title":"ACL（AscendCL） 错误码（EH，6 条）","summary":"CANN 商用版 9.0.0《错误码参考》ACL（AscendCL）族 6 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html","version":"CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-error-code-structure"],"status":"active","last_verified":"2026-08-28","content":{"errors":[{"code":"EH0001","meaning":"Invalid_Argument：Value [%s] for [%s] is invalid. Reason: %s.","module":"ACL Errors"},{"code":"EH0002","meaning":"Invalid_Argument_Null_Pointer：Argument [%s] must not be null.","solution":"Try again with a correct pointer argument.","module":"ACL Errors"},{"code":"EH0003","meaning":"File_Operation_Error_Invalid_Path：Path [%s] is invalid. Reason: %s.","module":"ACL Errors"},{"code":"EH0004","meaning":"File_Operation_Error：File [%s] is invalid. Reason: %s.","module":"ACL Errors"},{"code":"EH0005","meaning":"Invalid_Argument：AIPP argument [%s] is invalid. Reason: %s.","module":"ACL Errors"},{"code":"EH0006","meaning":"Not_Supported：%s is not supported. Reason: %s.","module":"ACL Errors"}]}}},{"id":"ai-cpu-error-codes","type":"error-code","dir":"errors","file":"references/errors/ai-cpu.yaml","title":"AI CPU 错误码（E3，15 条）","summary":"CANN 商用版 9.0.0《错误码参考》AI CPU族 15 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure","doc":{"id":"ai-cpu-error-codes","type":"error-code","title":"AI CPU 错误码（E3，15 条）","summary":"CANN 商用版 9.0.0《错误码参考》AI CPU族 15 条；meaning 取官方 symptom 原文 eout. - For a custom operator, ensure that the logic design is proper or modify the shape. - If the input and output shapes are too large, modify the shape or use the aclrtSetOpExecuteTimeOut interface to adjust the timeout.","module":"AI CPU Errors"},{"code":"E39001","meaning":"Invalid_Argument（已废弃）：The argument is invalid.","solution":"View the host log and check the argument in the error log.","module":"AI CPU Errors"},{"code":"E39002","meaning":"Inner_Error_Driver_API_Call_Failed：Failed to obtain the number of devices and the device list.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"AI CPU Errors"},{"code":"E39004","meaning":"Inner_Error_AICPU_Scheduler_Init_Failed：The AI CPU scheduler process initialization is abnormal.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"AI CPU Errors"},{"code":"E39005","meaning":"Inner_Error_TSDaemon_Process_Abnormal：The TSDaemon process initialization is abnormal.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"AI CPU Errors"},{"code":"E39006","meaning":"Inner_Error_Failed_Send_OPP_To_Device：Failed to send the OPP to the device.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"AI CPU Errors"},{"code":"E39007","meaning":"Inner_Error_Device_Subprocess_Startup_Timeout：Starting a subprocess on the device timed out.","solution":"Obtain the device log and contact technical support at https://www.hiascend.com/support.","module":"AI CPU Errors"},{"code":"E39008","meaning":"Inner_Error_Verify_NN_Process_Binary：The binary file of the NN process is damaged.","solution":"Obtain the device log, check whether ECC errors are reported, and contact technical support at https://www.hiascend.com/support.","module":"AI CPU Errors"},{"code":"E39009","meaning":"Inner_Error_Device_Status_Abnorma rors"},{"code":"EC0005","meaning":"Invalid_Argument：Value for parameter --soc_version is invalid or the config.json is not set correctly.","module":"Auto Tune Errors"},{"code":"EC0006","meaning":"Directory_Operation_Error：Directory operation failed. Reason: %s.","module":"Auto Tune Errors"},{"code":"EC0007","meaning":"Config_Error_Invalid_Environment_Variable：The environment variable argument is invalid. Value %s for environment variable %s must be less than %s.","module":"Auto Tune Errors"},{"code":"EC0008","meaning":"Config_Error_Invalid_Environment_Variable：Environment variable %s is not set. Use bash command env to check whether the environment variable is missing, and then use the export command to set it correctly.","module":"Auto Tune Errors"},{"code":"EC0009","meaning":"Resource_Error：Computing resources are insufficient. Reason: %s.","solution":"- Check whether the memory usage reaches the upper limit. - Check whether the file handle usage reaches the system limit.","module":"Auto Tune Errors"},{"code":"EC0010","meaning":"Environment_Error_Import_Python_Module_Failed：Failed to import Python module %s.","solution":"Check that all required components are properly installed and the specified Python path matches the Python installation directory. If the path does not match the directory, run set_env.sh in the installation package.","module":"Auto Tune Errors"},{"code":"EC0011","meaning":"Permission_Error_User_Denied：The permissions for current user in the custom strategy path %s are insufficient.","solution":"Check that the current user has the \\\"rwx\\\" permissions in the custom strategy file path or check that the current user is the root user.","module":"Auto Tune Errors"},{"code":"EC0012","meaning":"Config_Error_Invalid_Environment_Variable：Value %s for environment variable %s is invalid.","solution":"Reset the environment variable by referring to the product documentation.","module":"Auto Tune Errors"},{"code":"EC0013","meaning":"File_Operation_Error：File operation failed under %s. Reason: %s.","solution":"NA","module":"Auto Tune Errors"}]}}},{"id":"cann-runtime-error-codes","type":"error-code","dir":"errors","file":"references/errors/cann-runtime.yaml","title":"CANN Runtime 错误码（507xxx / 算子执行 / 拷贝类）","summary":"从 vllm-ascend case 提炼的昇腾运行时错误码：507903（cudagraph event 资源）、507018（aicpu 异常）、507057（MTE 越界）、561000（算子缺二进制/执行失败）、107030（拷贝失败）、161002（matmul dim 不匹配）","doc":{"id":"cann-runtime-error-codes","type":"error-code","title":"CANN Runtime 错误码（507xxx / 算子执行 / 拷贝类）","summary":"从 vllm-ascend case 提炼的昇腾运行时错误码：507903（cudagraph event 资源）、507018（aicpu 异常）、507057（MTE 越界）、561000（算子缺二进制/执行失败）、107030（拷贝失败）、161002（matmul dim 不匹配）","sources":[{"type":"case-derived","cases":["VLLM-ASC-12989","VLLM-ASC-9596","VLLM-ASC-13050","VLLM-ASC-12461","VLLM-ASC-14166","VLLM-ASC-10944","VLLM-ASC-12983","VLLM-ASC-12226"],"extracted_at":"2026-08-28","extraction_method":"to-reference --ingest-cases"}],"applies_to":{"platforms":["A2-910B","A3-910C","A5-950","310P"],"frameworks":["vllm-ascend"],"categories":["interrupt"]},"status":"active","hits":1,"last_hit":"2026-W36","last_verified":"2026-08-28","content":{"errors":[{"code":"507903","meaning":"Insufficient_Event_Resources——cudagraph 图模式捕获阶段 event/SQ-CQ 资源超硬件预算（Create capture event failed / capture_end error）。规避：--enforce-eager 或缩小 cudagraph_capture_sizes；310P 硬件 event 资源尤其有限。注意：AIV+RIC 组合冲突（task_group 包 HCCL all_reduce，A3-910C）也以 capture_end 507903 表现——先判别资源不足 vs 组合冲突，勿一律按资源不足处理（13688 最小复现矩阵证明）。","related_signatures":["Insufficient_Event_Resources","Create capture event failed","error code is 507903"],"source_cases":["VLLM-ASC-12989","VLLM-ASC-9596","VLLM-ASC-13688"]},{"code":"207005","meaning":"rtStreamWaitEvent execution failed, reason=driver error:resource alloc fail——stream/SQ-CQ 资源不足（与 507903 同族，PIECEWISE 混合捕获时先于 507903 出现）。","related_signatures":["rtStreamWaitEvent execution failed","resource alloc fail","Alloc sq cq fail"],"source_cases":["VLLM-ASC-9596"]},{"code":"507018","meaning":"aicpu kernel 执行异常（errorCode=0x2a）——两型：①310P 上 aicpu 内核与 vllm_ascend/_310p 路径兼容问题（如 IndexPut），0.23.0 正式版或驱动 25.x 修复；②A3-910C 多模态 LoRA adapter 激活路径（unique_consecutive，--enable-lora 启动），待上游算子适配。同码不同根因，勿套用另一型的修复。","related_signatures":["aicpu exception","IndexPut","507018","UniqueConsecutive"],"source_cases":["VLLM-ASC-13050","VLLM-ASC-10626"]},{"code":"507057","meaning":"SUSPECT REMOTE ERROR / synchronize stream with timeout failed——远端节点 MTE 地址越界等 aicore exception（如 FusedMoE MC2 通信算子在 ROCE 网络触发）。","related_signatures":["SUSPECT REMOTE ERROR","507057","aicore exception","MTE"],"source_cases":["VLLM-ASC-12461"]},{"code":"561000","meaning":"算子执行/加载失败——两型：①Cannot find binary for op（如 MoeInitRoutingV3，torch-npu <2.10.0.post4 缺算子二进制）；②aclnnMoeDistributeDispatchV4 failed（HCCL QP 资源耗尽 EI0007，EP 场景）。两型根因不同，分别按版本升级 / 关 EP 处理。","related_signatures":["561000","Cannot find binary for op","aclnnMoeDistributeDispatchV4 failed"],"source_cases":["VLLM-ASC-14166","VLLM-ASC-10944"]},{"code":"107030","meaning":"aclrtMemcpy 失败——图模式下 copy_between_host_and_device_opapi 复制失败（310P MTP 与图模式冲突时出现，与 free-mask 算子缺失相关）。","related_signatures":["aclrtMemcpy","107030","synchronize captured-stream"],"source_cases":["VLLM-ASC-12983"]},{"code":"161002","meaning":"aclnnGroupedMatmulV5 dim 不匹配（EZ1001）——wake_up 后 MoE 权重双重转置导致 K 维错位（3072 vs 2048）。","related_signatures":["aclnnGroupedMatmulV5 failed","161002","EZ1001"],"source_cases":["VLLM-ASC-12226"]},{"code":"507009","meaning":"rtEventRecord task not supported——AIV 模式下 torch.npu.graph_task_group_begin 包 HCCL all_reduce 时图捕获失败（组合冲突，非资源不足）；与 507903（capture_end）同现。规避：禁用 AIV 或回退 RIC。","related_signatures":["rtEventRecord task not supported","507009","graph_task_group"],"source_cases":["VLLM-ASC-13688"]},{"code":"507015","meaning":"aicore execution 异常（AclNN_Runtime_Error EZ9903，aclrtLaunchKernelWithHostArgs failed，error code 0x26）——量化 matmul 算子（QuantBatchMatMulV3）在该 CANN 版本 bug 触发（310P w8a8 推理，QuantBatchMatMulV3_NZ_NZ_int8_int8_fp16）；升级 CANN ≥9.1.0.beta2 修复。","relat
