ileNum/Size（debug/device-os 数量与单文件大小）、DeviceOsNdebugMaxFileNum/Size（run/security 的 device-os）、DeviceMaxFileNum/Size（device-id）、DeviceAppDirNums（device-app-pid 目录数）、DeviceAppMaxFileNum/Size（每目录文件数量与单文件大小）——超数量滚动覆盖最早日志，单文件小于 1MB 默认按 1MB","buffers":"SysLogBufSize（系统日志缓冲区）、AppLogBufSize（应用类日志缓冲区）","logAgentFileDir":"日志文件路径，最长 255 字节、超长自动截断；需确保运行日志进程的用户对该路径有读写权限","permission_for_all":"0 仅支持 slogd 运行用户启动 APP 写日志 / 1 支持不同属组用户启动 APP 写日志"},"pitfalls":["配置项须按建议值或取值范围设置，不按配置要求可能导致系统异常","手动修改配置文件后必须重启 slogd 进程才生效","Ascend EP 标准形态无此文件，无需修改"]}}},{"id":"ascend-device-log-ops","type":"tool","dir":"tools","file":"references/tools/ascend-device-log-ops.yaml","title":"Device 日志排查操作（RAS 故障 ID / 资源占用 / 进程拉起与结束时间）","summary":"三组常用 Device 日志操作：①msnpureport -f 导出后在 event_*.log 搜 event_id 查 RAS 故障码（npu-smi info -t health 兜底查最近 8 次故障）；②Device 日志 SYSMONITOR 看 fd usage（阈值 90%）与僵尸进程（阈值 5）；③导出后 device-os 日志 grep ringbuffer 确认进程拉起（create_ringbuffer）与结束（delete_ringbuffer）时间","doc":{"id":"ascend-device-log-ops","type":"tool","title":"Device 日志排查操作（RAS 故障 ID / 资源占用 / 进程拉起与结束时间）","summary":"三组常用 Device 日志操作：①msnpureport -f 导出后在 event_*.log 搜 event_id 查 RAS 故障码（npu-smi info -t health 兜底查最近 8 次故障）；②Device 日志 SYSMONITOR 看 fd usage（阈值 90%）与僵尸进程（阈值 5）；③导出后 device-os 日志 grep ringbuffer 确认进程拉起（create_ringbuffer）与结束（delete_ringbuffer）时间","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0103.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0103/0104/0105）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"tool_name":"Device 日志排查操作（msnpureport 导出 + 关键字解读）","invocation":"RAS 硬件故障排查、资源占用查看、进程生命周期确认均基于 Device 侧日志：EP 形态先 msnpureport -f 导出（默认输出 /var/log/npu/report，需在有读写执行权限的目录执行），再在导出目录按关键字 grep；RC 形态直接查板端 /var/log/npu/slog","commands":{"ras_fault_id":"msnpureport -f 导出后，在 slog/dev-os-id/run/event/event_*.log 搜 event_id 获取 RAS 硬件故障码，查《健康管理故障定义》对应版本手册；event 日志被覆盖时 npu-smi info -t health -i <id> -c <chip_id> 可查最近 8 次故障；黑匣子 hisi_logs/device-id/*/bbox 搜 Hardware Error 确认硬件故障","resource_usage":"Device 日志 SYSMONITOR 记录：fd usage alarm（文件句柄使用率超 90% 阈值告警，含 top 进程 pid+fd 数）与 fd usage stat（一小时周期统计）；zombie process count alarm（僵尸进程数超 5 阈值）与 zombie process count stat","process_lifetime":"EP：msnpureport -f 导出后，在 /var/log/npu/report/*/slog/device-os-0/[run|debug]/device-0 下 grep -rn ringbuffer；RC：直接 /var/log/npu/slog/[run|debug]/device-0 下 grep -rn ringbuffer。create_ringbuffer 表示进程拉起（含 ringbuffer_addr 关键字的日志时间=拉起时间），delete_ringbuffer 表示进程结束（最后一次=结束时间）"},"pitfalls":["event 日志距问题时间较远时可能已被覆盖/清理，导致搜不到 event_id——用 npu-smi health 兜底","每次创建 ringbuffer 前都会先删除（日志含 delete_ringbuffer+create_ringbuffer 对），同进程多次 create 时取含 ringbuffer_addr 的那条"]}}},{"id":"ascend-asys","type":"tool","dir":"tools","file":"references/tools/ascend-asys.yaml","title":"asys 故障信息收集与解析工具（仅 Ascend EP 形态）","summary":"asys 一键式收集故障信息并解析 plog 伴侣文件：collect/launch 收集（含业务复跑）、info 状态展示、health 健康检查、diagnose 压测检测（stress/hbm/cpu）、analyze 解析（trace/coredump/stackcore/coretrace/ub/aicore_error）、profiling 性能采集、实时堆栈导出；仅支持 Ascend EP 形态","doc":{"id":"ascend-asys","type":"tool","title":"asys 故障信息收集与解析工具（仅 Ascend EP 形态）","summary":"asys 一键式收集故障信息并解析 plog 伴侣文件：collect/launch 收集（含业务复跑）、info 状态展示、health 健康检查、diagnose 压测检测（stress/hbm/cpu）、analyze 解析（trace/coredump/stackcore/coretrace/ub/aicore_error）、profiling 性能采集、实时堆栈导出；仅支持 Ascend EP 形态","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0096.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0096/0097/0501-0517/0538）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-trace-logs","ascend-msaicerr"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"tool_name":"asys（故障信息收集工具，一键式收集并解析故障信息）","invocation":"仅支持 Ascend EP 形态；用于收集软硬件信息/日志（不复跑或复跑后收集）、展示 Device 状态、健康检查、压力检测、解析 trace/coredump/stackcore/coretrace/UB/AI Core Error 文件、采集 AI Core 性能数据、导出实时堆栈。trace 日志的 .bin 与 stackcore 文件解析走此工具（见 ascend-trace-logs）","commands":{"collect":"asys collect --task_dir=<path> --tar=True --output=<path>（故障信息收集，产物含 software_info/hardware_info/status_info/health_result.txt 与 dfx 目录）","launch":"asys launch --task=\"sh app_run.sh\" --tar=True --output=<path>（业务复跑+故障信息收集）","info":"asys info -r=status -d=<deviceId>（软硬件、Device 状态展示：芯片型号/功率/温度/利用率）","health":"asys health -d=<deviceId>（健康检查，不健康时展示报错信息）","diagnose":"asys diagnose -r={stress_detect|hbm_detect|cpu_detect|component} -d=<deviceId> --output=<path>（AI Core 压力/HBM/CPU/组件检测；stress 耗时可能较长）","analyze":"asys analyze -r={trace|coredump|stackcore|coretrace|ub|aicore_error} --file=<path> --symbol_path=<path1,path2> --output=<path>（文件解析；coredump 需 --exe_file+--core_file；stackcore/coretrace 支持 --path 目录；aicore_error 用 --path 指定信息目录）","profiling":"asys profiling -r=aicore -p=<time> -d=<deviceId> --output=./ --aic_metrics=PipeUtilization（AI Core 性能数据采集，底层调 msprof）","stacktrace":"asys collect -r=stacktrace --remote=<pid> --all（实时堆栈导出，向目标进程发信号 35；ASCEND_COREDUMP_SIGNAL=none 时进程会被杀掉）","config":"asys config -d=<deviceId> --get/--restore --stress_detect（压测相关配置查询与恢复）"},"output_meaning":["collect 产物：software_info.txt（安装包版本/环境变量/依赖/系统信息）、hardware_info.txt（host+device 硬件信息）、status_info.txt（芯片型号/CPU 与 AI Core 利用率）、health_result.txt（故障码与故障信息）、dfx/","stackcore/coretrace 解析输出进程崩溃原因、pid/tid、栈帧与符号地址","ub 解析把 ubnl_dfx_statistic.bin 等转换为文本"],"pitfalls":["ctrl+z 中止业务复跑任务会残留任务进程（可能仍在重定向写文件），与后续 asys 复跑冲突——复跑前先查询并手工 kill 相关推理/训练进程","实时堆栈导出超时报 Generating the stackcore bin file timeout：初始化未完成（plog 搜 attr init success）、ASCEND_COREDUMP_SIGNAL=none 关闭信号集（plog 搜 close the signal capture function）、或业务已结束资源释放（plog 搜 unregister all signal handlers）","仅 Ascend EP 形态支持，RC/Control CPU 开放形态不可用"]}}},{"id":"ascend-msaicerr","type":"tool","dir":"tools","file":"references/tools/ascend-msaicerr.yaml","title":"msaicerr AI Core Error 专项分析工具","summary":"msaicerr 分析 AI Core Error 问题（输出 info.txt 分析报告）、解析 Dump 文件、转换 Dump 数据类型、检查环境；不支持 MatmulAllReduce 类算子（7 个）的 AI Core Error 分析","doc":{"id":"ascend-msaicerr","type":"tool","title":"msaicerr AI Core Error 专项分析工具","summary":"msaicerr 分析 AI Core Error 问题（输出 info.txt 分析报告）、解析 Dump 文件、转换 Dump 数据类型、检查环境；不支持 MatmulAllReduce 类算子（7 个）的 AI Core Error 分析","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0099.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0099/0531-0535）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-asys"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"tool_name":"msaicerr（AI Core Error 专项分析工具）","invocation":"AI Core Error 问题定位中，对收集的 exception dump/日志信息执行分析，输出分析报告（info.txt）供定位或提交技术支持；也可单独解析 Dump 文件与转换 Dump 数据类型（bin→npy）、检查环境（-e 用 golden op 自检）","commands":{"analyze":"python3 msaicerr.py -p <path1> -out <path2> -dev <deviceId>（分析 AI Core Error 问题，适用于报错 there is an xx aicore/aivec error）","dump_parse":"python3 msaicerr.py -d <path1> -out <path2>（解析 Dump 文件，输出到指定目录）","dump_convert":"python3 msaicerr.py -d <path1> -out <path2> -dtype <int8 等>（转换 Dump 文件数据类型，bin→npy）","env_check":"python3 msaicerr.py -e [-dev <deviceId>]（检查环境：设备有效性、soc_version、golden op 测试）"},"pitfalls":["暂不支持分析以下算子的 AI Core Error：MatmulAllReduceAddRmsNorm、MatmulAllReduceInplaceAddRmsNorm、AllGatherMatmul、MatmulReduceScatter、GroupedMatmulAllReduce、MemSet、NonMaxSuppressionBucketize"]}}},{"id":"ascend-stack-view","type":"tool","dir":"tools","file":"references/tools/ascend-stack-view.yaml","title":"查看 Python / C&C++ 应用程序堆栈（py-spy / gdb）","summary":"卡住进程取堆栈：Python 用 py-spy dump -p <pid> > pyspy.log（不中断进程）；C/C++ 用 gdb -p <pid> 后 bt 查看调用栈（需安装 gdb）；进程中断/卡住定位的宿主侧配合手段","doc":{"id":"ascend-stack-view","type":"tool","title":"查看 Python / C&C++ 应用程序堆栈（py-spy / gdb）","summary":"卡住进程取堆栈：Python 用 py-spy dump -p <pid> > pyspy.log（不中断进程）；C/C++ 用 gdb -p <pid> 后 bt 查看调用栈（需安装 gdb）；进程中断/卡住定位的宿主侧配合手段","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0106.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0106）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-process-hang-triage"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"tool_name":"py-spy / gdb（查看 Python、C&C++ 应用堆栈）","invocation":"进程卡住或中断定位时查看宿主侧调用栈：Python 应用用 py-spy dump 导出堆栈到文件；C/C++ 应用用 gdb attach 后 bt 打印调用栈","commands":{"python":"py-spy dump -p <pid> > pyspy.log（将指定进程堆栈导出到文件）","cpp":"gdb -p <pid> 后执行 bt 查看调用栈（环境未装 gdb 时用包管理安装：apt-get install gdb / yum install gdb）"},"pitfalls":["py-spy 导出时若进程在等待锁（如 multiprocessing pool join），堆栈会显示 poll/wait/join 等阻塞帧——配合业务代码定位"]}}},{"id":"ascend-log-levels","type":"tool","dir":"tools","file":"references/tools/ascend-log-levels.yaml","title":"设置日志级别（应用类环境变量 / 系统类 msnpureport 或 slog.conf）","summary":"日志级别序 0 DEBUG < 1 INFO < 2 WARNING < 3 ERROR < 4 NULL 不输出；调试日志默认 ERROR 可调、安全日志默认 DEBUG 不可调、运行日志默认 INFO 不可调；应用类用 ASCEND_GLOBAL_LOG_LEVEL 等环境变量，系统类 EP 用 msnpureport、RC 改 slog.conf 后重启 slogd","doc":{"id":"ascend-log-levels","type":"tool","title":"设置日志级别（应用类环境变量 / 系统类 msnpureport 或 slog.conf）","summary":"日志级别序 0 DEBUG < 1 INFO < 2 WARNING < 3 ERROR < 4 NULL 不输出；调试日志默认 ERROR 可调、安全日志默认 DEBUG 不可调、运行日志默认 INFO 不可调；应用类用 ASCEND_GLOBAL_LOG_LEVEL 等环境变量，系统类 EP 用 msnpureport、RC 改 slog.conf 后重启 slogd","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/logreference/logreference_0008.html","version":"CANN 商用版 9.0.0（日志参考 logreference_0008）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-slog-conf"],"status":"active","last_verified":"2026-08-28","content":{"tool_name":"日志级别设置（ASCEND_GLOBAL_LOG_LEVEL / msnpureport / slog.conf）","invocation":"应用类日志级别通过环境变量设置：ASCEND_GLOBAL_LOG_LEVEL 设全局级别、ASCEND_MODULE_LOG_LEVEL 设模块级（如 TDT=0:DRV=0）、ASCEND_GLOBAL_EVENT_ENABLE 控制是否开启 Event 日志；系统类日志级别 Ascend EP 形态用 msnpureport 工具设置、Ascend RC 形态修改 Device 侧 /etc/slog.conf 后重启 slogd（见 ascend-slog-conf）","level_definitions":{"0":"DEBUG 调试级别，记录调试信息，便于开发/维护人员定位问题","1":"INFO 正常级别，记录系统正常运行的信息","2":"WARNING 警告级别，记录与预期不一致但不影响系统运行的信息","3":"ERROR 一般错误级别，记录非预期数据或事件、模块内可处理错误、影响其他模块的轻微错误等","4":"NULL 级别，不输出日志"},"pitfalls":["调试日志默认 ERROR、可调；安全日志默认 DEBUG、不可调；运行日志默认 INFO、不可调","slog.conf 中模块级别 5 表示跟随全局级别（见 ascend-slog-conf），不是合法日志级别"]}}},{"id":"ascend-restart-slogd","type":"tool","dir":"tools","file":"references/tools/ascend-restart-slogd.yaml","title":"重启 Device 侧日志进程 slogd","summary":"修改日志配置或日志进程异常后重启 slogd：kill -15 <pid> 让其清理共享内存后自动拉起（反复失败才用 -9），ps -elf | grep log 确认；重启后系统类日志续写未满旧文件、应用类写全新文件；需 Device 侧登录权限，EP 形态无此权限","doc":{"id":"ascend-restart-slogd","type":"tool","title":"重启 Device 侧日志进程 slogd","summary":"修改日志配置或日志进程异常后重启 slogd：kill -15 <pid> 让其清理共享内存后自动拉起（反复失败才用 -9），ps -elf | grep log 确认；重启后系统类日志续写未满旧文件、应用类写全新文件；需 Device 侧登录权限，EP 形态无此权限","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/logreference/logreference_0012.html","version":"CANN 商用版 9.0.0（日志参考 logreference_0012/0024）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"related_references":["ascend-slog-conf"],"status":"active","last_verified":"2026-08-28","content":{"tool_name":"slogd 日志进程重启","invocation":"修改 Device 侧日志配置文件后必须重启日志进程使配置生效；执行 kill -15 <slogd pid>（让 slogd 清理共享内存），进程会自动拉起，用 ps -elf | grep log 确认进程存在；反复重启失败才用 kill -9；/var 磁盘空间 100% 会导致日志进程启动失败；用户需有登录 Device 侧的权限（Ascend EP 形态无此权限，无法重启）","restart_behavior":{"system":"系统类日志：进程重启后判断上一个日志文件容量，未达上限则新日志继续写入上一个日志文件","app":"应用类日志：进程重启后写入全新的日志文件（即使之前文件未达上限）"},"pitfalls":["勿直接 kill -9——优先 kill -15 让 slogd 清理共享内存，反复失败才用 -9","Ascend EP 形态无 Device 侧登录权限，无法重启日志进程"]}}},{"id":"ascend-310p-known-limits","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/ascend-310p-known-limits.yaml","title":"310P（Atlas 300I Duo）平台已知限制","summary":"310P 平台特有限制：event 资源有限（cudagraph 捕获超限）、aicpu IndexPut 异常（驱动版本相关）、MTP 与图模式不可同时开启（缺 free-mask 算子）","doc":{"id":"ascend-310p-known-limits","type":"platform-fact","title":"310P（Atlas 300I Duo）平台已知限制","summary":"310P 平台特有限制：event 资源有限（cudagraph 捕获超限）、aicpu IndexPut 异常（驱动版本相关）、MTP 与图模式不可同时开启（缺 free-mask 算子）","sources":[{"type":"case-derived","cases":["VLLM-ASC-12989","VLLM-ASC-13050","VLLM-ASC-12983"],"extracted_at":"2026-08-28","extraction_method":"to-reference --ingest-cases"}],"applies_to":{"platforms":["310P"],"frameworks":["vllm-ascend"],"categories":["interrupt"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"310P（Atlas 300I Duo）是独立于 A2/A3/A5 的平台，vllm-ascend 下有已知限制：①event 资源有限——FULL_DECODE_ONLY 多尺寸 cudagraph 捕获超上限报 507903（VLLM-ASC-12989）；②aicpu kernel IndexPut 执行异常（errorCode=0x2a, runtime 507018），0.23.0 正式版或驱动 25.x 修复（VLLM-ASC-13050）；③MTP 与图模式不可同时开启——镜像缺 free-mask 算子（VLLM-ASC-12983）。排查 310P 问题时应先考虑这些平台特有限制，再查通用路径。","evidence":"三条 vllm-ascend case（12989/13050/12983）的 root_cause 均指向 310P 平台特有限制，非通用路径；case platforms 字段均为 310P。"}}},{"id":"a5-950dt-memory-spec","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-950dt-memory-spec.yaml","title":"A5 950DT 片上内存规格（144GB / 4TB/s）","summary":"昇腾950DT 单芯片最高 144GB / 4TB/s 高速片上内存，覆盖大模型全生命周期","doc":{"id":"a5-950dt-memory-spec","type":"platform-fact","title":"A5 950DT 片上内存规格（144GB / 4TB/s）","summary":"昇腾950DT 单芯片最高 144GB / 4TB/s 高速片上内存，覆盖大模型全生命周期","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950DT"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950DT 单芯片提供最高 144GB 容量、4TB/s 带宽的高速片上内存（衍生规格 96GB）；专为大模型全生命周期（预训练、后训练、推理含 Decode 与 Prefill）打造，突破内存墙瓶颈。","evidence":"白皮书 §2 引言（p.8）、§3 架构概述（p.10）与表 3-1（p.13-14）：『昇腾950DT 则聚焦大模型全量训练与复杂推理，配备144GB、4TB/s 高速片上内存』『Memory 容量（GB）144/96，带宽 4』"}}},{"id":"a5-950pr-memory-spec","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-950pr-memory-spec.yaml","title":"A5 950PR 片上内存规格（128GB / 1.6TB/s）","summary":"昇腾950PR 单芯片最高 128GB / 1.6TB/s 高速片上内存，面向推荐、LLM Prefill、多模态推理","doc":{"id":"a5-950pr-memory-spec","type":"platform-fact","title":"A5 950PR 片上内存规格（128GB / 1.6TB/s）","summary":"昇腾950PR 单芯片最高 128GB / 1.6TB/s 高速片上内存，面向推荐、LLM Prefill、多模态推理","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950PR"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950PR 单芯片提供最高 128GB 容量、1.6TB/s 带宽的高速片上内存（衍生规格 112GB / 1.4TB/s）；主要面向高性能推荐系统、LLM Prefill（预填充）阶段及多模态推理场景，兼顾高吞吐与低延迟。","evidence":"白皮书 §2 引言（p.8）、§3 架构概述（p.10）与表 3-1 规格表（p.13-14）：『昇腾950PR：配备128GB、1.6TB/s 高速片上内存』『Memory 容量（GB）128/112，带宽 1.6/1.4』"}}},{"id":"a5-ai-subsystem-compute-spec","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-ai-subsystem-compute-spec.yaml","title":"A5 AI 子系统数量与算力规格（Cube/Vector 数量 + TFLOPS 表）","summary":"昇腾950 共 36 个 AI 子系统（各 1 Cube + 2 Vector）；Cube 数量 950PR 32/28、950DT 36/32/28；算力随精度格式分级","doc":{"id":"a5-ai-subsystem-compute-spec","type":"platform-fact","title":"A5 AI 子系统数量与算力规格（Cube/Vector 数量 + TFLOPS 表）","summary":"昇腾950 共 36 个 AI 子系统（各 1 Cube + 2 Vector）；Cube 数量 950PR 32/28、950DT 36/32/28；算力随精度格式分级","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950PR/950DT 均含 36 个基于第三代 DaVinci 架构的 AI 子系统（每个 AI 子系统 = 1 个 Cube Core + 2 个 Vector Core）；Cube Core 数量 950PR 为 32/28、950DT 为 36/32/28（不同衍生规格）；Vector Core 数量 950PR 为 64/56、950DT 为 72/64/56。Cube+Vector 总算力（TFLOPS）：MXFP4 950PR 1784/1561、950DT 2007/1784/1561；HiF8/MXFP8/FP8 950PR 919/804、950DT 1034/919/804；INT8（TOPS）同 FP8 档；BF16/FP16 950PR 486/425、950DT 547/486/425；TF32 950PR 243/212、950DT 273/243/212。Vector 单核算力 FP16/BF16 54/47（PR）vs 60/54/47（DT），FP32 27/23 vs 30/27/23。","evidence":"白皮书 §3 表 3-1 规格表（PDF p.13-14）：『36 个基于第三代Davinci 架构的AI 子系统，每个AI 子系统包括1 个Cube Core 和2 个Vector Core』及各档算力数值"}}},{"id":"a5-ccu-algorithms","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-ccu-algorithms.yaml","title":"A5 CCU 集合通信算法支持（Broadcast/ReduceScatter/AllGather/AllReduce/All2All/All2Allv）","summary":"CCU 硬件执行 6 种集合通信算法；CCUM Mission 接口 + CCUA（MemorySlice 存储 + Reduce Unit 计算）","doc":{"id":"a5-ccu-algorithms","type":"platform-fact","title":"A5 CCU 集合通信算法支持（Broadcast/ReduceScatter/AllGather/AllReduce/All2All/All2Allv）","summary":"CCU 硬件执行 6 种集合通信算法；CCUM Mission 接口 + CCUA（MemorySlice 存储 + Reduce Unit 计算）","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 集合通信处理引擎 CCU 支持的典型算法：Broadcast、Reduce Scatter、All Gather、All Reduce、All2All、All2Allv。执行模型：集合通信展开为多项并行小颗粒度任务循环执行；软件通过 CCUM（CCU Management）的 Mission 任务接口编程，硬件解析指令后判断执行 Reduce 计算还是 URMA 搬运；CCU Agent（CCUA）集成 MemorySlice 作数据存储、Reduce Unit 作数据计算；URMA 搬运可完成远端到本端 DRAM 或 MemorySlice 的灵活数据搬运；完成后通过 Mission 接口上报状态。","evidence":"白皮书 §4.6.4 CCU（PDF p.32-33）：『Broadcast / Reduce Scatter / All Gather / All Reduce / All2All / All2Allv』『CCUM（CCU Management）中的Mission 任务』『CCUA 中集成了MemorySlice 用作数据存储，集成了Reduce Unit 用作数据计算』"}}},{"id":"a5-ccu","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-ccu.yaml","title":"A5 CCU 集合通信计算加速单元","summary":"CCU 硬件卸载集合通信任务，计算通信深度并行，释放 AI Core 算力","doc":{"id":"a5-ccu","type":"platform-fact","title":"A5 CCU 集合通信计算加速单元","summary":"CCU 硬件卸载集合通信任务，计算通信深度并行，释放 AI Core 算力","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 集成 CCU（集合通信计算加速单元）：实现计算与通信的深度并行，显著降低对主存（Memory）的占用及 IO 调度延迟；通过硬件卸载集合通信任务，释放 AI Core 算力。CCU 是大规模集合通信（allreduce/allgather/alltoall）性能分析时的硬件背景——通信开销可被硬件卸载，与 A2 的 HCCL 软件路径行为不同。","evidence":"白皮书 §3 通信加速（p.12）：『CCU（集合通信计算加速单元）实现计算与通信的深度并行，显著降低对主存（Memory）的占用及IO 调度延迟』『通过硬件卸载集合通信任务，释放AI Core 算力』"}}},{"id":"a5-cube-core-spec","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-cube-core-spec.yaml","title":"A5 Cube Core 规格（数值格式算力倍率、L0C Buffer、随路量化）","summary":"第三代 Cube：FP8/MXFP8/HiF8 提供 2 倍 FP16 TFLOPS、MXFP4 提供 4 倍；更大 L0C Buffer；回写 UB 时随路量化（FP32→BF16/FP16/FP8、NZ→ND/DN）","doc":{"id":"a5-cube-core-spec","type":"platform-fact","title":"A5 Cube Core 规格（数值格式算力倍率、L0C Buffer、随路量化）","summary":"第三代 Cube：FP8/MXFP8/HiF8 提供 2 倍 FP16 TFLOPS、MXFP4 提供 4 倍；更大 L0C Buffer；回写 UB 时随路量化（FP32→BF16/FP16/FP8、NZ→ND/DN）","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 第三代 Cube Core：新增 MXFP8、HiF8 及 MXFP4 低比特浮点张量计算；相同频率下 HiF8/MXFP8/FP8 提供 2 倍 FP16 浮点张量 TFLOPS、MXFP4 提供 4 倍 TFLOPS（张量浮点峰值算力较上一代提升至 4 倍）；更大的 L0C Buffer 提供更灵活 Tiling 与更高数据复用率；支持按需张量结果即时格式转换，回写 Unified Buffer 阶段直接完成数据量化（FP32 到 BF16/FP16/FP8）与排布转换（NZ 到 ND/DN）；支持 L0C Buffer→Unified Buffer 随路量化（FP32/INT32 量化到 BF16/FP16/FP8/INT8）。","evidence":"白皮书 §4.1.1 CUBE CORE（PDF p.17-18）：『HiF8/MXFP8/FP8 能够提供2 倍的FP16 浮点张量计算TFLOPS，MXFP4 数据类型能提供4 倍TFLOPS』『更大的L0C Buffer』『回写Unified Buffer 阶段直接完成数据量化与排布转换』"}}},{"id":"a5-cv-fusion","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-cv-fusion.yaml","title":"A5 Cube-Vector 融合（CV 直连通道、FlashAttention 内部通路、随路转换）","summary":"Cube L1 Buffer 与 Vector Unified Buffer 直连通道；FA 带宽瓶颈的 Cube-Vector 内部数据通路；传输时随路精度/排布转换","doc":{"id":"a5-cv-fusion","type":"platform-fact","title":"A5 Cube-Vector 融合（CV 直连通道、FlashAttention 内部通路、随路转换）","summary":"Cube L1 Buffer 与 Vector Unified Buffer 直连通道；FA 带宽瓶颈的 Cube-Vector 内部数据通路；传输时随路精度/排布转换","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 支持 Cube-Vector（CV）融合：Cube L1 Buffer 与 Vector Unified Buffer 之间提供直接 CV 数据传递通道，提高核内数据复用率、减少 L2 层数据交换；针对 FlashAttention 的带宽瓶颈，支持 Cube Core 与 Vector Core 之间的内部数据通路实现高效融合；支持 Cube-Vector 间传输数据时进行随路数值精度和数据排布转换，进一步提升端到端吞吐与能效。","evidence":"白皮书 §4.1.4 支持CV 融合（PDF p.22）：『支持Cube L1 Buffer 和Vector Unified Buffer 的直接CV 数据传递通道』『针对FlashAttention 的带宽瓶颈，支持Cube Core 和Vector Core 之间的内部数据通路』『在Cube Core 和Vector Core 之间传输数据时进行随路数值精度和数据排布转换』"}}},{"id":"a5-l2-cache-detail","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-l2-cache-detail.yaml","title":"A5 L2 Cache 微架构与 Cache 管理（512B Cache Line、L2 hint、CMO）","summary":"A5 L2 Cache 512B Cache Line + 128B Sector，2 Die UMA 跨 Die 访问，硬件一致性，L2 hint 分配/替换策略，SDMA CMO（Prefetch/Writeback/Invalid/Flush）","doc":{"id":"a5-l2-cache-detail","type":"platform-fact","title":"A5 L2 Cache 微架构与 Cache 管理（512B Cache Line、L2 hint、CMO）","summary":"A5 L2 Cache 512B Cache Line + 128B Sector，2 Die UMA 跨 Die 访问，硬件一致性，L2 hint 分配/替换策略，SDMA CMO（Prefetch/Writeback/Invalid/Flush）","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 L2 Cache 微架构与管理：Chiplet 2 Die UMA 架构、整芯片统一地址空间，可跨 Die 访问 L2（具局部亲和性），硬件维护 2 Die 间一致性；多 Bank 分布式架构、512B 低位交织（高位异或交织）；Cache Line 粒度 512B，支持 128B Sector Cache（128B/256B 访问更高效）；每个 Bank 支持同时读写。Cache 管理：L2 hint 策略（programmer 配置 allocate/victim，如 non-allocate hint 让中间数据直接写 Global Memory）；SDMA 的 Cache Maintenance Operation（CMO）支持预取 Prefetch、预写回 Writeback、无效化 Invalid、冲刷 Flush。","evidence":"白皮书 §4.3.2 L2 Cache 特性（PDF p.26-27）：『Cache Line 粒度512B，新增支持128B Sector Cache 特性』『L2 hint 策略』『CMO，包括预取（Prefetch）、预写回（Writeback）、无效化（Invalid）、冲刷（Flush）』"}}},{"id":"a5-memory-hierarchy","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-memory-hierarchy.yaml","title":"A5 Memory 层次与容量（表 4-2）","summary":"昇腾950 Memory 层次：L1 512KB、L0A/L0B 64KB、L0C 256KB、Unified Buffer 512KB（per AI Core）；CPU L1 64KB/L2 1MB/L3 4MB；L2 ≤128MB；片上内存 PR≤128GB、DT≤96/144GB","doc":{"id":"a5-memory-hierarchy","type":"platform-fact","title":"A5 Memory 层次与容量（表 4-2）","summary":"昇腾950 Memory 层次：L1 512KB、L0A/L0B 64KB、L0C 256KB、Unified Buffer 512KB（per AI Core）；CPU L1 64KB/L2 1MB/L3 4MB；L2 ≤128MB；片上内存 PR≤128GB、DT≤96/144GB","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 Memory 层次（表 4-2）：L1 Buffer 512KB/AI Core；L0A Buffer 64KB/AI Core；L0B Buffer 64KB/AI Core；L0C Buffer 256KB/AI Core；Unified Buffer（UB）512KB/AI Core；CPU L1 Cache 64KB/CPU Core；CPU L2 Cache 1MB/CPU Core；L3 Cache 4MB/CPU Cluster；L2 Cache 最高 128MB；高速片上内存 950PR 最高 128GB、950DT 最高 96/144GB。L2 主要服务 AIC/AIV 的 AI 计算，L3 主要服务 AI CPU 的通用计算。","evidence":"白皮书 §4.3 Memory 子系统与表 4-2（PDF p.25）：『昇腾950 系列芯片主要Memory 的缓存大小如下表所示』"}}},{"id":"a5-nddma","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-nddma.yaml","title":"A5 NDDMA 指令（多维数据排布转换、5 维重排、128B 读合并）","summary":"NDDMA 硬化地址生成，最多 5 维数据重排，128B 读操作合并，降低数据搬运编程复杂度","doc":{"id":"a5-nddma","type":"platform-fact","title":"A5 NDDMA 指令（多维数据排布转换、5 维重排、128B 读合并）","summary":"NDDMA 硬化地址生成，最多 5 维数据重排，128B 读操作合并，降低数据搬运编程复杂度","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 新增 NDDMA（N-dimensional Direct Memory Access）指令：支持对全局内存数据做最多 5 个维度的重排操作后存储至 Vector Core 的 Unified Buffer，可同时完成数据搬运与重排/转置；硬化地址生成逻辑加快地址生成，内置缓存最大限度降低冗余访存；自动发掘数据局部性，将多个数据元素粒度的读操作转换为 128 字节读操作。","evidence":"白皮书 §4.1.5 新增NDDMA 指令（PDF p.22-23）：『NDDMA 指令可以对全局内存中的数据做最多5 个维度的重排操作』『内置缓存能自动发掘数据局部性，并将多个数据元素粒度的读操作转换为128 字节的读操作』"}}},{"id":"a5-pcie5-spec","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-pcie5-spec.yaml","title":"A5 PCIe 5.0 规格（x16 128GB/s、EP/RC 静态选择、DMA/MCTP）","summary":"昇腾950 支持 PCIe GEN5 1x16/1x8/1x4/1x2，128GB/s 双向，EP/RC 双模静态选择，支持 DMA、MCTP 加速器","doc":{"id":"a5-pcie5-spec","type":"platform-fact","title":"A5 PCIe 5.0 规格（x16 128GB/s、EP/RC 静态选择、DMA/MCTP）","summary":"昇腾950 支持 PCIe GEN5 1x16/1x8/1x4/1x2，128GB/s 双向，EP/RC 双模静态选择，支持 DMA、MCTP 加速器","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 PCIe 规格：支持 PCIe GEN5 协议（向下兼容 GEN4/3/2/1）；支持 1x16/1x8/1x4/1x2 Link 模式（1 个 x16 Port，可向下降 Lane 到 x8、x4，Port 数不变）；支持 EP 与 RC 两种工作模式（静态选择）；双向带宽 128GB/s；支持 DMA、MCTP 加速器。","evidence":"白皮书 §3 表 3-1 IO 规格（PDF p.15）与 §4.6.6 PCIe 5.0（PDF p.35）：『PCIe 5.0 x16，128GB/s 双向』『支持标准的PCIe GEN5 协议，向下兼容GEN4/3/2/1』『支持EP 与RC 两种工作模式，模式静态选择』『支持DMA、MCTP 加速器』"}}},{"id":"a5-simd-simt-mixed","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-simd-simt-mixed.yaml","title":"A5 SIMD/SIMT 混合编程架构（SIMD 为主、SIMT 为辅）","summary":"昇腾950 DaVinci Core 采用 SIMD 为主 / SIMT 为辅的混合编程；SIMT 面向离散访问与复杂分支；Vector Function（VF）支持快速切换","doc":{"id":"a5-simd-simt-mixed","type":"platform-fact","title":"A5 SIMD/SIMT 混合编程架构（SIMD 为主、SIMT 为辅）","summary":"昇腾950 DaVinci Core 采用 SIMD 为主 / SIMT 为辅的混合编程；SIMT 面向离散访问与复杂分支；Vector Function（VF）支持快速切换","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 DaVinci Core 采用新同构 SIMD/SIMT 混合编程架构，以 SIMD 为主、SIMT 为辅：大部分向量计算由 SIMD 承担（双发 ALU 指令 + 乱序执行，单指令处理多数据）；SIMT 作为差异化增强特性，面向离散访问（Gather/Scatter）、复杂分支计算（如 Hash Insert）等场景。基本函数块定义为 Vector Function（VF），每个 VF 可选择 SIMD 或 SIMT 方式实现并支持快速切换；规则访存的 element-wise 计算优先 SIMD，不规则/含分支部分用 SIMT。","evidence":"白皮书 §4.1（PDF p.17）与 §4.1.3 新同构SIMD/SIMT 混合编程（PDF p.21）：『以SIMD 为主、SIMT 为辅』『SIMT 则作为差异化增强特性，面向离散访问（如Gather/Scatter 操作）、复杂分支计算』『每个VF 可选择以SIMD 或SIMT 方式实现，并支持在两种不同类型VF 之间快速切换』"}}},{"id":"a5-stars2-scheduler","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-stars2-scheduler.yaml","title":"A5 STARS 2.0 任务调度器（HSCB、任务流、Group、资源池）","summary":"STARS 2.0 调度 AIC/AIV/CPU/DVPP/SDMA/UB/CCU；HSCB ns 级调度；2048 任务流下沉；8 Group 亲和性调度；16 资源池算力切分","doc":{"id":"a5-stars2-scheduler","type":"platform-fact","title":"A5 STARS 2.0 任务调度器（HSCB、任务流、Group、资源池）","summary":"STARS 2.0 调度 AIC/AIV/CPU/DVPP/SDMA/UB/CCU；HSCB ns 级调度；2048 任务流下沉；8 Group 亲和性调度；16 资源池算力切分","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 升级第二代硬件调度器 STARS2.0：全芯片任务和资源调度中心，支持调度 AIC、AIV、CPU、DVPP、SDMA、UB、CCU 等多个计算和数据搬运引擎；支持实时 TOP-DOWN Profiling（记录 Task 执行时间轨迹、计算开销、带宽、功耗）。能力：Host 下沉 2048 条任务流到 Device；并发调度最多 16 个 AI CPU + 64 个 Host CPU 任务、64 个 UB jetty、32 个 CCU 任务、32 个 SDMA 通道；最多 128K 个单比特或 4096 个 32 比特同步标志位；专用高速控制总线 HSCB 与 AIC/AIV 交互，调度开销 ns 级；Group 调度支持将 AI Core 分成最多 8 个 Group（可按 Die 亲和性调度利用 L2 Cache 局部性）；算力切分支持 AIC/AIV/SDMA 最多 16 个资源池、其他加速器最多 8 个资源池，支持资源池与虚拟机绑定实现资源隔离。","evidence":"白皮书 §4.4 软硬协同高效调度（PDF p.27-28）：『STARS2.0』『HSCB』『调度开销降低至ns 级』『最多8 个Group』『16 个资源池』"}}},{"id":"a5-ub-onchip-switch","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-ub-onchip-switch.yaml","title":"A5 UB On Chip Switch（IO Die 内 9×x4 Port 转发，不占 DRAM 带宽）","summary":"单 IO Die 内 9 个 x4 Port 间流量转发，经 NoC 完成，不进计算 Die、不占 DRAM 带宽","doc":{"id":"a5-ub-onchip-switch","type":"platform-fact","title":"A5 UB On Chip Switch（IO Die 内 9×x4 Port 转发，不占 DRAM 带宽）","summary":"单 IO Die 内 9 个 x4 Port 间流量转发，经 NoC 完成，不进计算 Die、不占 DRAM 带宽","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 支持单 IO Die 内 9 个 x4 Port 之间的流量转发：进入端口的流量查询路由表后，若判断非本芯片流量且得到转发出端口，则经片上互联网络（NoC）转发至出口端口送出；此转发流量不进入计算 Die、不占用 DRAM 带宽；支持注入流量与转发流量的混合部署。","evidence":"白皮书 §4.6.5 UB On Chip Switch（PDF p.34）：『本芯片支持单IO DIE 内9 个x4 Port 之间进行流量转发』『此转发流量不会进入计算DIE，也不会占用DRAM 带宽』"}}},{"id":"a5-urma-semantics","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-urma-semantics.yaml","title":"A5 URMA 异步通信语义（操作集、RTP/CTP 传输模式）","summary":"URMA 异步语义：Write/Read/Send/Atomic（FetchAdd、CAS）；RTP 可靠传输（4 Port）vs CTP 简易传输（9 Port）；Doorbell + Jetty 队列 + UMMU 地址转换","doc":{"id":"a5-urma-semantics","type":"platform-fact","title":"A5 URMA 异步通信语义（操作集、RTP/CTP 传输模式）","summary":"URMA 异步语义：Write/Read/Send/Atomic（FetchAdd、CAS）；RTP 可靠传输（4 Port）vs CTP 简易传输（9 Port）；Doorbell + Jetty 队列 + UMMU 地址转换","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 提供基于 URMA 的异步通信语义：Core（AI Core / AI CPU / STARS）通过 Doorbell 机制调用 URMA 的 Jetty 队列进行内存搬运，UMMU 提供 VA 到 PA 地址转换与权限控制。支持操作：Write、Write with ImmediateData、Write with Notify、Read、Send、Send with ImmediateData、Atomic FetchAdd、Atomic CompareAndSwap。两种传输层：RTP mode（可靠传输，支持端到端可靠重传，可支持 4 个 Port 的可靠性传输带宽，多 Transport Channel 多路径）与 CTP mode（简易传输，不支持端到端可靠重传，可支持 9 个 Port 带宽）。","evidence":"白皮书 §4.6.1 URMA（PDF p.30-31）：『URMA 异步通信以Jetty 队列作为入口』『RTP mode：提供可靠传输服务』『CTP mode：提供简易传输服务』"}}},{"id":"a5-vector-core-spec","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-vector-core-spec.yaml","title":"A5 Vector Core 规格（BF16 原生支持、RegFile、算力翻倍）","summary":"第三代 Vector：单核 FP16/FP32 TFLOPS 较上代提升 100%；新增 BF16 原生支持与格式转换指令；UB 与 Vector ALU 间引入 RegFile","doc":{"id":"a5-vector-core-spec","type":"platform-fact","title":"A5 Vector Core 规格（BF16 原生支持、RegFile、算力翻倍）","summary":"第三代 Vector：单核 FP16/FP32 TFLOPS 较上代提升 100%；新增 BF16 原生支持与格式转换指令；UB 与 Vector ALU 间引入 RegFile","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 第三代 Vector Core：单核 FP16 和 FP32 的 TFLOPS 较上一版本提升 100%，使 Cube-Vector 融合算子（如 FlashAttention）的非矩阵类操作不再成为性能短板；指令集新增 BF16 原生支持，扩展多种浮点格式转换指令，强化量化与反量化能力；微架构针对 Softmax、GELU 等关键函数优化，提升张量 ALU 利用率；内存架构在 Unified Buffer 与 Vector ALU 之间引入 RegFile 寄存器作为临时存储，提供更高带宽与数据复用。","evidence":"白皮书 §4.1.2 VECTOR CORE（PDF p.20-21）：『单核FP16 和FP32 的TFLOPS 较上一版本提升100%』『新增对BF16 的原生支持』『在Unified Buffer 与Vector ALU 之间引入RegFile 寄存器作为临时存储』"}}},{"id":"a5-l2-cache","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-l2-cache.yaml","title":"A5 全局 L2 Cache（128MB，Chiplet UMA）","summary":"昇腾950 提供 128MB 统一访问 L2 Cache，支持按 Way Cache Lock，管理粒度 128Byte Sector","doc":{"id":"a5-l2-cache","type":"platform-fact","title":"A5 全局 L2 Cache（128MB，Chiplet UMA）","summary":"昇腾950 提供 128MB 统一访问 L2 Cache，支持按 Way Cache Lock，管理粒度 128Byte Sector","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 提供 128MB 全局统一访问的 L2 Cache；采用 Chiplet UMA 统一内存架构，支持算子可控的 Cache Hint 管理；支持按 Way 的 Cache Lock 与驻留策略，管理粒度精细至 128Byte Sector；在离散小包访问和随机访存场景下，同带宽条件下性能较上一代提升 2 倍以上。","evidence":"白皮书 §3 存储体系（p.11-12）：『128MB 全局L2 Cache』『128MB 统一访问的L2 Cache』；§4.3.2（p.22）"}}},{"id":"a5-die-architecture","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-die-architecture.yaml","title":"A5 多 Die 合封架构（2 AI Die + 2 IO Die + 片上内存模块）","summary":"昇腾950 为 Chiplet 合封：2 AI Die + 2 IO Die + 8(PR)/4(DT) 片上内存模块，D2D Clink 互联，UMA 统一内存","doc":{"id":"a5-die-architecture","type":"platform-fact","title":"A5 多 Die 合封架构（2 AI Die + 2 IO Die + 片上内存模块）","summary":"昇腾950 为 Chiplet 合封：2 AI Die + 2 IO Die + 8(PR)/4(DT) 片上内存模块，D2D Clink 互联，UMA 统一内存","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 芯片是多 Die 合封芯片：整芯片合封 2 个 AI Die、2 个 IO Die 和 8 个（950PR）或 4 个（950DT）高速片上内存模块；各 Die 与片上内存模块通过高速 D2D Clink 与 Memory Interface 连接，整个 Chiplet 构成内存统一访问（UMA）的整体。","evidence":"白皮书 §3（p.12）：『昇腾950 芯片是一个多Die 合封的芯片，整芯片里合封了2 个AI Die、2 个IO Die 和8 个（昇腾950PR）或者4 个（昇腾950DT）高速片上内存模块』"}}},{"id":"a5-interconnect-ub2","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-interconnect-ub2.yaml","title":"A5 灵衢 Unified Bus 2.0 互联（2TB/s，URMA/UB Memory/PCIe 5.0/UBoE）","summary":"昇腾950 单芯片互联带宽 2TB/s：72×HiLink(112Gbps)/18 Port，URMA 异步拷贝、UB Memory 同步语义、PCIe 5.0 x16 双模式、2×400Gbps UBoE","doc":{"id":"a5-interconnect-ub2","type":"platform-fact","title":"A5 灵衢 Unified Bus 2.0 互联（2TB/s，URMA/UB Memory/PCIe 5.0/UBoE）","summary":"昇腾950 单芯片互联带宽 2TB/s：72×HiLink(112Gbps)/18 Port，URMA 异步拷贝、UB Memory 同步语义、PCIe 5.0 x16 双模式、2×400Gbps UBoE","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 灵衢互联系统 Unified Bus 2.0：72× 最高 112Gbps 速率 HiLink（分 18 个 Port），基于新一代 HiLink SerDes 单芯片互联带宽峰值 2TB/s；支持 URMA（异步内存拷贝与消息语义）、UB Memory（Load/Store/Atomic 同步语义，最高 128TB Host-Device 及 Device-Device 内存共享访问）、PCIe 5.0 x16（EP/RC 双模式，向下兼容 GEN4/3/2/1）、2×400Gbps UBoE（UB over Ethernet，支持 1x4/2x2 Port Bifurcation）；Scale-up（芯片间）与 Scale-out（节点间）端口可灵活复用。","evidence":"白皮书 §3 互联组网（p.11-12）与 §3 完整规格（p.13）：『72x 最高支持112Gbps 速率的HiLink，分为18 个Port』『单芯片互联带宽高达2TB/s』『支持PCIe 5.0 x16（兼容EP/RC 双模式）』『支持2*400Gbps UBoE』"}}},{"id":"a5-precision-format-support","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-precision-format-support.yaml","title":"A5 精度格式支持（原生 MXFP4/MXFP8/HiF8，另含 FP8/INT8/TF32/FP16/BF16）","summary":"昇腾950 系列原生支持 MXFP4/MXFP8/HiF8 低精度格式，全面支持 FP8/INT8/TF32/FP16/BF16","doc":{"id":"a5-precision-format-support","type":"platform-fact","title":"A5 精度格式支持（原生 MXFP4/MXFP8/HiF8，另含 FP8/INT8/TF32/FP16/BF16）","summary":"昇腾950 系列原生支持 MXFP4/MXFP8/HiF8 低精度格式，全面支持 FP8/INT8/TF32/FP16/BF16","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 系列全面支持 TF32、FP16、BF16、FP8、MXFP8、HiF8、INT8 及 MXFP4 等多种精度格式，其中 MXFP4/MXFP8/HiF8 为原生新增的低精度格式（针对 Transformer 训练推理与 FlashAttention 等算子做了专项优化）。","evidence":"白皮书 §2（p.8）：『原生支持MXFP4/MXFP8 和 HiF8』；§3（p.10）：『该架构全面支持TF32、FP16、BF16、FP8、MXFP8、HiF8、INT8 及MXFP4 等多种精度格式』"}}},{"id":"a5-supernode-scale","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-supernode-scale.yaml","title":"A5 超节点规模（8K 卡）与集群规模（128K+ 卡）","summary":"昇腾超节点从上一代 384 卡提升至 8K 卡，整体集群支持超 128K 卡，nD-Mesh/Clos 灵活组网","doc":{"id":"a5-supernode-scale","type":"platform-fact","title":"A5 超节点规模（8K 卡）与集群规模（128K+ 卡）","summary":"昇腾超节点从上一代 384 卡提升至 8K 卡，整体集群支持超 128K 卡，nD-Mesh/Clos 灵活组网","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 系列支持 nD-Mesh、Clos 等多种灵活组网；超节点（Super Node）规模从上一代 384 卡提升至 8K（8192）卡，整体集群支持规模超过 128K 卡。该规模能力与通信类诊断（HCCL 拓扑、多节点 EP/PD 的通信瓶颈）直接相关——单集群卡片数上限远超 A2/A3。","evidence":"白皮书 §3 灵活组网与超大规模扩展（p.12）与 §4.7 超节点能力（p.32-34）：『规模突破：超节点（Super Node）规模从上一代的384 卡提升至8K（8192）卡，整体集群支持规模超过128K 卡』"}}},{"id":"a5-memory-ras","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-memory-ras.yaml","title":"A5 高速片上内存 RAS 特性","summary":"昇腾950 片上内存支持 Online ECC、巡检、行失效动态隔离（用户无感）","doc":{"id":"a5-memory-ras","type":"platform-fact","title":"A5 高速片上内存 RAS 特性","summary":"昇腾950 片上内存支持 Online ECC、巡检、行失效动态隔离（用户无感）","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾950 高速片上内存实现 RAS（Reliability, Availability and Serviceability）特性：支持 Online ECC；巡检特性发现薄弱点并回写或隔离；预留部分行，在发现新增行失效时动态隔离问题行并搬运数据到预留行，实现用户无感知的行失效隔离。","evidence":"白皮书 §4.3.1 高速片上内存（PDF p.26）：『支持Online ECC』『巡检特性，发现薄弱点并回写或隔离』『预留部分行，在发现新增行失效时，可以动态隔离问题行』"}}},{"id":"a5-hif8-format","type":"platform-fact","dir":"platform-facts","file":"references/platform-facts/a5-hif8-format.yaml","title":"HiF8 精度格式细节（38 指数、无 MX 缩放因子、特殊值编码）","summary":"HiF8 综合阶码范围 [-22,15] 共 38 个指数，比 FP8 E4M3 的 18 个动态范围成倍提升；与 MXFP8 相比无需 8 位 MX 缩放因子","doc":{"id":"a5-hif8-format","type":"platform-fact","title":"HiF8 精度格式细节（38 指数、无 MX 缩放因子、特殊值编码）","summary":"HiF8 综合阶码范围 [-22,15] 共 38 个指数，比 FP8 E4M3 的 18 个动态范围成倍提升；与 MXFP8 相比无需 8 位 MX 缩放因子","sources":[{"type":"official-doc","url":"昇腾950 NPU 架构白皮书（华为技术有限公司）","version":"2026-06-04（PDF metadata creationDate）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A5-950"]},"status":"active","last_verified":"2026-08-28","content":{"claim":"HiF8 是昇腾950 新增的 8 比特浮点格式：综合阶码范围从 FP8 E4M3 的 [-15,15]（18 个指数表达）提升到 [-22,15] 共 38 个指数，接近 FP16 的 40 个；与 MXFP8 相比不需要额外的 8 位 MX 缩放因子。编码特性：变长前缀码点位域 Dot 显式指示阶码位宽与 Denormal 标志；阶码用原码编码并隐藏 1 比特固定值；在数值绝对值靠近 1 时精度高、远离 1 逐渐降低，无跳变；编码 4 个特殊值（ZERO=00000000、NAN=10000000、+INF=01101111、-INF=11101111），不区分正负 0。","evidence":"白皮书 §4.1.1 CUBE CORE（PDF p.19-20）：『相比于FP8 E4M3 的18 个指数表达，HiF8 支持38 个指数表达』『与MXFP8 相比，HiF8 不需要额外的8 位MX 缩放因子』及表 4-1 特殊值编码"}}},{"id":"ascend-trace-logs","type":"software-fact","dir":"software-facts","file":"references/software-facts/ascend-trace-logs.yaml","title":"trace 日志机制与落盘路径（仅 Ascend EP 标准形态）","summary":"trace 将软件栈维测信息记内存、运行出错或进程结束时才落盘，仅 Ascend EP 标准形态支持；根目录 $HOME/ascend/atrace（ASCEND_WORK_PATH 可重定向），事件三类 schedule/stackcore/exit；stackcore 与 *.bin 轨迹需 asys 工具解析，目录持续增长需定期清理","doc":{"id":"ascend-trace-logs","type":"software-fact","title":"trace 日志机制与落盘路径（仅 Ascend EP 标准形态）","summary":"trace 将软件栈维测信息记内存、运行出错或进程结束时才落盘，仅 Ascend EP 标准形态支持；根目录 $HOME/ascend/atrace（ASCEND_WORK_PATH 可重定向），事件三类 schedule/stackcore/exit；stackcore 与 *.bin 轨迹需 asys 工具解析，目录持续增长需定期清理","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/logreference/logreference_0022.html","version":"CANN 商用版 9.0.0（日志参考 logreference_0022）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"claim":"trace 日志是独立维测机制：程序运行过程中将软件栈维测信息记录在内存，程序运行出错或进程结束时落盘到文件（避免运行中频繁产生日志影响性能），仅 Ascend EP 标准形态支持。落盘根目录默认 $HOME/ascend/atrace/，可由环境变量 ASCEND_WORK_PATH 重定向；子目录结构为 trace_{进程组pid}_{首次加载trace动态库的进程pid}_{首次加载trace动态库的时间戳}/{event_name}_event_{当前进程pid}_{目录生成时的时间戳}/，其中 event_name 取 schedule（业务流程异常，如算子执行报错等）/ stackcore（进程崩溃或收到异常信号）/ exit（进程正常退出析构）。schedule_tracer_ts_{device_id}.txt 在 AI Core Error、notify wait 超时时回传寄存器/硬件 buffer/bitmap；stackcore_tracer_* 轻量 core 与 schedule_tracer_*.bin（AICPU 轨迹）需 asys 工具解析。目录被容器或物理机内所有应用共用、持续增长，需定期清理（可用 logrotate 切分），否则磁盘占满影响业务。","evidence":"日志参考 logreference_0022『查看trace日志』：机制（内存记录→出错或结束落盘、仅 EP 标准形态支持）、根目录 $HOME/ascend/atrace/ 与 ASCEND_WORK_PATH 重定向、子目录 trace_{进程组pid}_{pid}_{时间戳}/{event}_event_{pid}_{时间戳}/、事件三类（schedule/stackcore/exit）、文件说明（schedule_tracer_ts_* 寄存器/硬件 buffer/bitmap、stackcore_tracer_* 轻量 core 需 asys、schedule_tracer_*.bin AICPU 轨迹需 asys）、ASCEND_LOG_DEVICE_FLUSH_TIMEOUT 控制 Device 日志回传延时、ASCEND_TRACE_RECORD_NUM 控制老化、logrotate 清理建议"}}},{"id":"verl-official-image-no-hdk","type":"software-fact","dir":"software-facts","file":"references/software-facts/verl-official-image-no-hdk.yaml","title":"verl 官方昇腾 Docker 镜像不含 HDK","summary":"verl 官方昇腾镜像（quay.io/ascend/verl:*）不含 HDK，需按 install_guidance.rst 自选安装——HDK 版本与镜像组合不兼容是 verl+昇腾故障的常见根因面","doc":{"id":"verl-official-image-no-hdk","type":"software-fact","title":"verl 官方昇腾 Docker 镜像不含 HDK","summary":"verl 官方昇腾镜像（quay.io/ascend/verl:*）不含 HDK，需按 install_guidance.rst 自选安装——HDK 版本与镜像组合不兼容是 verl+昇腾故障的常见根因面","sources":[{"type":"case-derived","cases":["VERL-6608"],"extracted_at":"2026-08-31","extraction_method":"to-reference --ingest-cases"}],"applies_to":{"frameworks":["verl"],"platforms":["cross"]},"related_references":["verl-runtime-env-hccl-port-range-auto"],"status":"active","last_verified":"2026-08-31","content":{"claim":"verl 官方昇腾 Docker 镜像（如 quay.io/ascend/verl:verl-8.5.0-910b-ubuntu22.04-py3.11-v0.7.1、verl-9.0.0-a3-ubuntu22.04-py3.11-latest）不包含 HDK，HDK 需用户按 verl/docs/ascend_tutorial/get_start/install_guidance.rst 自选安装。因此 HDK 版本与镜像内 torch_npu/verl 的组合兼容性由用户负责——HDK 版本不匹配（如官方镜像推荐 26.0.rc1 而实际触发 HCCL 初始化错误）是 verl+昇腾故障的常见根因面，更换兼容 HDK（实测 25.5.1 可跑）即可修复。","evidence":"VERL-6608 评论：官方 verl 0.8.0 镜像推荐 Ascend HDK 26.0.rc1，但 TP2 训练报 hcclCommInitRootInfoConfig error code 7；用户换 HDK 25.5.1 后 GRPO 正常；maintainer 确认镜像里没有 hdk 版本，hdk 版本可自行选择合适的安装"}}},{"id":"ascend-error-code-structure","type":"software-fact","dir":"software-facts","file":"references/software-facts/ascend-error-code-structure.yaml","title":"昇腾 6 位错误码结构（级别位 + 模块位 + 内部码规则）","summary":"错误码 6 位：第 1 位 E/W/I（错误/告警/提示）；第 2 位模块（E1=GE、E2=FE、E3=AI CPU、E4=TEFusion、E7=Vector 算子插件、E8=Vector 算子、EB=TBE Pass、EC=Auto Tune、ED=RLTune、EE=Runtime、EF=LxFusion&AutoDeploy、EG=AOE、EH=ACL、EI=HCCL、EJ=HCCP、EK=Profiling、EL=Driver、EM=队列调度、EN=DVPP、EO=AMCT、EP=Dump、EZ=公共算子+算子 API）；后 4 位 0000-8999 用户类 / 9000-9999 内部错误码（E*9*** 联系华为）；异步多算子报错从首报错排查","doc":{"id":"ascend-error-code-structure","type":"software-fact","title":"昇腾 6 位错误码结构（级别位 + 模块位 + 内部码规则）","summary":"错误码 6 位：第 1 位 E/W/I（错误/告警/提示）；第 2 位模块（E1=GE、E2=FE、E3=AI CPU、E4=TEFusion、E7=Vector 算子插件、E8=Vector 算子、EB=TBE Pass、EC=Auto Tune、ED=RLTune、EE=Runtime、EF=LxFusion&AutoDeploy、EG=AOE、EH=ACL、EI=HCCL、EJ=HCCP、EK=Profiling、EL=Driver、EM=队列调度、EN=DVPP、EO=AMCT、EP=Dump、EZ=公共算子+算子 API）；后 4 位 0000-8999 用户类 / 9000-9999 内部错误码（E*9*** 联系华为）；异步多算子报错从首报错排查","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0225.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0225 错误码参考使用说明）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ge-error-codes","hccl-error-codes","dvpp-error-codes","rts-error-codes","driver-error-codes","ai-cpu-error-codes","auto-tune-error-codes","tefusion-error-codes","operator-error-codes","aoe-error-codes","fe-error-codes","profiling-error-codes","amct-error-codes","tbe-pass-error-codes","lxfusion-error-codes","acl-error-codes","misc-error-codes"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"claim":"昇腾错误码以 6 位字符形式体现（如 E10035）：第 1 位表示级别（E 错误 / W 告警 / I 提示）；第 2 位表示模块——1 GE、2 FE、3 AI CPU、4 TE Fusion、7 Vector 算子插件、8 Vector 算子、B TBE Pass 编译工具、C Auto Tune、D RLTune、E Runtime、F LxFusion&AutoDeploy、G AOE、H ACL、I HCCL、J HCCP、K Profiling、L Driver、M 队列调度、N DVPP、O AMCT、P Dump、Z 算子公共错误码和算子 API 执行接口错误码（如 aclnn 类算子 API）；剩下 4 位 0000~8999 为用户类错误、9000~9999 为内部错误码。异步任务执行（连续下发多个算子）可能包含多个算子报错，需从首报错算子开始排查；E*9*** 为系统内部错误码，需联系华为排查。屏显报错已展示错误码相关的可能原因与解决方案。","evidence":"错误码参考使用说明（troubleshooting_0225）：6 位结构、级别位（E/W/I）、模块位 22 项映射、0000-8999 用户类 / 9000-9999 内部码、E*9*** 内部错误码联系华为、异步多算子从首报错排查、[%s] 占位符说明","module_files":[{"prefix":"E1","module":"GE","file":"references/errors/ge.yaml"},{"prefix":"E2","module":"FE","file":"references/errors/fe.yaml"},{"prefix":"E3","module":"AI CPU","file":"references/errors/ai-cpu.yaml"},{"prefix":"E4","module":"TEFusion","file":"references/errors/tefusion.yaml"},{"prefix":"E7","module":"Vector 算子插件","file":"references/errors/operator.yaml"},{"prefix":"E8","module":"Vector 算子","file":"references/errors/op <script>

var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var $view=document.getElementById("view"), $nav=document.getElementById("nav"), $rail=document.getElementById("rail"),
    $sideQ=document.getElementById("sideQ"), $railFoot=document.getElementById("railFoot");

/* ---------- 基础数据 ---------- */
var TYPES=KB.types, ENTRIES=KB.entries, TRIAGE=(KB.triage&&KB.triage.branches)||[];

ENTRIES.forEach(function(e){byId[e.id]=e; (byDirType[e.type]=byDirType[e.type]||[]).push(e);});
var TYPE_META={}; TYPES.forEach(function(t){TYPE_META[t.type]=t;});
function entryRoute(e){return "#/e/"+encodeURIComponent(e.type)+"/"+encodeURIComponent(e.id);}

/* ---------- 小工具 ---------- */
function flatText(v,out){out=out||[];if(v==null)return out;
  if(typeof v==="string"){out.push(v);}
  else if(typeof v==="number"||typeof v==="boolean"){out.push(String(v));}
  else if(Array.isArray(v)){v.forEach(function(x){flatText(x,out);});}
  else if(typeof v==="object"){Object.keys(v).forEach(function(k){out.push(k);flatText(v[k],out);});}
  return out;}
var _hay=null;
function hay(e){if(!_hay){_hay={};ENTRIES.forEach(function(x){var d=x.doc;var parts=[x.title,x.id,x.summary];parts=parts.concat(flatText(d));_hay[x.id]=parts.join("\n").toLowerCase();});}
  return _hay[e.id];}
function search(q){var terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return[];
  var out=[];
  ENTRIES.forEach(function(e){
    var h=hay(e), title=e.title.toLowerCase(), id=e.id.toLowerCase(), sum=e.summary.toLowerCase();
    var score=0;
    terms.forEach(function(t){
      if(!t)return;
      if(title.indexOf(t)>=0)score+=5; if(id.indexOf(t)>=0)score+=4;
      if(sum.indexOf(t)>=0)score+=2;
      if(h.indexOf(t)>=0)score+=1;
    });
    if(score>0)out.push({e:e,score:score});
  });
  out.sort(function(a,b){return b.score-a.score||a.e.title.localeCompare(b.e.title,"zh");});
  return out.slice(0,150);}
function hilite(s,q){var t=esc(s);q=q.trim();if(!q)return t;
  try{return t.replace(new RegExp("("+q.split(/\s+/).map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+")","gi"),"<mark>$1</mark>");}
  catch(err){return t;}}
function copyText(txt,btn){
  function done(){if(btn){btn.textContent="已复制";btn.classList.add("copied");setTimeout(function(){btn.textContent="复制";btn.classList.remove("copied");},1400);}}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,function(){fallback();});}
  else{fallback();}
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);}}
function copyBtn(txt){return '<button data-copy="'+esc(txt)+'" title="复制">复制</button>';}
/* 反引号 -> code 行内格式 */
function rich(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");}
function splitCmds(s){return String(s||"").split(/[；;\n]+/).map(function(x){return x.trim();}).filter(Boolean);}
function cmdRows(s){
  var lines=splitCmds(s);if(!lines.length)return "";
  return lines.map(function(l){return '<div class="cmd-row"><div class="cmd">'+esc(l)+'</div>'+copyBtn(l)+"</div>";}).join("");}
function chip(txt,cls){return '<span class="chip '+(cls||"")+'">'+esc(txt)+"</span>";}
function chipLink(route,txt,cls){return '<a class="chip chip-link '+(cls||"")+'" href="'+route+'">'+esc(txt)+"</a>";}
function srcLabel(type){var m=TYPE_META[type];var lab=m&&m.src_label?m.src_label[type]:null;return lab||type;}
function sourceBadge(src){var type=src.type||"";
  return '<span class="badge-src '+esc(type)+'">'+esc(srcLabel(type))+"</span>";}

/* ---------- 类型/目录 ---------- */
function typeUrl(type){return "#/d/"+encodeURIComponent(type);}
function typeBadge(type){var m=TYPE_META[type];return '<span class="type-badge '+esc(m.kind)+'">'+esc(m.label)+"</span>";}
function kindTag(kind){return '<span class="kind-tag">'+esc(KIND_LABEL[kind]||kind)+"</span>";}

/* ---------- 侧栏 ---------- */
function renderNav(activeType){
  var html='<a class="nav-home" href="#/">⌂ 总览 / 检索</a><a class="nav-home" href="#/triage" style="margin-top:2px">↗ 症状路由图（triage）</a>';
  TYPES.forEach(function(t){
    var open=(activeType===t.type)?' open':'';
    var mark = t.kind==="flow"?"flow":(t.kind==="table"?"table":"fact");
    html+='<details'+open+' class="'+mark+'" data-dtype="'+t.type+'"><summary><span class="kind-dot"></span>'+esc(t.label)
         +'<span class="cnt">'+t.count+"</span><span class=\"tw\">▸</span></summary>";
    (byDirType[t.type]||[]).forEach(function(e){
      html+='<a class="entry'+(activeType===t.type?"":"")+'" href="'+entryRoute(e)+'" data-eid="'+esc(e.id)+'">'
           +'<span>'+esc(trunc(e.title,26))+"</span><span class=\"id\">"+esc(e.id)+"</span></a>";
    });
    html+="</details>";
  });
  $nav.innerHTML=html;
  if(activeType){var d=$nav.querySelector('details[data-dtype="'+activeType+'"]');}
}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+"…":s;}

/* ---------- provenance ---------- */
function appliesMeta(doc){
  var a=doc.applies_to||{},out=[];
  if(a.platforms&&a.platforms.length)out.push({k:"平台",v:a.platforms.map(function(p){return chip(p,"chip-plat");}).join("")});
  if(a.frameworks&&a.frameworks.length)out.push({k:"框架",v:a.frameworks.map(function(f){return chip(f);}).join("")});
  if(a.versions&&Object.keys(a.versions).length)out.push({k:"版本",v:Object.keys(a.versions).map(function(k){return chip(k+": "+a.versions[k]);}).join("")});
  if(a.categories&&a.categories.length)out.push({k:"类别",v:a.categories.map(function(c){return chip(CAT_LABEL[c]||c,"chip-cat");}).join("")});
  return out.map(function(x){return '<span class="kv"><b>'+esc(x.k)+"</b>"+x.v+"</span>";}).join("");
}
function sourcesHtml(doc){
  var srcs=doc.sources||[];
  if(!srcs.length)return "";
  var sum={};srcs.forEach(function(s){sum[s.type]=(sum[s.type]||0)+1;});
  var line=Object.keys(sum).map(function(t){return '<span class="badge-src '+esc(t)+'">'+esc(srcLabel(t))+" ×"+sum[t]+"</span>";}).join("");
  var cards=srcs.map(function(s){
    var inner='<div class="s-top">'+sourceBadge(s);
    if(s.url){var u=s.url;var isLink=/^https?:\/\//.test(u);
      inner+= isLink?'<a class="s-url" href="'+esc(u)+'" target="_blank" rel="noreferrer">'+esc(trunc(u,90))+" ↗</a>"
                     :'<span class="s-url">'+esc(trunc(u,90))+"</span>";}
    inner+="</div>";
    var meta=[];
    if(s.version)meta.push("版本 "+esc(s.version));
    if(s.fetched_at)meta.push("抓取 "+esc(s.fetched_at));
    if(s.verification)meta.push("核验 "+esc(s.verification));
    if(s.extracted_at)meta.push("提炼 "+esc(s.extracted_at));
    if(s.extraction_method)meta.push(esc(s.extraction_method));
    if(meta.length)inner+='<div class="s-meta">'+meta.join("<span>·</span>")+"</div>";
    if(s.cases&&s.cases.length)inner+='<div class="s-cases">'+s.cases.map(function(c){return '<span class="casechip">'+esc(c)+"</span>";}).join("")+"</div>";
    return '<div class="src">'+inner+"</div>";}).join("");
  var stat=doc.status==="active"?'<span class="st-active"><span class="ok-dot"></span>active</span>':'<span>'+esc(doc.status||"")+"</span>";
  var meta2=[];
  if(doc.last_verified)meta2.push("最近核验 "+esc(doc.last_verified));
  if(doc.hits!=null)meta2.push("诊断命中 "+doc.hits+" 次");
  if(doc.last_hit)meta2.push("最近命中 "+esc(doc.last_hit));
  return '<details class="provenance"><summary>来源与校验 · '+line+'<span class="tw">▸</span></summary>'
       +'<div class="srcs">'+cards+"</div></details>"
       +'<div class="meta-row" style="margin-top:10px"><span class="kv"><b>状态</b>'+stat+"</span>"
       +(meta2.length?meta2.map(function(m){return '<span class="kv">'+m+"</span>";}).join(""):"")
       +appliesMeta(doc)+"</div>";
}

/* ---------- 泛型内容块（兜底） ---------- */
var LABEL={invocation:"用法",commands:"命令",level_definitions:"级别定义",pitfalls:"坑点",output_meaning:"输出解读",
  claim:"结论",evidence:"证据",locations:"路径 / 位置",command:"命令",side_effects:"副作用",rollback:"回滚方式",
  version_dependent:"版本相关",flow:"流程",action:"动作",check:"检查",when_to_use:"适用时机",name:"名称",
  errors:"错误码",patterns:"故障模式",variables:"环境变量",matrix:"配套版本",compat:"兼容矩阵",symptoms:"现象特征",
  cause:"根因",fix:"处理",meaning:"含义",related_signatures:"相关特征",source_cases:"来源案例",code:"错误码",
  description:"说明",example:"示例",url:"来源",module:"模块",solution:"处理建议",hits:"命中",last_hit:"最近命中",
  tool_name:"工具名",platform:"平台",component:"组件",version:"版本",status:"状态",summary:"摘要",
  verified_by_testing:"真机验证",test_scenarios:"测试场景",details:"详情",structure:"结构",components:"组件",
  files:"文件",categories:"类别",frameworks:"框架",platforms:"平台",versions:"版本",apply:"适用"};
function lbl(k){return LABEL[k]||k.replace(/_/g," ");}
var MONO_KEYS={code:1,name:1,id:1,file:1,prefix:1,module:1,full_name:1,version:1,component:1,command:1,tool_name:1,path:1,key:1,opcode:1,event_id:1,side:1};
function cellHtml(v){
  if(v==null)return "";
  if(Array.isArray(v))return v.map(function(x){if(x&&typeof x==="object")return cellHtml(x);return '<span class="chip">'+esc(x)+"</span>";}).join(" ");
  if(typeof v==="object"){return Object.keys(v).map(function(k){return '<div><b style="font-size:11px;color:var(--ink-3)">'+esc(lbl(k))+"</b> "+cellHtml(v[k])+"</div>";}).join("");}
  return rich(String(v));}
function genericTable(rows,spec){
  if(!rows||!rows.length)return "";
  var keys=[];
  if(spec){spec.forEach(function(s){if(s in rows[0])keys.push(s);});}
  var seen={};rows.forEach(function(r){Object.keys(r).forEach(function(k){if(!seen[k]){seen[k]=1;if(keys.indexOf(k)<0)keys.push(k);}});});
  var thead="<tr>"+keys.map(function(k){return "<th>"+esc(lbl(k))+"</th>";}).join("")+"</tr>";
  var body=rows.map(function(r){
    return "<tr>"+keys.map(function(k){
      var v=r[k];var cls="";
      if(v==null)return "<td></td>";
      if(Array.isArray(v)){var isMono=(k==="symptoms"||k==="related_signatures"||k==="source_cases");
        return "<td>"+v.map(function(x){return '<span class="chip'+(isMono?"":"")+'">'+(isMono?'<code>'+esc(x)+"</code>":esc(x))+"</span>";}).join(" ")+"</td>";}
      if(typeof v==="object"){return "<td>"+cellHtml(v)+"</td>";}
      var sv=String(v);
      if(MONO_KEYS[k])return '<td><span class="mono'+(sv.length>40?" wrap":"")+'">'+esc(sv)+"</span></td>";
      if(k==="url")return "<td>"+(/^https?:/.test(sv)?'<a href="'+esc(sv)+'" target="_blank" rel="noreferrer">'+esc(trunc(sv,48))+" ↗</a>":esc(trunc(sv,60)))+"</td>";
      if(sv==="Y"||sv==="N")return '<td><span class="yn '+sv+'">'+sv+"</span></td>";
      return "<td class=\"cell-main\">"+rich(sv)+"</td>";
    }).join("")+"</tr>";}).join("");
  return '<div class="tblwrap"><table class="tbl"><thead>'+thead+"</thead><tbody>"+body+"</tbody></table></div>";}
function subBlocks(obj,skip){
  var html="";Object.keys(obj).forEach(function(k){
    if(skip&&skip.indexOf(k)>=0)return;
    var v=obj[k];html+='<div class="subblock"><div class="lbl">'+esc(lbl(k))+"</div>";
    if(typeof v==="string")html+='<p class="lead">'+rich(v)+"</p>";
    else if(Array.isArray(v)){
      if(v.length&&v.every(function(x){return typeof x==="string";}))html+='<ul class="gen-list">'+v.map(function(x){return "<li>"+rich(x)+"</li>";}).join("")+"</ul>";
      else html+=genericTable(v,null);}
    else if(typeof v==="object")html+=subBlocks(v,[]);
    html+="</div>";});
  return html;}

/* ---------- 各 type 内容渲染 ---------- */
function renderContent(e){
  var d=e.doc,c=d.content||{};
  switch(e.type){
    case "methodology": return flowHtml(c);
    case "error-code":
    case "fault-pattern":
    case "env-var-table": return tableTypeHtml(e,c);
    case "compat-matrix": return compatHtml(c);
    case "tool": return toolHtml(c);
    case "command-side-effect": return cseHtml(c);
    default: return factHtml(c);
  }
}
function flowHtml(c){
  var steps=(c.flow||[]).slice().sort(function(a,b){return (Number(a.step)||0)-(Number(b.step)||0);});
  var html='<div class="flow"><div class="f-cap">'+(steps.length+" 步 · 按 when_to_use 分流判断，逐步执行 check")+"</div><div class=\"steps\">";
  steps.forEach(function(s,i){
    html+='<div class="step"><div class="s-rail"><div class="s-num">'+(i+1)+'</div><div class="s-line"></div></div><div class="s-body">';
    html+='<div class="s-name"><span class="n">步骤 '+esc(String(s.step||i+1))+"</span>"+esc(s.name||"")+"</div>";
    if(s.when_to_use)html+='<div class="when"><b>适用</b>'+rich(s.when_to_use)+"</div>";
    if(s.action)html+='<div class="action">'+rich(s.action)+"</div>";
    if(s.check)html+='<div class="checks"><div class="c-cap">执行检查</div>'+cmdRows(s.check)+"</div>";
    html+="</div></div>";});
  html+="</div>";
  if(c.verified_by_testing!=null)html+='<div class="note-box">'+((c.verified_by_testing)?"已真机测试验证":"标注：流程来自来源核验，未做真机测试（verified_by_testing: false）")+"</div>";
  if(c.test_scenarios)html+='<div class="note-box">测试场景：'+esc(c.test_scenarios.join("；"))+"</div>";
  return html;}
function tableTypeHtml(e,c){
  var listKeys={"error-code":"errors","fault-pattern":"patterns","env-var-table":"variables"};
  var k=listKeys[e.type],rows=c[k]||[];
  var html="";
  if(e.type==="error-code"){
    html+='<div class="kbox"><div class="subblock"><div class="lbl">'+esc(lbl(k))+"　"+rows.length+" 条</div>"
       +genericTable(rows,["code","module","meaning","related_signatures","solution","source_cases"])+"</div></div>";
  }else if(e.type==="fault-pattern"){
    html+='<div class="kbox"><div class="subblock"><div class="lbl">'+esc(lbl(k))+"　"+rows.length+" 条</div>"
       +genericTable(rows,["pattern","symptoms","cause","fix"])+"</div></div>";
  }else{
    html+='<div class="kbox"><div class="subblock"><div class="lbl">'+esc(lbl(k))+"　"+rows.length+" 个</div>"
       +genericTable(rows,["name","description","example","url"])+"</div></div>";
  }
  return html;}
function compatHtml(c){
  var html='<div class="kbox">';
  var layer=[];if(c.layer)layer.push(chip("层: "+c.layer));if(c.component)layer.push(chip("主组件: "+c.component));
  if(layer.length)html+='<div style="display:flex;gap:6px;margin:10px 0 0">'+layer.join("")+"</div>";
  if(c.matrix&&c.matrix.length)html+='<div class="subblock"><div class="lbl">配套版本（matrix）</div>'+genericTable(c.matrix,["version"])+"</div>";
  if(c.compat&&c.compat.length)html+='<div class="subblock"><div class="lbl">兼容矩阵（Y / N）</div>'+genericTable(c.compat,["component"])+"</div>";
  return html+"</div>";}
function factHtml(c){
  var html='<div class="kbox">';
  if(c.claim)html+='<p class="claim">'+rich(c.claim)+"</p>";
  if(c.evidence)html+='<details class="ev"><summary>证据 / 出处</summary><div class="ev-body">'+rich(c.evidence)+"</div></details>";
  html+=subBlocks(c,["claim","evidence"]);
  return html+"</div>";}
function toolHtml(c){
  var html='<div class="kbox">';
  if(c.tool_name)html+='<div class="subblock"><div class="lbl">工具</div><p class="lead" style="font-weight:600">'+rich(c.tool_name)+"</p></div>";
  if(c.invocation)html+='<div class="subblock"><div class="lbl">用法</div><p class="lead">'+rich(c.invocation)+"</p></div>";
  if(c.commands){html+='<div class="subblock"><div class="lbl">命令</div>';
    if(typeof c.commands==="object"&&!(c.commands instanceof Array)){
      Object.keys(c.commands).forEach(function(nm){var cm=c.commands[nm];
        html+='<div class="cmd-row" style="margin-top:6px"><div class="cmd" style="flex:0 0 auto;min-width:150px;background:transparent;color:var(--accent-ink);font-weight:700;padding:6px 12px 6px 0">'+esc(lbl(nm))+'</div>'
             +'<div class="cmd" style="background:var(--code-bg);color:var(--code-ink)">'+esc(cm)+"</div>"+copyBtn(cm)+"</div>";});
    }else{html+=cmdRows(c.commands);}
    html+="</div>";}
  if(c.output_meaning)html+='<div class="subblock"><div class="lbl">输出解读</div><p class="lead">'+rich(c.output_meaning)+"</p></div>";
  if(c.level_definitions){html+='<div class="subblock"><div class="lbl">级别定义</div>'
     +genericTable(Object.keys(c.level_definitions).map(function(k){return {level:k,meaning:c.level_definitions[k]};}),["level","meaning"])+"</div>";}
  if(c.pitfalls)html+='<div class="subblock"><div class="lbl">坑点</div><ul class="gen-list">'+c.pitfalls.map(function(p){return "<li>"+rich(p)+"</li>";}).join("")+"</ul></div>";
  html+=subBlocks(c,["tool_name","invocation","commands","output_meaning","level_definitions","pitfalls"]);
  return html+"</div>";}
function cseHtml(c){
  var html='<div class="kbox">';
  if(c.command)html+='<div class="subblock"><div class="lbl">命令</div><div class="cmd-row" style="margin-top:6px"><div class="cmd">'+esc(c.command)+"</div>"+copyBtn(c.command)+"</div></div>";
  if(c.side_effects)html+='<div class="subblock"><div class="lbl">副作用</div><ul class="gen-list">'+c.side_effects.map(function(p){return "<li>"+rich(p)+"</li>";}).join("")+"</ul></div>";
  if(c.rollback)html+='<div class="subblock"><div class="lbl" style="color:var(--warn)">回滚方式</div><p class="lead">'+rich(c.rollback)+"</p></div>";
  if(c.version_dependent!=null)html+='<div style="margin-top:10px">'+chip(c.version_dependent?"版本相关行为":"与版本无关","chip-cat")+"</div>";
  html+=subBlocks(c,["command","side_effects","rollback","version_dependent"]);
  return html+"</div>";}

/* ---------- 词条详情页 ---------- */
function renderEntry(type,id){
  var e=byId[id];
  if(!e&&type){} 
  if(!e)return renderHome(true);
  var d=e.doc;
  var meta=TYPE_META[e.type];
  var html='<div class="crumb"><a href="#/">总览</a><span class="sep">/</span><a href="'+typeUrl(e.type)+'">'+esc(meta.label)+"</a><span class=\"sep\">/</span><span>"+esc(e.id)+"</span></div>";
  html+='<article class="ehead"><div class="row1">'+typeBadge(e.type)+kindTag(meta.kind)
      +'<span class="file-tag">'+esc(e.file)+"</span></div>";
  html+="<h1>"+esc(d.title||e.id)+"</h1>";
  if(d.summary)html+='<p class="esum">'+rich(d.summary)+"</p>";
  html+=sourcesHtml(d)+"</article>";
  html+='<div class="kbox" style="margin-top:8px">'+renderContent(e)+"</div>";
  /* 关系 */
  var rel=d.related_references||[];
  var refs=[];rel.forEach(function(r){var t=byId[r];refs.push(t?chipLink(entryRoute(t),r):'<span class="chip" title="词条不在本 demo 数据中">'+esc(r)+"</span>");});
  var back=[];ENTRIES.forEach(function(x){var rr=x.doc.related_references||[];if(rr.indexOf(e.id)>=0)back.push(chipLink(entryRoute(x),x.id));});
  html+='<div class="rel-box"><div class="lbl">相关词条（related_references）</div><div class="chips">'
     +(refs.length?refs.join(""):'<span style="color:var(--ink-3);font-size:12px">无</span>')+"</div>";
  if(back.length)html+='<div class="lbl" style="margin-top:8px">被引用（反向视图，派生）</div><div class="chips">'+back.join("")+"</div>";
  html+="</div>";
  /* 同目录前后 */
  var list=byDirType[e.type]||[],idx=list.indexOf(e);
  var prev=list[idx-1],next=list[idx+1];
  html+='<div class="pager">'+(prev?'<a href="'+entryRoute(prev)+'"><span class="dir">← 上一条 · '+esc(e.type)+"</span>"+esc(trunc(prev.title,60))+"</a>":"<span></span>")
     +(next?'<a href="'+entryRoute(next)+'" style="text-align:right"><span class="dir">下一条 · '+esc(e.type)+" →</span>"+esc(trunc(next.title,60))+"</a>":"")+"</div>";
  $view.innerHTML=html;
  renderNav(e.type);document.title="昇腾知识浏览器 · "+e.id;
  window.scrollTo(0,0);
  var dts=$view.querySelectorAll('details[open]');dts.forEach(function(x){x.removeAttribute("open");});
  var open=$view.querySelector('details.provenance');if(open)open.removeAttribute("open");
}

/* ---------- 搜索结果 ---------- */
function renderSearch(qRaw){
  var q=decodeURIComponent(qRaw||"");var res=search(q);
  var html='<div class="crumb"><a href="#/">总览</a><span class="sep">/</span><span>搜索</span></div>';
  html+='<div class="qhead"><h1>“<span class="q">'+esc(q)+'</span>”</h1><div class="n">命中 '+res.length+" 条（title/summary/id/全文，词条级加权）</div></div>";
  if(!res.length){html+='<div class="empty"><div class="big">∅</div>没有命中。<br><span style="font-size:12px;color:var(--ink-3)">试试错误码数字（如 507903）、命令关键字（如 msnpureport）、日志路径（如 ascend/log）、或平台名（如 310P）。</span></div>';}
  else{
    var groups={};
    res.forEach(function(r){var t=r.e.type;(groups[t]=groups[t]||[]).push(r);});
    TYPES.forEach(function(t){
      var g=groups[t.type];if(!g)return;
      html+='<div class="res-group"><div class="g-head"><h2>'+esc(t.label)+'</h2><span class="cnt">'+g.length+"</span></div>";
      g.forEach(function(r){
        html+='<a class="res-item" href="'+entryRoute(r.e)+'"><div class="r1"><span class="r-t">'+hilite(r.e.title,q)
           +'</span><span class="r-id">'+esc(r.e.id)+"</span></div>"
           +(r.e.summary?'<div class="r-sum">'+hilite(r.e.summary,q)+"</div>":"")+"</a>";});
      html+="</div>";});
  }
  $view.innerHTML=html;renderNav();
  window.scrollTo(0,0);document.title="搜索 · "+q;}

/* ---------- triage ---------- */
function renderTriage(){
  var html='<div class="crumb"><a href="#/">总览</a><span class="sep">/</span><span>症状路由图</span></div>';
  html+='<div class="triage-head"><h1>症状 → 检索路由（triage-tree）</h1>'
     +"<p>两个正交轴：<b>在哪查</b>＝训推 × 框架（→ <code>knowledge/</code> 命名空间，本 demo 未含私有 case 内容）；<b>什么性质</b>＝category 决定诊断路径。人面学习用法：把现场报错里的关键词，对照下面各分支的症状词，理解“这类问题该往哪个方向查”。</p></div>";
  html+='<div class="stat-line" style="margin:14px 0 0"><b>'+TRIAGE.length+"</b> 个路由分支</div>";
  html+='<div class="branches">'+TRIAGE.map(function(b){
    var syms=(b.symptoms||[]);
    var ns=(b.search_namespaces||[]).map(function(n){return chip(n,"chip-plat");}).join("");
    return '<div class="branch"><div class="b-head"><span class="b-id">'+esc(b.id)+'</span>'
      +chip(CAT_LABEL[b.category]||b.category,"chip-cat")+ns+'</div>'
      +'<div class="b-sym"><details><summary>症状关键词 '+syms.length+' 条（regex）▸</summary>'
      +'<div class="b-list">'+esc(syms.join("\n"))+"</div></details></div></div>";}).join("")+"</div>";
  html+='<div class="note-box">demo 边界：<code>references/</code> 词条按上面 “从报错开始 / 学一类流程 / 工具事实速查” 浏览；case 层（knowledge/，含客户数据，私有）不在本文件内。case↔reference 反链（ref_knowledge）随 diagnose 沉淀累积后再加入。</div>';
  $view.innerHTML=html;renderNav();
  window.scrollTo(0,0);document.title="症状路由图";}

/* ---------- 首页 ---------- */
var HOME_START=[
  {no:"1",h:"从报错码开始",p:"现场报错数字 / 特征字符串 → 查含义、关联特征与来源案例（case-derived 一行式结论）。",to:"打开错误码表",href:"#/d/error-code",cls:""},
  {no:"2",h:"学一类问题的定位流程",p:"方法论词条把“去哪采集 / 采完跑哪些命令、逐步验证”拆成可执行步骤流（when_to_use 分流）。",to:"浏览 8 条方法论",href:"#/d/methodology",cls:""},
  {no:"3",h:"先搞清楚日志在哪儿",p:"EP / RC / Control CPU 三形态的日志路径与工具，是几乎所有定位的第一步。",to:"看日志路径词条",href:"#/e/software-fact/ascend-log-locations",cls:""},
  {no:"4",h:"现象 → 往哪查",p:"triage 路由：把报错关键词归到中断 / 精度 / 性能 × 训推框架的检索入口。",to:"看路由图",href:"#/triage",cls:""}];
function renderHome(failed){
  var entries=ENTRIES;
  var html='<div class="crumb"><span>总览</span></div>';
  html+='<div class="hero"><div class="kicker">ascend-sleuth · references</div>'
     +"<h1>先验知识层的<br>人面检索与学习</h1>"
     +'<p>同一批词条既服务 diagnose（agent 按需加载），也在这里面向人：错误码表、故障模式、方法论步骤流、工具与事实。'
     +"每条标注<b>来源类型与核验状态</b>——官方文档交叉核验，或从真实 case 提炼的教训压缩。</p>"
     +'<div class="bigsearch"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>'
     +'<input id="heroQ" type="search" placeholder="错误码 507903 · HCCL_DFS_CONFIG · msnpureport · ascend/log …" aria-label="搜索知识库"><kbd>/</kbd></div></div>';
  html+='<div class="starts">'+HOME_START.map(function(s){
    var exists=true;
    if(s.href.indexOf("#/e/")===0){var parts=s.href.split("/");var id=decodeURIComponent(parts[parts.length-1]);exists=!!byId[id];}
    if(!exists)return "";
    return '<a class="start" href="'+s.href+'"><div class="no">'+s.no+'</div><h3>'+esc(s.h)+"</h3><p>"+esc(s.p)
      +'</p><span class="to">'+esc(s.to)+" →</span></a>";}).join("")+"</div>";
  html+='<div class="sec-head" style="margin-top:40px"><h2>浏览目录</h2><span class="sub">'+entries.length+" 词条 · 数据 references/</span></div>";
  TYPES.forEach(function(t){
    var list=byDirType[t.type]||[];
    html+='<div class="sec-head"><h2><a href="'+typeUrl(t.type)+'" style="color:var(--ink)">'+esc(t.label)+"</a></h2>"
       +'<span class="sub">'+list.length+" 词条 · "+esc(t.hint)+"</span></div>";
    html+='<div class="grid">'+list.slice(0,6).map(function(e){
      return '<a class="tile" href="'+entryRoute(e)+'"><div class="t-top"><span class="t-title">'+esc(e.title)+"</span></div>"
        +'<div style="margin-top:4px"><span class="t-id">'+esc(e.id)+"</span></div>"
        +(e.summary?'<div class="t-sum">'+esc(e.summary)+"</div>":"")+"</a>";}).join("")
      +(list.length>6?'<a class="tile" href="'+typeUrl(t.type)+'" style="border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--ink-3)">还有 '+ (list.length-6) +" 条 →</a>":"")+"</div>";
  });
  if(failed){html+='<div class="note-box">没有找到该词条（id 可能不在本 demo 数据中）。</div>';}
  $view.innerHTML=html;renderNav();
  window.scrollTo(0,0);document.title="昇腾知识浏览器 · 总览";
  bindSearch(document.getElementById("heroQ"));
  var hq=document.getElementById("heroQ");if(hq)hq.focus();}

/* ---------- 路由 ---------- */
function route(){
  var h=location.hash||"#/";
  if(h.indexOf("#/e/")===0){var p=h.slice(4).split("/").filter(Boolean);var type=decodeURIComponent(p[0]||""),id=decodeURIComponent(p[1]||"");renderEntry(type,id);return;}
  if(h.indexOf("#/d/")===0){renderDir(decodeURIComponent(h.slice(4)));return;}
  if(h.indexOf("#/q/")===0){renderSearch(h.slice(4));return;}
  if(h==="#/triage"){renderTriage();return;}
  renderHome();}
window.addEventListener("hashchange",route);

/* ---------- 事件 ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-copy]");
  if(b){copyText(b.getAttribute("data-copy"),b);return;}
  var t=ev.target.closest(".rail-toggle");if(t){$rail.classList.toggle("open");return;}
  if(!ev.target.closest(".rail")){$rail.classList.remove("open");}
  var l=ev.target.closest("a[href^='#']");if(l){$rail.classList.remove("open");}
});
function bindSearch(input){
  if(!input)return;
  input.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"&&input.value.trim()){location.hash="#/q/"+encodeURIComponent(input.value.trim());}
  });
}
document.addEventListener("keydown",function(ev){
  if(ev.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){ev.preventDefault();
    var hq=document.getElementById("heroQ");if(hq){hq.focus();hq.select();}else{$sideQ.focus();$sideQ.select();}}});
$sideQ.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&$sideQ.value.trim()){location.hash="#/q/"+encodeURIComponent($sideQ.value.trim());}});

/* ---------- 脚注 ---------- */
$railFoot.innerHTML="数据："+ENTRIES.length+" 词条（references/）<br>生成于 "+esc(KB.generated_at)+"<br>case 层（knowledge/）为私有内容，未纳入";
route();
})();
</script>
