hape 场景每个 node 执行时对 shape 推导，算子 shape 校验不合法（推导链中某节点 shape 不合理）","fix":"开启 DEBUG 日志（export ASCEND_GLOBAL_LOG_LEVEL=0）重跑，搜 before_infershape/after_infershape 查看推导前后 shape，从报错节点沿输入链排查不合理的 shape 推导；调试后恢复 ASCEND_GLOBAL_LOG_LEVEL=3"}]}}},{"id":"operator-exec-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/operator-exec.yaml","title":"算子执行问题（11 条）","summary":"算子执行故障：插件/原型未注册、AI Core 算子执行报错（0x800000）、AI CPU 算子执行报错/超 8 维/超时/标量输入、单算子匹配失败、coredump 重复释放、opp 版本不匹配、Moe 通信算子网络问题","doc":{"id":"operator-exec-fault-patterns","type":"fault-pattern","title":"算子执行问题（11 条）","summary":"算子执行故障：插件/原型未注册、AI Core 算子执行报错（0x800000）、AI CPU 算子执行报错/超 8 维/超时/标量输入、单算子匹配失败、coredump 重复释放、opp 版本不匹配、Moe 通信算子网络问题","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0148.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0148-0157/0492/0537）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"算子插件未注册报错","symptoms":["Check op type failed, it is not supported","frameworkop"],"cause":"算子插件 so 未加载成功，或算子未注册映射关系/未编译到算子插件 so 中","fix":"确认算子插件 so 加载成功（日志含 plugin load ...success）；加载失败告警含 dlopen failed, plugin name"},{"pattern":"算子原型未注册报错","symptoms":["have no ir factory","IR for op is not registered"],"cause":"算子原型 so 未加载成功，或算子未定义注册该类型算子并编译到原型 so 中","fix":"确认算子原型 so 加载成功，检查算子原型注册"},{"pattern":"AI Core 算子执行报错","symptoms":["aicore error","error code = 0x800000","fault kernel_name","The DDR address of the MTE instruction is out of range"],"cause":"AI Core 算子执行失败——算子本身代码问题：数据输入不匹配、访问越界、计算溢出等","fix":"查阅 plog 日志，按 fault kernel_name 和 func_name 获取报错算子名称与函数，排查算子输入数据/越界/溢出"},{"pattern":"AI CPU 算子 Kernel 执行报错","symptoms":["aicpu exception","ErrCode=507018","Aicpu kernel execute failed","ProcessAicpuErrorInfo"],"cause":"AI CPU 算子执行失败——数据输入不匹配（数据格式/广播维度）、访问越界、AI CPU 线程挂死、执行超时（默认不超 30 秒）；TensorFlow 系算子广播轴合并后维度要求 <6","fix":"查阅 AI CPU 日志（EP：$HOME/ascend/log/[run|debug]/device-id、RC：device-app-pid）定位具体报错（如 Unique 需 1D 向量、广播维度超限）"},{"pattern":"AI CPU 算子维度超过 8 维报错","symptoms":["errno[561000]","shape dim num should be less than 8","aclnnGatherV2"],"cause":"AI CPU 算子输入/输出参数维度超过最大维度限制（8 维）","fix":"修改算子参数输入/输出维度，确保不超过 8 维"},{"pattern":"AI CPU 算子执行超时报错","symptoms":["aicpu timeout","ErrCode=507017","HandleTaskTimeout"],"cause":"算子输入/输出 shape 太大导致执行缓慢，或硬件性能不足无法支持大量复杂算子计算","fix":"用 aclrtSetOpExecuteTimeOut(timeout) 适当调大算子执行超时时间（单位秒）"},{"pattern":"单算子匹配失败","symptoms":["failed to match model","MatchOpModel fail from static map or dynamic map","Has not been compiled or loaded"],"cause":"离线场景算子 om 文件未出现在 aclSetModelDir 指定路径；在线场景特殊匹配规则未适配","fix":"离线重新编译缺失算子并复制到 aclSetModelDir 路径；在线检查前后两次编译的 opType/dataType/format 等是否一致"},{"pattern":"执行单算子产生 coredump 的定位处理","symptoms":["double free or corruption(!prev)"],"cause":"代码中出现重复释放内存的操作","fix":"gdb 挂载可执行文件、查看调用栈定位重复释放；非用户代码问题联系技术支持"},{"pattern":"算子库包版本问题导致加载单算子失败","symptoms":["The opp version of the model does not match the current opp run package","E19999"],"cause":"动态 shape 或虚拟化实例场景下，加载环境 opp 包版本（Ascend-cann-toolkit）与 om 编译环境版本不一致","fix":"保持加载环境与编译环境 opp 版本一致：更换加载环境 opp 包，或更换编译环境 opp 包后重新转换模型"},{"pattern":"AI CPU 算子输入标量执行报错","symptoms":["Shape must be at least rank [1] but is rank [0]","GetInputAndCheck failed"],"cause":"部分 AI CPU 算子输入不支持零维 Tensor（标量）","fix":"将算子输入的标量按 1 维 Tensor 创建"},{"pattern":"网络问题导致 Moe Dispatch_Combine 算子执行报错","symptoms":["MoeDistributeDispatchV2","MoeDistributeCombineV2","error code = 0x800000","The DDR address of the MTE instruction is out of range","suspect remote error"],"cause":"A3 训练/推理系列：①EP 域 Rank 跨越超节点（MTE 依赖 HCCS 链路，通信域必须在同一超节点内）；②网络交换机故障（闪断/光链路/超时代答，灵渠超时代答使跨卡通信报 0x800000 MTE out of range）；③EP 域其他卡远端进程异常退出导致本端访问远端地址报 0x800000；④多卡全报错时按时间找首报错","fix":"收集所有 Rank 的 plog；grep fault_kernel_name 确认报错卡；EP 域跨 Server 用 msnpureport 收集 Device 系统日志 grep app exit begin 按时间排序找首报错 Rank；首报错为 Moe 算子且 MTE out of range 时检查网络交换机故障，否则查首报错进程退出原因（Host CoreDump）"}]}}},{"id":"compile-exec-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/compile-exec.yaml","title":"编译 / 执行 AI 应用问题（4 条）","summary":"应用编译与执行故障：找不到头文件/库文件（DDK_PATH/NPU_HOST_LIB 配置错）/ 权限不足 acl 初始化失败（507008）/ acl 接口无输出无报错（stub so 或未流同步）/ dvpp 接口编译失败（未链接 libacl_dvpp.so）","doc":{"id":"compile-exec-fault-patterns","type":"fault-pattern","title":"编译 / 执行 AI 应用问题（4 条）","summary":"应用编译与执行故障：找不到头文件/库文件（DDK_PATH/NPU_HOST_LIB 配置错）/ 权限不足 acl 初始化失败（507008）/ acl 接口无输出无报错（stub so 或未流同步）/ dvpp 接口编译失败（未链接 libacl_dvpp.so）","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0219.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0219/0221/0222/0223）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"编译运行应用样例报错，提示找不到头文件或库文件","symptoms":["cannot find -lascendcl","ld returned 1 exit status"],"cause":"编译依赖的 DDK_PATH / NPU_HOST_LIB 环境变量配置不正确（编译脚本按 {DDK_PATH}/runtime/include/acl 找头文件、按 {NPU_HOST_LIB} 找库文件）","fix":"echo 检查两个环境变量；确认头文件 acl.h 与库文件 libascendcl.so 路径存在；同架构 export DDK_PATH=${INSTALL_DIR}、NPU_HOST_LIB=$DDK_PATH/runtime/lib64/stub，交叉编译时 DDK_PATH 指向 arm64-linux 软件包目录"},{"pattern":"执行应用程序的权限不足导致 acl 接口初始化报错","symptoms":["halGetDeviceInfo failed","init soc version failed, ret = 507008","aclInit failed"],"cause":"Device 状态异常未正常启动，或执行应用程序的用户权限不足无法查询 Device 信息","fix":"cat /etc/ascend_install.info 查 Driver 安装路径确认 Device 正常启动，检查执行用户权限"},{"pattern":"acl 接口执行无输出无报错","symptoms":["无输出无报错"],"cause":"执行 acl 接口过程中链接到了 stub 中的 so；或异步场景下拷贝输出数据时没有做流同步","fix":"ldd 查看可执行文件链接的 so 确保链接有效 so；异步接口（如拷贝）需显式调用 aclrtSynchronizeStream 阻塞等待任务完成，否则可能业务异常/Device 断链掉卡"},{"pattern":"APP 使用 dvpp 接口编译失败","symptoms":["dvpp 接口编译失败"],"cause":"DVPP 相关接口打包在 libacl_dvpp.so 中，测试用例使用了 DVPP 接口但未链接 libacl_dvpp.so","fix":"在编译文件（CmakeLists target_link_libraries）中链接 acl_dvpp"}]}}},{"id":"runtime-resource-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/runtime-resource.yaml","title":"运行时资源异常问题（10 条）","summary":"运行时资源故障：内存泄漏（申请不释放）/ Event 超上限（207007）/ 异常退出后重启失败（资源释放未完成）/ unbind model stream failed / 休眠唤醒失败（hwts busy）/ OOM（207001）/ 异步拷贝查询时序（507899）/ 低版本内核 asan / 析构调用 aclFinalize coredump","doc":{"id":"runtime-resource-fault-patterns","type":"fault-pattern","title":"运行时资源异常问题（10 条）","summary":"运行时资源故障：内存泄漏（申请不释放）/ Event 超上限（207007）/ 异常退出后重启失败（资源释放未完成）/ unbind model stream failed / 休眠唤醒失败（hwts busy）/ OOM（207001）/ 异步拷贝查询时序（507899）/ 低版本内核 asan / 析构调用 aclFinalize coredump","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0110.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0110-0122）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"内存未释放导致内存泄漏","symptoms":["内存持续增长"],"cause":"系统存在只申请内存不释放的问题，内存申请与释放必须成对出现","fix":"排查所有内存申请与释放并保证一一对应（aclrtMalloc/aclrtFree、aclrtMallocHost/aclrtFreeHost、aclrtCreateStream/aclrtDestroyStream 等）"},{"pattern":"Event 数量超过上限导致 aclrtRecordEvent 接口返回失败","symptoms":["Event id alloc error","ErrCode=207007","driver error:no event resource","eventRecord failed"],"cause":"Event ID 的数量超过上限","fix":"多 Stream 同步等待场景下复用 Event ID——aclrtRecordEvent+aclrtStreamWaitEvent 后若 Event 已完成及时调 aclrtResetEvent 释放"},{"pattern":"进程异常退出后重新执行任务失败","symptoms":["进程异常退出后新任务失败"],"cause":"进程异常退出时系统检测到程序退出后才释放资源，释放最长需一分钟，未完成前执行新任务会失败","fix":"进程异常退出后等待一分钟再重新执行任务"},{"pattern":"进程异常，下一次执行任务报错 unbind model stream failed","symptoms":["unbind model stream failed","stream is running"],"cause":"进程异常时 Host 内核态驱动会自动检测并发起 Device 侧资源释放，用户主动捕获并处理异常信号会干扰系统资源释放流程","fix":"用户无需关注进程异常退出信号，不要对异常退出信号做处理"},{"pattern":"用户进程异常退出后重启进程失败","symptoms":["aclrtProcessReport failed, ret = 107012","halResourceIdAlloc streamid failed","ErrCode=207008","driver error:no stream resource"],"cause":"public taskid / stream id / eventid 等资源申请不到——资源被其他进程占用完，或上一进程退出时未完全释放","fix":"等待一分钟保证上一进程资源释放完成；停止其他进程或等其他进程完成后启动；仍失败检查是否超资源上限，未超上限则重启环境强行释放资源"},{"pattern":"AI 应用进程未退出，导致休眠唤醒失败","symptoms":["suspend pre check fail, hwts is busy","ts suspend ack ret=1"],"cause":"休眠前 AI 应用进程必须先退出、硬件资源处于 idle 态才允许休眠；AI 进程未退出时检测到 hwts busy 导致休眠失败","fix":"确保 AI 应用进程运行结束或优雅退出（推荐 kill -2 <pid>）"},{"pattern":"内存申请失败，出现 OOM","symptoms":["Heap_alloc_managed out of memory","halMemAlloc failed","drvRetCode=6"],"cause":"网络并行运行导致内存不足，或网络运行需要内存过大导致申请失败","fix":"查看运行网络是否存在并行情况；查询网络运行内存大小或减少 batchsize"},{"pattern":"异步拷贝调用查询接口报错","symptoms":["Set free error","Devmm_iotcl_free failed","ErrCode=507899","rtFreeHost"],"cause":"异步拷贝任务后下发 event record，aclrtQueryEventStatus 查询到的是 Device 执行完任务未透传 Host，此时未先销毁 Event 直接 aclrtFreeHost 有时序问题","fix":"方案一用 aclrtSynchronizeStream 判断任务完成；方案二用 aclrtQueryEventStatus 时先调 aclrtDestroyEvent 再调 aclrtFreeHost"},{"pattern":"低版本内核使用 asan 导致算子执行失败","symptoms":["Task run failed","The MPU address access is invalid","vector core exception"],"cause":"用户程序编译选项启动地址消毒（-lasan），但低版本内核（5.10 以下）不支持 asan，执行算子时拷贝输出数据异常","fix":"uname -r 查内核版本；升级内核到 5.10 或更高，或在编译选项中去掉 -lasan"},{"pattern":"析构函数中调用去初始化接口 aclFinalize 导致应用进程 coredump","symptoms":["aclFinalize","Segmentation fault","SIGSEGV"],"cause":"在析构函数（单例/全局变量析构）中调用 aclFinalize——进程退出时单例/全局析构与依赖 so 卸载顺序无法控制，aclFinalize 访问的资源所在 so 可能已卸载","fix":"不在析构函数中调用 aclFinalize；在 main 函数内业务处理完成后显式调用 aclFinalize"}]}}},{"id":"process-interrupt-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/process-interrupt.yaml","title":"进程中断典型案例（4 条）","summary":"进程中断专题典型案例：SetDevice 错误无可用 Context（107002）/ rtMemcpyAsync 异步参数校验（107000）/ 算子执行中 D2D 拷贝 SDMA ECC（000Ah）/ 环境变量访问冲突多次 coredump","doc":{"id":"process-interrupt-fault-patterns","type":"fault-pattern","title":"进程中断典型案例（4 条）","summary":"进程中断专题典型案例：SetDevice 错误无可用 Context（107002）/ rtMemcpyAsync 异步参数校验（107000）/ 算子执行中 D2D 拷贝 SDMA ECC（000Ah）/ 环境变量访问冲突多次 coredump","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0065.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0065-0068）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-process-interrupt-triage"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"调用 SetDevice 接口错误导致无可用 Context","symptoms":["ctx is NULL","context pointer null","ErrCode=107002","rtCtxGetSysParamOpt"],"cause":"SetDevice 相关接口（aclrtSetDevice / rtSetDevice/rtSetDeviceEx）调用异常导致无可用 Context——运行环境 Device 异常无法创建 Context、多线程只对主线程 SetDevice 子线程无 Context、报错后才调用 SetDevice","fix":"export ASCEND_GLOBAL_LOG_LEVEL=1 重跑，plog grep SetDevice 排查三类场景（Device 异常 / 子线程未 SetDevice / 报错后才调用）并优化代码逻辑"},{"pattern":"rtMemcpyAsync 异步参数校验报错","symptoms":["Memory async failed","kind=1 is invalid","rtMemcpyAsync","ErrCode=107000"],"cause":"rtMemcpyAsync 参数校验失败：kind（0 Host 内 / 1 Host→Device / 2 Device→Host）与 loc type（1 Host / 2 Device / 3 SVM / 4 DVPP）组合非法","fix":"检查 aclrtMemcpyAsync/rtMemcpyAsync 的 kind 与源目的 loc type 参数是否在合法组合内"},{"pattern":"算子执行过程中 D2D 拷贝出错","symptoms":["sdma error","ProcessStarsSdmaErrorInfo","cqeStatus"],"cause":"SDMA（D2D 拷贝）任务执行报错，cqeStatus>>1 得错误码 000Ah=COMPDATAERR（数据异常访问 HBM 返回 error），大概率 HBM 比特 ECC 故障","fix":"Device slog 日志（slog/dev-os-id/run/event/event_*.log）搜 event_id 查《健康管理故障定义》对应版本手册"},{"pattern":"环境变量访问冲突导致应用异常终止","symptoms":["多次 core dump","getenv"],"cause":"训练脚本动态写环境变量（os.environ 实际调 putenv）与算子编译读 getenv 冲突，导致应用异常终止","fix":"删除代码中动态设置环境变量的逻辑，改为执行程序前设置；物理机 ulimit -c unlimited 生成 coredump、Docker 加 --ulimit core=-1，用 gdb 定位"}]}}},{"id":"process-hang-fault-patterns","type":"fault-pattern","dir":"fault-patterns","file":"references/fault-patterns/process-hang.yaml","title":"进程卡住典型案例（1 条）","summary":"进程卡住专题典型案例：fork 方式创建子进程触发 Python 死锁（3.8-3.11）","doc":{"id":"process-hang-fault-patterns","type":"fault-pattern","title":"进程卡住典型案例（1 条）","summary":"进程卡住专题典型案例：fork 方式创建子进程触发 Python 死锁（3.8-3.11）","sources":[{"type":"official-doc","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0075.html","version":"CANN 商用版 9.0.0（troubleshooting 章 0075）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"related_references":["ascend-process-hang-triage"],"applies_to":{"platforms":["cross"],"versions":{"cann":"9.0.0"}},"status":"active","last_verified":"2026-08-28","content":{"patterns":[{"pattern":"fork 方式创建子进程导致应用进程卡死","symptoms":["py-spy 栈含 fork|popen_fork","gdb 栈含 acquire_lock","multiprocessing/pool.py"],"cause":"Python 3.8-3.11 未指定或显式指定 fork 创建子进程时复制主进程锁状态，子进程再触发获取锁导致死锁（python/cpython issue 74580）","fix":"升级 Python 3.8-3.11 补丁版本，或修改业务代码显式用 forkserver/spawn 启动方式"}]}}},{"id":"amct-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/amct-env.yaml","title":"AMCT 模型压缩环境变量","summary":"CANN 环境变量参考（envref 系列）：AMCT 模型压缩，4 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"amct-env","type":"env-var-table","title":"AMCT 模型压缩环境变量","summary":"CANN 环境变量参考（envref 系列）：AMCT 模型压缩，4 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 350 加速卡","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 200I/500 A2 推理产品","Atlas 训练系列产品","Atlas 推理系列产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"AMCT_LOG_DUMP","description":"控制训练后量化过程中日志落盘等信息的环境变量。该环境变量仅适用于调用aclgrphCalibration接口进行的量化。 取值为： - 1：（默认值）日志落盘到当前路径的“amct_log_{timestamp}/amct_acl.log”文件中，不保存量化因子record文件和graph文件。 - 2：日志落盘到当前路径的“amct_log_{timestamp}/amct_acl.log”文件中，同时在“amct_log_{timestamp}”目录下保存量化因子record文件。 - 3：日志落盘到当前路径的“amct_log_{timestamp}/amct_acl.log”文件中，同时在“amct_log_{timestamp}”目录下保存量化因子record文件和包含量化过程中各阶段图描述信息的graph文件。","example":"export AMCT_LOG_DUMP=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0112.html"},{"name":"AMCT_LOG_FILE_LEVEL","description":"控制日志文件（PyTorch框架：amct_pytorch.log；Caffe框架：amct_caffe.log；ONNX：amct_onnx.log）的信息级别以及生成精度仿真模型时，对应量化层生成的日志文件信息级别。 取值为： - DEBUG：输出DEBUG/INFO/WARNING/ERROR级别的运行信息。包括详细的流程信息、量化层及对应的处理阶段（融合，参数量化或者数据量化等）。 - INFO：（默认值）输出INFO/WARNING/ERROR级别的运行信息。概要的量化处理信息，包含量化的阶段等信息。 - WARNING：输出WARNING/ERROR级别的运行信息。量化处理过程中的警告信息。 - ERROR：输出ERROR级别的运行信息。量化处理过程中的错误信息。","example":"export AMCT_LOG_FILE_LEVEL=INFO","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0109.html"},{"name":"AMCT_LOG_LEVEL","description":"控制屏幕输出的信息级别。该环境变量仅适用于PyTorch框架、Caffe框架、ONNX网络模型的量化。 取值为： - DEBUG：输出DEBUG/INFO/WARNING/ERROR级别的运行信息。详细的流程信息，包括量化层及对应的处理阶段（融合，参数量化或者数据量化等）。 - INFO：（默认值）输出INFO/WARNING/ERROR级别的运行信息。概要的量化处理信息，包含量化的阶段等信息。 - WARNING：输出WARNING/ERROR级别的运行信息。量化处理过程中的警告信息。 - ERROR：输出ERROR级别的运行信息。量化处理过程中的错误信息。","example":"export AMCT_LOG_LEVEL=INFO","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0110.html"},{"name":"DUMP_AMCT_RECORD","description":"控制是否生成权重和数据的量化因子。该环境变量仅适用于MindSpore框架的模型压缩。 取值为： - 1：生成量化因子文件。 - 0：（默认值）不生成。 量化感知训练场景此环境变量必须配置。","example":"export DUMP_AMCT_RECORD=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0111.html"}]}}},{"id":"aoe-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/aoe-env.yaml","title":"AOE 调优环境变量","summary":"CANN 环境变量参考（envref 系列）：AOE 调优，3 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"aoe-env","type":"env-var-table","title":"AOE 调优环境变量","summary":"CANN 环境变量参考（envref 系列）：AOE 调优，3 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品（AOE_MODE取值仅支持1和2）","Atlas A2 训练系列产品","Atlas A2 推理系列产品（AOE_MODE取值仅支持2和4）","Atlas A3 训练系列产品","Atlas A3 推理系列产品（AOE_MODE取值仅支持2）","Atlas 推理系列产品","Atlas A2 推理系列产品","Atlas 200I/500 A2 推理产品","Atlas A3 推理系列产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"AOE_MODE","description":"在线推理与训练场景下，可通过此环境变量指定AOE调优模式，支持如下取值： - 1：子图调优 - 2：算子调优 - 4：梯度切分调优","example":"export AOE_MODE=2","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0106.html"},{"name":"REPEAT_TUNE","description":"是否重新发起调优，此环境变量在开启子图调优或算子调优的场景下生效。 如果知识库（内置或者自定义）中已经存在网络模型中的调优case（针对某shape的调优策略），则会跳过此case的调优流程，若想重新发起调优，可设置此环境变量为True。例如某些算子进行了逻辑的变更，如GEMM算子新增了支持ND的输入，该情况下需要设置此环境变量后，重新发起调优。 取值范围： - True - False 默认值为“False”。","example":"export REPEAT_TUNE=False","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0105.html"},{"name":"TUNE_BANK_PATH","description":"可通过此环境变量指定调优后自定义知识库的存储路径。 设置的存储路径必须为绝对路径或相对于执行AOE调优引擎所在路径的相对路径，配置的路径需要为已存在的目录，且执行用户具有读、写、执行权限。若配置的TUNE_BANK_PATH路径不存在或用户无权限，则调优进程会报错并退出。 - 子图自定义知识库若不配置此环境变量，请使用env命令查询ASCEND_CACHE_PATH是否存在，若存在，自定义知识库存储在：${ASCEND_CACHE_PATH}/aoe_data；若不存在，自定义知识库默认存储在：${HOME}/Ascend/latest/data/aoe/custom/graph/${soc_version}。 - 若配置了此环境变量，自定义知识库存储在该环境变量路径下。 - 算子自定义知识库若不配置此环境变量，请使用env命令查询ASCEND_CACHE_PATH是否存在，若存在，自定义","example":"export TUNE_BANK_PATH=/home/HwHiAiUser/custom_tune_bank  调优前设置该环境变量，作用是指定自定义的知识库存储路径。设置后，会在TUNE_BANK_PATH指定的目录下，生成如下结构的目录和文件。 调优后设置该环境变量，作用是使用已有的自定义知识库，请确保TUNE_BANK_PATH指定的目录结构如下。  ├──Ascendxxx //表示soc_version，以实际生成的名字为准。该文件夹下存放的是算子知识库。 │ ├── cube │ │ ├── op1.bin //op1，op2，op3表示生成的算子知识库名称，以实际生成的文件名为准。 │ │ ├── op1.json │ │ ├── op2.bin │ │ └── op2.json │ └── unified_bank │ └── op3.json └──","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0104.html"}]}}},{"id":"hccl-function-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/hccl-function-env.yaml","title":"HCCL 功能相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 功能相关，10 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"hccl-function-env","type":"env-var-table","title":"HCCL 功能相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 功能相关，10 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 350 加速卡","Atlas A3 训练系列产品 /","Atlas A3 推理系列产品","Atlas A2 训练系列产品 /","Atlas A2 推理系列产品","Atlas 训练系列产品 父主题： 功能相关","Atlas A2 推理系列产品 （针对","Atlas A2 推理系列产品 ，仅支持","Atlas 800T A2 训练服务器、","Atlas 900 A2 PoD 集群基础单元、","Atlas 200T A2 Box16 异构子框。）","Atlas 训练系列产品","Atlas 推理系列产品 （针对","Atlas 推理系列产品 ，仅支持","Atlas 300I Duo 推理卡。） 父主题： 功能相关","Atlas A3 训练系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品（针对","Atlas A2 推理系列产品，仅支持","Atlas 推理系列产品（针对","Atlas 推理系列产品，仅支持","Atlas 300I Duo 推理卡。）","Atlas A3 推理系列产品 父主题： 功能相关","Atlas 训练系列产品：仅支持此处理器型号下的","Atlas 300T Pro 训练卡。","Atlas A2 推理系列产品：仅支持此处理器型号下的","Atlas 200T A2 Box16 异构子框。","Atlas A3 推理系列产品：仅在使用LLM-DataDist作为集群管理组件的场景下生效。"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"HCCL_ALGO","description":"此环境变量用于配置集合通信Server间通信算法以及超节点间通信算法，支持全局配置算法类型与按算子配置算法类型两种配置方式。 本节仅对支持配置的算法功能进行了简要介绍，如需详细了解，可参见集合通信算法介绍。 - HCCL提供自适应算法选择功能，默认会根据产品形态、数据量和Server个数选择合适的算法，一般情况下用户无需手工指定。若通过此环境变量指定了Server间或超节点间通信算法，则自适应算法选择功能不再生效。 - 在某些通信算子中，当使用特定类型的AI处理器且数据量较小时，通信算法会由HCCL自适应选择，不受此环境变量的控制。 - 本节所列出的算法为HCCL支持配置的全量通信算法，不同产品下支持的Server间通信算法与超节点间通信算法可参见Server间通信算法支持度列表与超节点间通信算法支持度列表。 - 全局配置算法类型，配置方式如下： export HCCL_ALGO=\"lev","example":"- 全局配置算法类型  export HCCL_ALGO=\"level0:NA;level1:NHR\"  - 按算子配置算法类型  # AllReduce算子使用Ring算法，AllGather算子使用RHD算法，其他算子根据产品形态、节点数以及数据量自动选择通信算法。 export HCCL_ALGO=\"allreduce=level0:NA;level1:ring/allgather=level0:NA;level1:H-D_R\"","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0079.html"},{"name":"HCCL_BUFFSIZE","description":"此环境变量用于控制通信域所使用的共享数据缓存区大小。需要配置为整数，取值大于等于1，默认值为200，单位MB。 集合通信中，每个通信域都会占用HCCL_BUFFSIZE大小的缓存区。若集群中存在较多的通信域，整体缓存占用会增加，可能影响模型数据的正常存储。此种场景下，可通过调小该环境变量的值以降低通信域占用的缓存空间；若业务的模型数据量较小，但通信数据量较大，可适当调大该环境变量的值以增大通信域占用的缓存空间，以提升数据通信效率。 大语言模型中的建议配置值如下： (MicrobatchSize * SequenceLength * hiddenSize * sizeof (DataType) )/(1024*1024)，向上取整。 此环境变量一般用于以下场景： - 动态shape网络场景。 - 开发人员调用集合通信库HCCL的C语言接口进行框架对接的场景。 需要注意： - 该环境变量申请的","example":"export HCCL_BUFFSIZE=200","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0080.html"},{"name":"HCCL_CONNECT_TIMEOUT","description":"分布式训练或推理场景下，用于限制不同设备之间socket建链过程的超时等待时间。不同设备进程在集合通信初始化之前由于其他因素会导致执行不同步。该环境变量控制设备间的建链超时等待时间，在该配置时间内各设备进程等待其他设备建链同步。 该环境变量需要配置为整数，取值范围[120,7200]，默认值为120，单位s。 需要注意的是：实际的建链超时等待时间是该环境变量的值加上20秒。例如，如果该环境变量设置为150秒，则实际的超时等待时间为170秒。额外的20秒用于通知各个节点通信域初始化失败的原因。 此环境变量的值会影响链路故障场景的异常上报时间。","example":"export HCCL_CONNECT_TIMEOUT=200","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0077.html"},{"name":"HCCL_DETERMINISTIC","description":"此环境变量用于配置是否开启归约类通信算子的确定性计算或保序功能，其中归约类通信算子包括AllReduce、ReduceScatter、ReduceScatterV、Reduce，归约保序是指严格的确定性计算，在确定性的基础上保证归约顺序一致。 开启归约算子的确定性计算或保序功能后，算子在相同的硬件和输入下，多次执行将产生相同的输出。 HCCL_DETERMINISTIC支持的取值如下： - false：默认值，关闭确定性计算。 - true：开启归约类通信算子的确定性计算。 针对 Atlas A2 训练系列产品 / Atlas A2 推理系列产品 ，支持通信算子AllReduce、ReduceScatter、ReduceScatterV、Reduce。 - 针对 Atlas A3 训练系列产品 / Atlas A3 推理系列产品 ，若通信算子的展开模式为AI CPU，所有归约类算子都为确定","example":"export HCCL_DETERMINISTIC=true","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0099.html"},{"name":"HCCL_EXEC_TIMEOUT","description":"不同设备进程在分布式训练或推理过程中存在卡间执行任务不一致的场景（如仅特定进程会保存checkpoint数据），通过该环境变量可控制设备间执行时同步等待的时间，在该配置时间内各设备进程等待其他设备执行通信同步。 - 针对Atlas 350 加速卡：单位为s，取值范围为：[0, 2147483647]，默认值为1836，支持整数秒配置。当配置为0时代表永不超时。 - 针对 Atlas A3 训练系列产品 / Atlas A3 推理系列产品 ： “AI_CPU”与“AICPU_CacheDisable”模式下（参见HCCL_OP_EXPANSION_MODE）：单位为s，取值范围为：[0, 2147483647]，默认值为1836，支持十毫秒级精度配置（例如，需要50毫秒超时，则配置为0.05）。当配置为0时代表永不超时。 - “AIV”模式下：单位为s，取值范围为[0, 1091]，默认值为","example":"export HCCL_EXEC_TIMEOUT=1800","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0078.html"},{"name":"HCCL_INTER_HCCS_DISABLE","description":"此环境变量用于配置超节点模式组网中超节点内的通信链路类型，支持如下取值： - TRUE：代表超节点内的AI节点间使用RoCE进行RDMA通信。 - FALSE：代表超节点内的AI节点间使用HCCS通信链路进行SDMA通信。 默认值为“FALSE”。","example":"export HCCL_INTER_HCCS_DISABLE=FALSE","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0083.html"},{"name":"HCCL_INTRA_PCIE_ENABLE","description":"用于配置Server内是否使用PCIe链路进行通信。 该环境变量默认值为1，可以单独配置，也可以与环境变量HCCL_INTRA_ROCE_ENABLE同时使用。支持的配置组合，以及不同组合下Server内使用的通信链路如下表所示： | HCCL_INTRA_PCIE_ENABLE | HCCL_INTRA_ROCE_ENABLE | Server内通信链路 | |---|---|---| | 1 | 不配置 | PCIe | | 1 | 0 | PCIe | | 0 | 1 | RoCE | | 不配置 | 1 | RoCE | | 0 | 0 | PCIe | | 不配置 | 不配置 | PCIe | - 不支持HCCL_INTRA_PCIE_ENABLE和HCCL_INTRA_ROCE_ENABLE同时配置为1。 - 不支持HCCL_INTRA_PCIE_ENABLE配置为0，HCCL","example":"export HCCL_INTRA_PCIE_ENABLE=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0081.html"},{"name":"HCCL_INTRA_ROCE_ENABLE","description":"用于配置Server内或超节点内是否使用RoCE链路进行通信。 - 针对Atlas 训练系列产品与Atlas A2 训练系列产品/Atlas A2 推理系列产品，该环境变量用于配置Server内是否使用RoCE链路进行通信，默认值0，可以单独配置，也可以与环境变量HCCL_INTRA_PCIE_ENABLE同时使用。支持的配置组合，以及不同组合下Server内使用的通信链路如下表所示： | HCCL_INTRA_PCIE_ENABLE | HCCL_INTRA_ROCE_ENABLE | Server内通信链路 | |---|---|---| | 1 | 不配置 | PCIe | | 1 | 0 | PCIe | | 0 | 1 | RoCE | | 不配置 | 1 | RoCE | | 0 | 0 | PCIe | | 不配置 | 不配置 | PCIe | 不支持HCCL_INTRA_P","example":"export HCCL_INTRA_ROCE_ENABLE=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0082.html"},{"name":"HCCL_LOGIC_SUPERPOD_ID","description":"针对Atlas A3 训练系列产品/Atlas A3 推理系列产品的超节点模式组网，若不使用rank table文件配置集群资源信息，可通过此环境变量指定当前节点运行进程所属的超节点ID，实现将一个物理超节点划分为多个逻辑超节点的功能。 该环境变量取值为string类型，长度需要小于128个字符，默认值为空字符串。 若不配置此环境变量，会获取环境中“Super Pod ID”的值作为超节点ID，“Super Pod ID”的取值可通过“npu-smi info -t spod-info -i id -c chip_id”命令查看。","example":"export HCCL_LOGIC_SUPERPOD_ID=super_pod_id_1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0100.html"},{"name":"HCCL_OP_EXPANSION_MODE","description":"该环境变量用于配置通信算子的展开模式。 下面分别列出不同型号的产品支持的配置以及相关场景说明，未列出的产品不支持此环境变量设置，若设置了不支持的环境变量，会使用默认值。 - 针对Atlas 350 加速卡：默认采用自适应展开模式，会根据组网、数据量等情况自动选择合适的模式。若配置此环境变量，支持的配置如下： AI_CPU：代表通信算子在AI CPU展开，Device侧根据硬件型号自动选择相应的调度器。 该配置项支持Broadcast、Reduce、AllReduce、Scatter、ReduceScatter、AllGather、AlltoAll、AlltoAllV、AlltoAllVC、Send、Recv、BatchSendRecv算子。 注意： 图模式（Ascend IR）或者图捕获（aclgraph）场景，当通信算法采用AI CPU模式时，单卡上的并发图数量不能超过6个，否则可能会因","example":"export HCCL_OP_EXPANSION_MODE=\"HOST\"","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0096.html"}]}}},{"id":"hccl-reliability-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/hccl-reliability-env.yaml","title":"HCCL 可靠性相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 可靠性相关，2 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"hccl-reliability-env","type":"env-var-table","title":"HCCL 可靠性相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 可靠性相关，2 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas A3 训练系列产品 /","Atlas A3 推理系列产品 父主题： 可靠性相关"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"HCCL_OP_RETRY_ENABLE","description":"此环境变量用于配置是否开启HCCL算子的重执行特性。HCCL算子重执行以通信域为粒度，当通信算子执行报 SDMA 或者RDMA CQE类型的错误时，HCCL会尝试重新执行此通信算子。 在集群环境中，可能会存在硬件闪断的情况，此时通信算子会执行报错，通过此环境变量开启HCCL的重执行特性，可以更好地避免由于硬件闪断造成的通信中断，提升通信稳定性。HCCL算子重执行实际就是提供一个软件层面的尽力而为的故障恢复手段，执行示意图如下所示： 图1 重执行流程示意图 主要步骤有如下三步： - 故障发现：AI CPU检测到故障信号，通知Host开始准备进入重执行流程。 - 集群管理：Host通过Host Socket进行信息交互，并判断当前故障算子是否满足一系列重执行条件，详细可参见重执行使用须知。 - 重新下发：通知AI CPU Kernel重新下发SQE、WQE，进行HCCL算子重执行。","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0085.html"},{"name":"HCCL_OP_RETRY_PARAMS","description":"当开发者通过环境变量HCCL_OP_RETRY_ENABLE开启了HCCL的算子重执行特性时，可通过本环境变量配置第一次重执行的等待时间、最大重执行的次数以及两次重执行的间隔时间。 配置方法如下： export HCCL_OP_RETRY_PARAMS=\"MaxCnt:3,HoldTime:5000,IntervalTime:1000\" - MaxCnt：最大重传次数，uint32类型，取值范围为[1,10]，默认值为1，单位次。 - HoldTime：从检测到通信算子执行失败到开始第一次重新执行的等待时间，uint32类型，取值范围[0,60000]，默认值为5000，单位ms。 - IntervalTime：同一个通信算子两次重执行的间隔时间，uint32类型，取值范围[0,60000]，默认值为1000，单位ms。","example":"export HCCL_OP_RETRY_PARAMS=\"MaxCnt:5,HoldTime:5000,IntervalTime:5000\"","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0086.html"}]}}},{"id":"hccl-safety-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/hccl-safety-env.yaml","title":"HCCL 安全相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 安全相关，2 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"hccl-safety-env","type":"env-var-table","title":"HCCL 安全相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 安全相关，2 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 350 加速卡","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品（针对","Atlas A2 推理系列产品，仅支持","Atlas 800T A2 训练服务器、","Atlas 900 A2 PoD 集群基础单元、","Atlas 200T A2 Box16 异构子框。）","Atlas 训练系列产品","Atlas 推理系列产品（针对","Atlas 推理系列产品，仅支持","Atlas 300I Duo 推理卡。）"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"HCCL_WHITELIST_DISABLE","description":"配置在使用HCCL时是否开启通信白名单。 - 0：开启白名单，校验HCCL通信白名单，只有在通信白名单中的IP地址才允许进行集合通信。 - 1：关闭白名单，无需校验HCCL通信白名单。 缺省值为1，默认关闭白名单。如果开启了白名单校验，需要通过HCCL_WHITELIST_FILE指定白名单配置文件路径。","example":"export HCCL_WHITELIST_DISABLE=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0156.html"},{"name":"HCCL_WHITELIST_FILE","description":"当通过HCCL_WHITELIST_DISABLE开启了通信白名单校验功能时，需要通过此环境变量配置指向HCCL通信白名单配置文件的路径，只有在通信白名单中的IP地址才允许进行集合通信。 HCCL通信白名单配置文件格式为： ``` { \"host_ip\": [\"ip1\", \"ip2\"], \"device_ip\": [\"ip1\", \"ip2\"] } ``` 其中： - device_ip为预留字段，当前版本暂不支持。 - IP地址格式为点分十进制。 白名单IP需要指定为集群通信使用的有效IP。","example":"export HCCL_WHITELIST_FILE=/home/test/whitelist","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0157.html"}]}}},{"id":"hccl-performance-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/hccl-performance-env.yaml","title":"HCCL 性能相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 性能相关，4 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"hccl-performance-env","type":"env-var-table","title":"HCCL 性能相关环境变量","summary":"CANN 环境变量参考（envref 系列）：HCCL 性能相关，4 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas A2 训练系列产品","Atlas A2 推理系列产品（针对","Atlas A2 推理系列产品，仅支持","Atlas 800T A2 训练服务器、","Atlas 900 A2 PoD 集群基础单元、","Atlas 200T A2 Box16 异构子框。）","Atlas A3 训练系列产品","Atlas A3 推理系列产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"HCCL_MULTI_QP_THRESHOLD","description":"rank间RDMA通信使用多QP通信的场景下，开发者可通过本环境变量设置每个QP分担数据量的最小阈值。 该环境变量需要配置为整数，取值范围：[1,8192]，默认值：512，单位：KB。 - 如果“(rank间单次通信数据量 / HCCL_RDMA_QPS_PER_CONNECTION的值) 可通过环境变量HCCL_RDMA_QPS_PER_CONNECTION或HCCL_RDMA_QP_PORT_CONFIG_PATH开启多QP通信。","example":"export HCCL_MULTI_QP_THRESHOLD=512","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0095.html"},{"name":"HCCL_RDMA_PCIE_DIRECT_POST_NOSTRICT","description":"多机通信且Host操作系统小页内存页表大小非4KB的场景，当通信算子下发性能Host Bound时，开发者可设置此环境变量，通过PCIe Direct的方式提交RDMA任务，提升通信算子下发性能。 此环境变量支持如下取值： - TRUE：代表通过PCIe Direct（Host与Device之间的高速通信接口）的方式提交RDMA任务。 - FALSE（默认值）：代表通过HDC（Host Device Communication，主机设备通信）的方式提交RDMA任务。 此环境变量仅对Host侧小页内存页表大小非4KB的场景生效，若Host侧小页内存页表大小是4KB，无论此环境变量取值如何，都采用PCIe Direct的方式提交RDMA任务。 - 此环境变量设置为TRUE时，会额外消耗Device侧的大页内存（每个通信链路会额外多占用1MB的大页内存）。 - 如果开发者既想通过此环境变量提升通","example":"export HCCL_RDMA_PCIE_DIRECT_POST_NOSTRICT=TRUE","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0093.html"},{"name":"HCCL_RDMA_QPS_PER_CONNECTION","description":"两个rank之间RDMA通信时会默认创建1个QP（Queue Pair）进行数据传输，若开发者想让两个rank之间的RDMA通信使用多个QP，可通过此环境变量实现。 此环境变量代表两个rank间需要使用的QP个数，需要配置为整数，取值范围：[1,32]，建议配置范围：[1,8]，QP个数超过8时无法确保性能收益，还可能会造成由于内存占用过多导致业务运行失败的情况。默认值：1。 假设HCCL_RDMA_QPS_PER_CONNECTION环境变量配置为N1，则会在每两个rank之间创建N1个QP，两个rank之间通过RDMA传递的业务数据会平均分配到N1个QP上并行收发。 开启多QP传输的功能后，开发者可通过环境变量HCCL_MULTI_QP_THRESHOLD设置每个QP分担数据量的最小阈值；若开发者想指定每个QP使用的源端口号，可通过环境变量HCCL_RDMA_QP_PORT_CONFI","example":"export HCCL_RDMA_QPS_PER_CONNECTION=4","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0094.html"},{"name":"HCCL_RDMA_QP_PORT_CONFIG_PATH","description":"两个rank之间RDMA通信时会默认创建1个QP（Queue Pair）进行数据传输，若开发者想让两个rank之间的RDMA通信使用多个QP，并指定多QP通信时使用的源端口号，可通过此环境变量实现。 开发者可通过此环境变量指定与端口映射关系配置文件的存储路径。当配置多个端口号时，系统将开启多QP通信，且所配置的端口号即为每个QP使用的源端口。 该环境变量配置示例如下： ``` export HCCL_RDMA_QP_PORT_CONFIG_PATH=/home/tmp ``` 其中“/home/tmp”为与端口映射关系配置文件“MultiQpSrcPort.cfg”的存储路径，支持配置为绝对路径或相对路径，该路径最大长度需要小于等于4096个字符。 “MultiQpSrcPort.cfg”文件需要用户自定义（注意文件命名需要保持为“MultiQpSrcPort.cfg”），配置格式如下：","example":"export HCCL_RDMA_QP_PORT_CONFIG_PATH=/home/tmp","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0141.html"}]}}},{"id":"hccl-network-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/hccl-network-env.yaml","title":"HCCL 网络相关环境变量","summary":"HCCL 建链网络：网卡选择、RDMA 配置、端口范围（10 个变量）","doc":{"id":"hccl-network-env","type":"env-var-table","title":"HCCL 网络相关环境变量","summary":"HCCL 建链网络：网卡选择、RDMA 配置、端口范围（10 个变量）","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A2-910B","A3-910C","A5-950"],"categories":["interrupt","precision","performance"]},"status":"active","last_verified":"2026-08-28","content":{"variables":[{"name":"HCCL_HOST_SOCKET_PORT_RANGE","description":"当通信域的创建方式为“基于root节点信息创建”时，开发者可通过此环境变量配置HCCL在Host侧使用的通信端口。 该环境变量支持配置为具体的端口、端口范围或者字符串“auto”。 - 若指定具体的端口号或端口范围，规划的端口数量建议不小于单个NPU上的HCCL进程数，端口号取值范围为[1,65535]，且需要确保指定的端口未被其他进程占用。需要注意，[1,1023]为系统保留端口，应避免使用这些端口。 具体的端口号与端口范围可以组合使用，中间使用英文“,”分隔，但逗号之间的端口号/端口范围不能存在范围重叠，配置方式可参见配置示例。 - 若指定为字符串“auto”，代表HCCL使用的Host通信端口由操作系统动态分配。","example":"| 1 2 3 4 5 6 7 8 | # 方式一：配置为端口范围。 HCCL_HOST_SOCKET_PORT_RANGE='60000-60050' # 方式二：具体的端口号与端口范围配合使用，使用英文“,”分隔。 HCCL_HOST_SOCKET_PORT_RANGE='60000,60050-60100,60150-60160' # 方式三：指定具体的端口号，使用英文“,”分隔。 HCCL_HOST_SOCKET_PORT_RANGE='56000,56005,56007,56008,56100,56105,56107,56108' # 方式四：操作系统动态分配端口号 HCCL_HOST_SOCKET_PORT_RANGE='auto' | |---|---|"},{"name":"HCCL_IF_BASE_PORT","description":"当通信域的创建方式为“基于root节点信息创建”时，可以通过该环境变量指定Host网卡起始端口号，配置后系统默认占用以该端口起始的32个端口进行集群信息收集。 该环境变量需要配置为整数，取值范围为[1024,65520]，请确保分配的端口未被占用。","example":"HCCL_IF_BASE_PORT=50000"},{"name":"HCCL_IF_IP","description":"当通信域的创建方式为“基于root节点信息创建”时，可通过此环境变量配置HCCL初始化时Host使用的通信IP地址。此IP地址用于与root节点通信，以完成通信域的创建。 格式为字符串，要求为常规IPv4或IPv6格式，目前只支持Host网卡，且只能配置一个IP地址。 HCCL按照如下优先级顺序选择Host通信网卡： 环境变量HCCL_IF_IP > 环境变量HCCL_SOCKET_IFNAME > docker/lo以外网卡（网卡名字典序升序） > docker网卡 > lo网卡。 如果不配置HCCL_IF_IP或HCCL_SOCKET_IFNAME，系统将按照优先级自动选择网卡。若当前节点选择的网卡与root节点选择的网卡链路不通，将导致HCCL建链失败。","example":"HCCL_IF_IP=10.10.10.1"},{"name":"HCCL_NPU_SOCKET_PORT_RANGE","description":"当通信域的创建方式为“基于root节点信息创建”时，开发者可通过此环境变量配置HCCL在NPU侧使用的通信端口。 该环境变量支持配置为具体的端口、端口范围或者字符串“auto”。 - 若指定具体的端口号或端口范围，规划的端口数量建议不小于单个NPU上的HCCL进程数，端口号取值范围为[1,65535]，且需要确保指定的端口未被其他进程占用。需要注意，[1,1023]为系统保留端口，应避免使用这些端口。 具体端口号与端口范围可以组合使用，中间使用英文“,”分隔，但逗号之间的端口号/端口范围不能存在范围交叉，配置方式可参见配置示例。 - 若指定为字符串“auto”，代表HCCL使用的NPU端口号由操作系统动态分配。 - 若不配置该环境变量，HCCL在NPU侧使用的通信端口默认为16666。","example":"| 1 2 3 4 5 6 7 8 | //方式一：配置为端口范围。 HCCL_NPU_SOCKET_PORT_RANGE='61000-61050' //方式二：具体的端口号与端口范围配合使用，使用英文“,”分隔。 HCCL_NPU_SOCKET_PORT_RANGE='61000,61050-61100,61200-61210' //方式三：指定具体的端口号，使用英文“,”分隔。 HCCL_NPU_SOCKET_PORT_RANGE='57000,57005,57007,58008,58100,58105,58107,58108' //方式四：操作系统动态分配端口号 HCCL_NPU_SOCKET_PORT_RANGE='auto' | |---|---|"},{"name":"HCCL_RDMA_RETRY_CNT","description":"用于配置RDMA网卡的重传次数，需要配置为整数，取值范围为[1,7]，默认值为7。","example":"#重传次数配置为5 HCCL_RDMA_RETRY_CNT=5"},{"name":"HCCL_RDMA_SL","description":"用于配置RDMA网卡的service level，该值需要和网卡配置的PFC优先级保持一致，若配置不一致可能导致性能劣化。 该环境变量需要配置为整数，取值范围：[0,7]，默认值：4。","example":"# 优先级配置为3 HCCL_RDMA_SL=3"},{"name":"HCCL_RDMA_TC","description":"用于配置RDMA网卡的traffic class。 该环境变量的取值范围为[0,255]，且需要配置为4的整数倍，默认值为132。 在RoCE V2协议中，该值对应IP报文头中ToS（Type of Service）域。共8个bit，其中，bit[0,1]固定为0，bit[2,7]为DSCP，因此，该值除以4即为DSCP的值。","example":"# 该环境变量配置为25*4 = 100，则DSCP为25 HCCL_RDMA_TC=100"},{"name":"HCCL_RDMA_TIMEOUT","description":"用于配置RDMA网卡重传超时时间的系数timeout。 RDMA网卡重传超时时间最小值的计算公式为：4.096μs * 2^timeout，其中timeout为该环境变量配置值，且实际重传超时时间与用户网络状况有关。 - 针对Atlas 350 加速卡，该环境变量配置为整数，取值范围为[5,24]，默认值为20。 - 针对Atlas A3 训练系列产品/Atlas A3 推理系列产品，该环境变量配置为整数，取值范围为[5,20]，默认值为20。 - 针对Atlas A2 训练系列产品/Atlas A2 推理系列产品，该环境变量配置为整数，取值范围为[5,20]，默认值为20。 - 针对Atlas 训练系列产品，该环境变量配置为整数，取值范围为[5,24]，默认值为20。 - 针对Atlas 推理系列产品，该环境变量配置为整数，取值范围是[5,24]，默认值为20。","example":"# RDMA网卡重传超时时间的系数配置为6，则网卡启用RDMA功能时，重传超时时间最小值为：4.096μs * 2^6 HCCL_RDMA_TIMEOUT=6"},{"name":"HCCL_SOCKET_FAMILY","description":"该环境变量指定通信网卡使用的IP协议，支持如下两种配置： - AF_INET：代表使用IPv4协议。 - AF_INET6：代表使用IPv6协议 缺省使用IPv4协议。 该环境变量有以下两种使用场景： - 配置HCCL初始化时，Host侧通信网卡使用的IP协议版本。此场景下，该环境变量需要与HCCL_SOCKET_IFNAME同时使用，当HCCL通过指定网卡名获取Host IP时，通过该环境变量指定使用网卡的socket通信IP协议。 - 配置HCCL初始化时，Device侧通信网卡使用的IP协议版本。此场景下，如果该环境变量指定的IP协议与实际获取到的网卡信息不匹配，则以实际环境上的网卡信息为准。 例如，该环境变量指定为IPv6协议，但Device侧只存在IPv4协议的网卡，则实际会使用IPv4协议的网卡。","example":"HCCL_SOCKET_FAMILY=AF_INET #IPv4 HCCL_SOCKET_FAMILY=AF_INET6 #IPv6"},{"name":"HCCL_SOCKET_IFNAME","description":"配置HCCL初始化时Host使用的通信网卡名，HCCL将通过该网卡名获取Host IP，与root节点通信，以完成通信域的创建。 开发者可以选取以下规则中的一种进行配置： - eth：使用所有以eth为前缀的网卡。若指定多个网卡前缀，多个网卡前缀间用英文逗号分隔。 例如：export HCCL_SOCKET_IFNAME=eth,enp，表示使用所有以eth或enp为前缀的网卡。 - ^eth：不使用以eth为前缀的网卡。若指定多个网卡前缀，多个网卡前缀间用英文逗号分隔。 例如：export HCCL_SOCKET_IFNAME=^eth,enp，表示不使用任何以eth或enp为前缀的网卡。 - =eth0：使用指定的eth0网卡。若指定多个网卡，多个网卡间用英文逗号分隔。 例如：export HCCL_SOCKET_IFNAME==eth0,enp0，表示使用eth0网卡或enp0网卡。","example":"# 使用eth0或endvnic的网卡 HCCL_SOCKET_IFNAME==eth0,endvnic"}]}}},{"id":"hccl-debug-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/hccl-debug-env.yaml","title":"HCCL 调试相关环境变量","summary":"HCCL 集合通信调试：诊断日志、故障检测开关、实时调用日志（4 个变量）","doc":{"id":"hccl-debug-env","type":"env-var-table","title":"HCCL 调试相关环境变量","summary":"HCCL 集合通信调试：诊断日志、故障检测开关、实时调用日志（4 个变量）","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-28","verification":"cross-checked-source"}],"applies_to":{"platforms":["A2-910B","A3-910C","A5-950"],"categories":["interrupt","precision","performance"]},"status":"active","last_verified":"2026-08-28","content":{"variables":[{"name":"HCCL_DEBUG_CONFIG","description":"启用此环境变量后，运行日志（即“$HOME/ascend/log/run”目录下的日志）将包含HCCL特定子模块的详细运行信息。目前支持ALG或alg（算法编排模块）、TASK或task（任务编排模块）、RESOURCE或resource（资源管理模块，包括资源的申请和释放操作）几个配置项。 该环境变量支持如下两种形式的配置： - 正向配置：支持配置1个或多个模块，各模块间使用英文逗号分隔，其中TASK（或task）、ALG（或alg）、RESOURCE（或resource）不区分大小写。 ``` # 运行日志中记录task模块的运行信息。 export HCCL_DEBUG_CONFIG='TASK' # 运行日志中记录alg、task、resource模块的运行信息。 export HCCL_DEBUG_CONFIG='alg,task,resource' ``` - 反向配置：在第一","example":"HCCL_DEBUG_CONFIG='ALG,TASK,RESOURCE'"},{"name":"HCCL_DFS_CONFIG","description":"HCCL提供了多种故障检测功能的开关设置，包括建链故障探测时间配置、集群心跳监测开关以及进程卡死检测开关等。这些检测功能开启后，能够在业务出现异常时快速定位并显示故障信息，有助于问题及时排查处理。 该环境变量支持以下配置项： - connection_fault_detection_time：建链故障探测时间。HCCL会在建链超时时启动建链失败根节点定位能力，并将失败根节点信息传播。整个过程耗时为：“connection_fault_detection_time”参数取值 + 10s的根节点信息传播时间。 “connection_fault_detection_time”参数支持的取值：0，[20, 7200]。单位s，默认为20。 该参数配置为“0”时，代表关闭建链故障探测功能，即建链失败时无额外等待时间，建链进程立即退出。 - cluster_heartbeat：集群心跳监测开关，用于","example":"HCCL_DFS_CONFIG='connection_fault_detection_time:30,cluster_heartbeat:on,stuck_detection:on,inconsistent_check:off,task_monitor_interval:0'"},{"name":"HCCL_DIAGNOSE_ENABLE","description":"此环境变量用于配置集合通信是否缓存部分任务的详细信息，以便任务执行失败时，打印详细日志，用于问题定位。 支持如下取值： - 1：代表开启集合通信缓存。 - 0：代表不开启集合通信缓存。 默认值为“0”。 需要注意，此环境变量开启后会对性能产生影响。","example":"HCCL_DIAGNOSE_ENABLE=1"},{"name":"HCCL_ENTRY_LOG_ENABLE","description":"此环境变量用于控制是否实时打印通信算子的调用行为日志。 - 1：代表实时打印通信算子的调用行为日志，即调用一次通信算子，打印一条运行日志。 - 0：代表不打印通信算子的调用行为日志。 默认值为“0”。 HCCL的默认运行日志存储路径为：$HOME/ascend/log/run/plog/plog-pid_*.log，关于日志的详细说明可参见《日志参考》。","example":"HCCL_ENTRY_LOG_ENABLE=1"}]}}},{"id":"tf-adapter-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/tf-adapter-env.yaml","title":"TF Adapter（TF 模型迁移适配）环境变量","summary":"CANN 环境变量参考（envref 系列）：TF Adapter（TF 模型迁移适配），19 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"tf-adapter-env","type":"env-var-table","title":"TF Adapter（TF 模型迁移适配）环境变量","summary":"CANN 环境变量参考（envref 系列）：TF Adapter（TF 模型迁移适配），19 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas 350 加速卡","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 300I Duo 推理卡"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"CM_CHIEF_DEVICE","description":"TensorFlow分布式训练或推理场景下，用户可以选择不使用rank table文件，通过组合使用环境变量CM_CHIEF_IP、CM_CHIEF_PORT、CM_CHIEF_DEVICE、CM_WORKER_SIZE、CM_WORKER_IP的方式自动生成资源信息，完成集合通信组件初始化。 本环境变量“CM_CHIEF_DEVICE”用于指定Master节点中统计Server端集群信息的Device逻辑ID。 该环境变量需要配置为整数，取值范围：[0, Server内的最大Device数量-1]。","example":"export CM_CHIEF_DEVICE=0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0052.html"},{"name":"CM_CHIEF_IP","description":"TensorFlow分布式训练或推理场景下，用户可以选择不使用rank table文件，通过组合使用环境变量CM_CHIEF_IP、CM_CHIEF_PORT、CM_CHIEF_DEVICE、CM_WORKER_SIZE、CM_WORKER_IP的方式自动生成资源信息，完成集合通信组件初始化。 本环境变量“CM_CHIEF_IP”用于配置Master节点的监听Host IP。 格式为字符串，要求为常规IPv4或IPv6格式。","example":"export CM_CHIEF_IP=192.168.1.1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0050.html"},{"name":"CM_CHIEF_PORT","description":"TensorFlow分布式训练或推理场景下，用户可以选择不使用rank table文件，通过组合使用环境变量CM_CHIEF_IP、CM_CHIEF_PORT、CM_CHIEF_DEVICE、CM_WORKER_SIZE、CM_WORKER_IP的方式自动生成资源信息，完成集合通信组件初始化。 本环境变量“CM_CHIEF_PORT”用于配置Master节点的监听端口。 该环境变量需要配置为整数，取值范围“0~65520”，请确保端口未被其他进程占用。","example":"export CM_CHIEF_PORT=6000","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0051.html"},{"name":"CM_WORKER_IP","description":"TensorFlow分布式训练或推理场景下，用户可以选择不使用rank table文件，通过组合使用环境变量CM_CHIEF_IP、CM_CHIEF_PORT、CM_CHIEF_DEVICE、CM_WORKER_SIZE、CM_WORKER_IP的方式自动生成资源信息，完成集合通信组件初始化。 本环境变量“CM_WORKER_IP”，用于配置当前Device和Master节点进行信息交换时所用的网卡IP。 格式为字符串，要求为常规IPv4或IPv6格式。","example":"export CM_WORKER_IP=192.168.0.1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0054.html"},{"name":"CM_WORKER_SIZE","description":"TensorFlow分布式训练或推理场景下，用户可以选择不使用rank table文件，通过组合使用环境变量CM_CHIEF_IP、CM_CHIEF_PORT、CM_CHIEF_DEVICE、CM_WORKER_SIZE、CM_WORKER_IP的方式自动生成资源信息，完成集合通信组件初始化。 本环境变量“CM_WORKER_SIZE”用于配置本次业务通信域内Device的总数量。 该环境变量需要配置为整数，取值范围“0~32768”。","example":"export CM_WORKER_SIZE=8","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0053.html"},{"name":"ENABLE_FORCE_V2_CONTROL","description":"TensorFlow 1.15训练场景下，如果输入是动态shape，由于tf.case/tf.cond/tf.while_loop这些API对应TensorFlow V1版本的控制流算子（例如Switch、Merge、Enter、LoopCond、NextIteration、Exit、ControlTrigger等）不支持动态shape，仅TensorFlow V2版本的控制流算子（例如If、Case、While、For、PartitionedCall等）支持动态shape，因此，如果用户的训练脚本中使用了这些API，需要将V1版本的控制流算子转换为V2版本，用于支持动态shape功能。另外，如果网络中的分支结构较多，采用V1版本的控制流算子可能导致流数超限，此时也需要将V1版本的控制流算子转换成V2版本算子解决。 此环境变量设置为“1”时，代表开启V1版本的控制流算子转换成V2版本算子的","example":"export ENABLE_FORCE_V2_CONTROL=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0037.html"},{"name":"ENABLE_HF32_EXECUTION","description":"针对TensorFlow 1.15网络，是否启用HF32自动代替FP32数据类型的功能，当前版本此环境变量仅针对Conv类算子与Matmul类算子生效。 - \"1\"：启用FP32数据类型自动转换为HF32数据类型的功能。 - \"0\"：关闭FP32数据类型自动转换为HF32数据类型的功能。 - 若不配置此环境变量，针对Conv类算子，默认使能FP32转换为HF32，针对Matmul类算子，默认不使能FP32转换为HF32。 HF32是昇腾推出的专门用于算子内部计算的单精度浮点类型，与其他常用数据类型的比较如下图所示。可见，HF32与FP32支持相同的数值范围，但尾数位精度（11位）却接近FP16（10位）。通过降低精度让HF32单精度数据类型代替原有的FP32单精度数据类型，可大大降低数据所占空间大小，实现性能的提升。图1 HF32与其他数据类型比较","example":"export ENABLE_HF32_EXECUTION=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0038.html"},{"name":"JOB_ID","description":"TensorFlow训练与在线推理场景下，可通过此环境变量自定义任务ID。 建议配置的字符串中仅包含大小写字母、数字、中划线或下划线，不建议使用以0开头的纯数字作为JOB_ID。","example":"export JOB_ID=10087","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0036.html"},{"name":"LOSS_NOW","description":"TensorFlow 1.15训练场景下，若通过“experimental_accelerate_train_mode”参数或者“accelerate_train_mode”参数触发了训练加速功能，可通过此环境变量设置NPU上当前迭代的loss值。 - 若训练脚本中使用session配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“session配置 > session配置参数说明 > 试验参数”中的“experimental_accelerate_train_mode”参数的介绍。 - 若训练脚本中使用NPURunConfig配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“npu_bridge.estimator.npu.npu_config > ExperimentalConfig构造函数”中的“accele","example":"export LOSS_NOW=7.0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0045.html"},{"name":"NPU_DEBUG","description":"TensorFlow 2.6.5训练与在线推理场景下，用于开启TF Adapter的Debug级别执行日志。 - \"1\"或\"true\"：开启Debug级别执行日志 - \"0\"或\"false\"：关闭Debug级别执行日志","example":"export NPU_DEBUG=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0039.html"},{"name":"NPU_DUMP_GRAPH","description":"TensorFlow 2.6.5训练与在线推理场景下，用于开启TF Adapter图Dump功能。 - \"1\"或\"true\"：开启图Dump功能 - \"0\"或\"false\"：关闭图Dump功能","example":"export NPU_DUMP_GRAPH=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0040.html"},{"name":"NPU_ENABLE_PERF","description":"TensorFlow 2.6.5训练与在线推理场景下，用于开启TF Adapter图耗时打印功能。 - \"1\"或\"true\"：开启图耗时打印功能 - \"0\"或\"false\"：关闭图耗时打印功能 开启TF Adapter图耗时打印功能后，开发者可搜索日志中的“Graph engine run”与“cost”关键字查询相关耗时，例如： ``` Graph engine run 1 times for graph 0 cost 11257 ms ```","example":"export NPU_ENABLE_PERF=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0041.html"},{"name":"NPU_LOOP_SIZE","description":"TensorFlow 2.6.5训练与在线推理场景下，用于设置NPU上循环下沉的次数。","example":"export NPU_LOOP_SIZE=32","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0042.html"},{"name":"RANK_ID","description":"TensorFlow分布式训练或推理场景下，通过此环境变量指定当前进程在集合通信进程组中对应的rank标识。","example":"export RANK_ID=0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0048.html"},{"name":"RANK_SIZE","description":"TensorFlow分布式训练或推理场景下，通过此环境变量指定当前训练进程对应的Device数量。","example":"export RANK_SIZE=2","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0049.html"},{"name":"RANK_TABLE_FILE","description":"TensorFlow分布式训练或推理场景下，通过此环境变量指定参与集合通信的AI处理器的rank table资源配置文件，包含rank table文件路径和文件名。 关于rank table配置文件的说明可参见《HCCL集合通信库》中的“相关参考 > 集群信息配置”章节。","example":"export RANK_TABLE_FILE=/home/test/ranktable.json","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0047.html"},{"name":"STEP_NOW","description":"TensorFlow 1.15训练场景下，若通过“experimental_accelerate_train_mode”参数或者“accelerate_train_mode”参数触发了训练加速功能，可通过此环境变量设置NPU上当前的执行步数。 - 若训练脚本中使用session配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“session配置 > session配置参数说明 > 试验参数”中的“experimental_accelerate_train_mode”参数的介绍。 - 若训练脚本中使用NPURunConfig配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“npu_bridge.estimator.npu.npu_config > ExperimentalConfig构造函数”中的“accelerat","example":"export STEP_NOW=100","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0043.html"},{"name":"TARGET_LOSS","description":"TensorFlow 1.15训练场景下，若通过“experimental_accelerate_train_mode”参数或者“accelerate_train_mode”参数触发了训练加速功能，可通过此环境变量设置NPU上的目标训练loss值。 - 若训练脚本中使用session配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“session配置 > session配置参数说明 > 试验参数”中的“experimental_accelerate_train_mode”参数的介绍。 - 若训练脚本中使用NPURunConfig配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“npu_bridge.estimator.npu.npu_config > ExperimentalConfig构造函数”中的“accele","example":"export TARGET_LOSS=3.0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0046.html"},{"name":"TOTAL_STEP","description":"TensorFlow 1.15训练场景下，若通过“experimental_accelerate_train_mode”参数或者“accelerate_train_mode”参数触发了训练加速功能，可通过此环境变量设置NPU上总训练步数。 - 若训练脚本中使用session配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“session配置 > session配置参数说明 > 试验参数”中的“experimental_accelerate_train_mode”参数的介绍。 - 若训练脚本中使用NPURunConfig配置，关于该环境变量使用场景的详细介绍可参见《TF Adapter接口 (1.x)》中“npu_bridge.estimator.npu.npu_config > ExperimentalConfig构造函数”中的“accelerate_","example":"export TOTAL_STEP=10000","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0044.html"}]}}},{"id":"deprecated-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/deprecated-env.yaml","title":"后续版本废弃环境变量","summary":"CANN 环境变量参考（envref 系列）：后续版本废弃，2 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"deprecated-env","type":"env-var-table","title":"后续版本废弃环境变量","summary":"CANN 环境变量参考（envref 系列）：后续版本废弃，2 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ENABLE_ACLNN","description":"该环境变量在后续版本会废弃。 图编译时，通过设置该环境变量，可以决定在图执行时是否调用算子注册的host执行函数来实现host执行逻辑及kernel下发。取值如下： - true：图执行时调用算子注册的host执行函数实现host执行逻辑以及kernel下发。 - false：图执行时仍旧使用GE执行器做算子的kernel下发。 算子支持情况如下： - 若算子仅支持host侧单算子执行调用接口（信息库中aclnnSupport取值配置为aclnn_only），配置该环境变量不生效，始终调用host执行函数实现host执行逻辑以及kernel下发。 - 若算子不支持host侧单算子执行调用接口（信息库中未配置aclnnSupport字段），则保持原有使用GE执行器做算子的kernel下发。 - 若算子两种方式都支持，则只有环境变量取值为true+信息库标记aclnnSupport（信息库中a","example":"export ENABLE_ACLNN=true","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0139.html"},{"name":"GE_USE_STATIC_MEMORY","description":"网络运行时使用的内存分配方式，支持以下取值： - 0（默认值）：动态分配内存，即按照实际大小动态分配。 - 2：静态shape支持内存动态扩展。网络运行时，可以通过此取值实现同一session中多张图之间的内存复用，即以最大图所需内存进行分配。例如，假设当前执行图所需内存超过前一张图的内存时，直接释放前一张图的内存，按照当前图所需内存重新分配。 - 3：动态shape支持内存动态扩展，解决内存动态分配时的碎片问题，降低动态shape网络内存占用。 - 4：静态shape和动态shape同时支持内存动态扩展。 默认值是0。 - 该环境变量在后续版本会废弃。 - 多张图并发执行时，不支持配置为“2”和“4”。 - 为兼容历史版本配置，配置为“1”的场景下，系统会按照“2”的方式进行处理。 - 配置为“3”和“4”的场景下，将带来内存收益，但可能导致性能损失。 - 针对TensorFlow训练场","example":"export GE_USE_STATIC_MEMORY=2","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0138.html"}]}}},{"id":"graph-exec-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/graph-exec-env.yaml","title":"图执行环境变量","summary":"CANN 环境变量参考（envref 系列）：图执行，2 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"graph-exec-env","type":"env-var-table","title":"图执行环境变量","summary":"CANN 环境变量参考（envref 系列）：图执行，2 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 350 加速卡","Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 200I/500 A2 推理产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ENABLE_DYNAMIC_SHAPE_MULTI_STREAM","description":"计算图执行时，开启多流并发执行功能在一定场景下可提升网络性能。当前多流并发执行功能默认关闭，动态shape图模式场景下，若开发者想开启多流并发执行功能，可通过此环境变量开启。 - 0：关闭多流并发执行功能，默认值。 - 1：开启多流并发执行功能。","example":"多流并发执行功能默认关闭，如果需要开启，请设置此环境变量的值为“1”。  export ENABLE_DYNAMIC_SHAPE_MULTI_STREAM=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0033.html"},{"name":"MAX_RUNTIME_CORE_NUMBER","description":"训练与在线推理场景下，针对动态shape图模式执行的网络，可通过设置此环境变量开启图执行器（Host侧）的多线程任务调度。 该环境变量需要配置为整数，当取值大于等于2时，表示Host侧图执行调度任务开启多线程，多线程数量与此环境变量取值相同。 若使用该环境变量，建议配置为3，以获得较优性能。","example":"export MAX_RUNTIME_CORE_NUMBER=3","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0034.html"}]}}},{"id":"graph-compile-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/graph-compile-env.yaml","title":"图编译环境变量","summary":"CANN 环境变量参考（envref 系列）：图编译，9 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"graph-compile-env","type":"env-var-table","title":"图编译环境变量","summary":"CANN 环境变量参考（envref 系列）：图编译，9 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 350 加速卡","Atlas 200I/500 A2 推理产品","Atlas A2 训练系列产品 /","Atlas A3 训练系列产品 /","Atlas 200I/500 A2 推理产品 父主题： 图编译"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ASCEND_ENGINE_PATH","description":"单算子JSON文件转换成离线模型场景，如果希望模型转换时只使用TBE算子（不查找AI CPU算子，找不到TBE算子则报错），则需要使用该环境变量。 设置该环境变量后，如果用户想要执行其他操作，需要删除上述环境变量：执行unset ASCEND_ENGINE_PATH命令，使其失效。","example":"export ASCEND_ENGINE_PATH=${INSTALL_DIR}/lib64/plugin/opskernel/libfe.so:${INSTALL_DIR}/lib64/plugin/opskernel/libge_local_engine.so:${INSTALL_DIR}/lib64/plugin/opskernel/librts_engine.so  其中${INSTALL_DIR}请替换为CANN软件安装后文件存储路径。以root用户安装为例，安装后文件默认存储路径为：/usr/local/Ascend/cann。","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0015.html"},{"name":"DUMP_GE_GRAPH","description":"把整个流程中各个阶段的图描述信息打印到文件中，此环境变量控制dump图的内容多少。 支持的取值包括： - 1：包含连边关系和数据信息的完整版dump。 - 2：不含有权重等数据的基本版dump。 - 3：只显示节点关系的精简版dump。 设置该环境变量后，在当前路径会生成如下文件： - ge_onnx*.pbtxt：基于ONNX的模型描述结构，可以使用Netron等可视化软件打开。 - ge_proto*.txt：protobuf格式存储的文本文件，该文件可以转成JSON格式文件方便用户定位问题。该文件与ge_onnx*.pbtxt一般成对出现，但是ge_proto*.txt比ge_onnx*.pbtxt文件会多string类型的属性信息，因此ge_proto*.txt显示得更完整，用户选择其中一种文件打开。由于ge_proto*.txt文件结构相比ge_onnx*.pbtxt已经做了文件","example":"export DUMP_GE_GRAPH=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0011.html"},{"name":"DUMP_GRAPH_FORMAT","description":"控制需要生成的dump文件类型。 支持的取值包括： - onnx：基于ONNX的模型描述结构，可以使用Netron等可视化软件打开，生成文件名为ge_onnx*.pbtxt。 - ge_proto：protobuf格式存储的文本文件，生成文件名为ge_proto*.txt。 - readable：类似Dynamo fx图风格的高可读性文本文件，生成文件名为ge_readable*.txt。文件内容解析请参见readable文件解析。 使用方式： 配置按照“|”分隔的字符串，类型全部为小写，支持组合配置，例如“ge_proto|onnx|readable”，表示dump全量类型的文件；也支持单独配置，例如“ge_proto”，表示只dump ge_proto类型的文件ge_proto*.txt。 DUMP_GRAPH_FORMAT环境变量只有在DUMP_GE_GRAPH开启时才生效，默认为“","example":"export DUMP_GRAPH_FORMAT=\"ge_proto|onnx\"","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0155.html"},{"name":"DUMP_GRAPH_LEVEL","description":"把整个图编译流程中各个阶段的图描述信息打印到文件中。 此环境变量支持如下两种配置方式，两种方式均是控制图落盘的个数，用户可以按需使用，注意两种配置方式不支持混合使用： - 配置数值，取值如下： 1：dump所有阶段的图。 - 2：dump白名单阶段的图。具体白名单图请参见表1中的“是否白名单”列。 - 3：dump最后的生成图，即经过GE（Graph Engine，图引擎）优化、编译后的图。 - 4：dump最早的生成图，即经过GE解析映射算子后，给到软件栈的编译入口图，此时图结构尚未经过GE的编译优化。 - 配置按照“|”分隔的字符串，配置如下： 例如配置为\"aa|bb\"，则表示dump出名称包含aa和bb的图，aa和bb需要指定为图编译流程中的合法字符串，合法字符串的获取可以从全量的dump图得到。 DUMP_GRAPH_LEVEL环境变量只有在DUMP_GE_GRAPH开启时才生效，","example":"- 配置为数值：  export DUMP_GRAPH_LEVEL=1  - 配置为按照|分隔的字符串：  export DUMP_GRAPH_LEVEL=\"PreRunBegin|AfterInfershape\"","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0012.html"},{"name":"DUMP_GRAPH_PATH","description":"指定DUMP图文件的保存路径，可配置为绝对路径或脚本执行目录的相对路径。 指定的路径支持大小写字母（a-z，A-Z）、数字（0-9）、下划线（_）、中划线（-）、句点（.）、中文字符，执行用户需具有读、写、执行权限。 - 如果指定的路径不存在，则会自动创建相应目录。 - 如果指定的路径执行用户权限不足，则会在当前执行目录下生成DUMP图文件。 - 设置“DUMP_GRAPH_PATH”环境变量的场景下，程序会在指定路径下创建“pid_${pid}_deviceid_${deviceid}”子文件夹，存储DUMP图文件。其中${pid}为进程ID，${deviceid}为设备ID。 - 若不设置“DUMP_GRAPH_PATH”环境变量，DUMP图文件直接存储在当前脚本执行路径，不会创建“pid_${pid}_deviceid_${deviceid}”子文件夹。 DUMP图文件存储路径优先级","example":"export DUMP_GRAPH_PATH=/home/dumpgraph  则DUMP图文件存储在/home/dumpgraph/pid_${pid}_deviceid_${deviceid}路径下，例如/home/dumpgraph/pid_53343_deviceid_0。","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0013.html"},{"name":"ENABLE_NETWORK_ANALYSIS_DEBUG","description":"TensorFlow训练场景下，计算图编译失败时默认会终止训练流程，不会继续向Device下发剩余的图。若开发者希望图编译失败时，不终止训练流程，允许TF Adapter持续向Device下发计算图，可通过设置该环境变量实现。 当前版本该环境变量取值无限制，只要环境中存在该环境变量，图编译失败时就不会终止训练流程。","example":"export ENABLE_NETWORK_ANALYSIS_DEBUG=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0018.html"},{"name":"MAX_COMPILE_CORE_NUMBER","description":"此环境变量用于指定图编译时可用的CPU核数。 该环境变量需要配置为整数，表示图编译时开启多线程，多线程数量与配置的CPU核数相同。 取值范围：1~CPU核数，默认为1，不开启多线程；取值小于等于0时，按照默认值1处理。 建议此环境变量取值不超过当前环境的CPU核数，否则会造成性能劣化。","example":"export MAX_COMPILE_CORE_NUMBER=5","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0016.html"},{"name":"MULTI_THREAD_COMPILE","description":"此环境变量用于控制模型转换时是否使用单线程编译。 - 0：开启单线程编译 - 1：（默认值）开启多线程编译","example":"export MULTI_THREAD_COMPILE=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0017.html"},{"name":"OP_NO_REUSE_MEM","description":"计算图在昇腾平台编译的过程中默认采用内存复用形式，在问题定位场景中，如果开发者怀疑是内存复用错误导致计算结果异常，可通过此环境变量指定为某算子单独分配内存。 该环境变量可配置为网络节点的名称或者算子的类型（可混合配置），支持一个或多个的配置，配置多个节点时，中间通过英文逗号隔开。","example":"- 基于节点名称配置节点名称需要配置为转换为CANN平台网络后的节点名称，节点名称可以通过设置DUMP_GE_GRAPH环境变量，然后在导出的ge_onnx_xxx_Build.pbtxt最终图中查看“name”字段获取。  export OP_NO_REUSE_MEM=gradients/logits/semantic/kernel/Regularizer/l2_regularizer_grad/Mul_1,resnet_v1_50/conv1_1/BatchNorm/AssignMovingAvg2  - 基于算子类型配置  export OP_NO_REUSE_MEM=FusedMulAddN,BatchNorm  - 混合配置  export OP_NO_REUSE_MEM=FusedMulAddN,resnet_v1_50/conv1_1/Batch","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0014.html"}]}}},{"id":"install-config-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/install-config-env.yaml","title":"安装配置环境变量","summary":"CANN 环境变量参考（envref 系列）：安装配置，4 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"install-config-env","type":"env-var-table","title":"安装配置环境变量","summary":"CANN 环境变量参考（envref 系列）：安装配置，4 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品 /","Atlas A2 推理系列产品","Atlas A3 训练系列产品 /","Atlas A3 推理系列产品","Atlas 350 加速卡","Atlas 200I/500 A2 推理产品 父主题： 安装配置相关","Atlas A2 训练系列产品","Atlas A3 训练系列产品","Atlas 200I/500 A2 推理产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ASCEND_CACHE_PATH","description":"若开发者期望编译运行过程中产生的文件落盘到统一路径，可通过此环境变量设置共享文件的存储路径，各组件编译运行过程中产生的可共享文件会存储到此环境变量定义的路径中。 - 路径支持大小写字母（a-z，A-Z）、数字（0-9）、下划线（_）、中划线（-）、句点（.）、中文字符。 - 需要确保指定的路径存在且有效，执行用户具有读、写、执行权限。 ${ASCEND_CACHE_PATH}路径下的文件如下表所示。 | 落盘文件 | 文件内容 | 优先级说明 | |---|---|---| | ${ASCEND_CACHE_PATH}/aoe_data | AOE调优知识库文件。 支持多机共享。 | TUNE_BANK_PATH> ASCEND_CACHE_PATH> 默认知识库路径 关于默认知识库路径的说明，请参见TUNE_BANK_PATH中说明。 | | ${ASCEND_CACHE_PATH}/k","example":"export ASCEND_CACHE_PATH=/repo/task001/cache","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0006.html"},{"name":"ASCEND_CUSTOM_OPP_PATH","description":"用户自定义算子安装路径。配置该路径后，算子入图场景下，GE框架在图编译和执行时根据该环境变量搜索算子二进制并使用。支持配置多个路径，以英文冒号分隔。 支持的自定义算子编译方式及路径配置： - 自定义算子包：编译成自定义算子包，且算子包安装到指定路径下（默认路径无需配置该环境变量），配置该环境变量为算子包的安装路径。 - 动态库：编译成动态库时，需配置动态库的安装路径。此时也可以通过动态库链接的方式使用动态库，动态库链接优先级高于环境变量配置的方式。 动态库编译和自定义算子包编译功能同时使用时，前者生成的动态库优先级更高。","example":"如下示例中，和为开发者指定的算子包安装目录，和是动态库编译产物的存放目录，编译产物的优先级为2>4>1>3。  export ASCEND_CUSTOM_OPP_PATH= /vendors/vendor_name1:/op_api/lib/:/vendors/vendor_name3:/op_api/lib/  #### 使用约束 无","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0147.html"},{"name":"ASCEND_WORK_PATH","description":"若开发者期望编译运行过程中产生的文件落盘到归一路径，可通过此环境变量设置单机独享文件的存储路径，各组件编译运行过程中产生的单机独享文件会存储到此环境变量定义的路径中。 - 路径支持大小写字母（a-z，A-Z）、数字（0-9）、下划线（_）、中划线（-）、句点（.）、中文字符。 - 若指定的路径存在且有效，请确保执行用户具有读、写、执行权限；若指定的路径不存在，软件会自动创建。 ${ASCEND_WORK_PATH}路径下的文件如下表所示。 | 落盘文件 | 文件内容 | 优先级说明 | |---|---|---| | ${ASCEND_WORK_PATH}/aoe_data/ | 记录AOE调优过程中的相关信息，包括调优任务名称、调优耗时、调优前后的模型执行时间/算子执行时间、知识库命中信息等。 | ASCEND_WORK_PATH > AOE默认调优工作目录 AOE默认调优工作目录为：","example":"export ASCEND_WORK_PATH=/repo/task001/172.16.1.12_01_03  配置的路径需要为已存在目录，且执行用户具有读、写、执行权限，该路径的最后一段字段需要可唯一标识当前机器。 建议此唯一标识通过machineID、vmID与dockerID拼接组成，如：“machineID_vmID_dockerID”。 - machineID：当前机器的IP地址。 - vmID：虚拟机ID。 - dockerID：Docker容器ID。 如果您是物理机环境，仅通过IP地址标识即可。","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0007.html"},{"name":"CANN_KNOWLEDGE_BANK_PROCESS_NUM","description":"CANN_KNOWLEDGE_BANK_PROCESS_NUM用于设置知识库管理模块查询知识库的进程数。 取值范围[0, 8]。默认值8（即在算子编译阶段，默认会启动8个进程查询知识库）。 启动的进程数越多，消耗的host内存越多，编译越快。 启动的进程数越少，消耗的host内存越少，编译越慢。 当CANN_KNOWLEDGE_BANK_PROCESS_NUM=0时，表示不启动知识库管理模块，不查询知识库。","example":"export CANN_KNOWLEDGE_BANK_PROCESS_NUM=5","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0148.html"}]}}},{"id":"profiling-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/profiling-env.yaml","title":"性能数据采集环境变量","summary":"CANN 环境变量参考（envref 系列）：性能数据采集，2 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"profiling-env","type":"env-var-table","title":"性能数据采集环境变量","summary":"CANN 环境变量参考（envref 系列）：性能数据采集，2 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 350 加速卡"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"PROFILING_MODE","description":"是否开启Profiling采集功能。 - true：开启Profiling功能，从PROFILING_OPTIONS读取Profiling的采集选项。 - false或者不配置：关闭Profiling功能。 - dynamic：动态采集性能数据时（attach方式），需在训练任务执行前配置该参数。","example":"export PROFILING_MODE=true","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0115.html"},{"name":"PROFILING_OPTIONS","description":"训练或在线推理场景下，开发者可通过PROFILING_OPTIONS环境变量配置Profiling配置选项。 - output：Profiling采集结果文件保存路径。支持配置绝对路径或相对路径（相对执行命令行时的当前路径）。路径中不能包含特殊字符：\"\\n\"、\"\\f\"、\"\\r\"、\"\\b\"、\"\\t\"、\"\\v\"、\"\\u007F\"。绝对路径配置以“/”开头，例如：/home/output。 - 相对路径配置直接以目录名开始，例如：output。 - 该参数优先级高于ASCEND_WORK_PATH。 - 该路径无需用户提前创建，采集过程中会自动创建。 - storage_limit：指定落盘目录允许存放的最大文件容量。当Profiling数据文件在磁盘中即将占满本参数设置的最大存储空间或剩余磁盘总空间即将被占满时（总空间剩余 当训练profiling mode开启即采集训练Profiling数据","example":"export PROFILING_OPTIONS='{\"output\":\"/tmp/profiling\",\"training_trace\":\"on\",\"task_trace\":\"on\",\"fp_point\":\"\",\"bp_point\":\"\",\"aic_metrics\":\"PipeUtilization\"}'","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0116.html"}]}}},{"id":"fault-collect-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/fault-collect-env.yaml","title":"故障信息收集环境变量","summary":"CANN 环境变量参考（envref 系列）：故障信息收集，3 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"fault-collect-env","type":"env-var-table","title":"故障信息收集环境变量","summary":"CANN 环境变量参考（envref 系列）：故障信息收集，3 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 350 加速卡","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas 200I/500 A2 推理产品","Atlas 推理系列产品","Atlas 训练系列产品 MC62CM12A AI处理器","Atlas 训练系列产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ASCEND_DUMP_PATH","description":"指定异常算子Dump信息的存储路径，可配置为绝对路径或执行程序的相对路径。指定的路径支持大小写字母（a-z，A-Z）、数字（0-9）、下划线（_）、中划线（-）、句点（.）、中文字符，执行用户需具有读、写、执行权限，若路径不存在，系统会自动创建该路径中的目录。不指定路径时，异常算子Dump信息默认存放在应用程序的当前执行目录。 使用该环境变量需关注以下事项： - 通过ASCEND_DUMP_SCENE环境变量开启异常算子Dump时，优先级从高到低依次为：ASCEND_DUMP_PATH环境变量 > ASCEND_WORK_PATH环境变量 > 默认路径（应用程序的当前执行目录）。 - 通过配置文件（aclInit接口、aclmdlSetDump接口）开启异常算子Dump时，优先级从高到低依次为：ASCEND_DUMP_PATH环境变量 > ASCEND_WORK_PATH环境变量 > 配置","example":"export ASCEND_DUMP_PATH=/repo/task001","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0130.html"},{"name":"ASCEND_DUMP_SCENE","description":"在复现问题场景时，使用该环境变量开启异常算子Dump，导出异常算子的输入输出数据、workspace信息和Tiling信息。 支持如下取值： - aic_err_brief_dump：表示轻量化exception dump，用于导出AI Core错误算子的输入&输出、workspace数据。 - aic_err_norm_dump：表示普通exception dump，在轻量化exception dump基础上，还会导出Shape、Data Type、Format以及属性信息。 - aic_err_detail_dump：在轻量化exception dump基础上，还会导出AI Core的内部存储、寄存器以及调用栈信息。配置该选项时，有以下注意事项： 该选项仅支持以下型号：Atlas A2 训练系列产品/Atlas A2 推理系列产品 Atlas A3 训练系列产品/Atlas A3 推理","example":"export ASCEND_DUMP_SCENE=aic_err_brief_dump","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0164.html"},{"name":"NPU_COLLECT_PATH","description":"在复现问题场景下，使用该环境变量指定故障信息（包括dump图、AI Core算子异常数据、算子编译信息等）的保存路径，可配置为绝对路径或相对路径（此处是相对执行程序或命令的路径），执行用户需对该路径具有读、写、可执行权限，若路径不存在，系统会自动创建该路径中的目录。 注意，使用该环境变量需关注以下事项： - 设置该环境变量，默认自动开启异常算子dump数据采集功能。如果算子输入或输出包含用户的敏感信息，则存在信息泄露风险。 - 设置该环境变量之后转换模型，在编译om模型时会增加调试信息，导致om模型文件增大，若关注内存规划或内存资源有限时，则在调试完成后及时删除该环境变量。 - 设置该环境变量，仅收集L1 exception dump信息，不收集模型Dump信息、单算子Dump信息、溢出算子Dump信息、L0 exception dump信息。L1 exception dump信息存放目录","example":"export NPU_COLLECT_PATH=$HOME/demo/","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0163.html"}]}}},{"id":"ascend-log-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/ascend-log-env.yaml","title":"日志（ASCEND_LOG/ASCEND_GLOBAL/ASCEND_SLOG 系列）环境变量","summary":"CANN 环境变量参考（envref 系列）：日志（ASCEND_LOG/ASCEND_GLOBAL/ASCEND_SLOG 系列），10 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"ascend-log-env","type":"env-var-table","title":"日志（ASCEND_LOG/ASCEND_GLOBAL/ASCEND_SLOG 系列）环境变量","summary":"CANN 环境变量参考（envref 系列）：日志（ASCEND_LOG/ASCEND_GLOBAL/ASCEND_SLOG 系列），10 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 350 加速卡","Atlas 200I/500 A2 推理产品"]},"related_references":["ascend-log-levels","ascend-slog-conf","ascend-trace-logs"],"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ASCEND_COREDUMP_SIGNAL","description":"设置trace处理的core dump信号量。 取值如下： - none：关闭表1中的信号集。 - 非none的其他值：打开表1中的信号集。 trace默认开启堆栈功能，进程触发以下异常场景（信号）时，将栈信息记录在stackcore_tracer_*.txt文件中。 | 信号 | 信号值 | |---|---| | SIGINT | 2 | | SIGQUIT | 3 | | SIGILL | 4 | | SIGTRAP | 5 | | SIGABRT | 6 | | SIGBUS | 7 | | SIGFPE | 8 | | SIGSEGV | 11 | | SIGTERM | 15 | | SIGXCPU | 24 | | SIGXFSZ | 25 | | SIGSYS | 31 | | SIGRTMIN+1 | 35 | 若业务部署时，使用到了与表1中的信号注册有冲突的功能（比如J","example":"export ASCEND_COREDUMP_SIGNAL=none","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0127.html"},{"name":"ASCEND_GLOBAL_EVENT_ENABLE","description":"设置应用类日志是否开启Event日志。 取值为： - 0：关闭Event日志。 - 1：开启Event日志，默认值为1。 - 其他值为非法值。 - 通过执行echo $ASCEND_GLOBAL_EVENT_ENABLE命令可以查看环境变量设置的值。 - 若环境变量未配置/配置为非法值/配置为空，采用默认值。","example":"export ASCEND_GLOBAL_EVENT_ENABLE=0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0124.html"},{"name":"ASCEND_GLOBAL_LOG_LEVEL","description":"设置应用类日志的日志级别及各模块日志级别，仅支持调试日志。 取值为： - 0：对应DEBUG级别。 - 1：对应INFO级别。 - 2：对应WARNING级别。 - 3：对应ERROR级别，默认为ERROR级别。 - 4：对应NULL级别，不输出日志。 - 其他值为非法值。 - 通过执行echo $ASCEND_GLOBAL_LOG_LEVEL命令可以查看环境变量设置的日志级别。 - 若环境变量未配置/配置为非法值/配置为空，采用默认日志级别。 - 设置为DEBUG级别后，可能会因为日志流量过大影响业务性能。","example":"export ASCEND_GLOBAL_LOG_LEVEL=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0122.html"},{"name":"ASCEND_HOST_LOG_FILE_NUM","description":"Ascend EP场景下，设置应用类日志目录（plog和device-id）下存储每个进程日志文件的数量。 环境变量取值范围为[1, 1000]，默认值为10。 - 通过执行echo $ASCEND_HOST_LOG_FILE_NUM命令可以查看环境变量设置的值。 - 若环境变量未配置/配置为非法值/配置为空，表示采用日志默认值。 - 如果plog和device-id日志目录下存储的单个进程的日志文件数量超过设置的值，将会自动删除最早的日志。另外每个plog-pid_*.log或device-pid_*.log日志文件的大小最大固定为20MB。如果超过该值，会生成新的日志文件。","example":"export ASCEND_HOST_LOG_FILE_NUM=20","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0126.html"},{"name":"ASCEND_LOG_DEVICE_FLUSH_TIMEOUT","description":"指定Device侧应用类日志回传到Host侧的延时时间。 业务进程退出前，系统有2000ms的默认延时将Device侧应用类日志回传到Host侧，超时后业务进程退出。未回传到Host侧的日志直接在Device侧落盘（路径为/var/log/npu/slog）。通过该环境变量可以修改该延时时间，取值范围为[0, 180000]，单位为ms，默认值为2000。 - 通过执行echo $ASCEND_LOG_DEVICE_FLUSH_TIMEOUT命令可以查看环境变量设置的值。 - 若环境变量未配置/配置为非法值/配置为空，表示采用日志默认值。 - 如果业务进程不需要等待所有Device侧应用类日志回传到Host侧，可将环境变量设置为0。 - 针对业务进程退出后仍然有Device侧应用类日志未回传到Host侧这种情况，建议设置更大的延时时间，具体调节的大小可以根据device-app-pid的日","example":"export ASCEND_LOG_DEVICE_FLUSH_TIMEOUT=5000","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0125.html"},{"name":"ASCEND_LOG_SYNC_SAVE","description":"指定日志拥塞处理方式。 - 0：默认处理方式，在日志拥塞或IO访问性能差的情况下，为保证业务性能不劣化，系统可能会丢失日志。 - 1：在日志拥塞或IO访问性能差的情况下，不丢失日志。该方式下，为便于问题定位，建议配置为1。 如果用户通过ASCEND_GLOBAL_LOG_LEVEL、ASCEND_MODULE_LOG_LEVEL调整了日志级别，则系统按照不丢失日志处理","example":"export ASCEND_LOG_SYNC_SAVE=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0128.html"},{"name":"ASCEND_MODULE_LOG_LEVEL","description":"设置应用类日志的各模块日志级别，仅支持调试日志。 格式为：export ASCEND_MODULE_LOG_LEVEL=module_name=module_level - module_name：为模块名，支持设置为GE、ASCENDCL、DRV、RUNTIME等，详细请参见CANN软件安装目录/include/base/log_types.h。 - module_level：为对应模块的日志级别，支持设置为如下值。0：对应DEBUG级别。 - 1：对应INFO级别。 - 2：对应WARNING级别。 - 3：对应ERROR级别。 - 4：对应NULL级别，不输出日志。 - 其他值为非法值。 - 等号前后无空格，冒号为英文格式且前后无空格；如果同时设置多个模块日志级别，模块间使用冒号间隔。如果命令行格式错误（如存在除等号和冒号以外其他符号）、包括了不支持的模块名称，则命令行整体不生效。","example":"export ASCEND_MODULE_LOG_LEVEL=TBE=0:RUNTIME=0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0123.html"},{"name":"ASCEND_PROCESS_LOG_PATH","description":"设置日志落盘路径。 日志存储时如果不存在该目录，会自动创建该目录；如果存在则直接存储。 - 通过执行echo $ASCEND_PROCESS_LOG_PATH命令可以查看环境变量设置的路径。 - 日志落盘优先级为：ASCEND_PROCESS_LOG_PATH > ASCEND_WORK_PATH > 日志默认存储路径（$HOME/ascend/log）","example":"export ASCEND_PROCESS_LOG_PATH=$HOME/log/  可指定日志落盘路径为任意有读写权限的目录。","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0120.html"},{"name":"ASCEND_SLOG_PRINT_TO_STDOUT","description":"是否开启日志打印。开启后，日志将不会保存在log文件中，而是将产生的日志直接打印显示。 取值为： - 0：关闭日志打印，即日志采用默认输出方式，将日志保存在log文件中。 - 1：开启日志打印。 - 其他值为非法值。 - 通过执行echo $ASCEND_SLOG_PRINT_TO_STDOUT命令可以查看环境变量设置的值。 - 若环境变量未配置/配置为非法值/配置为空，表示采用日志默认输出方式。","example":"export ASCEND_SLOG_PRINT_TO_STDOUT=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0121.html"},{"name":"ASCEND_TRACE_RECORD_NUM","description":"设置trace日志文件的老化规格，取值范围[10, 1000]。 具体指$HOME/ascend/atrace/trace_{进程组pid}_{首次加载trace动态库的进程pid}_{首次加载trace动态库的时间戳}/目录下“schedule_event_{当前进程pid}_{目录生成时的时间戳}”子目录的老化规格。Host侧的trace日志文件和Device侧的trace日志文件分开计数，配置后将分别控制Host和Device的目录数量。","example":"export ASCEND_TRACE_RECORD_NUM=15  表示$HOME/ascend/atrace/trace_{进程组pid}_{首次加载trace动态库的进程pid}_{首次加载trace动态库的时间戳}/下最多生成15个名称为“schedule_event_{当前进程pid}_{目录生成时的时间戳}”的目录。超过该目录数量后，会自动删除时间戳较老的目录。","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0140.html"}]}}},{"id":"operator-exec-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/operator-exec-env.yaml","title":"算子执行环境变量","summary":"CANN 环境变量参考（envref 系列）：算子执行，1 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"operator-exec-env","type":"env-var-table","title":"算子执行环境变量","summary":"CANN 环境变量参考（envref 系列）：算子执行，1 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 推理系列产品","Atlas 训练系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas 350 加速卡"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ACLNN_CACHE_LIMIT","description":"此环境变量用于配置aclnn API在Host侧缓存的算子信息条目个数。缓存的算子信息包含workspace大小、算子计算的执行器、Tiling信息等。 单位：个，取值范围：[1,10000000]，默认值为10000。 一般不建议设置ACLNN_CACHE_LIMIT环境变量，保持默认值即可。针对动态shape场景，若算子的shape范围较大，开发者可结合业务需求适当增加此环境变量取值，以增加算子缓存条目，从而提升调度性能。但需要注意，增加算子信息缓存条目会增加Host内存开销，具体请参见使用约束。","example":"export ACLNN_CACHE_LIMIT=10000","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0031.html"}]}}},{"id":"operator-compile-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/operator-compile-env.yaml","title":"算子编译环境变量","summary":"CANN 环境变量参考（envref 系列）：算子编译，4 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"operator-compile-env","type":"env-var-table","title":"算子编译环境变量","summary":"CANN 环境变量参考（envref 系列）：算子编译，4 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 训练系列产品","Atlas 推理系列产品","Atlas A2 训练系列产品 /","Atlas A2 推理系列产品","Atlas A3 训练系列产品 /","Atlas A3 推理系列产品","Atlas 350 加速卡","Atlas 200I/500 A2 推理产品 父主题： 算子编译","Atlas A2 训练系列产品","Atlas A3 训练系列产品","Atlas 200I/500 A2 推理产品"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ASCEND_MAX_OP_CACHE_SIZE","description":"启用算子编译缓存功能时，可通过此环境变量限制某个AI处理器下缓存文件夹的磁盘空间的大小。默认为500，单位为MB。 - 当编译缓存文件的大小超过此环境变量的设置值，且超过半小时缓存文件未被访问时，缓存文件就会老化。 - 若需要关闭编译缓存老化功能，可将环境变量“ASCEND_MAX_OP_CACHE_SIZE”设置为“-1”，此时访问算子缓存时不会更新访问时间，算子编译缓存不会老化，磁盘空间使用默认大小500MB。 算子编译时，不会因为编译缓存文件大小超过设置值而中断，所以当此环境变量的值设置过小时，会出现实际编译缓存文件大小超过此设置值的情况。","example":"export ASCEND_MAX_OP_CACHE_SIZE=500","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0021.html"},{"name":"ASCEND_REMAIN_CACHE_SIZE_RATIO","description":"启用算子编译缓存功能时，当编译缓存空间大小达到ASCEND_MAX_OP_CACHE_SIZE而需要删除旧的kernel文件时，系统需要保留缓存的空间大小比例，默认为50，单位为百分比。","example":"export ASCEND_REMAIN_CACHE_SIZE_RATIO=50","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0022.html"},{"name":"IGNORE_INFER_ERROR","description":"该环境变量为试验特性，后续版本可能会存在变更。 算子入图时，跳过算子原型交付件校验的开关。交付件包括shape推导等算子入图适配函数的实现。 - 非空：算子入图交付件缺失场景下，算子编译时跳过校验报错，快速恢复用例。 - 不配置：（默认值）算子入图交付件缺失时，算子编译报错。","example":"如下示例中的取值“1”仅为参考样例，可以设置为其他非空字符串。  export IGNORE_INFER_ERROR=1","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0142.html"},{"name":"TE_PARALLEL_COMPILER","description":"算子最大并行编译进程数，当该参数大于1时，系统将开启并行编译功能。 网络模型较大时，可通过配置此环境变量开启算子的并行编译功能。","example":"export TE_PARALLEL_COMPILER=8","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0020.html"}]}}},{"id":"resource-config-env","type":"env-var-table","dir":"env-vars","file":"references/env-vars/resource-config-env.yaml","title":"资源配置环境变量","summary":"CANN 环境变量参考（envref 系列）：资源配置，4 个变量；description 为官方原文，platforms 取自官方 models 声明","doc":{"id":"resource-config-env","type":"env-var-table","title":"资源配置环境变量","summary":"CANN 环境变量参考（envref 系列）：资源配置，4 个变量；description 为官方原文，platforms 取自官方 models 声明","sources":[{"type":"official-doc","url":"CANN 环境变量参考（华为，hiascend.com maintenref/envvar）","version":"CANN 9.0（envref 系列）","fetched_at":"2026-08-29","verification":"cross-checked-source"}],"applies_to":{"platforms":["Atlas 350 加速卡","Atlas A3 训练系列产品","Atlas A3 推理系列产品","Atlas A2 训练系列产品","Atlas A2 推理系列产品","Atlas 200I/500 A2 推理产品","Atlas 推理系列产品","Atlas 训练系列产品","Atlas A2 训练系列产品 /","Atlas A2 推理系列产品 父主题： 资源配置"]},"status":"active","last_verified":"2026-08-29","content":{"variables":[{"name":"ASCEND_DEVICE_ID","description":"指定当前进程所用的AI处理器的逻辑ID。 取值范围[0,N-1]，默认为0。其中N为当前物理机/虚拟机/容器内的设备总数。 该环境变量使用场景： TensorFlow框架网络在昇腾平台执行训练或在线推理的场景。 推理场景下使用AOE工具进行调优的场景。 训练场景下使用AOE工具进行调优的场景。","example":"export ASCEND_DEVICE_ID=0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0027.html"},{"name":"ASCEND_RT_VISIBLE_DEVICES","description":"指定哪些Device对当前进程可见，支持一次指定一个或多个Device ID。通过该环境变量，可实现不修改应用程序即可调整所用Device的功能。 其中Device ID为AI处理器的逻辑ID，例如可用Device数量为8，Device ID分别为：0、1、2、3、4、5、6、7，使用场景说明如下： - 设置“export ASCEND_RT_VISIBLE_DEVICES=1”，则表示当前进程仅可使用Device ID为1的Device，获取到的Device数量为1，此时Device的索引值为0，后续在指定Device计算设备时，需使用该索引值。 - 设置“export ASCEND_RT_VISIBLE_DEVICES=1,2,3”，则表示当前进程仅可使用Device ID为1、2、3的三个Device，获取到的Device数量为3，此时各Device的索引值分别为0、1、2，后续在指","example":"- 指定一个Device ID：  export ASCEND_RT_VISIBLE_DEVICES=1  - 指定多个Device ID：  export ASCEND_RT_VISIBLE_DEVICES=1,2,3","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0028.html"},{"name":"AUTO_USE_UC_MEMORY","description":"控制系统是否允许算子搬移数据不经过L2 Cache的功能。 取值为： - 0或其他值：否，表示所有算子搬移数据都必须经过L2 Cache。 - 1：是，表示允许算子搬移数据可以不经过L2 Cache，具体是否经过L2 Cache，由算子Kernel代码中的逻辑决定。默认值为1。配置为1后，部分算子性能可得到提升，但可能存在AI Core Error风险。 本环境变量为试验特性，后续版本可能会存在变更，不支持应用于商用产品中。","example":"export AUTO_USE_UC_MEMORY=0","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0029.html"},{"name":"RESOURCE_CONFIG_PATH","description":"用于设置配置异构资源描述信息文件的存储路径。 异构资源描述信息文件是JSON文件，包含单节点以及集群的描述信息，配置示例以及字段含义可参见《DataFlow开发》手册中的“numa_config.json配置”章节。","example":"export RESOURCE_CONFIG_PATH=/home/test/numa_config.json","url":"https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0133.html"}]}}},{"id":"cann-hdk","type":"compat-matrix","dir":"compat-matrices","file":"references/compat-matrices/cann-hdk.yaml","title":"CANN ↔ Ascend HDK（驱动/固件）版本配套矩阵（base 层）","summary":"CANN 官方版本说明声明的配套/兼容 Ascend HDK 版本（release-note 多版本核验，含 beta）：9.1.x 主配 26.0.RC1/26.1.x 且与 25.0.X 不兼容；9.0.x 配 26.0.RC1/25.7.RC1 起；8.5.x 配 25.5.X 起、8.5.2 起可配 26.0.RC1——诊断驱动/固件类报错时对照本表判断 HDK 是否越界；上层的 CANN 兼容由 adapter 层（torch-npu-cann）传导，不在此重复","doc":{"id":"can
