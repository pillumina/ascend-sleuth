    meaning: roadmap 可演进性事项：train/val 分离 + golden/val 门控 + 影响账本，决议 EV-2026-013，设计 docs/mechanism/eval-arena.md
    see: roadmap.md

# 系列级说明（无固定字面 token 的系列；渲染告警与速查表用）
  # ---- 同形冲突的另两个含义：登记在此，使范围表能表达"同名两义" ----
  # 旧模型（token → 单条含义）无法表达这件事，于是 `P0`（优先级）只能被报成
  # "未登记"，而一旦按提示登记就会与 roadmap 的 P1–P4（流程事项）同族撞车。
  - token: P0
    short: 优先级（最高）
    family: 优先级
    scope: ["docs/rollout-assessment.md"]
    meaning: >-
      优先级标记（最高档），用于 rollout-assessment 的行动清单；
      **与 roadmap 流程事项 P1–P4 无关**——同形不同义，按文件区分
    see: rollout-assessment.md
  - token: A2-910B
    short: 平台（A2 代 910B）
    family: 平台
    scope: ["*"]
    meaning: 硬件平台代号（Ascend 910B，A2 代）；与设计公理 A2、roadmap 架构事项 A2 同形不同义
    see: git-workflow.md 平台对应表
  - token: A3-910C
    short: 平台（A3 代 910C）
    family: 平台
    scope: ["*"]
    meaning: 硬件平台代号（Ascend 910C，A3 代）；与设计公理 A3、roadmap 架构事项 A3 同形不同义
    see: git-workflow.md 平台对应表
  - token: A5-950
    short: 平台（A5 代 950）
    family: 平台
    scope: ["*"]
    meaning: 硬件平台代号（Ascend 950，A5 代）
    see: git-workflow.md 平台对应表


families:
  - id: layers
    label: 演进对象层
    pattern: L[1-3]
    note: L1 知识 / L2 流程与 skill / L3 工作流编排
  - id: sources
    label: 评分源
    pattern: S[1-3]
    note: S1 现场反馈 / S2 issue 回放对照 / S3 golden 回归
  - id: roadmap
    label: roadmap 事项
    pattern: '[AEMOP][0-9]'
    note: A=架构 E=可演进性 M=可维护性 O=可观测性 P=流程；具体含义见 roadmap.md 各维度表
  - id: governance
    label: 治理缺口
    pattern: G[1-8]
    note: G1 会话层缺失…G8 无暂停重启；不是'改进增量'系列（教训：曾误用 G1/G2/G3）
  - id: signals
    label: 触发信号
    pattern: T[0-9]+
    note: evolve-check 信号条目（T4=执行错无归属 等）
  - id: evcards
    label: EV 卡
    pattern: EV-\d{4}-\d{3}
    note: 自演进决策档案卡（proposals/ideas/）
  - id: phases
    label: 落地阶段
    pattern: Phase [A-E]
    note: pipeline §11 落地阶段 A–E；与 roadmap 的 E# 无关联
