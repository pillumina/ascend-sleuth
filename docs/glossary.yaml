# ============================================================
# 设计层代号词表 + **范围表**（机器可读，人读性工具的数据源）
#
# 两个用途：
#   1. **解码**：scripts/render_review_summary.py 把"人读文本里的代号"渲染成
#      "首次出现即解码"的可读形式；未登记代号告警（防撞车与失忆，
#      教训：WikiSkill 初稿 G1/G2/G3 撞治理缺口 G1–G8）。
#   2. **限定生存范围**（`scope` 字段）：记账号（roadmap 事项 A/E/M/O/P、
#      治理缺口 G、触发信号 T、落地阶段 Phase）**只在各自的计划文档里裸用**；
#      在机制文档、PR body、EV 卡 prose 里要引用就写中文含义。
#
# 为什么需要第 2 条（而不是继续"登记即放行"）：登记表把"起个新代号"从**需要理由**
# 变成**需要登记**——那是一道许可流程，不是成本流程；而读者要付的成本是**概念数**，
# 不是"是否登记"。实测：全部 60 条代号登记齐全、扫描零告警，人却仍读不懂机制文档
# （7 篇 evolution 互引成完全图、跨文档 § 锚点约 100 处、A1/A2/A3 一词三义）。
# 所以本表的第二职责是**限制代号出现在哪**，扫描器据此报"越界用途"。
#
# 维护规则（docs/git-workflow.md「人读性与代号约定」）：
#   1. 新增代号先在此登记（本文件 = 机器词表唯一数据源）；
#   2. **同时确定它的生存范围**——`["*"]` 只给领域语汇（L/S 分层与反馈通道、
#      skill 名）；记账号一律限定到其所有者文档；
#   3. 机器字段（layer/status/method 等枚举值）不在本表——它们保持词法。
#
# 已知同形冲突（扫描器按 scope 消歧，勿再新增同类）：
#   `A1/A2/A3` 同时是**设计公理**（"理论 A2（资源有界）"）与 **roadmap 事项 ID**，
#   且 `A2/A3/A5` 又是**平台代号**（A2-910B / A3-910C / A5-950）。因此 roadmap 架构
#   系列的 scope 含 design-theory.md / design-principles.md：在那里它们指公理，是
#   域内合法用法；两文档对同一 token 的含义不同，读者需按文件判断。
#
# 稳定文档层 vs 数据的分层先例：docs/metrics.md（机制解释）vs
# metrics/timeline.yaml（数据）——本文件类比 timeline.yaml。
# ============================================================

version: 1
# 字段说明：
#   token   —— 文本中出现的字面代号（渲染时按最长匹配替换）
#   short   —— 内联解码短义（"代号〔短义〕"），优先用于人读 prose 内联注释
#   meaning —— 完整解码含义（表格视图用，可含定义处指针）
#   family  —— 所属代号系列
#   scope   —— **允许裸用本代号的文件**；`["*"]` = 任意人读文本。
#              不在此列的文件里出现即"越界用途"，扫描器会报（约定强度，不进 CI）
#   see     —— 定义处文档指针
