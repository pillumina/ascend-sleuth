<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 960">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="36" fill="#0f172a" font-size="17" font-weight="700">ascend-sleuth</text>
  <text x="40" y="56" fill="#64748b" font-size="10">面向昇腾训练与推理的诊断知识系统 —— 从每次问题定位沉淀可复用的经验</text>

  <!-- ═══════════════ 左区：诊断流程 ═══════════════ -->
  <rect x="30" y="84" width="520" height="556" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="7,4"/>
  <text x="46" y="102" fill="#2563eb" font-size="10" font-weight="600">诊断流程 · 单次问题 · 分钟级</text>

  <!-- 用户输入 -->
  <rect x="56" y="116" width="150" height="54" rx="8" fill="#ffffff"/>
  <rect x="56" y="116" width="150" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="131" y="138" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">工程师</text>
  <text x="131" y="154" fill="#64748b" font-size="9" text-anchor="middle">症状 / 日志 / 环境</text>

  <!-- 诊断入口 -->
  <rect x="300" y="116" width="180" height="54" rx="8" fill="#ffffff"/>
  <rect x="300" y="116" width="180" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="390" y="138" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">智能诊断</text>
  <text x="390" y="154" fill="#64748b" font-size="9" text-anchor="middle">/skill:diagnose · 自动执行</text>

  <!-- 症状路由 -->
  <rect x="56" y="214" width="424" height="52" rx="8" fill="#ffffff"/>
  <rect x="56" y="214" width="424" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="268" y="236" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">症状分类与定位</text>
  <text x="268" y="252" fill="#64748b" font-size="9" text-anchor="middle">识别问题类型与框架 → 缩小检索范围</text>

  <!-- 知识匹配 -->
  <rect x="56" y="298" width="424" height="86" rx="8" fill="#ffffff"/>
  <rect x="56" y="298" width="424" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="268" y="320" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">知识匹配（两阶段）</text>
  <text x="268" y="340" fill="#64748b" font-size="9" text-anchor="middle">索引快速筛选 → 候选排序（按历史可信度）</text>
  <text x="268" y="356" fill="#64748b" font-size="9" text-anchor="middle">加载候选详情 → 逐条对照验证</text>

  <!-- 命中决策 -->
  <g transform="translate(268, 446)">
    <polygon points="0,-34 52,0 0,34 -52,0" fill="#ffffff"/>
    <polygon points="0,-34 52,0 0,34 -52,0" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text y="4" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">是否命中?</text>
  </g>

  <!-- 命中：处理建议 -->
  <rect x="56" y="524" width="180" height="64" rx="8" fill="#ffffff"/>
  <rect x="56" y="524" width="180" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="146" y="546" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">命中 → 处理建议</text>
  <text x="146" y="562" fill="#64748b" font-size="9" text-anchor="middle">风险分级控制</text>
  <text x="146" y="576" fill="#64748b" font-size="9" text-anchor="middle">反馈跟踪标记</text>

  <!-- 未命中：深度排查 -->
  <rect x="300" y="524" width="180" height="64" rx="8" fill="#ffffff"/>
  <rect x="300" y="524" width="180" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="390" y="546" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">未命中 → 深度排查</text>
  <text x="390" y="562" fill="#64748b" font-size="9" text-anchor="middle">历史案例检索兜底</text>
  <text x="390" y="576" fill="#64748b" font-size="9" text-anchor="middle">人工协同分析</text>

  <!-- ═══════════════ 右区：知识演进 ═══════════════ -->
  <rect x="600" y="84" width="550" height="556" rx="14" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="7,4"/>
  <text x="616" y="102" fill="#059669" font-size="10" font-weight="600">知识演进 · 每周例行 · 质量门控</text>

  <!-- 知识沉淀 -->
  <rect x="624" y="116" width="502" height="54" rx="8" fill="#ffffff"/>
  <rect x="624" y="116" width="502" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="875" y="138" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">知识沉淀（to-postmortem）</text>
  <text x="875" y="154" fill="#64748b" font-size="9" text-anchor="middle">任意来源：诊断会话 / 手工记录 / 历史案例 → 提取 → 校验 → 脱敏</text>

  <!-- 待审队列 -->
  <rect x="624" y="200" width="502" height="50" rx="8" fill="#ffffff"/>
  <rect x="624" y="200" width="502" height="50" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
  <text x="875" y="222" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">待审知识队列</text>
  <text x="875" y="238" fill="#64748b" font-size="9" text-anchor="middle">新知识先入队，每周统一审核 · 积压自动提醒</text>

  <!-- 例行审核 -->
  <rect x="624" y="280" width="502" height="74" rx="8" fill="#ffffff"/>
  <rect x="624" y="280" width="502" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="875" y="302" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">每周例行知识审核（knowledge-groom）</text>
  <text x="875" y="320" fill="#64748b" font-size="9" text-anchor="middle">自动预分类：新问题 / 同类变体 / 已被覆盖</text>
  <text x="875" y="336" fill="#64748b" font-size="9" text-anchor="middle">人工确认 · 高风险变更需双重审批</text>

  <!-- 质量门控 -->
  <rect x="624" y="384" width="502" height="74" rx="8" fill="#ffffff"/>
  <rect x="624" y="384" width="502" height="74" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="875" y="406" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">变更合入（质量门控）</text>
  <text x="875" y="424" fill="#64748b" font-size="9" text-anchor="middle">变更标签 · 分级审批 · 双重审批</text>
  <text x="875" y="440" fill="#64748b" font-size="9" text-anchor="middle">自动化检查：索引一致性 · 数据完整性</text>

  <!-- 知识库 -->
  <rect x="624" y="488" width="502" height="76" rx="8" fill="#ffffff"/>
  <rect x="624" y="488" width="502" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="875" y="510" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">知识库</text>
  <text x="875" y="526" fill="#64748b" font-size="9" text-anchor="middle">按 框架 × 问题类型 组织，分类管理</text>
  <text x="875" y="540" fill="#64748b" font-size="9" text-anchor="middle">新知识入库 · 变体合并 · 已覆盖归档</text>
  <text x="875" y="554" fill="#64748b" font-size="9" text-anchor="middle">索引自动更新 · 容量预警机制</text>

  <!-- ═══════════════ 底部：反馈闭环 ═══════════════ -->
  <rect x="30" y="676" width="1120" height="148" rx="14" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="46" y="694" fill="#475569" font-size="10" font-weight="600">反馈闭环 · 驱动知识持续改进</text>

  <!-- 结果反馈 -->
  <rect x="56" y="708" width="230" height="64" rx="8" fill="#ffffff"/>
  <rect x="56" y="708" width="230" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="171" y="730" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">处理结果反馈</text>
  <text x="171" y="746" fill="#64748b" font-size="9" text-anchor="middle">已解决 / 未解决 / 部分解决</text>
  <text x="171" y="760" fill="#64748b" font-size="9" text-anchor="middle">后续会话自动追问</text>

  <!-- 置信度更新 -->
  <rect x="350" y="708" width="230" height="64" rx="8" fill="#ffffff"/>
  <rect x="350" y="708" width="230" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="465" y="730" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">置信度更新</text>
  <text x="465" y="746" fill="#64748b" font-size="9" text-anchor="middle">命中 / 误判计数</text>
  <text x="465" y="760" fill="#64748b" font-size="9" text-anchor="middle">数据驱动的排序优化</text>

  <!-- 过程留痕 -->
  <rect x="644" y="708" width="230" height="64" rx="8" fill="#ffffff"/>
  <rect x="644" y="708" width="230" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="759" y="730" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">诊断过程留痕</text>
  <text x="759" y="746" fill="#64748b" font-size="9" text-anchor="middle">本地保存，逐步记录</text>
  <text x="759" y="760" fill="#64748b" font-size="9" text-anchor="middle">复盘归因依据 · 自动校验</text>

  <!-- 运行指标 -->
  <rect x="938" y="708" width="196" height="64" rx="8" fill="#ffffff"/>
  <rect x="938" y="708" width="196" height="64" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
  <text x="1036" y="730" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">运行指标汇总</text>
  <text x="1036" y="746" fill="#64748b" font-size="9" text-anchor="middle">路由准确率 / 反馈闭环率</text>
  <text x="1036" y="760" fill="#64748b" font-size="9" text-anchor="middle">数据合规</text>

  <!-- ═══════════════ 图例（独立底部区域） ═══════════════ -->
  <g transform="translate(46, 856)">
    <rect x="0" y="0" width="1080" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="26" fill="#475569" font-size="10" font-weight="600">图例</text>
    <rect x="76" y="14" width="20" height="12" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="106" y="24" fill="#475569" font-size="9">诊断入口 / 用户交互</text>
    <rect x="246" y="14" width="20" height="12" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="276" y="24" fill="#475569" font-size="9">处理 / 知识匹配</text>
    <rect x="420" y="14" width="20" height="12" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="450" y="24" fill="#475569" font-size="9">知识存储 / 历史检索</text>
    <rect x="616" y="14" width="20" height="12" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="646" y="24" fill="#475569" font-size="9">路由 / 决策节点</text>
    <rect x="790" y="14" width="20" height="12" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
    <text x="820" y="24" fill="#475569" font-size="9">审核 / 门控</text>
    <rect x="936" y="14" width="20" height="12" rx="3" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
    <text x="966" y="24" fill="#475569" font-size="9">待办 / 队列</text>
  </g>

  <!-- ═══════════════ 连接线：诊断流程 ═══════════════ -->
  <path d="M 206 143 L 296 143" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <path d="M 268 170 L 268 210" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
  <path d="M 268 266 L 268 294" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <path d="M 268 384 L 268 408" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
  <path d="M 268 446 L 268 478" fill="none" stroke="#d97706" stroke-width="1" marker-end="url(#arrow-amber)"/>
  <path d="M 226 478 L 146 478 L 146 520" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <path d="M 310 478 L 390 478 L 390 520" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-violet)"/>
  <text x="176" y="472" fill="#64748b" font-size="8" text-anchor="middle">是</text>
  <text x="360" y="472" fill="#64748b" font-size="8" text-anchor="middle">否</text>

  <!-- ═══════════════ 连接线：知识演进 ═══════════════ -->
  <path d="M 875 170 L 875 196" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 875 250 L 875 276" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <path d="M 875 354 L 875 380" fill="none" stroke="#e11d48" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 875 458 L 875 484" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-violet)"/>

  <!-- ═══════════════ 连接线：反馈闭环 ═══════════════ -->
  <path d="M 146 588 L 146 704" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <path d="M 286 740 L 346 740" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <path d="M 580 740 L 640 740" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-violet)"/>
  <path d="M 874 740 L 934 740" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ═══════════════ 知识闭环回线 ═══════════════ -->
  <path d="M 624 526 L 580 526 L 580 660 L 268 660 L 268 620" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow-violet)"/>
  <text x="424" y="672" fill="#7c3aed" font-size="9" text-anchor="middle" font-weight="600">知识闭环：新知识入库 → 下次诊断直接命中</text>
</svg>
