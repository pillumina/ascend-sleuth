<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="36" fill="white" font-size="16" font-weight="700">ascend-sleuth 架构</text>
  <text x="40" y="54" fill="#94a3b8" font-size="9">昇腾训练/推理诊断知识系统 · 分级贝叶斯决策机（四公理 → 十一原则 → 工程）</text>

  <!-- ═══════════════ 区域 1：诊断循环（左侧大区） ═══════════════ -->
  <rect x="30" y="80" width="520" height="560" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="98" fill="#22d3ee" font-size="10" font-weight="600">诊断循环 · 每次问题 · 分钟级</text>

  <!-- 输入：工程师 -->
  <rect x="56" y="112" width="150" height="56" rx="6" fill="#0f172a"/>
  <rect x="56" y="112" width="150" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="131" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">工程师</text>
  <text x="131" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">症状 / 日志尾 / 版本</text>

  <!-- /skill:diagnose -->
  <rect x="300" y="112" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="300" y="112" width="180" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="390" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">/skill:diagnose</text>
  <text x="390" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">agent 执行诊断循环</text>

  <!-- Tier 1 triage -->
  <rect x="56" y="216" width="424" height="50" rx="6" fill="#0f172a"/>
  <rect x="56" y="216" width="424" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="268" y="238" fill="white" font-size="11" font-weight="600" text-anchor="middle">Tier 1 · triage-tree.yaml 症状路由</text>
  <text x="268" y="254" fill="#94a3b8" font-size="9" text-anchor="middle">框架判别 → namespace（≤30 分支，词边界匹配）</text>

  <!-- Tier 2 两阶段 -->
  <rect x="56" y="300" width="424" height="86" rx="6" fill="#0f172a"/>
  <rect x="56" y="300" width="424" height="86" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="268" y="322" fill="white" font-size="11" font-weight="600" text-anchor="middle">Tier 2 · 两阶段加载</text>
  <text x="268" y="342" fill="#94a3b8" font-size="9" text-anchor="middle">阶段一：_index.yaml 读格子（score 排序）→ 候选 ≤5</text>
  <text x="268" y="358" fill="#94a3b8" font-size="9" text-anchor="middle">阶段二：全量加载 → 按 confidence 降序验证</text>

  <!-- 决策菱形：命中? -->
  <g transform="translate(268, 448)">
    <polygon points="0,-34 52,0 0,34 -52,0" fill="#0f172a"/>
    <polygon points="0,-34 52,0 0,34 -52,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">验证命中?</text>
  </g>

  <!-- 命中分支：fix -->
  <rect x="56" y="528" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="56" y="528" width="180" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="146" y="550" fill="white" font-size="11" font-weight="600" text-anchor="middle">命中 → severity 闸门</text>
  <text x="146" y="566" fill="#94a3b8" font-size="9" text-anchor="middle">fix / halt(data-loss)</text>
  <text x="146" y="580" fill="#94a3b8" font-size="9" text-anchor="middle">feedback_pending 标记</text>

  <!-- 未命中分支：Tier 3 -->
  <rect x="300" y="528" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="300" y="528" width="180" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="390" y="550" fill="white" font-size="11" font-weight="600" text-anchor="middle">未命中 → Tier 3</text>
  <text x="390" y="566" fill="#94a3b8" font-size="9" text-anchor="middle">postmortems/ 检索兜底</text>
  <text x="390" y="580" fill="#94a3b8" font-size="9" text-anchor="middle">人 + agent 深度排查</text>

  <!-- ═══════════════ 区域 2：演化循环（右侧大区） ═══════════════ -->
  <rect x="600" y="80" width="540" height="560" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="614" y="98" fill="#34d399" font-size="10" font-weight="600">演化循环 · 每周 · git 门控</text>

  <!-- to-postmortem -->
  <rect x="624" y="112" width="490" height="50" rx="6" fill="#0f172a"/>
  <rect x="624" y="112" width="490" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="869" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">/skill:to-postmortem（任意来源：session / Kimi / 手工 / wiki）</text>
  <text x="869" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">提取 → 语义校验 → 脱敏 → postmortems/inbox/</text>

  <!-- inbox -->
  <rect x="624" y="196" width="490" height="50" rx="6" fill="#0f172a"/>
  <rect x="624" y="196" width="490" height="50" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="869" y="218" fill="white" font-size="11" font-weight="600" text-anchor="middle">postmortems/inbox/ 待审队列</text>
  <text x="869" y="234" fill="#94a3b8" font-size="9" text-anchor="middle">groom 周批处理 · 停留 >2 周标红</text>

  <!-- groom 预分诊 -->
  <rect x="624" y="280" width="490" height="76" rx="6" fill="#0f172a"/>
  <rect x="624" y="280" width="490" height="76" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="869" y="302" fill="white" font-size="11" font-weight="600" text-anchor="middle">/skill:knowledge-groom 周批审</text>
  <text x="869" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">预分诊三分类：new_pattern / variant_of / covered_by（建议+证据）</text>
  <text x="869" y="336" fill="#94a3b8" font-size="9" text-anchor="middle">人审 accept / adjust / reject · 高风险双签</text>

  <!-- PR 门控 -->
  <rect x="624" y="390" width="490" height="76" rx="6" fill="#0f172a"/>
  <rect x="624" y="390" width="490" height="76" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="869" y="412" fill="white" font-size="11" font-weight="600" text-anchor="middle">变更 PR（git 门控）</text>
  <text x="869" y="430" fill="#94a3b8" font-size="9" text-anchor="middle">kb/* 标签 · CODEOWNERS 审批 · 双签 · kb-checks CI</text>
  <text x="869" y="446" fill="#94a3b8" font-size="9" text-anchor="middle">（索引新鲜度 + YAML 解析硬门）</text>

  <!-- 知识库落地 -->
  <rect x="624" y="500" width="490" height="60" rx="6" fill="#0f172a"/>
  <rect x="624" y="500" width="490" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="869" y="522" fill="white" font-size="11" font-weight="600" text-anchor="middle">knowledge/ (framework × category 格子, ADR-0004)</text>
  <text x="869" y="538" fill="#94a3b8" font-size="9" text-anchor="middle">new → 升格格子 · variant → 并入扩 compat · covered → 转正 Tier 3</text>
  <text x="869" y="552" fill="#94a3b8" font-size="9" text-anchor="middle">索引随批重建 · soft_cap 30 / hard_cap 60</text>

  <!-- ═══════════════ 底部：反馈闭环（跨两区） ═══════════════ -->
  <rect x="30" y="680" width="1110" height="150" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="44" y="698" fill="#60a5fa" font-size="10" font-weight="600">反馈闭环 · 学习环发动机（trace → 反馈 → confidence → 指标）</text>

  <!-- 反馈框 -->
  <rect x="56" y="712" width="220" height="64" rx="6" fill="#0f172a"/>
  <rect x="56" y="712" width="220" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="166" y="734" fill="white" font-size="11" font-weight="600" text-anchor="middle">工程师回报结果</text>
  <text x="166" y="750" fill="#94a3b8" font-size="9" text-anchor="middle">解决 / 没解决 / 部分解决</text>
  <text x="166" y="764" fill="#94a3b8" font-size="9" text-anchor="middle">resume 启动时追问</text>

  <!-- confidence -->
  <rect x="340" y="712" width="220" height="64" rx="6" fill="#0f172a"/>
  <rect x="340" y="712" width="220" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="450" y="734" fill="white" font-size="11" font-weight="600" text-anchor="middle">confidence 回写</text>
  <text x="450" y="750" fill="#94a3b8" font-size="9" text-anchor="middle">hits+1 / misdiagnoses+1</text>
  <text x="450" y="764" fill="#94a3b8" font-size="9" text-anchor="middle">Beta 后验 → score 排序</text>

  <!-- trace -->
  <rect x="624" y="712" width="220" height="64" rx="6" fill="#0f172a"/>
  <rect x="624" y="712" width="220" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="734" y="734" fill="white" font-size="11" font-weight="600" text-anchor="middle">trace 落盘（本地）</text>
  <text x="734" y="750" fill="#94a3b8" font-size="9" text-anchor="middle">每步写 diagnosis_state-*.yaml</text>
  <text x="734" y="764" fill="#94a3b8" font-size="9" text-anchor="middle">误诊归因依据 · 词表校验</text>

  <!-- metrics -->
  <rect x="908" y="712" width="206" height="64" rx="6" fill="#0f172a"/>
  <rect x="908" y="712" width="206" height="64" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1011" y="734" fill="white" font-size="11" font-weight="600" text-anchor="middle">指标回流</text>
  <text x="1011" y="750" fill="#94a3b8" font-size="9" text-anchor="middle">trace_metrics → metrics.md</text>
  <text x="1011" y="764" fill="#94a3b8" font-size="9" text-anchor="middle">路由/反馈捕获/词表合规</text>

  <!-- ═══════════════ 连接线（诊断循环内） ═══════════════ -->
  <path d="M 206 140 L 296 140" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 268 168 L 268 212" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 268 266 L 268 296" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 268 386 L 268 410" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 268 448 L 268 482" fill="none" stroke="#fbbf24" stroke-width="1" marker-end="url(#arrow-amber)"/>
  <path d="M 224 482 L 146 482 L 146 524" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 312 482 L 390 482 L 390 524" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="172" y="476" fill="#94a3b8" font-size="8" text-anchor="middle">是</text>
  <text x="366" y="476" fill="#94a3b8" font-size="8" text-anchor="middle">否</text>

  <!-- ═══════════════ 连接线（演化循环内） ═══════════════ -->
  <path d="M 869 162 L 869 192" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 869 246 L 869 276" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 869 356 L 869 386" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 869 466 L 869 496" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- ═══════════════ 反馈闭环连接线 ═══════════════ -->
  <path d="M 146 590 L 146 708" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 276 744 L 336 744" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 560 744 L 620 744" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 844 744 L 904 744" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════ 学习闭环回线（知识库 → 下次诊断命中） ═══════════════ -->
  <path d="M 624 530 L 580 530 L 580 650 L 268 650 L 268 590" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-violet)"/>
  <text x="424" y="664" fill="#a78bfa" font-size="9" text-anchor="middle">学习闭环：升格后的 case → 下次诊断直接命中</text>

  <!-- 图例 -->
  <g transform="translate(850, 640)">
    <rect x="0" y="0" width="260" height="86" rx="8" fill="#0f172a" opacity="0.95"/>
    <rect x="0" y="0" width="260" height="86" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
    <text x="130" y="18" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">图例</text>
    <rect x="16" y="28" width="16" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="44" y="37" fill="#94a3b8" font-size="8">处理 / 服务（emerald）</text>
    <rect x="16" y="46" width="16" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="44" y="55" fill="#94a3b8" font-size="8">存储 / 知识（violet）</text>
    <rect x="16" y="64" width="16" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
    <text x="44" y="73" fill="#94a3b8" font-size="8">门控 / 审查（rose）</text>
  </g>
</svg>
