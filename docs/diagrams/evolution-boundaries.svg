<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">自演进信号、提案、实验、决策与落地边界</title>
  <desc id="desc">用户摩擦进入信号台账；确定性 bug 走回归测试与 PR；行为质量走 RSI proposal、真实实验、decision 与 PR；EV 卡只保留高风险授权和历史视图。</desc>
  <rect width="1100" height="360" fill="#f6f7f9"/>
  <text x="32" y="40" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#15181d">自演进边界</text>
  <text x="32" y="64" font-family="PingFang SC, sans-serif" font-size="12" fill="#69707c">signal 只记录；proposal 才承诺改；experiment 才提供统计证据；PR 才落地。</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#69707c"/></marker></defs>
  <g font-family="PingFang SC, sans-serif">
    <rect x="32" y="100" width="180" height="84" rx="12" fill="#fff" stroke="#cfd5df"/>
    <text x="48" y="126" font-size="12" fill="#69707c">输入</text>
    <text x="48" y="150" font-size="15" font-weight="700" fill="#15181d">信号 / 摩擦</text>
    <text x="48" y="170" font-size="11" fill="#69707c">proposals/signals</text>

    <rect x="252" y="76" width="190" height="76" rx="12" fill="#fff" stroke="#cfd5df"/>
    <text x="268" y="102" font-size="12" fill="#69707c">确定性</text>
    <text x="268" y="126" font-size="15" font-weight="700" fill="#15181d">代码 bug</text>
    <text x="268" y="144" font-size="11" fill="#69707c">回归测试 + PR</text>

    <rect x="252" y="188" width="190" height="84" rx="12" fill="#fff" stroke="#cfd5df"/>
    <text x="268" y="214" font-size="12" fill="#69707c">行为质量</text>
    <text x="268" y="238" font-size="15" font-weight="700" fill="#15181d">RSI proposal</text>
    <text x="268" y="258" font-size="11" fill="#69707c">假设 / measure / risk</text>

    <rect x="482" y="188" width="190" height="84" rx="12" fill="#fff" stroke="#cfd5df"/>
    <text x="498" y="214" font-size="12" fill="#69707c">同一批真实样本</text>
    <text x="498" y="238" font-size="15" font-weight="700" fill="#15181d">experiment</text>
    <text x="498" y="258" font-size="11" fill="#69707c">baseline / candidate</text>

    <rect x="712" y="188" width="160" height="84" rx="12" fill="#fff" stroke="#cfd5df"/>
    <text x="728" y="214" font-size="12" fill="#69707c">gate</text>
    <text x="728" y="238" font-size="15" font-weight="700" fill="#15181d">decision</text>
    <text x="728" y="258" font-size="11" fill="#69707c">accept / reject / insufficient</text>

    <rect x="912" y="188" width="150" height="84" rx="12" fill="#fff" stroke="#cfd5df"/>
    <text x="928" y="214" font-size="12" fill="#69707c">真正落地</text>
    <text x="928" y="238" font-size="15" font-weight="700" fill="#15181d">PR</text>
    <text x="928" y="258" font-size="11" fill="#69707c">人审 / 合并</text>

    <rect x="482" y="96" width="380" height="60" rx="12" fill="#fef7e6" stroke="#e8c97a"/>
    <text x="498" y="120" font-size="12" fill="#8a6116">高风险授权 / 历史视图</text>
    <text x="498" y="140" font-size="14" font-weight="700" fill="#8a6116">EV 卡：只记录决策，不替代实验或 PR</text>

    <path d="M212 142 C232 142 232 114 252 114" stroke="#69707c" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <path d="M212 152 C232 152 232 225 252 225" stroke="#69707c" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <path d="M442 230 L482 230" stroke="#69707c" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <path d="M672 230 L712 230" stroke="#69707c" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <path d="M872 230 L912 230" stroke="#69707c" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <path d="M577 188 L577 156" stroke="#b0882e" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
  </g>
</svg>
