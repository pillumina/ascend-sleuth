name: kb-checks

# 触发分两层：
#   ① 下面 workflow 级 `paths:` = **粗网**，决定这次 push/PR 要不要起这个 workflow。
#      它是目录 glob，不是逐文件清单——旧清单逐个列了 35 个 scripts/*.py|js，实测漏掉 37 个
#      （改那些脚本 CI 完全不跑），且每加一个脚本要记得来两处补名字（维护成本随文件数线性上涨）。
#   ② `changes` job = **细网**，算出这次改了哪一面，各 job 用 `if:` 自取所需。
# 两个事件的触发面不同：`push` 只在 `main` 上起，`pull_request` 在改了下列 `paths` 的 PR 上起。
# 开发分支的推送不再单独起一轮——PR 事件以主干为基线算改动，文件清单准确。改前这些推送会另起一轮：
# 新建分支首次推送退化成全量，其后每次推送只是把 PR 那轮的大部分 job 重跑一遍（其中 `unit-tests` 是 wall clock
# 最长的一条）。`main` 的 push 必须留：PR 验的是当次合并预演（`refs/pull/N/merge`），主干前进后最终
# 合入的树没有别处验。收窄 `push` 的代价是未开 PR 时推送没有任何 CI。
# 为什么不拆成多个 workflow 文件：被 `paths:` 过滤掉的 workflow 根本不上报 check，将来开分支
# 保护会让 PR 永远等一个不会出现的 Expected。单文件 + job 级 `if:` 下，跳过的 job 照常上报 skipped。
on:
  push:
    branches: [main]
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "proposals/**", "eval/**", "tests/**", "docs/**", "README.md", ".gitattributes", "triage-tree.yaml", "triage-tree.d/**", "dsh-plugins/**", "scripts/**", "trace-status.yaml", "deployment.yaml", ".github/workflows/**", ".github/actions/**"]
  pull_request:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "proposals/**", "eval/**", "tests/**", "docs/**", "README.md", ".gitattributes", "triage-tree.yaml", "triage-tree.d/**", "dsh-plugins/**", "scripts/**", "trace-status.yaml", "deployment.yaml", ".github/workflows/**", ".github/actions/**"]

jobs:
  # ── 细网：这次改了哪一面 ──────────────────────────────────────────────────────
  # GitHub 只支持 workflow 级 `paths:`，不支持 job 级，所以粗网一命中就会把下面全部 job 拉起来。一轮
  # PR 的 wall clock 大头在 unit-tests——只改 docs 的 PR 也在付它。本 job 把「改了哪一面」算成一组
  # 布尔量供各 job 取用。
  #
  # 各 job 的触发面 = 它的命令**真正读了**哪些目录（逐条按脚本里的路径字面量核过）。按"读了就
  # 触发"取，不按"断言强不强"取，宁可多跑：
  #   index-freshness      ← knowledge（triage-tree* 归在 knowledge 组里）、code
  #   case-structure       ← knowledge、references（verify_case_draft 建 references 索引校验 ref_knowledge）、code
  #   reference-validation ← references、knowledge（解析全部 case 算派生计数）、skills（*-gates.yaml 绑定）、code
  #   metrics-validation   ← metrics、code
  #   proposal-audit       ← proposals、code
  #   docs-index           ← docs（含 README；skill 名单取自 docs/_manifest.yaml，不扫 skills/）、code
  #   holdout-integrity    ← eval、code
  #   eval-scorecard       ← eval、knowledge（case↔夹具的负载类型覆盖算在 case 上）、code
  #   unit-tests           ← scripts、tests
  #   panel-checks         ← dsh-plugins、scripts、metrics、skills、docs、trace-status.yaml
  #   skill-self-contained ← skills（只 grep skills/，不执行脚本，故不吃 code）
  #   arena-gate-rule      ← scripts（跑的是 --self-test，用合成样本）
  #
  # 独立预核实测出的两处洞（已修，见对应 job 的 if）：
  #   · 8 个 verification job 都吃 code：它们的判定就是「跑一遍 scripts/<x>.py」。改了脚本本身而不跑
  #     那道门，等于改坏了验证脚本没人验（实测：往 scripts/verify_references.py 注入脚本级故障，改前
  #     跑 reference-validation 并置红，只按目录细分后就只剩 unit-tests，而 tests/ 没有一条覆盖它）。
  #     代价：改 scripts/ 的 PR 仍会跑多数 job（与改前只差 skill-self-contained，它只读 skills/），
  #     换到的是 docs / knowledge / skills 类 PR 免付。
  #   · panel-checks 吃 docs 与 trace-status.yaml 的实测反例见下。
  #
  # 强度让步（如实写在这里，评审一眼可见）：
  #   · unit-tests 只按 scripts/tests 触发。它确有 4 个模块读仓库内容（test_trace_metrics 读
  #     knowledge/_index.yaml、test_build_triage_tree 读 triage-tree*、test_concurrent_submit
  #     copytree knowledge/、test_generated_plane 跑生成器），但那几面的**口径与新鲜度**由
  #     index-freshness / case-structure 兜底，所以只改 knowledge/ 的 PR 不再付 unit-tests 这轮最长 job 的代价。
  #     要更保守：把 knowledge 也加进它（代价是内容 PR 继续付满）。
  #   · panel-checks 不算 knowledge：panel_render_check.js 读 knowledge/ 只做「索引非空、case
  #     文件非空」两条 >0 断言，新鲜度由 index-freshness 管。
  #   · panel-checks 吃 docs 与 trace-status.yaml：它读 docs/spec/writing-norms.md 并断言「文案共用
  #     条目归唯一权威处」（脚本 2627 行附近）——抽掉该文件的条目表这道门会红（rc=1），而 docs-index
  #     不兜底（rc=0）；trace-status.yaml 是它校验 status/outcome 词表的唯一数据源（脚本 1478 行），
  #     而粗网此前两条 paths 都没有它，改它 CI 根本不跑。
  #   · panel-checks 还经 metrics_health.py --check → verify_references.py 读到 references/（删掉
  #     references/env-vars 时 metrics_health rc 1→2，会翻 panel_render_check.js 的 status===1 断言），
  #     但门组不含 references——这一层由 reference-validation 兜住（同一输入它必红），无静默放行。
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
      knowledge: ${{ steps.diff.outputs.knowledge }}
      references: ${{ steps.diff.outputs.references }}
      metrics: ${{ steps.diff.outputs.metrics }}
      proposals: ${{ steps.diff.outputs.proposals }}
      eval: ${{ steps.diff.outputs.eval }}
      skills: ${{ steps.diff.outputs.skills }}
      code: ${{ steps.diff.outputs.code }}
      panels: ${{ steps.diff.outputs.panels }}
    steps:
      # fetch-depth: 0 供三点 diff 用：`A...B` 要 merge-base，浅克隆取不到会让 diff 静默为空、
      # 所有组判 false、全部 job 全被跳过——那是最坏的失败形态（全绿而什么都没跑）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # 本地复跑（scripts/rehearse_evolve_loop.py 的 E6）没有 GITHUB_OUTPUT、没有 .git、也没有
          # BASE_REF/BEFORE：那时取不到基线，按下行"全量"处理并如实打印，不静默跳过任何 job。
          OUT="/dev/null"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then OUT="$GITHUB_OUTPUT"; fi
          base=""
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            if git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
              base="origin/$BASE_REF...HEAD"
            fi
          fi
          if [ -z "$base" ] && [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse --verify --quiet "$BEFORE" >/dev/null; then
            base="$BEFORE..HEAD"
          fi
          all=false
          if [ -z "$base" ]; then
            echo "取不到比对基线（本地复跑 / 新分支首次推送 / 无 .git 的副本）——按全量处理（宁可全跑，不可漏跑）"
            all=true
            changed=$(git -c core.quotePath=false ls-files 2>/dev/null || true)
          else
            echo "比对基线：$base"
            # 取得到基线名 ≠ 取得到可比对的内容：孤儿分支、与基线无 merge base 的推送会让 git diff
            # 直接失败。失败必须走全量，不能吞成「零改动」——那正是「宁可全跑，不可漏跑」的反面。
            if ! changed=$(git -c core.quotePath=false diff --name-only "$base"); then
              echo "与基线比不了（无 merge base 等）——按全量处理（宁可全跑，不可漏跑）"
              all=true
              changed=$(git -c core.quotePath=false ls-files 2>/dev/null || true)
            fi
          fi
          if printf '%s\n' "$changed" | grep -qE '^\.github/(workflows|actions)/'; then
            echo "本工作流或共用 action 自身有改动——全部 job 复验"
            all=true
          fi
          echo "改动文件："
          printf '%s\n' "$changed" | sed -e '/^$/d' -e 's/^/  /'
          emit() {
            name="$1"; pat="$2"; v=false
            if [ "$all" = true ] || printf '%s\n' "$changed" | grep -qE "$pat"; then v=true; fi
            echo "$name=$v" >> "$OUT"
          }
          emit docs       '^docs/|^README\.md$'
          emit knowledge  '^knowledge/|^triage-tree\.yaml$|^triage-tree\.d/|^\.gitattributes$'
          emit references '^references/'
          emit metrics    '^metrics/'
          emit proposals  '^proposals/'
          emit eval       '^eval/'
          emit skills     '^skills/'
          emit code       '^scripts/|^tests/'
          emit panels     '^dsh-plugins/|^trace-status\.yaml$'

  # 生成物守卫：PR 不得手改生成物。生成物由合入后的 rebuild-generated job 写。
  # 不依赖生成器能否跑通，是提交面的判据；放在最前面，红得早、报错直接给还原命令。
  generated-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: reject hand-edited generated files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_generated_untouched.py --base "origin/$BASE_REF"

  index-freshness:
    needs: changes
    # `metrics` 也进：索引行的 `score` 由 `score_entries.py` 从条目使用记录的生成物算出来，
    # 只追加记录、不重建索引的 PR 会让索引过期。现在 PR 不再提交索引，这里先生成再检查。
    if: needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.metrics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # 生成物由合入后的 rebuild-generated job 维护；PR 只交源文件，所以先在本工作树里生成，
      # 后续检查读到的是"这棵树能产出的索引"，不是提交面上那份可能已旧的索引。
      - uses: ./.github/actions/rebuild-generated
      # 覆盖检查仍然保留：它验证生成器能从这棵树产出齐全的索引（每条 case 的行都在、与内容对得上），
      # 不是要求提交面与重新生成逐字节相同。数字（条数/容量/日期）不进生成物，要数字现算。
      - run: python3 scripts/build_index.py --check
      # triage-tree 语法检查：曾因 pipe-or 写法长期不可解析而无人发现（原则二教训），
      # 结构化工具化（路由统计/学习型路由）前必须堵住。
      - run: python3 -c "import yaml; yaml.safe_load(open('triage-tree.yaml')); print('triage-tree ok')"
      # Tier 1 路由：源文件校验（分支 id 唯一 / category 合法 / 症状组形态 / ≤30 分支 / 一族一文件）
      # + 覆盖检查（源里每条症状组都在聚合里）。聚合由主干 job 重建；PR 上先生成再校验。
      - run: python3 scripts/build_triage_tree.py --check-sources
      - run: python3 scripts/build_triage_tree.py --check-coverage

  case-structure:
    needs: changes
    if: needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.references == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # case 结构与字段值的确定性判据。为什么单列一个 job：`build_index` 只保证
      # **能解析**，字段是否合法它不看——`fix_type: upgrade`（schema 无此值，出现在
      # 4 个 PR 的 5 个 case 里，`git log -S` 追溯无任何卡讨论过扩枚举）就这么静默存活；
      # 草稿在 inbox 期间更没有任何门（那时它还进不了 knowledge/，CI 解析不到）。
      # 本 job 把它变成硬门：必需字段 / 三个枚举 / `ref_knowledge` 悬挂与 active 校验 /
      # `expected` 的 regex 可编译且无空分支（空分支恒真，会让该 case 对任何输入都成为候选）。
      # 准入判据（机械可判 + 确定性后果 + 复发）：三类都满足。
      - run: python3 scripts/verify_case_draft.py --all
      # `score_override` 的判据：字段只有一个可选用途——人工覆盖排序分数，而覆盖必须带理由
      # （不带 reason 的覆盖在半年后无法判断该不该撤）。它不进 `verify_case_draft`：
      # 那个脚本判的是「必需字段与枚举」，这一条判的是「可选字段填了就得填对」。
      - run: python3 scripts/score_entries.py --check-overrides

  reference-validation:
    needs: changes
    if: needs.changes.outputs.references == 'true' || needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.skills == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # reference 索引也由主干 job 维护；PR 只交 references/ 源文件。先生成，再跑两类校验：
      # 一条问"词条本身合法吗"（verify_references），其余问"从这棵树能产出齐全的索引吗"。
      - uses: ./.github/actions/rebuild-generated
      # reference 层入口门槛比 case 更严（先验知识框架 ADR §8）：
      # 基础元信息 + 已登记 type + 按来源类型子字段 + 深审（case-derived methodology
      # 派生引用数 <3 不允许 active）。脚本解析全部 case YAML 计算派生计数，语法错即红。
      - run: python3 scripts/verify_references.py --check
      # 背景类 summary 索引：生成器能从当前 references/ 生成即可；生成物由主干 job 提交。
      - run: python3 scripts/build_ref_summary_index.py --check
      # 流程选择器索引：methodology 不进背景层，走独立索引；同上，PR 不再要求提交生成物。
      - run: python3 scripts/build_procedure_index.py --check
      # 错误码缺口索引：故障模式表里出现、而错误表没有行的码——那是"错误表未命中"时的
      # 唯一跳板。漂移会让跳板指向一个不存在的条目，而读侧无从分辨"库里没有"与"跳板坏了"。
      - run: python3 scripts/build_error_gap_index.py --check

  metrics-validation:
    needs: changes
    # `knowledge` / `references` 也进：条目使用记录的生成物里有 `cold` 与
    # `cold_never_looked_up` 两个现算自库的字段（`entry_activity.library_inventory()`），
    # 加一条 case 或词条会改变它。本 job 先调重建 action 再校验，读到的是这棵树的产物。
    if: needs.changes.outputs.metrics == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.references == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # 本 job 读 knowledge/_index.yaml（条目使用记录里的库清单）。PR 不再提交索引，
      # 所以先生成，避免读到旧条目数。
      - uses: ./.github/actions/rebuild-generated
      # metrics 时序数据结构校验（教训：W28/W35 字段格式漂移导致跨期不可比、趋势不可算）：
      # period 唯一 / kind 合法 / recorded_at 必填 / 比例字段 ok,total 合法 / live 期号命名。结构由 CI 兜底。
      - run: python3 scripts/verify_metrics.py --check
      # timeline.yaml 是生成物（源 = metrics/timeline.d/<期号>.yaml）。提交面由 generated-guard
      # 与主干 job 管；这里 `--check` 验的是生成器能从源产出一致产物，不负责抓"忘重建"。
      - run: python3 scripts/build_timeline.py --check
      # 条目使用记录：源（metrics/entry-activity.d/，一周一个文件、一行一条）与生成物
      # （metrics/entry-activity/<部署>.yaml）两层。两条判据分工明确——
      # `--check` 验「生成器与源一致」，`verify_entry_activity` 验「源本身合法」
      # （行形状 / (run,kind,id) 唯一 / id 在知识库里查得到 / run 与文件名归周一致 / 部署名一致）。
      # 只跑前者会把「源写错了但生成物忠实照搬」判绿。
      - run: python3 scripts/verify_entry_activity.py
      - run: python3 scripts/build_entry_activity.py --check

  proposal-audit:
    needs: changes
    if: needs.changes.outputs.proposals == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 倒填检测要能 diff 到 PR 基线；浅克隆拿不到基线提交
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # EV 卡是自演进的知识资产（随 PR 进出，同 knowledge/ 纪律），但此前 CI 从未校验过它——
      # 触发路径不含 proposals/**，"schema 由 verify_proposals CI 校验"（proposals/README.md）
      # 是纸面承诺（2026-09-10 审计）。本 job 把承诺变成硬门：卡结构 + 生命周期完整性
      # （终态卡缺 decision / validated 缺成本 / 在实验卡执行完未推进 / 僵尸卡 / 出处缺失）。
      - run: python3 scripts/verify_proposals.py --check --base "${{ github.event.pull_request.base.sha }}"
      # 注意：verify_exec_log.py **不进 CI**——exec-log（metrics/skill-exec-log.yaml）是
      # .gitignore 运行时件，CI checkout 里不存在，跑它只会打印"跳过"并空转。
      # 该不变量改由 evolve-check 收尾自查（skills/evolve-check 第 4 步）。

  # 人读面的名字与数字（docs/_manifest.yaml → README 区块）。为什么值得一道硬门：
  # "skill 共几个""有哪些文档"这类事实原先手写在多处，实测已漂移（术语表曾写"共九个"
  # 而实际十个；文档目录 17 条平铺，读者看不出该读哪篇）。数字没有理由手写——
  # 生成物与清单不一致即红；**docs/ 下出现未登记的文档也即红**（漏登记比数字写错更难发现）。
  docs-index:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/build_docs_index.py --check

  # 封存对照集（holdout）：eval/golden/ 里由维护者独占的那部分。理由见 scripts/holdout.py
  # 头注——golden 在改动者可写面内且 groom 被要求跟着 case 改夹具，所以"无回归"是可
  # 控信号；封存后改内容必红，要合法改就得维护者 reseal 并在 PR 上留下标签。
  holdout-integrity:
    needs: changes
    if: needs.changes.outputs.eval == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 供下一步的 diff 用（label 闸门要知道 PR 改没改对照集）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ① 硬门：封存夹具内容被改动即红（哈希就是判据，不需要看 diff）
      - run: python3 scripts/holdout.py --check
      # ② 半硬：改对照集须带 holdout-change 标签，让"改量尺"在评审面上可见。
      #    强度如实标注：标签闸门由本步强制，但在 CODEOWNERS/分支保护落实前，有写权限者
      #    仍可自行打标签——真正的独立性随 CODEOWNERS 到位（见 CODEOWNERS.example）。
      #    本地复跑（演练 E6）无 GITHUB_BASE_REF，走"跳过"分支并 exit 0，不误红。
      - name: holdout 对照集变更须带 holdout-change 标签
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "非 PR 环境（本地复跑 / push）——跳过标签闸门"
            exit 0
          fi
          # 不能 shallow fetch：三点 diff（A...B）需要 merge-base，取不到时 diff 会
          # 静默为空 → 闸门形同虚设。checkout 已 fetch-depth: 0，这里做完整 fetch。
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "取不到 origin/$BASE_REF——无法判定是否改动对照集，按缺标签处理（宁可要人看一眼）"
            exit 1
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- eval/holdout.yaml || true)
          if [ -z "$changed" ]; then
            echo "未改动 eval/holdout.yaml——无需标签"
            exit 0
          fi
          case ",$LABELS," in
            *,holdout-change,*) echo "eval/holdout.yaml 已改动，且带 holdout-change 标签 ✓" ;;
            *) echo "eval/holdout.yaml 已改动但缺 holdout-change 标签——改量尺必须在评审面上可见"; exit 1 ;;
          esac

  # 回放观测账本：`eval/scorecard.yaml` 记「上次回放观测到什么」。此前这些观测只写在
  # fixture 头注散文里（22/24 条），完整报告落 gitignore 的 eval-reports/——于是「夹具改了
  # 没重跑」与「跑过了、结果就是这样」在数据上不可区分，仓库里也没有「当前命中构成」这个数。
  # 准入判据（CLAUDE.md）：①机械可判、②确定性后果成立；③复发——本条**没有本产物的历史
  # 失败**（账本此前不存在），入 CI 的依据是同类「生成物新鲜度」门的先例（index-freshness /
  # docs-index / metrics-validation / holdout-integrity 四道）与修法成本：账本过期由
  # `--build` 一条自动命令修（不需重跑回放），误红代价≈10 秒。评审若认为该按第三条严格执行，
  # 把它退回成 groom 收尾自查即可（卡 EV-2026-107 记了这条判断）。
  # 强度如实标注：**本门不判准确率**——账本记的是上次观测，不是现在能不能命中；
  # 准确率仍要 agent 跑回放（docs/guide/eval.md 门禁分级），不把不确定的东西硬门化。
  eval-scorecard:
    needs: changes
    if: needs.changes.outputs.eval == 'true' || needs.changes.outputs.knowledge == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # `eval_scorecard.py` 从 knowledge/_index.yaml 取目标 case 的内容哈希；PR 不再提交索引，
      # 先生成，否则软信号会对着旧哈希判"待复核"。
      - uses: ./.github/actions/rebuild-generated
      # fixture 字节哈希对不上 = 夹具改过而账本没跟着重建（真红）；
      # 目标 case 内容变了只进「待复核」清单不红（case 的合法变更不该阻塞无关 PR）。
      - run: python3 scripts/eval_scorecard.py --check
      # 按负载类型覆盖：路由分负载类型之后，负载类型是量尺单位——训练侧曾在 22 条 case 上 0 条夹具。
      # **两层判据、两个开关各管一层**（`scripts/eval_workload_type_coverage.py` 头注有完整口径）：
      #   `--check`      负载类型层：某一负载类型一条真实夹具都不剩 → 红（本行跑的就是这一层）
      #   `--check-cells` 格层：某个 (负载类型 × 性质) 格子有 case 没夹具 → 红（**本行故意不加**）
      # 格层默认不做成门是取舍：本仓对这类缺口的既定动作是**如实报出**（同 `holdout.py --list`
      # 对空缺格子的处理），补夹具需要真实来源、凭空造不出来；做成门等于要求"新 case 落到
      # 尚无夹具的格子必须先补一条夹具"，而那时确实拿不出。代价写清：格级缺口与"某格的非最后
      # 一条夹具被删"不会自动喊，只在有人主动跑报告时可见。要那一层保护就在本行加 `--check-cells`。
      # **另：它钉的是覆盖（有没有夹具），不是保护强度**——实测 26 条夹具里 16 条的输入对三个
      # 性质的正则零命中（靠流程写明的语义兜底），改坏词表它们照样通过；哪几条真钉着词表，
      # 用 `python3 scripts/eval_workload_type_coverage.py --nature-evidence` 现算现看（不进 CI 结论）。
      - run: python3 scripts/eval_workload_type_coverage.py --check --require-workload-type training --require-workload-type inference

  # 口径脚本的单元测试：既有 12 个 --check 卡口验的是「仓库自洽」（索引新鲜、schema 合法、
  # id 唯一、生成物一致），不验「算得对」——build_index / trace_metrics / settle_trace_feedback /
  # build_timeline 的口径写错时，CI 全绿、而面板读数与 case 置信度静默报错数。
  # 首建即发现一处真实缺陷：settle 在事件序列变化时整段重放旧事件 → hits 重复计数
  # （测试里以 known_defect 断言钉住现状，修复需单独产卡——本 job 只保证口径不再无声漂移）。
  # 准入判据（CLAUDE.md）：①机械可判 ②确定性后果（纯 stdlib + PyYAML，不联网、不读真实 traces/）
  # ③复发：本套件无历史失败记录，入 CI 依据同类门先例与「口径错了没人知道」的代价，
  # EV-2026-108 记了这条判断；评审若按第三条严格执行，退回成收尾自查即可。
  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # 有测试读 knowledge/_index.yaml 与 triage-tree.yaml（口径断言）；PR 不再提交生成物，
      # 先生成，测试读到的是这棵树的实际产物。
      - uses: ./.github/actions/rebuild-generated
      - run: python3 -m unittest discover tests

  # 面板：两个面板的渲染、文案、色语与数据口径契约都由 `panel_render_check` 与
  # `check_panel_tokens` 守着，但这两个脚本**此前不在任何 CI 里**（paths 不含 dsh-plugins/**），
  # 只能靠人记得跑。代价实测过两次：`metrics/timeline.yaml` 的期次解析器与真实文件结构不符
  # （文件里 8 期、面板读出 0 期）与 trace 解析器把 9 条事件读成 1 条，都是漏到用户面前才发现的；
  # 另外在 CI 形态的干净检出里（无 traces/、无 exec-log）整套检查本来就是红的——一条断言在文案
  # 重写后留在旧措辞上，而那条分支只在"没有 exec-log"的检出里跑，开发机上永远走不到。
  # 准入判据（机械可判 + 确定性后果 + 复发 ≥2 次）：三条都满足。
  panel-checks:
    needs: changes
    if: needs.changes.outputs.panels == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.metrics == 'true' || needs.changes.outputs.skills == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 渲染检查要用 node 跑面板两半的源码；面板本身零依赖，不必装包。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyyaml
      # `panel_render_check.js` 读 knowledge/_index.yaml；PR 不再提交索引，先生成再渲染检查。
      - uses: ./.github/actions/rebuild-generated
      - run: python3 scripts/check_panel_tokens.py
      # 真实 trace 的对照走主检出那一份（`scripts/shared_dir.py traces`）；CI 检出里没有
      # traces/（gitignore 运行时件），脚本会如实打印跳过，只跑形状夹具。
      - run: node scripts/panel_render_check.js
      # 面板包（新版 DSH 的常驻插件包）：产物与源文件一致 + 可加载性冒烟 + DSH 接缝探针。
      # 前者防"改了面板源码没重跑生成器"；中者用 stub ctx 原样加载两个产物，把"装进 profile
      # 后重启才发现 tab 不在"提前到本地秒级；后者判本机 DSH 走哪条装载路并核对五处接缝，
      # CI 里没有 DSH，会如实跳过（退 0），所以下面那条自测用临时假 DSH。
      - run: node scripts/build_panel_bundle.js --check
      - run: node scripts/check_panel_bundle.js
      - run: node scripts/check_panel_bundle.js --selftest-dsh
      # RPC 探针自测：自带假服务器把五条判定各走一遍（正常 / 信封不合法 / 处理函数报错 /
      # 面板侧降级 / 路由没在服务），不需要真 DSH；真机那一次要 DSH 在跑，不进 CI。
      - run: node scripts/panel_rpc_probe.js --selftest
      # 装包脚本自测：自带假服务器把八条判定各走一遍（装好 / 已装改使能 / spec 被拒 / 安装失败 /
      # 查状态 / 卸载 / /api 没认领端点 / 拿不到地址），不需要真 DSH；真机那一次要 DSH 在跑，不进 CI。
      - run: node scripts/panel_install.js --selftest
      # vllm-kb 接入插件的离线自测：配置归一化与读写、repo#编号→source_id、四个能力的请求形状、
      # 输出截断、5xx 映射、可用性三态与缓存，以及配置路由的鉴权/解析/探测/404。
      # 全部打桩（进程内假服务替代真接口），不需要 DSH，也不需要内网实例；真机那一次按插件 README 走。
      - run: node scripts/check_vllm_kb.js

  skill-self-contained:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # skill 自包含（卫生检查）：skill 文件不得引用 ADR 编号——ADR 会被修订/吸收，
      # 编号锚定让 skill 行为看起来由外部文档间接定义；行为规则必须内联。
      # 准入判据（可机械判定 + 易复发 + 确定性后果）：属文档卫生类，一行 grep 足够。
      - run: |
          hits=$(grep -rn 'ADR-[0-9][0-9][0-9][0-9]' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含 ADR 编号锚定（skill 必须自包含，行为规则内联）："
            echo "$hits"
            exit 1
          fi
          echo "skill 自包含 OK（零 ADR 编号引用）"
      # 外部锚卫生（与 ADR 编号同一类，同一条判据）：skill 里只写行为规则与依据，
      # 溯源归 git / PR / EV 卡——日期记录的是"某次会话的观测时点"，读起来像事实；
      # EV 卡号会随卡被修订/supersede 而失真；两者都会让 skill 行为看起来由外部记录定义。
      # 要写"为什么"，就把依据内联成一句话（或让 commit/卡承载）。
      # 只在 skills/ 上判——docs/ 与 proposals/ 里的日期与卡号正是溯源该待的地方。
      - run: |
          hits=$(grep -rnE '20[0-9]{2}-[0-9]{2}|EV-[0-9]{4}-[0-9]{3}' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含外部锚（日期 / EV 卡号）——行为规则须内联，溯源归 git/PR/卡："
            echo "$hits"
            exit 1
          fi
          echo "skill 外部锚卫生 OK（零日期 / 零 EV 卡号锚）"

  # 门控判据自身的牙齿：接受判词（配对 + 复用折减 + 无回归）用合成样本复现三态。
  # 为什么值得一道硬门：判据是"数据门槛"，若它只会判 accept，门控等于没有——而判词
  # 逻辑写在脚本里，改坏了没有任何信号（arena 的池与账本都是本地运行件，CI 里不存在，
  # 所以能进 CI 的只有判据本身）。准入判据（机械可判 + 确定性后果 + 复发）三条都满足。
  arena-gate-rule:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/eval_arena.py --self-test

