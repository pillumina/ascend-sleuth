name: kb-checks

on:
  push:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "proposals/**", "eval/**", "docs/**", "README.md", "triage-tree.yaml", "scripts/build_index.py", "scripts/verify_references.py", "scripts/verify_metrics.py", "scripts/build_timeline.py", "scripts/verify_proposals.py", "scripts/build_ref_summary_index.py", "scripts/build_procedure_index.py", "scripts/holdout.py", "scripts/build_docs_index.py"]
  pull_request:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "proposals/**", "eval/**", "docs/**", "README.md", "triage-tree.yaml", "scripts/build_index.py", "scripts/verify_references.py", "scripts/verify_metrics.py", "scripts/build_timeline.py", "scripts/verify_proposals.py", "scripts/build_ref_summary_index.py", "scripts/build_procedure_index.py", "scripts/holdout.py", "scripts/build_docs_index.py"]

jobs:
  index-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # 两道检查合一：build_index 会解析全部 case YAML（语法错即红），
      # --check 校验 _index.yaml 与文件 hash 一致（改了 case 忘重建即红）。
      - run: python3 scripts/build_index.py --check
      # triage-tree 语法检查：曾因 pipe-or 写法长期不可解析而无人发现（原则二教训），
      # 结构化工具化（路由统计/学习型路由）前必须堵住。
      - run: python3 -c "import yaml; yaml.safe_load(open('triage-tree.yaml')); print('triage-tree ok')"

  reference-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # reference 层入口门槛比 case 更严（先验知识框架 ADR §8）：
      # 基础元信息 + 已登记 type + 按来源类型子字段 + 深审（case-derived methodology
      # 派生引用数 <3 不允许 active）。脚本解析全部 case YAML 计算派生计数，语法错即红。
      - run: python3 scripts/verify_references.py --check
      # 背景类 summary 索引新鲜度（B1 EV-2026-026）：references 变更未重建即红
      - run: python3 scripts/build_ref_summary_index.py --check
      # 流程选择器索引新鲜度（B2 EV-2026-038）：methodology 不进背景层，走独立索引；
      # references/ 变更未重建即红（与背景索引同待遇）。
      - run: python3 scripts/build_procedure_index.py --check

  metrics-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # metrics 时序数据结构校验（教训：W28/W35 字段格式漂移导致跨期不可比、趋势不可算）：
      # period 唯一 / kind 合法 / recorded_at 必填 / 比例字段 ok,total 合法 / live 期号命名。结构由 CI 兜底。
      - run: python3 scripts/verify_metrics.py --check
      # 生成物与源一致（源 = metrics/timeline.d/<期号>.yaml，一期一个文件）。
      # 为什么需要这道门：timeline.yaml 是**生成物**，两人各写各的源文件才不撞；但若谁直接改了
      # 生成物（或改了源忘记重建），读者会拿到一份与源不符的时序数据——必须红，且报错要给出"重跑一次"的修法。
      - run: python3 scripts/build_timeline.py --check

  proposal-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # EV 卡是自演进的知识资产（随 PR 进出，同 knowledge/ 纪律），但此前 CI 从未校验过它——
      # 触发路径不含 proposals/**，"schema 由 verify_proposals CI 校验"（proposals/README.md）
      # 是纸面承诺（2026-09-10 审计）。本 job 把承诺变成硬门：卡结构 + 生命周期完整性
      # （终态卡缺 decision / validated 缺成本 / 在实验卡执行完未推进 / 僵尸卡 / 出处缺失）。
      - run: python3 scripts/verify_proposals.py --check
      # 注意：verify_exec_log.py **不进 CI**——exec-log（metrics/skill-exec-log.yaml）是
      # .gitignore 运行时件，CI checkout 里不存在，跑它只会打印"跳过"并空转。
      # 该不变量改由 evolve-check 收尾自查（skills/evolve-check 第 4 步）。

  # 人读面的名字与数字（docs/_manifest.yaml → README 区块）。为什么值得一道硬门：
  # "skill 共几个""有哪些文档"这类事实原先手写在多处，实测已漂移（术语表曾写"共九个"
  # 而实际十个；文档目录 17 条平铺，读者看不出该读哪篇）。数字没有理由手写——
  # 生成物与清单不一致即红；**docs/ 下出现未登记的文档也即红**（漏登记比数字写错更难发现）。
  docs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/build_docs_index.py --check

  # 封存对照集（holdout）：eval/golden/ 里由维护者独占的那部分。理由见 scripts/holdout.py
  # 头注——golden 在改动者可写面内且 groom 被要求跟着 case 改夹具，所以"无回归"是可
  # 控信号；封存后改内容必红，要合法改就得维护者 reseal 并在 PR 上留下标签。
  holdout-integrity:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 供下一步的 diff 用（label 闸门要知道 PR 改没改对照集）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ① 硬门：封存夹具内容被改动即红（哈希就是判据，不需要看 diff）
      - run: python3 scripts/holdout.py --check
      # ② 半硬：改对照集须带 holdout-change 标签，让"改量尺"在评审面上可见。
      #    强度如实标注：标签闸门由本步强制，但在 CODEOWNERS/分支保护落实前，有写权限者
      #    仍可自行打标签——真正的独立性随 CODEOWNERS 到位（见 CODEOWNERS.example）。
      #    本地复跑（演练 E6）无 GITHUB_BASE_REF，走"跳过"分支并 exit 0，不误红。
      - name: holdout 对照集变更须带 holdout-change 标签
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "非 PR 环境（本地复跑 / push）——跳过标签闸门"
            exit 0
          fi
          # 不能 shallow fetch：三点 diff（A...B）需要 merge-base，取不到时 diff 会
          # 静默为空 → 闸门形同虚设。checkout 已 fetch-depth: 0，这里做完整 fetch。
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "取不到 origin/$BASE_REF——无法判定是否改动对照集，按缺标签处理（宁可要人看一眼）"
            exit 1
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- eval/holdout.yaml || true)
          if [ -z "$changed" ]; then
            echo "未改动 eval/holdout.yaml——无需标签"
            exit 0
          fi
          case ",$LABELS," in
            *,holdout-change,*) echo "eval/holdout.yaml 已改动，且带 holdout-change 标签 ✓" ;;
            *) echo "eval/holdout.yaml 已改动但缺 holdout-change 标签——改量尺必须在评审面上可见"; exit 1 ;;
          esac

  skill-self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # skill 自包含（卫生检查）：skill 文件不得引用 ADR 编号——ADR 会被修订/吸收，
      # 编号锚定让 skill 行为看起来由外部文档间接定义；行为规则必须内联。
      # 准入判据（可机械判定 + 易复发 + 确定性后果）：属文档卫生类，一行 grep 足够。
      - run: |
          hits=$(grep -rn 'ADR-[0-9][0-9][0-9][0-9]' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含 ADR 编号锚定（skill 必须自包含，行为规则内联）："
            echo "$hits"
            exit 1
          fi
          echo "skill 自包含 OK（零 ADR 编号引用）"
      # 外部锚卫生（与 ADR 编号同一类，同一条判据）：skill 里只写行为规则与依据，
      # 溯源归 git / PR / EV 卡——日期记录的是"某次会话的观测时点"，读起来像事实；
      # EV 卡号会随卡被修订/supersede 而失真；两者都会让 skill 行为看起来由外部记录定义。
      # 要写"为什么"，就把依据内联成一句话（或让 commit/卡承载）。
      # 只在 skills/ 上判——docs/ 与 proposals/ 里的日期与卡号正是溯源该待的地方。
      - run: |
          hits=$(grep -rnE '20[0-9]{2}-[0-9]{2}|EV-[0-9]{4}-[0-9]{3}' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含外部锚（日期 / EV 卡号）——行为规则须内联，溯源归 git/PR/卡："
            echo "$hits"
            exit 1
          fi
          echo "skill 外部锚卫生 OK（零日期 / 零 EV 卡号锚）"

