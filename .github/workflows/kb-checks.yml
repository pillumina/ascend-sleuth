name: kb-checks

on:
  push:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "triage-tree.yaml", "scripts/build_index.py", "scripts/verify_references.py", "scripts/verify_metrics.py", "scripts/build_ref_summary_index.py", "scripts/build_procedure_index.py"]
  pull_request:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "triage-tree.yaml", "scripts/build_index.py", "scripts/verify_references.py", "scripts/verify_metrics.py", "scripts/build_ref_summary_index.py", "scripts/build_procedure_index.py"]

jobs:
  index-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # 两道检查合一：build_index 会解析全部 case YAML（语法错即红），
      # --check 校验 _index.yaml 与文件 hash 一致（改了 case 忘重建即红）。
      - run: python3 scripts/build_index.py --check
      # triage-tree 语法检查：曾因 pipe-or 写法长期不可解析而无人发现（原则二教训），
      # 结构化工具化（路由统计/学习型路由）前必须堵住。
      - run: python3 -c "import yaml; yaml.safe_load(open('triage-tree.yaml')); print('triage-tree ok')"

  reference-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # reference 层入口门槛比 case 更严（先验知识框架 ADR §8）：
      # 基础元信息 + 已登记 type + 按来源类型子字段 + 深审（case-derived methodology
      # 派生引用数 <3 不允许 active）。脚本解析全部 case YAML 计算派生计数，语法错即红。
      - run: python3 scripts/verify_references.py --check
      # 背景类 summary 索引新鲜度（B1 EV-2026-026）：references 变更未重建即红
      - run: python3 scripts/build_ref_summary_index.py --check
      # 流程选择器索引新鲜度（B2 EV-2026-038）：methodology 不进背景层，走独立索引；
      # references/ 变更未重建即红（与背景索引同待遇）。
      - run: python3 scripts/build_procedure_index.py --check

  metrics-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # metrics 时序数据结构校验（教训：W28/W35 字段格式漂移导致跨期不可比、趋势不可算）：
      # period 唯一 / kind 合法 / recorded_at 必填 / 比例字段 ok,total 合法。结构由 CI 兜底。
      - run: python3 scripts/verify_metrics.py --check

  skill-self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # skill 自包含（卫生检查）：skill 文件不得引用 ADR 编号——ADR 会被修订/吸收，
      # 编号锚定让 skill 行为看起来由外部文档间接定义；行为规则必须内联。
      # 准入判据（可机械判定 + 易复发 + 确定性后果）：属文档卫生类，一行 grep 足够。
      - run: |
          hits=$(grep -rn 'ADR-[0-9][0-9][0-9][0-9]' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含 ADR 编号锚定（skill 必须自包含，行为规则内联）："
            echo "$hits"
            exit 1
          fi
          echo "skill 自包含 OK（零 ADR 编号引用）"
      # 外部锚卫生（与 ADR 编号同一类，同一条判据）：skill 里只写行为规则与依据，
      # 溯源归 git / PR / EV 卡——日期记录的是"某次会话的观测时点"，读起来像事实；
      # EV 卡号会随卡被修订/supersede 而失真；两者都会让 skill 行为看起来由外部记录定义。
      # 要写"为什么"，就把依据内联成一句话（或让 commit/卡承载）。
      # 只在 skills/ 上判——docs/ 与 proposals/ 里的日期与卡号正是溯源该待的地方。
      - run: |
          hits=$(grep -rnE '20[0-9]{2}-[0-9]{2}|EV-[0-9]{4}-[0-9]{3}' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含外部锚（日期 / EV 卡号）——行为规则须内联，溯源归 git/PR/卡："
            echo "$hits"
            exit 1
          fi
          echo "skill 外部锚卫生 OK（零日期 / 零 EV 卡号锚）"

