name: kb-checks

on:
  push:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "proposals/**", "eval/**", "tests/**", "docs/**", "README.md", "triage-tree.yaml", "triage-tree.d/**", "dsh-plugins/**", "scripts/build_index.py", "scripts/build_triage_tree.py", "scripts/verify_references.py", "scripts/verify_case_draft.py", "scripts/verify_metrics.py", "scripts/build_timeline.py", "scripts/verify_proposals.py", "scripts/build_ref_summary_index.py", "scripts/build_procedure_index.py", "scripts/build_error_gap_index.py", "scripts/holdout.py", "scripts/eval_arena.py", "scripts/eval_scorecard.py", "scripts/build_docs_index.py", "scripts/panel_render_check.js", "scripts/check_panel_tokens.py", "scripts/ev_board_data.py", "scripts/metrics_health.py", "scripts/trace_metrics.py", "scripts/shared_dir.py", "scripts/ev_proposal.py", "scripts/component_tally.py", "scripts/rename_ref.py", "scripts/verify_evidence.py", ".github/workflows/kb-checks.yml"]
  pull_request:
    paths: ["knowledge/**", "references/**", "skills/**", "metrics/**", "proposals/**", "eval/**", "tests/**", "docs/**", "README.md", "triage-tree.yaml", "triage-tree.d/**", "dsh-plugins/**", "scripts/build_index.py", "scripts/build_triage_tree.py", "scripts/verify_references.py", "scripts/verify_case_draft.py", "scripts/verify_metrics.py", "scripts/build_timeline.py", "scripts/verify_proposals.py", "scripts/build_ref_summary_index.py", "scripts/build_procedure_index.py", "scripts/build_error_gap_index.py", "scripts/holdout.py", "scripts/eval_arena.py", "scripts/eval_scorecard.py", "scripts/build_docs_index.py", "scripts/panel_render_check.js", "scripts/check_panel_tokens.py", "scripts/ev_board_data.py", "scripts/metrics_health.py", "scripts/trace_metrics.py", "scripts/shared_dir.py", "scripts/ev_proposal.py", "scripts/component_tally.py", "scripts/rename_ref.py", "scripts/verify_evidence.py", ".github/workflows/kb-checks.yml"]

jobs:
  index-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # 两道检查合一：build_index 会解析全部 case YAML（语法错即红），
      # --check 比的是**分片**（人提交面）与 case 内容 hash 一致（改了 case 忘重建即红）。
      # 总表 knowledge/_index.yaml **不在本条**：它是主干重建面，由下面的 generated-refresh job
      # 重建并提交（`--check --master`）。原先把总表也塞进 PR 门，等于逼每个改 case 的人在自己的
      # PR 里重写全库那一张表——三个人并发就撞在同一个文件上。这一分工有测试钉住：
      # tests/test_build_index.py::test_pr_gate_ignores_master_and_main_gate_requires_it。
      - run: python3 scripts/build_index.py --check
      # triage-tree 语法检查：曾因 pipe-or 写法长期不可解析而无人发现（原则二教训），
      # 结构化工具化（路由统计/学习型路由）前必须堵住。
      - run: python3 -c "import yaml; yaml.safe_load(open('triage-tree.yaml')); print('triage-tree ok')"
      # Tier 1 路由的**源文件**校验（分支 id 唯一、category 合法、症状组形态、≤30 分支）+
      # 一族一文件的约束。这里比的是源，不是生成物：生成物 triage-tree.yaml 由主干重建
      # （下面的 generated-refresh job），不在 PR 里比——理由与总表同，见 --check-sources 的说明。
      - run: python3 scripts/build_triage_tree.py --check-sources
      # 生成物不许进 PR：`knowledge/_index.yaml`（全库一张表）与 `triage-tree.yaml`（全路由一张表）
      # 是**谁都得重写一遍**的文件，谁提交它们，谁就把别人的那份也拖进冲突里。主干 job 会在合并后
      # 重建并提交；PR 里带它们只会制造冲突。分片 `knowledge/_index/*.yaml` 不在此列——它按
      # (框架 × 性质) 切开，只被碰同一框架的人改，留在 PR 里当评审面（ADR-0002 的"索引随 case
      # 变更一起评审"靠它保住）。本步在本地复跑（无 GITHUB_BASE_REF）时走跳过分支。
      - name: 生成物不得进 PR（总表与 triage 聚合）
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "非 PR 环境（本地复跑 / push）——跳过生成物闸门"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "取不到 origin/$BASE_REF——无法判定，按动了生成物处理（宁可要人看一眼）"
            exit 1
          fi
          bad=$(git diff --name-only "origin/$BASE_REF...HEAD" -- knowledge/_index.yaml triage-tree.yaml || true)
          if [ -n "$bad" ]; then
            echo "这两个文件是主干重建面，不由 PR 提交："
            echo "$bad"
            echo
            echo "改法（把工作树里那份还原成主干版本，它会在合并后被主干 job 重建）："
            echo "  git checkout origin/$BASE_REF -- knowledge/_index.yaml triage-tree.yaml"
            echo "本地生成物脏着没关系——只要不提交它。"
            exit 1
          fi
          echo "未改动生成物"

  # 生成物重建（**主干**）：索引总表 + triage 聚合都由本 job 在合并后重建并提交。
  # 为什么不让功能 PR 提交它们：两者都是"全库/全路由一张表"，谁都得重写它一遍，
  # 并发提交必然撞在同一个文件上。人提交面 = case 本体 + 分片 + triage-tree.d/。
  # 本 job 用 [skip ci] 提交，避免自我触发（重建后无 diff 时自然收敛）。
  generated-refresh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ① 先报一句现状（不拦）：刚合进来的 PR 不带生成物，这里本来就该是过期的。
      #    这一步的意义是让日志里看得见"这次重建到底改了哪些东西"。
      - name: 重建前现状（信息性，不拦）
        run: |
          python3 scripts/build_index.py --check --master || echo "总表过期——下面重建"
          python3 scripts/build_triage_tree.py --check || echo "triage 聚合过期——下面重建"
      # ② 重建 + 提交（机器人）。重建前**不能**跑会失败的门：PR 不带生成物，
      #    合并进来的那一刻生成物必然是旧的，先拦就把自己的修复步骤拦死了。
      - name: 重建生成物并提交（机器人）
        run: |
          python3 scripts/build_index.py
          python3 scripts/build_triage_tree.py
          git add knowledge/_index.yaml knowledge/_index triage-tree.yaml
          if git diff --cached --quiet; then
            echo "生成物已是最新——无需提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(generated): 主干重建索引总表与 triage 聚合 [skip ci]"
          git push
      # ③ 合完必须逐字节一致：证明生成器是确定性的（同内容重建两次结果相同），
      #    也是"主干上的索引永远与 case 一致"这条不变量的落点。
      - name: 主干门（重建后必须与源逐字节一致）
        run: |
          python3 scripts/build_index.py --check --master
          python3 scripts/build_triage_tree.py --check

  case-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # case 结构与字段值的确定性判据。为什么单列一个 job：`build_index` 只保证
      # **能解析**，字段是否合法它不看——`fix_type: upgrade`（schema 无此值，出现在
      # 4 个 PR 的 5 个 case 里，`git log -S` 追溯无任何卡讨论过扩枚举）就这么静默存活；
      # 草稿在 inbox 期间更没有任何门（那时它还进不了 knowledge/，CI 解析不到）。
      # 本 job 把它变成硬门：必需字段 / 三个枚举 / `ref_knowledge` 悬挂与 active 校验 /
      # `expected` 的 regex 可编译且无空分支（空分支恒真，会让该 case 对任何输入都成为候选）。
      # 准入判据（机械可判 + 确定性后果 + 复发）：三类都满足。
      - run: python3 scripts/verify_case_draft.py --all

  reference-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # reference 层入口门槛比 case 更严（先验知识框架 ADR §8）：
      # 基础元信息 + 已登记 type + 按来源类型子字段 + 深审（case-derived methodology
      # 派生引用数 <3 不允许 active）。脚本解析全部 case YAML 计算派生计数，语法错即红。
      - run: python3 scripts/verify_references.py --check
      # 背景类 summary 索引新鲜度（B1 EV-2026-026）：references 变更未重建即红
      - run: python3 scripts/build_ref_summary_index.py --check
      # 流程选择器索引新鲜度（B2 EV-2026-038）：methodology 不进背景层，走独立索引；
      # references/ 变更未重建即红（与背景索引同待遇）。
      - run: python3 scripts/build_procedure_index.py --check
      # 错误码缺口索引新鲜度：故障模式表里出现、而错误表没有行的码——那是"错误表未命中"时的
      # 唯一跳板。不重建即红，理由同上：它是数据（哪个码在哪张表有修法），漂移会让跳板指向
      # 一个不存在的条目，而读侧无从分辨"库里没有"与"跳板坏了"。
      - run: python3 scripts/build_error_gap_index.py --check

  metrics-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # metrics 时序数据结构校验（教训：W28/W35 字段格式漂移导致跨期不可比、趋势不可算）：
      # period 唯一 / kind 合法 / recorded_at 必填 / 比例字段 ok,total 合法 / live 期号命名。结构由 CI 兜底。
      - run: python3 scripts/verify_metrics.py --check
      # 生成物与源一致（源 = metrics/timeline.d/<期号>.yaml，一期一个文件）。
      # 为什么需要这道门：timeline.yaml 是**生成物**，两人各写各的源文件才不撞；但若谁直接改了
      # 生成物（或改了源忘记重建），读者会拿到一份与源不符的时序数据——必须红，且报错要给出"重跑一次"的修法。
      - run: python3 scripts/build_timeline.py --check

  proposal-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # EV 卡是自演进的知识资产（随 PR 进出，同 knowledge/ 纪律），但此前 CI 从未校验过它——
      # 触发路径不含 proposals/**，"schema 由 verify_proposals CI 校验"（proposals/README.md）
      # 是纸面承诺（2026-09-10 审计）。本 job 把承诺变成硬门：卡结构 + 生命周期完整性
      # （终态卡缺 decision / validated 缺成本 / 在实验卡执行完未推进 / 僵尸卡 / 出处缺失）。
      - run: python3 scripts/verify_proposals.py --check
      # 注意：verify_exec_log.py **不进 CI**——exec-log（metrics/skill-exec-log.yaml）是
      # .gitignore 运行时件，CI checkout 里不存在，跑它只会打印"跳过"并空转。
      # 该不变量改由 evolve-check 收尾自查（skills/evolve-check 第 4 步）。

  # 人读面的名字与数字（docs/_manifest.yaml → README 区块）。为什么值得一道硬门：
  # "skill 共几个""有哪些文档"这类事实原先手写在多处，实测已漂移（术语表曾写"共九个"
  # 而实际十个；文档目录 17 条平铺，读者看不出该读哪篇）。数字没有理由手写——
  # 生成物与清单不一致即红；**docs/ 下出现未登记的文档也即红**（漏登记比数字写错更难发现）。
  docs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/build_docs_index.py --check

  # 封存对照集（holdout）：eval/golden/ 里由维护者独占的那部分。理由见 scripts/holdout.py
  # 头注——golden 在改动者可写面内且 groom 被要求跟着 case 改夹具，所以"无回归"是可
  # 控信号；封存后改内容必红，要合法改就得维护者 reseal 并在 PR 上留下标签。
  holdout-integrity:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 供下一步的 diff 用（label 闸门要知道 PR 改没改对照集）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ① 硬门：封存夹具内容被改动即红（哈希就是判据，不需要看 diff）
      - run: python3 scripts/holdout.py --check
      # ② 半硬：改对照集须带 holdout-change 标签，让"改量尺"在评审面上可见。
      #    强度如实标注：标签闸门由本步强制，但在 CODEOWNERS/分支保护落实前，有写权限者
      #    仍可自行打标签——真正的独立性随 CODEOWNERS 到位（见 CODEOWNERS.example）。
      #    本地复跑（演练 E6）无 GITHUB_BASE_REF，走"跳过"分支并 exit 0，不误红。
      - name: holdout 对照集变更须带 holdout-change 标签
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "非 PR 环境（本地复跑 / push）——跳过标签闸门"
            exit 0
          fi
          # 不能 shallow fetch：三点 diff（A...B）需要 merge-base，取不到时 diff 会
          # 静默为空 → 闸门形同虚设。checkout 已 fetch-depth: 0，这里做完整 fetch。
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "取不到 origin/$BASE_REF——无法判定是否改动对照集，按缺标签处理（宁可要人看一眼）"
            exit 1
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- eval/holdout.yaml || true)
          if [ -z "$changed" ]; then
            echo "未改动 eval/holdout.yaml——无需标签"
            exit 0
          fi
          case ",$LABELS," in
            *,holdout-change,*) echo "eval/holdout.yaml 已改动，且带 holdout-change 标签 ✓" ;;
            *) echo "eval/holdout.yaml 已改动但缺 holdout-change 标签——改量尺必须在评审面上可见"; exit 1 ;;
          esac

  # 回放观测账本：`eval/scorecard.yaml` 记「上次回放观测到什么」。此前这些观测只写在
  # fixture 头注散文里（22/24 条），完整报告落 gitignore 的 eval-reports/——于是「夹具改了
  # 没重跑」与「跑过了、结果就是这样」在数据上不可区分，仓库里也没有「当前命中构成」这个数。
  # 准入判据（CLAUDE.md）：①机械可判、②确定性后果成立；③复发——本条**没有本产物的历史
  # 失败**（账本此前不存在），入 CI 的依据是同类「生成物新鲜度」门的先例（index-freshness /
  # docs-index / metrics-validation / holdout-integrity 四道）与修法成本：账本过期由
  # `--build` 一条自动命令修（不需重跑回放），误红代价≈10 秒。评审若认为该按第三条严格执行，
  # 把它退回成 groom 收尾自查即可（卡 EV-2026-107 记了这条判断）。
  # 强度如实标注：**本门不判准确率**——账本记的是上次观测，不是现在能不能命中；
  # 准确率仍要 agent 跑回放（docs/guide/eval.md 门禁分级），不把不确定的东西硬门化。
  eval-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # fixture 字节哈希对不上 = 夹具改过而账本没跟着重建（真红）；
      # 目标 case 内容变了只进「待复核」清单不红（case 的合法变更不该阻塞无关 PR）。
      - run: python3 scripts/eval_scorecard.py --check

  # 口径脚本的单元测试：既有 12 个 --check 卡口验的是「仓库自洽」（索引新鲜、schema 合法、
  # id 唯一、生成物一致），不验「算得对」——build_index / trace_metrics / settle_trace_feedback /
  # build_timeline 的口径写错时，CI 全绿、而面板读数与 case 置信度静默报错数。
  # 首建即发现一处真实缺陷：settle 在事件序列变化时整段重放旧事件 → hits 重复计数
  # （测试里以 known_defect 断言钉住现状，修复需单独产卡——本 job 只保证口径不再无声漂移）。
  # 准入判据（CLAUDE.md）：①机械可判 ②确定性后果（纯 stdlib + PyYAML，不联网、不读真实 traces/）
  # ③复发：本套件无历史失败记录，入 CI 依据同类门先例与「口径错了没人知道」的代价，
  # EV-2026-108 记了这条判断；评审若按第三条严格执行，退回成收尾自查即可。
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 -m unittest discover tests

  # 面板：两个面板的渲染、文案、色语与数据口径契约都由 `panel_render_check` 与
  # `check_panel_tokens` 守着，但这两个脚本**此前不在任何 CI 里**（paths 不含 dsh-plugins/**），
  # 只能靠人记得跑。代价实测过两次：`metrics/timeline.yaml` 的期次解析器与真实文件结构不符
  # （文件里 8 期、面板读出 0 期）与 trace 解析器把 9 条事件读成 1 条，都是漏到用户面前才发现的；
  # 另外在 CI 形态的干净检出里（无 traces/、无 exec-log）整套检查本来就是红的——一条断言在文案
  # 重写后留在旧措辞上，而那条分支只在"没有 exec-log"的检出里跑，开发机上永远走不到。
  # 准入判据（机械可判 + 确定性后果 + 复发 ≥2 次）：三条都满足。
  panel-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 渲染检查要用 node 跑面板两半的源码；面板本身零依赖，不必装包。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyyaml
      - run: python3 scripts/check_panel_tokens.py
      # 真实 trace 的对照走主检出那一份（`scripts/shared_dir.py traces`）；CI 检出里没有
      # traces/（gitignore 运行时件），脚本会如实打印跳过，只跑形状夹具。
      - run: node scripts/panel_render_check.js

  skill-self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # skill 自包含（卫生检查）：skill 文件不得引用 ADR 编号——ADR 会被修订/吸收，
      # 编号锚定让 skill 行为看起来由外部文档间接定义；行为规则必须内联。
      # 准入判据（可机械判定 + 易复发 + 确定性后果）：属文档卫生类，一行 grep 足够。
      - run: |
          hits=$(grep -rn 'ADR-[0-9][0-9][0-9][0-9]' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含 ADR 编号锚定（skill 必须自包含，行为规则内联）："
            echo "$hits"
            exit 1
          fi
          echo "skill 自包含 OK（零 ADR 编号引用）"
      # 外部锚卫生（与 ADR 编号同一类，同一条判据）：skill 里只写行为规则与依据，
      # 溯源归 git / PR / EV 卡——日期记录的是"某次会话的观测时点"，读起来像事实；
      # EV 卡号会随卡被修订/supersede 而失真；两者都会让 skill 行为看起来由外部记录定义。
      # 要写"为什么"，就把依据内联成一句话（或让 commit/卡承载）。
      # 只在 skills/ 上判——docs/ 与 proposals/ 里的日期与卡号正是溯源该待的地方。
      - run: |
          hits=$(grep -rnE '20[0-9]{2}-[0-9]{2}|EV-[0-9]{4}-[0-9]{3}' skills/ | grep -v '\.py' || true)
          if [ -n "$hits" ]; then
            echo "skill 文件含外部锚（日期 / EV 卡号）——行为规则须内联，溯源归 git/PR/卡："
            echo "$hits"
            exit 1
          fi
          echo "skill 外部锚卫生 OK（零日期 / 零 EV 卡号锚）"

  # 门控判据自身的牙齿：接受判词（配对 + 复用折减 + 无回归）用合成样本复现三态。
  # 为什么值得一道硬门：判据是"数据门槛"，若它只会判 accept，门控等于没有——而判词
  # 逻辑写在脚本里，改坏了没有任何信号（arena 的池与账本都是本地运行件，CI 里不存在，
  # 所以能进 CI 的只有判据本身）。准入判据（机械可判 + 确定性后果 + 复发）三条都满足。
  arena-gate-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 scripts/eval_arena.py --self-test

