# Tier 1: 症状 → namespace 路由
#
# 两个正交轴（别混，§5.1）：
#   轴 1（在哪查）= 训推 × 框架 → search_namespaces 指向的目录
#   轴 2（什么性质）= category → 决定诊断路径 + quickly_check 形态 + 默认工具
#
# <detected_framework>：工程师提供的框架（/diagnose 从客户提供的信息/报错判断，不跑 pip list）。
# 分支数 ≤ 30。框架检测失败时只用 common/。
#
# ⚠️ common/ 实际状态：承接**跨框架 / 框架未登记**的共性 case（2026-09-09 起首批候选在
# postmortems/inbox/ 待 groom 转正——框架无关根因，如业务代码重置确定性开关、加载权重数值
# 异常、CANN 算子空输入/竞争）。**转正前** common/ 仍只有 .gitkeep，agent 路由到 common/
# 后走 Tier 3 fallback；**转正后** 本注记随 groom 更新为"可消费资产"，search_namespaces
# 中的 common/ 一项才真正生效。README + ADR-0005 的"common/ 必拉"是**设计承诺**。

branches:
  - id: training_interrupt
    category: interrupt
    symptoms:
      - ['\btimeout\b', '\bhang\b', "stuck at step"]
      - ["NCCL.*timeout", "HCCL.*timeout", "all_to_all.*timeout"]
      - ['\bOOM\b', "out of memory", '\bkilled\b']
      - ["core dumped", "segmentation fault"]
      - ["HCCL.*(error|fail)", "hcclCommInit"]                      # HCCL 通信初始化错误（VERL-5074 error code 5 / VERL-6608 error code 7）
      - ["aclnn\\w+"]                                               # aclnn 算子调用错误（VERL-6885 ConvolutionBackward）
      - ["CPU-only actor", "registered but not available"]          # 设备平台注册失败（VERL-6741 Ray actor CPU-only）
      - ["RuntimeError", "AssertionError", "patch.*fail"]           # 训练期异常（VERL-6707 npu_patch / VERL-6756 设备检测兜底）
      - ["ImportError", "ModuleNotFoundError", "FileNotFoundError"]  # 启动期 import/文件错误（MSLLM-1554/1555 features_manager 缺符号 / MSLLM-1465 数据预处理路径）
      - ["cannot start", "启动失败", "failed to start", "训练无法启动", "训练无法拉起", "启动即失败"]   # 训练启动失败类（MSLLM-1459/1667 等）
      - ["重复注册", "register.*multiple times"]                     # 算子重复注册（MSLLM-1550 GMMOpBuilder / MSLLM-1707 npu_moe 算子）
      - ["build_train_valid_test_data"]                              # 数据集构建阶段（MSLLM-1526 helpers_cpp 缓存）
      - ["recv_forward", "p2p_communication"]                        # p2p 通信路径（MSLLM-1525 batch_p2p_comm）
    search_namespaces:            # 按顺序搜索，最多加载 3 个
      - training/<detected_framework>/
      - common/
    fallback: Tier 3

  - id: training_precision
    category: precision
    symptoms:
      - ['\bnan\b', "loss.*nan", '\binf\b']
      - ["fp8.*precision", '\boverflow\b', '\bunderflow\b']
      - ["bf16.*mismatch", "allreduce.*round"]
      - ['\bdiverg', "not converg"]        # 收敛问题走 precision.convergence 子类型
      - ["乱码", "garbled", "weight.*mismatch", "权重.*错位"]   # 权重错位/输出乱码（MSLLM-1532 mg2hf GQA 拆分 / MSLLM-1437 grad norm 0）
      - ["日志.*异常", "统计失真", "被错误除以", "除以.*global_step", "日志失真"]   # 日志统计/数值呈现异常（MSLLM-1780 FSDP2 续训首步 lm loss 被除 global_step）
      - ["重复训练.*(不一致|差异)", "确定性.*(不一致|失效|无法固定)", "grad_norm.*(偏大|异常)"]   # 重复训练/确定性类（COMMON-SEED-RESET-DETERMINISM 业务装饰器重置确定性开关 / COMMON-RMSNORM-WEIGHT-SCALE 加载权重数值放大 / COMMON-FA-RACE-DETERMINISM 算子数据竞争）
      - ["log_?prob.*(差异|不一致)", "训推.*(不一致|差异|对齐)", "reward.*(下降|崩溃)"]   # 训推一致性类（VERL-LOGPROB-CONFIG-MISMATCH）
    search_namespaces:
      - training/<detected_framework>/
      - common/
    fallback: Tier 3

  - id: training_performance
    category: performance
    symptoms:
      - ["throughput.*drop", "throughput.*low"]
      - ["step.*time.*slow", "step.*time.*波动"]
      - ["comm.*ratio.*high", "communication.*overhead"]
      - ["tflops.*low", '\bidle\b', "util.*low"]
    search_namespaces:
      - training/<detected_framework>/
      - common/
    fallback: Tier 3

  - id: inference_interrupt
    category: interrupt
    symptoms:
      - ["\\btimeout\\b", "超时", "synchronize.*timeout", "广播.*超时", "timed out", "TimeoutError"]   # 推理侧通信/同步超时（timed out/TimeoutError 补录：2026-W37 #13639 sample_tokens RPC 超时）
      - ["\\bhang\\b", "\\bstuck\\b", "死锁", "挂起", "deadlock"]   # 推理侧 hang/死锁（2026-W37 #13639 fullgraph deadlock 补录——原只有 timeout 变体，hang 被 training 分支独占）
      - ["\\bpreempt\\b", "抢占", "无法.*调度", "调度.*(卡|死锁|楔)", "admission.*fail", "排队.*堆积", "waiting.*递增"]   # 调度/接纳层（preemption/admission）——PD 分离静默冻结/调度楔（2026-09-08 ascend_store PD prefill hang；真实支点常是调度/控制循环层而非 load/传输组件）
      - ["kv.*cache.*full", "out of memory", "\\bOOM\\b", "内存泄漏", "memory leak", "内存.*持续增长"]   # 长跑内存泄漏/OOM（#12345：CANN host buffer 不驱逐，中文/大写 OOM 补录）
      - ["serving.*crash", "engine.*error"]
      - ['ErrCode=\d+', 'EE9999', 'rtStream\w*.*fail', 'aclrt\w+.*fail']   # 错误码型签名（评估 0001 §四.2：12983 型靠退化兜底的缺口）
      - ['internal error', '\babort\b', '\bcrash\b', '\bdied\b']
      - ["failed to start", "cannot start", "unable to start", "启动失败", "service.*start.*fail"]   # 启动失败类（10610/11208/13508/9167 等）
      - ["ModuleNotFoundError", "ImportError", "KeyError", "AttributeError", "RuntimeError", "AssertionError", "ValueError", "TypeError"]   # 启动期异常类（ValueError 补录：2026-W36 #7023；TypeError 补录：2026-W37 #13446 Reranker config 类型错配——原缺 TypeError 致被 training 的 failed to start 误吸）
      - ["are not supported for now", "not supported for now", "Model architectures.*not supported"]   # 架构不支持（#15086：K3 版本错位，OOD 补录）
    search_namespaces:
      - inference/<detected_framework>/
      - common/
    fallback: Tier 3

  - id: inference_precision
    category: precision
    symptoms:
      - ["garbled", "乱码", "output.*wrong", "输出错误", "输出异常"]
      - ["字符重复", "character.*repeat", "重复输出", "回复不终止", "输出不终止", "持续输出.*换行"]   # 重复/不终止类（VLLM-ASC-XGRAMMAR-REPEAT 结构化输出约束与内容冲突）
      - ["speculative.*wrong", "投机.*错误", "投机.*输出"]      # 投机输出内容错误（精度）。注意：接受率下降是"双面"——无输出内容错误=性能（走 inference_performance）；伴随输出错误/乱码=精度面（inference_precision 族 11127/12723 等）。命中 performance 接受率族不符时交叉查 precision 族
      - ["overthinking", "过度思考", "reasoning.*过长"]        # 输出冗余（精度/输出形态异常）
      - ["输出.*为空", "empty.*output", "result.*empty", "输出为空", "结果为空"]
      - ["batch.*invariant", "deterministic", "非确定"]
      - ['\bNAN\b', '\bNaN\b', "loss.*nan", '\binf\b']      # 推理侧精度（输出含 NaN/Inf）
      - ["花图", "图像.*(异常|畸变|错乱)", "评分.*(低|下降|不达标)", "score.*(low|drop)"]   # 生成图像异常 / 下游评分下降（COMMON-TP-SEED-UNSYNCED TP 组内种子未同步花图 / VLLM-ASC-GPQA-OPERATOR-CLAMP 评分偏低）
    search_namespaces:
      - inference/<detected_framework>/
      - common/
    fallback: Tier 3

  - id: inference_performance
    category: performance
    symptoms:
      - ["latency.*high", "p99.*slo", "qps.*low", "吞吐.*下降", "throughput.*drop", "tpot", "TPOT.*劣化", "tpot.*劣化"]
      - ["cold.*start.*slow", "first.*token.*slow"]
      - ["accept.*rate.*drop", "accept_len.*下降", "acceptance.*rate.*drop", "acceptance_per_pos", "接受率低", "接受率.*低", "投机.*接受率"]   # 投机接受率下降=生成效率退化（性能；无输出内容错误前提——伴随输出错误/乱码走 inference_precision，见 precision 分支注释）
      - ["cache.*hit.*0", "命中.*为0", "prefix.*cache.*miss", "缓存命中.*0"]    # 前缀缓存失效=性能退化
      - ["generation.*stall", "generation.*slow", "卡住.*生成"]
    search_namespaces:
      - inference/<detected_framework>/
      - common/
    fallback: Tier 3

  - id: uncategorized
    category: null
    symptoms: []
    search_namespaces: [common/]
    fallback: Tier 3
