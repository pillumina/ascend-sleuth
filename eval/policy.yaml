# 自演进评估循环的可调策略（唯一调参入口）。
#
# 默认值对应设计文档 2026-11-17-self-evolution-design.md §12。加载时递归校验
# 未知键与非法枚举；未知键报错，不静默忽略。哈希写进结论的 versions.policy。
#
# 不进这里的：状态机、安全门、test 只从 core 抽、根因硬约束、答案可见性。
# 那些是评估协议，改动要升协议版本。

autonomy:
  default: A2
  overrides:
    docs.non_normative: A3
    docs.normative: A1
    feedback.candidate: A3
    feedback.pool: A2
  auto_merge:
    enabled: false

objective:
  primary: case_hit
  hard_constraints: [safety, fix, regression, test]

decision:
  method: paired_binary
  alpha: 0.10

samples:
  core_regression: 30
  field_eval: 9
  test: 4
  split: hash
  strata: {}

cost:
  primary_dimension: tokens
  budget_metric: billed
  B: 0.10
  epsilon: 0.10
  delta: 0

experiment:
  algorithm: baseline
  budget: {}
  seed: 0

rubrics:
  case_version: case-v1
  reference_version: ref-v1
  threshold: 0.7
  double_label: 10
