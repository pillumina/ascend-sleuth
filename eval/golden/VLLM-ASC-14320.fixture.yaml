    ### 🐛 Describe the bug
    
    ## Describe the Bug
    
    PD-separation (2P + 2D) serving GLM-5.2-w4a8 with **DCP** (`decode-context-parallel-size=8`) + MTP speculative decoding crashes the decode EngineCore under sustained load with `EZ9999 aicore exception: MTE accesses an invalid GM address` in the **LightningIndexerQuant** op.
    
    Root cause (confirmed by instrumented debug prints): the DCP `_build_block_table_replicated_view` produces a **replicated block_table whose block ids exceed the k_cache capacity**, and LightningIndexerQuant indexes k_cache with these out-of-range block ids → MTE invalid GM address.
    
    The same config on v0.23 (theta release) does **not** crash. The regression was introduced by the v0.26 PCP-removal refac
