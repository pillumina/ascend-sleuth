case_id: MSLLM-1780

input:
  symptoms: |
    ### 环境信息

    ```
    - MindSpeed-LLM: master @ c8f3cada
    - 后端: FSDP2（`train_fsdp2.py`），FSDPTurbo
    - MindSpeed 0.12.1 / torch 2.10.0 / torch_npu 2.10.0 / CANN 9.0.0
    - transformers 5.2.0, Python 3.12.13
    - 硬件: Ascend 910 单机 4 卡（fsdp_size=4, tp=1, dp=1）
    ```

    ### 🐛 问题描述

    我目标是简单跑通， 生成了一个小的模型，来验证， 但是发现一个bug， 模型config见附件(模型 config.json 附件，已略)
    ## 复现步骤

    1. SFT 训练，`max_steps=30`，`save_steps=30`（与 max_steps 相同，使 checkpoint 落在最后一步），`logging_steps=1`；
    2. 以 `--training.resume_from_checkpoint .../checkpoints/global_step_30` 恢复，并将 `max_steps` 提高到 60 继续训练；
    3. 观察恢复后第一步（step 31）的日志。

    关键 YAML：

    ```yaml
    training:
      stage: sft
      max_steps: 30          # 第二次运行改为 60
      save_steps: 30
      logging_steps: 1
    ```

    ## 实际行为（异常）

    第二次运行日志（恢复后）：

    ```
    iteration 31/60 | consumed samples: 992 | consumed tokens: 600 | elapsed time per iteration (ms): 34.55 | tokens/s: 560.23 | lm loss: 2.473422E-01
    iteration 32/60 | consumed samples: 1024 | consumed tokens: 1208 | elapsed time per iteration (ms): 90.11 | tokens/s: 6747.39 | lm loss: 7.742573E+00
    ```

    step 31 三个指标同时异常：

    | 指标 | step 31 | ×31 还原 | 正常参照（step 32） |
    |---|---|---|---|
    | lm loss | 0.247 | **7.66** | 7.74 |
    | elapsed (ms) | 34.55 | 1071（含跳批+首步预热） | 90.11 |
    | tokens/s | 560 | 600 tok / 1.071 s | 6747 |

    三个互不相关的指标同时除以 **31**（= 恢复后的 global_step）后全部恢复正常量级，且 0.247×31 = 7.66 与相邻步一致。

    用 checkpoint 权重离线重放 step 31 实际处理的 batch（样本 160–192），真实 loss ≈ 6.94（与相邻 batch 6.95/6.98 同档），确认**训练本身（模型、optimizer、lr、数据位置、真实 loss）完全正确**，只有日志统计失真。

    ## 期望行为

    恢复后第一步日志应为真实 loss（≈7.7）、真实单步耗时与吞吐；`consumed tokens/samples` 应从 checkpoint 恢复累计值，而不是从 0 重新计数（目前 step 31 显示 consumed tokens: 600，实为本进程累计）。
