- issue: 13673
  split: selection
  title: '[Bug]: 随机采样在高并发下可能存在正确性问题'
  input:
    symptoms: "### Your current environment\n\n```text\nCANN 9.0.0\ntorch 2.9.0\n\
      torch_npu 2.9.0.post4\nvllm 0.18.0\nvllm-ascend 0.18.0\n```\n\n### \U0001F41B\
      \ 问题描述\n\n当前普通随机采样路径在 `global_stream()` 上创建并填充指数分布随机张量 `q`，随后在当前流上消费该张量：\n\n\
      ```python\nwith npu_stream_switch(global_stream()):\n    q = torch.empty_like(probs)\n\
      \    q.exponential_()\n\ntorch.npu.current_stream().wait_stream(global_stream())\n\
      return probs.div_(q).argmax(dim=-1).view(-1)\n```\n该实现存在于 vLLM Ascend v0.18.0等多个分支，目前\
      \ main 分支仍然保留了相同实现。\nwait_stream() 可以保证生产流上的 q.exponential_() 先于消费流上的 probs.div_(q)\
      \ 执行，但 q 在一个流上分配、在另一个流上消费时，没有调用：\n```python\nq.record_stream(torch.npu.current_stream())\n\
      ```\n也没有在释放 q 前，让分配流反向等待消费流执行完成。\n因此，缓存内存分配器可能无法感知 q 完整的跨流生命周期。在高并发和较大内存分配压力下，q\
      \ 的存储可能在消费流执行完成前被重新使用，进而产生潜在的采样正确性问题。\n\n### 影响范围\n该路径主要用于基于温度的随机采样，即：temperature\
      \ > 0\n潜在表现包括：\n- 出现超出正常随机性的异常采样结果，推理乱码；\n- eager 模式高并发场景下精度下降；\n- 相同输入和种子下的可复现性受到影响。\n\
      \n纯贪心采样：temperature = 0 不会进入该 random_sample() 路径。"
  expected:
    resolution: '@zzzzwwjj Please take a look at this issue, it seems to be problematic.'
    fix_commit: ''
  status: active
