- issue: 12947
  split: selection
  title: Gemma4 31B EAGLE3 speculative decoding on Ascend
  input:
    symptoms: "# Gemma4 31B EAGLE3 speculative decoding on Ascend\n\nThis issue documents\
      \ how to run Gemma4 31B with EAGLE3 speculative decoding on vLLM Ascend.\n\n\
      ## Models\n\n- Target model: Gemma4 31B Instruct\n- Draft model: [RedHatAI/gemma-4-31B-it-speculator.eagle3](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.eagle3)\n\
      \nDownload the draft model before launching the server:\n\n```bash\nhuggingface-cli\
      \ download RedHatAI/gemma-4-31B-it-speculator.eagle3 \\\n  --local-dir /path/to/gemma-4-31B-it-speculator.eagle3\n\
      ```\n\n## Required patch\n\nUntil the compatibility fix is merged, cherry-pick\
      \ this minimal PR:\n\n- https://github.com/vllm-project/vllm-ascend/pull/12948\n\
      \n```bash\ngit fetch https://github.com/0moyi0-2024/vllm-ascend_tp.git codex/gemma4-eagle3-minimal\n\
      git cherry-pick 06f12437\n```\n\n## Launch command\n\nUse `PIECEWISE` graph\
      \ mode for Gemma4 EAGLE3:\n\n```bash\nASCEND_RT_VISIBLE_DEVICES=0,1,2,3 \\\n\
      HCCL_OP_EXPANSION_MODE=AIV \\\nHCCL_BUFFSIZE=256 \\\nVLLM_WORKER_MULTIPROC_METHOD=spawn\
      \ \\\nvllm serve /path/to/gemma4-31b-it \\\n  --host 0.0.0.0 \\\n  --port 8000\
      \ \\\n  --served-model-name gemma4-eagle3 \\\n  --tensor-parallel-size 4 \\\n\
      \  --max-num-seqs 8 \\\n  --max-model-len 8192 \\\n  --block-size 128 \\\n \
      \ --speculative-config '{\"model\":\"/path/to/gemma-4-31B-it-speculator.eagle3\"\
      ,\"method\":\"eagle3\",\"num_speculative_tokens\":3}' \\\n  --compilation-config\
      \ '{\"cudagraph_mode\":\"PIECEWISE\"}'\n```\n\n## Notes\n\n- `PIECEWISE` is\
      \ the recommended graph mode for Gemma4 EAGLE3 on Ascend.\n- `--block-size 128`\
      \ is required by the Ascend backend in this setup.\n- `--max-model-len 8192`\
      \ avoids excessive memory use from Gemma4's long default context.\n- `num_speculative_tokens=3`\
      \ is the recommended starting point.\n\n## Validation\n\nThe configuration above\
      \ was checked with greedy output comparison between target-only and EAGLE3 serving.\
      \ Outputs matched across the tested prompts, and repeated requests were stable.\n\
      \n## Acceptance baseline\n\nAcceptance rate with `num_speculative_tokens=3`,\
      \ natural 128-token output:\n\n| pos0 | pos1 | pos2 | mean acceptance length\
      \ | avg draft acceptance |\n| --- | --- | --- | --- | --- |\n| ~0.71 | ~0.48\
      \ | ~0.30 | ~2.5 / 3 | ~50% |\n\n## TODO / known issues\n\n- [ ] Merge the minimal\
      \ Gemma4 image-token compatibility PR.\n- [ ] Add Gemma4 EAGLE3 usage notes\
      \ to vLLM Ascend docs after the fix lands.\n- [ ] Re-check the best `num_speculative_tokens`\
      \ value on newer CANN/vLLM Ascend versions.\n- [ ] Revisit `FULL_DECODE_ONLY`\
      \ graph mode after backend support for Gemma4 512-dim attention is improved.\n"
  expected:
    resolution: '[Feature][SpecDecode] Support Gemma4 image token mapping (#12948)'
    fix_commit: abeb73b546f7
    confidence: high
  status: active
