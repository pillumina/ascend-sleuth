      dsv4flash\",\n    \"max_tokens\": 32,\n    \"system\": \"You are a helpful assistant.\"\
      ,\n    \"messages\": [\n      {\"role\": \"user\", \"content\": \"Hi\"},\n \
      \     {\"role\": \"system\", \"content\": \"Reply only in uppercase.\"},\n \
      \     {\"role\": \"user\", \"content\": \"how are you?\"}\n    ]\n  }'\n\n\n\
      {\"id\":\"chatcmpl-bd492107bdafc286\",\"type\":\"message\",\"role\":\"assistant\"\
      ,\"content\":[{\"type\":\"text\",\"text\":\"Hello.\"}],\"model\":\"dsv4flash\"\
      ,\"stop_reason\":\"end_turn\",\"usage\":{\"input_tokens\":11,\"output_tokens\"\
      :3}}\nHTTP_STATUS:200\n\n\n{\"id\":\"chatcmpl-bbc885921627f6cf\",\"type\":\"\
      message\",\"role\":\"assistant\",\"content\":[{\"type\":\"text\",\"text\":\"\
      Paris\"}],\"model\":\"dsv4flash\",\"stop_reason\":\"end_turn\",\"usage\":{\"\
      input_tokens\":23,\"output_tokens\":2}}\nHTTP_STATUS:200\n\n{\"id\":\"chatcmpl-a9e17e14a0440ceb\"\
      ,\"type\":\"message\",\"role\":\"assistant\",\"content\":[{\"type\":\"text\"\
      ,\"text\":\"I AM AN AI ASSISTANT, SO I DON'T HAVE FEELINGS, BUT THANK YOU FOR\
