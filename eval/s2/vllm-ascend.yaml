      \ got an unexpected keyword argument 'merge_inline_system'\n```\n\n[df2029ade3544321abbc74b5f434a9a5.txt](https://github.com/user-attachments/files/30092107/df2029ade3544321abbc74b5f434a9a5.txt)\n\
      \n**Root cause**\n```\nvllm_ascend/patch/.../patch_anthropic_system_message.py\
