  input:
    symptoms: "### Your current environment\n\n<details>\n<summary>The output of `python\
      \ collect_env.py`</summary>\n\n```text\nPyTorch version: 2.10.0+cpu\nOS: Ubuntu\
      \ 24.04.4 LTS (aarch64)\nPython version: 3.12.13\nCPU: Kunpeng 920 7280Z (aarch64,\
      \ 640 CPUs)\n[pip3] torch_npu==2.10.0.post4\nvLLM Version: 0.27.1\nvLLM Ascend\
      \ Version: 0.1.dev4715+g6e506867c (main @ dade7da62 + one unrelated feature\
      \ commit; the offending line below is unchanged on main)\nASCEND_HOME_PATH=/usr/local/Ascend/cann-9.1.0\n\
      NPU: Atlas 800I A3 (Ascend 910_93), npu-smi 26.0.rc1\nDocker image: quay.io/ascend/vllm-ascend:nightly-main-a3\n\
      ```\n\n</details>\n\n### \U0001F41B Describe the bug\n\nAny PD-disaggregated\
      \ deployment that combines `recompute_scheduler_enable=true` on the decode node\
      \ with speculative decoding (`deepseek_mtp`) crashes on the **first request**.\
      \ The crash is identical on model runner V1 and V2. No lmhead TP / finegrained_tp_config\
      \ involved.\n\nThe service starts and passes health checks (`GET /v1/models`\
      \ returns 200); the first `POST /v1/chat/completions` returns an error response\
      \ and all EngineCores die.\n\nReproduction — decode node on a single A3 box\
      \ (16 chips), with a plain TP8 eager `kv_producer` prefill node running the\
      \ same model on the other 8 chips (any model with an MTP head reproduces; a\
      \ synthetic random-weight one also works, e.g. `luccafong/deepseek_mtp_main_random`):\n\
      \n```bash\nvllm serve /path/to/model \\\n  --port 9002 \\\n  --data-parallel-size\
      \ 8 \\\n  --max-num-batched-tokens 256 --max-num-seqs 16 \\\n  --enforce-eager\
      \ \\\n  --speculative-config '{\"method\":\"deepseek_mtp\",\"num_speculative_tokens\"\
      :1}' \\\n  --additional-config '{\"recompute_scheduler_enable\":true}' \\\n\
      \  --kv-transfer-config '{\"kv_connector\": \"MooncakeConnectorV1\", \"kv_role\"\
      : \"kv_consumer\", \"kv_port\": \"30200\", \"engine_id\": \"2\", \"kv_connector_extra_config\"\
      : {\"prefill\": {\"dp_size\": 1, \"tp_size\": 8}, \"decode\": {\"dp_size\":\
      \ 8, \"tp_size\": 1}}}'\n```\n\nFull traceback of the first EngineCore (paths\
      \ shortened; every DP rank shows the same):\n\n```text\n(EngineCore_DP0 pid=151)\
      \ Traceback (most recent call last):\n(EngineCore_DP0 pid=151)   File \"vllm/v1/engine/core.py\"\
      , line 1342, in run_engine_core\n(EngineCore_DP0 pid=151)     engine_core.run_busy_loop()\n\
      (EngineCore_DP0 pid=151)   File \"vllm/v1/fault_tolerance/engine_core_sentinel.py\"\
      , line 179, in run_with_fault_tolerance\n(EngineCore_DP0 pid=151)     \n\n……（中段裁剪）……\n\
      \n`Request` class of the paired vLLM (v0.27.1), nor on current vLLM main, and\
      \ there is no definition/setattr/patch for it anywhere in vllm-ascend (this\
      \ is the only read in the repo). Since `scheduled_spec_token_ids` is populated\
      \ on every decode step of every spec-decode request (vllm/v1/core/sched/scheduler.py:731-739),\
      \ the `and` chain always reaches the missing attribute — recompute + spec decoding\
      \ cannot avoid it. The recompute scheduler is runner-agnostic core code, hence\
      \ V1 and V2 behave identically (verified both: V2 single-box and V1 two-node\
      \ 1P1D crash on the same line; with speculative decoding removed, the same topology\
