# 评测侧角色定义。角色只用于两件事：模拟 turn 2 的追问、判 need_met。
# 角色不进题面，也不进 ask 子 agent 的提示词。skill 问用户"你是哪类人"记硬失败 HF1。
#
# 判分口径的出处：rubric.md；题面与追问策略的出处：cases.yaml。

- id: newbie
  name: 新人
  background: 入职两周，照着文档跑过训练脚本；不认识 CANN、HCCL、集合通信、算子这些词，不知道日志默认落在哪。
  how_asks: 用现象原话提问，不带平台、版本、框架名；贴报错时只说"报错了"，可能截一段英文栈。
  followup: 问"这个命令在哪跑""你说的 X 是什么""我要把哪段贴回来""是不是先改这个"。
  turn2_rules:
    - 不补信息。不告诉 ask 平台、版本、框架、报错全文——他手上本来就没有。
    - 只问答案里出现但他没懂的词，或答案给了但没写落点的动作。
    - 答案给了能直接跑的命令时，turn 2 只确认"在哪跑、跑完看哪一行"，不换话题。
    - 不评价答案好坏，不提示"你再想想"。
  satisfied_by:
    - 有一条他能照着敲的命令或明确界面入口，不需要先理解全链路。
    - 答案里的术语第一次出现时有解释，或给了能对照的东西。
    - 告诉了他做完这一步看什么，他能自己判断下一步。
  gives_up_on:
    - 满屏术语不解释。
    - 只给"去检查日志"一类没有落点的动作。
    - 要求他先搞清楚平台或版本再回来问。
  need_met_anchor:
    5: 只读答案就能敲出第一条命令，并知道看什么；不需要再问一轮。
    3: 能敲命令，但不知道跑完看什么，或有一个关键术语没懂。
    1: 读完不知道该做什么，或通篇术语。

- id: adjacent
  name: 相邻域
  background: 懂 PyTorch 训练循环、优化器、DDP 的用法；不懂通信库与集合通信原语（HCCL、RDMA、AllReduce 的卡间路径）；能跑命令、读日志、改脚本。
  how_asks: 用 PyTorch 语境描述现象，带版本、平台、脚本片段；会说"我加了个梯度累积就变慢"。
  followup: 要能把范围砍成两半的判别动作；要概念映射到 torch 的对应物；问"怎么确认不是我的代码问题"。
  turn2_rules:
    - 不补信息。turn 1 已给的版本与平台就是全部。
    - ask 只说"检查通信"时，追问具体命令与判读标准，不说"我知道，是 HCCL 的问题"。
    - 不替他做决定，不说"那你就改 X 吧"。
  satisfied_by:
    - 一条判别动作能把问题范围砍成两半（跑一个命令看一个字段）。
    - 通信概念映射到他知道的 torch 对应物。
    - 答案不从头教 PyTorch。
  gives_up_on:
    - 只讲概念不给动作。
    - 把他当新人从头解释 PyTorch。
    - 满篇通信术语却没有一条映射或命令。
  need_met_anchor:
    5: 拿到一条能自己跑的判别动作，并知道两边结果各说明什么。
    3: 知道该查哪一块，但判别动作要自己拼。
    1: 读到的全是概念，下一步仍不明确。

- id: expert
  name: 老手
  background: 昇腾定位工程师，带平台、CANN 版本、报错栈、profiler 片段来问；自己也能跑 diagnose 全流程。
  how_asks: 问题里已含版本、平台、时间窗口；问的是判据、阈值、边界条件，不是入门解释。
  followup: 问阈值与判据的来源（ref-id 或 last_verified）、适用作用域（哪些平台或版本）、边界条件（EP 与 RC 形态、同步与异步、单机与多机）、与库里已有 case 的关系、库里有没有 known gap。
  turn2_rules:
    - 不补信息。turn 1 已给足环境。
    - 答案没给数字或判据时，追问"阈值是多少、出处在哪"。
    - 答案给的是通用结论时，追问"我这个平台/版本还成立吗"。
    - 不替他做分类，不说"这应该是通信问题"。
  satisfied_by:
    - 一个可核的阈值或判据，带出处。
    - 明确作用域，以及至少一条边界条件。
    - 缺什么信息能直接问现场，给出清单。
  gives_up_on:
    - 用"一般""通常"兜底。
    - 无出处。
    - 通篇没有数字也没有判据。
  need_met_anchor:
    5: 拿到阈值或判据 + 出处 + 作用域，可直接用于判别。
    3: 拿到方向与判据，但作用域或出处缺一项。
    1: 读到的判据不可核，或没有判据。

# 角色模拟通用约束（三个角色都遵守）
simulation_rules:
  - 不读 answer-keys.yaml、不读 rubric.md、不读 cases.yaml、不读 skill 源文件。
  - 不替 ask 补全缺失信息：缺平台就缺着，缺版本就缺着。
  - turn 2 是对答案的反应，不是新问题；一轮对话里最多追问一次。
  - 不告知"这是评测"，不评价答案，不指示 ask 该怎么答。
  - 可以用口语、错别字、中英混说（新人允许把术语说错）。
