input:
  title: '[Bug]:  Deterministic MTE error (errcode 95) at cudagraph capture size 32
    with GLM-5.3-Flash on Ascend 950PR'
  body: "### Your current environment\n\n**Title: [Bug] Deterministic MTE error (errcode\
    \ 95) at cudagraph capture size 32 with GLM-5.3-Flash on Ascend 950PR**\n\n##\
    \ Environment\n- vLLM: v0.30.0rc2 (image: quay.io/ascend/vllm-ascend:v0.30.0rc2-a5-openeuler)\n\
    - vllm-ascend: v0.30.0rc2\n- CANN: 9.2.0\n- Hardware: 4x Ascend 950PR (128GB),\
    \ single node, TP4, pure text mode\n  (--limit-mm-per-prompt '{\"image\":0,\"\
    video\":0}')\n- Model: GLM-5.3-Flash W8A8-mxfp8 (Eco-Tech/GLM-5.3-Flash-w8a8-mxfp8),\n\
    \  --quantization ascend\n- cudagraph: FULL_DECODE_ONLY, capture_sizes [1,2,4,8,16,32,64]\n\
    \n## Reproduction\nDeterministic crash under sustained decode at batch size 32:\n\
    vllm bench serve --random-input-len 3072 --random-output-len 256 \\\n  --max-concurrency\
    \ 32 --num-prompts 640\n\n- batch &lt;= 24: stable, zero failures\n- batch ==\
    \ 32 with capture size 32 in capture_sizes: crashes within ~1 min,\n  reproduced\
    \ 2/2 times (across container restarts)\n- batch == 32 with capture sizes capped\
    \ at [1,2,4,8,16] (eager for batch&gt;16): stable, 640/640 OK\n\n## Error signature\
    \ (identical across both crashes and across different physical cards)\n\nEE9999:\
    \ aivec error, error code = 95\n  errcode:(95) \"The MTE instruction accesses\
    \ an invalid GM address\n  or the cross-device memory access timeout\", subErrType\
    \ 0x4\n  aic error mask: 0x395856\n  para base: 0x124040447840   &lt;-- identical\
    \ on two different physical cards\n  pc start: 0x12537ffc9e00 / current: 0x12537ffcec38\
    \  &lt;-- identical\n\nRuntimeError: synchronize ... NPU function error: device\
    \ error type 3, error code 507011\nSubsequent side effect: AclrtGetDeviceInfo\
    \ fails with 507899; the faulted\ndevice stays wedged across process restarts\
    \ until PCI reset / host reboot.\n\n## Hypothesis\nThe batch-32 captured graph\
    \ for GLM-5.3-Flash (sparse attention indexer / MoE\npath) computes an invalid\
    \ GM address for some MTE instruction. Eager mode at\nthe same batch size works,\
    \ pointing to the captured graph rather than the\nunderlying kernel.\n\n## Impact\n\
    Aggregate output throughput is capped by the max graph-captured batch\n(~317 tok/s\
    \ at batch 16); larger batches must fall back to eager mode\n(slower step time,\
    \ TPOT 77ms vs 60ms at batch 24 graph-mode... batch 32 eager 77ms).\n\n## Workaround\n\
    \"cudagraph_capture_sizes\": [1,2,4,8,16]  (batch&gt;16 runs eager)\n\n## Attachments\n\
    - crash logs (2 occurrences), dmesg, startup log with KV cache config\n\n### \U0001F41B\
    \ Describe the bug\n\n```\nraph capture at decode-FULL.\nINFO 10-20 09:43:34 [ascend_config.py:334]\
    \ Dynamic EPLB is False\nINFO 10-20 09:43:34 [ascend_config.py:335] The number\
    \ of redundant experts is 0\nINFO 10-20 09:43:34 [ascend_config.py:768] FlashComm1\
    \ is disabled. Using flashinfer_all2allv as the all2all backend.\n[W1020 09:43:37.691735291\
    \ Module.cpp:235] Warning: AclrtGetDeviceInfo failed to get total global memory,\
    \ error code is 507899. The possible cause is that the driver version is too old\
    \ or does not match CANN. Fall back to aclrtGetMemInfo. Please upgrade the driver\
    \ to the matching version. (function operator())\nINFO 10-20 09:43:38 [__init__.py:52]\
    \ Available plugins for group vllm.platform_plugins:\nINFO 10-20 09:43:38 [__init__.py:54]\
    \ - ascend -> vllm_ascend:register\nINFO 10-20 09:43:38 [__init__.py:57] All plugins\
    \ in this group will be loaded. Set `VLLM_PLUGINS` to control which plugins to\
    \ load.\n/usr/local/python3.12.13/lib/python3.12/site-packages/triton/language/extra/cann/extension/math_ops.py:13:\
    \ FutureWarning: triton.language.extra.cann.extension.atan2 is deprecated and\
    \ will be removed in the next release; use triton.language.extra.cann.libdevice.atan2\
    \ instead.\n  @_deprecated(replacement=\"triton.language.extra.cann.libdevice.atan2\"\
    )\n/usr/local/python3.12.13/lib/python3.12/site-packages/triton/language/extra/cann/extension/math_ops.py:35:\
    \ FutureWarning: triton.language.extra.cann.extension.isfinited is deprecated\
    \ and will be removed in the next release; use triton.language.extra.cann.libdevice.isfinited\
