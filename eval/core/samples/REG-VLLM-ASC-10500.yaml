id: REG-VLLM-ASC-10500
status: active
object_type: diagnosis
origin: core
purpose: regression
source: https://github.com/vllm-project/vllm-ascend/issues/10500
input:
  phenomenon: '含 ViT 的多模态/VL 模型（如 Step3p7 w8a8，TP=8）开启 FlashComm1（VLLM_ASCEND_ENABLE_FLASHCOMM1=1）+
    FlashComm2（VLLM_ASCEND_FLASHCOMM2_PARALLEL_SIZE=1）+ MTP 时启动/初始化崩溃：AssertionError:
    Forward context is not set. Please use `set_forward_context` to set the forward
    context.；报错栈在 vllm_ascend/ops/linear_op.py：SequenceRowParallelOp.apply_impl（torch.ops.vllm.matmul_and_reduce）与
    Flashcomm2OProjRowParallelOp.apply_impl（_EXTRA_CTX.pad_size），经 ascend_forward_context.py
    _ExtraForwardContextProxy.__getattr__ → get_forward_context() 断言；decode 阶段伴随 NPU
    硬件崩溃：RuntimeError: LaunchCopyTask: aclrtMemcpyAsync, error code is 507035 / The
    DDR address of the MTE instruction is out of range / Kernel task happen error
    retCode=0x31 [vector core exception]；运行期 fallback 报 RuntimeError: aclnnAddmm failed,
    error code 161002 / AclNN_Parameter_Error(EZ1001): The k-axis of the two inputs
    are different；官方 fix：PR #10941 对三条 dispatch 路径（SequenceColumnParallelOp/SequenceRowParallelOp/Flashcomm2OProjRowParallelOp）加
    ''vision_model'' not in prefix guard 跳过 ViT，文本模型不受影响'
  environment: ''
  evidence:
    case: VLLM-ASC-10500
    references:
    - https://github.com/vllm-project/vllm-ascend/issues/10500
    - https://github.com/vllm-project/vllm-ascend/pull/10941
expected:
  resolution: 'vLLM 对多模态（含 ViT）模型在 forward_context 之外预计算 inputs_embeds；vllm-ascend
    的 FlashComm1/2 dispatch 在 SP column/row-parallel 与 FlashComm2 row-parallel 线性算子路径上
    未排除 ViT 层（模块 prefix 含 "vision_model"），把 ViT 前向路由到依赖 forward context 的算子 （SequenceRowParallelOp.apply_impl
    → matmul_and_reduce、Flashcomm2OProjRowParallelOp.apply_impl → _EXTRA_CTX.pad_size）。此时
    _EXTRA_CTX 为空、FC1/FC2 flags 不可用，get_forward_context() 断言失败导致启动崩溃；decode 阶段则表现为
    NPU 内存损坏后的 LaunchCopyTask 507035 / vector core exception（MTP 投机下更早暴露）。PR #10941
    在三条 dispatch 路径加 "vision_model" not in prefix guard，ViT 层不再进入 FC1/FC2 路由。



    升级到包含 PR #10941 的版本（merged main 2026-07-10，v0.23.0 验证）——对 SP column-parallel （SequenceColumnParallelOp）、SP
    row-parallel（SequenceRowParallelOp）、FlashComm2 row-parallel （Flashcomm2OProjRowParallelOp）三条
    dispatch 路径加 "vision_model" not in prefix guard，ViT 层 跳过 FlashComm1/2 dispatch；文本-only
    模型（prefix 不含 vision_model）不受影响。'
  case: VLLM-ASC-10500
