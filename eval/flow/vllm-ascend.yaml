      \ MODEL_PATH=\"/a3_inference/itask/workdir/models/glm5.1-w8a8-v2\"\nexport DATA_PARALLEL_HEAD_ADDRESS=${DATA_PARALLEL_HEAD_ADDRESS:-\"<内网IP>\"}\nexport VLLM_ASCEND_MOONCAKE_TRANSFER_DFX=0\n# Basic\n\
