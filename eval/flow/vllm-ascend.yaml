      \ badcase → 仍乱码。\n  - 对照:若服务起来后先发一个普通请求,再发 badcase → 不乱码。\n\n**现象**\n\n  1. 服务拉起后首个请求是 badcase → 输出乱码(随机英文,与 prompt 无关)。\n  2. 此时发别的普通请求 → 无乱码。\n  3. 继续多次发 badcase → 均乱码。\n  4. 但若服务拉起后第一个请求是普通请求(非\
      \ badcase)→ 不出现乱码(即使后续发 badcase 也不乱)。\n  5. 短 prompt(如\"1+1\")正常。\n  6. P 节点改 DP=4(无 PP)→ 不乱码\n\n**已做的实验(消融,均已排除与本问题直接相关)**\n\n  - 关闭 MTP\n  - 关闭 prefix cache(P、D 分别)\n  - 关闭 reasoning parser\n  -\
      \ kvcache 清零(dummy run 后强行覆盖赋值)\n  - 回退 slot mapping=-1(claudecode 偶现乱码修复 PR)\n  - drafter slot mapping=-1(对上一修复 PR 的补充)\n  - 关闭图模式(enforce_eager)\n  **均存在乱码现象**"
    truncated: false
  expected:
    root_cause_summary: 'PD 分离 + PP4 下，P 侧 prefill 每层把 k_pe 写入 kv_cache[1]（V cache）后经 kv_ag_handle.wait() 等待 all-gather 完成，但未同步 NPU 当前流；D 侧 ascend_direct RDMA pull 在 prefill forward 返回后立即读取 k_pe，读到尚未落盘/对跨
      engine 不可见的陈旧值。 每个 PP stage 边界（layer 20→21、40→41、60→61）引入一次偏差，首请求（PP 时序冷启动 + 特定 content）输出乱码。修复：vllm_ascend/attention/sfa_v1.py 在 kv_ag_handle.wait() 后加 torch.npu.current_stream().synchronize()（PR
      #14269）。 '
    root_cause_keywords:
    - ascend_direct
    - current_stream
    - kv_ag_handle
    - kv_cache
    - sfa_v1.py
    - synchronize
    leak_critical:
    - current_stream
    - kv_ag_handle
    - kv_cache
    - sfa_v1.py
    - synchronize
    resolution: '升级到包含 PR #14269 的版本；或本地在 vllm_ascend/attention/sfa_v1.py 的 enable_dsa_cp 分支 kv_ag_handle.wait() 后追加 torch.npu.current_stream().synchronize()（每层一次，仅 P 侧生效）。 '
