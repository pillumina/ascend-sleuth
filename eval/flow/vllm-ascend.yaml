      \ --enable-prefix-caching --data-parallel-size 2 --data-parallel-size-local 1 --data-parallel-address <内网IP> --data-parallel-rpc-port 14435 --data-parallel-start-rank 0 --tensor-parallel-size 16 --pipeline-parallel-size\
      \ 1 --enforce-eager --enable-auto-tool-choice --tool-call-parser glm47 --reasoning-parser glm45 --seed 1024 --quantization ascend --enable-expert-parallel --speculative-config '{\"num_speculative_tokens\"\
      : 2, \"method\":\"deepseek_mtp\"}' --additional-config '{\n    \"layer_sharding\":[\"q_b_proj\", \"o_proj\"],\n    \"multistream_overlap_shared_expert\":true,\n    \"enable_npugraph_ex\": true,\n\
      \    \"fuse_muls_add\":true,\n    \"recompute_scheduler_enable\" : false\n}' --kv-transfer-config '{\n        \"kv_connector\": \"MooncakeConnectorV1\",\n        \"kv_connector_module_path\": \"vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector\"\
      ,\n        \"kv_buffer_device\": \"npu\",\n        \"kv_role\": \"kv_producer\",\n        \"kv_parallel_size\": 2,\n        \"kv_port\": \"20002\",\n        \"engine_id\": \"prefill-0\",\n       \
      \ \"kv_rank\": 0,\n        \"kv_connector_extra_config\": {\n            \"use_ascend_direct\": true,\n            \"prefill\": {\n                    \"dp_size\": 2,\n                    \"tp_size\"\
      : 16,\n                    \"pp_size\": 1\n             },\n             \"decode\": {\n                    \"dp_size\": 8,\n                    \"tp_size\": 4\n             }\n        }\n    }'`\n\
      ~~~\nD节点：\n~~~\nif [ \"$#\" -ne 1 ]; then\n    echo \"Usage: $0 <node_rank>\"\n    echo \"<node_rank> should start from 0 for both prefill and decode.\"\n    exit 1\nfi\n\ncurrent_dir=$(dirname \"\
