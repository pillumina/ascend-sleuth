_meta:
  purpose: 流程类先验知识（methodology）评测池：加载哪条流程 / 加载多深，对诊断结论的影响（EV-2026-038）
  repo: vllm-project/vllm-ascend
  fetched_at: '2026-09-10'
  split: selection
  n: 13
  construction:
  - input = 上游 issue 首帖正文（**不含标题**——标题常直接写根因）
  - held_out_case 必须在本轮检索中排除（否则直接命中 case，测不到方法）
  - root_cause_keywords = case root_cause 的决定性词（跨样本 DF≥4 的通用词已剔除），供打分用，不提供给被测 agent
  - leak_critical = 决定性词中「不出现在 case symptoms 里」的子集（症状词是观察量、不是隐藏机制）——泄露扫描用这一列
  - leakage = leak_critical 是否出现在 input 中（clean = 未出现）
  - flow_relevant=null 含两类：①从未有流程覆盖；②原流程被降级归档（见 flow_relevant_note）
samples:
