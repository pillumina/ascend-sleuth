      eth0\"\nexport MODEL_PATH=\"/a3_inference/itask/workdir/models/glm5.1-w8a8-v2\"\nexport DATA_PARALLEL_HEAD_ADDRESS=${DATA_PARALLEL_HEAD_ADDRESS:-\"<内网IP>\"}\nexport VLLM_ASCEND_MOONCAKE_TRANSFER_DFX=0\n\
      # Basic\nexport TASK_QUEUE_ENABLE=1\nexport OMP_PROC_BIND=false\nexport OMP_NUM_THREADS=6\nexport PYTORCH_NPU_ALLOC_CONF=expandable_segments:True\nexport LD_PRELOAD=/usr/local/lib/libjemalloc.so.2:${LD_PRELOAD}\n\
      \n# System\nexport CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH:/usr/include/c++/12/:/usr/include/c++/12/x86_64-openEuler-linux/\nexport CPLUS_INCLUDE_PATH=\"/usr/local/Ascend/ascend-toolkit/8.2.RC1/toolkit/toolchain/hcc/aarch64-target-linux-gnu/include/c++/7.3.0/:/usr/local/Ascend/ascend-toolkit/8.2.RC1/toolkit/toolchain/hcc/aarch64-target-linux-gnu/include/c++/7.3.0/aarch64-target-linux-gnu/:${CPLUS_INCLUDE_PATH}\"\
      \n\n# Workdir\nexport VLLM_TORCH_PROFILER_DIR=${VLLM_TORCH_PROFILER_DIR:-\"/tmp/theta_workdir/profiles\"}\nexport VLLM_WORKDIR=\"/tmp/theta_workdir/current\"\n\n# Stability\nexport SHM_BARRIER=true\n\
      export HCCL_OP_EXPANSION_MODE=\"AIV\"\n# Omni Reject Sampler\nexport VLLM_ASCEND_ENABLE_OMNIINFER_SAMPLER=1\n\n# Ascend\nexport GLOO_SOCKET_IFNAME=${NET_CARD_NAME}\nexport TP_SOCKET_IFNAME=${NET_CARD_NAME}\n\
      export HCCL_SOCKET_IFNAME=${NET_CARD_NAME}\n\n# MoonCake\nexport VLLM_BASE_PORT=9200\nexport MC_LOG_LEVEL=INFO\nexport MC_LOG_DIR=/home/<user>/logs/mooncake\nexport GLOG_alsologtostderr=1\n\nSCENARIO=${SCENARIO:-\"\
      online_my_a3\"}\necho \"Running scenario: ${SCENARIO}\"\nsource \"${current_dir}/parallel_config.sh\"\nEXTRA_PARAMS=$([ $NODE_RANK -ne 0 ] && echo \"--headless\" || echo \"--api-server-count 4\")\n\
      \nexport LD_LIBRARY_PATH=/usr/local/Ascend/asce"
    truncated: true
  expected:
    root_cause_summary: 'GLM-5.1-w8a8 PD 分离 + FULL_DECODE_ONLY 图模式下，dummy/graph-capture run 不走 _prepare_inputs()，所有 kv cache group 的 slot_mapping 未被填充；图捕获时读取到上一 run 残留的未初始化/陈旧 slot 值（并发长短请求改变 batch 结构后更易命中），捕获进图的
      KV 索引 含垃圾值 → decode 偶发错误输出（复读等），重发请求自愈。修复：dummy run 把 slot_mapping 重置为 pad id（PR #11774，vllm_ascend worker 图捕获路径）。 '
    root_cause_keywords:
    - prepare_inputs
    - slot_mapping
    leak_critical:
    - prepare_inputs
    - slot_mapping
    resolution: '升级到含 PR #11774 的 vllm-ascend（main 2026-07-11 合入 b9acec8；首个含修复 tag v0.24.0rc1； PR 测试 env v0.23.0）。无配置 workaround——线程未给，不建议在旧版本绕行（问题偶发且无日志）。 '
- id: FLOW-2026-002
  source_issue: 10710
  category: performance
  namespace: inference/vllm-ascend/performance/
  held_out_case: VLLM-ASC-10710
  flow_relevant: null
  leakage: clean
  leak_hits: []
  input:
    symptoms: "### Your current environment\n\n### 硬件与部署信息\n\n```text\n硬件：Ascend A3，8 张 NPU\n模型：DeepSeek-V4-Flash-w8a8-mtp\n模型路径：/home/<user>/models/DeepSeek-V4-Flash-w8a8-mtp\n\nNPU 数量：8\n数据并行：DP_SIZE=2\n\
      张量并行：TP_SIZE=4\n专家并行：已开启\n\nvLLM 版本：0.20.2+empty  /opt/vllm_src/vllm-0.20.2\nvLLM-Ascend  0.20.2rc1\nCANN 版本：9.0.0\nPyTorch 版本：2.10.0\ntorch-npu 版本：2.10.0\n\nMooncake：未安装、未启用\n外部 KV Connector：未启用\n\
      MTP：未启用\n异步调度：未启用\n```\n\n### 相关启动配置\n\n为了获取更多调试信息，启动前设置：\n\n```bash\nexport VLLM_LOGGING_LEVEL=DEBUG\n```\n\n核心启动命令如下：\n\n```bash\nvllm serve /home/<user>/models/DeepSeek-V4-Flash-w8a8-mtp \\\n \
      \ --served-model-name dsv4 \\\n  --host 0.0.0.0 \\\n  --port 8900 \\\n  --data-parallel-size 2 \\\n  --tensor-parallel-size 4 \\\n  --enable-expert-parallel \\\n  --tokenizer-mode deepseek_v4 \\\n\
      \  --tool-call-parser deepseek_v4 \\\n  --reasoning-parser deepseek_v4 \\\n  --enable-auto-tool-choice \\\n  --quantization ascend \\\n  --max-model-len 35536 \\\n  --max-num-batched-tokens 4096 \\\
      \n  --max-num-seqs 16 \\\n  --gpu-memory-utilization 0.86 \\\n  --block-size 128 \\\n  --enable-prefix-caching \\\n  --no-async-scheduling \\\n  --compilation-config '{\n    \"cudagraph_mode\": \"\
      FULL_DECODE_ONLY\",\n    \"cudagraph_capture_sizes\": [4, 8, 16]\n  }' \\\n  --additional-config '{\n    \"ascend_compilation_config\": {\n      \"enable_npugraph_ex\": true,\n      \"enable_static_kernel\"\
      : false\n    },\n    \"enable_cpu_binding\": true,\n    \"enable_flashcomm1\": true,\n    \"enable_fused_mc2\": true\n  }'\n```\n\n为了排除 Chunked Prefill 对 Prefix Cache 的影响，复现问题时没有传入：\n\n```text\n--enable-chunked-prefill\n\
      ```\n\n最终复现配置为：\n\n```text\nENABLE_PREFIX_CACHING=1\nENABLE_CHUNKED_PREFILL=0\nENABLE_MTP=0\nENABLE_ASYNC_SCHEDULING=0\nDP_SIZE=2\nTP_SIZE=4\n```\n\n### \U0001F41B Describe the bug\n\n## 问题描述\n\n\
      在 `DeepSeek-V4-Flash-w8a8-mtp` 上启用本地 Prefix Cache 后，服务配置和 Metrics 都显示 Prefix Cache 已经开启，但通过普通 `/v1/chat/completions` 接口串行重复发送完全相同的请求时，Prefix Cache 始终没有产生任何命中。\n\n观察到的现象如下：\n\n```text\n1. vllm:cache_config_info\
      \ 中 enable_prefix_caching=\"True\"。\n2. 每次请求后 prefix_cache_queries_total 都正常增长。\n3. prefix_cache_hits_total 始终为 0。\n4. prompt_tokens_by_source_total{source=\"local_cache_hit\"} 始终为 0。\n5. 关闭 Chunked\
      \ Prefill 后问题仍然存在。\n6. 测试使用普通 /v1/chat/completions 接口串行执行，不是同一 batch 内无法复用的问题。\n7. system prompt、user prompt、采样参数和 chat_template_kwargs 完全相同，连续执行 8 次后仍然没有命中。\n8. 所有请求均正常返回 HTTP 200，服务没有崩溃。\n```\n\n\
      当前每个请求约包含：\n\n```text\nprompt_tokens ≈ 10102\n```\n\n8 次完全相同请求的累计指标：\n\n```text\nPrefix 查询 Token 增量：80816\nPrefix 命中 Token 增量：0\nPrefix 命中率：0.00%\n```\n\n相同 System Prompt、不同 User Prompt 的累计指标：\n\n\
      ```text\nPrefix 查询 Token 增量：60584\nPrefix 命中 Token 增量：0\nPrefix 命中率：0.00%\n```\n\n不同 System Prompt 对照组的累计指标：\n\n```text\nPrefix 查询 Token 增量：40480\nPrefix 命中 Token 增量：0\nPrefix 命中率：0.00%\n```\n\n---\n\
      \n## 最小复现代码\n\n```python\nimport time\nfrom dataclasses import dataclass\n\nimport requests\n\nAPI_URL = \"http://127.0.0.1:8900/v1/chat/completions\"\nMETRICS_URL = \"http://127.0.0.1:8900/metrics\"\
      \n\nMODEL = \"dsv4\"\nROUNDS = 8\n\ndef build_system_prompt() -> str:\n    base = \"\"\"\n你是一名专业技术助手。\n\n回答要求：\n1. 使用中文回答。\n2. 内容准确、简洁。\n3. 不要输出无关内容。\n4. 不要输出思考过程。\n\"\"\".strip()\n\n    rules = \"\
      \\n\".join(\n        (\n            f\"补充规则 {i}：回答必须保持技术准确性，\"\n            \"不得遗漏关键条件，不得输出与问题无关的内容。\"\n        )\n        for i in range(1, 401)\n    )\n\n    return base + \"\\n\\n\" + rules\n\n\
      SYSTEM_PROMPT = build_system_prompt()\nUSER_PROMPT = \"请解释什么是 Prefix Cache，并用一句话说明它的主要收益。\"\n\n@dataclass\nclass Metrics:\n    queries: float\n    hits: float\n    local_hits: float\n\ndef metric_sum(\n\
      \    text: str,\n    name: str,\n    required_labels: tuple[str, ...] = (),\n) -> float:\n    total = 0.0\n\n    for line in text.splitlines():\n        line = line.strip()\n\n        if not line\
      \ or line.startswith(\"#\"):\n            continue\n\n        if not line.startswith(name):\n            continue\n\n        if any(label not in line for label in required_labels):\n            continue\n\
      \n        total += float(line.rsplit(None, 1)[1])\n\n    return total\n\ndef read_metrics() -> Metrics:\n    response = requests.get(METRICS_URL, timeout=30)\n    response.raise_for_status()\n\n \
      \   text = response.text\n\n    return Metrics(\n        queries=metric_sum(\n            text,\n            \"vllm:prefix_cache_queries_total\",\n            ('model_name=\"dsv4\"',),\n        ),\n\
      \        hits=metric_sum(\n            text,\n            \"vllm:prefix_cache_hits_total\",\n            ('model_name=\"dsv4\"',),\n        ),\n        local_hits=metric_sum(\n            text,\n\
      \            \"vllm:prompt_tokens_by_source_total\",\n            (\n                'model_name=\"dsv4\"',\n                'source=\"local_cache_hit\"',\n            ),\n        ),\n    )\n\ndef\
      \ main() -> None:\n    payload = {\n        \"model\": MODEL,\n        \"messages\": [\n            {\n                \"role\": \"system\",\n                \"content\": SYSTEM_PROMPT,\n        \
      \    },\n            {\n                \"role\": \"user\",\n                \"content\": USER_PROMPT,\n            },\n        ],\n        \"max_tokens\": 32,\n        \"temperature\": 0.0,\n   \
      \     \"top_p\": 1.0,\n        \"stream\": False,\n        \"chat_template_kwargs\": {\n            \"enable_thinking\": False\n        },\n    }\n\n    test_before = read_metrics()\n\n    for index\
      \ in range(1, ROUNDS + 1):\n        before = read_metrics()\n        started = time.perf_counter()\n\n        response = requests.post(\n            API_URL,\n            json=payload,\n         \
      \   timeout=1800,\n        )\n        response.raise_for_status()\n\n        elapsed = time.perf_counter() - started\n        data = response.json()\n\n        time.sleep(0.5)\n        after = read_metrics()\n\
      \n        usage = data.get(\"usage\", {})\n\n        query_delta = after.queries - before.queries\n        hit_delta = after.hits - before.hits\n        local_hit_delta = after.local_hits - before.local_hits\n\
      \n        hit_rate = 0.0\n        if query_delta > 0:\n            hit_rate = hit_delta / query_delta * 100\n\n        print(f\"轮次={index}\")\n        print(f\"耗时={elapsed:.3f}s\")\n        print(f\"\
      Prompt Token 数={usage.get('prompt_tokens')}\")\n        print(f\"Prefix 查询 Token 增量={query_delta}\")\n        print(f\"Prefix 命中 Token 增量={hit_delta}\")\n        print(f\"本地缓存命中 Token 增量={local_hit_delta}\"\
      )\n        print(f\"Prefix 增量命中率={hit_rate:.2f}%\")\n        prin"
    truncated: true
  expected:
    root_cause_summary: 'DSV4-Flash 属混合压缩 KV（compression_ratio=128）：其 prefix-cache 的最小可命中前缀长度 放大为 block_size×128（block_size=128 → 16k；开启 MTP/投机解码再翻倍 → 32k）。线程请求 prompt ≈10.1k，恒低于命中下限——完全相同请求（含 system-prompt
      复用组）也永远无法命中， prefix_cache_hits_total 保持 0、每请求全量 prefill。block_size=32 把下限降到 4k（MTP 8k）。 0.22.1rc1 及更早即使 block32 仍有残案，v0.23.0rc1（RFC #10517 系列）解决。 '
    root_cause_keywords:
    - block_size
    - compression_ratio
    - prefix_cache_hits_total
    leak_critical:
    - compression_ratio
    resolution: 'A) 配置：--block-size 32（最小命中长度 16k→4k，MTP/投机开则 8k），命中恢复正常； B) 若在 0.22.1rc1 及更早仍复现 → 升级 vllm-ascend ≥ v0.23.0rc1（含 prefix-cache/混合 KV 修复系列， 跟踪 RFC #10517 / vllm-ascend #10009；上游 retention
      相关 vllm #43447/#45845）。 '
- id: FLOW-2026-003
  source_issue: 10876
  category: performance
  namespace: inference/vllm-ascend/performance/
  held_out_case: VLLM-ASC-10876
  flow_relevant: null
  leakage: clean
  leak_hits: []
  input:
    symptoms: "### Your current environment\n\n### \U0001F41B Describe the bug\n\n### The phenomenon\n\n+ **Explanation of Long Prefill Duration**\n\nUsing evalscope perf for load testing, with **concurrency\
      \ set to 1, max-tokens=1** to generate only one token, testing the extreme Prefill performance:\n\n```shell\nminturn=4\nmaxturn=4\nevalscope perf \\\n  --url \"http://$host:$port/v1/chat/completions\"\
      \ \\\n  --model default-model \\\n  --tokenizer-path $model_path \\\n  --api-key \"sk-test\" \\\n  --api openai \\\n  --tokenizer-path $model_path \\\n  --dataset random_multi_turn \\\n  --multi-turn\
      \ \\\n  --min-turns $minturn \\\n  --max-turns $maxturn \\\n  --min-first-turn-length 45000 \\\n  --max-first-turn-length 55000 \\\n  --min-prompt-length 800 \\\n  --max-prompt-length 1200 \\\n  --max-tokens\
      \ 1 \\\n  --parallel 1 \\\n  --number 1 \\\n  --stream \\\n  --read-timeout 1800 \\\n  --outputs-dir $results_dir \\\n  --extra-args '{\"ignore_eos\": true}'\n```\n\nAs shown in the test command above,\
      \ the initial input prompt length is around 50,000 tokens, with approximately 1,000 tokens appended per round in a 4-round conversation. \nIn multi-turn conversation scenarios, the average prefill\
      \ duration is 5.6 seconds, with P90/P99 values at 7.3 seconds, which is quite long\n\n```plain\n               Latency Percentile Distribution   [TTFT: ms,  Lat: s]\n┏━━━━━━┳━━━━━━━━━┳━━━━━━━━━┳━━━━━━━━━┳━━━━━━━━━┳━━━━━━━━┳━━━━━━━━┳━━━━━━━━┳━━━━━━━┓\n\
