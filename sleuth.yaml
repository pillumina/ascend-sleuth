# 唯一部署配置：角色、评估策略、成本 profile、RSI store、知识库同步。
# 旧 deployment.yaml / eval/policy*.yaml / .s2-replay/evolve/store.yaml 只作兼容读取。
# 完整字段说明见 docs/mechanism/evolution-config.md；本文件只写一个部署的实际取值。
schema: sleuth-config-v1

deployment:
  name: ascend-sleuth

evolution:
  # maintainer：有真实样本/runner/judge，可跑 RSI；signal-only：只记信号；off：关闭演进记录。
  role: maintainer

  store:
    # local：JSONL 文件；memory：仅进程内（测试/演练）。
    backend: local
    path: .s2-replay/evolve/rsi-events.jsonl

  policy:
    autonomy:
      # 审批档位（专业名称，内部映射到 RFC 的 A0–A5）：
      # observe=只观察 / propose=逐项提议 / batch_review=按批人审（默认，A2）/
      # supervised_auto=低风险自动合并（A3，需 auto_merge）/ policy_auto=边界内自调 /
      # full_auto=全自动（本期不做）。
      default: batch_review
      overrides:
        docs.non_normative: supervised_auto
        docs.normative: propose
        feedback.candidate: supervised_auto
        feedback.pool: batch_review
      auto_merge:
        # true 才允许 A3 自动合并；false 时 A3 降为 A2。
        enabled: false

    objective:
      # 主指标：case_hit（命中 case）/ root_cause（根因一致）/ rubric（评分）。
      primary_metric: case_hit
      # 任一不通过即拒绝；允许追加自定义约束名。
      hard_constraints:
        - safety
        - fix
        - regression
        - test

    decision:
      # paired_binary：同一批样本上的二元配对判定。
      method: paired_binary
      # 显著性阈值，越小越严格。
      alpha: 0.10

    samples:
      # 各阶段的最小样本数；field_evaluation 是主评估样本数。
      core_regression: 30
      field_evaluation: 9
      test: 4
      # 抽测试集的切分方式：hash（按内容稳定切分）/ group（按组切分）。
      split: hash
      # 可选：按 stratum 名覆盖该层目标数，例如 {"inference": 4}。
      strata: {}

    cost:
      # 主成本：tokens / tool_calls / rounds / elapsed_time。
      primary_cost_metric: tokens
      # 计费口径：billed / uncached / out / uncached_out / cache_read / calls / rounds / ms / time。
      budget_metric: billed
      # 允许的最大成本上涨比例（0.10 = 最多贵 10%）。
      maximum_cost_increase_ratio: 0.10
      # 成本路径要求的最小下降比例（0.10 = 至少便宜 10%）。
      minimum_cost_improvement: 0.10
      # 质量非劣边界；0 表示不允许质量下降。
      max_quality_drop: 0
      runs:
        max_pairs: 9
        max_tokens: null
        early_stop: true
        baseline_reuse: true
        regression_pairs: 6
        regression_full_pairs: 30
        benchmark_runs: 3

    experiment:
      target: skill
      algorithm: baseline
      # stages 使用内置 registry 默认；要覆盖时再加 stages 映射（高级配置，见配置文档）。
      budget: {}
      seed: 0

    rubrics:
      case_version: case-v1
      reference_version: ref-v1
      threshold: 0.70
      double_label: 10

  profiles:
    latency:
      cost:
        # 延迟优先 profile：只覆盖主成本，不改变其余策略。
        primary_cost_metric: elapsed_time

sync:
  # auto：允许联网 fetch；offline：只读本地。
  mode: auto
