# 演进闭环的判据（数据）——由 scripts/evolution_health.py 读，面板只渲染不重算。
#
# 为什么需要这一层：面板旧版把 EV 卡当实时看板画（状态分组 + 卡片平铺），实测退化成一堵
# "只增不减的墙"——终态卡全部落在 validated、否决为 0、采纳率恒为 100%，于是任何聚合读数
# 都是常数，人读不出信息、也不再读。根因不在视觉，在于**没有判决层**：指标侧早有
# metrics/gates.yaml + metrics_health.py（判据落成数据、三态退出码、只报要动作的），
# 演进侧一直缺同构的一层。本文件就是那一层的数据面。
#
# 写作纪律（2026-09 加，起因是初版文案被读成口径不精确）：
#   - title/reading 用**术语**，不用修辞：说"零否决记录""外部验证占比不足"，
#     不说"从未说过不""自证过多"——后者读着顺口，但没法当判据名引用，也容易被读成价值判断。
#   - meaning 只陈述**可核对的机制事实**，不评价好坏；action 只给**可执行的下一步**。
#   - 每条 value 是**假设**，接受实测重校（原则十一）；调整要写进 PR 说明，不悄悄改。
#   - 判据的**实现**在 scripts/evolution_health.py（对应 IMPLEMENTED_GATE_DIMENSIONS）；
#     "声明了但没实现"由覆盖面对比检出 → --check 退 2（不是 0），防假绿。
#   - 分母为 0 / 数据源缺席时标"不可解读"，禁止把 0/N 读成"零问题"。
#   - 每条 meaning/action 写成**单行**：折叠标量按行断句时会在句中插入空格，
#     实测渲染出"命中率升， 还是"这类带空格的句子。

version: 1

# ---- 新鲜度：演进是否仍在运行（对应 metrics 侧的 freshness 面）----
freshness:
  # 内容流程/深度轮的收尾距今超过该天数 = 演进停摆（不是"没问题"，是"没在看"）
  evolve_check_max_age_days: 14
  # 最新一张卡距今超过该天数 = 产卡停滞
  card_max_age_days: 21

# ---- 越界：哪些需要动作 ----
# op 支持 > >= < <= == !=；dimension 是脚本提供的数值维度（见 evolution_health.IMPLEMENTED_GATE_DIMENSIONS）
gates:
  - id: no_negative_feedback
    dimension: negative_terminal
    op: "=="
    value: 0
    min_sample: 20
    title: 零否决记录
    meaning: "终态卡中「不采纳」（rejected）与「换方向」（superseded）合计为 0，即全部为「已采纳」。此类分布下，采纳记录不能单独作为质量结论。"
    action: "复核产卡触发条件（见 skills/evolve-check）：确认是触发过严（只提交确定性高的候选），还是验证方式不足以区分对错。若属后者，应改验证设计。"

  - id: backlog_over
    dimension: backlog_count
    op: ">"
    value: 20
    title: 已验证卡缺合入指针
    meaning: "已验证但卡文本里没有任何合入指针（PR/issue 号）的卡数超过上限。批上限为 10 卡/PR，此阈值等于「已攒满两批仍未送审」。注意读数口径：它数的是**指针有没有回写**，不等于「改动有没有合入」——实测一批 7 张卡随同一个 PR 合入 main，7 张全部无指针；因此超限时的第一动作是回写指针把读数与事实对齐，回写后仍高的部分才是真未合入。分子口径的**唯一实现**是 scripts/ev_proposal.py 的 has_merge_pointer()（扫全卡文本，`--waterline` 与该函数同源；面板与体检经 ev_board_data 也走它）——此前两处各写一份、日常读数不等（实测同一时刻 0 张 vs 8 张）。"
    action: "先回写指针：python3 scripts/ev_proposal.py --mark-merged --from-prs（按已合入 PR 逐卡匹配、匹配不上的如实报出；写进卡的 decisions，保留注释、可重复执行）；再跑一次 python3 scripts/ev_proposal.py --waterline 确认剩余量。剩余量仍超上限时按 orchestration §2.4 处置（停产新候选、先消化积压）。不要用 --all-pending：它把同一个 PR 号写给所有待回写卡，混入旧批的卡就是假数据。"

  - id: measure_never_run
    dimension: runnable_never_measured
    op: ">"
    value: 0
    title: 预测未复现
    meaning: "已声明可复现判据（measure 含 command 与期望）但从未执行过 ev_measure.py --run 的卡数。本判据只统计判据命令是否被执行，不判断预测对错。"
    action: "复核这些卡片时执行一次：python3 scripts/ev_measure.py <卡号> --run。执行记录写入 metrics/ev-measure-log.yaml。"

  - id: evidence_stale
    dimension: external_verification_stall
    op: ">"
    value: 20
    title: 外部验证停滞
    meaning: "最近一张「验证来自系统之外」（golden 回放 / issue-replay 对照）的终态卡之后，又产出的终态卡数超过上限。它问的是**通道还在不在用**，不是自证的比例高低——实测原判据（外部占比下限 1/3）在本仓库的卡构成下不可达，见替换说明。"
    action: "跑一次外部验证并从它产出一张卡：把一条 case 的签名拿到 issue 池里找同签名的非来源 issue 回放（第三类样本），或对改动跑一次 golden 回放；拿回放结果做判据的卡把 validation.method 记成 issue_replay / golden_replay。替换说明：本判据原先数的是 external_ground_truth_ratio（外部验证卡占比，下限 1/3），实测不可达——123 张终态卡里只有 14 张方法能走外部，其余 66 张是 metrics_compare（可复现命令，客观但非外部）、43 张是 scan_review（自审），而这两类被改的组件能由回放「碰到」的只有个位数，可达上限约 18%；且原 action 文案自己就写着「只能自证的卡片…不计入外部验证」，即把这些卡排除出分子却留在分母里，无论怎么处置都到不了下限。占比降为读数（可复现证据占比一并列出）。"

  - id: component_repeat_dominant
    dimension: top_component_share
    op: ">="
    value: 0.25
    min_sample: 20
    title: 同一组件重复做功
    meaning: "被改得最多的那个组件，占全部卡的比例达到阈值。判据问的是「演进是否在同一处反复做功」——组件键取卡里填的 target_component，缺省回退到卡文本指到的改动落点（与面板同源归因）。替换说明：本判据原先数的是「单一触发信号占比」，实测该读数不成立——最高信号 process_friction 的 35 张卡散在 27 个组件上（脚本 12 / skill 正文 10 / 文档 7 / CI 2 / 面板 2），它是语义剩桶而不是同一假设空间被主导；信号分布仍作为读数保留在面板，不再当判据。"
    action: "先看该组件上各次尝试的结局：`python3 scripts/ev_proposal.py --impact <组件>`——有结局分歧（有否决/换向）说明方向已被否过，别重提；全是 adopted 则是同一处在持续打磨，考虑把该组件拆细或改成结构性方案，而不是继续逐次小改。"

  - id: pointer_rot
    dimension: dead_ref_count
    op: ">"
    value: 0
    title: 引用路径失效
    meaning: "卡片正文引用的仓库文件已不存在（重命名或删除后未同步更新）。本判据只统计路径引用是否失效，不判断卡片结论是否仍成立。"
    action: "逐条复核这些卡片：结论仍成立时更新路径引用；结论依赖已消失文件时，把卡片标为 superseded，或补充证据后重写结论。"

  - id: unfalsifiable
    dimension: unfalsifiable_enforced
    op: ">"
    value: 0
    title: 预测口径缺失
    meaning: "预测口径强制生效（created_at 不早于 measure cutover）之后产出的卡中，既无 command 也无 reason 的卡数。CI（verify_proposals --check）已对此设硬门，本判据是面板侧复核；早于该时间点的存量卡不计入，也不补写（补写会形成事后叙述，见原则十）。"
    action: "此类卡不应进入 main：补上判据命令与期望值，或声明不可度量，再送审。"

  - id: stale_measure_deps
    dimension: stale_measure_deps
    op: ">"
    value: 0
    min_sample: 1
    title: 判据点到已蒸发的文件
    meaning: "可复现判据的命令里点到的仓库路径已不在检出内（如 traces 里的报告、/tmp 状态件）。这类判据跑起来只会把噪声当信号（实测抽查 6 张未执行的卡，有 2 张属此类），因此它们不计入「从未执行」的分子——两类要分开处置，混在一起会把动作引向「全部跑一遍」。"
    action: "逐条处置：判据仍有效 → 改成不依赖本地运行时件的形态（用仓内文件或结构性断言）；判据已无意义 → 如实改预测或把卡标 superseded。不跑它。"

  - id: pool_reuse_uncontrolled
    dimension: arena_pool_reuse
    op: ">="
    value: 10
    title: 对照池复用未轮换
    meaning: "同一份对照池（同名 + 同内容哈希）上已做过的接受判定次数达到阈值。池内容不变＝同一批样本被反复用于判定，历次提升共用同一批对子；工具的判定阈值按复用序号折减（α/(k+1)），因此复用越多，同一份提升越难通过——但池本身也在被反复优化，折减只压住判定错误率，不消除对同一批样本的过拟合。数据源是本地影响账本（.s2-replay/arena/impact.yaml，gitignore 运行件），缺席时本判据报数据源缺失，不报 0。"
    action: "重新选样：把新闭环的 issue 补进池（池内容变即换量尺，复用计数自动归零），或先扩池再做下一次门控判定；轮换后重跑一次 baseline，避免新旧量尺混用。"

# ---- 可解读性：该读数是否可信 ----
# rule: source_nonzero（分母来源必须非 0）| any_gt_0（至少一项非 0）
readability:
  - metric: capability_readout
    label: 判断更准（能力轴）
    rule: source_nonzero
    source: s1_feedback_capture
    why: "现场反馈捕获（工程师回报 fix 结果）是「判断更准」这一能力轴的标签来源。该项为 0 时，命中率、误诊率与校准均没有分母，这些读数只能标注为「不可解读」（设计理论 §4.1 的校准性质在演进侧的形态）。"
