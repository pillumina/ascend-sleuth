id: EV-2026-108
target_component: tests/
layer: L2
title: 四个口径脚本的单元测试与 CI 回归 job（tests/ 首建）
status: validated
authorization: review
dimension: maintainability
supersedes: []
superseded_by: null
created_at: 2026-09-17
source_signals:
  - signal: design_gap
    evidence: "scripts/ 共 15936 行 Python，零单元测试；12 个 CI 卡口全部是 `--check` 结构自洽校验（索引新鲜度、schema 合法、id 唯一、生成物与源一致）。这些证明「仓库自洽」，不证明「计算正确」——build_index（容量格子与 case 计数）、trace_metrics（命中率/路由准确率/误诊率口径）、settle_trace_feedback（hits 与 self_resolved 的分离口径）、build_timeline（源→生成物聚合）四个脚本算错时，CI 全绿且面板与置信度会静默报错数。口径一旦写错，下游的 EV 门控与治理判决全部跟着错。"
    trajectory:
      - "scripts/trace_metrics.py#口径定义段（头部注释）"
      - "scripts/settle_trace_feedback.py#结算规则段"
      - ".github/workflows/kb-checks.yml（12 个 job 全为 --check）"
hypothesis: 给这四个口径脚本建最小单元测试（真实输入→期望口径值，含边界：空 traces、缺字段降级、CRLF 夹具、self_resolved 不计入 hits）并进 CI 后，口径计算的静默错误在合入前被拦下，而不是等到面板读数被人怀疑时才回溯。
predicted_effect:
  metric: 口径计算的回归保护面
  from: "4 个口径脚本 0 条断言；改错只在下游读数异常时被动发现"
  to: "4 个脚本各有针对口径与边界的最小断言集，进 CI 后改错即红"
  measure:
    command: "python3 -m unittest discover tests"
    expect_exit: 0
    expect_stdout: "OK"
validation:
  method: scan_review
  baseline: 改前：无 tests/ 目录、无单元测试、无对应 CI job
  success_criteria: |
    ① tests/ 下四个口径脚本各有断言，且断言针对口径而非实现细节（不 assert 私有函数调用次数）；
    ② 至少覆盖四类边界：空输入、字段缺失降级、幂等二次结算不重复计数、self_resolved 与 hits 不互相污染；
    ③ 测试不依赖网络、不依赖 traces/ 真实数据（用 tmp 目录构造）；在干净 clone 上一条命令全绿；
    ④ CI 新增 unit-tests job；kb-checks 的 paths 补 tests/**；
    ⑤ 不把测试写成"跑一遍脚本看退出码"——那与既有 --check 卡口重复，无新增信号。
  rollback: 新增目录 + 一个 CI job，可整体 revert，不影响任何既有产物（原则七）
gate:
  condition: "不等数据触发：本卡补的是验证面缺口（口径脚本无回归保护），随 PR 合入"
risk: low
principle_refs: [1, 6, 8, 10]
actual_cost:
  tokens: 0
  source: estimate
  note: "无 tokenMeter 读数，按既有卡口径记 0"
decisions:
  - who: agent
    when: 2026-09-17
    type: proposal
    conclusion: "产卡：四个口径脚本的最小单元测试 + CI job。来源：对比外部同类项目的测试投入（13.6k 行测试、43% 测试比）后回查本仓，确认本仓在「结构自洽」之外无任何计算正确性的回归保护"
  - who: agent
    when: 2026-09-17
    type: action
    conclusion: "落地：新建 tests/（4 个口径脚本共 35 条断言，纯 stdlib + PyYAML、tmp 目录构造输入、不联网不读真实 traces/）；trace_metrics 增 --traces-dir（不传时行为不变，供测试与「读另一份检出」用）；kb-checks 新增 unit-tests job 与 tests/** 触发路径；git-workflow 门控映射表加一行"
  - who: agent
    when: 2026-09-17
    type: eval
    conclusion: "① 35 条断言全绿（python3 -m unittest discover tests → OK）；② 等价性检查：拿主检出的 14 条真实 trace 跑 --emit-yaml，改动前/后输出**逐字节一致**（证明 --traces-dir 未改既有读法）；③ 首建即发现一处真实缺陷：settle_trace_feedback 的幂等键是「整个 session 的事件列表 hash」，列表一变就整段重放——补一条新 feedback 会让旧事件被二次计入 hits（实测 1→3，期望 1→2），与脚本自述的「同一份证据不能数两次」矛盾；已以 test_known_defect_... 断言钉住现状（命名为缺陷、写明期望值），修复后该断言必然失败，强制有意更新。"
  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "采纳（validated）：四个口径脚本从「零回归保护」到有边界断言，且真发现了缺陷（这也回答本卡的核心假设——口径确有可能出错且此前无人可见）。残余如实标注：①known_defect 未修——修它等于改学习环口径、会变更既有 case 的 hits，须单独产卡并按 knowledge_modification 流程走，本卡只记录现状；②trace_metrics 的口径仍在 main() 内，测试走 CLI 契约（断言 YAML 快照字段）而非函数级调用，未做重构；③测试只覆盖四个脚本，其余 70+ 脚本仍无回归保护。"
  - who: agent
    when: 2026-09-17
    type: action
    conclusion: "合入指针回写：本卡改动随 PR #242 合入（回写由 evolve 批次收尾执行，供判据「待合入积压」读取）"
