  success_criteria: >-
    ①五类模板首节都是「背景与动机」，且各含独立 agent 产出 / 作者不得代填 / 覆盖清单 /
    反例与可复跑命令 / MERGE_READY / 人读文本三项判定六个字面串；
    ②methodology 模板不再含「人读性自查」，其「新增或改名的名字」一行在「变更内容」里；
    ③scripts/verify_pr_body.py 的五条 REQUIRED_SECTIONS 首项都是「背景与动机」，
    TEMPLATE_HINTS 不含它；对五类模板 body 判 PASS、删掉该行后判 FAIL；
    ④docs/guide/git-workflow.md 仍含 EV-2026-147 钉住的两个字面串与三档表表头，且不再把
    「不进 CI」归因于 PR 人读性自查；⑤docs/spec/writing-norms.md 的 PR body 行写明首节内容与
    预核意见的取舍；⑥python3 scripts/ev_measure.py EV-2026-147 --run 里本改动涉及的三项读数
    （templates_ok / git_workflow_tiers / writing_norms_pointer）仍为 True；该判据另两项不通过
    （route_check_misfire_reported、wide_words_ok）的成因见 decisions，与本改动无关；
    ⑦本卡 predicted_effect.measure 一条命令复验 → VERDICT PASS。
  rollback: >-
    回退该提交即可：五个模板回到 73c720f 的版本、verify_pr_body.py 的 REQUIRED_SECTIONS 去掉
    「背景与动机」、git-workflow 与 writing-norms 的三处措辞回退；未改任何 CI 工作流与判定逻辑。
gate:
  condition: >-
    再出现「PR body 只列变更内容、读不出动机」，或「预核意见把命令输出与逐条证据复制进 body」
    压过结论，或「人读性自查」式勾选清单重新出现在模板里。
