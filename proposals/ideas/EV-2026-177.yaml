# ============================================================
# EV-2026-177 —— PR body 改成 reviewer 先读的形态：首节写背景与动机，预核意见只留结论与要复核的点
# 来源：owner 指示（2026-10-08）四条：① methodology 模板的「人读性自查」节删掉——呈现在 PR 里没有意义；
#       ② body 的行文按 docs/spec/writing-norms.md，不写黑话与比喻，reviewer 要读得懂；
#       ③ 「Agent 预核意见」太长太 compact，检视人不需要展开细节，只要严谨、简洁的建议与结论；
#       ④ body 缺背景和动机，只列变更内容会让审核者不明白。目标：body 可读、可审、严谨、简洁。
# 脱敏：只含仓库内路径、命令与字面量
# ============================================================

id: EV-2026-177
layer: L2
target_component: .github/PULL_REQUEST_TEMPLATE
title: "PR body 首节改为背景与动机，预核意见只留结论与要复核的点，删掉人读性自查节"
status: validated
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: '2026-10-08'
source_signals:
  - signal: user_feedback
    evidence: >-
      owner 2026-10-08 的四条：模板 body 写得过于复杂，「人读性自查」呈现在 PR 里没有意义；
      body 的文字、行文、措辞要符合 docs/spec/writing-norms.md，不写黑话与复杂比喻，reviewer 要读得懂；
      「Agent 预核意见」输出太长、太 compact，检视人不需要展开具体细节，只要严谨、简洁的建议与结论；
      body 缺「背景和动机」，只列变更内容还是会让审核者不明白。
    trajectory:
      - "owner 指示（2026-10-08：可读、可审、严谨、简洁明了、可读性佳）"
hypothesis: >-
  把五类模板的首节固定成「背景与动机」（触发 / 不做的代价 / 做完的变化），并把「Agent 预核意见」
  压成结论优先的七到八行之后，reviewer 不打开预核报告就能判定合入，也不需要在 body 里翻找改动动机；
  删掉 methodology 模板的「人读性自查」节不丢覆盖——代号与行文约束由 writing-norms §3 的机械检查
  （pr-template、render_review_summary.py --scan）与独立预核的三项判定承担。
predicted_effect:
  metric: 五类 PR 模板的 body 结构（首节是否为背景与动机、预核意见字段是否为结论优先）
  from: >-
    五类模板都没有「背景与动机」节；「Agent 预核意见」各有 7 个自评口径字段（预核者、事实依据、
    两条随模板定的判定项——methodology 是「行为差异」「文档类改动另查」，其余是「期望正确性」或
    「归因判定」「预期影响」加「风险标注」——、覆盖清单、反例与可复跑命令、结论），作者容易照抄成
    checklist；methodology 模板另带 6 条「人读性自查」勾选项。
  to: >-
    五类模板首节都是「背景与动机」（触发 / 不做的代价 / 做完的变化）；「Agent 预核意见」改成
    结论行（MERGE_READY）+ 核对的版本 + 按严重度排的问题 + 覆盖清单 + 反例与可复跑命令 +
    人读文本三项判定 + 预核报告链接，共 7 到 8 行；methodology 模板不再有「人读性自查」节，
    其「新增或改名的名字」一行并入「变更内容」（枚举提示移进注释，标签只留「无则写「无」」）。
  measure:
    command: |
      python3 - <<'PY'
      from pathlib import Path
      import importlib.util, subprocess, sys

      root = Path(".")
      tmpl = root / ".github/PULL_REQUEST_TEMPLATE"
      names = ["methodology", "knowledge_intake", "knowledge_modification", "reference", "structure"]
      anchors = ["独立 agent 产出", "作者不得代填", "覆盖清单", "反例与可复跑命令", "MERGE_READY", "人读文本三项判定"]
      bodies = {}
      for n in names:
          text = (tmpl / (n + ".md")).read_text(encoding="utf-8")
          bodies[n] = text
          sections = [l for l in text.splitlines() if l.startswith("## ")]
          assert sections[0] == "## 背景与动机", (n, sections[0])
          for a in anchors:
              assert a in text, (n, a)
      assert "人读性自查" not in bodies["methodology"], "methodology 仍有人读性自查节"
      assert "新增或改名的名字" in bodies["methodology"], "methodology 缺新增或改名的名字一行"

      spec = importlib.util.spec_from_file_location("vp", "scripts/verify_pr_body.py")
      vp = importlib.util.module_from_spec(spec)
      spec.loader.exec_module(vp)
      assert set(vp.REQUIRED_SECTIONS) == set(names), sorted(vp.REQUIRED_SECTIONS)
      for n, req in vp.REQUIRED_SECTIONS.items():
          assert req[0] == "背景与动机", (n, req)
      for n, hints in vp.TEMPLATE_HINTS.items():
          assert "背景与动机" not in hints, n
      for n in names:
          ok = subprocess.run([sys.executable, "scripts/verify_pr_body.py"], input=bodies[n], capture_output=True, text=True)
          assert ok.returncode == 0, (n, ok.stdout, ok.stderr)
          cut = "\n".join(l for l in bodies[n].splitlines() if l != "## 背景与动机")
          bad = subprocess.run([sys.executable, "scripts/verify_pr_body.py"], input=cut, capture_output=True, text=True)
          assert bad.returncode == 1 and "背景与动机" in bad.stdout, (n, bad.returncode, bad.stdout)

      gw = (root / "docs/guide/git-workflow.md").read_text(encoding="utf-8")
      for s in ["独立预核（提交前", "要跑反例吗", "为什么不进 CI", "没查出问题也要给覆盖清单", "PR body 上写多少", "独立预核的黑话判定"]:
          assert s in gw, s
      assert "PR 人读性自查" not in gw, "git-workflow 仍把不进 CI 归因于 PR 人读性自查"
      wn = (root / "docs/spec/writing-norms.md").read_text(encoding="utf-8")
      for s in ["首节写背景与动机", "五类模板的首节都是「背景与动机」"]:
          assert s in wn, s
      print("VERDICT PASS")
      PY
    expect_exit: 0
    expect_stdout: "VERDICT PASS"
