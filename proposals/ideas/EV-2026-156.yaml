decisions:
  - who: agent
    when: 2026-09-29
    type: eval
    conclusion: >-
      **先纠正自己上一轮的一个错误结论**：我说"索引被新词条撑胖了、要压摘要省 token"。实测发现
      生成器早已把 summary 截断到 160 字符（`SUMMARY_CAP`），索引体积与 summary 原文长度**无关**——
      压缩 26 条后索引只从 75273 → 74432 字节。真实问题是另一件事：**103 条词条的判据落在截断线之外，
      读侧根本看不到**。所以本轮的收益不是省 token，而是"判据不再被写在看不到的地方"。
  - who: agent
    when: 2026-09-29
    type: eval
    conclusion: >-
      **开屏形态的影响面比想象的小**：查过之后，步骤 1 的固定行只在
      `skills/diagnose/references/diagnosis-procedure.md`（本次改的就是它）与 `skills/diagnose/SKILL.md`
      的开屏说明里；面板渲染（`panel_render_check`）与 trace 字段都不依赖那条表的形态。
      所以改动是**加一节**而不是改结构：中断那 10 行原样保留，性能/精度各加一组行，按性质取用。
  - who: agent
    when: 2026-09-29
    type: decision
    conclusion: >-
      采纳（validated）。判据：四项改动都落在可核位置（步骤 1 的两组行、步骤 5 的例外条款、
      26 条 summary 长度、README 的纪律段）；三个索引 `--check` 绿；CI 与单测、演练全绿。
      **本条同时回写 EV-2026-155 的合入指针**（按"指针随下一个批的聚合 PR 进 main"的既有规矩）。
      价值层不由此卡证明：取用面修好了，是否真被用到要看后续 trace 的 `reference_lookup` 读数。
