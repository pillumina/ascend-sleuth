    when: "2026-11-11"
    type: proposal
    conclusion: >-
      新词条产出的同一轮把闸门绑定一并做掉，避免「词条在库但永不加载」的静默状态；
      绑定落在已有的 interrupt-deep-debug-gap 网络面分支，只加一行引用并在动作描述里点明网口 QoS。
  - who: agent
    when: "2026-11-11"
    type: action
    conclusion: >-
      在 skills/diagnose/references/collect-gates.yaml 的 interrupt-deep-debug-gap 分支 refs 中新增
      hccn-tool-qos-pfc-tc-dscp，动作描述补「链路面含网口 QoS：PFC 位图、优先级到 TC、TC 缓冲」。
  - who: agent
    when: "2026-11-11"
    type: eval
    conclusion: >-
      measure 命令实测输出 1、退出码 0；verify_references.py --check 通过（268 条、id 唯一）；
      rebuild_generated.py --check 全绿。
  - who: agent
    when: "2026-11-11"
    type: decision
    conclusion: >-
      采纳（validated）：改动只新增一个入口，不动分支顺序与判据，回滚代价一行删除；
      真实效果要在网络类诊断里看该面是否被取用，进观察窗，后续由 trace 的 reference_lookup 结算。
