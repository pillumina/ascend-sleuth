    conclusion: "产卡：结算完整性三修（增量结算 / 未落地不丢 / 改写不猜）+ --audit 交叉复核。来源：口径脚本单测发现的二次计数缺陷（EV-2026-108 执行过程）+ 实测一例真实自证丢失（游标已推进而 case 无 self_resolved）"
  - who: agent
    when: 2026-09-17
    type: action
    conclusion: "落地：settle_trace_feedback.py 游标改 v2（per session 记 events 序列 + applied 下标）——只结算新增/未落地事件，序列被改写则拒绝并告警；写回一律**先复核再记落地**（_write_conf_fields / _self_resolved_landed 读盘回验）；新增只读 `--audit` 交叉核对「游标说已结算」与「case 里看得见痕迹」。顺带修一处崩溃：case 的 confidence 块缺 misdiagnoses 时 f-string KeyError 会崩掉整轮结算。skill §3.5 的幂等口径同步改写（去掉已过时的 'ingest-state.json 里按整段 hash' 表述）"
  - who: agent
    when: 2026-09-17
    type: eval
    conclusion: "① measure 实跑 PASS（--audit exit 0、stdout 含 settle --audit）；② **真实数据上抓到了丢失**：修复前 --audit 报「2026-09-16-12430-dsv4pro-mc2 → VLLM-ASC-12430.yaml: 自证未落地」exit 1；删该 session 的游标条目后 --apply，self_resolved count=1 / examples=[该 session] 落盘（复核通过），--audit 转 exit 0；③ 单测 41 条全绿（settle 模块 18 条），改前实测的二次计数 1→3 现为 1→2；④ 全套 CI 绿，其中 case 变更触发索引重建（本 PR 含 _index 重生成）"
  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "采纳（validated）：两个缺陷都是「学习环静默说谎」——一个虚增 hits（二次计数）、一个静默丢证据（游标越过未落地事件，实测已发生一例），修法与防线都可机械复核。残余如实标注：①v1 游标迁移保守视为已落地——旧格式无法区分「当初落地」与「当初被跳过」，迁移只能不重放（防虚增），这类 session 的落地情况交给 --audit 的弱信号口径（查「有没有痕迹」不查条数）；②主检出那份 case 要等本 PR 合入才与共享游标一致，合入前从主检出跑 --audit 仍会报这一条（预期行为，不是回归）；③跨机结算的 session 本机无 trace，audit 如实打印「无法复核」而不猜。"
