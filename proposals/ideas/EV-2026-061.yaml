# ============================================================
# Idea 卡（proposals/ideas/）——schema 与状态机定义见 docs/mechanism/pipeline.md §7（权威）
# 校验：python3 scripts/verify_proposals.py --check
# ============================================================

id: EV-2026-061
layer: L2
title: CLAUDE.md 常驻成本减半：把"只在某个动作发生时才要"的内容下沉到各自的权威处，只留约束与指路
status: in_experiment
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: 2026-09-13
source_signals:
  - signal: human_review_feedback
    evidence: >-
      用户提问："CLAUDE.md 的上下文是不是必然会注入 agent 的上下文？如果内容很多，上下文就天然扩大了，
      这符合 best practices 吗？是不是 CLAUDE.md 里只放必要的、其余渐进式披露？"——追问点是对的，
      且实测证实：本文件每次会话整份注入（skills 只注入 name + description，是渐进披露）。
      改前 22,071 字符 / 143 行 / 27,767 字节，其中 Skills 节（十个 skill 各一段详述）5,683 字符、占 25.7%，
      而每个 skill 的 name + description 本来就由 harness 自动注入 → 同一信息两份常驻成本。
    trajectory:
      - "对话：CLAUDE.md 的常驻成本与渐进披露之问"
      - "CLAUDE.md 改前实测（按 ## / ### 分桶统计字符数）"
hypothesis: >-
  把常驻指令里"只在某个动作发生时才需要"的内容下沉到该动作的权威处并留一行指路，常驻字符数降幅 ≥40%；
  且被移出的每一条仍能从指路文件读到——即省下的是重复与错位，不是信息。
predicted_effect:
  metric: CLAUDE.md 常驻字符数
  from: "22214 字符（改前实测；量具 = python len() 读 UTF-8 全文，含换行）"
  to: "<13000 字符"
  measure:
    command: >-
      python -c "import io,sys;n=len(io.open('CLAUDE.md',encoding='utf-8').read());print('chars',n);sys.exit(0 if n<=13000 else 1)"
    expect_exit: 0
    expect_stdout: "chars"
    # 这条只证"常驻成本降下来了"，不证"agent 行为没变"——后者见 validation 第 ②③ 条
validation:
  method: metrics_compare
  baseline: "改前 22214 字符 / 144 行 / 27,767 字节（量具同上；按 ## 与 ### 分桶的占比：Skills 25.7%、Key constraints 24.4%、Case schema 9.3%、Reference layer 9.3%、Multi-agent 5.7%、Eval 4.9%、Trace 4.3%）"
  success_criteria: >-
    ① measure 命令 exit 0（同量具实测 11,981 字符，22214 → 11981，降幅 46.1%）；
    ② 逐条抽查被移出内容的可达性：skills 名单与分组 → README 的 skill 名单节（生成物）+ 各 SKILL.md 的
    description；门禁分级与 holdout → `docs/eval.md`；worktree/exec-log/串行纪律 → `docs/git-workflow.md`；
    trace schema 与证据落盘 → `skills/diagnose/references/diagnosis-trace.md`；CI 清单 → `scripts/rehearse_evolve_loop.py`；
    ③ 未新增硬编码数字或名单（含删掉原文里的 "Ten skills"）；
    ④ `build_docs_index.py --check`、`verify_proposals.py --check` 绿。
  rollback: "git revert 单个提交即可；纯文本改动，无数据迁移、无脚本依赖"
gate: >-
  常驻字符数再次明显上涨，或再次出现"同一信息在常驻文件与别处各写一份"时，按本卡口径重跑一次。
risk: medium
principle_refs: [2, 6, 9, 10, 11]
actual_cost: null
decisions:
  - who: agent
    when: 2026-09-13
    type: proposal
    conclusion: >-
      识别：常驻指令的成本与"这次用不用得上"无关，而本文件把大量按需内容写成常驻——最大的一块 Skills 节
      还与 harness 自动注入的 skill 摘要重复计费。仓库里已有同构先例可循（把 diagnose 的 SKILL.md 瘦成
      "可执行脊梁"、细节下沉 references 懒加载），论证同样是上下文预算。方案：按三问逐节判——
      每次都要遵守吗？留；只在某个动作发生时要吗？移到那个动作的写点；别处已有权威吗？删掉只留指路。
  - who: agent
    when: 2026-09-13
    type: action
    conclusion: >-
      分批执行，本批只动"别处确有权威"的四节：①Skills 节（5,683 字符）删详述，改为指向 README 的 skill 名单节
      与各 SKILL.md 的 description（harness 自动注入），并删掉原文里自相矛盾的硬编码 "Ten skills"；
      ②Eval 节压成三条要点 + 指向 `docs/eval.md`；③Multi-agent 节压成四条纪律 + 指向 `docs/git-workflow.md`；
      ④Trace 节压成关键字段一行 + 指向 `skills/diagnose/references/diagnosis-trace.md`；
      ⑤CI 九条清单改为指向 `rehearse_evolve_loop.py`；⑥新增一节说明两套传递机制（常驻 / 渐进披露）与判据。
      实测（同一量具）：22,214 → 11,981 字符（−46.1%），144 → 135 行。
  - who: agent
    when: 2026-09-13
    type: decision
    conclusion: >-
      **第二批刻意未做，原因是权威缺位**：Case schema（2,063 字符）与 Reference layer（2,063 字符）两节
      合计 18.6%，但核验发现它们现在的权威就在 CLAUDE.md 本身——`references/README.md` 里没有聚类规则
      （append-don't-create 零命中），也不存在 case schema 文档，`examples/sample-case.yaml` 只是样本不是规格。
      所以删了是丢信息，不是搬家。下一步：先给这两块建权威处（case schema 落 `docs/` 或 to-postmortem 的
      references；reference 聚类规则落 `references/README.md`），核验"逐条可读到"之后，再压缩 CLAUDE.md 对应节。
      这条边界写进卡，避免下一步有人以为"没做完"而直接删。
  - who: agent
    when: 2026-09-13
    type: eval
    conclusion: >-
      复现命令（卡里 measure 那条原样跑过）：`python -c "import io,sys;n=len(io.open('CLAUDE.md',encoding='utf-8').read());print('chars',n);sys.exit(0 if n<=13000 else 1)"`
      → chars 11981、exit 0（改前 22214）。
      **量具不一致的更正**：本卡初稿把两个量具的数字混用了——PowerShell 按行文本长度求和（不含换行）得 22,071 → 11,847，
      而 measure 命令用 python `len()`（含换行）得 22,214 → 11,981，差值恰为一行的换行数。现全部统一为后者，
      并写明量具。教训与"改前/改后必须同一把尺"同源：一卡之内混用两把尺，读者会以为其中一个是错的。
  - who: agent
    when: 2026-09-13
    type: eval
    conclusion: >-
      用户追问"删冗余后新 agent 的认知效果是否没变化"触发**逐条可达性复核**，查出一处真实退化（不是搬家）：
      原文把"提交前必跑的九条 `--check`"逐条列出；我改写成"跑 `rehearse_evolve_loop.py`"，而该脚本自述
      "**不进 CI**，它不是回归门，是验证工具"。照我的版本做事的 agent 会跑一个更重、还需要 node 的演练，
      或者干脆不跑那九条。已修：改成"逐条命令以 `.github/workflows/kb-checks.yml` 与 `pr-template.yml` 为准
      （不在本文件抄一份，抄了会腐烂）"，并把 rehearse 脚本降级为"更重的端到端演练，不能替代逐条 `--check`"。
      同类第二处：Platform dispatch 一节漏掉了"诊断 phase 2.5 注入匹配平台摘要、未匹配平台不给先验"这句
      （核验 `skills/diagnose/references/platform-dispatch.md` 无此句）→ 已补回。
      其余抽查项无丢失：门禁分级与 holdout 在 `docs/eval.md`、证据落盘与行文口径在 `diagnosis-trace.md`、
      exec-log flock 仍留在常驻面（`docs/git-workflow.md` 里没有这句，所以不能删）。
      方法论教训（比本条改动更值钱）：**"删冗余"与"搬信息"必须逐条核对事实，不能按节看目的地文件是否存在**。
      前一版验收只核了"目的地文件存在"，因此漏掉这两处；正确口径是"这条事实在目的地读得到"。
  - who: agent
    when: 2026-09-13
    type: eval
    conclusion: >-
      **对照验证（用户批准执行）**：两臂同模型、同一组三问，唯一变量是常驻指令文件——A 臂 `origin/main` 的
      CLAUDE.md（22214 字符，含逐条列出的"提交前必跑九条"），B 臂本分支（12034 字符，改为指向
      `.github/workflows/kb-checks.yml`）。变量隔离已先验证：两臂 `skills/` 逐文件一致（各 17 个），
      差异仅 CLAUDE.md 与本卡。判据机械可查。**产物不归档**（用户要求不留临时件污染工作区）——因此本卡的读数
      无法从仓库里直接复核，只能按下面记录的步骤重跑；这是如实标注的复现成本，不是"已验证"。
      结果：①**Q1 提交前命令清单——两臂覆盖集合完全相同（各 14/14 项，A 独有 0、B 独有 0）**，
      九条 `--check`、`pr-template`、两个 skill grep、`triage-tree` 语法都在；两臂都写明 rehearse 脚本
      "不能替代逐条 --check"（即本轮刚修回的那条口径生效）。B 写出 19 行、A 写出 73 行（含分节散文），
      覆盖相同而篇幅更短。②Q2（issue-ingest 批量导入）两臂都给出同一套要素：skill 名、`gh` 安装+认证前置、
      `postmortems/inbox/` 落点、`ingest-state.json` 串行纪律、worktree 纪律；**信息量相当正是"被删掉的
      issue-ingest 详述能从 `skills/issue-ingest/SKILL.md` 按需拿回来"的直接证据**——渐进披露按预期工作。
      ③Q3（最小合法 trace）两臂 YAML 均可解析、都含 user 事件/`content`/`evidence` 里的 issue 链接；
      A 产出偏重（含 `sediment_candidates`/`sedimented`/`report_file` 等完整状态字段），B 更贴合"最小"。
      **结论（单边）**：新指令没有导致退化——B 臂在该任务集上全过，且拿到九条的方式正是"按指路去读 yml"。
      **不能得出的结论**：不能从这个 n=1 实验说"两版等价"。A 臂的隔离有疑点：它 Q1 顶部那句
      "逐条命令以 `.github/workflows/kb-checks.yml` 与 `pr-template.yml` 为准"的措辞与本分支新句一致，
      而 A 臂自己的 CLAUDE.md 里 grep 不到 `kb-checks.yml`（实测 False）；两种解释无法从产物区分——
      ①harness 把父会话工作区的 CLAUDE.md（新版）也注入了子代理，②A 自己发现了那两份 workflow 文件并
      独立得出同结论（它同时实跑了 `build_index.py --check`，有这个习惯）。A 臂的自证是干净的
      （它引用的两句都只存在于自己版本，其中一句正是新版已删的"提交前必跑九条"原句），所以更可能是②，
      但不能证明。**若要把 A 臂做成有效对照**：把 A 臂指令文本内联进提示、并显式声明忽略 harness 注入，
      或在不共享工作区的进程里跑。本卡按"已做的部分"记，不把它当作等价性证据。
  - who: agent
    when: 2026-09-13
    type: eval
    conclusion: >-
      **隔离版对照重跑（用户要求，两臂方法对称）**：指令文本改放中性文件名 `PROJECT-INSTRUCTIONS.txt`；
      两臂共用同一个 worktree（`origin/main`），且**该树里删掉了 `CLAUDE.md` 与 `AGENTS.md`**；
      提示里显式要求忽略 harness 注入；自证追加硬判据（**字符数** + "提交前必跑"那条的逐字引用）。
      自证两臂全中：A 报 **22214**、引用旧版九条原句；B 报 **12034**、引用新版指向 `kb-checks.yml` 的句子
      （B 还自行指出按 GBK 误解码会得 13281、属解码错误）。
      **A 臂主动报告"harness 注入了 AGENTS.md/CLAUDE.md，按要求已忽略"——这解释了上一版 A 臂的疑点**：
      注入确实存在；上一版没要求忽略、且仓库树里就放着我改动后的文件，于是被混用。
      机械评分（同一脚本，判据不含主观项）：**Q1 九条命中两臂均 9/9**；附加项（`verify_pr_body`、`rehearse`、
      `triage-tree` 语法、两条 skills grep、`knowledge_intake`）**两臂同集合，差异集为空**（各 16 项）。
      篇幅：A 3831 字符 / 79 行，B 2080 字符 / 19 行。Q3：两臂 YAML 均可解析、均含 user 事件与链接，
      **B 的顶层字段（19）比 A（7）更完整**。Q2：两臂同一链路（`issue-ingest` → `to-postmortem` → groom），
      gh 前置、`postmortems/inbox/` 落点、`ingest-state.json` 串行纪律齐备。
      **结论（方法对称后）**：在"改 case 后的提交前门禁 / 批量导入流程 / 最小合法 trace"这三件事上，
      两臂**覆盖集合完全等价**，未发现新指令导致的退化；B 以约一半的常驻字符换到同等覆盖。
      **唯一实质差异（记录，不判优劣）**：A 把九条复述为"必跑"；B 把清单**重新分档**（必然相关 / 只在对应目录
      变更时才可能红 / 可选且不替代）。可能机制：指向权威文件的版本邀请 agent **解读并分档**，枚举版邀请
      **逐字执行**。分档在"只改 case"场景下判断正确（metrics 与卡类校验不会因它变红），但引入了"低估必跑项"
      的小概率。若日后要收紧，可在那条常驻指令里补一句"九条一律跑，不要按改动面省略"。
      **仍然成立的限制**：每臂 n=1、单模型、agent 自读文本而非 harness 原生注入（虽已显式要求忽略注入）。
      硬发现（某侧漏做）才有强信息量；本次两侧皆过，属弱证据。
      产物按用户要求**不归档**，故本卡读数无法从仓库复核；要复核就按本段记录的步骤重跑
      （评分逻辑：Q1 数九条与附加项命中并取差异集，Q3 用 `yaml.safe_load` 校验结构）。
      指路处存在性逐项核对通过：`scripts/rehearse_evolve_loop.py`、`docs/eval.md`、`docs/git-workflow.md`、
      `skills/diagnose/references/diagnosis-trace.md`、`references/README.md`、README 的 skill 名单节（2 处命中）。
      闸门：`build_docs_index.py --check`、`verify_proposals.py --check` 绿。
      **诚实边界**：measure 证明的是常驻字符数下降，不证明"agent 行为未变"——后者需要一次 diagnose 演练或
      `rehearse_evolve_loop.py` 全量复跑，本卡不声明已验证，留 `in_experiment`。
