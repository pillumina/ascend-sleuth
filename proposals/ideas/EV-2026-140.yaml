id: EV-2026-140
layer: L2
target_component: skills/diagnose/references/diagnosis-procedure.md
title: 覆盖表补两列：每个提取值标来源，✓ 行按主题分组保证逐项可核
status: in_experiment
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: '2026-09-21'
risk: low
source_signals:
- signal: process_friction
  evidence: 新旧步骤 1 契约的对照探针（同一份真实 issue 首帖）暴露：新契约把提取值压成三行 ✓，丢掉旧契约的逐项来源标注。来源决定这条值要不要打折——探针输入里 CANN / HDK / 驱动只出现在工程师的自由描述里，日志与启动横幅都没给；不标来源时，下游会把「他说的版本」当成「日志里的版本」，而容器可能覆盖前者。
  trajectory:
  - skills/diagnose/references/diagnosis-procedure.md（覆盖表与输出契约）
  - 'PR #276 的对照探针评论（eval/flow/vllm-ascend.yaml 的 FLOW-2026-001 首帖）'
hypothesis: 给每个已提取的行标来源（日志 / 启动横幅 / 命令输出 / 他的描述），下游才知道哪条值需要打折；✓ 行按主题分组保证逐项可核，不再压成一长行。
predicted_effect:
  metric: 覆盖表是否要求逐值标来源、输出契约是否禁止压行（行为规则，判别力不可机械度量）
  from: 来源只是建议；输出契约写「一行带过」，实测压成一行三项
  to: 来源成为逐值必填项（缺来源的值标为待核）；输出契约要求 ✓ 行按主题分组
  measure:
    command: grep -q '来源是逐值必填' skills/diagnose/references/diagnosis-procedure.md && grep -q '按主题分组' skills/diagnose/references/diagnosis-procedure.md
    expect_exit: 0
validation:
  method: scan_review
  baseline: 改前：来源未在覆盖表里逐值必填；输出契约按「一行带过」执行
  success_criteria: '① 来源取值收敛（日志 / 启动横幅 / 命令输出 / 他的描述），不要求写文件行号（那是报告面的强度）；

    ② 「他的描述」这一档标明它弱于日志，需要时以命令输出复核；

    ③ ✓ 行按主题分组，避免一长行看漏；

    ④ 不新增探询轮次——标来源是提取时顺手记，不是再问一轮'
  rollback: 删两处措辞增量即回到改前
gate:
  condition: 对照探针里出现「描述里的版本被当成日志里的版本」这一具体风险，改动可逆、成本为两处措辞
principle_refs:
- 1
- 10
actual_cost:
  tokens: 0
  source: estimate
  note: 与本批其余卡在同一轮会话内完成，未单独计量；按既有卡口径以 0 计
decisions:
- who: agent
  when: '2026-09-21'
  type: proposal
  conclusion: 产卡：覆盖表逐值标来源 + ✓ 行按主题分组
