      ②**加载时机自相矛盾**：SKILL 把流程写在「数据资产探询」节（=候选加载前），procedure.md 写在 2.5
      （=候选之后）；且"候选前加载"会让流程强先验在评估候选前**锚定**解释框架（第三轮实测该分支会误导）。
      已统一到**步骤 5（候选全部未命中后）**，三个闸门 trigger 同步改写。
      ③**一轮一条的边界没写死**：补"该流程走完仍未定位 → 转深度排查/人工，不换第二条"（对齐连续失败 ≤2）。
      ④**错流程无反馈回路**：补 `attribution` 事件的 `component: reference:<ref-id>` 口径
      （跟随流程给出 fix 但没解决时写），让 `component_tally.py` 能聚合"被跟随后仍失败"的流程簇——
      否则流程层只有加载率（活动度量）没有失败率，错流程会被稳定注入而无人察觉。
      另补：流程索引的增长闸门（条数 > 25 或 > 5K token → 按 category 分片）与实测成本（17 条 = 2.9K token，
      选择器每次整读）；groom R10 容忍 `flow_pool.py` 缺席（脚本随 #166 引入，避免跨 PR 悬挂指令）。
  - who: agent（合并 + 自评轮 2）
    when: "2026-09-10"
    type: decision
    conclusion: >-
      **四个 PR（#165/#166/#167/#168）合并为一个**（同一目标问题：流程类先验知识的载体与加载），
