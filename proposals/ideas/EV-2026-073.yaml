source_signals:
  - signal: coverage_gap
    evidence: >-
      用户问「没吸收的低优先级内容里有没有值得收的」，复查候选池后发现此前笼统归入「低优先级」的一批里
      有多条**高价值**条目——它们落下的原因是批次规模而非质量。典型：①`asc_vf_call` 是屏障（VF 期间
      MTE2 被阻塞、屏障时间守恒）与 **VF 内 `LocalMemBar` 会死锁**——分别解释「优化开关打开却无重叠」
      与「加了屏障就 hang」；②小 DMA ramp-up 与 **ping-pong 重叠优先于 DMA 尺寸**；③CrossCore 与核内
      Mutex 的**不可互替与方向不对称**；④全载条件不满足会同时导致精度异常。本批连同调参/建模判据、
      L2 与多缓冲机制、elemwise/reduce 的分界一并吸收。
    trajectory:
      - references/software-facts/vf-call-and-barrier-rules.yaml 等 12 个新词条（本轮产出）
      - "Samples/2_Performance/softmax_regbase_story/README.md（asc_vf_call 屏障与 LocalMemBar 死锁来源）"
      - "Samples/2_Performance/flash_attn_lite_story/README.md（CrossCore/Mutex 分工与四层槽位来源）"
      - "Samples/2_Performance/simd_vf_story/README.md（elemwise/reduce Bound 分界来源）"
      - "候选池原始记录：/tmp/canns/findings/*.md（与 EV-2026-071 同一批）"
hypothesis: >-
  这批补的是「**优化动作本身出错**」与「**测量/归因口径出错**」两类空白：前者（VF 屏障、LocalMemBar
  死锁、CrossCore/Mutex 误用、全载条件误判）此前库里没有对应事实，现场只能靠猜；后者（建模常数、
  四层槽位检查顺序、Pipe active 不可相加、仿真≠真机、sentinel 校验法）把「怎么量、怎么比」写成了
  可执行判据。两者合并后，算子层诊断的「改动方向」与「判定依据」都有出处。
