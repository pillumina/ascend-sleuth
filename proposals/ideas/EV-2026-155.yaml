hypothesis: >-
  算子级失败模式给的是"信号 → 证据 → **常见误报** → 方向 → 置信度条件"这一整套（本库此前只有阈值与方向）；
  精度豁免表拦掉两类结构性误判（未初始化内存分配族被当根因、跨 rank 通信算子的 input→output 比对不成立）；
  单算子验证把"怀疑某算子"变成"能自己验某算子"；训推配对采集补上"两侧数据怎么配起来"的实施面。
predicted_effect:
  metric: 本批词条条数与其可达性
  from: >-
    豁免/占位算子、单算子容差、训推配对采集三块零覆盖；算子级只有阈值表没有误报清单。
  to: >-
    新增 fault-pattern `operator-compute-failure-modes`（十类模式逐条带常见误报）与
    `accuracy-operator-exemption-and-verification`（豁免/占位/容差/构造质量门）、
    methodology `single-operator-accuracy-verification`（5 步）与 `train-infer-paired-collection`（4 步）；
    全部挂进 precision / performance 闸门；reference 词条 257 → 261。
  measure:
    command: |
      python3 - <<'PY'
      import pathlib, subprocess, sys
      sys.path.insert(0, 'scripts')
      from _yaml import load_file
      root = pathlib.Path('.')
      fp1 = load_file(root / 'references' / 'fault-patterns' / 'operator-compute-failure-modes.yaml')
      fp2 = load_file(root / 'references' / 'fault-patterns' / 'accuracy-operator-exemption-and-verification.yaml')
      mt1 = load_file(root / 'references' / 'methodologies' / 'single-operator-accuracy-verification.yaml')
      mt2 = load_file(root / 'references' / 'methodologies' / 'train-infer-paired-collection.yaml')
      ok_items = (len((fp1['content'] or {}).get('patterns') or []) >= 8
                  and len((fp2['content'] or {}).get('patterns') or []) >= 4
                  and len((mt1['content'] or {}).get('flow') or []) >= 5
                  and len((mt2['content'] or {}).get('flow') or []) >= 4)
      gates = load_file(root / 'skills' / 'diagnose' / 'references' / 'collect-gates.yaml')
      bound = set()
      for g in gates.get('gates') or []:
          bound.update(g.get('refs') or []); bound.update(g.get('caveat_refs') or [])
          for br in g.get('branches') or []:
              bound.update(br.get('refs') or [])
      targets = ['operator-compute-failure-modes', 'accuracy-operator-exemption-and-verification',
                 'single-operator-accuracy-verification', 'train-infer-paired-collection']
      ok_bound = all(t in bound for t in targets)
      prec = (root / 'references' / '_procedure-index' / 'precision.yaml').read_text(encoding='utf-8')
      ok_flow = 'single-operator-accuracy-verification' in prec and 'train-infer-paired-collection' in prec
      r = subprocess.run([sys.executable, 'scripts/verify_references.py', '--check'],
                         capture_output=True, text=True)
      print('items      ', ok_items)
      print('bound      ', ok_bound)
      print('in_flow    ', ok_flow)
      print('verify_refs', r.returncode)
      ok = ok_items and ok_bound and ok_flow and r.returncode == 0
      print('VERDICT', 'PASS' if ok else 'FAIL')
      PY
    expect_exit: 0
    expect_stdout: "VERDICT PASS"
