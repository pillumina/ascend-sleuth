hypothesis: >-
  精度面缺的不是工具用法而是**判据**：NRE 与 MeanBias 的双层不可忽略标准、首问题点必须先过"输入继承/下游吸收"两关、
  参数梯度要按继承性分三档、阈值要从数据分布自适应算并全程钳制。Host 绑核面缺的是**算术**：
  六条不等式（未绑核/过宽/过窄/线程过载/cgroup 冲突/范围重叠）把"凭经验看看"变成可判定的判据。
  两者都以表与流程的形式落进 reference 并挂上闸门。
predicted_effect:
  metric: 精度与绑核判据词条条数及其可达性
  from: >-
    精度面零判据（只有工具用法）；绑核面零算术判据（只有一条讲证据门槛的流程）。
  to: >-
    新增 fault-pattern `precision-threshold-cascade`（9 条判据）与 `cpu-binding-affinity-triage`（11 条规则），
    methodology `precision-first-divergence-triage`（6 步）与 `cpu-binding-inspection-procedure`（5 步）；
    全部挂进 precision / performance 闸门；reference 词条 246 → 250。
  measure:
    command: |
      python3 - <<'PY'
      import pathlib, subprocess, sys
      sys.path.insert(0, 'scripts')
      from _yaml import load_file
      root = pathlib.Path('.')
      fp1 = load_file(root / 'references' / 'fault-patterns' / 'precision-threshold-cascade.yaml')
      fp2 = load_file(root / 'references' / 'fault-patterns' / 'cpu-binding-affinity-triage.yaml')
      mt1 = load_file(root / 'references' / 'methodologies' / 'precision-first-divergence-triage.yaml')
      mt2 = load_file(root / 'references' / 'methodologies' / 'cpu-binding-inspection-procedure.yaml')
      ok_items = (len((fp1['content'] or {}).get('patterns') or []) >= 8
                  and len((fp2['content'] or {}).get('patterns') or []) >= 9
                  and len((mt1['content'] or {}).get('flow') or []) >= 5
                  and len((mt2['content'] or {}).get('flow') or []) >= 5)
      gates = load_file(root / 'skills' / 'diagnose' / 'references' / 'collect-gates.yaml')
      bound = set()
      for g in gates.get('gates') or []:
          bound.update(g.get('refs') or []); bound.update(g.get('caveat_refs') or [])
          for br in g.get('branches') or []:
              bound.update(br.get('refs') or [])
      targets = ['precision-first-divergence-triage', 'precision-threshold-cascade',
                 'cpu-binding-affinity-triage', 'cpu-binding-inspection-procedure']
      ok_bound = all(t in bound for t in targets)
      perf = (root / 'references' / '_procedure-index' / 'performance.yaml').read_text(encoding='utf-8')
      prec = (root / 'references' / '_procedure-index' / 'precision.yaml').read_text(encoding='utf-8')
      ok_flow = ('cpu-binding-inspection-procedure' in perf
                 and 'precision-first-divergence-triage' in prec)
      r = subprocess.run([sys.executable, 'scripts/verify_references.py', '--check'],
                         capture_output=True, text=True)
      print('items      ', ok_items)
      print('bound      ', ok_bound)
      print('in_flow    ', ok_flow)
      print('verify_refs', r.returncode)
      ok = ok_items and ok_bound and ok_flow and r.returncode == 0
      print('VERDICT', 'PASS' if ok else 'FAIL')
      PY
    expect_exit: 0
    expect_stdout: "VERDICT PASS"
