source_signals:
  - signal: eval_design_flaw        # 全自动轮 S2 replay 复盘发现评测盲区（#13446）
    evidence: "#13446 replay root_cause 已推理闭合（config 类错配），但标 evidence_gap='缺 config.json 无法确证'——实际 agent 未走 diagnose §5 工具查证（gh api 可拉该 config），缺口被误标为客观缺失"
    trajectory:
      - "eval-reports/0002-vllm-s2-replay.md #13446（rc_match=False 但方向一致）"
