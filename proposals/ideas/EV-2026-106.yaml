    evidence: "groom 预分诊现流程是'先按 symptoms/tags 定位候选索引行 → 只读 1-2 个最高分候选全文核对'，判断发生在候选可见之后；复核排序现只有随机审序与'last_verified 超期标 needs-review'两类信号"
    trajectory:
      - "skills/knowledge-groom/SKILL.md#流程步骤1（改前）"
      - "skills/knowledge-groom/SKILL.md#信号→动作（改前）"
hypothesis: 预分诊改成"先写自己的判断（症状签名/根因假设/修复族方向）再看候选"，并把复核顺序从"标陈旧"改为"按对本次改动面声明了限制的条目优先"，可减少'措辞相近但根因不同'的候选误并，并让高风险变更（改 compat/expected/fix_on_mismatch）的双签依据先被核到。
