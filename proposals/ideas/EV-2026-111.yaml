    type: eval
    conclusion: "① `rank_candidates.py --eval` 复现 top1=8 / **top3=13** / median=3.0（卡片 measure 的期望值 top3=13 命中；基线只按 score 是 2 / 5 / 20.0）；② 拆分实测：只加 sig top3=10、sig+tok 13 —— 行内摘要截断会漏判别 token，已如实修正卡内预期；③ 两条跨队 fixture 的期望 case 由 rank 6 / 17 升到 **并列第 1**（86 条候选池内），账本聚合随之变为 命中第一 16 / 前三 19 / 前三外 0；④ 单测 50 条全绿（新增 rank_candidates 7 条 + build_index 的 sig/tok 2 条）；⑤ 全套 CI 绿（索引按新字段重建，scorecard 因夹具重记账而更新）"
  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "采纳（validated）：排序收益是实测的（top3 5→13、中位名次 20→3、两条 fixture 进第 1），成本是行宽 +68 字符均值（最大 322，如实标注高于预估）。残余：①sig 只覆盖 74/159、tok 133/159——其余 case 的行内没有字面量可取，排序对它们只能靠 token 与 score；②本排序器只解决**排序**，不判相关性（那是 quickly_check 的事），也不改任何期望；③`--eval` 的样本是 25 条 golden fixture（格子内排序口径），不是线上分布；真实验证要看 diagnose 的 hit 名次是否随之下移（进观察窗）。"
  - who: agent
    when: 2026-09-17
    type: eval
    conclusion: "**全量机械重放（25 条 fixture）揭穿本卡判据的口径问题**：本卡的 measure 与生产管线不是一回事——`--eval` 是**格子内全量排序**，而生产是「agent 按 title/tag/symptom 相关性筛 ≤5 → 只加载这 5 条」。按同一格子内口径三比：历史记录（agent 回放）**19/19 在 top-3**；机械 score-only 5/25；机械词法键 13/25。即：**agent 的相关性判断优于两个机械键**，我原先用来论证的 5/25 基线是稻草人（它从来不是生产行为）。另有 8 条历史命中项在机械词法键下掉出 top-3（如 13710 +1→39、12461 →32）。"
  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "**部分撤回**：①**保留**行内 `sig`/`tok`（纯增量证据：agent 不必读 case 本体就能看到签名字面量，成本 +68 字符/行，无行为副作用）；②**撤回**「阶段一排序改词法相关性优先、score 退居破平」这条指令——数据说机械键会替掉一个更好的判断者（19/19 vs 13/25），用它覆盖 agent 判断有实际退化风险。skill 步骤 3 改为「排序仍由 agent 判断，sig/tok 是证据，score 只破平」，并写明历史比例作为依据；`rank_candidates.py` 保留为**对照工具**（不是规定动作）。卡状态保持 validated 仅就「行内证据字段」而言——排序键的替换部分按本条撤回。③后续：若仍想引入机械排序，先做 agent 驱动的子集回放（5-8 条，含上表掉出 top-3 的条目）对比 hit 名次，再定；不得再用格子内全量口径论证生产收益。"
  - who: agent
    when: 2026-09-17
    type: action
    conclusion: "量尺口径修正（落实上一条 decision 的后续要求）：`rank_candidates.py --eval` 改为**管线同构**——先按筛选键取 ≤5 候选，再报 recall@5 与 top3|≤5 两个数；`evaluate()` 抽成纯函数并加单测（筛漏与排后分开计数、未入库 expected 不计入分母）；输出增加「同子集对照」段（agent 历史记录 / score-only / 词法三行同分母）；文件头注写明旧口径已废弃及废弃理由；docs/eval.md 新增「排序/筛选类改动的量尺」一节。"
  - who: agent
    when: 2026-09-17
    type: eval
    conclusion: "同构口径下的读数（19 条三者都有记录的子集）：**agent 历史记录 recall@5 19/19**；机械词法 12/19；机械 score-only 3/19。而 top3|≤5 分别是 19/19、11/12、3/3——**瓶颈在「筛」不在「排」**：候选一旦进池，两种机械键都几乎必进前三。故本卡此前「排序键替换」的方向从一开始就瞄错了阶段。"
  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "采纳为新量尺（此后所有排序/筛选类改动一律用它，禁止再用整格全量口径论证收益）。由此得出的方向修正：**`sig`/`tok` 的价值在「筛」不在「排」**——它们把机械筛选的 recall@5 从 3/19 提到 12/19，这是本卡真正的净收益；而 agent 的 19/19 说明人的相关性判断仍不可替代，故 skill 保持「排序由 agent 判断、sig/tok 作为证据」。下一步（另卡）：把 sig/tok 明确写成筛选阶段的**兜底规则**（agent 判断之外再按字面量命中补一层），目标把机械 recall@5 从 12/19 推向 19/19；这一步需要 agent 驱动的子集回放验证，不得再用机械口径自证。"
