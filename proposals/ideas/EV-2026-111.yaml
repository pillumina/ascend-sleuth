source_signals:
  - signal: measurement
    evidence: "在 25 条有 expected case 的 golden fixture 上、于各自 ns×category 格子内排序，实测四种排序键的命中分布：**score（现状）top1 2 / top3 5 / 中位名次 20**；词法相关性（case 的 quickly_check 字面量命中数 → 输入 token 与 case token 交集数 → score）**top1 9 / top3 13 / 中位名次 3**。拆分看：只用字面量 top3 9、只用 token 交集 top3 11，两者相加 13——两半各自有效、互补。score 补全（49 条可机械补）反而更差（top3 2、中位 33），证明「排序的问题不是分数缺，而是 score 不是相关性信号」。"
    trajectory:
      - "eval/golden/*.fixture.yaml（25 条有 expected case）"
      - "knowledge/_index/inference__vllm-ascend__interrupt.yaml（候选池）"
  - signal: design_gap
    evidence: "diagnose 的 SKILL 正文早已写着「报错原文在场 → signature 立即查」的策略，但**索引行里没有任何签名面字段**（行只有 id/title/tags/symptoms 首条/category/score/file），于是阶段一的排序只能按 score——策略在散文里、排序在数据里，两者不一致。实测两条跨队语料 fixture 的期望 case 因此排到第 6 / 第 8。"
    trajectory:
      - "skills/diagnose/SKILL.md#步骤 3（阶段一按 score 筛候选）"
      - "eval/golden/VLLM-PD-PORT-65536.fixture.yaml#回放结果"
hypothesis: 把 case 的 quickly_check 签名字面量（正则里的纯字面量分支）放进索引行（新字段 sig，上限 6 条 / 每条 ≤32 字符），并让阶段一按「字面量命中数 → token 交集数 → score」排序后，命中 case 的名次分布显著前移（top3 5 → 13），且阶段一不需要额外读 case 本体（字面量就在行内）。
predicted_effect:
  metric: golden fixture 上期望 case 的排序命中分布（格子内）
  from: "top1 2 / top3 5 / 中位名次 20（只按 score）"
  to: "top1 9 / top3 13 / 中位名次 3（字面量 + token 交集 + score）"
  measure:
    command: "python3 scripts/rank_candidates.py --eval"
    expect_exit: 0
    expect_stdout: "top3=13"
validation:
  method: metrics_compare
  baseline: 改前只按 confidence.score 排序（本卡 source_signals 的 measured 读数）
  success_criteria: |
    ① 索引行新增 `sig`（quickly_check 字面量分支，≥5 字符、去正则元字符、上限 6）与 `tok`
       （全部症状的 token，上限 12）；**行宽增量实测 68 字符/case（最大 322）——高于预期的 <40，如实修正**；
       覆盖：sig 74/159、tok 133/159；
    ①b 拆分实测（同一 25 条 fixture）：只加 sig → top3=10；**sig + tok → top3=13**。差异来自行内摘要
       截断（title 160 / 症状首条 120）会漏掉判别 token，故 tok 必须取全部症状——这是本卡实装时才量到的；
    ② 排序器 `rank_candidates.py` 为纯函数 + CLI，`--eval` 在 25 条 fixture 上可复现 top3=13（reviewer 一条命令复核）；
    ③ 单测覆盖三顺位与 tie-break（同分按 id 稳定），以及 sig 提取的边界（元字符剔除、上限、去重）；
    ④ diagnose 步骤 3 写明排序口径（skill 改动走 methodology 门禁，行为面变更）；
    ⑤ fixture 自己的 assertion 一个都不放松——本卡只改排序，不改期望；
    ⑥ 两条跨队 fixture 用新口径重跑并重新记账（rank 前移后写回账本）。
  rollback: 单文件可整体 revert（build_index.py 的 sig 字段 + rank_candidates.py + skill 一段 + 重建索引）；索引是生成物，revert 后重跑 build_index 即回到改前
