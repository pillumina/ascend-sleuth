    conclusion: "落地：build_index 行内新增 sig（_SIG_RE 纯字面量提取，上限 6）与 tok（_lexical.token_of 全症状 token，上限 12，排序后取前 12 保证确定性）；新增 scripts/rank_candidates.py（三顺位排序 + --eval + --json + --list-ns，纯函数 rank_rows 可测）；token 判据抽到 scripts/_lexical.py 单一事实源（trace_metrics 与本排序器共用，防两份模式清单漂移）；diagnose 步骤 3 写明排序口径；CLAUDE.md 的 Tier 2 行字段说明同步；两条跨队 fixture 用新口径重跑并重新记账"
