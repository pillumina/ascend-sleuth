source_signals:
  - signal: knowledge_gap
    evidence: >-
      PR #207 合入时已知并登记的一处缺口：`op-internal-sync-and-reduction` 里的「尾块空核未参与同步」
      只写了「参与 Set/Wait」，漏了**归还槽位（ready/free 配对）**与**奇数尾 chunk 中未被使用的固定槽
      也必须配对**这两个细节——而来源（flash_attn_lite_story）明确把它们作为挂死根因的一部分，且给出了
      更具体的症状（random hang / 跑到超时 / AIC 卡在等第二路通知）。当时未改是因为该词条已合入 main，
      修订 active 内容属 kb/high-risk，需单独的高风险 PR。
    trajectory:
      - references/fault-patterns/op-internal-sync-and-reduction.yaml（被修订词条）
      - "Samples/2_Performance/flash_attn_lite_story/README.md（『即使尾块中 AIV1 没有有效输出行，它仍须参与同步并归还槽位，只跳过最终写回。』）"
      - proposals/ideas/EV-2026-073.yaml（同批吸收时登记的待补项）
hypothesis: >-
  补齐「归还槽位」与「奇数尾 chunk 槽位配对」后，尾块类偶发挂死的排查面从「有没有参与同步」扩展到
  「有没有归还槽位」，与 CrossCore/Mutex 分工词条（跨核交接 vs 核内槽复用）形成完整判据链；
  症状侧补入 random hang / 超时 / AIC 等第二路通知后，检索命中率也应提高。
predicted_effect:
  metric: 修订后词条在 schema/索引校验下的一致性，以及症状词可检索性
  from: 该 pattern 的症状 2 条、cause/fix 未含槽位归还
  to: 症状 6 条（含 random hang / 跑到超时 / AIC 卡在等第二路通知 / 奇数尾任务偶发挂死），cause/fix 含 ready/free 配对
  measure:
    command: "python3 scripts/verify_references.py --check && python3 scripts/build_ref_summary_index.py --check && python3 scripts/build_procedure_index.py --check && grep -q '归还槽位' references/fault-patterns/op-internal-sync-and-reduction.yaml && grep -q '奇数尾 chunk' references/fault-patterns/op-internal-sync-and-reduction.yaml"
    expect_exit: 0
