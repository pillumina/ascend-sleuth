# ============================================================
# EV-2026-160 —— 超格检索定案：上限改按 token 算、阶段一读紧凑行；不拆目录、不砍内容
# 来源：用户审视知识库/先验层索引的取用面后，剩下两点（93/60 越界、超格后没有中间档）
#       要求"你去探索最佳方案，做过实验后给我结论"→ 本卡是那次探索的记录与结论。
# 脱敏：只含仓库内路径、命令与聚合数字（夹具是公开 issue 派生，无客户原文）。
# ============================================================

id: EV-2026-160
layer: L3                          # 容量治理决策（上限口径 + 读侧形态 + 拆不拆）
target_component: scripts/index_read_cost.py
title: "超格检索定案：上限从「条数」改按「阶段一实读 token」算（实测 252/条 vs 估算 70/条）+ 阶段一换紧凑行；平台轴与标签轴拆分被数据否掉，砍内容不采纳（三形态对照不可区分）"
status: validated
authorization: dual                # 结构决策（上限语义、读侧形态、拆分与否）→ 人双签；本 PR 落地的代码只是度量工具（尺子本身可 review 级）
dimension: architecture
supersedes: []
superseded_by: null
created_at: 2026-09-29
source_signals:
  - signal: user_inquiry
    evidence: "用户先问「kb 与 reference 的索引 lookup 设计是否合理」（剩下两点：格子 93/60 越界、超格后只有整读与不读两态），再明确「按照上面的我无法决策，需要你去探索最佳的方案是什么，做过实验后给我结论」"
    trajectory:
      - "实测 1（本卡新增的尺子）：`python3 scripts/index_read_cost.py` → 该格 93 条 = 23449 tok（252 tok/条）；ADR-0004 的 hard_cap 算式写的是 60×70≈4.2K tok，**每条成本估小了 3.6 倍**，这是 93 条看起来「贴着线」的全部原因"
      - "实测 2（三形态对照实验，27 次独立 agent 调用：9 条难例夹具 × 3 种行形态，症状文件名用编号防泄漏）→ top-5 命中 A 标题160+症状首条 6/9、B 标题60+症状首条 6/9、C 标题160+无症状首条 5/9；top-3 分别 4/9、5/9、5/9。三形态**不可区分**（原始数据 proposals/experiments/slim-row-2026-09-29.json，运行时件）"
      - "实测 3（平台切分**不是**被否掉，是没必要——早先一版说错了，见 decisions 的更正）：17 条大格夹具里「输入提到的平台」与「case 声明的 platforms」冲突 **0 条**；按平台切读集的实测成本：A5-950 + 未声明/cross 38 行 ≈6.5K、310P 40 行 ≈7.0K、A3-910C 54 行 ≈9.6K、A2-910B 59 行 ≈10.3K；平台未知则读全部 93 行 ≈16.1K（= 现状，不更差）。93 条里 30 条没声明 platforms（永远要读）、17 条夹具里 10 条的输入根本没提平台（只能靠工程师告知）"
      - "实测 4（标签派生族）：93 条原始 case 平均 6.99 个 tag/条（**读侧看到的是截断后的 6 个**，51/93 条原始 tag >6），按优先表派生只覆盖 73/93、最大子格 18；且读侧得先做分类器 → 等于把「负载类型不由症状词判」的纪律反过来用"
      - "实测 5（先 grep 再读，口径写清）：拿夹具输入里的字面量键 grep 该格，**期望行落进命中集 11/17 条**（分母是「有期望 case 的 17 条夹具」，不是全库 168 条）；命中集中位 17 行 ≈2.5K、最大 56 行 ≈8K；另测全库 168 条里 sig 为空的占 52%——字面量筛对那批永远命中不到，所以它只能当可选加速、不能当唯一路径"
hypothesis: >-
  上限按「阶段一实读 token」算、读侧从 YAML 分片换成**字段一一对应**的紧凑投影之后，最贵的格子
  降到硬线以内（23449 → 16135 tok，−31%）且不损失判断证据；拆分与砍内容都不必做。
predicted_effect:
  metric: 最贵格子的阶段一实读 token（紧凑读侧投影，含字段名与 category/score）
  from: "23449 tok（252/条，YAML 分片；超 20K 硬线 17%、超 8K 软线 193%）"
  to: "16135 tok（173/条，同信息紧凑投影；硬线内、超软线，属「值得再省」的评估档）"
  measure:
    command: >-
      python3 scripts/index_read_cost.py --json --format compact --cell inference/vllm-ascend/interrupt
      | python3 -c "import json,sys; d=json.load(sys.stdin); c=d['cells'][0]; assert c['compact_tok'] < d['cap'] and c['compact_tok'] < c['yaml_tok'], c; print('ok compact=%d yaml=%d cap=%d' % (c['compact_tok'], c['yaml_tok'], d['cap']))"
    expect_exit: 0
    expect_stdout: "ok compact="
    # 复现：python3 scripts/ev_measure.py EV-2026-160 --run
    # 注：断言里的两个不等式是**属性**（越线或不再更省时就红），不是某个会随 case 增长而腐烂的常数
validation:
  method: golden_replay
  baseline: "现行 YAML 分片 23449 tok；三形态对照 top-5 = 6/9(A) / 6/9(B) / 5/9(C)"
  success_criteria: "①投影**字段集合**被测试逐个钉住（`tests/test_index_read_cost.py` 断言字段名序列：少一个即红——这条是独立预核的反例之后补的，原先只查症状子串、「悄悄删掉 tok」仍全绿）；②紧凑投影比现行 YAML 省 ≥25% 且 ≤ 硬线（实测 −31%、16135 < 20000）；③三形态对照不劣于现行形态（6/9 vs 6/9）；④退出码契约在 `--json` 与人读表下同码（0/1/2）"
  rollback: "分支可整体丢弃；合入后 git revert（本 PR 只加度量脚本与测试，未改读侧）"
gate:
  condition: "用户「探索最佳方案，做过实验后给我结论」"
risk: high                         # 结构决策：上限语义 + 读侧形态 + 拆分与否
principle_refs: [2, 6, 9, 10]
actual_cost:
  tokens: 320000
  source: estimate
  note: >-
    口径：实验是大头——27 次独立 agent 调用（9 夹具 × 3 形态，每次读 9~14K token 的候选清单）
    约 26 万；前缀勘察与取数（分片成本、平台分布、标签分布、grep 覆盖率、夹具输入长度）约 4 万；
    写尺子 + 测试约 2 万。不含用户侧阅读时间。
decisions:
  - who: agent（本轮执行）
    when: "2026-09-29"
    type: proposal
    conclusion: >-
      两条约束分开处理：**成本量**（阶段一实读多少 token）与**候选质量**（能不能挑对）。
      成本量用尺子现算（本卡新增 `scripts/index_read_cost.py`），候选质量用对照实验判。
      本卡结论只在这一对读数上成立，不引入新检索技术（ADR-0002 的「不做向量检索」不变）。
  - who: agent（本轮执行）
    when: "2026-09-29"
    type: action
    conclusion: >-
      落地：`scripts/index_read_cost.py`（两种读法的逐格 token 现算 + 硬线/评估线判定 + 退出码契约）
      与 `tests/test_index_read_cost.py`（9 条：估算口径 / 紧凑行字段与截断 / 逐格成本 / 缺分片不崩 /
      退出码）。**本 PR 不改读侧**：把分片渲染换成紧凑行属另一个可独立评审的改动（要同时改
      `--check` 的解析、面板对总表的读取不受影响、诊断步骤一的读法文字），另开卡落地。
  - who: agent（本轮执行）
    when: "2026-09-29"
    type: eval
    conclusion: >-
      实验口径与读数：三形态各 9 条难例夹具（机械键名次 >5，判断决定成败），单次独立调用；
      症状文件名用编号（首轮用夹具 ID 命名时子代理直接把文件名当证据，读数作废重跑）。
      结果 top-5 = A 6/9、B 6/9、C 5/9，逐条看差异只在 4 条「输入被截断」的夹具上翻转
      （13964/12983/12989/12461），另有 1 条（13086，verl/Ray 训练栈落在推理格）三种形态全错。
      即：**决定成败的是输入里有没有报错文本，不是行的长短**。
  - who: agent（本轮执行）
    when: "2026-09-29"
    type: decision
    conclusion: >-
      采纳（validated，dual）：①上限口径改为「阶段一实读 token」，软线 8K / 硬线 15K（现算，
      不写进生成物）；ADR-0004 里 `60×70≈4.2K` 那行算术要按实测改（252/条 YAML、152/条紧凑行）。
      ②读侧采用紧凑行（同信息，去 YAML 结构开销）：最贵格子 23449 → 14154 tok。
      ③**平台轴不做，但不是因为不可行（更正早先一版）**：早先那版说「8 条里 1 条会被平台读集
      排除（13050）」——那是**错的**：当时的平台识别用了宽松正则 `A3[ -]?`，把模型名
      `Qwen3.6-35B-A3B-w8a8` 里的 `A3B` 当成了 A3-910C；该夹具输入里只有 `310p` 镜像，
      与 case 声明的 `platforms: ["310P"]` 一致。用精确词边界重测：17 条夹具「输入提到平台」
      与「case 声明平台」冲突 **0 条**；按平台切读集的实测成本也够用（A5+未声明 38 行 ≈6.5K、
      310P 40 行 ≈7.0K、A3 54 行 ≈9.6K、A2 59 行 ≈10.3K，均 ≤ 硬线）。**不作为本卡动作**的
      真实理由是：它不是必需（格式切换已把 93 条压到 16.1K），且要动分片命名与读侧选片规则、
      还要处理 30 条未声明平台的 case——留给下一杠杆：当某格读侧视图长到 >20K 硬线时启用。
      ④**不做标签派生族拆分**：覆盖 73/93、需读侧分类器，等于把刚拆掉的「症状词判类」装回来。
      ⑤**暂不砍内容**（标题 60 字 / 去掉症状首条）：对照实验不可区分，省下的 25% 不值得冒
      未测出的风险；要砍需先扩样本（每形态 ≥3 次重跑）再判。
      ⑥字面量 grep 先读保留为**可选加速**（不作强制路径）：命中即省到中位 2.5K，但 17 条夹具里
      6 条的期望行不在命中集里，强制就等于退回机械筛选（机械键在 9 条难例上 recall@5 = 0/9）。
  - who: agent（本轮执行）
    when: "2026-09-29"
    type: decision
    conclusion: >-
      旁路发现（另立事项，不在本卡范围）：`eval/golden/` 里大格夹具的 `input.symptoms` 多数被截到
      1201 字（多条恰好 1201、结尾停在半个词），其中 4 条只剩环境段、无任何报错文本；另有 1 条
      （13086）是训练侧调用栈却落在推理格。后果是「报错签名命中」这一面在这些夹具上测不了，
      而 eval 账本里的历史命中读数会读高。建议：补全这些夹具的输入，或把断言改成
      "top-5 命中或如实弃权"，并把输入完整性记为夹具头注的一部分。
  - who: agent（独立预核会话 + 本轮回修）
    when: "2026-09-29"
    type: decision
    conclusion: >-
      独立预核（另起会话，只读仓库事实与本 diff）判 **MERGE_READY: no**（无阻断级、两条重要级），全部回修：
      ① 重要级——`compact_line()` 少 `category` 与 `score`，而"字段被悄悄砍掉"能一路绿灯：预核的反例是把
      `tok` 段整段删掉后 12 条测试仍绿、卡里的 measure 仍过。回修：投影补齐九个字段（含 category/score），
      测试改成**断言字段名序列**（删 `tok` 即红，已复跑验证），并把 measure 的期望值从只断言 `ok` 改成
      `ok compact=… yaml=… cap=…`（跑不跑得通一眼可见）。
      ② 重要级——`--json` 绕过退出码契约（`--cap 100` 时 `--json` 恒 0、人读表 1），而卡的 measure 恰好走
      `--json`。回修：两条路同码（0/1/2），并加测试钉住。
      ③ 建议级一并收：缺读侧视图不再静默报 0（`missing_views` 点名 + 退出码 2）、`--root` 传错报 2、
      头注里漂移的两个数字（148/236）改成"脚本现算 + 那次的实测值"、硬线由"15000 折中"改为**推导**：
      20000 = 不许超过常驻指令面（SKILL 11.4K + 仓库指令 5.7K + 路由表 4.1K ≈ 21K）。
      ④ **更正一处结论错误**：平台轴"有反例"不成立（宽松正则把模型名 A3B 当 A3-910C），已按精确词界重测
      （0/17 冲突）并把结论从"不做（有反例）"改成"不做（不必要，留作下一杠杆）"。
      ⑤ 另有一处口径不实已修：grep 那条的分子是 11/17 条夹具，不是全库比例；并补上"全库 sig 为空的占 52%"。
      预核同时确认：估算口径两形态公平（bytes/tok 3.23–3.52 交叉验证）、`id→file` 全库零例外（但属约定、
      无校验器）、三形态 top-k 读数逐条复算一致。
