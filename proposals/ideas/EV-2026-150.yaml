decisions:
  - who: agent
    when: 2026-09-28
    type: action
    conclusion: >-
      先核对「是不是那一个文件的问题」，结论是范围比用户看到的大：带日期的生成物共 6 个文件，
      三个生成器各带一份日期归一化。因此按同一口径一起改，而不是只改用户点到的那两个分片。
  - who: agent
    when: 2026-09-28
    type: decision
    conclusion: >-
      **做法选的是「不写日期」而不是「只在变化时更新日期」**。后者（比出内容相同就不动那一行）
      能让 diff 干净，但它把一件简单的事变成有状态的写入逻辑，且换个实现就失效。
      不写日期是没有状态的做法，且顺带得到一个更强的 `--check`：归一化消失在源头，
      整篇比较即可，任何多出来的行都报过期。
  - who: agent
    when: 2026-09-28
    type: eval
    conclusion: >-
      **不变量必须有牙齿，所以补了一条测试并把牙齿实测出来**：`tests/test_generated_indexes_no_date.py`
      两类共 6 条——①三个生成器在真实 `references/` 上渲染一遍，头注里不许出现日期
      （只判头注，词条正文提到时间不算）；②在一个只含最小词条的临时仓库里写出生成物，
      再塞一行日期，三个 `--check` 都必须报过期。
      **独立预核把这一段原先的说法证伪了一处，已改**：我原先写「这一条钉的正是归一化不许回来」——
      实测不成立。归一化只替换日期值、消不掉多出来的那一行，所以单独把归一化加回 `--check`
      （生成器仍不写日期）时这一条照样通过。防那条回归的其实是 ①：生成器一写回日期它就红
      （生成物有没有跟着重生都红，实测两条路径都红）。测试与卡里的措辞已按实测改窄。
      负向对照实跑：把 summary 索引的 `词条数` 那一行改回带 `# 生成日期：2026-09-28`，
      测试当场红；改回即绿。测试并进既有的 `python3 -m unittest discover tests` 套件，不新增 CI job。
  - who: agent
    when: 2026-09-28
    type: decision
    conclusion: >-
      **头注里那句「不写生成日期」只加在选择器上，没加进三个分片**。理由是成本：
      选择器每次走方法缺口都要整读一遍（按仓库自己的 round(len/2.6) 口径实测：选择器文件 430 → 442 token，
      净 +12；去掉的日期行抵消了大部分新增），而它的头注本来就承载设计说明；
      分片紧随其后被打开，同一句话再说三遍就是白付三份。防回归靠的是测试，
      不是靠头注里的一句话——两者留一个够用，留成本低的那个。
  - who: agent
    when: 2026-09-28
    type: eval
    conclusion: >-
      **端到端演练先红后绿，红的是一次真实的假绿**：第一次跑
      `scripts/rehearse_evolve_loop.py` 时它报 `[reference-validation] build_procedure_index.py --check`
      失败——当时我改了分片头注却还没重跑生成器，生成物与生成器不一致。
      这次红不是演练本身的问题，正是这道门该抓的东西；重跑生成器后演练 183/183 全绿。
      记录在案的理由：它同时证明了「生成物随 PR 走」这条纪律在演练里真的被判。
