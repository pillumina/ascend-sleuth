# ============================================================
# EV-2026-150 —— 生成物不写日期：三个索引从「写日期 + --check 归一化掉再比」改成不写日期 + 整篇比较
# 来源：用户在一个只改 references/ 的 PR 上看到 diff 里混着两个不相干分片的改动，
#       问「那个日期的注释是不是可以去掉，不然每次都会变更」。核对后确认：不是那一个文件的问题，
#       是生成物平面里三个索引都带着一个「每次重建都变」的字段，而知识索引（build_index.py）
#       早就因为同一个理由去掉了它——这次是把另外三个对齐。
# 脱敏：只含仓库内路径、命令与聚合数字。
# ============================================================

id: EV-2026-150
layer: L2
target_component: scripts/build_procedure_index.py
title: "生成物不写日期：三个索引（流程选择器 / 背景类 summary / 错误码缺口）从「写日期 + --check 归一化」改成不写日期 + 整篇比较"
status: validated
authorization: review
dimension: maintainability
supersedes: []
