id: EV-2026-114
layer: L2
title: 「上游修复是否已落地」的实证规则进诊断流程——skill 步骤 5 一句前提 + 流程文档展开
status: validated
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: 2026-09-17
source_signals:
  - signal: design_gap
    evidence: "diagnose 的源码分析小节第 5 步原文是「`gh search issues/prs` 看上游是否已修复（**已修复→fix=升级到修复版本**）」——它把「上游有 PR / issue 已 closed」直接当成「你的部署版本里有这个修复」。本域的常见误判面正好落在这个缺口上：① PR 可能只合进主干、未 backport 到你的 release 分支；② 部署形态常是镜像 / fork / 定制构建，**按 release tag 推断版本包含关系在此失效**；③ 同一个文件里以别的方式算了同一个量，会被当成「修复在里面」（主题相邻命中）。"
    trajectory:
      - "skills/diagnose/SKILL.md#源码分析小节 步骤 5（改前）"
      - "skills/diagnose/references/diagnosis-procedure.md#步骤 5（改前，无落地实证段）"
hypothesis: 在步骤 5 的 follow-up 里写明「『已修复』不是结论、是待验证假设」，并把落地实证的四~六步（特征行提取 → 在你部署的那份代码里核对 → 反证规则 → 静态存在≠运行时走到 → 结论分档）放进该 skill 自己的流程文档后，诊断给出的「已修复/升级即可」结论会带上可核的证据（特征行 + 文件:行），而不是停在 release note 级别的推断。
predicted_effect:
  metric: "「已修复」类结论的证据形态"
  from: "推断级（release note / PR 标题 / issue closed 状态）"
  to: "行级（修复特征行 + 它在部署版本代码里的位置；或如实写「无法判定」）"
  measure:
    command: null
    reason: "这是进 agent 判断步骤的行为规则，没有机械判据可复现（机械可判的只有「规则写没写进 skill」这种形式项，那属于假硬化）。可核的是观察窗：下一批真实诊断里，凡给出「已修复/升级即可」结论的 session，其人读报告应含特征行级证据或显式标注无法判定。"
validation:
  method: scan_review
  baseline: 改前 SKILL 步骤 5 只写「已修复→fix=升级到修复版本」，无落地实证前提
  success_criteria: |
    ① `skills/diagnose/SKILL.md` 步骤 5 写明「已修复不是结论、是待验证假设」并指出必须做落地实证（一句话触发规则，不写 ref-id）；
    ② 展开（四~六步：不接受二手结论 / 提取特征行 / 在部署版本代码里核对并区分官方 tag 与镜像、fork、定制构建 / 反证规则 / 静态存在≠运行时走到 / 结论分档）进 `skills/diagnose/references/diagnosis-procedure.md` 步骤 5——渐进式披露：skill 只给触发，细节按需读；
    ③ 中性：正文不出现任何外部项目名、仓库链接或署名；
    ④ skill 外部锚卫生绿（无日期 / 无 ADR 号 / 无卡号）；
    ⑤ 观察窗：下一批真实 trace 里「已修复」结论附行级证据或显式无法判定。
  rollback: 两处文档改动可整体 revert（skill 一句话 + 流程文档一段），无代码与数据副作用（原则七）
gate:
  condition: "不等数据触发：补的是结论类步骤缺失的前提（流程完整性），随 PR 合入"
