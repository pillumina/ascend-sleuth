    ② 错误码族两族分列且**保留可恢复性与分场景处置**（LLM_WAIT_PROC_TIMEOUT 在传输接口上不可恢复这条必须在内）；
    ③ 边界如实标注：hixl 38 篇、torchtitan-npu 15 篇 pending 明确写进 triage note（不是"判过不沉淀"的 skipped）；
    ④ 口径差异如实保留：SDC 的 native/typed 双入口与"改模式需重启"、AutoFuse 的"训练成功≠融合生效"；
