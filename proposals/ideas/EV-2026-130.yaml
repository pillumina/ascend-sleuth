  - who: agent
    when: 2026-09-18
    type: action
    conclusion: "落地：新增 scripts/verify_evidence.py（逐条重读原件比对；六态 PASS / MISMATCH / NOFILE / NOLINE / READ-ERROR / NO-ORIGIN；退出码 0/1/2）与 tests/test_verify_evidence.py（13 项）；skill 侧三处措辞增量——SKILL.md 证据落盘铁律加一条、diagnosis-trace.md 新增 quotes 段（字段、判据、六态处理表）、report-template.md 第 3 节标注规则与第 7 节自检项"
  - who: agent
    when: 2026-09-18
    type: eval
    conclusion: "实测：①单测 122 项全绿（新增 13 项）；②合成样例（原件 3 行 + 3 条引文）得 PASS 1 / MISMATCH 1 / NOLINE 1、退出 1——MISMATCH 那条是「引文比原件多出编造内容」，正是外部实现 PARTIAL 档会放过的形态；③diagnose skill 按需面 26038 B → 27216 B（+1178 B ≈ +346 tok），常驻面不变（description 未动）"
  - who: agent
    when: 2026-09-18
    type: decision
    conclusion: "采纳（validated）。刻意不搬外部实现的 PARTIAL 档（子串或超集算过）——超集就是「引文里混进原件没有的内容」；本地判据只认逐字相等与显式 `...` 截断的分段按序命中。体验侧按会话判断收窄：无原件不降级（粘贴为主的现场不该满屏「未验证」），报告只在核过时加标注。残余：本脚本不进 CI（判断性产出，与 report_lint 同级），有原件却没跑它时仍然无声——靠报告第 7 节自检兜底。"
