# EV 卡（proposals/ideas/EV-YYYY-NNN.yaml）—— 自演化决策档案
id: EV-2026-130
layer: L2
target_component: skills/diagnose/references/diagnosis-trace.md
title: 有原件的引文机械核过，核不过的结论降级（无原件不假装核过）
status: validated
authorization: review
dimension: observability
supersedes: []
superseded_by: null
created_at: 2026-09-18
source_signals:
  - signal: external_reference
    evidence: "对照同域外部工具（同事的 ascend-field-issue-analyzer）：它把证据写成 {file,line,quote} 三元组，verify 子命令重读原文件逐字比对，FAIL 即把相关结论降级。本地没有对应能力——诊断报告契约把「结论可核对」列为判断项，机械检查只到「文件存在 / 字段配对」这一层。"
    trajectory:
      - "外部实现：github.com/hu669293657/skills 的 ascend-field-issue-analyzer/scripts/log_analyzer.py cmd_verify（PASS 逐字相等；PARTIAL 子串或超集；FAIL 降级）"
      - "本地零命中：诊断侧无引文一致性脚本、无对应字段；report-template.md §3b 把「源码分析是可复核的」写成人审项，§7 自检只有结构项"
      - "本地证据字段现状：user 事件 evidence 只有 inline / files / sources / missing 四键，引用原文与原件之间没有任何机械关系"
hypothesis: 给 user 事件加可选的 quotes[{file,line,quote}]（只在工程师交了原件时填），并用脚本重读原件逐字比对之后，「引文被改写 / 行号漂移」从无人可见变成脚本可判；核对不过的结论被强制降级，而核不成的场合（无原件）不新增任何读者可见的噪声。
predicted_effect:
  metric: 引文一致性是否可被脚本判定，以及无原件场合的读者可见变化
  from: "引文一致性靠 reviewer 逐条回原文件；工具看不见，也无字段可承载"
  to: "python3 scripts/verify_evidence.py <trace> --root <原件根> 逐条给 PASS / MISMATCH / NO-ORIGIN，MISMATCH 非零退出"
  measure:
    command: "python3 -m unittest tests.test_verify_evidence"
    expect_exit: 0
validation:
  method: metrics_compare
  baseline: "改前：无核对工具、无 quotes 字段（证据只有 inline / files / sources / missing）"
  success_criteria: |
    ① quotes 是**可选**字段：只有工程师交了原件（日志文件 / 日志包 / handoff 包）时才填；粘贴场景保持现状；
    ② 判据**只认逐字相等**（空白归一化后比较）——不采用外部实现的 PARTIAL（子串或超集算过，
       引文里混进编造内容也能蒙过）；
    ③ 文件不存在 / 行号越界 / 文本不一致 → 非零退出，报告侧规则要求该条结论降级；
    ④ 无原件的证据记 NO-ORIGIN：不降级，也不进报告读者视野（避免"满屏未验证"的体验退化）；
    ⑤ 报告依据链只在核过时加标注，缺省不显示。
  rollback: "新脚本与新单测可整体删除；quotes 是可选字段，老 trace 不受影响；skill 侧是措辞增量，git revert 即回到改前（原则七）"
gate:
  condition: "一次外部对照（同域工具已有机械回验）+ 本地现状当场核对（报告契约把可核对列为判断项、证据字段无承载位）。不是预判。"
risk: low
principle_refs: [1, 2, 10]
actual_cost:
  tokens: 0
  source: estimate
  note: "无 tokenMeter 读数，按既有卡口径以 0 计"
