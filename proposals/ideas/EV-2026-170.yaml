# ============================================================
# EV-2026-170 —— 排序侧改动给一条自动对照：同构口径前后各算一遍名次，变差报警
# 来源：用户认可「排序口径先当预警、不当门槛」（本会话讨论中的 A′），要求把已分析清楚、
#       值得落地的 eval 机制落点全部落地。
# 脱敏：只含仓库内路径、命令与聚合数字
# ============================================================

id: EV-2026-170
layer: L2
target_component: scripts/rank_candidates.py
title: "阶段一排序加自动对照：同构口径前后各算一遍名次，变差报警、不可比则不给读数"
status: validated
authorization: review
dimension: evolvability
supersedes: []
superseded_by: null
created_at: '2026-10-07'
source_signals:
  - signal: user_feedback
    evidence: >-
      用户选择把排序口径先做成预警而不是门槛：可以自动跑、红了人看，但不据此阻塞合并；
      当门要先攒够机械键与生产结论同向的对照记录。
    trajectory:
      - "用户会话输入（本轮；无仓库内出处）"
  - signal: observation_window
    evidence: >-
      改前 `scripts/rank_candidates.py` 只有 `--eval` 一个读数出口，没有任何基线对照模式：
      索引行的字面量或 token 被改动后，名次变化要靠人工把前后两次输出并排比；
      而阶段一是整条链路上唯一位于窗口前端的闸口——正确答案排在第 6 名之外就永远不被加载
      （`docs/guide/eval.md` 的排序量尺一节记了同构口径与 25 条夹具的实测）。
    trajectory:
      - "docs/guide/eval.md 的「排序/筛选类改动的量尺（必须与管线同构）」一节"
      - "scripts/rank_candidates.py 头注记的 EV-2026-111 实测与 2026-09 同构口径修正"
hypothesis: >-
  给阶段一的排序加一条同构口径的自动对照（改动前后各跑一次，逐条比名次与行内证据条数），
  索引侧证据被改坏时当场报出并退 1；没有基线或两份名次口径不同时报"不可比"并退 2，不给读数。
  它只覆盖阶段一的筛与排，是 agent 判断的代理指标，所以只报警、不拦合并、不进 CI。
predicted_effect:
  metric: >-
    索引行的字面量/token 证据被改动后，名次变化能否不靠人工并排比对就报出来；
    以及缺基线、基线损坏、口径不符时是否明确退化而不是给出一份不可比的读数
  from: >-
    只有 `--eval`（打印三行读数，退出码恒为 0）；没有基线写入与对照子命令；名次变化只能人工比对。
  to: >-
    `--write-baseline` 把同构口径的逐条名次与行内证据覆盖写进本地基线
    （默认 `.s2-replay/rank-baseline.yaml`，按 `.gitignore:77` 不入库）；`--compare-baseline`
    逐条报变差/变好/新增，变差或覆盖下降退 1，无变差退 0；不可比一律退 2 且不给读数：没有基线文件、
    基线读不出来或不是合法 YAML、基线顶层不是映射、基线是空文件、基线里没有逐条名次、基线里的名次
    不是整数或 null、基线里的名次超出 1..top_k 范围、口径不符（排序键不同或 `top_k` 不同）、
    基线里的 fixture 名与现状一个都对不上、现状一条
    fixture 都评不了。基线里有、现状找不到同名文件的 fixture 单列为"不计入变差"。
  measure:
    command: |
      python3 -c "import sys,unittest;t=unittest.TextTestRunner(verbosity=0).run(unittest.defaultTestLoader.loadTestsFromName('tests.test_rank_candidates.RankBaselineCompareTest'));print('VERDICT PASS' if t.wasSuccessful() else 'VERDICT FAIL');sys.exit(0 if t.wasSuccessful() else 1)"
    expect_exit: 0
    expect_stdout: "VERDICT PASS"
validation:
  method: metrics_compare
  baseline: >-
    改前：`python scripts/rank_candidates.py --eval` 的三行读数之外没有对照出口；
    `tests/test_rank_candidates.py` 九个测试（都只测排序与覆盖统计，没有基线读写）；
    脚本无 `BASELINE_DEFAULT`，`main()` 无 `--write-baseline`/`--compare-baseline`。
  success_criteria: >-
    ①`RankBaselineCompareTest` 十四个测试通过（同一份树前后对照退 0 且报无变差；索引侧证据被改坏
    后报变差并退 1；期望 case 不在索引里的 fixture 被跳过；各条不可比路径都退 2 且不出肯定读数——
    缺基线文件、基线不是合法 YAML、基线顶层不是映射、基线是空文件、基线里没有逐条名次、基线里的名次
    不是整数或 null、基线里的名次超出 1..top_k 范围、
    排序键不同、`top_k` 不同、基线里的名字与现状一个都对不上、现状一条 fixture 都评不了；
    夹具改名单列为"不计入变差"而不是报成排序变差）；
    ②`python -m unittest tests.test_rank_candidates` 二十四条全过（改前九条）；
    ③新旧 `--eval` 输出逐行相同（`Compare-Object` 差异 0 行），既有读数不因新增子命令而变；
    ④`python scripts/verify_proposals.py --check`、`python scripts/build_docs_index.py --check`
    与其余仓库门通过；⑤`python -m unittest discover tests` 的失败集合与 `origin/main` 上一致。
  rollback: "回退该提交即可；基线是本地运行件（.s2-replay/ 已 gitignore），无需数据迁移。"
gate:
  condition: >-
    对照报出变差而无人查看；或有人把机械键当门槛用来阻塞合并（它只覆盖阶段一的筛与排，
    生产排序由 agent 按相关性判断）；或把基线文件提交进 git（数字快照入库会在并发合并时撞行）。
risk: low
principle_refs: [6, 8, 10, 11]
actual_cost:
  tokens: 15000
  source: estimate
  note: >-
    口径：改 `scripts/rank_candidates.py`（新增 `BASELINE_DEFAULT`、`_fixture_items`、
    `evaluate_detail`、`_coverage_counts`、`_rank_text`、`cmd_write_baseline`、
    `cmd_compare_baseline`，`cmd_eval` 改用共用 fixture 集合，`main()` 加两个子命令；
    按第一轮独立预核意见补 `cmd_compare_baseline` 的读盘与格式异常处理、排序键校验、改名 fixture
    的归因分流，并把用户可见输出里的比喻改掉；按第二轮意见补零重叠退 2、名次值必须是整数或 null、
    两条不可比路径补重写命令、不可评夹具的归因分流）、`tests/test_rank_candidates.py` 新增一个测试类
    （十四个测试）、`docs/guide/eval.md` 加一节、产卡、判据复跑、三轮独立预核与回修、PR body；
    估 1.5 万，不含预核轮次。
decisions:
  - who: agent
    when: "2026-10-07"
    type: proposal
    conclusion: >-
      采纳「排序口径先做自动对照、只报警不当门槛」这一半，不采纳「当硬门槛」那一半：
      机械键是 agent 判断的代理，同类改动下 agent 的同子集读数高于机械键，把它做成门会用
      更差的判断者拦下更好的判断者。要当门得先攒够两者同向的对照记录。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      对照与 `--eval` 共用同一份 fixture 集合（`_fixture_items`）并写死 `top_k`：
      两次读数的分母与口径不同就没法比，且历史上正是"换个口径就能造出提升"
      （整格内全量排序与管线不同构，同一份数据从 5→13 缩回 12/19），所以口径与 `top_k`
      写进基线文件，不符就退 2。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      基线写成本地运行件、不入库、不进 CI：它是数字快照，入库会在并发合并时撞行，
      而"生成物里不写数字"的前提正是数字不入库。退出码把两类结果分开：退 1 = 查出变差
      （报警，命令本身成功执行），退 2 = 不可比（缺基线、`top_k` 不同），不给读数。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      按独立预核意见回修（阻断 1）：`--compare-baseline` 原来对基线只做"存在性"检查，
      读盘与解析没有异常处理——基线不是合法 YAML 时抛 traceback 退 1（与"查出变差"同码），
      合法 YAML 但 `fixtures` 为空时把 27 条全算成"新增"，打印"结论：无变差。"并退 0——
      对一份不可比的基线给出了肯定读数。改为：读盘与解析进 try/except、空文件与非映射文件各给
      自己的原因、`fixtures` 缺失或为空退 2、排序键不符退 2，五个不可比路径都打印可复制的重写
      命令。另按同轮意见把夹具改名从"变差"分流成"不计入变差"，并在读出总行数变化时提一句
      "绝对条数相同不代表证据没变"。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      按独立预核意见清理用户可见输出里的比喻：脚本与测试里把"哨兵/预警哨兵"改成"前后对照/本命令
      的范围"，"索引里长出了"改"索引里多了"，"机械键据此退让"改"机械排序键据此失据"；
      测试类名一并从 `RankBaselineSentinelTest` 改为 `RankBaselineCompareTest`（本卡判据命令同步改）。
      依据 `docs/spec/writing-norms.md:20`：不用比喻与拟人，自造代称首现不得未定义。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      按第二轮独立预核意见回修（阻断 1）：基线里的 fixture 名与现状零重叠时（夹具整体改名、
      或拿别检出/别分支写的基线来对照），原来没有任何一条真被对照却打印"结论：无变差。"并退 0——
      与本卡"不能对一份不可比的基线给出肯定读数"冲突。改为：零交集即退 2 并给重写命令。
      同时修阻断 2：基线里的名次值原来不校验，写成字符串 `"1"` 会在名次比较处抛 `TypeError`
      退 1（与"查出变差"同码）且只有 traceback，写成 `1.5` 会被当名次用并给"变好/无变差"退 0；
      改为只接受整数或 null，其余退 2。另按同轮非阻断意见：`top_k` 与排序键两条不可比也补上
      可直接复制的重写命令（`top_k` 那条带 `--top`）；"现状一条 fixture 都评不了"这条按是否
      有被跳过的夹具分两种文案（原先把夹具改名一律说成"期望 case 不在索引里"）；文档与该分支
      措辞里"共五种"改为一句话枚举，避免与代码漂移。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      按第三轮独立预核意见收口（该轮无阻断项，四条非阻断）：①名次值原来只校验类型不校验范围，
      基线写 `0`/`-1` 会假报"名次后退"退 1、写 `6`/`99`（大于候选窗口）会假报"变好"并给
      "无变差"退 0——补 1..top_k 范围判定，越界与类型非法走同一条退 2；②坏值原来只打印 fixture
      名不打印坏值，改为打印 `(名, 值)` 对，读者不必开文件；③脚本头注与 `docs/guide/eval.md`
      把"不可比的每一路都给可直接复制的重写基线命令"收窄为"重写基线这几路给重写命令、
      '现状一条 fixture 都评不了'给重建索引与补夹具的下一步"（那条要修的不是基线）；
      ④测试类 docstring 的"一格索引 + 一条 fixture"改"若干条"。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      按第四轮（最终轮）独立预核意见收口（该轮无阻断项、五条非阻断，本条清前四条）：
      ①本卡 `predicted_effect.to` 与 `success_criteria` ① 两处枚举补上"基线里的名次超出
      1..top_k 范围"与"基线顶层不是映射"；②脚本头注与 `docs/guide/eval.md` 的退出码枚举
      同样补"基线顶层不是映射"（原枚举九路，实际 exit-2 文案十种）；
      ③文档里"『现状一条 fixture 都评不了』给下一步"收窄为"夹具都在、只是与原状对不上的
      那一路给重建索引与补夹具的下一步"（"一条 fixture 都没有"那一路本来就没有下一步）；
      ④本卡首字节的 UTF-8 BOM 去掉（全仓受跟踪文件里只有它有 BOM，会让"读第一行判前缀"
      这类检查假失败）。第五条（PR 描述里的测试计数）改在不入库的 PR 描述里。
  - who: agent
    when: "2026-10-07"
    type: eval
    conclusion: >-
      判据复跑（worktree，本机 Windows，2026-10-07）：
      `python -m unittest tests.test_rank_candidates` 二十四条全过（改前九条）；
      真实仓库上 `--write-baseline` 写 27 条 fixture（skip 1 条：期望 case 不在索引里）、
      recall@5 15/27、进前三 15，`--compare-baseline` 报无变差、exit 0；
      覆盖读数 `sig 80/168、tok 142/168`；`--eval` 新输出与 `origin/main` 的旧输出逐行相同。
  - who: agent
    when: "2026-10-07"
    type: decision
    conclusion: >-
      判 validated：判据可复现、已实测通过，索引侧证据被改坏这条路径有测试护住。
      **边界**：十四个测试都在临时目录的合成索引上跑，真数据上"某次改动让某条 fixture 掉出候选"
      还没有出现过；覆盖下降只是提示，具体成因（同格子多出竞争 case，还是索引行自己的证据变了）
      要人看。未做：把它接进 `--gate` 或 CI（需要先攒对照记录）；`scripts/replay_trace.py` 里另有
      一处"行为差异哨兵"的同类措辞，与本卡无关，留给增量清理。
  - who: agent
    when: "2026-10-07"
    type: action
    conclusion: >-
      第五轮（增量收口）独立预核的唯一非阻断项：`--write-baseline` 在"现状一条 fixture 都评不了"
      时同样退 2 且不落盘，但脚本头注与 `docs/guide/eval.md` 的退出码 2 只写在对照流程下，
      且写侧把"夹具改名或删除"与"完全没有夹具"共用一句归因（对照侧第三轮已拆成两种文案）。
      本条补平：写侧按 `skipped` 是否为空分开说明（"夹具与索引对不上 + 先重建索引" /
      "没有可评的 fixture"），头注与文档同步声明"写不出一份能对照的基线就不写"，
      并加一条测试护住（写侧两种归因、不落盘、不打印"基线已写入"）。
