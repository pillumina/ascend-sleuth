  measure:
    command: |
      python3 - <<'PY'
      import pathlib, subprocess, sys
      sys.path.insert(0, 'scripts')
      from _yaml import load_file
      root = pathlib.Path('.')
      fp = load_file(root / 'references' / 'fault-patterns' / 'cluster-compare-diagnosis.yaml')
      fp2 = load_file(root / 'references' / 'fault-patterns' / 'operator-pipe-bound-classification.yaml')
      mt = load_file(root / 'references' / 'methodologies' / 'multi-rank-slow-rank-detection.yaml')
      mt2 = load_file(root / 'references' / 'methodologies' / 'operator-tuning-experiment-method.yaml')
      tools = [load_file(root / 'references' / 'tools' / f'{t}.yaml') for t in
               ('npu-memory-snapshot-analyzer', 'operator-sanitizer-suite', 'operator-coredump-forensics')]
      ok_items = (len((fp['content'] or {}).get('patterns') or []) >= 6
                  and len((fp2['content'] or {}).get('patterns') or []) >= 7
                  and len((mt['content'] or {}).get('flow') or []) >= 5
                  and len((mt2['content'] or {}).get('flow') or []) >= 5
                  and all(t and t.get('status') == 'active' for t in tools))
      gates = load_file(root / 'skills' / 'diagnose' / 'references' / 'collect-gates.yaml')
      bound = set()
      for g in gates.get('gates') or []:
          bound.update(g.get('refs') or []); bound.update(g.get('caveat_refs') or [])
          for br in g.get('branches') or []:
              bound.update(br.get('refs') or [])
      targets = ['multi-rank-slow-rank-detection', 'cluster-compare-diagnosis',
                 'operator-pipe-bound-classification', 'operator-tuning-experiment-method',
                 'npu-memory-snapshot-analyzer', 'operator-sanitizer-suite', 'operator-coredump-forensics']
      ok_bound = all(t in bound for t in targets)
      perf = (root / 'references' / '_procedure-index' / 'performance.yaml').read_text(encoding='utf-8')
      intr = (root / 'references' / '_procedure-index' / 'interrupt.yaml').read_text(encoding='utf-8')
      ok_flow = ('multi-rank-slow-rank-detection' in perf and 'operator-tuning-experiment-method' in perf
                 and 'operator-tuning-experiment-method' in intr)
      r = subprocess.run([sys.executable, 'scripts/verify_references.py', '--check'],
                         capture_output=True, text=True)
      print('items      ', ok_items)
      print('bound      ', ok_bound)
      print('in_flow    ', ok_flow)
      print('verify_refs', r.returncode)
      ok = ok_items and ok_bound and ok_flow and r.returncode == 0
      print('VERDICT', 'PASS' if ok else 'FAIL')
      PY
