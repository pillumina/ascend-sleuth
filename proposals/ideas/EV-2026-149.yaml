# ============================================================
# EV-2026-149 —— 训练侧回放覆盖：路由分侧之后，"这一侧没有量尺"要能现算、且不许再掉回零
# 来源：承接 EV-2026-148（路由拆成"侧 × 性质"两层）。分侧把"侧"变成了**量尺单位**，
#       于是暴露出一件此前没人能一眼看见的事：`eval/golden/` 的真实夹具 25 条全在推理侧，
#       唯一写着训练侧的那条是对着"从未入库的 case"写的构造示例（它自己的头注就写明
#       "当前不可作为可运行回归"）。训练侧 22 条 case，0 条有夹具。
# 脱敏：只含仓库内路径、命令与聚合数字；两条新夹具的输入取自公开 issue 首帖，
#       剥掉平台自动附的安全提醒样板与页脚，唯一删改是模型 config.json 的附件链接（含上传 id 与哈希）。
# ============================================================

