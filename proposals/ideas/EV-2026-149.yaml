      `gate` 里写的那件观测（"'侧要问一句'的真实比例只有上线后的 trace ≈ `side_source` 分布能回答"）
      **当前没有任何一条命令能算**。这是本次发现的**残余缺口，如实标注、不在本卡范围**：
      要让它可测，得让 `side_source` 进 `trace_metrics` 的产出，那属观测层的改动（本卡只到"补量尺"）。
