      `side_source` 更是不能在夹具里固定：它的值取决于**输入材料里有没有写**（材料里写着 = `evidence`、
      问他 = `user`、给框架名对目录 = `framework`），不是由夹具选定的，硬写一个值等于伪造观测。
      另外核清了 `side` / `side_source` 的**现行消费者**：全仓只有两处——`skills/diagnose/references/
