    conclusion: >-
      先复核缺口再决定做什么。复核结论：缺的不是"夹具里少一个 side 字段"，而是**训练侧整条链没有量尺**
      ——25 条真实夹具全在推理侧，唯一写着训练侧的是对着未入库 case 写的构造示例。
      量尺候选按用户要求给了两条并实测了强度，没有默认选第一条（见下一条 decision）。
  - who: agent
    when: 2026-09-23
    type: eval
    conclusion: >-
      **两条候选量尺的取舍（都实测了，证据如下）**。
      ①**端到端回放（golden 路径）**：夹具里加期望的侧，跑 replay 看侧与性质是否都对。
      实测可行——训练侧不是没有回放样本，主检出 `traces/*.yaml` 里有 4 条 resolved、
      且都已沉淀成 case 的训练侧 session（MSLLM-1655 / MSLLM-1780 / MSLLM-1707 / MSLLM-1805）。
      取其中 2 条造夹具；拿它们的**首帖原文**跑 `rank_candidates.py` 复核检索面：
      MSLLM-1780 在 `training/mindspeed-llm` precision 面排第 1（token 交集 6），
      MSLLM-1655 在 interrupt 面排第 1（token 交集 2）；再用 `route_check.effective_branches`
      逐条算首个命中的性质，两条都是**唯一命中**（`全部命中` 只有一条）、与期望一致。
      力度上限：回放喂的是固定输入 + 固定 `framework`，侧由"框架名对到库里目录"这一档确定，
      所以它断言的是"**正确侧的知识被检索到 + 侧内性质判对**"，**不是**"侧是怎么判出来的"。
      ②**结构级判据（`scripts/route_check.py` 那条路）**：不改夹具，对全库 case 跑检查。
      实测它的现状读数：147 个文件里 7 个非零退出；按侧算可判 146 条（training 22 / inference 124），
      其中"明确判错"6 条（inference 5 / **training 1** —— `MSLLM-FA-MASK-GRADNAN`）、
      "零命中"22 条（inference 21 / training 1 —— `VERL-6756`）。
      它的**强度上限实测出来了**（构造 12 个变体逐条跑）：把训练侧性质词挪走/删掉，
      **8 个变体里 7 个零检出**（`build_train_valid_test_data`、`recv_forward`、`重复注册`、
      `aclnn\w+`、`\btimeout\b` 换性质或删除都不报）。原因：这些词都不是任何一条 case 的
      "唯一证据"，别的正则仍先接住；只有当一个词是某条 case 的唯一命中来源时才报
      （挪 `日志.*异常` 精确报出 `MSLLM-1780`；挪 `抢占` 报 `VLLM-ASC-8938`）。
      **它也不适合当 CI 硬门**：现状就有 28 条不符（6 条真判错 + 22 条零命中），
      而"零命中"按流程设计是走语义兜底的正常路径，不是缺陷——硬门会要求把这 22 条先修掉，
      那是在给一个从未被消费的判据改知识库。
      **结论：两条都保留，各测各的层**。端到端回放补"训练侧那条链路接得通、性质判对"；
      结构级判据留作提交前自查（它对单条 case 的证据面有用，本卡不动它）。
  - who: agent
    when: 2026-09-23
    type: action
    conclusion: >-
      实施两件：①新增 `scripts/eval_side_coverage.py`——按侧现算覆盖，`--check` 报任一缺口、
      `--require-side <侧>` 钉住指定侧不许掉回零；CI 只接 `--require-side training` 这一档，
      **不接**"每个格子都要有夹具"（那需要真实来源的夹具、凭空造不出来，做成硬门即假硬化；
      与 `docs/guide/eval.md` 对 holdout 缺口用的"软信号、不红"保持一致）。
      ②补两条真实来源的训练侧夹具 `eval/golden/MSLLM-1780.fixture.yaml`（precision 面）与
      `eval/golden/MSLLM-1655.fixture.yaml`（interrupt 面），输入 = 公开 issue 首帖原文。
      另补 12 条单测、`docs/guide/eval.md` 一节、CI 的 paths 与门各一处。
      **写脚本时自查抓到一个真缺陷**：早先 `library_cases` 只 glob `knowledge/*/*/*/*.yaml`（四段），
      而 `common/` 的 case 在 `knowledge/common/<性质>/`（三段）——于是共享池被印成"0 条"，
      读起来像事实、实际是 glob 够不着。已改成按 `knowledge/**` 递归取、共享池按 `rel[0]=="common"` 收集，
      并补了 `test_common_pool_is_not_a_side` 钉住它（改前该测试红）。
  - who: agent
    when: 2026-09-23
    type: eval
    conclusion: >-
      **夹具字段的核对结论（第 4 步要求先确认谁消费）**：**两条新夹具都不加 `side` / `side_source` 期望字段**，
      理由是机械核对出来的——`scripts/eval_scorecard.py` 只读 `expected` 里的 `namespace` / `case_id` /
