hypothesis: >-
  分侧之后，"侧"成了量尺单位，因此覆盖报告也要按侧算——否则"训练侧没有量尺"这件事只能靠人肉数，
  而人肉数出来的东西既不会随 PR 更新、也不会在夹具被删时报警。把这份报告做成一条命令 +
  两档门（任一含 case 的格子缺夹具 = 报告为缺口；训练侧不许掉回零 = 硬门），
  再用两条**真实来源**的训练侧夹具把缺口补上：训练侧从"0 条可运行夹具"变成"两个性质面各有 1 条"。
  **同时如实标注这条判据的强度上界**：夹具钉的是"某一侧的某一条真实输入"，
  不是那一侧整份词表——别把"补齐了"读成"训练侧词表被改坏会被测出来"。
predicted_effect:
  metric: 训练侧真实夹具条数；以及这份覆盖报告是否真在 CI 里拦得住"训练侧掉回零"
  from: >-
    训练侧真实夹具 0 条（唯一写着训练侧的 `example.fixture.yaml` 指向从未入库的 case，
    不可运行）；"训练侧 0/22"这个数只能靠人肉数夹具并逐条看 `case_id` 在不在库里。
  to: >-
    训练侧真实夹具 2 条（`training/mindspeed-llm/interrupt` 与 `training/mindspeed-llm/precision`
    各 1 条，来源为公开 issue 首帖）；新增 `scripts/eval_side_coverage.py` 一条命令现算按侧覆盖，
    CI 里钉住 `--require-side training --require-side inference`（某一侧量尺归零即红）；
    并新增 `--nature-evidence` 一栏读出「哪几条夹具真钉着词表」（实测 26 条里 10 条词法锚定，
    两条训练侧夹具都在其中）。
  measure:
    command: |
      python3 - <<'PY'
      import pathlib, subprocess, sys
      wf = pathlib.Path('.github/workflows/kb-checks.yml').read_text(encoding='utf-8')
      gate = ('eval_side_coverage.py --check --require-side training --require-side inference' in wf)
      r = subprocess.run([sys.executable, 'scripts/eval_side_coverage.py',
                          '--check', '--require-side', 'training'],
                         capture_output=True, text=True)
      rep = subprocess.run([sys.executable, 'scripts/eval_side_coverage.py'],
                           capture_output=True, text=True).stdout
      doc = 'eval_side_coverage.py' in pathlib.Path('docs/guide/eval.md').read_text(encoding='utf-8')
      # 新的 `--nature-evidence` 也必须被钉住：to 段用它支撑"哪几条夹具真钉着词表"。
      nev = subprocess.run([sys.executable, 'scripts/eval_side_coverage.py',
                            '--nature-evidence'], capture_output=True, text=True).stdout
      nev_ok = ('带性质段的夹具' in nev and '不参与本栏的' in nev
                and 'interrupt←RuntimeError' in nev
                and nev.count('词法命中') >= 2)
      # 训练侧两个性质面都该有真实夹具（构造示例不算）
      t_int = 'training   interrupt' in rep and ' 1  有' in rep
      t_pre = 'training   precision' in rep and ' 1  有' in rep
      print('side_gate_in_ci   ', gate)
      print('gate_exit         ', r.returncode)
      print('documented        ', doc)
      print('training_cells    ', t_int, t_pre)
      print('nature_evidence   ', nev_ok)
      ok = gate and r.returncode == 0 and doc and t_int and t_pre and nev_ok
      print('VERDICT', 'PASS' if ok else 'FAIL')
      PY
    expect_exit: 0
    expect_stdout: "VERDICT PASS"
validation:
  method: golden_replay
  baseline: >-
    **改前基线（本次在 `origin/main` = 07c84fc 的新 worktree 上现算，不引用他人数字）**：
    `python3 scripts/eval_side_coverage.py` → `training 按 case 覆盖 0/22 = 0%`、
    `inference 按 case 覆盖 22/124 = 18%`；训练侧两个格子（interrupt 17 条 case、
    precision 5 条 case）都是"缺"。夹具总表 26 条，其中真实投影 24 条、
    构造示例或指向未入库 case 的 2 条。
    与用户给的口径一致（19/3/2/1/1 的命名空间分布、22 条训练侧 case、0 条训练侧夹具）；
    唯一差异是推理侧分母：用户记的是 124（= 146 可判 case 里除训练侧 22 条），
    本次现算是 `knowledge/inference/` 共 125 条、其中 `inference/sglang/SGL-PD-HEAP-001.yaml`
    路径没有性质段（现有判据不判它），故可判分母是 124——两个数都站得住，差的 1 条是它。
  success_criteria: >-
    ①`python3 scripts/eval_side_coverage.py --require-side training` 退出 0，报告里训练侧
    interrupt / precision 两格都是"有"；②把两条新夹具任一删掉，同一条命令退出 1（门有牙齿）；
    ②′CI 那一步是 `--check --require-side training --require-side inference`——**侧层判据**
    （某一侧一条真实夹具都不剩即红）；格层是**另一个开关** `--check-cells`，默认只报不拦
    （取舍与代价写在 `docs/guide/eval.md` 与门控映射表里）。
    实测两层各自独立触发（合成用例）：现仓 `--check`/`--check-cells` 都 0；某格有 case 无夹具时
    `--check` 0 而 `--check-cells` 1；某侧归零时两者都 1；`--check --require-side training`
    在某侧归零但训练侧有覆盖时 0。
    ③`python3 scripts/eval_scorecard.py --check` 绿（账本随夹具重建：26 → 28 条，
    命中第一 16 → 18、前三 19 → 21）；④`.github/workflows/kb-checks.yml` 逐条本机复跑全绿
    （含 `--check-sources` / `--check-coverage` / `verify_case_draft --all` / `holdout --check` /
    `-m unittest discover tests`）；⑤`python3 scripts/rehearse_evolve_loop.py` 绿。
    **`eval/holdout.yaml` 一字未改**（新夹具默认不进封存集，`holdout --check` 11 条全绿）。
    **这条判据的适用范围（本次实测出的上界，写窄比写宽诚实）**：
    它判的是"**覆盖**"——某个 (侧 × 性质) 格子有没有真实夹具钉住它。它**不判保护强度**：
    夹具钉的是一条真实输入，不是整份词表。实测把训练侧的性质词从一处挪到另一处
    （`build_train_valid_test_data`、`recv_forward`、`重复注册` 等训练专属 token），
    语料级判据与夹具级判据**都可能零检出**——因为这些词都不是任何一条 case 的"唯一证据"，
    别的正则仍先接住它。所以"训练侧有夹具了"只证明该侧链路接得通、且那一条 case 的性质判对了。
    **独立预核把这一段的强度测得更准（修正本卡原先偏保守的说法）**：`--nature-evidence` 实测
    26 条夹具里只有 10 条的输入**词法上**命中期望性质（两条训练侧夹具都在其中），另外 16 条
    输入对三个性质零命中、靠流程写明的语义兜底——**改坏词表那 16 条也照样通过**。
    反过来，两条训练侧夹具**确实**钉着词表：把 `RuntimeError` 从 interrupt 挪到别的性质，
    `MSLLM-1655` 当场报（全库新增 2 条、训练侧 1 条）；而挪一条与它们无关的正则
    （`日志.*异常`、`重复注册`、`recv_forward` 等 8 个变体）全部零检出。
    所以准确的说法是"**钉住了它输入里那几个正则**"，不是"守住了这一侧的词表"。
  rollback: 分支丢弃或 git revert；两条夹具与账本条目、新脚本与 CI 那一行同一次提交内整体可退（无数据迁移）。
gate: >-
  若将来训练侧 case 增长而夹具补不上（例如真实训练侧输入只有这 4 条 session、再无可脱敏的材料），
  说明训练侧的量尺确实到顶了——那时把 `--require-side training` 保留为"不许掉回零"，
  而**不要**把它扩成"每个含 case 的格子都要有夹具"：后者凭空造不出来，做成硬门就是假硬化。
  （这一条已落进代码：侧层是 `--check`，格层是单独开关 `--check-cells`、默认不开。
  第一版把两层压在一个 `--check` 里，被独立预核实测出"文档描述的门与实际跑的门不是同一个"，
  已拆开——见下一条 decision。）
  **另一件不要做的事**：别把 `--nature-evidence` 直接做成门。它现在是读数不是判据——
  全库 16/26 条夹具靠语义兜底，硬门会要求把那 16 条先改造掉，而它们本来就不靠字面量判别
  （`docs/guide/eval.md` 已实测过这个天花板：提高行内 token 上限四组变体 recall@5 全不变）。
