    ②不建 skill 的依据成立：无 G3 证据支持 skill 有收益，且成本差仅 200–400 tok/次；
    ③实现后 verify_references.py 的 skill 侧绑定校验覆盖新触发点、trace_metrics.py 的
    KNOWN_PURPOSES 含 procedure；
    ④不把结论外推为「流程无价值」——G3 存在构造偏差（场景数据已把判据摆好），列为遗留命题
  rollback: 分支合入前可整体丢弃；合入后 git revert（原则七）
