# ============================================================
# Idea 卡：流程性先验知识的载体与加载方式——实验判定「保留 reference + 结构触发 + 必须加载全文」
# 两轮盲测（21 次，proposals/experiments/flow-form/，本地留存）：
#   第一轮（12 次）：形态（flow[] YAML vs 散文 skill）不影响执行保真度（R = S = 100%）；
#                    现状缺口在**加载**（精度/性能会话 0 次加载），不在载体形态。
#   第二轮（9 次，原始态场景）：**加载深度是决定性的**——不给全文 0/4 对、只给摘要行 0/2 对、
#                    给全文 2/2 对（P3）；P4 上无资料臂漏掉「小包→带宽瓶颈」判据。
# 本卡记录判定与证据；实现动作待用户批准后执行（本卡不含 git 待办态）。
# ============================================================

