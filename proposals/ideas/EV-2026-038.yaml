      保留（案例归纳但**形态是判据驱动**，未达"案例索引"标准）：`ascend-determinism-triage`、
      `ascend-garbled-output-triage`、`msllm-startup-version-env-triage`、`glm-quantized-startup-triage`、
      `ascend-moe-comm-triage`——其中前两条被 8 条 case 的 `ref_knowledge` 引用。
      结果：methodologies 17 → 14。
