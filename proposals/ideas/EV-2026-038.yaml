hypothesis: >-
  流程性先验知识的失效原因是**加载深度与触发时机**，不是载体形态：把 methodology 的 flow 保留在
  reference（可 CI 校验、带来源与版本 pin），在 diagnose 的数据/方法缺口处补结构化「执行触发点」
  （category + 数据状态 → flow 词条 id），并且**必须加载 content.flow[] 全文**——
  摘要行（现状 2.5 层形态）会截掉决定性判据，实测与不加载等效；拆成新 skill 在同一目标上
  没有额外收益（形态不构成障碍），反而丢掉 schema/来源/verification 与 CI 绑定校验
predicted_effect:
  metric: 精度/性能会话中 methodology 的加载次数与加载深度 + 结论正确性
  from: "precision/performance 会话加载 0 次；summary 层摘要行与不加载等效（P3 0/2 vs 0/2）"
  to: "结构触发下按 category 命中即加载全文（P3 2/2 正确）；trace 可记 purpose: procedure；结果 schema 可记 flow_refs_loaded / steps_executed / branch_taken"
