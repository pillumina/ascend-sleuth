    conclusion: >-
      **加载机制判定不变**（全文 + 结构触发 + 索引选择器，三条均获验证）；
      **新增内容标准（本卡的关键修正）**：`case-derived` 的 methodology 不得是"案例指纹 + fix PR"清单——
      它只是第二份 case 索引，加载它对新变体无益且可能误导；必须是**可对新变体执行的判据**
      （阈值/分支/可测指标）。配套两条：
      ①**留出检验作为机械门**：`scripts/flow_pool.py --flow-coverage` 按 `sources[].cases` 判定样本是
      "收录（污染）"还是"未收录（泛化）"；一条流程若**无未收录样本的通过记录**，其"方法"地位未验证
      → 不进 procedure 闸门（当前 `ascend-vllm-spec-decode-mtp-triage` 3 条未收录样本 0/3 通过）。
      ②**分支必须由数据决定**：流程给出分支时，须用可测判据（如 rope_dim 是否 2 的幂）判定，
      不得凭配置指纹"结构性排除"后高置信套用（009/010 的错误正是这么产生的）。
      未测项：official-doc 来源流程（真方法）在未收录样本上的泛化——池内暂无对口样本（13973 的根因是
      代码级 buffer 分配，非阈值型方法可解），需按方法形态补样本。
  - who: agent（内容治理轮，用户指示"先降级为普通 case，reference 里不要有案例索引型的"）
