      从 origin/kb/token-measure 移植 --tools 到当前 main（保留 session.v4.jsonl.zstd 通配与
      --decompress）；eval_arena.py --gate 加三个成本参数并在账本记 cost 段；
      docs/guide/metrics.md 补 --tools 用法与两种量法不混的说明。
  - who: agent
    when: '2026-11-02'
    type: eval
    conclusion: >-
      measure 命令 exit 0 且输出含「工具流量」；--self-test 全部断言通过；带成本参数跑一次 --gate，
      账本写入 cost 段且 verdict 与不带成本时相同。
  - who: agent
    when: '2026-11-02'
    type: decision
    conclusion: >-
      采纳（validated）：两件都只读、可回滚；工具流量表直接回答花费落在哪个工具与哪些重复访问上。
      成本轴只记录，合并判断仍由人按质量与花费两轴读。
