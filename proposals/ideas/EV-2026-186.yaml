      main 上仍空白的是工具流量表与 arena 成本轴，收窄为这两件重开。
  - who: agent
    when: '2026-11-02'
    type: decision
    conclusion: >-
      旧卡号在 main 上已被另一张卡占用，因此本卡不写 supersedes 链，只在新卡号下重开；
      不移植 --steps，不加固定面基线比对，不动质量判词。
  - who: agent
    when: '2026-11-02'
