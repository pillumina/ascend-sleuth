# ============================================================
# EV-2026-094 —— 先验键触发的「版本组合」路径补文件名提示
# 来源：诊断 vllm-ascend#12430（多节点 MC2 507014）时，把现场 driver+CANN 版本组合
#       当成了待验证假设而非检索键，跳过本库 compat-matrices 转向外网查证
