id: EV-2026-138
layer: L2
status: validated
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: '2026-09-21'
risk: low
actual_cost:
  tokens: 0
  source: estimate
  note: 同一批 5 张卡的编辑合并在一轮会话内完成，未单独计量；按既有卡口径以 0 计（真值由 tokenMeter 读数回写）
title: 类别冲突不要求用户二选一：按症状定类别、自动单选，日志线作备选并标覆盖点
target_component: skills/diagnose/SKILL.md
source_signals:
- signal: process_friction
  evidence: 「类别冲突不得二选一」现在只写了「不得二选一、各自走各自的消费点」，执行形态落成了两条线都走或 agent 自己挑一条——用户被要求回答「你觉得这是哪类问题」，而那正是他答不了的判断。
  trajectory:
  - skills/diagnose/SKILL.md（始终要避的坑：类别冲突不得二选一）
  - skills/diagnose/references/diagnosis-procedure.md（步骤 2 路由规则）
hypothesis: 把冲突处理写成「按症状自动单选 + 标明另一条线 + 给覆盖点」，既不替用户决定根因，也不把分类判断推给用户。
predicted_effect:
  metric: 冲突处理在避坑清单里的形态（行为规则，判别力不可机械度量）
  from: 写「不得二选一」，未写自动单选与覆盖点
  to: 写明按症状性质定 category、自动单选、日志线写清作为备选（换向需要什么）、并给一句覆盖点让工程师可改向
  measure:
    command: grep -q '症状的性质定' skills/diagnose/SKILL.md && grep -q '若你更关心' skills/diagnose/SKILL.md && grep -q '候选加载后' skills/diagnose/references/collect-gates.yaml
    expect_exit: 0
validation:
  method: scan_review
  baseline: 改前：只写不得二选一，单选规则与覆盖点缺位
  success_criteria: '① 与既有一致：category 由症状性质定、不由日志签名定，这条不弱化；

    ② 单选后两条线的信息需求各写一句（改向时不必重新问一轮）；

    ③ 覆盖点是推进式的（默认按 A 线走，你改向我就切），不是「要不要继续」的确认题；

    ④ 步骤 2 路由规则处同步一句，避免两处口径漂移'
  rollback: 恢复避坑清单该条原文、删除步骤 2 那句即回到改前
gate:
  condition: 冲突处理在真实 session 里落成两条线都走或替用户选，属可验证的流程摩擦
principle_refs:
- 5
- 10
decisions:
- who: agent
  when: '2026-09-21'
  type: proposal
  conclusion: 产卡：类别冲突改为自动单选 + 覆盖点
- who: agent
  when: '2026-10-05'
  type: eval
  conclusion: 'measure 实跑 PASS（在 origin/main 97cefa2 上逐项命中：`症状的性质定` 1 处、`若你更关心` 1 处，均在 skills/diagnose/SKILL.md；`候选加载后` 4 处，在 skills/diagnose/references/collect-gates.yaml；命令见本卡 predicted_effect.measure）。这条判的是措辞在册，按本卡 metric（行为规则，判别力不可机械度量）它不证明类别冲突落成单选——真实落点要看诊断 trace 的 triage 事件里 category 与备选分支的写法。'
- who: agent
  when: '2026-10-05'
  type: decision
  conclusion: '采纳并标 validated。此轮边界：①落地早于收尾——改动随 PR #276（2026-09-21，提交 f4787e7）进入 main，产卡时只写了产卡记录、没有给判断，挂满 14 天触发僵尸卡判据；本轮补的是账本状态与措辞核对，不是新的行为验证；②本卡 success_criteria 写的「category 由症状性质定、不由日志签名定，这条不弱化」只对字面量存活成立：现行 skills/diagnose/SKILL.md:113 写的是「按症状的性质定 category——症状是工程师手上那个现象，日志签名只是线索」，「不由日志签名定」这句禁止语在 skills/ 里已不存在（`git grep -c 不由日志签名定 -- skills/` 无输出、退出码 1），本卡交付的是自动单选与覆盖点，不是把该约束原样留下；③本卡第三条 measure 与 EV-2026-136 第一条 measure 共用 skills/diagnose/references/collect-gates.yaml 的「候选加载后」同一字面量，本卡的绿不独立于 136 的提交；④影响面是交互指引面，不改变候选选择与路由，按 docs/guide/eval.md 门禁分级不跑检索 golden。'
