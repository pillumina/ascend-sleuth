    ④ 不回填历史 trace（无信息可转录，回填即编数据）——历史缺口由读数如实承担；
    ⑤ skill 外部锚卫生绿（无日期 / ADR 号 / 卡号）。
  rollback: 两处文档改动可整体 revert，无代码与数据副作用（原则七）
