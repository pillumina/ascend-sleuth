source_signals:
  - signal: measurement
    evidence: "本机 14 条历史 session 里 **3 条（21%）的 `triage` 事件没有任何字段**（`load_index` 也是空的，无处可转录）。两个消费者因此读不到路由决策：① 路由准确率（`trace_metrics.py` 比 `triage.routed` / `triage_semantic.namespace` 与命中 case 的实际 namespace）→ 该单既不算对也不算错，不进分母；② E2 的错例池就从 `routed` 里取「路由错了」的单 → 该单永远进不了池。于是仓库里「当前路由错例 = 0」的读数，是在『有的单压根没记』的前提下数出来的。"
    trajectory:
      - "traces/2026-08-31-msllm-1801-cann-ops-transformer.yaml#triage（空事件）"
      - "scripts/trace_metrics.py#triage_miss_classes.routed_unrecorded（读数 3）"
      - "docs/metrics.md#路由准确率口径"
  - signal: design_gap
    evidence: "`skills/diagnose/references/diagnosis-trace.md` 定义了 action 词表与 `reference_lookup` / `procedure_follow` / `sediment_candidates` 的字段契约，**唯独没写 `triage` 事件必须带什么**；SKILL 正文只有一句『triage 决策记 trace』。即：指标在消费一个 schema 从未规定的字段——契约缺口，不是执行者疏忽。"
    trajectory:
      - "skills/diagnose/references/diagnosis-trace.md#KNOWN_ACTIONS 之后（改前无 triage 段）"
hypothesis: "把 `triage` 事件的字段契约写进 trace schema（命中分支必须带 `routed`；未命中写 `routed: []` 而不是省略字段；走语义兜底另记 `triage_semantic` 带 `namespace`）后，路由决策在每一单上都可见——「没记」不再与「没错」同形，E2 的错例池不再按记录缺口漏单。"
predicted_effect:
  metric: triage 路由决策的可归因率（每单是否留下路由落点）
  from: "本机 14 单里 3 单无任何路由落点（21%）；`trace_metrics.py` 记为 routed_unrecorded"
  to: "新单的 `triage` 事件一律带 `routed`（未命中写 `routed: []`）；`routed_unrecorded` 只反映契约生效前的历史单"
  measure:
    command: null
    reason: "被测对象是**未来诊断**写 trace 的行为，本仓没有可机械复现的判据（历史单不可回填：那 3 条事件为空、回填只能靠猜）。可核的是观察窗——下一批真实 trace 里 `trace_metrics.py` 的 `triage_miss_classes.routed_unrecorded` 不再增长，且未命中单出现在 lexical_gap / semantic_path 两类里（说明写的是 `routed: []` 而非省略字段）。"
validation:
  method: scan_review
