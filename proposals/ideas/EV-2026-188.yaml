id: EV-2026-188
layer: L2
target_component: references/tools/hccn-tool-network-diagnosis.yaml
title: 链路诊断词条补一条反向互链——指回队列流控面词条
status: validated
authorization: dual
dimension: evolvability
supersedes: []
superseded_by: null
created_at: 2026-11-11
source_signals:
  - signal: linkage_gap
    evidence: 新增的队列流控词条在 related_references 里指向链路诊断词条，反向那一侧没有指回来，检索时只见其一
    trajectory:
      - references/tools/hccn-tool-qos-pfc-tc-dscp.yaml
hypothesis: >-
  两条词条同属网口诊断，一条讲链路、地址、连通性与 TLS，一条讲 PFC / TC / DSCP 的配置与统计；
  单向链接时从链路词条出发看不到流控面，遇到丢包类问题要多一次无关检索。
  在链路词条的 related_references 里补一行即可，不改正文与判据。
predicted_effect:
  metric: 链路诊断词条指向队列流控面词条的引用数
  from: "0（反向缺链）"
  to: "1（related_references 含 hccn-tool-qos-pfc-tc-dscp，verify_references 的悬挂检查通过）"
  measure:
    command: "python -c \"import pathlib,sys; t=pathlib.Path('references/tools/hccn-tool-network-diagnosis.yaml').read_text(encoding='utf-8'); n=t.count('hccn-tool-qos-pfc-tc-dscp'); print(n); sys.exit(0 if n==1 else 1)\""
    expect_exit: 0
    expect_stdout: "1"
validation:
  method: metrics_compare
  baseline: 改动前该词条 related_references 不含队列流控面词条
  success_criteria: measure 输出 1、退出码 0，且 verify_references.py --check 通过
  rollback: 删掉那一行引用即可；不涉及词条正文，回滚无内容损失
gate:
  condition: 从链路诊断词条出发，需要跳到 PFC / TC 配置与统计面时
risk: low
principle_refs: [2, 8]
actual_cost:
  tokens: 400
  source: estimate
decisions:
  - who: agent
    when: "2026-11-11"
    type: proposal
    conclusion: >-
      只补反向互链，不动词条正文：修订已合入的 active 词条按知识修改规则走 kb/high-risk，
      这处改动只增加一条 related_references，风险集中在「链接是否悬挂」而非语义。
  - who: agent
    when: "2026-11-11"
    type: action
    conclusion: >-
      在 references/tools/hccn-tool-network-diagnosis.yaml 的 related_references 尾部新增
      hccn-tool-qos-pfc-tc-dscp；该 id 由同一批的父分支提供，本分支基于父分支拉出。
  - who: agent
    when: "2026-11-11"
    type: eval
    conclusion: >-
      measure 命令实测输出 1、退出码 0；verify_references.py --check 通过（268 条、id 唯一，
      related_references 无悬挂）；rebuild_generated.py --check 全绿。
  - who: agent
    when: "2026-11-11"
    type: decision
    conclusion: >-
      采纳（validated）：改动是一行链接，效果靠检索可见性体现，进观察窗；
      合入仍需 kb/high-risk 双签，签名不在本卡里完成。
