id: EV-2026-065
layer: L2
title: 源码缓存按版本平铺 + 版本不符不再假装成功：缓存锚到主检出，退出码说真话
status: validated
authorization: review
dimension: architecture
supersedes: []
superseded_by: null
created_at: 2026-09-14
source_signals:
  - signal: process_friction
    evidence: >-
      用户观察：新 issue 是 0.26.0，本地 src-code 只有此前定位留下的 0.23.0，**agent 没找到该版本就转去
      web 搜索**。读码定位到这不是"目录结构不好用"这么轻：`src_fetch.py` 的复用分支在版本不符时
      **无条件** `print("复用 <路径>")` + `return 0`——fetch/checkout 失败也走这条，于是脚本对外说
      "取得源码成功"、给出的却是**另一个版本**的树。skill 的契约恰恰是"非零退出 = 未取得源码"
      （SKILL.md 源码分析节），所以 agent 拿到 exit 0 + 一个路径，grep 不到预期符号 → 判定"本地没有
      这个版本" → 转 web 搜索。**同样的失败在任何目录布局下都会复发**（布局只让"有没有这个版本"可
      判定，不会让"版本不符"变成失败），故两者同批修。加剧因素二：`--ref 0.26.0` 与真实 tag
      `v0.26.0` 只差一个前缀，脚本既不解析也不提示可用 tag，静默判不匹配。加剧因素三：缓存根是
      `Path(__file__).parent.parent`（执行脚本的那个检出），而 `src-code/` 在 .gitignore 里——
      新 worktree 天然没有它、`git worktree remove` 会连它一起删（仓库现状实测：`src-code/vllm-project/`
      是空壳，四个检出里没有任何 clone），于是"平铺给多 agent 协作"在共享面根本不成立。
    trajectory:
      - "scripts/src_fetch.py（复用分支：if 分支不成立也 print + return 0；缓存根 = __file__ 上两级）"
      - "skills/diagnose/SKILL.md（源码分析节 步骤 2 的契约：非零退出 = 未取得源码）"
      - "CLAUDE.md（source_ref 段：原约定 src-code/<org>/<repo>/ 单目录 + 换版本用 checkout）"
      - "scripts/exec_log_path.py（同一克隆共享的既有范式：main_checkout + WHERE_LABEL + --local）"
      - "仓库现状实测：src-code/vllm-project/ 为空壳目录，主检出与 3 个 worktree 均无 clone"
      - "scripts/rehearse_evolve_loop.py（E9 段：临时 git 仓库 + 两个真 worktree 的演练范式）"
hypothesis: >-
  把三件事一起改——①缓存按版本平铺为 `src-code/<org>/<repo>/<解析后的 ref>/`，每个版本目录自包含、
  互不干扰；②缓存根解析到**主检出**（同一克隆的所有 worktree 共读共写，复用 exec_log_path 的既有
  范式）；③`src_fetch.py` 的退出码只说真话（0 仅当该 ref 的树**已在本地产出并校验通过**，版本不符/
  拉取失败/ref 解析不了一层一个非零码 + 各自的可执行下一步，并列出可用 tag）——则"本地有没有这个
  版本"变成一次可判定的检查（进而 agent 的动作从"转 web 搜索"回到"拉取"），并发诊断不再互相污染
  版本，且版本共存/退出码真相/跨 worktree 共享三条不变量都有离线断言兜住。
predicted_effect:
  metric: 源码缓存三条不变量的离线断言数（版本共存不互相污染 / 退出码与真实产出一致 / 跨 worktree 共享）
  from: "0 条：三条不变量此前无任何断言（演练断言总数 141，无一条触及 src_fetch）"
  to: "18 条全绿（演练断言总数 141 → 159）"
  measure:
    command: "python3 scripts/rehearse_evolve_loop.py"
    expect_exit: 0
    expect_stdout: "[E15]"
validation:
  method: metrics_compare
  baseline: >-
    ① 演练基线（本分支，未改动的 main）：`python3 scripts/rehearse_evolve_loop.py` → 断言 141/141 通过，
    其中没有一条覆盖源码缓存（演练脚本里 src_fetch 出现 0 次）。
    ② **行为基线用本地假上游复现了用户报的那条链**（不起网络，可重复）：上游有两个 tag
    v0.1.0/v0.2.0，旧 `src_fetch.py` 先拉 v0.1.0，再用 `--ref 0.2.0`（真实 tag 是 v0.2.0，只差 v 前缀）
    请求 → 输出 `fetch --depth 1 origin 0.2.0` → `fatal: couldn't find remote ref`、`checkout 0.2.0`
    → `error: pathspec ... did not match`，**两条都失败**，但脚本仍打印
    `复用 <路径>（当前检出 v0.1.0）` 并 **exit 0**；核对目录内容 = v0.1.0。这正是"agent 拿到 exit 0 +
    一个路径、grep 不到 v0.2.0 的符号 → 判本地没有 → 转 web 搜索"的入口，且**与目录布局无关**。
    ③ 同日同场景新实现：解析到真实 tag v0.2.0、产出 v0.2.0 目录（内容 = v0.2.0），v0.1.0 目录仍在原位
    且内容未变；`--ref` 给不存在的 tag → exit 3 且 stdout 无任何路径、附可用 tag；目录被外部 checkout
    过 → exit 5（不再静默复用）。
  success_criteria: >-
    ① measure 命令 exit 0 且新增 [E15] 段断言全绿（18 条）；②三条不变量各有正例与负例：两个版本先后
    拉取后**前者仍在原位且内容未变**；请求不存在的 ref → **非零退出（3）且 stdout 不出现任何缓存路径**，
    并列出可用 tag；`--ref 0.1.0`（真实 tag `v0.1.0`）容错命中且**标注了是容错匹配**；目录被外部
    checkout 过 → 非零（5），`--force` 后内容回到该版本；③跨 worktree：从 linked worktree 拉取，缓存
    落在主检出、worktree 内不产生 src-code；④并发同版本：两个进程都 exit 0、只产出一个版本目录、
    无残留 `.tmp-*`、内容是请求的版本；⑤`--list-versions` 报出本地已有版本，旧布局单检出被如实报告
    （不假装是版本目录、也不被静默删除）；⑥`kb-checks` 八条 + `verify_proposals --check` 仍绿；
    ⑦skill/文档中不再有单目录约定残留（`src-code/<org>/<repo>/` 直用 checkout 的旧表述为 0 处）。
  rollback: >-
    单个提交内可 revert：scripts/src_fetch.py（布局与退出码）、scripts/exec_log_path.py（新增
    src-code 的共享路径解析）、scripts/rehearse_evolve_loop.py（新增 E10 段）、skill 与文档措辞。
    无数据迁移——src-code/ 是 .gitignore 的本地缓存，旧布局残留（空壳目录、手工 clone 的单检出）
    既不影响新版本目录、也不需要转换；必要时 --force 重拉或手工删除。
gate: "出现『本地无该版本』而转 web 搜索、或 source_ref 指向的版本与本地实际树不符时，重跑 measure"
risk: low
principle_refs: [2, 7, 8, 10]
actual_cost:
  tokens: 0
  source: estimate
  note: >-
    本轮无独立读数（本会话未接 tokenMeter 取数）。按仓库口径"无法单独量化时写 0 并说明口径"——
