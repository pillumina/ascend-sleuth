decisions:
  - who: agent
    when: '2026-09-14'
    type: proposal
    conclusion: >-
      识别：用户报的现象（"本地没有这个版本就去 web 搜索"）在代码层的直接成因是**闸门说了假话**——
      src_fetch.py 的复用分支无论版本是否相符都 exit 0，而 skill 的契约把 exit 0 当作"已取得对应版本
      源码"。这与本仓库此前的同类病灶一致（断言钉住已废弃的载体形态、能力只在单一平台成立却写成通用
      承诺）：**量具坏了，而不是被测对象坏**。故按"先修闸门、再改结构"的顺序做：退出码真相是止血
      （独立成立），版本平铺 + 缓存锚到主检出是让"多 agent 协作"在共享面真正成立。
  - who: agent
    when: '2026-09-14'
    type: action
    conclusion: >-
      执行（本分支 kb/src-code-version-layout，独立 worktree）：①`scripts/src_fetch.py` 重写为
      "版本平铺 + 退出码只说真话"——版本目录 `src-code/<org>/<repo>/<解析后的 ref>/`（commit 用
      `sha-<12>`），目录内 `.git/src-fetch-meta.json` 记实际 HEAD 供**离线**核对；缓存根改走
      `exec_log_path.resolve_src_code`（同一克隆共享，`--local` 可退回检出内）；ref 解析带 v 前缀容错，
      解析不到时列可用 tag；退出码分层 2/3/4/5，**非零时 stdout 不出现任何缓存路径**；临时目录克隆 +
      原子 rename（并发同版本时失败者复用赢家）；新增 `--list-versions`（本地有哪些版本一眼可判定）
      与 `--prune`（手工删，无自动 GC）。②`scripts/exec_log_path.py` 增 `SRC_CODE_REL` /
      `resolve_src_code` / `describe_src`，复用既有 `main_checkout`——不新抄一份路径语义。
      ③`scripts/rehearse_evolve_loop.py` 增 [E15] 段（18 条断言，本地假上游 + 真 linked worktree，全程离线）。
      ④`diagnose`/`resume-diagnosis` skill 的源码分析节改写为"按版本取 + 退出码即契约 + 别用 web 搜索
