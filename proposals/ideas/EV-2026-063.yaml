id: EV-2026-063
layer: L2
title: 度量诚实性批：修好恒为 0 的容量健康指标（假绿）、统一索引口径指令面、并给上下文成本补上确定性量具与真实账单入口
status: validated
authorization: review
dimension: process
supersedes: []
superseded_by: null
