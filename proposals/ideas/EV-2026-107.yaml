dimension: observability
supersedes: []
superseded_by: null
created_at: 2026-09-17
source_signals:
  - signal: design_gap
    evidence: "回放结果目前只写在 fixture 头注的散文里（22/24 条，形如「本条回放结果：candidates=Y rank=2 path=primary」）——无日期、无结构化字段、无聚合、无人校验；完整报告落 gitignore 的 eval-reports/。后果有二：①仓库里不存在「当前命中构成」这个数；②夹具改动后没重跑，在数据上不可检出。实测 5 条夹具记为 miss，其 assertion 均为 `top-3-or-miss-documented`（允许记录在案的 miss），套件本身自洽；但 VLLM-ASC-12685 在封存对照集里的封存理由写的是「高频命中路径」，与它自己头注记的 miss 对不上——这类散文与记录的错位在账本化之前无法一眼看出（而该条属封存面，误读它等于误读量尺）。"
    trajectory:
      - "eval/golden/VLLM-ASC-12685.fixture.yaml#头注"
      - "eval/holdout.yaml#VLLM-ASC-12685 的 why 字段"
      - "docs/eval.md#怎么跑（v1 手动）"
      - ".gitignore（eval-reports/ 与 .s2-replay/ 均为运行时件）"
hypothesis: 把回放观测从 fixture 头注散文搬进结构化账本、并按「夹具内容哈希 + 目标 case 内容哈希」双判新鲜度后，"这条夹具上次记录的是第几名、那次记录之后夹具与目标 case 有没有变过"变成可查的事实；"改了夹具不重跑"由静默变为 CI 报红，"改了 case 没重跑"进待复核清单，聚合命中构成也不再依赖读 24 个文件的散文。
predicted_effect:
  metric: 回放观测的可校验性（账本覆盖 + 双哈希新鲜度检出 + 聚合可读）
  from: "0 条结构化记录、0 个卡口、聚合数不存在（只在散文里）"
  to: "24 条 fixture 全部有账本条目（未回放者如实记 not_recorded）；夹具变动即红、case 变动进待复核清单；聚合命中构成一条命令可读"
  measure:
    command: "python3 scripts/eval_scorecard.py --check"
    expect_exit: 0
    expect_stdout: "scorecard："
validation:
  method: scan_review
  baseline: 改前：观测只写在 fixture 头注（22/24 条），无脚本、无卡口、无聚合；陈旧观测不可检出
  success_criteria: |
    ① 覆盖：eval/golden/*.fixture.yaml 每条都有账本条目，缺则红并逐条列出（新夹具至少要记 not_recorded）；
    ② 新鲜度：夹具字节哈希与账本不符 → 红（夹具即量尺，被改过就该重跑一次）；
       目标 case 的内容哈希（取自 knowledge/_index.yaml）不符 → 进「待复核」清单并计入聚合，**不判红**——
       case 的合法内容变更不该阻塞无关 PR（闸门硬度与错误代价匹配，原则六）；
    ③ 账本自身不自相矛盾：条目的 fixture 与 case 都必须存在，case_id 必须与 fixture 的 expected 一致；
    ④ 聚合数随 --check 打印（有记录 N / 命中第一 / 命中前三 / 未命中 / 未记录 / 待复核），人不必读散文；
    ⑤ CI 新增 eval-scorecard job；docs/eval.md 写明"账本记观测、卡口只判夹具新鲜度、不判准确率"——
       准确率门禁仍需 agent 跑回放，不假硬化为 CI 门（docs/eval.md 门禁分级与 CLAUDE.md 准入判据）。
  rollback: 两文件（脚本 + 账本）+ 一个 CI job 可整体 revert；账本是记录文件，删除即回到改前状态（原则七）
gate:
  condition: "不等数据触发：本卡补的是回放观测的落点（此前观测无结构化落点），属口径前置修正，随 PR 合入"
