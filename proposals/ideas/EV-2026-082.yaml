# ============================================================
# EV-2026-082 —— 重复导出要清旧树：撤掉的文件不能留在包里
# 来源：用户追问「导出是幂等的吗，已经导出了不会重复吧」——顺着这个问题做了一次重复导出的实验
# 触发：实验发现第二次导出后，上家已从源里撤掉的证据文件仍留在包内，且不在交接单清单里
# 脱敏：只含仓库内路径与合成夹具，不含客户数据
# ============================================================

id: EV-2026-082
layer: L2                          # 导出脚本（scripts/）与其自检
title: "重复导出清旧树 + 包内清单与内容的一致性自检（撤掉的文件不再随包发出去）"
status: validated
authorization: review              # 触及导出产物内容；可逆 → review 级
dimension: process                 # 导出产物的正确性：包里装的东西必须等于清单声明的东西
supersedes: []
superseded_by: null
created_at: 2026-09-15
source_signals:
  - signal: user_request
    evidence: >-
      用户问「导出是幂等的吗，已经导出了不会重复吧」。顺着核下去发现两件事：
      ① 产物路径是确定的（`<traces>/exports/<sid>/` 与两个同名文件），所以重复导出**不堆副本**，
      但两次的 `exported_at` 不同、zip 也不逐字节相同——即"不重复落文件，但不字节可复现"；
      ② 更严重的一件：上一轮的产出树**没有被清掉**，于是第二次导出会把第一次带过、而这次已从源里
      撤掉的证据文件继续打进 zip，同时交接单清单里不列它。实测（合成夹具）：撤掉 b.txt 后重导，
      树与 zip 里仍有 `evidence/S1/b.txt`，清单里没有。
      后果不止"清单对不上"——若上家撤掉某文件是因为**发现了不该发的内容**，这次导出等于把它又发了一遍。
    trajectory:
      - "scripts/export_trace.py（产出树 tree = out_dir/<sid> 的写入路径，缺清理）"
      - "scripts/check_handoff.py（往返自检，此前没有'重复导出'这一类路径）"
      - "合成夹具实验：导出 → 源里删掉一个证据文件 → 再导出 → 比对清单/树/zip"
hypothesis: >-
  导出前先清掉**认得出来的**上一次产出树（含 `<sid>.yaml` 或 `handoff/<sid>.yaml`；认不出来就拒绝，
  绝不对来路不明的目录 rmtree），并在落盘后校验"清单 == 树"之后：
  重复导出得到的是一个自洽的包，撤掉的文件不会残留，也不会再出现"包里有、清单没有"的静默状态。
predicted_effect:
  metric: 重复导出后包内内容与交接单清单是否一致、撤掉的文件是否残留
  from: "撤掉的 evidence/S1/b.txt 仍在树与 zip 里，清单里没有它（三方不一致；等于把决定不发的内容又发了一遍）"
  to: "清单 == 树 == zip 三方逐项一致；撤掉的文件不再出现；产出目录已被占用但不像上次产出时拒收且不动它"
  measure:
    command: "python3 scripts/check_handoff.py"
    expect_exit: 0
    expect_stdout: "全部通过"
validation:
  method: metrics_compare
  baseline: >-
    改动前：导出不做旧树清理；落盘后不校验"清单 vs 树"；自检里没有"重复导出"这一类路径
    （51 项断言的版本里新增了 6 项）。
  success_criteria: >-
    ① 合成夹具实测：撤掉源证据后重导，树/zip/清单三处都不再含该文件，且三方逐项一致；
    ② 产出目录已存在但不像上次产出（无 `<sid>.yaml` 也无 `handoff/<sid>.yaml`）→ 拒收 exit 3，
      且**不动**该目录（实测：里面的 keepme.txt 原样保留）；
    ③ 新增 6 项断言进自检，人为把清理逻辑去掉即红；
    ④ 仓库既有检查无回归。
  rollback: >-
    单个提交：新增一次 rmtree（带"认得出来"的前置判断）与一次一致性校验。git revert 即回原状；
    已产出的包不受影响（下次导出会重写）。
gate:
  condition: "再出现「包里装了清单没写的东西 / 该撤掉的东西还在包里」的反馈时，重跑 measure 并复查这条不变量是否被绕过"
risk: low
principle_refs: [2, 10]
actual_cost:
  tokens: 0
  source: estimate
  note: >-
    本会话未接 tokenMeter 取数，按仓库口径写 0 并说明口径：这个 0 表示"未单独量化"，
    不表示零成本（本轮含一次合成夹具实验、两处脚本改动与 6 项断言）。
decisions:
  - who: agent
    when: 2026-09-15
    type: action
    conclusion: >-
      导出前清理上一次的产出树（仅当它含 `<sid>.yaml` 或 `handoff/<sid>.yaml`，否则拒收 exit 3、不动它），
      落盘后新增"清单 == 树"的一致性校验（不一致即 exit 3，不发自相矛盾的包）。
      依据：合成夹具实测的残留现象 + "撤掉的内容不该再发出去"这条安全含义。
  - who: agent
    when: 2026-09-15
    type: decision
    conclusion: >-
      采纳并标 validated：measure（check_handoff.py，51 项）全绿，且负向对照可复现
      （去掉清理逻辑后"撤掉的文件不再出现在 zip 里"即红）。范围界定：本次只修**同一检出内的重复导出**；
      "两个不同导出的包在接收侧各占一单"是有意行为（第二份落成 `<sid>-imported-1`，
      要不要合并交人判断），不在本卡内。
  - who: agent
    when: 2026-09-17
    type: action
    conclusion: "合入指针回写：本卡（及其结论）随 PR #216 进入 main（回写由 evolve 批次收尾执行，供判据「待合入积压」读取）"
