hypothesis: 上游官方案例文档会成为常态来源（msprobe/框架仓库的 best_practices 目录持续更新）。**owner 已裁定：新增档位**——verification 按「来源形态」分而非按 issue 分（issue 只是一种外部来源，本地闭环 investigation 与上游官方案例同样各成一档）。已实施：case schema 新增 `upstream-official-doc`（skills/to-postmortem 档位表 + docs/evolution-execution 字段表 + examples/sample-case 注释 + groom 先验表 0.7/0.55/0.45）。**triage 症状补录不走本卡**——按 to-postmortem 步骤 3.5，路由建议随 case PR 一并提交（已在本轮同 PR 完成：training_precision 补重复训练/确定性/训推一致类，inference_precision 补花图/评分低/回复不终止类）。
