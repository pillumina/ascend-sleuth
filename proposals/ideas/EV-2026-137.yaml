actual_cost:
  tokens: 0
  source: estimate
  note: 同一批 5 张卡的编辑合并在一轮会话内完成，未单独计量；按既有卡口径以 0 计（真值由 tokenMeter 读数回写）
title: 反馈闭环从「当场追问」改成「挂账 + 一句回报指令」
target_component: skills/diagnose/references/diagnosis-procedure.md
source_signals:
- signal: process_friction
  evidence: 步骤 6 现在写「给完 fix 后等工程师应用并回来报告结果——问『应用后解决了吗？』」，但 fix 刚给出去、工程师还没应用，这一问注定得到空答案；而模板里的 feedback_pending_since 在既有 trace 里几乎不写，债没有账龄、没有归还路径。
  trajectory:
  - skills/diagnose/references/diagnosis-procedure.md（步骤 6 结果反馈闭环段）
  - skills/resume-diagnosis/SKILL.md（流程：先清反馈债）
  - diagnosis_state.yaml.example（feedback_pending_since 字段）
hypothesis: 把「问一句」换成「挂一笔债 + 给一条可复制的回报指令」，债由续接与面板追，反馈捕获的吞吐不再依赖工程师记住回来。
predicted_effect:
  metric: 执行路径是否禁止当场追问结果、要求挂账并给回报指令（行为规则，判别力不可机械度量）
  from: 给完 fix 后当场追问结果；pending 与账龄字段可写可不写
  to: 给完 fix 即写 feedback（含 pending-investigation 或真实 case id + 账龄），对话里给一条可复制的三选一回报指令，不在当场追问
  measure:
    command: grep -q '不在这里当场追问' skills/diagnose/references/diagnosis-procedure.md && grep -q '回报指令' skills/diagnose/references/diagnosis-procedure.md && grep -q '不在新诊断的开屏逐单念' skills/resume-diagnosis/SKILL.md
    expect_exit: 0
validation:
  method: scan_review
  baseline: 改前：当场追问 fix 结果；无回报指令；续接只处理被续那一单
  success_criteria: '① 写 pending 的时机改到给出结论之后立即写，并写 feedback_pending_since；

    ② 对话里给可复制回报指令（解决 / 没解决 / 部分解决），文案不含内部词表；

    ③ 续接清债的分工不变，且不扩到「所有历史 pending」——否则新诊断开屏变审讯；

    ④ 不新增 trace 词表取值（仍用 feedback 事件与 confirmation 字段）'
  rollback: 恢复步骤 6 反馈段原文、删除续接对账句即回到改前
gate:
  condition: 当场追问在时序上不可能得到答案（fix 尚未应用），且债无归还路径，属复发型流程摩擦
principle_refs:
- 5
- 8
decisions:
- who: agent
  when: '2026-09-21'
  type: proposal
  conclusion: 产卡：反馈闭环改成挂账 + 回报指令
- who: agent
  when: '2026-10-05'
  type: eval
  conclusion: 'measure 实跑 PASS（在 origin/main 97cefa2 上逐项命中：`不在这里当场追问` 1 处、`回报指令` 2 处，均在 skills/diagnose/references/diagnosis-procedure.md；`不在新诊断的开屏逐单念` 1 处，在 skills/resume-diagnosis/SKILL.md；命令见本卡 predicted_effect.measure）。这条判的是措辞在册，按本卡 metric（行为规则，判别力不可机械度量）它不证明反馈债被挂账归还——真实落点要看诊断 trace 的 feedback 事件与 feedback_pending_since。'
- who: agent
  when: '2026-10-05'
  type: decision
  conclusion: '采纳并标 validated。此轮边界：①落地早于收尾——改动随 PR #276（2026-09-21，提交 f4787e7）进入 main，产卡时只写了产卡记录、没有给判断，挂满 14 天触发僵尸卡判据；本轮补的是账本状态与措辞核对，不是新的行为验证；②不新增 trace 词表取值这一条未变，仍用 feedback 事件与 confirmation 字段；③影响面是交互指引面，不改变候选选择与路由，按 docs/guide/eval.md 门禁分级不跑检索 golden。'
