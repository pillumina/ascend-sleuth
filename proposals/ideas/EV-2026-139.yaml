id: EV-2026-139
layer: L2
target_component: skills/diagnose/references/diagnosis-procedure.md
title: 步骤 1 改「信息覆盖表」：行固定、值按提取填，缺项即问句；并补快路 trace 的 report 口径
status: in_experiment
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: '2026-09-21'
risk: low
source_signals:
- signal: process_friction
  evidence: 必收项是一份变长清单，缺哪一项靠 agent 当场自评——三处固定缺口由此产生：①平台（步骤 1 只写确认框架，platform-dispatch 的平台分支在平台缺失时被静默跳过）；②场景词（触发位置 / 必现偶发 / 单机多机不在必收项里，却是 triage-tree 换分支的判据）；③已试过什么（全库无一处收集，唯一的试过命中在 evolve-check，讲的是改系统别重复方案）。同行评审还发现上一轮把快路改成不产报告后，diagnosis-trace 仍写 report 事件必写一条——写侧改了读侧没改。
  trajectory:
  - skills/diagnose/references/diagnosis-procedure.md（步骤 1 必收块）
  - skills/diagnose/SKILL.md（步骤 1 摘要 / 两种缺信息两个时机一处）
  - skills/diagnose/references/diagnosis-trace.md（report 事件必写一条）
  - skills/diagnose/references/platform-dispatch.md（平台缺失时回退跨平台）
hypothesis: 把必收项从变长清单改成固定行，缺项由空白行必然暴露、直接组成问句，「没想到要问平台」这类结构性漏项不再依赖 agent 自评。
predicted_effect:
  metric: 步骤 1 的覆盖表与快路 report 口径是否进入执行路径（行为规则，判别力不可机械度量）
  from: 必收项为变长清单；缺项漏项靠自评；快路 trace 仍被要求写 report 事件
  to: 固定行覆盖表（提取填值、缺项标待补即问句）；输出只报确认行与待补项；快路不写 report 事件与顶层 report_file，证据落盘与 reason 照旧必写
  measure:
    command: grep -q '覆盖表' skills/diagnose/references/diagnosis-procedure.md && grep -q '只报确认行与待补项' skills/diagnose/references/diagnosis-procedure.md && grep -q '快路不写' skills/diagnose/references/diagnosis-trace.md
    expect_exit: 0
validation:
  method: scan_review
  baseline: 改前：变长必收清单 + 自评缺项；快路 report 事件口径缺失
  success_criteria: '① 覆盖表的行固定（错误原文 / 触发位置 / 引擎 / CANN / HDK / 平台 / 必现偶发 / 单机多机 / 试过什么），值按提交材料填；

    ② 输出契约：已提取的不报全文（要他重看自己的日志等于没提），只报确认行与待补项，待补项即问句；

    ③ 保留先提取后提问三句（提取不到只问缺口 / 一次问全 / 提出来让他核对）；

    ④ 三处固定缺口（平台、场景词、试过什么）由行覆盖，不新增自评判据；

    ⑤ 快路 trace 口径与上一轮的快路产出改动一致，不留写侧改读侧未改的假缺口'
  rollback: 恢复必收块原文、删除覆盖表输出契约句与 trace 那句即回到改前
gate:
  condition: 三处缺口可用全库 grep 复现（平台 / 场景词 / 试过什么均无收集点），改动可逆、成本为四处措辞
principle_refs:
- 5
- 8
- 9
actual_cost:
  tokens: 0
  source: estimate
  note: 与本批其余卡在同一轮会话内完成，未单独计量；按既有卡口径以 0 计
decisions:
- who: agent
  when: '2026-09-21'
  type: proposal
  conclusion: 产卡：步骤 1 改信息覆盖表，并补快路 trace 的 report 口径
