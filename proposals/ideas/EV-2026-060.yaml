  - who: agent
    when: 2026-09-13
    type: action
    conclusion: >-
      落地：新增 `docs/writing-norms.md`（共用条目十五条 + 必须保留的四类原值 + 十个面的共用/定制表 +
      新面接入三问 + 可硬化性判断），登记进 `docs/_manifest.yaml` 并重跑 `build_docs_index.py`
