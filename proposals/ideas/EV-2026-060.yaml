      有意保留一处重复：进 agent 上下文的面留最小内联集，并声明"两处不一致时以 `docs/writing-norms.md` 为准"——
      理由与边界写在权威文档 §6（skill 必须自包含，只给指路会让规范在执行时读不到）。
      核验命令：`verify_proposals.py --check`、`build_docs_index.py --check`、`report_lint.py`、
      skills 锚点卫生（ADR 号/日期/卡号）。
  - who: agent
    when: 2026-09-13
    type: eval
    conclusion: >-
      PR 评审提问触发复核（用户逐条问"旧报告模板的行文规范是否都在新权威里"）：**合并三份拷贝时漏了 6 条**——
      AI 词汇堆砌（此外/赋能/格局…）、系动词回避（"作为/代表着/充当一个"→直接说"是"）、破折号滥用、
      虚假范围（"从 X 到 Y" 同尺度）、内联标题垂直列表（连续多段"小标题：正文"）、节奏有变化（句长与段落收尾换着来）；
      另有一条（否定式排比的例外"根因在 B，不在 A"）只留在 skill 里、权威文档没写。
      根因：合并时按印象归纳三份拷贝，没有做**逐条对账**。
      修法：①权威文档 §1 补 6 条（数字 17–22）并把否定式排比与其例外写进第 5 条；②skill 内联列表改为与权威同条目同编号
      （22 条），避免两处对不上；③补上可复核手段——对旧模板 §4 的 16 个条目标题逐个 grep 权威文档，全部命中才算覆盖。
      教训记在卡里：这类"把散落的规范合并成一份"的动作，验收条件必须是"旧清单逐条命中"，而不是"看起来齐了"。
  - who: agent
    when: 2026-09-13
    type: eval
    conclusion: >-
      自我修正：上一轮我提"要不要加一个跨面同步的检查脚本"，并称它"按准入三条站得住"——这句是错的。
      逐条过：①机械可查要先把二十二条做成数据（新增文件与名字）才有意义；②后果不确定——漂移导致的是文字质量
      退化，不是确定性故障，与唯一进 CI 的"Markdown 星号"不是一类；③只复发过一次，而且发生在一次性的合并动作里。
      改法：不做脚本，把"怎么核对"写成一条可照抄的 grep 配方放进规范文档 §6（零新增文件、零新增名字），
      并在同处写明为什么不做成脚本。
      教训：提检查动作之前先跑一遍准入三条，别让"能查"冒充"值得查"。
      另记一处本人口径错误：我在对话里说过"这条已经写进卡里了"，当时卡里只写了"合并动作的验收条件是旧清单
      逐条命中"，并没有这一条。现在补上，并保留这句差异说明——不悄悄补齐当作没发生。
  - who: agent
    when: 2026-09-13
    type: action
    conclusion: >-
      用户追问"写在 CLAUDE.md 是不是每个 agent 都能遵循"后查证：**不是**。CLAUDE.md 只被 DSH（本会话实测）
      与 Claude Code 读；Codex 读 `AGENTS.md`；WorkBuddy / CodeBuddy 读 `.codebuddy/CODEBUDDY.md` 且官方声明
      兼容 `AGENTS.md`；Trae 默认读 `.trae/rules/*.md`，`AGENTS.md` 与 `CLAUDE.md` 要在设置里开开关才导入
      （官方文档）；Cursor 读 `.cursor/rules/*.mdc`。本仓此前没有 `AGENTS.md` —— 也就是说 Codex / Cursor /
      WorkBuddy 的使用者连仓库的基本约束（不只行文规范）都读不到，这是比本卡更大的缺口。
      另有一个佐证：`scripts/enable_agent_skills.py` 的 AGENTS 列表已登记这六家，但它只负责让各家发现 `skills/`，
      没有管指令文件这一层。
      本次动作（按用户选择的最小范围）：新增根目录 `AGENTS.md`，内容只有一行指路（项目指令见 `CLAUDE.md`、
      行文规范见本规范文档），覆盖 Codex 与 WorkBuddy、并让 Trae 的导入开关有东西可导；Cursor 暂不处理（用户指定）。
      不在 `AGENTS.md` 里复制正文，避免多出需要同步的副本。规范文档 §3 的写点表随之增加"跨 harness 入口"一行。
      仍然成立的事实：跨 harness 真正通用的是各面的写点钩子（skills 与模板层面），指令文件只是便利项。
