id: EV-2026-044
layer: L2
title: evolve-check 闭环断点修复——取数入口脚本化 + 收尾自落记录 + 卡完整性进 CI + groom 挂钩
status: validated
authorization: review
dimension: process
supersedes: []
superseded_by: null
created_at: 2026-09-10
source_signals:
  - signal: process_friction
    evidence: >-
      2026-09-10 审计（读代码 + 实跑，不读文档）实测 evolve-check 三处断点：
      ①**取数入口坏**：SKILL.md 第 1 步内联的 python 一行在两种环境都跑不通——主检出里
      `at` 被 PyYAML 解析成 datetime，`[:16]` 抛 `TypeError: 'datetime.datetime' object is
      not subscriptable`；新 worktree 里 `metrics/skill-exec-log.yaml` 不存在，抛
      `FileNotFoundError`（协议第一步 = 每次现场重写一段命令）。
      ②**现场数据几乎不存在**：exec-log 9 天只有 4 条记录，其中 to-reference 0 条
      （同期落库 34 个新 reference 词条文件）、knowledge-groom 0 条、evolve-check 自身 0 条
      ——第 1 步必然落进"无执行记录，基于现场判断"分支，回到机制本要替代的 agent 记忆。
      ③**运行不可观测**：exec-log 只被 evolve-check 读，面板（ev_board_data）与 metrics
      都不看它，且 evolve-check 自己不落记录 → "跑了无信号"与"根本没跑"在数据上不可区分。
    trajectory:
      - "实测命令：python3 -c \"...r.get('at','')[:16]...\" → TypeError（主检出）/ FileNotFoundError（worktree）"
      - "metrics/skill-exec-log.yaml（4 条记录，9 天；.gitignore:79 本地件，3 个并行 worktree 均无此文件）"
      - "git log --since=2026-09-02 --diff-filter=A -- references/ → 34 个新词条，exec-log 无对应记录"
      - "grep -rn 'skill-exec-log' scripts/ dsh-plugins/ → 面板与 metrics 零引用"
  - signal: component_error
    evidence: >-
      卡生命周期完整性只写在 SKILL.md、没有机器判定：42 张卡里 5 张停在 in_experiment
      （032/033/036 只有 `{type: proposal}`——而它们描述的执行早已合入：`866dee2` src_fetch.py、
      `4d9e59d` diagnose 瘦身、`122cd4e` upstream-official-doc 档位；034/035 已记 decision
      「采纳」但 status 未推进）。SKILL.md §3.5 写"verify_proposals 会报"，实际脚本只校验
      终态卡（`python3 scripts/verify_proposals.py --check` → OK 42 张）；CI 的 kb-checks
      既没有该步骤、触发路径也不含 `proposals/**`——`proposals/README.md` 的"CI 校验"是纸面承诺。
    trajectory:
      - "proposals/ideas/EV-2026-032/033/034/035/036.yaml（5 张在实验卡）"
      - "scripts/verify_proposals.py:127-133（原规则只覆盖终态卡）"
      - ".github/workflows/kb-checks.yml（无 proposal 校验步骤；paths 无 proposals/**）"
      - "docs/evolution-run.md:155「已落地（…+ groom）」，但 skills/knowledge-groom 零处提及 evolve-check"
hypothesis: >-
  把"收尾读现场"从 agent 现场重写命令变成确定性脚本入口（`tail_exec_log.py`，缺失/空表 = 正常退化
  exit 0），把"evolve-check 跑没跑"从不可观测变成落进 exec-log（含无信号）并在面板可见，把
  "卡不完整"从 SKILL.md 的散文承诺变成 CI 硬门（卡不完整/僵尸卡/出处缺失/成本口径），并给
  knowledge-groom 补上收尾挂钩——四件事同时做到，evolve-check 才从"文档里的闭环"变成"每次内容
  流程收尾都真实运行、且运行本身可被数据证伪的闭环"
predicted_effect:
  metric: ①第 1 步取数成功率（不再抛异常）②exec-log 中 evolve-check 收尾记录覆盖率（含无信号）③卡生命周期一次性闭合率
  from: "①0%（两种环境都抛异常）②~1 条/9 天（且只有 1 条）③5 张卡停在 in_experiment、CI 无校验"
  to: "①100%（缺失/空表也 exit 0 并给退化口径）②每次收尾 1 条（含无信号）③CI 硬门 + 面板同口径提示，存量卡清零"
validation:
  method: scan_review
  baseline: 修前实测（取数命令抛异常、exec-log 4 条、5 张在实验卡、CI 无 proposal 校验）
  success_criteria: >-
    ①`tail_exec_log.py` 三态（有记录/文件缺失/空表）全部 exit 0 且输出正确；
    ②端到端演练：模拟一次内容流程收尾 → 落 exec-log → 读现场 → 产卡 → 校验 → 自落 evolve-check 记录 → 面板数据可见，全链条命令逐条成功；
    ③负例：卡不完整/僵尸卡/缺出处/validated 缺成本 四类各构造一张 → verify_proposals 必须红（证明规则真的会触发，不是纸面规则）；
    ④CI parity：kb-checks 里每条命令在本分支逐条跑通，`proposals/**` 已进触发路径；
    ⑤面板渲染断言（panel_render_check.js）全绿，含 exec-log 区块的退化/有记录两种状态。
  rollback: 单文件级改动（skill 文本 / 脚本 / CI / 卡），分支合入前可整体丢弃；合入后 git revert（原则七）
gate:
  condition: "evolve-check 收尾协议在≥1 次真实内容流程收尾中被判定为不可用（已复现：取数入口抛异常 + 现场数据缺失）"
risk: medium
principle_refs: [2, 8, 10, 11]
actual_cost:
  tokens: 0
  source: estimate
  note: "本卡执行在单会话内联完成（审计 → 改动 → 演练 → 验证），未单独记账；口径如实标注为未量化，不表示零成本"
decisions:
  - who: agent（2026-09-10 审计会话）
    when: 2026-09-10
    type: proposal
    conclusion: >-
      采纳「把闭环断点按确定性优先级修掉」而非「重写 evolve-check 协议」：协议本身（信号表/产卡链/
      验证门/授权边界）在上一次真实收尾（issue-ingest 批次 → EV-2026-039）里是走得通的，断的是
      **取数、留痕、校验**三处机械环节。因此不动信号表、不动 T1–T8 语义，只修：入口脚本化、
      自落记录、CI 硬门（含面板同口径）、groom 挂钩、exec-log 归属登记。
  - who: agent（同轮执行）
    when: 2026-09-10
    type: action
    conclusion: >-
      实施：①新增 `scripts/tail_exec_log.py`（确定性入口，三态退化）；②`skills/evolve-check/SKILL.md`
      第 1 步改走脚本、第 4 步改「落收尾记录 + 出说明」（含无信号）、§3.5 与依赖表同步；
      ③`scripts/verify_proposals.py` 补卡不完整/僵尸卡（14 天，与面板同口径）/source_signals 出处/
      成本口径四条规则；④`.github/workflows/kb-checks.yml` 加 `proposal-audit` job + `proposals/**`
      触发路径；⑤`scripts/ev_board_data.py` 加 `skill_exec` 段 + ev-panel 加「执行现场（exec-log）」
      区块（含零运行告警）；⑥`skills/knowledge-groom/SKILL.md` 补收尾 evolve-check 挂钩；
      ⑦文档口径对齐（`docs/evolution-run.md` §4/§9、`.gitignore` 注释、`CLAUDE.md` 本地件归属、
      `proposals/README.md`、ev-panel README）；⑧存量卡闭合：032/033/034/035/036 → validated（按真实
      commit 证据补 action/eval/decision），031 补成本口径 → 42/42 validated、零缺口。
  - who: agent（同轮验证）
    when: 2026-09-10
    type: eval
    conclusion: >-
      **新增可重复演练 `scripts/rehearse_evolve_loop.py`（临时副本内跑，49/49 断言通过）**——
      这是本次的验证主体，不是"我觉得能跑"：①取数入口三态（无文件/有记录/空表）全部 exit 0，
      且把旧内联命令在同一环境下的两种崩法（FileNotFoundError / TypeError）作为对照留档；
      ②全链路正例走通（落 exec-log → 读现场 → 产卡 → 校验 → 自落收尾记录 → 看板 json 可见卡号）；
      ③无信号分支可见（evolve_check_no_signal=1，与有信号可区分）；④负例四类（卡不完整/僵尸卡/
      缺 trajectory/终态缺 decision）逐条确认会红，移除后恢复绿；⑤CI parity：kb-checks 的 9 条 run
      命令本地逐条通过，`proposals/**` 已在两条触发路径里；⑥`panel_render_check.js` 76 项断言全绿
      （含执行现场区块的退化/有记录/零运行告警三态）。
      **演练自身抓到 3 个问题并已修**（这就是它存在的价值）：①`verify_proposals` 首版写成
      "action **或** eval 完成即要求 judgment"，在产卡当轮的本卡上就误报 → 收紧为"两者都完成"；
      ②CI 对终态卡只要求 decisions 非空、面板要求有 `decision` 类型记录（两处口径不一致）→ CI 收紧
      到面板口径；③`panel_render_check.js` 的断言把"无缺口"当成"无卡"（硬编码计数/卡号随卡库腐烂）
      → 改为全部从真实数据推导。
      **残留（如实标注，不算通过项）**：`verify_exec_log.py` 不进 CI 是设计选择（本地件），因此
      "exec-log 结构合法"只有收尾时自查这一道；exec-log 的跨 worktree/跨机聚合仍未实现
      （按原则十一不建空转指标）。
  - who: agent（同轮判断）
    when: 2026-09-10
    type: decision
    conclusion: >-
      **validated（采纳，改动保留）**。判据：success_criteria 五项全部由演练实测覆盖（①–⑤ 见上），
      且演练设计为"负例必须红"——规则的可证伪性本身就是验收条件。未采纳的替代方案：
      ①"重写 evolve-check 协议"——协议语义未坏（EV-2026-039 是走通样本），改它属过度工程；
      ②"exec-log 入 git 让 CI 能校验"——与仓库"逐次 append 流水属运行时件"的分层相悖，且会引入
      多分支 append 的合流冲突；改为在 CLAUDE.md 登记为本地件 + 面板可见 + 收尾自查。
      人审边界：本卡改动含 skill 协议文本与 CI，按 evolve-check 授权边界属 review 级（非 kb/high-risk）——
      结构级（triage/skill 骨架）未动，信号表 T1–T8 语义未动。
