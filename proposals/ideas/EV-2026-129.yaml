    conclusion: "落地：新增 scripts/rename_ref.py（默认 dry-run；改四类引用；审计链豁免 decisions 块与 docs/adr/；冻结件默认跳过）；新增 proposals/component-aliases.yaml 并在 ev_board_data.derive_surface 接入归一；新增 tests/test_rename_ref.py（10 项）；CI 触发 paths 补 scripts/rename_ref.py"
  - who: agent
    when: 2026-09-17
    type: eval
    conclusion: "实测：①单测 109 项通过（新增 10 项）；②对已搬完的检出跑工具报「无需改动」——可改引用为 0、审计链豁免 14 个文件、冻结件跳过 26 个；③别名归一后组件键不再分叉：docs/guide/eval.md 由旧 1 张 + 新 1 张并为 2 张，docs/mechanism/pipeline.md 3 张、docs/mechanism/ixn-replay.md 2 张、docs/plan/roadmap.md 2 张"
  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "采纳（validated）。过程中的两处实测教训已固化成守卫：①做幂等回测时用 --apply 跑了一次，顺手改掉了 eval/golden 下 25 个夹具的注释路径，holdout 与 scorecard 同时红 —— 因此加了冻结件默认跳过 + --include-frozen 显式承担；②标签是人读名字时不该跟着路径改（[eval.md](…) 曾被改成 [deep/eval.md](…)），已收紧为「标签含 / 且解到旧路径才改」。残余：别名表本身没有 CI 校验（目标路径写错会静默归一到不存在的键），按准入判据（未复发）先不加门，记在此处。"
