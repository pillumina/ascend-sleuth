source_signals:
- signal: attribution
  evidence: PD 分离 prefill hang：真实根因是 patch_balance_schedule.py:79 的 _disable_preemption_on_prefill_node()（在 PD prefill 节点禁用抢占→调度楔），但我把"请求卡在 pool load"读成"组件故障"，归到 AscendStore 异步 load 路径，workaround(load_async=false) 打错杠杆。三个可核验子缺：①检索词表从未搜 preemption/balance_schedule（知识库本有 balance-scheduling 族：VLLM-ASC-8336/9056 同指 patch_balance_schedule.py），候选只按 title/symptom 未扫 tags → 调度 patch 族被整个漏掉；②同实体每~1s 重复打日志=控制循环活锁，我却按"组件坏了"判；③methodology 静默停滞层只列 decode 侧计数冻结(13964)，缺 prefill 侧调度楔子形态。
  trajectory:
  - knowledge/_index/inference__vllm-ascend__interrupt.yaml（balance-scheduling tag 存在但候选筛不到）
  - references/methodologies/ascend-mooncake-kv-transfer-triage.yaml（step8 静默停滞仅13964 decode 侧）
  - skills/diagnose/SKILL.md（无活锁判定/判别优先追问规则）
  - traces/2026-09-08-ascendstore-pd-prefill-hang.yaml
hypothesis: 静默停滞类（无报错面 + 队列堆积 + 引擎 quiesce）问题的因果支点常在"控制循环/调度层"，而诊断系统被"发日志的组件名"招引到数据面组件。统一改进：①诊断行为规则——同实体固定节奏重复打日志 → 判"控制循环活锁，向调度/接纳/抢占上游走"，非组件故障；多假设并存先问能二分的那个控制维度（如抢占是否被禁），再补数据流细节。②检索/路由——候选筛选在 title/symptom 之外补扫 tags；triage 加"调度楔/接纳失败"症状分支（Running/Waiting creep + 高KV%静止 + 无报错面 → 调度patch族）。③method 静默停滞层补 prefill 侧子形态（请求加载被阻断/无法接纳抢占 → 队列堆积 → engine quiesce → 查 patch_balance_schedule.py 抢占门）。
predicted_effect:
  metric: 静默停滞/调度楔类问题的因果定位命中层（正确支点）
  from: 锚定在"发日志组件"（如 load/transfer 后端），workaround 打错杠杆
  to: 优先定位控制循环层（调度/接纳/抢占），且知识库能路由/召回调度 patch 族
validation:
  method: golden_replay
  baseline: 本次诊断首次输出（traces/2026-09-08-ascendstore-pd-prefill-hang.yaml step5）
  success_criteria: ①候选筛选取样含 balance-scheduling 族（tag 扫描）；②triage 有"调度楔"分支命中本现场；③method 第8层含 prefill 侧子形态且指向 patch_balance_schedule.py；④skill 引入"活锁判定 + 判别优先追问"且回放重写后结论归因支点落到调度层。
  rollback: 各子项未合入前可整体丢弃；合入后 git revert
gate:
  condition: 用户确认纳入（Triage/索引/method/skill 四处联动 vs 只做核心行为规则，择一）
