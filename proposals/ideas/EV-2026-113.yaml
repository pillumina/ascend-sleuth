  - who: agent
    when: 2026-09-17
    type: decision
    conclusion: "**rejected（不采纳内容侧批量补齐，也不采纳机械调参）**：机械筛选的 recall@5 ≈ 14/25 是**这套索引结构的稳定天花板**，与调参无关；超出部分只能由 agent 的语义阅读承担——而它本来就承担着（同子集 19/19）。这与设计原则三一致：字面量面拿不到的东西，不该由它负责。落地两个小产出：①本卡把「天花板 + 四组同值变体」记成数据，避免以后第三次来试同一件事；②docs/eval.md 写明「不要再调机械侧」。**唯一保留的杠杆**是 groom 的逐案判断（新 case 升格时，若证据里有可提炼的报错字面量——错误码/算子名/函数名/`file:line`——让它进 quickly_check 或症状首条），但不做批量、不设配额：审计显示大多数输入侧字面量是模板噪声，批量补会稀释行内信号。"
