  baseline: 无盘点表；§11.1 写"feedback≈0、S2 集未建、无真实 EV 卡"
  success_criteria: "§11.2 表内计数与实测一致（traces 12 / replay 9 / 齐全 5 / golden 23 / EV 10 / skill-exec-log 3）；roadmap E2 口径注明不计 replay；verify_proposals / build_index 通过；CI 全绿"
