decisions:
  - who: agent（self-evolve 深度轮）
    when: "2026-09-04"
    type: proposal
    conclusion: >-
      审核疑问指向真实问题：文档反复说"等数据积累"，但 S2 replay（9 条完整诊断运行）、
      真实 trace（12 条）、golden（23）、skill-exec-log（3）明明在产数据。盘点后确认为
      三种性质而非一种"缺量"：①检索行为类（路由/命中/覆盖缺口）量已够且部分已在喂
      机制——S2 tier2 miss 7/9 → 覆盖缺口信号（5 条已沉淀同名 case，2 真候选 13673/
      13961）；路由错例当前为 0（EV-2026-005/008 修 triage 后样本内不再出错，诚实零）；
      ②失败事件可判性缺——S2 miss 三义无 verdict，不能冒充 execution_error；③独立性缺
      ——S2 单池不可兼作触发与验证样本，E2 要"真实 trace"是防同池自我优化。另确认
      skill-exec-log 只有 3 条是设计叠加（diagnose 不落、机制 2026-09 才接入、内容 skill
      只落收尾摘要），不是日志故障，也不该加常驻统一台账。
  - who: agent（self-evolve 深度轮）
    when: "2026-09-04"
    type: action
    conclusion: >-
      执行：①pipeline §11.1 状态段改为"2026-09 已开始真实运行，实时计数以脚本/文件
      输出为准"；②新增 §11.2「闸门×数据源盘点」：计数口径原则（三类来源不混算）+
      11 行闸门表（每行含 达标判定 + 缺口性质）+ 盘点结论；③roadmap E2 闸门注明计数
      口径=真实 diagnose trace、S2 replay 不计入（独立性）；④A 结算（不落库）：S2 覆盖
      缺口 7 无命中中 5 已沉淀，真候选 2（13673/13961）留 issue-ingest 管道待上游闭环
      核验；⑤决策链留痕本卡。
  - who: agent（self-evolve 深度轮）
    when: "2026-09-04"
    type: eval
    conclusion: >-
      实测计数与 §11.2 表一致：traces/ 12（routed 8 / hit 6 / 齐全 5）；.s2-replay/ 9
