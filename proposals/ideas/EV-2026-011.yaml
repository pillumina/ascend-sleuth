      （VLLM-ASC-10097/10998/13446/13639/9769 等），确认 replay miss 为沉淀前快照。
      verify_proposals / build_index 通过（本次未改 case/卡结构外字段）。golden 不适用
      （未触及 diagnose 路径）。
  - who: agent（self-evolve 深度轮）
    when: "2026-09-04"
    type: decision
    conclusion: >-
      采纳（validated）：§11.2 盘点表 + §11.1 状态修订 + roadmap E2 口径随 methodology
      PR 送人审。观察窗：§11.2 的实时数字在后续文档修订中按"以脚本输出为准"原则刷新，
      不在此表硬编码长期数值；A 的 2 个覆盖缺口候选（13673/13961）由 issue-ingest 管道
