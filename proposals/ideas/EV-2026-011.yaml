hypothesis: >-
  按对象定义闸门计数口径（真实 trace / S2 replay / skill-exec-log 三类来源不混算），
  并把每道闸门的缺口性质（量 / 事件未发生 / 可判性 / 独立性）写明，可让"等数据"成为
  可核对清单，避免两类错误：把已有检索类数据当不存在（S2 覆盖缺口已达标未结算），
  或把评测数据当执行错证据（S2 miss 三义无 verdict）
predicted_effect:
  metric: 蓝图闸门盘点可核对性（每闸门是否有 达标判定 + 缺口性质 标注）
  from: 无（文档状态陈旧、口径未定义）
  to: 全闸门入表（§11.2）；E2 计数口径写明
