  - who: agent
    when: 2026-09-15
    type: action
    conclusion: >-
      按"同工具同词条"把 950 的 hccn_tool 命令族并入既有 hccn-tool-network-diagnosis（补三段式语法、
      5 组新命令、4 条 pitfalls、2 条来源），并新建 npu-smi-950-device-ops（950 的设备查询与维护面）；
      DCMI API 参考 106 篇按"不整体载入 API 参考面"的口径 skipped 并写明理由。
      抽取手法记一笔：driver 的文档是 HTML 转 markdown（正文在 `<table>/<p>/<a name>` 里），
      必须先剥标签再抽命令清单，否则整篇是标记噪声。
  - who: agent
    when: 2026-09-15
    type: eval
    conclusion: >-
      measure 实跑 PASS（hccn950 True、npusmi_cmds 8）；verify_references 213 条通过、索引 --check 绿。
      负向对照：在本改动前的检出上跑同一命令 → npu-smi 词条不存在（FileNotFoundError）→ exit 1。
  - who: agent
    when: 2026-09-15
    type: decision
    conclusion: >-
      采纳并标 validated（效果层）。边界如实标注：本卡证明"950 命令面已进词条且语法差异被显式标注"，
      不证明命令清单穷尽——DCMI 的 950 API 面（87 篇）与 910B/910_93 的 DCMI（376 篇）按口径跳过，
      若后续出现"必须查 DCMI 接口语义"的诊断场景，应把该仓从 skipped 复议为候选。
  - who: agent
    when: 2026-09-17
    type: action
    conclusion: "合入指针回写：本卡（及其结论）随 PR #226 进入 main（回写由 evolve 批次收尾执行，供判据「待合入积压」读取）"
