      （9.5→13）、正文 11–12px、中文 `line-height` 只有 1.5——即**没有尺度**，只有一堆随手写的值。
      改为：①字体栈走 token（`--font-sans/mono/num`），组件里 100+ 处内联 `fontFamily` 全部收口，
      `.sleu` 作唯一落点；**不做 web font**（离线/内网会闪、中文子集几 MB）；
