      面板收起态渲染 `plain`，展开区保留技术文案作「判据出处」（维护者仍能回查配置）。
      同轮两处顺带发现并修掉：①**同一个格子报两遍**——85/30 同时越过 soft(>30) 与 hard(>=60)，
      旧版渲染成两行几乎相同的话（读者以为是两件事），现按格子合并并在判据出处写明越过了哪两条，
      越界项 5 → 4；②**面名是分析方法名**（`越界 cell_soft_cap`、`可解读性`）→ 改为用户语
      （`容量`、`数字可信度`）；命名空间与类别也写中文（`推理 · vllm-ascend 的「中断类报错」`）。
      回归断言：每条失败判据必须有人话版、人话版**不得残留实现标识符**、
      收起态不出现判据名、展开区仍能回查到技术文案。
      **操作事故（第二次同类）**：用编辑工具替换 `VerdictRow` 时，旧函数头与开头几行**没被删掉**，
      形成"残缺函数头 + 注释 + 完整函数"的重复，文件语法坏掉。定位过程暴露了我自己的工具缺陷：
      两份手写的括号配平脚本对正则/模板字面量处理不一致（一份说多左括号、一份说缺右括号），
      最后靠"读整个函数核对"才找到。教训：**括号配平脚本不能只处理引号，还要处理模板与正则**；
      以及**大段替换后第一件事是 `node --check`**（这次是先改完一堆才校验的）。
