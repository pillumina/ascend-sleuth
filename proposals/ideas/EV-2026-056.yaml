  - who: agent
    when: 2026-09-11
    type: action
    conclusion: >-
      **验收当天的实测事故补记（只追加）**：用户在面板上看到的是
      「体检脚本报错: Traceback ... line 149, in main / structural, s_notes = MS.collect_structural(root) ...」
      ——一截**被截断、连异常类型都看不到**的 traceback，等于"面板坏了但不说为什么"。
      查因三处叠加，都是"失败时不给线索"：
      ①`resolveCwd()` 拿不到 `session.header.cwd` 时返回 `undefined`，而
      `shell.resolve({workdir: undefined})` **不报错**（退到某个默认目录）→
      `python scripts/metrics_health.py` 找不到文件；`runLiveMetrics` 一直防着这件事
      （`if (!shell || !cwd)`），我新写的 `runMetricsHealth` 漏了；
      ②错误串用 `err.trim().slice(0, 400)` —— **traceback 的结论在最后几行**，从头截等于只留噪声；
      ③`collect_structural` 内部用 `subprocess.run(capture_output=True)` 跑 `verify_references.py`，
      在受限执行环境里子进程/管道可能被拒 → 异常冒到模块级 → 整轮体检崩掉，
      **连容量越界这种最要命的信号一起没了**。
      修复：①`resolveCwd` 加兜底（会话拿不到就扫已知会话取第一个带 cwd 的）+ 无工作区时
      **不发起注定失败的命令**并说清缺口与手工复现路径；②`shellFail()` 统一报错形态：
      执行上下文（解释器 / 工作目录 / 命令 / 退出码）+ stderr **尾部**（限行数，不撑版面）+
      结构化字段（`py`/`cwd`/`exitCode`/`stderrTail`）；③`collect_structural_safe()` 防御包装：
      任何异常降级为"结构侧采集失败 + 容量判据本轮**未被评估**"（进 `broken`，exit 2），
      `reference` 词条数降级为直接计数并**标注口径**，`collect_content_flow` 同样包装
      （并注明"按 0 显示不代表真的没跑"）。
      回归：`panel_render_check.js` 新增一节——从**真实 host 源文件**按行抽取
      `runMetricsHealth`/`shellFail` 配桩运行（断言：无工作区 0 次命令调用并说清缺口；
      报错含解释器/目录/命令/退出码；stderr 尾部保留 `PermissionError`；错误串 ≤8 行；
      正路仍能解析 verdict），外加"`subprocess.run` 抛 PermissionError 时脚本仍产出 JSON 且如实报降级"。
      逐项踩到的**测试自身**的坑也如实记下：`new Function` 体不是 async（抽出的函数含 `await`）、
      包 async IIFE 后返回的是 Promise 必须 `await`、用花括号配平抽函数会被字符串/正则里的花括号
      干扰（改为按行扫描 `    }`）——三条都是"抽真实源码做断言"这一手法本身的成本。
  - who: agent
    when: 2026-09-11
    type: action
    conclusion: >-
      **根因坐实 + 可读性返工（只追加）**：用户贴出的面板报错里含
      `PermissionError: [WinError 5] 拒绝访问。`——上一轮那条"管道被拒"的猜测被证实，
      且**不止是报错不好看**：它让容量越界（85/30，超 hard_cap）在面板里根本显示不出来。
      修法：`_run` 在 `capture_output` 被拒时**回退到文件重定向**（stdout/stderr 落 `tempfile`
      再读回），于是面板环境下容量判据**照常评估、不降级**；连回退也失败才走到"如实降级"分支。
      回归拆成两个场景（回退成功 → 不降级；回退也失败 → 如实降级），只测后者会漏掉更好的结局。
      同轮修掉一处**口径重复**：降级计数原先自己写了份 rglob 规则（漏 `references/<type>/<family>/`
      嵌套层，得 127 而权威 130），改为复用 `verify_references.count_entries`——
      **避免漂移的办法不是对齐两份规则，是只留一份**。
      用户另反馈"看着吃力、配色尖锐"。**先量化再动手**：实测文字色对白底 4.76–7.09:1、
      暗色 7.6–10.6:1，**全部已过 WCAG AA**——所以问题不在对比度，在**用色位置**：
      红色同时出现在底纹+左边框+图标+胶囊+按钮五处；绿色同时表示"库健康/品牌/容量正常"三项
      无关语义；底纹浓度各写各的（5/6/8/12/14%）。三处返工：①判决行从三栏（图标+66px 标签列+正文）
      改为**单行流式**（一句话被拆成三段是"读起来断续"的主因）；②体检器失效时首屏先说
      "哪几项没跑 + 所以结论怎样"，把原始异常串/覆盖面/复现命令收进折叠——**诊断信息是给维护者的，
      不是给用户的**；③`--d-*`（深档）专供文字描边、`--acc-*` 只作大块面、底纹统一 9%，
      并补上定义了却没用的 `--surf`/`--hair`。顺带修两处真缺陷：判据文案里的 Markdown `**`
      会渲染成字面量；broken 态下状态条说"判据 3/3 全部被评估"与横幅"判据不完整"**自相矛盾**。
  - who: agent
    when: 2026-09-11
