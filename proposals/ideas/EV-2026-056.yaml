      回归新增一节排版契约（档位 ≤8、最小 ≥10、基准 ≥14、行高 ≥1.6、字体栈无字面量残留、
      根挂 `.sleu`、阴影/圆角走 token、hover 走 class），把尺度本身钉住。
  - who: agent
    when: 2026-09-11
    type: action
    conclusion: >-
      **文案层返工（只追加）**：用户指出面板整屏是**变量名**——`cell_soft_cap`、
