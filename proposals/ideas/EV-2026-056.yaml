id: EV-2026-056
layer: L2
title: 把"体检器坏了"与"本期没事"分开——`--check` 补第三态；面板据同一输出显示体检器失效
status: validated
authorization: review
dimension: observability
supersedes: []
superseded_by: null
created_at: 2026-09-11
source_signals:
  - signal: observability_gap
    evidence: >-
      接 EV-2026-055（修掉容量判据从不通电）之后，继续深挖"检测腿"时又实测到**两处同类假绿**，
      且都是"配置/实现坏了而体检器照样报健康"：
      ①**`--check` 只有 0/1 两态**：退出码只由"有没有 ✗"决定，于是"体检器没在工作"与
      "本期确实没有违规"**在数据上完全不可区分**——这不是理论风险，是刚发生过的事
      （漏解包让两条容量闸门从未触发，`--check` 照样 exit 0）；
      ②**`load_yaml` 把解析异常吞成空文档**：`except Exception: return {}`，于是
      `metrics/gates.yaml` 语法坏掉时判据变成 0 条、体检器报
      `clean（判据全部评过）` —— 检测器的**配置读坏了它自己不会喊**（本轮实测复现）。
      另外两条同源观察：
      ③面板没有可信的"覆盖了多少判据"，读者无法判断"没报越界"与"没被检查"；
      ④`metrics/timeline.yaml` 里的容量有**三种形状**（`{count,cap}` 字典 / `"36/30"` 字符串 /
      整块缺席），任何只认一种形状的消费者都会安静地少看到数据（本轮做容量趋势条时实测）。
    trajectory:
      - "python3 scripts/metrics_health.py --check（gates.yaml 正常）→ exit 0/1 两态，无第三态"
      - "造一份语法坏掉的 gates.yaml → 修前体检器报 clean、exit 0；修后报 ScannerError、exit 2"
      - "造一份多一条未实现 dimension 的 gates.yaml → 修前该判据静默不检查；修后 exit 2 且点名 brand_new_gate"
      - "yaml 解析 timeline 各期 capacity_by_ns → 8 期里 1 期是字典、2 期是 'N/30' 字符串、5 期整块缺席"
  - signal: repeated_manual_step
    evidence: >-
      周批第 2 步的人读面原本只有 `✓/!/✗` 清单，读者要自己数"一共检查了几条判据"才知道
      报告是否完整；季度回顾时"这期没有越界"这句话的可信度无从核。补上覆盖面与第三态后，
      "报告完整"与"结论可用"成为报告自己声明的东西，不必靠人回忆配置。
    trajectory:
      - "docs/metrics.md 周批第 2 步：只有'逐面列出 ✓/!/✗ 与行动'，无覆盖面"
hypothesis: >-
  **检测器的可用性必须自证**：一个体检报告的结论强度取决于"它实际评了几条判据"，
  因此报告必须同时给出①覆盖面（N/M）与②三态退出码，且"配置读不动"要作为**不可判定**
  而不是"没有越界"。退出码语义与 `ev_measure.py` 三态同形（0 符合 / 1 被证伪 / 2 无法判定）——
  同一套语言在两类评审把手上复用，读者不必学两套。下游（面板）只渲染这份自证结果，
  第三态时显式呈现"结论不可用"，从而**把假绿变成可见的红**。
predicted_effect:
  metric: 体检结论的可判定性——"体检器坏了"能否与"本期无越界"在退出码与报告上区分
  from: "两态：exit 0 既表示'本期没事'也表示'判据根本没被评过'；配置解析失败被吞成空文档后报 clean"
  to: "三态：exit 2 = 有判据未被评估（结论不可用）并逐条点名；报告给出判据覆盖面 N/M；面板首屏显示「体检器失效」而非「闭环未见阻塞项」"
  measure:
    command: node scripts/panel_render_check.js
    expect_exit: 0
    expect_stdout: 体检器失效
validation:
  method: metrics_compare
  baseline: 修前：语法坏掉的 gates.yaml → exit 0 + clean；多一条未实现 dimension → 该判据静默跳过；面板无覆盖面、无失效态
  success_criteria: >-
    ①`--check` 三态可判：真实数据 1、造出的"判据不可评估"场景 2、且 2 时 verdict 不是 clean；
    ②覆盖面可查（闸门 N/M · 可解读性 K/L），真实数据为 3/3 与 2/2；
    ③面板第三态出红色横幅、点名缺口、覆盖面显示 3/4、且**不**出现"闭环未见阻塞项"；
    ④`load_yaml` 解析失败进 broken（不再是空文档）；
    ⑤容量趋势条能跨三种形状归一（实测 `32→85 (+53)`）；
    ⑥既有断言无回归。
  rollback: 改 1 脚本 + 1 新增夹具 + 面板 client 一文件 + 2 处文档；均可 git revert（原则七）
gate:
  condition: "为 EV-2026-055 收尾时实测到两处同类假绿（已发生）；非日历驱动"
risk: low
principle_refs: [2, 6, 8, 10, 11]
actual_cost:
  tokens: 0
  source: estimate
  note: "单会话内联执行，未单独记账；口径同前几张卡"
decisions:
  - who: agent
    when: 2026-09-11
    type: proposal
    conclusion: >-
      采纳"**让检测器自证可用性**"（覆盖面 + 三态退出码 + 配置读不动即不可判定），
      而不是"在文档里提醒人注意配置别写坏"：①提醒不是结构，本轮两处假绿都是"没人会注意"的类型；
      ②覆盖面是**报告自己声明**的事实，不依赖读者回忆 gates.yaml 里有几条判据；
      ③三态与 `ev_measure.py` 同形，复用既有语言而不新造一套。
      **不做的事（明确）**：①不改任何闸门数值（红线：系统不改自己考卷）——本轮只加"是否被评估"
      与退出码语义；②体检器仍**不进 CI**（沿用前两张卡：安静的一周没有新快照是正常状态，
      硬门会假红）；③不为"配置坏掉"加自动修复——检测器的职责是如实喊出来，不是替人改文件。
  - who: agent
