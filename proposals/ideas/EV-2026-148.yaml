decisions:
  - who: agent
    when: 2026-09-23
    type: proposal
    conclusion: >-
      产卡即执行，范围限定为一件结构改动：路由先分侧、再分性质。设计经用户三轮否掉两个更重的版本——
      不做"框架名到侧"的映射表（MindIE 这类新框架就是反例，且表会腐烂），也不做"证据判侧"的判据体系
      （为省一句话造两层机制，是把模型当猜谜机）。侧只有单一来源：工程师给的事实；材料里读得到就用，
      读不到就问一句（他一定知道），顺手给了框架名就对到库里目录；判不出来时两侧都查并在 trace 标
      `side: unknown`，不猜、不阻塞。中途证据与他的说法相反时以证据为准并回一句话。
  - who: agent
    when: 2026-09-23
    type: action
    conclusion: >-
      实施：`triage-tree.d/` 由"6 个训推分支 + 1 个兜底"改为"一性质一文件"（10-interrupt /
      20-precision / 30-performance），协议文件 `00-protocol.md` 同时承载 `sources:`（源清单，
      拼接口径的唯一写点）与 `sides:`（合法侧 + 每侧目录面）；性质分支的检索面改用 `<side>/` 占位，
      由侧展开——侧因此不在症状层。生成物出 `sides:` + `natures:`，并保留 `branches:` 别名
      （YAML 锚点，读侧口径不变）。`build_triage_tree.py` 的校验随之加五条：一性质一文件、
      源清单无遗漏、`<side>` 占位必须在、侧不能少于 2 个、侧的目录面必须落在自己的 `knowledge/<侧>/` 下；
      `route_check.py` 增加 `effective_branches(side)`（侧内比较的入口）与 `--show-sides`，
      `--wide-words` 的语义从"跨侧重复"改为"同一形态被两个性质同时认领"。诊断正文：第 1 步覆盖表加
      `负载类型（训练 / 推理）` 行与四档来源规则，第 2 步改为"先落侧、再在侧内判性质"，trace 的
      `triage` 事件加 `side` / `side_source`（四档）并写明历史 trace 不改写。删掉 `uncategorized`
      兜底分支：性质判不了时的动作（该侧三个性质的索引一起加载）本来就写在流程里，作为分支存在
      反而要求它带一个 `category: null` 的空词表。
  - who: agent
    when: 2026-09-23
    type: eval
    conclusion: >-
      measure PASS：`side_in_branch_ids 0`／`natures_pinning_a_side 0`／`wildcard_duplicates 0`
      （改前 57）／`cross_side_captures 0`（改前 72）。改前四个数的复现路径写在 `validation.baseline`
      里（要点：改前聚合要配改前的脚本；拿现在的脚本读旧表只会读成 0）。反例覆盖面见
      `success_criteria` 末尾那段"适用范围"——同一条判据在 8 个故意做坏的变体上 7 个报红、1 个漏过
      （侧专属措辞进共用词表），所以 PASS 不是脚本自己没牙齿，但也没有宽到能替内容判断。
      **如实标注残余**：`same_side_other_nature 6`——同侧内部"首个命中落在别的性质"的 case 有 6 条，
      改前同口径是 4 条。逐条回看改前归属（独立预核实测）：4 条改前也落在同侧别的性质上
      （`VLLM-ASC-7659` / `VLLM-ASC-12723` / `VLLM-ASC-5725` / `MSLLM-FA-MASK-GRADNAN`，症状歧义是既有的）；
      另外 2 条（`VLLM-ASC-14306` / `VLLM-ASC-14273`）改前是被**训练侧**的分支抢走的（跨侧），改后落回自己
