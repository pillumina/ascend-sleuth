# ============================================================
# EV-2026-148 —— 路由先分侧再分性质：把"训练/推理"从症状词里拿出来，改由工程师的事实确定
# 来源：用户连着三轮追问路由层——
#   ①「宽词顺序又是什么」→ 实测路由表里 57 条正则在训推两侧各写一遍，顺序先到者接住；
#   ②「这个得优化吧，不能撞在一起啊，而且得先判断是训练还是推理的类型吧」→ 实测全库 146 条
#      可判 case 里 76 条被别的分支先接住，其中 72 条是跨侧（训练分支抢推理 case）；
#   ③「训练推理是不是也不能这么死？比如 mindie 这种新的框架，也是推理呀」+「判不出来得和用户
#      确认吧」+「不要耗费大量思考在这个判断上，到底是训练还是推理肯定是用户知道的」
#      → 否掉了"框架→侧"硬映射表与"证据判侧"判据体系：侧是用户的环境事实，问一句就有。
# 脱敏：只含仓库内路径、命令与聚合数字
# ============================================================

id: EV-2026-148
layer: L2
target_component: triage-tree.yaml
title: "路由先分侧再分性质：训练/推理由工程师的事实确定（材料里读得到就用，读不到问一句），宽词归性质层"
status: validated
authorization: review
dimension: architecture
supersedes: []
superseded_by: null
created_at: '2026-09-23'
source_signals:
  - signal: user_feedback
    evidence: >-
      用户三轮追问收敛到一条设计：训练/推理这一轴不该由症状词判，也不该靠"框架名到侧"的映射表
      （MindIE 这类新框架就是反例），更不该让模型花力气去推——它是工程师手上就有的事实。
      同时否掉了我提出的"证据判侧判据体系"：为省一句话去造两层机制，是把模型当猜谜机。
    trajectory:
      - "用户会话输入（本轮；无仓库内出处）"
  - signal: observation_window
    evidence: >-
      两条独立实测，指向同一个结构缺陷：`triage-tree.yaml` 把"哪一侧"和"什么性质"压进同一个分支
      选择里（`training_interrupt` / `inference_interrupt` …），于是同一个宽词必须在两侧各写一遍，
      而分支顺序决定谁先接住。
      ①全库 146 条可判 case（`knowledge/<side>/<fw>/<cat>/*.yaml` 逐条拿 title+symptoms 当代理输入）：
      **76 条**被别的分支先接住，其中**72 条是跨侧**（如 `aclnn\w+`、`\btimeout\b`、`\bOOM\b`、
      `启动即失败` 由 `training_interrupt` 接住 `inference_interrupt` 的 case），同侧跨性质只有 4 条。
      ②16 个 trace 里 11 个有 triage 记录，其中 **1 条真发生跨侧误吸**：
      `2026-09-14-telechat-cq-alloc-dev5.yaml` 的 `VLLM-ASC-9596`（推理侧 case）被路由到
      `[common, training]`、branch 记为 `training_interrupt`。
      口径说明：76 是**上限**（拿 case 自己的症状当输入、按首个命中算），真实诊断喂的是工程师贴的
      文本，agent 还会模糊判断并可在多分支弱匹配时退化加载全部 namespace；所以别读成"一半诊断都错了"。
    trajectory:
      - "遍历 knowledge/*/*/*/*.yaml，用 scripts/route_check.py 的 hits_for 逐条算首个命中"
      - "遍历 traces/*.yaml，比对 triage 事件的 routed 与 active_case 所在侧"
hypothesis: >-
  把"哪一侧"从症状匹配里拿出来、改由工程师给的事实确定（材料里写着训练中/推理请求中/服务命令就用，
  没写就在第一步问一句；他给了框架名就顺手对到库里目录），性质仍在侧内按症状判，并把两侧共用的宽词
  归到性质层之后：跨侧碰撞在结构上不可能发生（训练分支对推理任务根本不参与）；同一性质只需一份词表，
  不再出现"同一正则写在两个分支里、靠顺序决定谁赢"。侧判不出来时不猜：两侧都查，trace 标 `side: unknown`。
predicted_effect:
  metric: 跨侧碰撞的 case 数（代理输入口径）与"同一正则出现在多个分支"的正则数
  from: >-
    76 条 case 被别的分支先接住（72 条跨侧、4 条同侧跨性质）；57 条正则跨分支重复；
    trace 实测 1/11 真跨侧误吸。侧信息目前埋在第 1 步覆盖表的"触发位置"行里，没有被当成路由输入。
  to: >-
    路由表拆成"侧 × 性质"：侧来自工程师的事实（材料 / 问他 / 框架名对目录），性质在侧内判；
    跨侧碰撞归零；跨分支重复的正则降到"同性质内共享"这一档（两侧共用一份词表）；
    trace 记 `side` 与 `side_source`（evidence / user / framework / unknown），使"判侧"这一步可观测。
  measure:
    command: |
      python3 - <<'PY'
      import glob, pathlib, sys, yaml
      sys.path.insert(0, 'scripts')
      import route_check as RC
      SIDES = ('training', 'inference')
      root = pathlib.Path('.')
      branches = RC.load_branches(root)

      # ① 结构：侧不在症状层。"侧被写进词表"的表现是分支名带侧前缀，或性质分支的检索面写死某一侧
      #    （写死了就不会带 <side> 那个替身记号）。
      side_in_ids = [b.get('id') for b in branches
                     if str(b.get('id', '')).split('_')[0] in SIDES]
      pinned = [b.get('id') for b in branches
                if not any('<side>' in str(n) for n in (b.get('search_namespaces') or []))]
      try:
          sides = yaml.safe_load(open('triage-tree.yaml', encoding='utf-8')).get('sides') or []
      except Exception:
          sides = []

      # ② 词的重复：性质词表训推共用一份，同一正则不该再出现在两个性质里。
      ww = RC.wide_words(branches)

      # ③ 跨侧碰撞（与基线同口径：拿 case 自己的症状当代理输入、按首个命中算）：
      #    算首个命中，再按"赢的那个分支的检索面落在哪些侧"判它是不是抢了另一侧的 case。
      #    与侧无关的性质分支（检索面里带 <side> 那个替身记号）两侧共用一份词表，
      #    结构上不可能跨侧抢——这正是本次改动要买的东西。
      def branch_sides(b):
          ns = [str(x) for x in (b.get('search_namespaces') or [])]
          if any('<side>/' in x for x in ns):      # 带 <side>/ 的检索面由侧展开
              return set()
          return {x.split('/', 1)[0] for x in ns if x.split('/', 1)[0] in SIDES}

      by_id = {str(b.get('id')): b for b in branches}
      cross, same = [], []
      for p in sorted(glob.glob('knowledge/*/*/*/*.yaml')):
          doc = yaml.safe_load(open(p, encoding='utf-8')) or {}
          for case in (doc.get('cases') or []):
              side, exp = RC.case_side_and_nature(pathlib.Path(p), root)
              if not exp:
                  continue
              hits, _broken = RC.hits_for(RC.case_text(case), branches)
              if not hits or hits[0][0] == exp:
                  continue
              bs = branch_sides(by_id.get(hits[0][0]) or {})
              (cross if bs and side not in bs else same).append(
                  (case.get('id'), side, exp, hits[0][0]))

      print('sides_declared         ', [s.get('id') for s in sides])
      print('side_in_branch_ids     ', len(side_in_ids), side_in_ids)
      print('natures_pinning_a_side ', len(pinned), pinned)
      print('wildcard_duplicates    ', len(ww), [w for w, _ in ww[:3]])
      print('cross_side_captures    ', len(cross), cross[:3])
      print('same_side_other_nature ', len(same), same[:3])
      ok = (len(sides) >= 2 and not side_in_ids and not pinned and not ww and not cross)
      print('VERDICT', 'PASS' if ok else 'FAIL')
      PY
    expect_exit: 0
    expect_stdout: "VERDICT PASS"
validation:
  method: golden_replay
  baseline: >-
    改动前：`triage-tree.yaml` 六个分支各含"侧 + 性质"（加兜底共七支）；侧只体现在分支 id 与
    `search_namespaces` 的前缀里，由症状词匹配结果间接决定；全库 76 条 case 被别的分支先接住，
    其中 **72 条跨侧**（同一个 case 症状，被检索面写死另一侧的分支抢走）；**57 条正则跨分支重复**
    （同一个宽词在训推两侧各写一遍，靠分支顺序决定谁先接住）。
    **改前那几个数怎么复现**（独立预核提了这条：说清路径，否则 reviewer 拿着命令跑不出原数）。
    要点有二：**改前的聚合要配改前的 `route_check.py`**，以及**改前的 `expected_branch` 返回
    `<侧>_<性质>`**（`case_side_and_nature` 是分层时才加的，用现在的脚本读旧表会 `AttributeError`，
    而现在的 `load_tree` 不回退退休的 `branches:` 桶，读旧表只会得到一排 0——那不是"基线是 0"，
    是读错了表）。照下面这段跑：

      git archive <本次改动之前的那次提交> | tar -x -C /tmp/pre      # 写 revision 不写哈希：哈希随 amend 失效
      cd /tmp/pre && python3 scripts/build_triage_tree.py --check       # 确认拿到的是旧表（7 个分支）
      # 再把卡片这条 measure 粘出来跑，但把
      #     RC.case_side_and_nature(path, root)   →   RC.expected_branch(path, root)
      # 并把 `side/exp` 那一行换成 exp.split('_')[0] / exp.split('_')[-1]

    实测读数：`side_in_branch_ids 6`、`natures_pinning_a_side 7`（旧表 7 个分支的检索面都没带
    `<side>` 占位——6 个性质分支 + 兜底的 `uncategorized`，它的检索面是 `common/`）、
    `wildcard_duplicates 57`、`cross_side_captures 72`、`same_side_other_nature 4` → VERDICT FAIL。
    （改前的候选共 7 个分支，可判 case 123 条里没有一条"首个命中就是它的性质段"。）
  success_criteria: >-
    ①上述 measure 打 VERDICT PASS：`sides` 两个侧、分支名不带侧、性质分支都带 `<side>` 占位、
    跨性质重复正则 0、**跨侧碰撞 0**（改前 72）；
    ②历史回放对照：同一批 trace 上 `routed` 与最终命中 case 的 namespace 一致性不下降——
    实测 `python3 scripts/replay_trace.py` 改前改后都是"16 个 session、可校验 4 个、路由漂移 1 处
    （`2026-09-16-12430-dsv4pro-mc2`）"，即检索层改动没有让历史一致性变差（那 1 处是当时 session
    自己没记 `routed`，不是本次改动引入的）；
    ③诊断正文改了侧的处理：第 1 步覆盖表加一行 `负载类型（训练 / 推理）`（来源标注：材料 / 框架 / 问他），
    第 2 步在侧内选性质；侧未知时两侧都查并在 trace 标 `side: unknown`；
    ④`tests/` 全绿（236 条；`python3 -m unittest discover tests` 实跑读数），`build_triage_tree.py --check-coverage` 与 `route_check.py`
    两条自查在改后的表上跑通；
    ⑤kb-checks 逐条本机复跑全绿。
    **这条 measure 的适用范围（独立预核实测出的盲区，写窄比写宽诚实）**：它查的是**结构**——侧有没有
    被写进分支名、性质分支的检索面有没有 `<side>` 占位、同一正则有没有被两个性质同时认领、以及
    "按首个命中算，有没有 case 被检索面写死另一侧的分支抢走"。它**查不出**"某一侧的专属措辞被写进了
    共用词表"（反例：把 `vllm serve` 加进 interrupt 的 symptoms，占位都在，measure 仍 PASS）——那一类
    是内容判断，靠 `python3 scripts/route_check.py <case>` 单条看"首个命中是不是它该归的性质"，以及人审；
    别把这条 measure 的 PASS 读成"词表已经侧中立"。
  rollback: 分支丢弃或 git revert；路由表与其生成物同一次提交内可整体回退（无数据迁移）。
gate: >-
  若改后回放显示 `routed` 准确率没有改善、且实际诊断里"侧需要问"的比例高于预期（比如多数 session
  都要多问一句才敢定侧），说明侧信息在真实材料里比我假设的更难拿到——那时回到"两侧都查"做默认，
  问只作为可选优化，而不是把它当成流程的必经一步。
risk: medium
principle_refs: [2, 6, 9, 10, 11]
