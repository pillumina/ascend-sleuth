      验收②历史回放：`python3 scripts/replay_trace.py` 改前改后同读数（16 个 session、可校验 4 个、
      漂移 1 处 `2026-09-16-12430-dsv4pro-mc2`），检索层改动没有让历史一致性变差；那一处是当时
      session 没记 `routed`（`routed: []`），与本次改动无关，也不在本次改动的可达面内。
      验收④`tests/` 236 条全绿。**顺带核对了卡里的两处数**：①`source_signals` 说"16 个 trace 里
      11 个有 triage 记录"——主检出实测是 16 个文件里 15 个含 `triage` 事件，其中 4 个的 `branch` 是
