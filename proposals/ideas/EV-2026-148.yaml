    `scripts/route_check.py` 按侧内比较、改 `skills/diagnose/references/diagnosis-procedure.md` 第 1、2 步
    与 `skills/diagnose/SKILL.md` 的路由段、trace schema 加 `side` / `side_source`、若干文档
