      卡里那个 1/11 是归因错了（`source_signals` 保留原文，此处更正）。
  - who: agent
    when: 2026-09-23
    type: decision
    conclusion: >-
      采纳（validated）。判据是 measure 的 FAIL → PASS 对照 + 236 条测试全绿 + 历史回放一致，
      且残余（6 条同侧跨性质）已如实标注、有流程内既定的退化路径兜住。价值层不由此卡证明：
      跨侧碰撞归零是结构性的（另一侧的检索面不在候选里），但"侧要问一句"的真实比例只有上线后
      的 trace（`side_source` 分布）能回答——那是 `gate` 里写的那件事，留作后续观测。如果
      `side: unknown` 占比持续偏高，修法是把那句问话往前挪，不是把侧塞回症状层。
