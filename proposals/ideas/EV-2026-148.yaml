      `2026-09-14-telechat-cq-alloc-dev5` 的 `VLLM-ASC-9596` 记为"真跨侧误吸"的实例，实读那条 trace——
      工程师说的是 MindSpore 训练（侧路由正确），推理侧 case 是被步骤 4 的"跨库比对"机制捞出来的
