id: EV-2026-033
layer: L2
title: diagnose skill 去复杂化/结构化（瘦 SKILL 脊梁 + 详情下沉 skill 本地 references + 去重）
status: validated
authorization: review
dimension: maintainability
supersedes: []
superseded_by: null
created_at: 2026-09-08
source_signals:
  - signal: process_friction
    evidence: "从 skill-creator 规范评估 diagnose：SKILL.md 213 行，与它自己的 skills/diagnose/references/diagnosis-procedure.md（126 行）在核心循环（步骤1-6/severity/输出格式/confidence 校准/误诊归因）大篇幅重复；SKILL 内联了带 EV 卡号标注的微规则（F4/A2/B1/E2-1）及按需才用的边角细节（HF 多源、category-cell、双面交叉检索）。→ 上下文成本（原则九）+ 重复导致漂移风险。"
    trajectory:
      - "skills/diagnose/SKILL.md（213 行）"
      - "skills/diagnose/references/diagnosis-procedure.md（126 行）"
hypothesis: 把 SKILL.md 瘦身为「可执行脊梁」（仅始终要跑的骨架/severity 闸门/命中输出/trace 纪律/不要做），把「按需才用的细节规则」下沉到 skill 本地 references/（懒加载），消除 SKILL 与 diagnosis-procedure.md 对同一核心循环的重复描述 → 降低上下文成本与漂移风险，且行为语义不变
predicted_effect:
