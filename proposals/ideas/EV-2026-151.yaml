decisions:
  - who: agent
    when: 2026-09-29
    type: proposal
    conclusion: >-
      先做"哪些能受益"的分析再动手，不做全量搬运。分析结论：外部仓的机制层（agent 声明式配置、
      子代理信封协议、构建期资源分发）对本仓无价值——本仓的文档索引门、版本兼容矩阵、脱敏与
      封存评测都比它强；有价值的是**判读面**（字段字典、执行层、阈值与排除条款），
      以及"它没做的事"这一反向清单（无兼容矩阵、无脱敏流程、benchmark 未接 CI）。
  - who: agent
    when: 2026-09-29
    type: eval
    conclusion: >-
      **先核实上游来源的许可与形态再抄内容**：上游是木兰宽松许可证第 2 版，可复制/修改/分发，
      须保留版权与许可声明；词条的 sources 逐条写了上游 URL + commit，不搬正文段落。
      另发现上游自身三处文档与实现不一致（NaN 溢出判据声明含 inf 而脚本只判 NaN、
      尖刺阈值文档写 60% 而脚本是 50% + max(median×2,1.5)、训推算子差异扫描声明产出 3 个文件实际 2 个）——
      抽词条时以脚本实现为准，并把"文档与实现不一致"作为 pitfalls 写进词条。
  - who: agent
    when: 2026-09-29
    type: action
    conclusion: >-
      实施过程中被 CI 抓住一次真缺口：`framework-profiler-instrumentation` 写完后
      `verify_references.py --check` 报"tool 词条未被任何诊断闸门绑定——未绑定等于永不加载"。
      这条覆盖环正好证明了本次要修的东西：tool 词条不进候选路由，闸门是唯一入口。
      已挂进 performance 的 has_data / no_data 两个分支；同时把此前未被绑定的
      `ascend-profiling-collection-planning` 补挂到 has_data（它的"分析前置体检"正是拿回数据后的第一步）。
  - who: agent
    when: 2026-09-29
    type: decision
    conclusion: >-
      采纳（validated）。判据：改前 232 条 → 改后 241 条且 `verify_references.py --check` 绿；
      3 条新 tool 全部被闸门绑定；performance 分片 8 → 10 条；三个索引生成物 `--check` 绿；
      CI 15 条命令本机复跑全绿 + `unittest discover tests` 绿 + `rehearse_evolve_loop.py` 183/183。
      **价值层不由此卡证明**：词条只说明"判据进库了且可达"，不说明诊断准确率提升——
      那要靠后续 trace 的真实读数（本卡未涉及，如实标注）。
      来源边界同样如实：全部内容取自上游文档与技能说明，未在本机复跑工具验证阈值行为。
  - who: agent
    when: 2026-09-29
    type: action
    conclusion: "合入指针回写：本卡（及其结论）随 PR #292 进入 main（回写由 evolve 批次收尾执行，供判据「待合入积压」读取）"
