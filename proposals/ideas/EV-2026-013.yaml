      - "ingest-state.json + .s2-replay/（现成 issue 池与 S2 数据）"
hypothesis: >-
  selection 池（未沉淀 closed/completed issue + expected 标注）提供 held-out 评分面，
  "golden 无回归 + val 命中/路由严格提升"门可裁决检索/路由层候选改动，影响账本留痕——
  构成可运转的元层自演进台；test/selection 分离按规模闸门启用（防对 selection 过拟合）
predicted_effect:
  metric: 检索/路由层改动可门控率（候选是否需数据裁决）
  from: 无（改动靠 golden 无回归 + 人审，无 held-out 提升门）
  to: 可门控（pool 17 条 + stats/gate 工具；端到端运转一次）
validation:
  method: metrics_compare
  baseline: 无 arena（S2 单池评测无门）
  success_criteria: "池文件校验通过；工具 smoke（pool/stats/gate 合成样本）输出正确；词表 scan 全绿；verify_proposals / build_index 通过"
  rollback: 分支合入前可整体丢弃；合入后 git revert（原则七）
gate:
  condition: "用户指示'把各层构建完毕、元层 self-evolve 彻底完善并运转'（2026-09-04）"
risk: medium
principle_refs: [1, 5, 6, 7, 10, 11]
actual_cost:
  tokens: 10000
  source: estimate
decisions:
  - who: agent（goal 执行）
    when: "2026-09-04"
    type: proposal
    conclusion: >-
      盘点结论：检索/路由层 eval 材料已齐（golden 23 回归 + S2 result schema + ingest
      processed 325 中 233 未沉淀 closed issue），缺 train/val 分离与门控动作本身。
      arena 设计：selection 池 = 未沉淀 closed/completed issue（resolution 可溯）+
      expected 标注；评分复用 S2 result（hit/route/rc_match 带分母）；门控 = golden
