# ============================================================
# Idea 卡：元层 eval 台（arena）——WikiSkill 式 train/val 分离 + 门控自演进
# 目的：把 S2 replay 从"单池评测"升级为"held-out selection 池 + 自动评分门 +
#       影响账本"的元层台，让检索/路由层组件的每次改动可被"候选侧 vs baseline
#       在 val 上严格提升"裁决（对应 WikiSkill R_val > R_best 语义）。
# ============================================================

