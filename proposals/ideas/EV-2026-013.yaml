  - signal: human_review_feedback
    evidence: "审核链路'与 WikiSkill 元层差什么数据、现成 issue 能否建 eval'——盘点确认检索/路由层材料齐（123 已沉淀 + 325 processed 中 233 未沉淀 + golden 23），缺的是 train/val 分离与门控动作；用户指示按目标全量构建并运转元层 self-evolve"
    trajectory:
      - "docs/evolution-pipeline.md §2.1（S2 口径）/ §11.2（闸门盘点）/ §12a（WikiSkill 采纳）"
