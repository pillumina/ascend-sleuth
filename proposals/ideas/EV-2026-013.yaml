      首批 selection 17 条（vllm-ascend 0.21–0.26，DS-V4-Flash/GLM-5.2/MTP/PD 等族）。
  - who: agent（goal 执行）
    when: "2026-09-04"
    type: action
    conclusion: >-
      执行：①docs/evolution-eval-arena.md（分层/池治理/评分口径/门控协议/工具/分级）；
      ②scripts/eval_arena.py v1（--pool 校验 / --stats 聚合 / --gate 判定+账本）；
      ③selection 池候选清单选出 17 条（规则：processed 减 KB 已沉淀 → closed/
      completed → 实体 Bug/Usage）；④roadmap 登记 E8、glossary 补词条；⑤决策链留痕。
      池文件与 result 属本地运行件（.s2-replay/arena/，gitignore），工具与规则提交。
  - who: agent（goal 执行）
    when: "2026-09-04"
    type: eval
    conclusion: >-
      工具 smoke：合成 pool + 两条 result（一条 route ok/hit、一条 miss）→ --stats 聚合
      与手算一致（分母标注）；--gate 在 candidate hit↑ 时 accept、hit↓ 时 reject，账本
      append 生效；池候选清单核对 17 条均为 closed/completed 且非 KB 已沉淀。py_compile
      OK；verify_proposals / build_index 通过；词表 scan 全绿。golden 不适用（工具层）。
  - who: agent（goal 执行）
    when: "2026-09-04"
    type: decision
    conclusion: >-
      采纳（validated）：设计 + 工具 v1 随 methodology PR 送人审。观察窗：①selection
      池 expected 标注 + baseline replay（subagent 批量）→ stats 落地；②端到端运转一次
      （真实 miss → 候选 → gate → 合入）验证门控可用；③test/selection 分离按规模闸门
      （selection ≥20）启用；④分数进 timeline 前提样本 ≥10 带分母（口径纪律）。
