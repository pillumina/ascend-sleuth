content:
  claim: "HiF8 是昇腾950 新增的 8 比特浮点格式：综合阶码范围从 FP8 E4M3 的 [-15,15]（18 个指数表达）提升到 [-22,15] 共 38 个指数，接近 FP16 的 40 个；与 MXFP8 相比不需要额外的 8 位 MX 缩放因子。编码特性：变长前缀码点位域 Dot 显式指示阶码位宽与 Denormal 标志；阶码用原码编码并隐藏 1 比特固定值；在数值绝对值靠近 1 时精度高、远离 1 逐渐降低，无跳变；编码 4 个特殊值（ZERO=00000000、NAN=10000000、+INF=01101111、-INF=11101111），不区分正负 0。"
  evidence: "白皮书 §4.1.1 CUBE CORE（PDF p.19-20）：『相比于FP8 E4M3 的18 个指数表达，HiF8 支持38 个指数表达』『与MXFP8 相比，HiF8 不需要额外的8 位MX 缩放因子』及表 4-1 特殊值编码。已对 PDF 原文核验。"
