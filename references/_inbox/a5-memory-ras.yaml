content:
  claim: "昇腾950 高速片上内存实现 RAS（Reliability, Availability and Serviceability）特性：支持 Online ECC；巡检特性发现薄弱点并回写或隔离；预留部分行，在发现新增行失效时动态隔离问题行并搬运数据到预留行，实现用户无感知的行失效隔离。"
  evidence: "白皮书 §4.3.1 高速片上内存（PDF p.26）：『支持Online ECC』『巡检特性，发现薄弱点并回写或隔离』『预留部分行，在发现新增行失效时，可以动态隔离问题行』。已对 PDF 原文核验。"
