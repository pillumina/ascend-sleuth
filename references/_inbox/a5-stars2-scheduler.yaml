content:
  claim: "昇腾950 升级第二代硬件调度器 STARS2.0：全芯片任务和资源调度中心，支持调度 AIC、AIV、CPU、DVPP、SDMA、UB、CCU 等多个计算和数据搬运引擎；支持实时 TOP-DOWN Profiling（记录 Task 执行时间轨迹、计算开销、带宽、功耗）。能力：Host 下沉 2048 条任务流到 Device；并发调度最多 16 个 AI CPU + 64 个 Host CPU 任务、64 个 UB jetty、32 个 CCU 任务、32 个 SDMA 通道；最多 128K 个单比特或 4096 个 32 比特同步标志位；专用高速控制总线 HSCB 与 AIC/AIV 交互，调度开销 ns 级；Group 调度支持将 AI Core 分成最多 8 个 Group（可按 Die 亲和性调度利用 L2 Cache 局部性）；算力切分支持 AIC/AIV/SDMA 最多 16 个资源池、其他加速器最多 8 个资源池，支持资源池与虚拟机绑定实现资源隔离。"
  evidence: "白皮书 §4.4 软硬协同高效调度（PDF p.27-28）：『STARS2.0』『HSCB』『调度开销降低至ns 级』『最多8 个Group』『16 个资源池』。已对 PDF 原文核验。"
