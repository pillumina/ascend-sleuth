id: a5-ub-onchip-switch
type: platform-fact
title: A5 UB On Chip Switch（IO Die 内 9×x4 Port 转发，不占 DRAM 带宽）
summary: 单 IO Die 内 9 个 x4 Port 间流量转发，经 NoC 完成，不进计算 Die、不占 DRAM 带宽

sources:
  - type: official-doc
    url: "昇腾950 NPU 架构白皮书（华为技术有限公司），本地归档 ~/ascend/昇腾950 NPU架构白皮书.pdf"
    version: "2026-06-04（PDF metadata creationDate）"
    fetched_at: 2026-08-28
# 提取自 PDF p.34 §4.6.5（pymupdf 直接提取核验）

applies_to:
  platforms: [A5-950]

status: draft
last_verified: 2026-08-28

content:
  claim: "昇腾950 支持单 IO Die 内 9 个 x4 Port 之间的流量转发：进入端口的流量查询路由表后，若判断非本芯片流量且得到转发出端口，则经片上互联网络（NoC）转发至出口端口送出；此转发流量不进入计算 Die、不占用 DRAM 带宽；支持注入流量与转发流量的混合部署。"
  evidence: "白皮书 §4.6.5 UB On Chip Switch（PDF p.34）：『本芯片支持单IO DIE 内9 个x4 Port 之间进行流量转发』『此转发流量不会进入计算DIE，也不会占用DRAM 带宽』。已对 PDF 原文核验。"
