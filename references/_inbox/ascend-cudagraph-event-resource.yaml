  - type: case-derived
    cases: [VLLM-ASC-12989, VLLM-ASC-9596]
    extracted_at: 2026-08-28
    extraction_method: to-reference --ingest-cases

applies_to:
  frameworks: [vllm-ascend]
  categories: [interrupt]

status: draft
last_verified: 2026-08-28

content:
  code: "507903 / 207005"
  meaning: "昇腾 NPU 的 event/stream/SQ-CQ 资源有硬性预算（官方 ACL_Graph stream-budget 章节）。cudagraph 图模式按多尺寸捕获（cudagraph_capture_sizes）时，每张图需要一组 event 资源，捕获数量超出上限 → Create capture event failed / Insufficient_Event_Resources(EL0008) / rtStreamWaitEvent resource alloc fail。310P（Atlas 300I Duo）硬件 event 资源尤其有限；TP 规模大或 PIECEWISE 混合捕获时更易触发。"
  related_signatures:
    - "Insufficient_Event_Resources"
    - "Create capture event failed"
    - "rtStreamWaitEvent execution failed, reason=driver error:resource alloc fail"
    - "Alloc sq cq fail"
