id: ascend-cudagraph-event-resource
type: error-code
title: 507903 / Insufficient_Event_Resources——cudagraph 捕获阶段 event/SQ-CQ 资源不足
summary: 昇腾 NPU cudagraph 图模式捕获时 event/stream/SQ-CQ 资源超硬件预算 → 507903（Insufficient_Event_Resources）或 207005（rtStreamWaitEvent resource alloc fail）；规避：--enforce-eager 或缩小 capture_sizes

