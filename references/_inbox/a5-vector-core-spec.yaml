content:
  claim: "昇腾950 第三代 Vector Core：单核 FP16 和 FP32 的 TFLOPS 较上一版本提升 100%，使 Cube-Vector 融合算子（如 FlashAttention）的非矩阵类操作不再成为性能短板；指令集新增 BF16 原生支持，扩展多种浮点格式转换指令，强化量化与反量化能力；微架构针对 Softmax、GELU 等关键函数优化，提升张量 ALU 利用率；内存架构在 Unified Buffer 与 Vector ALU 之间引入 RegFile 寄存器作为临时存储，提供更高带宽与数据复用。"
  evidence: "白皮书 §4.1.2 VECTOR CORE（PDF p.20-21）：『单核FP16 和FP32 的TFLOPS 较上一版本提升100%』『新增对BF16 的原生支持』『在Unified Buffer 与Vector ALU 之间引入RegFile 寄存器作为临时存储』。已对 PDF 原文核验。"
