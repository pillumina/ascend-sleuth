content:
  claim: "昇腾950 DaVinci Core 采用新同构 SIMD/SIMT 混合编程架构，以 SIMD 为主、SIMT 为辅：大部分向量计算由 SIMD 承担（双发 ALU 指令 + 乱序执行，单指令处理多数据）；SIMT 作为差异化增强特性，面向离散访问（Gather/Scatter）、复杂分支计算（如 Hash Insert）等场景。基本函数块定义为 Vector Function（VF），每个 VF 可选择 SIMD 或 SIMT 方式实现并支持快速切换；规则访存的 element-wise 计算优先 SIMD，不规则/含分支部分用 SIMT。"
  evidence: "白皮书 §4.1（PDF p.17）与 §4.1.3 新同构SIMD/SIMT 混合编程（PDF p.21）：『以SIMD 为主、SIMT 为辅』『SIMT 则作为差异化增强特性，面向离散访问（如Gather/Scatter 操作）、复杂分支计算』『每个VF 可选择以SIMD 或SIMT 方式实现，并支持在两种不同类型VF 之间快速切换』。已对 PDF 原文核验。"
