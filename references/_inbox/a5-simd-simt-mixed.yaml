title: A5 SIMD/SIMT 混合编程架构（SIMD 为主、SIMT 为辅）
summary: 昇腾950 DaVinci Core 采用 SIMD 为主 / SIMT 为辅的混合编程；SIMT 面向离散访问与复杂分支；Vector Function（VF）支持快速切换

