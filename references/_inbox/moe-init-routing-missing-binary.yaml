id: moe-init-routing-missing-binary
type: error-code
title: MoeInitRoutingV3 找不到二进制（errno:561000）——torch-npu 版本不足
summary: A5 上 MoE 路由报 Cannot find binary for op MoeInitRoutingV3 / errno:561000 → torch-npu <2.10.0.post4 的 op-plugin 缺该算子二进制，升级 torch-npu 修复

sources:
  - type: case-derived
    cases: [VLLM-ASC-14166]
    extracted_at: 2026-08-28
    extraction_method: to-reference --ingest-cases

applies_to:
  platforms: [A5-950]
  frameworks: [vllm-ascend]
  categories: [interrupt]

status: draft
last_verified: 2026-08-28

content:
  code: "errno:561000"
  meaning: "torch-npu 2.10.0.post2（及更早）的 op-plugin 未内置 MoeInitRoutingV3 算子二进制，A5 上启动 DSV4-Flash-0731 走 MoE 路由时 kernel 找不到二进制，profile_run 阶段崩溃。升级 torch-npu ≥2.10.0.post4 修复。注意与同算子名的 tiling 错误（expanded_x dim1 should be，VLLM-ASC-11924，MXFP4 形状推断问题）区分——两者根因不同，后者是 dispatch 时量化形状推断错误而非缺二进制。"
  related_signatures:
    - "Cannot find binary for op MoeInitRoutingV3"
    - "launch failed for MoeInitRoutingV3, errno:561000"
