content:
  claim: "昇腾950 集合通信处理引擎 CCU 支持的典型算法：Broadcast、Reduce Scatter、All Gather、All Reduce、All2All、All2Allv。执行模型：集合通信展开为多项并行小颗粒度任务循环执行；软件通过 CCUM（CCU Management）的 Mission 任务接口编程，硬件解析指令后判断执行 Reduce 计算还是 URMA 搬运；CCU Agent（CCUA）集成 MemorySlice 作数据存储、Reduce Unit 作数据计算；URMA 搬运可完成远端到本端 DRAM 或 MemorySlice 的灵活数据搬运；完成后通过 Mission 接口上报状态。"
  evidence: "白皮书 §4.6.4 CCU（PDF p.32-33）：『Broadcast / Reduce Scatter / All Gather / All Reduce / All2All / All2Allv』『CCUM（CCU Management）中的Mission 任务』『CCUA 中集成了MemorySlice 用作数据存储，集成了Reduce Unit 用作数据计算』。已对 PDF 原文核验。"
