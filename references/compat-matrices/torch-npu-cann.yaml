id: torch-npu-cann
type: compat-matrix
title: torch-npu ↔ CANN / torch 版本兼容矩阵（adapter 层）
summary: torch-npu 官方维护的版本对应表（COMPATIBILITY.en.md）：torch-npu 安装包版本 ↔ GitCode 分支 ↔ PyTorch ↔ CANN；当前活跃线以 CANN 9.1.0（26.1.0 分支）/ 9.0.0（26.0.0）为主，旧线对应 CANN 8.5.0 及以下；诊断 torch-npu 相关运行时报错时对照本表判断 CANN 是否越界；上层框架（vllm-ascend 等）的 CANN 兼容由本层传导

