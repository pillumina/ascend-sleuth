id: cann-hdk
type: compat-matrix
title: CANN ↔ Ascend HDK（驱动/固件）版本配套矩阵（base 层）
summary: CANN 官方版本说明声明的配套/兼容 Ascend HDK 版本（release-note 多版本核验，含 beta）：9.1.x 主配 26.0.RC1/26.1.x 且与 25.0.X 不兼容；9.0.x 配 26.0.RC1/25.7.RC1 起；8.5.x 配 25.5.X 起、8.5.2 起可配 26.0.RC1——诊断驱动/固件类报错时对照本表判断 HDK 是否越界；上层的 CANN 兼容由 adapter 层（torch-npu-cann）传导，不在此重复

sources:
  - type: official-doc
    url: https://gitcode.com/cann/release-management (release-notes.md 各版本)
    version: CANN 8.5.0-beta.1 / 8.5.0 / 8.5.2 / 9.0.0-beta.1 / 9.0.0-beta.2 / 9.0.0 / 9.0.1 / 9.1.0-beta.1 / 9.1.0-beta.2 / 9.1.0-beta.3 / 9.1.0 / 9.1.1 / 9.2.0-beta.1 / 9.2.0-beta.2 release-note
    fetched_at: 2026-08-31
    verification: cross-checked-source

applies_to:
  platforms: [cross]
  versions:
    cann: "8.5.0-beta.1 – 9.2.0-beta.2"
    hdk: "25.0.X – 26.1.x"

related_references: [torch-npu-cann]

status: active
last_verified: 2026-08-31

