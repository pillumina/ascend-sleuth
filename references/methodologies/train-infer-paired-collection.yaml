id: train-infer-paired-collection
type: methodology
title: 训推两侧配对采集（开关与窗口 → 配对依据 → 布局对齐 → 配对验证；任一侧漏采即不算交付）
summary: 训推两侧配对采集：配对键是样本身份 + 计算片段 + 权重版本（禁止按目录顺序配），任一侧漏采即不算交付。

