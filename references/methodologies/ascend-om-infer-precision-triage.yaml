id: ascend-om-infer-precision-triage
type: methodology
title: om 离线模型推理精度定位（Dump + 高精度模式对照 → 逐个差异算子 keep_dtype → 关缓存优化/融合规则 → 数据与标杆比对）
summary: "ATC 转换出的 om 离线模型推理精度不达标时的定位路径。先分形态：①**推理结果错误**（整网功能已调通但结果错，如检测网络 MAP 全 0、与标杆比对余弦相似度为 0）；②**推理精度不达标**（单次推理与标杆余弦相似度 95% 以上，但数据集精度差少量，如 Top1 0.90 vs 标杆 0.92、MAP 0.54 vs 0.55）。然后：打开 Dump 开关复现取模型 Dump → 用 ATC 高精度模式（`--precision_mode=allow_fp32_to_fp16`）重新转换并推理再取 Dump 做对照（达标即转『配部分算子保持原始数据类型』以兼顾性能）→ 不达标则**逐个识别差异算子**（首个余弦相似度低于 **0.95** 的算子，一次只处理一个，配该算子 keep_dtype 后重推再取 Dump，循环到无差异算子）→ 仍不达标依次尝试关闭**数据缓存优化**、关闭**融合规则**（两个默认开启的优化；关闭后达标说明命中优化引入的场景，仍需识别问题算子交技术支持，问题解决后建议恢复开启）→ 检查数据处理与配置（数据集/AIPP/后处理）→ 与标杆网络 Dump 比对并把差异算子交技术支持。判据：精度比对工具的 CosineSimilarity 列范围为 [-1,1]，越接近 1 越相近，**大部分算子低于 0.95 即存在精度问题**。"

