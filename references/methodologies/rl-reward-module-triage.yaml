id: rl-reward-module-triage
type: methodology
title: RL Reward 模块定位（按数据集类型定打分方式 → 分数为 0 / 与 GPU 有分差 / 自定义打分）
summary: RL reward 对不齐的分流：先按数据集类型定打分方式与常见对不齐原因（Math 规则打分 / Code 沙箱打分 / 通用理解类模型打分），再按现象走——分数为 0 时用 GPU 推理数据单测打分器、与 GPU 存在分差 GAP 时先对齐 reward model 权重与服务化参数并固定输入（temperature=0）、客户自定义打分直接比对打分逻辑代码与传参

