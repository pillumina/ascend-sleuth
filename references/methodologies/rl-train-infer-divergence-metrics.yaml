id: rl-train-infer-divergence-metrics
type: methodology
title: RL 训推一致性指标判据与三种手段（diff_mean / pearson / KL 阈值 → fp32 升精 / router replay / rollout correction）
summary: RL 训推一致性的指标判据与三种手段：rollout_probs_diff_mean 大于 0.01x 存疑、rollout_actor_probs_pearson_corr 需 0.99x 及以上、|KL| 小于 0.1；手段为训推差异正向定位（fp32 升精）、MoE router replay、rollout correction（IS/RS）

