id: hostbound-evidence-gate
type: methodology
title: Host 侧嫌疑（HostBound）的证据门槛与降级（六项齐全 / 至少两类独立证据 / 最低证据组合与后续动作 / 命名不算证据 / 时钟域 / 缺数据不等于正常）
summary: 怀疑 Host 侧拖慢 NPU 时，先判"这个结论现在能不能下"再往下查：①每条结论必须写全 指标、取值、阈值或基线、证据来源、时间窗、置信度 六项，缺项只能写成待验证假设；②没有至少两类独立证据时输出"证据不足"，CPU 高、中断多、GIL 事件多、Cache Miss 高这四项各自都不能单独判定 HostBound；③每类结论有最低证据组合与对应的后续动作（CPU 饱和、中断或 SQ/CQ、绑核、NUMA、GIL、函数长尾与 PMU）；④`acl_thread`、SQ、CQ、中断名只能用来确定该看谁，不能用来确定是谁慢，IRQ 次数本身不是故障；⑤ftrace / msprof / GIL / PMU 的时钟基准未对齐时只能做相对关联；⑥采集清单要如实记录这次没运行哪些工具，缺数据不等于该项正常；⑦绑核、中断亲和、停 irqbalance 只出方案不出手。

