id: operator-bottleneck-attribution
type: methodology
title: 算子性能瓶颈归因（pipe 分解 → 流水模式 → Bound 分类 → 策略选择）
summary: "把 profiling 的 pipe 数据变成「下一步动哪里」的判据链：先按七列（kernel / mac / scalar / mte1 / mte2 / fixpipe / icache_miss）分解，再用 `vec + mte2 ≈ 100%`（串行）还是 `≫ 100%`（重叠）判断流水是否并行，用主导流水占比 max(vec, mte2, mte3) 定 Bound 类型；主导占比降到约 55% 且 VEC≈MTE2 才是开双缓冲的最佳时机（重叠后目标 ≥80%）；ScalarBound 看 Load/Store 占比是否 >30%（根因是寄存器 Spill）"

