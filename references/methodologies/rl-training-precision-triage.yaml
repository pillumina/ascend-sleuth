id: rl-training-precision-triage
type: methodology
title: RL 训练精度定位（pg_loss / kl_loss / ppo_kl / grad_norm 分流 + 优化特性对齐表）
summary: RL 训练精度（GPU 对照 NPU）的分流：前提是打桩输入相同推理结果、训练配置一致、固定随机性（SkipRollout 缓存并复用已生成序列）；按现象归到 pg_loss 差异、首步 kl_loss 非零、ppo_kl 量级差异、grad_norm 对不齐四类，各自采集对应阶段数据比对；不稳定复现查多流内存踩踏；优化特性按历史经验表逐项对齐

