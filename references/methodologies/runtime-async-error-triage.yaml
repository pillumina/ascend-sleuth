id: runtime-async-error-triage
type: methodology
title: Runtime 异步错误定位（异步错误会延迟传播与覆盖 → 立即同步取首错 + 遇错即停/分段标记）
summary: "Runtime 异步接口（aclrtMemcpyAsync、Kernel Launch 等）返回成功只代表 Host 侧参数校验与任务下发成功，Device 侧执行错误会**延迟到后续某个接口调用才返回**——于是报错的接口往往不是出错的接口；遇错继续模式下后发生的错误还会**覆盖**先前的错误信息，导致拿不到首错。定位路径：下发后立即用 aclrtSynchronizeStream / aclrtSynchronizeDevice 取真实错误码 → 用 aclrtPeekAtLastError（查看不重置）或 aclrtGetLastError 加 aclGetRecentErrMsg() 取详细描述 → 对长任务序列用「分段同步 / 插入 Event 标记边界 / 插入 Host 回调」把失败任务夹出来 → 用 aclrtSetStreamFailureMode(stream, ACL_STOP_ON_FAILURE) 让首个错误即停（必要时临时切遇错继续以收集更多信息，权衡是现场保护 vs 信息量）→ 结合 plog 中的失败 task/错误码/异常详情定位。"

