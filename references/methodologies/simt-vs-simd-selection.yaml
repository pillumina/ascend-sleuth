id: simt-vs-simd-selection
type: methodology
title: SIMT / SIMD 与 MemBase / RegBase 的选型判据（标量受限时先试纯 SIMT）
summary: "选型不是偏好问题，按判据走：①出现**逐元素标量循环把算子锁在 Scalar 引擎**（`aiv_scalar_ratio≈0.999` 且 `aiv_vec_ratio≈0`）时，改纯 SIMT（grid-stride）是首选，实测主 Bound 切到 Vector、收益可达数十倍；②但纯 SIMT 在 **bins 超出 UB 容量**时会退到 GM 原子累加、代价极高，且 `innerDim` 大时 MTE+SIMD 更合适；③需要精细流水线控制时用 `__aicore__` + `__simt_vf__` 混合；④RegBase（`__simd_vf__`）用于消除 UB 往返，前提是尾块用 MaskReg、VF 内少用单发指令与 Membar"

