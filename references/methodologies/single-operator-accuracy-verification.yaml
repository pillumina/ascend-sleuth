content:
  flow:
    - step: 1
      name: 界定验证对象与判据
      action: >-
        从整网比对结果里挑出待验证的**算子**（不是模块）——只有能独立运行的 API 级算子可自动验证，Module 级不行。
        判据固定为三条同时成立：shape 一致、`max_diff < atol`、`max_rel_err < rtol × 100`。
        同时想清楚这次验证要回答什么：是"确认这个算子就是引入点"，还是"排除它"。
      check: "待验算子清单 + 判据三条"
      when_to_use: 整网比对已标出可疑算子之后
    - step: 2
      name: 按 dtype 取容差
      action: >-
        用内置的 dtype 自适应容差，不要手填：float64 `atol 1e-9 / rtol 1e-7`；float32 `1e-4 / 1e-3`；
        float16 `1e-3 / 1e-3`；bfloat16 `5e-3 / 5e-3`。取的是保守值，归约类（matmul 等）的正常累加差异由 rtol 兜底。
      check: "每个待验算子的 dtype 与对应容差"
      when_to_use: 验证前
    - step: 3
      name: 构造同输入并过质量门
      action: >-
        造一份输入同时喂给两侧。退化处理：`l2norm < 1e-30` 的近零向量直接填均值；分布区间极窄（`β − α ≤ 1e-15`）
        退化为均匀分布。构造完过两个质量门：**`l2norm` 相对偏差 < 5%**、**被 clamp 元素比例 < 10%**——
        任一越界标 `construct_degraded`，并把这次验证的结论降级。
      check: "构造统计量（目标 vs 实际 l2norm、clamp 比例）+ 是否降级"
      when_to_use: 验证执行前
    - step: 4
      name: 两侧各跑一次并读结果
      action: >-
        同输入在两侧各跑一次，读结果字段：shape 是否一致、`max_diff`、`max_rel_err`（逐元素最大相对误差百分比）、
        `mean_rel_err`（平均相对误差百分比）。**shape 不一致直接判不通过**（不比数值）。
      check: "四个字段的读数 + 通过与否"
      when_to_use: 验证执行后
    - step: 5
      name: 结论分三档并声明边界
      action: >-
        结论分"**已排除**"（该算子在此输入下一致）/"**已确认**"（差异可复现且超容差）/"**因构造降级不可用**"三档。
        两条边界必须写：① 构造降级的结论不得当作确认证据；② **验证通过不等于整网那条链路没问题**——
        整网误差可能来自上游累积，那属于首问题点判定的范畴（见 precision-first-divergence-triage），
        不要用单算子通过来推翻整网结论。
      check: "每条结论归属哪一档 + 两条边界声明"
      when_to_use: 输出验证结论时
