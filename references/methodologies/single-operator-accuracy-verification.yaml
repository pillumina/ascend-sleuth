id: single-operator-accuracy-verification
type: methodology
title: 单算子精度验证流程（定算子与判据 → 按 dtype 取容差 → 构造同输入 → 两侧各跑 → 读结果并标降级）
summary: 把『怀疑某算子』变成『能自己验』的五步流程，含容差取法与构造降级的边界。

