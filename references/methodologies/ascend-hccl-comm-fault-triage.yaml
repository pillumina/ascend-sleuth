id: ascend-hccl-comm-fault-triage
type: methodology
title: HCCL 集合通信故障定位（故障码/多级关键字分流三阶段 → 全量日志 → 根节点定位）
summary: "多机 HCCL 报错的标准定位路径：①先确认是 HCCL 的问题（打屏日志出现 `EI****`/`EJ****` 故障码，或 CANN 日志中有 HCCL 组件 ERROR）——CANN 日志里没有 HCCL 报错时不要套用本流程，转查其他组件、脚本、core dump 或进程卡住；②收集**全量节点**的 debug+run 日志（报错 rank 常常只是在等对端超时）；③用多级检索关键字 `InitGroupStage`/`InitChannelStage`/`TaskExecStage` 判定报错阶段（通信域初始化 / 参数面建链 / 算子执行，CANN 8.5.0 起支持），再进入对应故障表；④报错点不等于根节点——建链阶段沿算子依赖链向前找到**最早失败的 rank 对**，执行阶段靠集群心跳 `HeartbeatAbnormal` 与 task exception 信息定位根节点；⑤参数一致性校验与 `HCCL_ENTRY_LOG_ENABLE` 负责「各 rank 行为不一致」这一类。故障码为 `EI9999` 或无故障码时按少见场景处理，基于实际日志与源码分析，不做模式化外推。"

