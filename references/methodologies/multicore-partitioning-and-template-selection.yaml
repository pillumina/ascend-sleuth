id: multicore-partitioning-and-template-selection
type: methodology
title: 多核切分优先原则与算子模板/Bound 策略选择表
summary: "性能优化的第一动作是**查并行度**：来源实例中把只跑 1 个 Block（其余 63 个 Vector Core 空闲）改成按行切到 64 核，使 6790 → 113.6 µs（59.8x），占整条优化链 157x 的绝大部分，且判据是**各类 ratio 基本不变**（说明收益来自并行度而非单核实现变化）。定位到 Bound 类型后再按策略表选模板：Cube Bound → SWAT + 尾轮负载均衡；MTE2 Bound → StreamK（非量化）或全载 + Scale 缓存（MX）；FIXPIPE Bound → UnitFlag；流水停顿 → Double Buffer"

