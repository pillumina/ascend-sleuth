id: operator-tuning-experiment-method
type: methodology
title: 算子性能实验方法（精度门禁 → 不可变基线 → 单变量迭代 → 前后对照判定；含否证条款）
summary: 要给算子做性能改动时的实验纪律。**前置门禁**：精度未过、崩溃或 kernel 挂起 → **停止性能调优**（不是先记下来继续）——先修正确性再谈速度；任一目标用例失败即停。**第 1 步建不可变基线**：同软件栈、同 SoC、同频率、同 shape/dtype、同 TilingKey 下取稳态多次的中位耗时，并记下采集方式（event / simulator / msprof 等口径不可混）。**第 2 步采集证据**：先有证据再谈假设——**不得先加载案例猜瓶颈**；`bound_analyzer.py` 的结论只作初筛，终结论必须带"Bound + 反证 + 置信度 + 缺失指标"四件。**第 3 步选同型机制**：从同类案例里挑**不超过 3 个**候选机制，一次只改一个（改多个无关机制的对照无归因价值）。**第 4 步单变量迭代**：每轮改动走精度门禁 + 保留回滚点；**劣化或噪声带内的收益不得只报喜不报忧**。**第 5 步前后对照**：用统一的对照表（基线/优化后/Δ%/加速比），加速比 > 1.05 才算可复测提升、≥ 0.95 视为噪声带内无稳定收益、< 0.95 应回滚；**只展示最快样本、只展示提升的 case、跨栈/跨 SoC/跨 shape 比较都是禁止动作**。短 kernel 不得用插桩耗时替代 event 基线；精度容差只能来自工程现有测试，**禁止自创容差**。

