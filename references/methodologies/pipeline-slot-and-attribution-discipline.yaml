content:
  flow:
    - step: 1
      action: "**先缩短中间数据的搬运路径，再增加同时在途的 item 数量**——顺序不能反：路径没缩短时加在途只会让搬运与等待互相挤"
      check: "先确认中间结果是否还在反复落 UB/GM（UB 往返的判据见 regbase 词条的 RVECLD/RVECST 比）"
    - step: 2
      action: "**查双缓冲要分三层看**：CV 核间槽 / AIC 内的 L0 / task I/O——**任意一层还在复用单槽**，都能把前后阶段重新串起来，表现为「已经开了双缓冲但仍无重叠」"
      check: "三层逐个确认都在交替使用（不是只看其中一层）"
    - step: 3
      action: "**预发射（增加在途 item 数）只增加重叠机会，不能缩短阶段本身**：Vector 路径过长时必须直接优化 Vector，而不是继续加深流水"
      check: "更多在途 item 会占用更多片上 SRAM；当新 item 已无法覆盖原有等待区间时，继续加预发射数还可能**增加槽位复用等待**（边际收益转负）"
    - step: 4
      action: "**归因口径三条硬约束**：①用**整卡峰值**做 MFU 分母时，**未参与计算的核也计入分母**（只启动 1 个 AIC 的版本 MFU 因此极低，但可与多核版本直接比较）；实际 tile 利用率与有效 MFU 要分开看。②并行 Pipe 的忙碌时长**不能直接相加**成 kernel 时间（CANN 9.2 PipeTimeline 口径）——相加会得到「kernel 受限于某单一 Pipe」这类站不住的结论。③**真机耗时、PipeTimeline、仿真周期三类数据的规格与用途不同，数值不可直接换算或合并**，仿真周期不能替代真机耗时"
      check: "归因前先钉住：分母口径（整卡峰值）＋不把 Pipe active 相加＋不混用三类数据"
    - step: 5
      action: "**版本相邻 ≠ 只改了一个变量**：比较两版性能前，先确认预发射数、L0C 槽数、Vector 通路三者是否一致——否则会把多个变量的效果记成单一优化的收益"
      check: "来源实例中某两版只差一个参数却只有 0.08% 变化，正是这样被识别为「不是该变量的功劳」"
  verified_by_testing: "来源给出 1C2V kernel 的多版本对照（含只启动 1 个 AIC 的 MFU 与多核版本）；判据与纪律可复用，具体数值绑定样例"
