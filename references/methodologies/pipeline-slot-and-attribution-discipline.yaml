id: pipeline-slot-and-attribution-discipline
type: methodology
title: 流水空泡归因纪律（四层槽位检查顺序 / 预发射的边际收益 / 三类数据不可换算）
summary: "分析 CV 协作 kernel 的流水空泡时按固定顺序查：①先缩短中间数据搬运路径，再增加在途 item 数；②查双缓冲要**分开看 CV 核间槽 / AIC 内 L0 / task I/O 三层**——任一层还在复用单槽就能把前后阶段重新串起来；③加预发射数只能增加重叠机会、**不能缩短 Vector 自身**。配套三条归因口径：MFU 用整卡峰值做分母（未用核也计入）、并行 Pipe 的 active **不可相加**成 kernel 时间、真机/PipeTimeline/仿真三类数据不可换算"

