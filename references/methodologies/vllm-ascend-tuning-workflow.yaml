id: vllm-ascend-tuning-workflow
type: methodology
title: vLLM-Ascend 推理性能调优流程（目标先行 / 基准配置 / 并行策略 / 环境变量时滞检查）
summary: vLLM-Ascend 性能调优按固定相位走。先定目标与基准配置，再并行策略、环境、编译、OS、torch_npu、CANN/HCCL、vLLM 参数、加速特性、PD 分离（prefill/decode 分池），最后 vllm bench 验证。

