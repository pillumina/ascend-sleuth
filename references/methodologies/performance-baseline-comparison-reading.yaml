id: performance-baseline-comparison-reading
type: methodology
title: 性能基准对照的读法（可比性、绝对差值和变化率）
summary: 比较性能时先核对基准、对比对象和统计范围，再核对单位、原值和差值。大倍数先看绝对量，缺失读数保持未知。根据已核实的范围判断能否归因。

