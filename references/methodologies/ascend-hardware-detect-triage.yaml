id: ascend-hardware-detect-triage
type: methodology
title: 硬件与压力检测判读（asys diagnose 四模式 → Pass/Warn/Fail → [ERROR] AML 错误码前缀分流 → 电压恢复）
summary: "怀疑硬件问题（或精度/中断问题排查到硬件层）时的检测与判读路径：①按目的选检测类型——综合检测（stress_detect 压力 / hbm_detect / cpu_detect / aicore_stl_detect，**须物理机 + root**，Atlas 200I/500 A2 推理、Atlas 推理系列、Atlas 训练系列不支持）与组件检测（仅 AI Vector、不支持并行）；②跑检测：stress_detect 需环境预装算子二进制包 `Ascend-cann-*-ops-*.run`，hbm/cpu 支持 `--timeout`（默认 600 秒，hbm 取值 [0,604800]、0 表示只跑一轮；cpu 取值 [1,604800]），aicore_stl_detect 仅 Ascend 950PR/950DT；③判读结果：Pass 正常、Warn 异常、Fail 硬件故障需联系技术支持；多 device 结果不一致时逐个列出（一致时显示 Pass-All/Warn-All/Fail-All）；④Warn 按 `[ERROR] AML` 日志里的错误码前缀分流——**1** 用例执行/任务下发失败、**2** 精度比对失败、**3** 硬件问题（压力检测）、**4** 硬件问题（HBM 检测）；⑤压测电压保护：stress_detect 会调整 device 侧电压，异常退出可能不自动恢复，检测前后用 asys config 获取/恢复；⑥HBM 检测返回数值 >0 表示检测后新增的 ECC 错误个数（用于提前激发风险地址报错并隔离）。"

