id: slime-framework-debug-and-divergence
type: methodology
title: Slime 框架定位（训推分离架构 → 自带 DEBUG 开关 → 数据采集面 → 与 verl 的差异点）
summary: Slime 训推分离 RL 框架（SGLang 采样 / Megatron 训练 / Ray 调度，每轮 rollout 结束经 update_weights 把权重同步回推理引擎）的定位：自带五类 DEBUG 开关（数据缓存复用、训练数据留存、单推调试、权重一致性核对、细节 dump）；与 verl 比对前先处理两处差异（dynamic_bsz、grpo 的 dual_clip）

