id: profiler-breakdown-method
type: methodology
title: 性能数据逐级拆解（端到端→阶段→step→层的守恒自检、异常与漂移判据、置信度分级）
summary: 把 profiling 拆成『哪一级吃掉时间』的流程，带守恒自检、异常与漂移阈值、置信度分级。
