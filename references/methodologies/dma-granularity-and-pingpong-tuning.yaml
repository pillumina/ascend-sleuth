id: dma-granularity-and-pingpong-tuning
type: methodology
title: 搬运耗时压不动时的调参顺序（先保 ping-pong 重叠，再加大单次 DMA）
summary: "当 mte2/mte3 耗时在多个优化步骤后几乎不动（看着像「不可压缩的搬运底座」）时，先怀疑 **16KB 级小 DMA 的 ramp-up 损耗**没吃满带宽；手段是把单次 DMA 从 16KB 加到 32KB（实测 mte2 3.02→2.00µs、mte3 1.15→0.82µs）。但调参顺序有硬约束：**ping-pong 重叠（≥2 tile）比 DMA 尺寸更重要**——单缓冲下即使 DMA 最大（64KB）也最慢"

sources:
  - type: official-doc
    url: "https://gitcode.com/cann/cann-samples/blob/master/Samples/2_Performance/softmax_regbase_story/README.md"
    version: "cann-samples master（小 DMA ramp-up 实验；自述 Ascend 950）"
