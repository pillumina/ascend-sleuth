id: verl-ascend-startup-triage
type: methodology
title: verl + 昇腾训练启动/运行失败的版本配置组合判别
summary: verl+昇腾部署训练启动或运行失败（HCCL 初始化错误/算子崩溃/模型 patch 失败/设备检测与注册）时，先按日志签名判别错误面，再沿版本配置矩阵（verl/transformers/CANN/HDK/镜像）收敛——6 条 VERL case 的先验共性：这类问题的 fix 几乎都不是用户代码，而是版本或配置调整
sources:
- type: case-derived
  cases: [VERL-5074, VERL-6608, VERL-6885, VERL-6707, VERL-6756, VERL-6741]
  extracted_at: '2026-08-31'
  extraction_method: to-reference --ingest-cases
applies_to:
  frameworks: [verl]
  categories: [interrupt]
related_references:
- hccl-error-codes
status: draft
last_verified: '2026-08-31'
content:
  flow:
  - step: 1
    name: 判别错误面
    action: 按日志签名分面——HCCL 通信初始化（hcclCommInitRootInfoConfig）、算子崩溃（aclnn\w+）、模型 patch（npu_patch/Qwen3Moe）、设备注册（CPU-only actor）、设备检测（get_npu_versions）
    check: "grep -E 'hcclCommInit|aclnn\\w+|npu_patch|CPU-only actor|get_npu_versions' {{log_path}}"
    when_to_use: verl+昇腾 GRPO/PPO 训练启动或运行中失败
  - step: 2
    name: HCCL 初始化错误码判别
    action: hcclCommInitRootInfoConfig error code 5 = verl runtime_env.yaml 端口 range "auto" 配置问题（删行或改显式端口段）；error code 7 = HDK 版本组合不兼容（更换兼容 HDK）
    check: "grep 'error code is [57]' {{log_path}}"
    when_to_use: ray 拉起阶段（WorkerDict/vLLMWorker）报 create_config 错误；两码同函数不同根因面，见 hccl-error-codes 表
  - step: 3
    name: 算子崩溃转 CANN/镜像版本判别
    action: aclnn 算子崩溃（如 ConvolutionBackwardGetWorkspaceSize）多为 CANN/镜像版本组合问题——升级更新官方镜像（如 verl 9.0.0 / CANN 9.0）验证
    check: "grep 'aclnn\\w+' {{log_path}}"
  - step: 4
    name: 模型 patch 失败转 transformers 版本判别
    action: verl npu_patch 按 Transformers 4.57 编写，5.x 下 Qwen3MoeSparseMoeBlock 接口不兼容（gate 变 router module）——升级 verl（含 PR 6708）或降级 transformers 4.57
    check: "grep -iE 'Qwen3Moe|npu_patch|fused kernel' {{log_path}}"
  - step: 5
    name: 设备检测/注册问题转 verl 版本与 device 配置判别
    action: get_npu_versions() 硬编码 device ID（≤0.7.1，PR 6043 修复——升级 verl）；CPU-only actor warning（PlatformNPU registered but not available）——配置 trainer.device='npu' 并确认 verl 版本
    check: "grep -E 'CPU-only actor|registered but not available|get_npu_versions' {{log_path}}"
  - step: 6
    name: 收敛：版本配置矩阵对齐
    action: 六条 case 共性——verl+昇腾启动失败的 fix 几乎都不是用户代码：先对齐版本矩阵（verl/transformers/CANN/HDK/镜像），再排查配置；根因置信标注：5074/6608/6885/6707/6756 根因定论（medium/high），6741 仅配置方向（low，未代码级定论）
    note: 错误面相同不等于根因相同（如 HCCL error code 5 vs 7）；同函数不同错误码要按码分根因，勿混为一谈
