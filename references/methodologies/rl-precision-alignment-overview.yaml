id: rl-precision-alignment-overview
type: methodology
title: RL 精度对齐总体定位流程（指标口径 → 前置 CheckList → 首步 bad case → 训练/训推分流 → 长跑异象）
summary: RL 训练与推理精度对齐（GPU 对照 NPU）的总体流程：先约定八项指标口径，再做前置 CheckList（环境与三方库版本、权重与数据集 MD5、关 shuffle、balance_batch 与超长处理两边一致、固定随机数、日志参数一键比对），再按纯服务化推理 → 首步 bad case → RL 场景指标判据 → 训练块与训推一致性分流 → 长跑异象逐段收窄

