id: precision-first-divergence-triage
type: methodology
title: 精度比对判读流程（阈值先定 → 首问题点三关 → 传播分类与溯源 → 参数梯度独立评估 → 多指标交叉收敛）
summary: 拿到逐算子比对结果后的判读路径。**第 0 步先定阈值**——不要凭经验拍，用自适应级联从数据分布算（见 precision-threshold-cascade）：SICD 变点 → 锚定回溯 → Delta-NRE 离群 → 分布间隙 → 兜底，全程钳制 [0.1%, 100%]。**第 1 步按执行序找首个 output 超标的节点**（超标 = NRE ≥ 阈值 或 MeanBias ≥ 1.2 × 阈值）。**第 2 步过三关确认首问题点**：输入继承检查（与某个 input 四维一致 → 跳过）、下游吸收检查（下游 500 行内回到阈值以下 → 跳过）、继续向后找首个既不继承也不被吸收的节点；换了首问题点必须记录跳过过程。**第 3 步分类与溯源**：按四模式定标签（引入/放大/穿越/被吸收），对继承的节点按 NRE + dtype + MeanRE + MaxRE 四维一致向上**循环**追溯——**禁止找到第一个上游就停**，一直追到引入点或数据边界，追不到就如实写"数据覆盖不足"。**第 4 步参数梯度独立评估**（三档继承性对照，含 `parameters_grad` 的算子豁免吸收检查）。**第 5 步多指标交叉收敛**：每用一个指标确认后必须用其余指标再探更早的分叉点，直到都指向同一个最前分叉点，分歧时按"最先开始偏离"的指标为准并注明分歧。**收尾纪律**：报告里写"已排除"比写"已确认根因"更可信——可确认的是排除项，不是根因；分析范围（上下游各 500 行）与未对齐层要显式列出。
