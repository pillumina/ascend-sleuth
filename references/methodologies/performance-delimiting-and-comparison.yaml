id: performance-delimiting-and-comparison
type: methodology
title: 性能问题的定界顺序与有基线时的对比判据（先定方向再下钻 / 贡献度显著性门控 / 有效吞吐 / 集中度 / 单位与汇总行纪律）
summary: 拿到性能数据（一份或两份）后按固定顺序走：①先把端到端或 step 耗时拆成计算、通信未掩盖、空闲三块，只定方向不下钻，通信再分等待与传输；②按变多的那一块走对应路径，其中通信算子逐个没变慢而通信未掩盖耗时涨了，说明重叠变差（并行度问题），改去看同步点与重叠关系；③有基线时先过显著性门控再算贡献度，门控只对集群对比的 Stage 差异这一项成立，判不过时贡献度降级为"—"，给得出时要写明它是占变化量的比例、可超 100% 也可为负；④比带宽看有效吞吐（总传输量除以总传输时间），均值降而吞吐平属于统计方式差异；⑤看前 10 项劣化占全部劣化的比例判断集中还是分散；⑥区分调用次数变了还是单次变慢，两者诊断方向不同；⑦单位各表不一、通信明细里有 Total 汇总行、`hcom_` 前缀算子不进计算负载均衡分析、产物标注非最小采集时绝对值不可信；⑧整体改善也要列出劣化项，通信算子里比值小于 0.1 且基线总耗时超过 1000 微秒的项通常是策略变化，要确认是预期行为。

