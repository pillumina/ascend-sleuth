content:
  flow:
    - step: 1
      name: 先定方向，不下钻
      action: >-
        把端到端或 step 耗时拆成三块：计算耗时、通信未掩盖耗时、空闲耗时，通信那一块再分等待与传输。
        先只看哪一块变多、变多少。定方向之前不要翻算子明细：明细会给出几十行"变慢了"，没有方向就判断不出哪一行值得追。
        只有一份数据时同样先做这一步，用占比判断瓶颈方向。
      check: 三块的绝对值与占比；变的是哪一块
      when_to_use: 拿到 step 级或端到端级数据的第一步

    - step: 2
      name: 按变化的那一块走对应路径
      action: >-
        计算变多，走算子到模块到 Kernel 的逐层下钻：先用算子统计找集中的劣化项，再进 Kernel 明细看调用次数、
        Kernel 拆分数和输入 shape 是否变了。通信变多，先分是等待还是传输，等待偏多查同步与阻塞，传输偏多查链路与带宽。
        这里有一个容易走岔的分支：逐个通信算子都没变慢，而通信未掩盖耗时涨了，说明通信与计算的重叠变差
        （并行度问题），此时不要去调通信算子，改看同步点是否增多、下发与计算是否被串起来、流水线是否被切成更多段。
        空闲变多，查 Host 下发与流水线气泡，不要在通信和计算里继续找。
      check: 下钻路径与第 1 步定出的方向一致；通信算子级差异与通信未掩盖耗时差异背离时是否已改判为并行度问题
      when_to_use: 方向已定之后

    - step: 3
      name: 有基线时先过显著性门控再算贡献度
      action: >-
        贡献度等于分项变化量除以总变化量。这个门控的适用范围是集群对比里的 Stage 差异这一项，其余指标不套用它，
        按各自的比值判断。总变化量的相对幅度不到 1% 时分项正负相抵，比值会算出远超 100% 甚至为负的数
        （源码注释里给出的例子是 368.5% 与 -123.4%），此时不可解释，贡献度降级为"—"并写明为什么不给。
        给得出时也要写清含义是"占变化量的比例"，不是"占总时间的比例"，可以超过 100%、也可以为负。
      check: 总变化相对幅度是否达到 1%；贡献度旁是否带语义说明；被门控时是否写明原因
      when_to_use: 同时拿到基准与对比两份数据、准备做归因时

    - step: 4
      name: 带宽比的是有效吞吐，不是均值
      action: >-
        逐算子的平均带宽对包大小分布敏感：大包少、小包多的时候均值会明显偏低，与链路好坏无关。
        跨环境或跨版本比带宽要用有效吞吐，算法是总传输量除以总传输时间（或平均包大小除以平均传输时间）。
        均值下降而有效吞吐持平，判为统计方式差异，不作为链路劣化的依据；有效吞吐同时下降才算真实劣化，
        经验分界是下降 5% 算轻微、15% 算严重，这两个数是排序用的经验值。
      check: 是否同时给出均值口径与有效吞吐口径；两种口径背离时结论是否已改判为统计方式差异
      when_to_use: 结论里出现带宽变化、或需要判断链路是否劣化时

    - step: 5
      name: 劣化集中在少数项还是散在很多项
      action: >-
        把劣化量按算子（或模块）降序排列，看前 10 项占全部劣化量的比例。占比高说明问题集中在少数算子，
        按那几项继续往下查；占比低说明劣化散在很多算子，是系统性的（版本、编译策略、数据布局、并行度），
        继续抠单个算子收益有限，应当换方向。经验分界：八成以上算集中，五成以下算分散，中间区间按其他证据判断；
        这两个数同样只是排序用的经验值。
      check: 前 10 项劣化量除以总劣化量；结论是否指向下一步动作
      when_to_use: 定位阶段收尾、决定继续下钻还是换方向时

    - step: 6
      name: 分清次数变了还是单次变慢
      action: >-
        同一个算子，调用次数不变而平均单次耗时涨，是单次执行效率下降，查实现与编译；
        次数涨而单次耗时不变，是执行路径变了（多调了一次或拆成了多个 Kernel），查模型结构与调度。
        两者诊断方向不同，要分开写，不能合成一句"这个算子变慢了"。执行路径变过时，先确认这份基线还适不适合当基准：
        路径不同的两份数据做逐算子对比，排出来的劣化顺序会误导下一步。
      check: 调用次数比值与平均单次耗时比值是否分别给出
      when_to_use: 发现某个算子劣化、准备下钻到 Kernel 时

    - step: 7
      name: 读数字的四条纪律
      action: >-
        ①单位不一致：同一批产物里各表单位不同（总体与模块统计常用毫秒，算子与 Kernel 明细常用微秒，
        内存统计在 MB 与 KB 之间），换算只在报告层做一次并标注单位，一张表里只用一种单位。
        ②汇总行：通信时间与带宽明细里的 Total 行是合计，进排名和进 Top 统计前必须剔除。
        ③通信与计算混排：通信算子不进计算算子的负载均衡分析，通信等待由网络与同步决定，反映不了计算负载不均。
        ④采集告警：产物标注等同于非最小采集时，绝对耗时被采集开销撑大，此时只看比率，绝对值不引用。
      check: 换算式与单位标注、Total 行是否剔除、通信算子是否分离、采集告警是否已按比率口径处理
      when_to_use: 读任何一份性能对比产物时

    - step: 8
      name: 改善里也要找劣化，极端改善要确认是预期
      action: >-
        整体变好不等于每项都变好。改善最大的项与劣化最大的项都要给出，只看改善会漏掉"总量变好但某个算子或某类搬运明显变差"
        这类会被回退的部分。另一条独立判断：通信算子里比值小于 0.1 且基线总耗时超过 1000 微秒的项，
        通常意味着策略换了（同步切异步、通信被融合掉），要确认这是预期行为；基线总耗时不到 1000 微秒的项不套用这条，
        那个量级上的比值波动是噪声。
      check: 报告里改善与劣化是否同时列出；极端改善项是否给出了"是否预期"的判断，且基线量级够大
      when_to_use: 结论收尾时
