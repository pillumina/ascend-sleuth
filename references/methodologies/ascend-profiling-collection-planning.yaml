id: ascend-profiling-collection-planning
type: methodology
title: 性能采集方案选择与前置约束（msprof 命令行/延迟/动态/接口/环境变量 → 前置检查 → 落盘规格 → 动态采集 launch vs attach）
summary: "采性能数据前的规划路径：①**选采集方式**——msprof 命令行（推荐在命令末尾直接跟用户程序；也可用 `--application`）、延迟采集（`--delay`/`--duration`）、动态采集（`--dynamic=on`，launch 或 attach）、其他方式（acl C&C++ 接口 / Ascend Graph 接口 / acl.json 配置 / PROFILING_MODE+PROFILING_OPTIONS 环境变量，后者仅 TensorFlow 训练与在线推理）；②**前置检查**——用普通用户（不建议 root）、umask ≥ 0027、数据目录不含软链接、装齐 CANN 与驱动并 source set_env.sh、Python ≥ 3.7.5、msprof 在 `${INSTALL_DIR}/tools/profiler/bin`，且**不要在采集窗口内同时开 Dump**（Dump 影响系统性能，采集指标会不准）；③**并发约束**——同一 Device 不支持同时拉起多个采集任务、也不可同时开启两种及以上采集方式（例：msprof 命令行启动后 app 内再走 acl 接口）；Ascend 950PR/950DT 例外（同 Device 可并发多个 task-time 采集，aic-mode=task-based 时可并发多个 aic-metrics）；④**落盘准备**——采集时间建议 ≤5 分钟，预留 ≥20 倍原始数据大小的磁盘与内存；单 Device 推理磁盘读写 ≥50MB/s、训练 ≥60MB/s，多 Device 按单 Device 规格 × Device 数；用 `--storage-limit` 防占满（未配置时磁盘可用 <20MB 就不落盘）；⑤**动态采集选型**——msprof 拉起的进程即用卡业务进程时用 launch；`--application` 拉起的是脚本（脚本内部才拉业务进程）、多卡/集群、进程后台执行、或业务在容器内启动时改用 attach（attach 需先 `PROFILING_MODE=dynamic` 再启业务）；⑥**PID 获取与静态约束**（物理机/特权容器/非特权容器三种取法；多 Device 建议逐卡运行逐个取；暂不支持同时指定多 PID）；⑦**需要 Host 侧 disk/osrt 数据时的权限准备与收尾**（iotop/perf/ltrace + perf_event_paranoid + sudoers 授权，采集完必须清除 sudo 权限）。"

