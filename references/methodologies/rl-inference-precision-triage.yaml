id: rl-inference-precision-triage
type: methodology
title: RL 推理精度定位（纯服务化 / RL 场景乱码 / 长跑异象，含 Resharding 组合定界）
summary: RL 推理精度问题的三形态分流：先按现象归形态（纯服务化推理乱码 / 纯服务化正常但 RL 场景乱码 / 长跑才有的异象），再各走一条路——dump 精准定位与 GPU 复测、对齐服务化参数后用 dummy 与 safetensors+skip_update_weight 组合定界 Resharding、单步权重纯服务化回放区分训歪与 kvcache 问题

