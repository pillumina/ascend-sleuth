content:
  claim: "昇腾950PR 单芯片提供最高 128GB 容量、1.6TB/s 带宽的高速片上内存（衍生规格 112GB / 1.4TB/s）；主要面向高性能推荐系统、LLM Prefill（预填充）阶段及多模态推理场景，兼顾高吞吐与低延迟。"
  evidence: "白皮书 §2 引言（p.8）、§3 架构概述（p.10）与表 3-1 规格表（p.13-14）：『昇腾950PR：配备128GB、1.6TB/s 高速片上内存』『Memory 容量（GB）128/112，带宽 1.6/1.4』"
