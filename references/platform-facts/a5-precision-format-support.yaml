content:
  claim: "昇腾950 系列全面支持 TF32、FP16、BF16、FP8、MXFP8、HiF8、INT8 及 MXFP4 等多种精度格式，其中 MXFP4/MXFP8/HiF8 为原生新增的低精度格式（针对 Transformer 训练推理与 FlashAttention 等算子做了专项优化）。"
  evidence: "白皮书 §2（p.8）：『原生支持MXFP4/MXFP8 和 HiF8』；§3（p.10）：『该架构全面支持TF32、FP16、BF16、FP8、MXFP8、HiF8、INT8 及MXFP4 等多种精度格式』。已对 PDF 第 8-14 页原文核验。"
