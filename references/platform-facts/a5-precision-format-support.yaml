id: a5-precision-format-support
type: platform-fact
title: A5 精度格式支持（原生 MXFP4/MXFP8/HiF8，另含 FP8/INT8/TF32/FP16/BF16）
summary: 昇腾950 系列原生支持 MXFP4/MXFP8/HiF8 低精度格式，全面支持 FP8/INT8/TF32/FP16/BF16

sources:
  - type: official-doc
    url: "昇腾950 NPU 架构白皮书（华为技术有限公司），本地归档 ~/ascend/昇腾950 NPU架构白皮书.pdf"
    version: "2026-06-04（PDF metadata creationDate）"
    fetched_at: 2026-08-28

