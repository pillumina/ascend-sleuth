content:
  claim: "昇腾950 灵衢互联系统 Unified Bus 2.0：72× 最高 112Gbps 速率 HiLink（分 18 个 Port），基于新一代 HiLink SerDes 单芯片互联带宽峰值 2TB/s；支持 URMA（异步内存拷贝与消息语义）、UB Memory（Load/Store/Atomic 同步语义，最高 128TB Host-Device 及 Device-Device 内存共享访问）、PCIe 5.0 x16（EP/RC 双模式，向下兼容 GEN4/3/2/1）、2×400Gbps UBoE（UB over Ethernet，支持 1x4/2x2 Port Bifurcation）；Scale-up（芯片间）与 Scale-out（节点间）端口可灵活复用。"
  evidence: "白皮书 §3 互联组网（p.11-12）与 §3 完整规格（p.13）：『72x 最高支持112Gbps 速率的HiLink，分为18 个Port』『单芯片互联带宽高达2TB/s』『支持PCIe 5.0 x16（兼容EP/RC 双模式）』『支持2*400Gbps UBoE』"
