title: A5 灵衢 Unified Bus 2.0 互联（2TB/s，URMA/UB Memory/PCIe 5.0/UBoE）
summary: 昇腾950 单芯片互联带宽 2TB/s：72×HiLink(112Gbps)/18 Port，URMA 异步拷贝、UB Memory 同步语义、PCIe 5.0 x16 双模式、2×400Gbps UBoE

