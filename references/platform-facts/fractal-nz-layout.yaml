id: fractal-nz-layout
type: platform-fact
title: FRACTAL_NZ 分形排布（基本块 16×16 / FP32 16×8，K 对齐 32/sizeof(T)，N 对齐 16）
summary: "NPU 内部计算亲和 **FRACTAL_NZ** 分形排布：基本块 FP16/BF16 为 16×16、FP32 为 16×8（M 维块恒 16，FP32 时 N 维减半）；块间按 N 字形（列优先）、块内按 Z 字形（Morton）排列，ND 则是行主序。对齐规则：K 维对齐到 `CUBE_SIZE/sizeof(T)`（即 32/sizeof(T)）、N 维对齐到 16——**对齐使实际存储大于原矩阵，GM 空间必须按对齐后尺寸分配**，否则越界；NZ 转换前必须做 Padding"

