content:
  claim: "昇腾950 系列支持 nD-Mesh、Clos 等多种灵活组网；超节点（Super Node）规模从上一代 384 卡提升至 8K（8192）卡，整体集群支持规模超过 128K 卡。该规模能力与通信类诊断（HCCL 拓扑、多节点 EP/PD 的通信瓶颈）直接相关——单集群卡片数上限远超 A2/A3。"
  evidence: "白皮书 §3 灵活组网与超大规模扩展（p.12）与 §4.7 超节点能力（p.32-34）：『规模突破：超节点（Super Node）规模从上一代的384 卡提升至8K（8192）卡，整体集群支持规模超过128K 卡』。已对 PDF 第 8-14 页原文核验。"
