title: A5 URMA 异步通信语义（操作集、RTP/CTP 传输模式）
summary: URMA 异步语义：Write/Read/Send/Atomic（FetchAdd、CAS）；RTP 可靠传输（4 Port）vs CTP 简易传输（9 Port）；Doorbell + Jetty 队列 + UMMU 地址转换

sources:
