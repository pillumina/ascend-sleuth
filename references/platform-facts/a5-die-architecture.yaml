title: A5 多 Die 合封架构（2 AI Die + 2 IO Die + 片上内存模块）
summary: 昇腾950 为 Chiplet 合封：2 AI Die + 2 IO Die + 8(PR)/4(DT) 片上内存模块，D2D Clink 互联，UMA 统一内存

