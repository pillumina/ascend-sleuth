id: mte2-preload-queue-depth
type: platform-fact
title: MTE2_PONG 指令队列深度阻塞（双缓冲下搬运流水断流）
summary: "启用双缓冲的矩阵乘里，每条 `MTE2_PONG` 必须等配对的 `MTE2_PING` 之后**所有指令发射完毕**才有发射机会；两条指令之间插入的指令数一旦超过芯片预设指令队列深度，即使二者无同步依赖，PONG 也发不出去，表现为 MTE2 流水断流。这与「搬运量大」是两回事——靠缩小 tiling 块治不好；解法是 MTE2 预加载（首轮就把两组数据提前搬到 L1），让 PONG 提前发射"

