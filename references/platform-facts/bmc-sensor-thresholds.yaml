id: bmc-sensor-thresholds
type: platform-fact
title: BMC 传感器读数的判定依据（机型、版本和可核来源）
summary: BMC 传感器读数只有对照适用机型和版本的可核依据，才能判断是否越限。缺少依据时记录实际读数、设备报告的状态和证据来源。

