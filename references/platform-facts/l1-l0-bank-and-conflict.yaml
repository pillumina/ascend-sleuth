id: l1-l0-bank-and-conflict
type: platform-fact
title: L1/L0 片上存储的 Bank 结构与冲突（L1 双 256KiB Bank、UB bank 交织公式）
summary: "片上存储的内部划分决定了「搬运不快」的一类根因：L1 为 512 KiB、按 256 KiB 分成两个 Bank，跨 Bank 的访问模式会打断 MMAD；L0C 固定 256 KiB，直接决定 `baseM = baseN = 256` 是 tiling 上限；UB 侧存在 bank 交织（`bank = (byte_offset / 32) % 16`），可用 DATA_BLOCK_COPY 的 stride padding 规避。典型表现是「MTE1 时间变短/变长与预期不符」「加块到 256 仍 MTE2 Bound」"

