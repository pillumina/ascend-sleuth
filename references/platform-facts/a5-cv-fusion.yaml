title: A5 Cube-Vector 融合（CV 直连通道、FlashAttention 内部通路、随路转换）
summary: Cube L1 Buffer 与 Vector Unified Buffer 直连通道；FA 带宽瓶颈的 Cube-Vector 内部数据通路；传输时随路精度/排布转换

