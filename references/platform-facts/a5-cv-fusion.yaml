content:
  claim: "昇腾950 支持 Cube-Vector（CV）融合：Cube L1 Buffer 与 Vector Unified Buffer 之间提供直接 CV 数据传递通道，提高核内数据复用率、减少 L2 层数据交换；针对 FlashAttention 的带宽瓶颈，支持 Cube Core 与 Vector Core 之间的内部数据通路实现高效融合；支持 Cube-Vector 间传输数据时进行随路数值精度和数据排布转换，进一步提升端到端吞吐与能效。"
  evidence: "白皮书 §4.1.4 支持CV 融合（PDF p.22）：『支持Cube L1 Buffer 和Vector Unified Buffer 的直接CV 数据传递通道』『针对FlashAttention 的带宽瓶颈，支持Cube Core 和Vector Core 之间的内部数据通路』『在Cube Core 和Vector Core 之间传输数据时进行随路数值精度和数据排布转换』"
