id: transfer-granularity-thresholds
type: platform-fact
title: 搬运粒度阈值（单次总量 <20K 不友好、连续 <128B 浪费 Sector-Cache）
summary: "两个搬运粒度阈值：单次搬运总量小于 **20K** 对芯片搬运不友好、速度下降；Ascend 950 支持 **128B Sector-Cache**，但为了用满核把连续搬运字节数降到 128B 以下会浪费有效带宽。可操作判据是 `N ≤ coreNum × 128` 的场景要检查任务是否被切得过碎（128 为 N 方向元素数）"

