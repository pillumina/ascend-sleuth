title: A5 AI 子系统数量与算力规格（Cube/Vector 数量 + TFLOPS 表）
summary: 昇腾950 共 36 个 AI 子系统（各 1 Cube + 2 Vector）；Cube 数量 950PR 32/28、950DT 36/32/28；算力随精度格式分级

