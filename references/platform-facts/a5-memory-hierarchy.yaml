title: A5 Memory 层次与容量（表 4-2）
summary: 昇腾950 Memory 层次：L1 512KB、L0A/L0B 64KB、L0C 256KB、Unified Buffer 512KB（per AI Core）；CPU L1 64KB/L2 1MB/L3 4MB；L2 ≤128MB；片上内存 PR≤128GB、DT≤96/144GB

