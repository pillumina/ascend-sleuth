content:
  claim: "昇腾950 Memory 层次（表 4-2）：L1 Buffer 512KB/AI Core；L0A Buffer 64KB/AI Core；L0B Buffer 64KB/AI Core；L0C Buffer 256KB/AI Core；Unified Buffer（UB）512KB/AI Core；CPU L1 Cache 64KB/CPU Core；CPU L2 Cache 1MB/CPU Core；L3 Cache 4MB/CPU Cluster；L2 Cache 最高 128MB；高速片上内存 950PR 最高 128GB、950DT 最高 96/144GB。L2 主要服务 AIC/AIV 的 AI 计算，L3 主要服务 AI CPU 的通用计算。"
  evidence: "白皮书 §4.3 Memory 子系统与表 4-2（PDF p.25）：『昇腾950 系列芯片主要Memory 的缓存大小如下表所示』"
