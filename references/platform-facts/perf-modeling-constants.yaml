content:
  claim: "性能建模的参考配置（来源明示为参考数据）：**32 核、1.65GHz、HBM 带宽 1.6TB/s、L2 带宽 5.2TB/s、MTE1 带宽 256BPC（约 422.4GB/s）、L0C 空间 256KiB**。换算关系：芯片上 **1 µs = 1650 cycle**（对应 1.65GHz）；`TB/s` 按**十进制口径**（`1TB/s = 10^12 B/s`）；`BPC` = Byte Per Cycle，换算成带宽需乘频率。**MTE2 综合带宽模型**：`BandWidth_MTE2 ≈ (1 − L2HitRatio) × BandWidth_HBM + L2HitRatio × BandWidth_L2`。**两个定量门槛**：当 `baseM = baseN = 256` 时，达成 Cube Bound 所需的最小 MTE2 带宽为 **2.64TB/s**；**L2 命中率达到 28.9% 时 MTE2 不会成为主瓶颈**。**用法**：把 profiler 实测的 µs 换成 cycle 与有效带宽，再与上面的建模值比对，才能判定当前是 Cube 还是 MTE2 Bound；「增大 tile 复用能否缓解 MTE2」这类判断也可以借 L2 命中率门槛定量化。**与既有词条的口径区分**：`1.6TB/s` 是该来源的建模取值，本库 `a5-950pr-memory-spec` 记录的 1.6TB/s 是平台规格值——两者数值一致但**出处不同**，引用时不要混为一条；`L0C 256KiB` 与 `l1-l0-bank-and-conflict` 记录的一致。"
  evidence: "源文档：『以32核，1.65GHz，HBM带宽1.6TB/s，L2带宽5.2TB/s，MTE1带宽为256BPC（约422.4GB/s），L0C空间为256KiB为例，给出参考数据』（及同节的 `BandWidth_MTE2` 加权式、2.64TB/s 最小值、28.9% L2 命中率结论、TB/s 十进制与 BPC 换算说明）"
