title: 性能建模参考常数（1.65GHz / 1µs=1650 cycle / MTE1 256BPC / L2 5.2TB/s / L2 命中率 28.9% 门槛）
summary: "把 profiler 的 µs 换算成 cycle 与有效带宽、再与建模值比对的参考常数集：32 核、**1.65GHz**（故芯片上 **1 µs = 1650 cycle**）、HBM 1.6TB/s、L2 5.2TB/s、MTE1 **256BPC**（≈422.4GB/s）、L0C 256KiB；MTE2 综合带宽 `≈ (1−L2HitRatio)·HBM + L2HitRatio·L2`，`baseM=baseN=256` 时达成 Cube Bound 需 MTE2 ≥ **2.64TB/s**，**L2 命中率到 28.9% 时 MTE2 不再是主瓶颈**"

