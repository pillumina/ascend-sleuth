status: active
last_verified: 2026-08-28

content:
  claim: "昇腾950 新增 NDDMA（N-dimensional Direct Memory Access）指令：支持对全局内存数据做最多 5 个维度的重排操作后存储至 Vector Core 的 Unified Buffer，可同时完成数据搬运与重排/转置；硬化地址生成逻辑加快地址生成，内置缓存最大限度降低冗余访存；自动发掘数据局部性，将多个数据元素粒度的读操作转换为 128 字节读操作。"
  evidence: "白皮书 §4.1.5 新增NDDMA 指令（PDF p.22-23）：『NDDMA 指令可以对全局内存中的数据做最多5 个维度的重排操作』『内置缓存能自动发掘数据局部性，并将多个数据元素粒度的读操作转换为128 字节的读操作』"
