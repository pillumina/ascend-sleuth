id: a5-nddma
type: platform-fact
title: A5 NDDMA 指令（多维数据排布转换、5 维重排、128B 读合并）
summary: NDDMA 硬化地址生成，最多 5 维数据重排，128B 读操作合并，降低数据搬运编程复杂度

sources:
  - type: official-doc
    url: "昇腾950 NPU 架构白皮书（华为技术有限公司）"
