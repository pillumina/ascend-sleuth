id: ub-capacity-and-budget
type: platform-fact
title: UB 容量口径（每 AIV 248 KiB 可用 / 每 AI Core 512 KiB）与 buffer 预算
summary: "UB 预算判据是 `queBytes × bufNum × 队列数 ≤ UB 可用容量`，其中 `queBytes` 是**每个 buffer** 的字节数、单条队列实占 `bufNum × queBytes`。dav-3510/Ascend 950 的可用值来自运行期查询：**每颗 AIV 独享 248 KiB 私有 UB**（另见 SIMT 侧的『UB 总大小 256KB』与白皮书的『UB 512KB/AI Core』——三个数字是口径差异，落 buffer 数时必须用运行期查询值，不能用规格书值"

