id: hw-task-scheduler-routing
type: platform-fact
title: 硬件任务调度模块分派（AICore / AICpu / Sdma 三条调度通道）
summary: "昇腾芯片的系统任务调度模块把任务按类型分派到不同调度器：硬件队列 → 路由请求 → {AICore 调度器, AICpu 调度器, ……, Sdma 调度器} → {AIC, AIV, AICpu, ……, Sdma}。即 AIC/AIV 任务走 AICore 调度器，而 AICpu 任务与 Sdma 拷贝任务**各有独立调度通道**——AICPU / 拷贝类 hang 不应按 AICore 算子的排查路径走"

