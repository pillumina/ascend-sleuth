content:
  claim: "昇腾950 提供 128MB 全局统一访问的 L2 Cache；采用 Chiplet UMA 统一内存架构，支持算子可控的 Cache Hint 管理；支持按 Way 的 Cache Lock 与驻留策略，管理粒度精细至 128Byte Sector；在离散小包访问和随机访存场景下，同带宽条件下性能较上一代提升 2 倍以上。"
  evidence: "白皮书 §3 存储体系（p.11-12）：『128MB 全局L2 Cache』『128MB 统一访问的L2 Cache』；§4.3.2（p.22）。已对 PDF 第 8-14 页原文核验。"
