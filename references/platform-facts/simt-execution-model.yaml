id: simt-execution-model
type: platform-fact
title: SIMT 执行模型与硬件上限（Warp 32 / Block ≤2048 / 一个 AIV 同时只跑一个 Block）
summary: "SIMT 线程层次为 Thread / Block / NumBlock 三层：Warp 固定 32 线程、一个 Block 的多个 Warp 依次调度到同一个 AIV；单 Block 最多 **2048 线程**（硬件当前上限），且**一次在一个 AIV 上只能运行一个 Block**（与 GPU 不同），NumBlock 只支持单维。用 `--enable-simt` 编译时 MTE 相关头文件不可用、数据必须 GM 直访（丧失批量 DMA 效率）——这两条决定了 SIMT 与 SIMD 的选型边界"

