id: npu-arch-token-map
type: platform-fact
title: 架构标识 ↔ 平台映射（dav-3510 = Ascend 950 / dav-2201 = Ascend 910B,C）
summary: "CANN 工具链用架构标识指定目标 NPU：`dav-3510` = Ascend 950（A5）、`dav-2201` = Ascend 910B/C（A2/A3）。该标识出现在构建配置（`NPU_ARCH`）与编译器参数（`bisheng --npu-arch=dav-3510`）中——判断一份报错、一个二进制或一条构建配置面向哪代芯片时按本表对照；本词条只登记来源明确声明的这两个取值，其他代际的标识不在其中"

