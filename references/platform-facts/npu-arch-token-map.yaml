content:
  claim: "昇腾构建面用 `NPU_ARCH` 标识目标 NPU 架构，样例仓只接受两个取值：`dav-3510` = Ascend 950，`dav-2201` = Ascend 910B/C。两种失败形态要分清——①取值不在两者之内：CMake 配置阶段直接以 `Unsupported NPU_ARCH` 报错中止（响亮失败）；②取值合法但目标样例不支持该架构：该样例被**静默跳过**（配置日志出现一行 `Skip sample ...`，不报错），对应的编译 target 根本不存在，到编译时才以 `No rule to make target '<name>'` 失败。所以见到 `No rule to make target` 先回看 `NPU_ARCH` 与该样例声明的支持架构，不要按编译配置错误排查。"
  evidence: "cann-samples 根 README 快速入门表（Ascend950 → `dav-3510`；Ascend910B/C → `dav-2201`；『不支持当前架构的样例会在配置阶段跳过』）；mem_bandwidth README 环境要求节（『仅支持 `NPU_ARCH=dav-3510`』『用 `dav-2201` 配置时本样例会被静默跳过（配置日志里有一行 `Skip sample ...`，但不报错），此时四个 target 都不存在，编译会以 `No rule to make target` 失败』）与常见问题节（同名条目）；cannsim 样例 CMakeLists 用 `cann_sample_check_arch(dav-3510)` 落实该门控"
