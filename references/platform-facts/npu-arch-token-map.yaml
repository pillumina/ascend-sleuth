id: npu-arch-token-map
type: platform-fact
title: NPU_ARCH 取值 ↔ 平台映射（dav-3510 = Ascend 950 / dav-2201 = Ascend 910B,C）
summary: "构建与算子编译用的 NPU_ARCH 标识只有两个取值——dav-3510 对应 Ascend 950、dav-2201 对应 Ascend 910B/C；取值不合法时在 CMake 配置阶段以 Unsupported NPU_ARCH 报错中止，而架构不匹配的样例是**静默跳过**（配置日志一行 Skip sample），表现为编译期 No rule to make target——看到它先回看 NPU_ARCH，不当编译配置错误排查"

