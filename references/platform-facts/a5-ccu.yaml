content:
  claim: "昇腾950 集成 CCU（集合通信计算加速单元）：实现计算与通信的深度并行，显著降低对主存（Memory）的占用及 IO 调度延迟；通过硬件卸载集合通信任务，释放 AI Core 算力。CCU 是大规模集合通信（allreduce/allgather/alltoall）性能分析时的硬件背景——通信开销可被硬件卸载，与 A2 的 HCCL 软件路径行为不同。"
  evidence: "白皮书 §3 通信加速（p.12）：『CCU（集合通信计算加速单元）实现计算与通信的深度并行，显著降低对主存（Memory）的占用及IO 调度延迟』『通过硬件卸载集合通信任务，释放AI Core 算力』"
