title: A5 PCIe 5.0 规格（x16 128GB/s、EP/RC 静态选择、DMA/MCTP）
summary: 昇腾950 支持 PCIe GEN5 1x16/1x8/1x4/1x2，128GB/s 双向，EP/RC 双模静态选择，支持 DMA、MCTP 加速器

