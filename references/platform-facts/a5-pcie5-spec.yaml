content:
  claim: "昇腾950 PCIe 规格：支持 PCIe GEN5 协议（向下兼容 GEN4/3/2/1）；支持 1x16/1x8/1x4/1x2 Link 模式（1 个 x16 Port，可向下降 Lane 到 x8、x4，Port 数不变）；支持 EP 与 RC 两种工作模式（静态选择）；双向带宽 128GB/s；支持 DMA、MCTP 加速器。"
  evidence: "白皮书 §3 表 3-1 IO 规格（PDF p.15）与 §4.6.6 PCIe 5.0（PDF p.35）：『PCIe 5.0 x16，128GB/s 双向』『支持标准的PCIe GEN5 协议，向下兼容GEN4/3/2/1』『支持EP 与RC 两种工作模式，模式静态选择』『支持DMA、MCTP 加速器』"
