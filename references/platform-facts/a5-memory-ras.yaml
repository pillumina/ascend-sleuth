id: a5-memory-ras
type: platform-fact
title: A5 高速片上内存 RAS 特性
summary: 昇腾950 片上内存支持 Online ECC、巡检、行失效动态隔离（用户无感）

sources:
  - type: official-doc
    url: "昇腾950 NPU 架构白皮书（华为技术有限公司）"
    version: "2026-06-04（PDF metadata creationDate）"
    fetched_at: 2026-08-28
    verification: cross-checked-source

applies_to:
  platforms: [A5-950]

status: active
last_verified: 2026-08-28

content:
  claim: "昇腾950 高速片上内存实现 RAS（Reliability, Availability and Serviceability）特性：支持 Online ECC；巡检特性发现薄弱点并回写或隔离；预留部分行，在发现新增行失效时动态隔离问题行并搬运数据到预留行，实现用户无感知的行失效隔离。"
  evidence: "白皮书 §4.3.1 高速片上内存（PDF p.26）：『支持Online ECC』『巡检特性，发现薄弱点并回写或隔离』『预留部分行，在发现新增行失效时，可以动态隔离问题行』"
