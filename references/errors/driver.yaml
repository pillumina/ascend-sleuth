id: driver-error-codes
type: error-code
title: Driver（驱动） 错误码（EL，15 条）
summary: CANN 商用版 9.0.0《错误码参考》Driver（驱动）族 15 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure
sources:
- type: official-doc
  url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html
  version: CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）
  fetched_at: '2026-08-28'
  verification: cross-checked-source
applies_to:
  platforms:
  - cross
  versions:
    cann: 9.0.0
related_references:
- ascend-error-code-structure
status: active
last_verified: '2026-08-28'
content:
  errors:
  - code: EL0001
    meaning: Device_Absent/Abnormal：Device not found or invalid.
    solution: Check the error messages in the log.
    module: Driver Errors
  - code: EL0002
    meaning: Invalid_Device_ID：The device ID is invalid.
    module: Driver Errors
  - code: EL0003
    meaning: Invalid_Argument：The argument is invalid.
    solution: Try again with a valid argument.
    module: Driver Errors
  - code: EL0004
    meaning: Memory_Allocation_Failure：Failed to allocate memory requested by %s module.
    solution: Close applications not in use.
    module: Driver Errors
  - code: EL0005
    meaning: Resource_Busy：The resources are busy.
    solution: '- Close applications not in use. - Wait for a while and try again.'
    module: Driver Errors
  - code: EL0006
    meaning: Insufficient_Resources：The resources are insufficient.
    solution: Close applications not in use.
    module: Driver Errors
  - code: EL0007
    meaning: No_Permission：You have no permission.
    solution: '- Close applications not in use. - Check that you have the required permission.'
    module: Driver Errors
  - code: EL0008
    meaning: Insufficient_Event_Resources：The event resources are insufficient.
    solution: Close applications not in use.
    module: Driver Errors
  - code: EL0009
    meaning: Insufficient_Stream_Resources：The stream resources are insufficient.
    solution: Close applications not in use.
    module: Driver Errors
  - code: EL0010
    meaning: Insufficient_Notify_Resources：The Notify resources are insufficient.
    solution: Close applications not in use.
    module: Driver Errors
  - code: EL0011
    meaning: Insufficient_Model_Resources：The model resources are insufficient.
    solution: Close applications not in use.
    module: Driver Errors
  - code: EL0012
    meaning: Full_Service_Queue：The service queue is full.
    solution: Reduce service loads.
    module: Driver Errors
  - code: EL0013
    meaning: Insufficient_CDQM_Resources：The CDQM resources are insufficient.
    solution: Reduce service loads.
    module: Driver Errors
  - code: EL0014
    meaning: Operation_Unsupported：The operation is unsupported.
    module: Driver Errors
  - code: EL0015
    meaning: Invalid_Device_Access：The device access is invalid.
    solution: '- Check your configurations. - Check whether there are residual container processes.'
    module: Driver Errors
