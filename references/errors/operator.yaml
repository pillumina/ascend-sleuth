id: operator-error-codes
type: error-code
title: 算子公共错误码与算子 API（EZ） 错误码（EZ，17 条）
summary: 两个官方来源合表共 17 条：CANN 商用版 9.0.0《错误码参考》算子公共错误码与算子 API（EZ）族 16 条 + cann/runtime 开源仓 docs/en/error_code_ref 的 EZ2001（AI Core 异常聚合报错格式）；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure
