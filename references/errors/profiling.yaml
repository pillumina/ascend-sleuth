title: Profiling（性能分析） 错误码（EK，8 条）
summary: CANN 商用版 9.0.0《错误码参考》Profiling（性能分析）族 8 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure
