content:
  errors:
  - code: EG0000
    meaning: 'Invalid_Argument_Command：The command line argument is invalid. Reason: %s.'
    solution: Run the aoe -h command to view the usage. For more details, refer to AOE Tool User Guide.
    module: AOE Errors
  - code: EG0001
    meaning: 'Config_Error：The configuration argument is invalid. Reason: %s.'
    module: AOE Errors
  - code: EG0002
    meaning: 'Config_Error_Invalid_Environment_Variable：The environment variable argument is invalid. Reason: %s.'
    module: AOE Errors
  - code: EG0004
    meaning: 'Invalid_Argument_Command：The command line argument is invalid. Reason: %s.'
    solution: For more details, refer to "AOE Tool User Guide".
    module: AOE Errors
  - code: EG0010
    meaning: 'Directory_Operation_Error：Directory operation failed. Reason: %s.'
    module: AOE Errors
  - code: EG0011
    meaning: 'File_Operation_Error：File operation failed. Reason: %s.'
    module: AOE Errors
  - code: EG0012
    meaning: 'Environment_Error：Component loading failed. Reason: %s.'
    module: AOE Errors
  - code: EG0013
    meaning: 'Invalid_Argument_Device_ID：Device operation failed. Reason: %s.'
    module: AOE Errors
  - code: EG2000
