id: fe-error-codes
type: error-code
title: FE（前向引擎） 错误码（E2，9 条）
summary: CANN 商用版 9.0.0《错误码参考》FE（前向引擎）族 9 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure
sources:
- type: official-doc
  url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html
  version: CANN 商用版 9.0.0（错误码参考，atlaserrorcode_15_* 全量 307 页）
  fetched_at: '2026-08-28'
  verification: cross-checked-source
applies_to:
  platforms:
  - cross
  versions:
    cann: 9.0.0
related_references:
- ascend-error-code-structure
status: draft
last_verified: '2026-08-28'
content:
  errors:
  - code: E20001
    meaning: Compilation_Error：Operator %s compilation failed.Optype is %s.
    solution: For a custom operator, check the operator implementation and arguments based on the error log. For a Huawei built-in operator, obtain the host log and contact technical support at https://www.hiascend.com/support.
    module: FE Errors
  - code: E20002
    meaning: 'Config_Error_Invalid_Environment_Variable：Value %s for environment variable %s is invalid. Reason: %s.'
    solution: Reset the environment variable by referring to the Environment Variable Reference.
    module: FE Errors
  - code: E20003
    meaning: 'Config_Error：Configuration item %s in configuration file %s is invalid. Reason: %s.'
    solution: Modify the configuration file by referring to the specifications in the user guide.
    module: FE Errors
  - code: E20007
    meaning: Compilation_Error_Execute_Fusion_Pass：Graph fusion pass %s failed. The pass type is %s.
    solution: '- If the pass code is custom, check the implementation logic of the pass. - If the pass code is not custom, obtain the host log and contact technical support at https://www.hiascend.com/support.'
    module: FE Errors
  - code: E20101
    meaning: 'Invalid_Argument：Value %s for parameter %s is invalid. Reason: %s.'
    solution: Please adjust the parameter according to the documentation or contact Huawei technical support.
    module: FE Errors
  - code: E20103
    meaning: Invalid_Argument：Value %s for parameter %s is invalid. The value must be in the range of (0, %s].
    solution: NA
    module: FE Errors
  - code: E21001
    meaning: 'File_Operation_Error_Open：Failed to open file %s. Reason: %s.'
    solution: '- Configure the file path correctly. - Configure the file permissions correctly. - Reinstall the package.'
    module: FE Errors
  - code: E21002
    meaning: 'File_Operation_Error_Parse：Failed to parse file %s. Reason: %s.'
    solution: Configure the file path correctly.
    module: FE Errors
  - code: E22001
    meaning: Compilation_Error：Compilation result for operator %s not found. Optype is %s.
    solution: Check the process cause of the segmentation fault.
    module: FE Errors
