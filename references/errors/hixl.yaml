id: hixl-error-codes
type: error-code
title: HIXL（单边通信库）错误码（9 条，103900–103905 / 203900 / 503900）
summary: HIXL 单边通信库的 Status 码（uint32，十进制）：SUCCESS=0、PARAM_INVALID=103900、TIMEOUT=103901、NOT_CONNECTED=103902、ALREADY_CONNECTED=103903、NOTIFY_FAILED=103904、UNSUPPORTED=103905、RESOURCE_EXHAUSTED=203900、FAILED=503900。SDK 文档给出每一码的**是否可恢复**与处理动作——不可恢复的四条（TIMEOUT、NOTIFY_FAILED、FAILED）动作统一是**保留现场 + 取 Host/Device 日志并备份**，可恢复的多为参数/链路类（排查建链情况）或资源类（等资源释放后重试）

sources:
  - type: official-doc
    url: "https://gitcode.com/cann/hixl/blob/master/docs/zh/api/cpp/HIXL-error-code.md"
    version: "hixl master（commit 3f38f679bc0f，2026-09-15 抓取）：C++ 头文件里的 Status 常量定义 + 逐码含义/可恢复性/解决办法表"
    fetched_at: 2026-09-15
    verification: cross-checked-source
  - type: official-doc
    url: "https://gitcode.com/cann/hixl/blob/master/docs/zh/api/python/HIXL-error-code.md"
