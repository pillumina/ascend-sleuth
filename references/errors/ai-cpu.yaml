id: ai-cpu-error-codes
type: error-code
title: AI CPU 错误码（E3，15 条）
summary: CANN 商用版 9.0.0《错误码参考》AI CPU族 15 条；meaning 取官方 symptom 原文模板（含 %s 占位符），solution 为官方处理建议；码结构与族文件定位见 ascend-error-code-structure
sources:
- type: official-doc
  url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/atlaserrorcode_15_0001.html
