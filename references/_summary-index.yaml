- {id: a5-950pr-memory-spec, type: platform-fact, title: A5 950PR 片上内存规格（128GB / 1.6TB/s）, summary: 昇腾950PR 单芯片最高 128GB / 1.6TB/s 高速片上内存，面向推荐、LLM Prefill、多模态推理, applies_to: {platforms: [A5-950PR], categories: [interrupt, performance]}}
- {id: a5-ai-subsystem-compute-spec, type: platform-fact, title: A5 AI 子系统数量与算力规格（Cube/Vector 数量 + TFLOPS 表）, summary: 昇腾950 共 36 个 AI 子系统（各 1 Cube + 2 Vector）；Cube 数量 950PR 32/28、950DT 36/32/28；算力随精度格式分级, applies_to: {platforms: [A5-950], categories: [performance]}}
- {id: a5-ccu, type: platform-fact, title: A5 CCU 集合通信计算加速单元, summary: CCU 硬件卸载集合通信任务，计算通信深度并行，释放 AI Core 算力, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-ccu-algorithms, type: platform-fact, title: A5 CCU 集合通信算法支持（Broadcast/ReduceScatter/AllGather/AllReduce/All2All/All2Allv）, summary: CCU 硬件执行 6 种集合通信算法；CCUM Mission 接口 + CCUA（MemorySlice 存储 + Reduce Unit 计算）, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-cube-core-spec, type: platform-fact, title: A5 Cube Core 规格（数值格式算力倍率、L0C Buffer、随路量化）, summary: 第三代 Cube：FP8/MXFP8/HiF8 提供 2 倍 FP16 TFLOPS、MXFP4 提供 4 倍；更大 L0C Buffer；回写 UB 时随路量化（FP32→BF16/FP16/FP8、NZ→ND/DN）, applies_to: {platforms: [A5-950], categories: [precision, performance]}}
- {id: a5-cv-fusion, type: platform-fact, title: A5 Cube-Vector 融合（CV 直连通道、FlashAttention 内部通路、随路转换）, summary: Cube L1 Buffer 与 Vector Unified Buffer 直连通道；FA 带宽瓶颈的 Cube-Vector 内部数据通路；传输时随路精度/排布转换, applies_to: {platforms: [A5-950], categories: [precision, performance]}}
- {id: a5-die-architecture, type: platform-fact, title: A5 多 Die 合封架构（2 AI Die + 2 IO Die + 片上内存模块）, summary: 昇腾950 为 Chiplet 合封：2 AI Die + 2 IO Die + 8(PR)/4(DT) 片上内存模块，D2D Clink 互联，UMA 统一内存, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-hif8-format, type: platform-fact, title: HiF8 精度格式细节（38 指数、无 MX 缩放因子、特殊值编码）, summary: 'HiF8 综合阶码范围 [-22,15] 共 38 个指数，比 FP8 E4M3 的 18 个动态范围成倍提升；与 MXFP8 相比无需 8 位 MX 缩放因子', applies_to: {platforms: [A5-950], categories: [precision]}}
- {id: a5-interconnect-ub2, type: platform-fact, title: A5 灵衢 Unified Bus 2.0 互联（2TB/s，URMA/UB Memory/PCIe 5.0/UBoE）, summary: 昇腾950 单芯片互联带宽 2TB/s：72×HiLink(112Gbps)/18 Port，URMA 异步拷贝、UB Memory 同步语义、PCIe 5.0 x16 双模式、2×400Gbps UBoE, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-l2-cache, type: platform-fact, title: A5 全局 L2 Cache（128MB，Chiplet UMA）, summary: 昇腾950 提供 128MB 统一访问 L2 Cache，支持按 Way Cache Lock，管理粒度 128Byte Sector, applies_to: {platforms: [A5-950], categories: [performance]}}
- {id: a5-l2-cache-detail, type: platform-fact, title: A5 L2 Cache 微架构与 Cache 管理（512B Cache Line、L2 hint、CMO）, summary: A5 L2 Cache 512B Cache Line + 128B Sector，2 Die UMA 跨 Die 访问，硬件一致性，L2 hint 分配/替换策略，SDMA CMO（Prefetch/Writeback/Invalid/Flush）, applies_to: {platforms: [A5-950], categories: [performance]}}
- {id: a5-memory-hierarchy, type: platform-fact, title: A5 Memory 层次与容量（表 4-2）, summary: 昇腾950 Memory 层次：L1 512KB、L0A/L0B 64KB、L0C 256KB、Unified Buffer 512KB（per AI Core）；CPU L1 64KB/L2 1MB/L3 4MB；L2 ≤128MB；片上内存 PR≤128GB、DT≤96/144GB, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-memory-ras, type: platform-fact, title: A5 高速片上内存 RAS 特性, summary: 昇腾950 片上内存支持 Online ECC、巡检、行失效动态隔离（用户无感）, applies_to: {platforms: [A5-950], categories: [interrupt]}}
- {id: a5-nddma, type: platform-fact, title: A5 NDDMA 指令（多维数据排布转换、5 维重排、128B 读合并）, summary: NDDMA 硬化地址生成，最多 5 维数据重排，128B 读操作合并，降低数据搬运编程复杂度, applies_to: {platforms: [A5-950], categories: [performance]}}
- {id: a5-pcie5-spec, type: platform-fact, title: A5 PCIe 5.0 规格（x16 128GB/s、EP/RC 静态选择、DMA/MCTP）, summary: 昇腾950 支持 PCIe GEN5 1x16/1x8/1x4/1x2，128GB/s 双向，EP/RC 双模静态选择，支持 DMA、MCTP 加速器, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-precision-format-support, type: platform-fact, title: A5 精度格式支持（原生 MXFP4/MXFP8/HiF8，另含 FP8/INT8/TF32/FP16/BF16）, summary: 昇腾950 系列原生支持 MXFP4/MXFP8/HiF8 低精度格式，全面支持 FP8/INT8/TF32/FP16/BF16, applies_to: {platforms: [A5-950], categories: [precision]}}
- {id: a5-simd-simt-mixed, type: platform-fact, title: A5 SIMD/SIMT 混合编程架构（SIMD 为主、SIMT 为辅）, summary: 昇腾950 DaVinci Core 采用 SIMD 为主 / SIMT 为辅的混合编程；SIMT 面向离散访问与复杂分支；Vector Function（VF）支持快速切换, applies_to: {platforms: [A5-950], categories: [performance]}}
- {id: a5-stars2-scheduler, type: platform-fact, title: A5 STARS 2.0 任务调度器（HSCB、任务流、Group、资源池）, summary: STARS 2.0 调度 AIC/AIV/CPU/DVPP/SDMA/UB/CCU；HSCB ns 级调度；2048 任务流下沉；8 Group 亲和性调度；16 资源池算力切分, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-supernode-scale, type: platform-fact, title: A5 超节点规模（8K 卡）与集群规模（128K+ 卡）, summary: 昇腾超节点从上一代 384 卡提升至 8K 卡，整体集群支持超 128K 卡，nD-Mesh/Clos 灵活组网, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-ub-onchip-switch, type: platform-fact, title: A5 UB On Chip Switch（IO Die 内 9×x4 Port 转发，不占 DRAM 带宽）, summary: 单 IO Die 内 9 个 x4 Port 间流量转发，经 NoC 完成，不进计算 Die、不占 DRAM 带宽, applies_to: {platforms: [A5-950], categories: [performance]}}
- {id: a5-urma-semantics, type: platform-fact, title: A5 URMA 异步通信语义（操作集、RTP/CTP 传输模式）, summary: URMA 异步语义：Write/Read/Send/Atomic（FetchAdd、CAS）；RTP 可靠传输（4 Port）vs CTP 简易传输（9 Port）；Doorbell + Jetty 队列 + UMMU 地址转换, applies_to: {platforms: [A5-950], categories: [interrupt, performance]}}
- {id: a5-vector-core-spec, type: platform-fact, title: A5 Vector Core 规格（BF16 原生支持、RegFile、算力翻倍）, summary: 第三代 Vector：单核 FP16/FP32 TFLOPS 较上代提升 100%；新增 BF16 原生支持与格式转换指令；UB 与 Vector ALU 间引入 RegFile, applies_to: {platforms: [A5-950], categories: [precision, performance]}}
- {id: aclnn-quant-modes-and-sparsemode, type: software-fact, title: aclnn 量化模式与 sparseMode（T/C/K/G/B 五级与五种组合 / MX 的定义 / sparseMode 0-8 表与 varlen 限制）, summary: aclnn 量化模式与稀疏模式的语义和约束——两块与精度成因判读直接相关的规则。, applies_to: {platforms: [cross], categories: [precision]}}
