  title: mindspeed-llm 训练启动失败排查（版本/环境配套面 + import 失败判别）
  summary: mindspeed-llm 训练启动即失败的常见根因分流：import 失败先判别"版本/安装面 vs 代码漂移面"（features_manager 缺符号=版本不配套；tasks.checkpoint.models
    缺失=上游删模块未同步后端）；算子重复注册（CANN 版本过旧 vs 多版本 mindspeed）；…
  applies_to:
    platforms: []
- id: msprobe-accuracy-checker
  type: tool
  title: msprobe acc_check——离线精度预检（API 达标判定链路与阈值）
  summary: msprobe acc_check：在 NPU 上扫描训练模型的 API 输入数据，与 CPU 高精度标杆逐 API 比对给出达标判定；判链是「余弦相似度 > 0.99 → 最大绝对误差
    < 0.001 → 双百/双千/双万」；输出 accuracy_checking_result/details_{ts}.csv；m…
  applies_to:
    platforms:
    - cross
- id: msprobe-accuracy-compare
  type: tool
  title: msprobe compare——数值精度比对（NPU vs 标杆，真实数据/统计量/MD5 三模式）
  summary: msprobe compare：把 NPU dump 与 CPU/GPU/NPU 标杆 dump 逐 API 比对，输出 compare_result_{ts}.csv（多卡按 rank
    分文件）；三种数据模式（真实数据/统计数据/MD5）对应三套表头与指标；加 -da 可自动识别全网首个差异节点
  applies_to:
    platforms:
    - cross
- id: msprobe-capability-limits
  type: software-fact
  title: msprobe 五功能的适用场景与当前版本局限性（选型与边界）
  summary: msprobe 选型与能力边界：dump（API 级仅支持白名单、对 inplace 支持有限、不支持参数及参数梯度，且**加工具可能让同步问题消失**）/ 离线预检（不受累计误差影响，但依赖
    GPU 环境、不支持通信算子、仅部分融合算子）/ 整网比对与可视化（可疑算子受累计误差影响、大模型耗时长）/ 训练状态监测（仅…
  applies_to:
    platforms:
    - cross
- id: msprobe-checkpoint-compare
  type: tool
  title: msprobe ckpt 比对——逐参数 l2/余弦相似度（Megatron/MindSpeed）
  summary: msprobe ckpt 比对：`msprobe config_check --compare <ckpt1> <ckpt2>` 逐参数输出 l2（欧氏距离）/cos（余弦相似度）/numel/shape
    到 json；支持 Megatron-LM 与 MindSpeed（含 TP/PP/EP/VPP 与 megatr…
  applies_to:
    platforms:
    - cross
- id: msprobe-config-check
  type: tool
  title: msprobe config_check——训练前配置检查（双环境差异比对）
  summary: msprobe config_check：对比两个训练环境下影响精度的配置差异（环境变量/第三方库版本/训练超参/权重/数据集/随机操作）；静态采集只覆盖前三项，动态采集才覆盖全部；比对输出
    result.xlsx，summary 页六项 pass/error/warning，前五项必须在精度比对前 pass
  applies_to:
    platforms:
    - cross
- id: msprobe-data-dump
  type: tool
  title: msprobe dump 精度数据采集（config.json 配置 + PrecisionDebugger 接口）
  summary: msprobe dump：PyTorch 精度数据采集——config.json 配 task/dump_path/rank/step/level/scope/list/summary_mode，代码里用
    PrecisionDebugger(config_path).start/stop/step 采集；输出 dump…
  applies_to:
    platforms:
    - cross
- id: msprobe-data-load
  type: tool
  title: msprobe load 精度数据覆盖加载（隔离前序累计误差）
  summary: msprobe load：用已采集的模块级（L0）输入 tensor 覆盖目标模块的实际输入，隔离前序模块累计误差、精准定位本模块及下游问题；config.json 顶层 load
    段配 path/modules/step/rank/dump_after_load；要求源 dump 与目标模型模块结构、命名严格一致
  applies_to:
    platforms:
    - cross
- id: msprobe-monitor
  type: tool
  title: msprobe monitor / monitor_v2——训练状态监测（CSV 字段与解读口径）
  summary: msprobe monitor_v2：训练过程中按需采集模块输入输出/权重梯度/优化器动量/参数分布/通信算子统计，按 rank 落 CSV（rank_<id>/<module>_step{X}-{Y}.csv）；统一表头
    vpp_stage|step|module_name|scope|指标列，各监测项有固定 sco…
  applies_to:
    platforms:
    - cross
- id: msprobe-overflow-check
  type: tool
  title: msprobe overflow_check——整网首个 NaN/Inf 节点定位（多卡）
  summary: msprobe overflow_check：对 PyTorch dump 数据定位多卡场景下每张卡首个产生 inf/nan 的节点（经通信传播的可回溯到首个异常 rank）；输出
    anomaly_analyze_{ts}.json 或打印无异常；判定口径是「输入正常而输出异常」才算溢出起点，输入已异常者是传播受害者
  applies_to:
    platforms:
    - cross
- id: msprobe-response-anomaly
  type: tool
  title: msprobe response_anomaly——推理异常检测（生僻字/乱码/重复/NaN logprobs）
  summary: msprobe response_anomaly：基于输出 token + topk logprobs 的**无参照**实时异常检测，返回 [is_ill, ill_type]（1=生僻字
    2=乱码 3=重复 4=NaN Value）；库接口 analyze_output_anomaly(topk_logprobs, …
  applies_to:
    platforms:
    - cross
- id: msprobe-visualization
  type: tool
  title: msprobe graph_visualize——分级可视化构图比对（TensorBoard 图/颜色判定）
  summary: msprobe graph_visualize：把 dump 数据还原成模型图结构，用 TensorBoard 做结构与精度双图比对；节点颜色 error>warning>pass>未匹配，判定规则按真实数据/统计数据/MD5
    三模式分列；支持溢出筛选、名称搜索、跨套件比对与多卡构图
  applies_to:
    platforms:
    - cross
- id: verl-official-image-no-hdk
  type: software-fact
  title: verl 官方昇腾 Docker 镜像不含 HDK
  summary: verl 官方昇腾镜像（quay.io/ascend/verl:*）不含 HDK，需按 install_guidance.rst 自选安装——HDK 版本与镜像组合不兼容是 verl+昇腾故障的常见根因面
  applies_to:
    platforms:
    - cross
- id: vllm-ascend-startup-triage
  type: methodology
  title: vllm-ascend 服务启动失败通用排查（跨模型：版本配套 / 量化加载 / patch 层 / 平台特化路径）
