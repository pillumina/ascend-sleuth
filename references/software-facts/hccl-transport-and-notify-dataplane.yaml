title: HCCL 数据面传输选择与 notify 同步：三类网口、HCCS / SDMA / RoCE / UB、transportType 取值
summary: 判断一条通信走的是 HCCS、SDMA、RoCE 还是 UB，以及为什么跨机比机内慢、同步为什么不用 TCP 时看这条。

