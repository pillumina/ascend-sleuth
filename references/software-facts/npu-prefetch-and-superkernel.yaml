content:
  claim: "**① Prefetch 的适用前提（不是通用加速开关）**：①profiling 已确认目标算子是 **memory-bound**、瓶颈主要来自权重搬运；②目标权重足够大，提前搬运能覆盖可观的 HBM 读取开销；③目标算子前存在**安全的依赖窗口**，且窗口本身不会被预取明显拖慢；④**单点 profiling 能解释收益来源**，而不是只观察到端到端指标的随机波动。Decode 阶段的典型特征是输入 token 少、batch 小，MatMul、QuantBatchMatmul(QBMM)、GroupedMatmul(GMM) 的计算量不一定能打满计算资源，但每次仍需读取体量很大的权重（`W` 可能到几十 MB，常驻 HBM），此时算子耗时由读权重主导。**典型预取目标**：`q_proj`、`o_proj`、`gate_up_proj`、`down_proj` 这类 MatMul/GMM；**LayerNorm、RMSNorm、ROPE、SwiGLU、router topk、dispatch、combine 通常不是预取目标，而是可能提供预取窗口的前序算子**。**② 接口与参数语义**：`torch_npu.npu_prefetch(weight, depend, size, offset)`——`weight` 传目标算子的 `.weight.data` 或专家权重 `.data`；`depend` 是约束预取开始时机的依赖 Tensor（须在目标算子之前稳定产生、能表达预取开始时机）；`size` 是本次最多预取的字节数（**从保守值开始，按 profiling 调整**）；`offset` 为权重内预取起始偏移（当前实践通常用 0）。一次有效预取的过程：前序算子产生 `depend` 且主流继续推进 → 预取流在 `depend` 之后开始搬运 `weight` 的前 `size` 字节 → 搬运结果进 L2 等片上缓存 → 目标算子启动后优先消费已预取的权重 → **未覆盖的权重仍按原路径从 HBM 读取**（预取只提前一部分）。**③ size 估算**：先按权重大小算理论值再从保守比例验证；dtype 字节数 int8=1、fp16/bf16=2、fp32=4。`q_proj`/`o_proj`（`hidden_size × hidden_size`，bf16）理论 `H × H × 2`、**首次建议 `H × H`**；`gate_up_proj`（`hidden_size × intermediate_size × 2`）理论 `H × I × 4`、**首次建议 `H × I × 2`**；`down_proj`（`intermediate_size × hidden_size`）理论 `I × H × 2`、**首次建议 `I × H`**。**size 过小收益有限；过大会抢占 HBM 带宽，导致依赖窗口或其他 Stream 退化**。**④ 流管理随执行模式不同**：eager / `ge_graph` 模式下模型代码**直接调用** `torch_npu.npu_prefetch` 即可（不需要手动创建 `torch.npu.Stream()`，也不建议额外包一层手写 Stream/Event，否则容易引入不必要的同步等待），预取开始时机由 `depend` 表达；**`npugraph_ex` 模式下图捕获边界与流复用需要更明确，必须由模型侧显式创建并持有预取流**（如模型初始化时建 `npugraph_prefetch_stream`），调用时先判断该流存在、再 `npu_stream_switch` 切到预取流发起 prefetch；若预取依赖当前流上的某个事件，需在预取流上等待该事件（确保不早于依赖数据产生）；**npugraph_ex 整网执行末尾通常还需让主流等待预取流收尾**，避免后续阶段过早复用相关资源。收益取决于窗口稳定性——**若多流、AFD、npugraph_ex 或图模式策略改变了层内时序，需要重新 profiling**。**⑤ SuperKernel 是什么**：面向模型计算图的**调度优化技术**，本质是**算子二进制融合**（与源码融合不同）——基于计算图中算子的先验信息（算子类型、前后序依赖）与即时编译（JIT）能力，突破传统算子融合规则的限制，把多个算子编译成一个 SuperKernel 整体调度执行，从而减少算子间调度等待与开销，并利用 Task 间隙资源降低算子启动开销。**⑥ 算子级四类优化**：**ICache Preload**——运行系统通常只预取 SuperKernel 入口点指令，子 Kernel 代码段往往无法被硬件预取机制有效捕获，导致 ICache Miss；于是在当前子 Kernel 执行完毕前，**以 2KB 对齐**提前把下一个即将执行的子 Kernel 代码段预取进 ICache，把指令加载延迟隐藏在当前子 Kernel 执行过程中。**Early-Start**——常规调度必须等前序算子全部执行完才启动后续算子，但多数前序算子末尾是 MTE（内存传输引擎）搬运指令、后续算子起始是与输入数据无关的初始化标量指令，两类指令分属不同计算单元可并发；在前序搬运指令**前**插 Set 同步点、在后续初始化指令**后**插 Wait 同步点，实现两个子算子的部分指令并发。**同步优化**——各子算子调度之间会插全核同步；对 Kernel Type 为 **Mix 1:2**（1 个 Cube 核对应 2 个 Vector 核）的混合算子，完整全核同步要等所有 AI Core 的 Vector 与 Cube 核都到同步点；SuperKernel 在编译时能识别每个子算子类型，因此可针对前后子算子定制同步范围（例如连续的 Vector 算子只需全 Vector 核同步），降低子算子间同步开销。**子 Kernel 复制**——多核执行同一段代码会并发访问同一指令地址，在共享 L2 Cache 层形成串行化访问队列、引发资源争用、削弱多核并行增益；把子 Kernel 代码复制多份，使不同核心按核 ID 映射到不同物理地址执行。**⑦ 网络级两类优化**：**Tiling 下沉与 Weight 预取**——用基于内存语义的 `Notify`/`Wait` 事件适配：Tiling 下沉算子指 Tiling 计算依赖前序算子输出、为免主机与设备频繁交互而把 Tiling 计算放到 AICPU 执行的算子；若 SuperKernel 融合了它的**前序**算子，则需在前序算子执行完后用 `Notify` 通知 AICPU 启动 Tiling 计算；若融合了该 Tiling 下沉算子**本身**，则需用 `Wait` 等 AICPU 完成 Tiling 后再执行 Device 侧计算。Weight 预取则借 **CMO（Cache Management Operation）任务调用专用硬件单元 SDMA** 把数据提前加载进 L2，SDMA 与 AI Core 的协作同样通过内存语义的 `Notify`/`Wait` 实现。**双流并发融合**——用多流实现 Cube/Vector 并发后，若简单转换为 SuperKernel 时不感知依赖、仅按执行顺序处理，**SuperKernel 内部执行会退化为串行**、收益不及预期；做法是按类型分类、在 SuperKernel 内部按 Cube 与 Vector 特性分配执行队列，并结合流属性与 Event 精准插入同步点。**⑧ 使能与五条约束**：npugraph_ex 后端在 `torch.compile` 的 `options` 里设 `super_kernel_optimize=True` 开启，用 `super_kernel_scope_begin/end` 标定融合范围（**该模式下开启 SuperKernel 融合优化时必须同时开启静态 Kernel 编译功能**）；GE 图模式后端用 `torchair.scope.super_kernel` 标定（`scope` 为融合后的 SuperKernel 名称，相同 `scope` 属同一融合范围；`scope=None` 表示该作用域内算子不做融合）并配合 TorchAir 的 `CompilerConfig`（**要求使用静态图，且 with 语句块内不支持断图**）。约束：编译器按算子执行顺序依次识别可融合性，**遇到 TBE（Tensor Boost Engine）等不可融合算子会把它前面已识别的连续可融合算子组成一段 SuperKernel，跳过该算子后继续向后识别下一段**；**目前支持融合的通信类算子包括 AllReduce、ReduceScatter、AllGather、AlltoAll**；**开启 SuperKernel 融合优化后会禁用算子 Data Dump 功能**（要 dump 就得先关掉它）。"
  evidence: "prefetch_principles.md：『Prefetch 不是通用加速开关。只有满足下面条件时才值得尝试：1. profiling 已确认目标算子是 memory-bound，瓶颈主要来自权重搬运。2. 目标权重足够大…3. 目标算子前存在安全的依赖窗口，且窗口本身不会被预取明显拖慢。4. 单点 profiling 能解释收益来源，而不是只观察到端到端指标的随机波动』『典型目标包括 q_proj、o_proj、gate_up_proj、down_proj 等这些 MatMul 或 GMM 算子。LayerNorm、RMSNorm、ROPE、SwiGLU、router topk、dispatch、combine 等通常不是预取目标，而是可能提供预取窗口的前序算子』参数表（weight/depend/size/offset 的设计要求）、dtype 字节数表与常见算子估算表（含『首次建议』列）、『过小收益有限，过大会抢占 HBM 带宽，导致依赖窗口或其他 Stream 退化』『eager / ge_graph 模式下，模型代码直接调用 torch_npu.npu_prefetch 即可，不需要手动创建 torch.npu.Stream()…接入时不建议额外包一层手写 Stream / Event 逻辑，否则容易引入不必要的同步等待』『npugraph_ex 模式下，图捕获边界和流复用需要更明确，需要手动创建 prefetch 操作的流』『在 npugraph_ex 的整网执行末尾，通常还需要让主流等待预取流收尾』『如果多流、AFD、npugraph_ex 或图模式策略改变了层内时序，需要重新 profiling』。super_kernel.md：『SuperKernel 是一种算子二进制融合技术。与源码融合不同，它聚焦于内核函数（Kernel）的二进制调度优化』ICache Preload 段『以 2KB 对齐的方式，提前将下一个即将执行的子 Kernel 代码段预取到 ICache 中』、Early-Start 段『在前序算子的搬运指令前插入 Set 同步点，在后续算子的初始化指令后插入 Wait 同步点』、同步优化段『对于 Kernel Type 为 Mix 1:2（即 1 个 Cube 核对应 2 个 Vector 核）的混合类型算子，完整的全核同步需等待所有 AI Core 的 Vector 核与 Cube 核均到达同步点』、子 Kernel 复制段『将子 Kernel 代码复制为多份，使不同核心能根据核 ID 映射到不同的物理地址执行』、网络级段（Tiling 下沉的 Notify/Wait、Weight 预取经 CMO 调用 SDMA、双流并发融合退化与按类型分队列）、使能段（npugraph_ex 的 super_kernel_optimize 与 scope 标定、GE 的 torchair.scope.super_kernel 与 scope=None 语义）与约束段『若遇到 TBE（Tensor Boost Engine）等不可融合算子，则会将其前面已识别的连续可融合算子组成一段 SuperKernel，同时跳过该不可融合算子，继续向后识别并组成下一段 SuperKernel』『目前支持 SuperKernel 融合的通信类算子包括 AllReduce、ReduceScatter、AllGather 和 AlltoAll』『在 npugraph_ex 图模式下，开启 SuperKernel 融合优化时需要同时开启静态 Kernel 编译功能』『GE 图模式要求使用静态图，且 with 语句块内不支持断图』『开启 SuperKernel 融合优化后，将禁用算子 Data Dump 功能』"
