id: npu-prefetch-and-superkernel
type: software-fact
title: NPU 权重预取（npu_prefetch 的四个前提、size 估算、npugraph_ex 需显式预取流）与 SuperKernel（二进制融合的四类算子级优化与五条约束）
summary: "两项 Decode 性能优化的机制与判据。**Prefetch**：Decode 小 batch 下 MatMul/QBMM/GMM 常是 memory-bound（耗时为读权重主导，weight 常驻 HBM 数十 MB、激活很小），`torch_npu.npu_prefetch(weight, depend, size, offset)` 借独立预取流把后续算子的 weight 从 HBM 提前搬入 L2，使目标算子启动后少等 HBM 读取。**四条适用前提**（缺一不值得做）：profiling 已确认目标算子是 memory-bound 且瓶颈来自权重搬运、目标权重足够大、目标算子前存在安全的依赖窗口且窗口本身不被预取明显拖慢、单点 profiling 能解释收益来源（而不是只看端到端波动）。典型目标 `q_proj`/`o_proj`/`gate_up_proj`/`down_proj`；LayerNorm/RMSNorm/ROPE/SwiGLU/router topk/dispatch/combine **不是目标算子而是提供预取窗口的前序算子**。**size 估算**：按 dtype 字节数（int8 1、fp16/bf16 2、fp32 4）算理论大小后从保守比例起调——`q_proj`/`o_proj` 理论 `H×H×2`（bf16）、首次建议 `H×H`；`gate_up_proj` 理论 `H×I×4`、首次 `H×I×2`；`down_proj` 理论 `I×H×2`、首次 `I×H`；**size 过小收益有限、过大会抢占 HBM 带宽并拖慢依赖窗口或其它流**。**流管理随执行模式不同**：eager/ge_graph 直接调接口即可（不建议再手写 Stream/Event，否则引入多余同步等待）；**npugraph_ex 必须由模型侧显式创建并持有预取流**，切流发起预取、在预取流上等待依赖事件，并在整网执行末尾让主流等待预取流收尾。**SuperKernel**：面向计算图的**二进制融合**（区别于源码融合）——基于算子先验信息与 JIT，突破传统融合规则把多个算子编译成一个 SuperKernel 整体调度，降低算子间调度开销并利用 Task 间隙。算子级四类优化：**ICache Preload**（子 Kernel 代码段常无法被硬件预取捕获而 ICache Miss，在当前子 Kernel 执行完毕前按 **2KB 对齐**预取下一个子 Kernel 代码段以隐藏指令加载延迟）、**Early-Start**（前序算子末尾指令多为 MTE 搬运、后续算子起始多为与输入无关的初始化标量指令，两者分属不同计算单元可并发——在前序搬运指令前插 Set、后续初始化指令后插 Wait 使部分指令并发）、**同步优化**（子算子间插全核同步，对 Mix 1:2 这类混合算子完整同步需等所有 Vector 与 Cube 核到达；编译器按前后子算子 Kernel Type 定制同步范围，如连续 Vector 算子只需全 Vector 核同步）、**子 Kernel 复制**（多核执行同一段代码会并发访问同一指令地址，在共享 L2 层形成串行化访问队列、削弱并行增益；把子 Kernel 复制多份让不同核按核 ID 映射到不同物理地址）。网络级两项：**Tiling 下沉与 Weight 预取**（用内存语义 Notify/Wait 适配——融合了 Tiling 下沉算子的前序算子后需 Notify 通知 AICPU 启动 Tiling 计算，融合了该算子本身则需 Wait 等 AICPU 完成；Weight 预取借 CMO 任务调用 SDMA 把数据提前load入 L2，SDMA 与 AI Core 的协作也靠 Notify/Wait）、**双流并发融合**（多流实现 Cube/Vector 并发后，若 SuperKernel 只按执行顺序处理而不感知依赖，内部会退化为串行；需按类型分执行队列并结合流属性与 Event 精确插同步点）。使能与**五条约束**：npugraph_ex 下用 `options` 的 `super_kernel_optimize=True` 开启、`super_kernel_scope_begin/end` 标定范围（**须同时开启静态 Kernel 编译功能**）；GE 图模式下用 `torchair.scope.super_kernel` 标定 + `CompilerConfig`（**要求静态图且 with 语句块内不支持断图**，`scope=None` 表示该作用域不融合）；编译器按执行顺序识别可融合性，**遇到 TBE 等不可融合算子会截断成段**（前面已识别的连续可融合算子组一段 SuperKernel，跳过该算子继续识别下一段）；**当前支持融合的通信算子仅 AllReduce、ReduceScatter、AllGather、AlltoAll**；**开启 SuperKernel 后会禁用算子 Data Dump**。"

