id: runtime-first-setdevice-latency
type: software-fact
title: 首次 aclrtSetDevice 秒级时延的构成（算子包搬移 + 每进程独立 aicpu_scheduler + 并发竞争）
summary: "业务进程**首次**调用 aclrtSetDevice 有明显秒级时延、后续调用降到毫秒级，成因有三条且性质不同：①**算子包搬移**——首次调用时 Runtime 把业务所需算子包从 Host 侧传输并部署到 Device 侧，耗时与算子包大小正相关；搬移成功后结果缓存在 Device 侧，**版本一致的后续进程不重复搬移**（所以新进程首次调用会显著变快）；②**aicpu_scheduler 进程拉起**——首次调用时 Runtime 为该业务进程拉起 Device 侧的 AICPU 任务调度进程，各业务进程的 aicpu_scheduler **相互独立、不可共享**，每个进程都要各自拉起，这部分开销**无法靠其他进程预热消除**；③**并发与负载竞争**——多进程同时调用会让搬移与拉起相互竞争并受 Device 负载影响，耗时出现抖动。缓解：启动阶段用轻量进程先做一次 aclrtSetDevice 完成搬移预热（把成本前置到非关键路径）、错峰初始化、初始化前避免向 Device 下发大量计算。"

