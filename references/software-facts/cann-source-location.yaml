id: cann-source-location
type: software-fact
title: CANN 源码位置（gitcode 的 cann 组织：82 仓、匿名可枚举的清单 API、仓与层的对应、版本号即 CANN 发布号）
summary: "CANN 已开源，源码在 **gitcode 的 cann 组织**（https://gitcode.com/cann/）：2026-09 实测 **82 个公开仓**，且仓库清单**匿名可枚举**——`https://gitcode.com/api/v5/orgs/cann/repos&page=N`（无需 token，`per_page` 上限 100，超出报 `PARAMETER_EXCEEDED`）。**这条决定了『源码在哪』是可以查的，不是只能问人**。按报错签名定位到层的对应关系：`aclnn*` 算子接口 → 四条算子库 `ops-nn`（神经网络）/`ops-transformer`/`ops-math`/`ops-cv`；`Hccl*`、通信域/rank 表 → `hccl`（集合通信库），更底层通信资源 → `hcomm`；`ge::` → `ge`（图编译器与执行器）；算子原型/属性注册 → `metadef`；`aclrt*`/`plog` → `runtime`；`drv*` → `driver`；`AscendC::`/`atvc`/`atvoss` → `asc-devkit`；Python 算子接口 → `pyasc`；AI Core Error 分析工具 → `oam-tools`。**版本 tag 就是 CANN 发布号**（`v9.1.1`、`v9.2.0-beta.1`），且**各仓共用同一套版本号**——所以『tag 能解析』只能证明版本存在，**不能唯一定位到哪个仓**；定位靠报错栈里的命名空间/接口前缀。镜像内改过的代码按冻结 commit 取，不能按 tag 推断。"

