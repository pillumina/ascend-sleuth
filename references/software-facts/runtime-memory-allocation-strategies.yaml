id: runtime-memory-allocation-strategies
type: software-fact
title: Runtime 内存分配策略与页类型（4K/2M/1G、≤1M 时 HUGE_FIRST 退化普通页、P2P 后缀策略、IPC 页表对齐）
summary: "选 aclrtMalloc 策略时的四条硬事实：①页类型——普通页 4K 适合小块/短生命周期/数量多的申请（减少对齐浪费），2M 大页适合大块/长期驻留/频繁访问（减少页表项、扩大 TLB 覆盖），1G 大页适合超大块、长期驻留、性能敏感场景（部分产品支持）；②策略语义——`ACL_MEM_MALLOC_HUGE_FIRST` 优先大页、不足退回普通页（推荐），`HUGE_ONLY` 仅大页、不足即报错，`NORMAL_ONLY` 仅普通页；按大小选（≤1M 用 NORMAL_ONLY 或 HUGE_FIRST，>1M 用 HUGE_FIRST）；**申请大小 ≤1M 时即使配 HUGE_FIRST 也走普通页**；③P2P 场景——跨 Device 复制要用带 `_P2P` 后缀的策略（HUGE_FIRST_P2P / HUGE_ONLY_P2P / NORMAL_ONLY_P2P），使内存属性与跨 Device 访问路径匹配；④IPC 共享——进程间共享内存要求页表对齐（普通页 4K、大页 2M/1G），aclrtMalloc 可能从更大底层块切分导致未对齐而被 IPC 接口拦截，需改用大页或 VMM。频繁申请释放会带来明显性能损耗，应预分配内存池复用。"

