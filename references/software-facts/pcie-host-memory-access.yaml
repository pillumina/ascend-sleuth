id: pcie-host-memory-access
type: software-fact
title: PCIe Through 判定（Host 内存直算强制 SIMD Tiling）与三条件检查
summary: "PCIe Through 是零拷贝通路：Device 可直接访问 Host 内存（或反向），省掉显式 `Memcpy`。判定需**三个条件同时满足**——`OP_PCIE_THROUGH_ACCESS_HOST_MEM_CHECK_ENABLE=1` 开启特性、`aclrtGetDeviceInfo(..., ACL_DEV_ATTR_HD_CONNECT_TYPE, ...)` 查得 `ACL_HOST_DEVICE_CONNECT_TYPE_PCIE`、`aclrtHostRegister(ptr, size, ACL_HOST_REGISTER_MAPPED, &devPtr)` 注册映射。命中后算子内部（如 GatherV2）**强制走 `TILING_SIMD`**，且结果直接写 Host 内存、无需 D2H 拷贝"

