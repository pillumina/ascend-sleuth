id: atb-dispatch-bound-and-runtime-optimizations
type: software-fact
title: ATB 算子下发链与 Host/Device Bound 判据（下发六步、Tiling 影响可达 10×、Tiling Cache 与 Setup 复用、Workspace 省 50%）
summary: "判断推理性能瓶颈在 Host 还是 Device，以及 ATB 为此做什么。**两种瓶颈的判据**：Host Bound —— Host 下发较慢、Device 执行较快，**在 profiling 图上表现为 Stream 上的 Kernel 之间存在空泡**，此时设备算力未被充分利用、应优化 Host 端下发；Device Bound —— Host 下发快、Device 执行慢，设备算力已充分利用，**继续优化只能改 kernel**。**单个算子的下发六步**：①合法性检查（校验输入输出与参数，避免错误参数提交到 Device）→ ②InferShape（由输入 shape/dtype 推输出 shape/dtype，如 M×K 与 K×N 推出 M×N）→ ③**计算 Tiling**（单核一次处理的数据有限，需把输入切块计算：先按核数对 M/K/N 做**多核切分**得 singleCoreM/N/K，再按 Local Memory 约束做**核内切分**得一次矩阵乘指令的 baseM/baseN/baseK，结果存进自定义 Tiling 结构体；**Tiling 策略对复杂算子性能影响巨大，同一算子在不同 Tiling 策略下可能有 10 倍性能差异**）→ ④获取 Workspace 大小（算子内部借 HBM 做数据交换或缓存的空间）→ ⑤分配 Workspace（**ATB 与 aclnn 这类两段式算子接口由执行框架如 TorchNPU 分配**，以便统一管理整模型执行期的 HBM、提高分配效率）→ ⑥封装 argument list（输入输出 Tensor 地址、Tiling、Workspace 地址与其他参数）并调 Launch Kernel。**ATB 的三类针对性优化**：**定制化融合算子**（PageAttention、Linear 等面向主流模型设计的高性能融合算子）；**轻量级组图**（用这些或第三方算子组图后像操作单算子一样操作『图算子』，便于跨模型/跨 layer 复用；图算子只是单算子组合、**不涉及 Kernel 融合**，因此 Setup/Execute 与单算子类似，区别仅在 Setup 阶段做 Workspace 优化）；**运行时优化**——**Tiling Cache**（缓存算好的 Tiling 以存代算，**默认每个算子保存 10 份**；Shape 相同即避免重复计算）、**Setup 复用**（每算子执行上下文保存上次的 Tensor/Tiling/Workspace size 信息，**某次执行 Shape 与上次完全相同则直接复用上下文、跳过整个 Setup 阶段**；两种优化对图算子与单算子都适用）、**内存优化**（Setup 阶段尽可能复用 HBM——同流内算子顺序执行所以前一个的 Workspace 可给后一个用；图算子内部中间 Tensor 只要最后一个使用者执行完即可释放——**平均节省 Workspace 50%**，提升大模型推理 batch size 上限）、**下发优化**（图算子批量 Setup 与批量下发减少 NPU 空泡，组图模式自动生效；**进一步用双线程分别做批量 Setup 与批量 Execute，同时减少 host 时间与 NPU 空泡，官方推荐**）。另记一条构建期常见问题：提示 `libtbe_adapter.so does not exist` 需安装 **nnal** 软件包（版本须与 toolkit/kernels 一致），并设置 `ATB_BUILD_DEPENDENCY_PATH` 指向 `cxx_abi_0` 或 `cxx_abi_1`——**未安装 PyTorch 用 `cxx_abi_1`；已安装 PyTorch 时按 torch 的 C++ ABI 探测结果（输出 1 用 abi_1、输出 0 用 abi_0）**，且必须与编译实际使用的 ABI 一致。"

