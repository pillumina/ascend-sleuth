content:
  claim: "见 summary。三条判读要点：**① Host Bound 的唯一图面证据是「Stream 上 Kernel 之间的空泡」**——在 profiling 时间线上看到 Kernel 块之间有间隙，就应先怀疑 Host 下发（Python 前向、算子 Setup、Tiling 计算、Workspace 分配等链路），而不是先改 kernel；反过来 Device Bound 时改 Host 无益。这与图模式（消除逐算子下发）和 ATB 的批量下发优化针对的是同一件事，可互相印证。**② Tiling 是算子侧最大的单点变量**——同一算子在**不同 Tiling 策略下可能有 10 倍性能差异**，因此「同一个 kernel 在两处跑出差异很大的耗时」应先查 Tiling 是否随 shape/核数变化（多核切分与核内切分两层的取值），而不是怀疑硬件。**③ Tiling Cache 与 Setup 复用的判据是 Shape 稳定性**——默认每算子缓存 10 份 Tiling、上下文复用要求「某次 Shape 与上次完全相同」，因此**shape 抖动会直接击穿这两项优化**（每次都要重算 Tiling 甚至走完整 Setup）；这与图模式要求输入 shape 与常驻 buffer 地址稳定的结论一致。"
  evidence: "ATB加速原理.md：『Host Bound：Host下发较慢， 设备侧（NPU）执行算子较快， Host执行效率成为整体性能瓶颈。在profiling图上， 表现为Stream上的Kernel间存在空泡』『Device Bound： Host下发较快， Device执行较慢， Device执行效率成为性能瓶颈…则需要考虑优化kernel』下发六步逐条（合法性检查 / Infer Shape / 计算 Tiling（『首先要进行多核切分…接着要进行核内切分…得到A、B、C矩阵参与一次矩阵乘指令的Shape大小baseM、baseN、baseK』）/ 获取 Workspace 大小 / 分配 Workspace（『对于ATB和aclnn这样的两段式算子接口来说， 这个步骤一般由执行框架（如TorchNPU）进行分配』）/ 算子下发）、『Tiling策略对复杂算子的性能影响巨大， 同一个算子在不同Tiling策略下可能有10倍性能差异』；ATB 工作原理三条（定制化融合算子 / 轻量级组图 / 运行时优化）与『由于ATB中图算子只是单算子的组合，不涉及Kernel融合， 因此图算子的Setup和Execute过程与单算子类似， 区别仅在于Setup阶段进行了Workspace优化』；运行时优化段『使用一个Cache保存一个算子常用的多份Tiling信息（默认每个算子保存10份）』『如果某次执行的Shape与上次完全相同，则可以直接复用上下文， 跳过整个Setup阶段』『图算子的Workspace size比内部单算子Workspace size的总和要小』『一个流中的算子Kernel是顺序执行的， 所以前一个算子的Workspace可以给后一个算子使用』『平均节省Workspace 50%，提升大模型推理Batch Size上限』『基础优化：ATB通过图算子批量进行算子Setup和任务下发，可有效减少NPU空泡』『双线程下发优化（推荐使用）：通过双线程分别进行算子批量Setup和批量任务下发，可以同时减少host执行时间和NPU空泡』。常见问题与回答.md：『提示libtbe_adapter.so does not exist 您可通过安装nnal软件包解决该问题』『nnal软件包需保持和toolkit及kernels软件包版本一致』『未安装 PyTorch：使用cxx_abi_1』『已安装 PyTorch：运行下面命令，输出1用cxx_abi_1，输出0用cxx_abi_0』"
