id: msprof-collection-mechanism-and-metric-semantics
type: software-fact
title: msprof 采集链路与指标口径（task-time 三级别与膨胀、task-based vs sample-based PMU、aicore_time 调频误差与 950 syscnt、l2 开关的 postp 中断）
summary: "读 msprof 数据前要知道的四件事：①**采集链路**——命令行/多种使能方式统一收敛为 `ProfileParams`，Host 侧由 runtime/GE/HCCL 回调上报（经无锁缓冲，上报与落盘解耦），AICPU 侧由 Device 上的 aicpu 进程与集合通信进程上报，Device 侧经 `prof_drv_start` 打开驱动通道、`ChannelPoll` 轮询；芯片差异由 Platform 抽象决定「支持哪些特性、哪些 metrics 对应哪些 PMU 事件」；部署上 `profapi.so` 是接口层（Host/Device 归一，dlopen 加载实现层 `profimpl.so`，生产态不采集时可只部署 profapi 以省体积）。②**task-time 的口径与膨胀**——op summary 的 task duration = `taskid` 关联的「host 下发上报（taskid/streamid/kernelname）」+「NPU 调度上报（调度开始/结束时间）」，因此**除算子实际执行时间外还含调度耗时**；`l0/l1/l2` 三级别按 host 上报的数据量分级（l0 仅 runtime 的 taskid/streamid/kernelname，l2 还含 aclnn/GE/hccl 上报的 shape/attr），上报越多打开 profiling 后的性能膨胀越大。③**AICore metrics 两种模式**——task based：算子执行结束后由调度单元读走 PMU 寄存器、下一个算子重新计数；sample based：PMU 持续累积、tsfw 周期采集。④**aicore_time 的误差来源与消除**——Ascend950 之前用总 cycle 数、AICore 频率与 block dim 计算，**执行过程中若 AICore 调频则误差较大**；950 起 AICore 新增记录起始 syscnt 的寄存器，用最早执行的 AICore 的 syscnt 与结束调度 syscnt 相减再除 NPU 频率，故不再因调频产生误差。另记一个会改变被测对象的开关：**l2** 采集打开后 runtime 会给 AICore 算子自动设置 postp 中断标志，调度单元执行完算子触发 postp 中断给 tsfw 读寄存器，**对调度性能有较大影响**。"

