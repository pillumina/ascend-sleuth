content:
  claim: "**① HiF8 格式（自研 8-bit 浮点，兼顾动态范围与精度）**：字段结构为**符号 S（1 bit）+ 点位 Dot（2~4 bit）+ 阶码 E（D 位）+ 尾数 M（1~3 bit）**。点位域采用前缀编码，Dot 编码值 D∈{0,1,2,3,4}，`0000` 为 **DML（Denormal 模式）**。阶码用**符号-幅度（Sign-Magnitude）编码**且把幅值最高位设为**隐含位**（不占存储），因此不同位宽阶码的指数范围互不重叠、实现**无冗余编码**：Dot=1 时 E 只能取 ±1，Dot=2 时取 ±[2,3]，以此类推，0~4 五种位宽阶码共编码 [-15,15] 的指数。设计上**用大位宽 Dot 域匹配小位宽（小幅值）阶码域**，使尾数精度**平滑渐变而非断层跳变**（E∈[-3,3] 有 3-bit 尾数，随阶码幅值变大才收缩到 1-bit）——这是 HiF8 相对其借鉴对象 Posit 的关键优势。**Denormal 模式**不保留独立阶码域，而是**复用原 3-bit 尾数空间（0~7 共 8 个离散值）映射并扩展极小值指数**，在 Normal 的 [-15,15] 之外新增 [-22,-16] 共 7 个指数（其中编码 0 对应 -23，用于表示特殊值 Zero 与 NaN）；由此综合指数范围达 **[-22,15] 共 38 个**，已很接近 FP16 的 [-24,15]（约 40 个），且新增区间对应 0-bit 尾数与原有 1-bit 尾数区在精度上连续过渡。**特殊值**：Zero=`00000000`(`0x00`)、NaN=`10000000`(`0x80`)、±Inf=`X1101111`(`0x6F`/`0xEF`)；**HiF8 不区分正 0 与负 0**（单一编码，节省编码空间）。三大特性：**契合数据分布的锥形精度**（把更高精度集中在高频数值区间）、**无冗余编码**、**大动态范围**。**② 量化与粒度**：高精度→低比特的核心是缩放，`Scale = Amax / F8max`（F8max 为目标格式最大值，如 FP8-E4M3 为 448），缩放后 `X_scaled = X · Scale`。为抑制量化损失，业界多用**细粒度量化**——激活值按 **Per-Token**（不同 Token 动态范围差异大、有离群值），权重按 **Per-Channel / Per-Block**（不同通道/块分布不同；**典型 Block 大小 128×128**）；但这会引入大量缩放因子，带来额外访存带宽与控制逻辑开销，部分抵消 8-bit 的加速。**因为 HiF8 动态范围更大，训练中往往可以用粗粒度 Per-Tensor 量化，而 FP8、MXFP8 往往需要 Per-Block 量化**。**③ 训练方案与缩放策略**：BF16 基线（1-bit Sign + 8-bit Exponent + 7-bit Mantissa，动态范围与 FP32 相同）配 AMP——计算密集算子（MatMul、Convolution）输入下采样为 BF16，数值敏感算子（Softmax、LayerNorm、Loss）保持 FP32，优化器另维护 FP32 主权重（master weights）避免更新停滞。8-bit 训练的两类缩放：**Current Scaling** 每步遍历输入求 Amax 并据此缩放，求 Amax 与算 Scale 每步都要做且与下游 MatMul 串行，**部分抵消 8-bit 收益**；**Delayed Scaling** 用历史统计值估计当前步 Amax（`interval = K iterations` 为周期，含防止上溢的保护参数 `N_guard`），把求 Amax 与后续运算解耦。**常用 FP8-E4M3 因动态范围小往往需细粒度 Current Scaling，而 HiF8 因动态范围与精度的平衡可用 Delayed Scaling 并以较长周期估计 Amax 仍保持稳定**。**④ 低精度框架与支持范围（MindSpeed / MindSpeed LLM + TE）**：TE 模块与官方 Transformer Engine 接口兼容；核心是把 Fprop、Dgrad、Wgrad 中的通用矩阵乘量化为 FP8/HiF8 执行——整体仍是 BF16/FP16 的 AMP 流程，仅 Linear 层的矩阵乘（含 Fprop/Dgrad/Wgrad）走低精度路径；实现上 `TERowParallelLinear`/`TEColumnParallelLinear` 对应 Linear 层、`FP8GlobalStateManager` 单例维护全局 FP8 状态与各 TE Module 运行信息、各 Recipe 类执行不同量化策略并管理 Scale 与数据张量。支持的量化策略包括 Delayed / Tensorwise（在线算 Amax 实时缩放）/ Blockwise（分块算 Amax）/ MX（块级共享 Scale + 低位宽元素）。**参数组合支持矩阵（✅支持 / ❌不支持 / 回退与路径说明）**：FP8+Delayed → MatMul ✅、GroupedMatMul 走 Tensorwise 路径、TP-MC2(通算融合) ❌、MatMul Add ❌、GroupedMatMul Add ❌；FP8+Tensorwise → MatMul ✅、GMM ✅，其余 ❌；FP8+Blockwise → MatMul ✅、GMM **回退 BF16**，其余 ❌；FP8+MXFP8 → MatMul ✅、GMM ✅、**TP-MC2 ✅、MatMul Add ✅、GroupedMatMul Add ✅**（支持面最广）；HiF8+Delayed → MatMul ✅、GMM 走 Tensorwise 路径；HiF8+Tensorwise → MatMul ✅、GMM ✅。**⑤ 950DT 实测与收益来源**：实验为 950DT-8P（单卡算力 486 TFLOPS）、裁剪版 DeepSeek-V3、**仅对整网 MM 与 GMM 算子量化**（其余数值敏感算子保持高精度以保证稳定性）、量化覆盖范围一致以便公平对比。结果：**BF16 单步 3.63629095s、MXFP8 3.12526599s（+14.05%）、HiF8 2.80796152s（相对 BF16 +29.5%，相对 MXFP8 +11.3%）**；HiF8 与 BF16 的损失曲线及 Gradient Norm 基本对齐，MXFP8 同理；**HiF8 相对 BF16 的 MM 与 GMM 算子平均加速比超过 1.8 倍**。收益来源：相对 BF16 是**位宽减半的访存收益**（降低片上内存带宽压力、同容量缓存可容纳更多数据提高复用、减少层级间搬运延迟）与 **8-bit 计算路径的吞吐优势**（硬件对 8-bit 矩阵运算专门优化）；相对 MXFP8 是**缩放元数据开销更低**（Per-Tensor 减少缩放因子数量与访存）、**控制逻辑更简单**（Per-Block 需处理块边界切换、局部反量化、跨块 Scale 对齐，增加复杂度并影响算子融合与流水）、**更适合 Delayed Scaling**（动态范围大使 Amax 统计频率更低、Scale 更新与同步操作更少、对主计算干扰更小）。**注**：当前收益是**部分算子量化**条件下的端到端收益，扩展到更多适合低比特量化的算子后仍有提升空间。"
  evidence: "deepseek-v3_pre_train_hif8_mxfp8.md：第一章字段结构表（S 1 bit / D 2~4 bit / E D 位符号-幅度 / M 1~3 位）、Dot 编码表（11→4、10→3、01→2、001→1、0001→0、0000→DML）、『当 Dot = 1，阶码 E 只能等于 ±1，不包含已经编码的 0；Dot = 2 时，阶码 E 只能表示 ±[2, 3]…共编码了 [-15, 15] 的指数，且彼此之间不重复，实现了无冗余编码』『HiF8 采用大位宽的 Dot 域匹配小位宽(小幅值)阶码域的设计，从而实现了尾数精度的平滑渐变而非断层式跳变…正是 HiF8 优于其借鉴对象 Posit 数据格式的关键所在』Denormal 段『原有的 3-bit 尾数空间（可编码 0~7 共 8 个离散值）将被直接复用，以映射并扩展极小值的指数表示范围』『Denormal 模式额外开辟了 [-22, -16] 共 7 个指数。其中，编码 0 对应 -23，用于表示特殊值 Zero 和 NaN』『HiF8 实现了覆盖 [-22, 15] 共 38 个指数的大动态范围，已经非常接近 FP16 的 [-24, 15]』特殊值表（0x00/0x80/0x6F/0xEF）与『HiF8 不区分正 0 和负 0』；第二章『Scale = Amax/F8max』『Per-Token 缩放为每个输入 Token（或 Tile）应用一个独立的缩放因子』『典型的 Block 大小可设为 128 × 128』『由于 HiF8 具备更大的动态范围，在训练中往往可以采用粗颗粒度的 Per-Tensor 量化，而 FP8、MXFP8 等格式往往需要 Per-Block 量化』；第三章 BF16/AMP 段与『Current Scaling 在每个训练步都遍历输入 X 中的高精度数据，获得最大绝对值 Amax…求取 Amax 与计算 Scale 的过程在每次迭代中都需要执行，且与下游计算（如 MatMul）串行，从而部分抵消 8-bit 带来的性能收益』『Delayed Scaling 利用历史统计值对当前训练步的 Amax 作估计…其中 N_guard 为防止上溢的保护参数』『常用于 8-bit 混合精度训练的 FP8-E4M3 因其动态范围较小，往往需要采用细颗粒度的 Current Scaling，而 HiF8…能够采用 Delayed Scaling，并以较长的周期（interval）估计 Amax 值，同时仍保持训练稳定性』；第四章 TE 段与表 5 参数组合矩阵（含『Tensorwise 路径』『BF16 回退』『TP-MC2 表示通信与计算融合算子』注）；第五章实验配置与『BF16 训练每次迭代的端到端耗时为 3.63629095 s，而 HiF8 训练仅需 2.80796152 s。相较于 BF16，HiF8 实现了 29.5% 的端到端训练加速』『MXFP8 训练仅需 3.12526599 s…实现了 14.05% 的端到端训练加速』；第六章对比表（HiF8 相对 MXFP8 1.113x / 相对 BF16 1.295x）与收益来源三段（访存收益、8-bit 吞吐『HiF8 相对 BF16 的 MM 与 GMM 算子平均加速比超过 1.8 倍』、相对 MXFP8 的元数据/控制逻辑/Delayed Scaling 优势）"
