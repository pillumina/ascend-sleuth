id: hif8-and-mxfp8-low-precision-training
type: software-fact
title: HiF8 / MXFP8 低精度训练（格式特性、Per-Tensor vs Per-Block、Delayed vs Current Scaling、950DT 实测 29.5% 加速与参数组合支持范围）
summary: "训练低精度（8-bit）的选型与判据。**格式**：HiF8 由符号 S(1) + 点位 Dot(2~4) + 阶码 E(D 位，**符号-幅度编码**且幅值最高位为隐含位) + 尾数 M(1~3) 组成；Normal 模式下 Dot=1/2/3/4 分别编码 E=±1、±[2,3]…共覆盖指数 [-15,15] 且**无冗余编码**；**Denormal（DML）模式复用 3-bit 尾数空间**把指数扩到 [-22,-16]，综合动态范围 **[-22,15] 共 38 个指数**（接近 FP16 的约 40 个）；特殊值 Zero=`0x00`、NaN=`0x80`、±Inf=`0x6F`/`0xEF`，**不区分正负 0**；精度呈**锥形分布**（E∈[-3,3] 时有 3-bit 尾数，随幅值增大收缩到 1-bit），匹配神经网络参数的类高斯分布——这是它优于 Posit 的关键，也是它能在 8-bit 下用**粗粒度 Per-Tensor 量化**的原因（MXFP8/FP8 动态范围小，通常必须 Per-Block）。**缩放**：`Scale = Amax/F8max`（E4M3 的 F8max=448）；**Current Scaling** 每步遍历输入求 Amax、与下游 MatMul 串行，会抵消部分 8-bit 收益；**Delayed Scaling** 用历史统计估计当前步 Amax（以 interval=K 为周期，含防上溢的 N_guard 保护参数），把 Amax 统计与主计算解耦。**实测（950DT-8P，单卡 486 TFLOPS，裁剪版 DeepSeek-V3，仅量化 MM/GMM，HiF8 = Per-tensor + Delayed Scaling interval=10 steps）**：BF16 单步 3.63629095s、MXFP8 3.12526599s（+14.05%）、HiF8 2.80796152s（**相对 BF16 +29.5%、相对 MXFP8 +11.3%**），MM/GMM 算子平均加速比 >1.8×，损失与 Gradient Norm 与 BF16 基本对齐。"

