id: msprof-configuration-options
type: software-fact
title: msprof / PROFILING_OPTIONS 配置项语义与平台差异（task_time 级别、aic_metrics 与 Custom 寄存器、l2、各 freq 范围、host_sys 依赖）
summary: "配置采集项的语义与取值：**默认**——PROFILING_MODE=true 且未配 PROFILING_OPTIONS 时默认采 training_trace、task_trace、hccl、aicpu 与 aic_metrics(PipeUtilization)，数据存在 AI 任务所在目录。**关键开关**：`task_trace`/`task_time` 取 on(=l1，默认)/off/l0/l1（l0 不采算子基本信息、开销更小、耗时统计更准；l1 提供更全面数据），`training_trace` 采迭代轨迹且采正反向算子数据时必须 on（训练场景 task_trace=on 时 training_trace 也必须 on），`ge_api` 取 off/l0/l1 采动态 shape 的 Host 调度耗时，`aicpu`/`hccl`/`msproftx`/`runtime_api` 为 on/off，`hccl` 后续版本废弃、改由 task_time 控制。**aic_metrics** 七项（PipeUtilization 默认 / ArithmeticUtilization / Memory / MemoryL0 / MemoryUB / ResourceConflictRatio / L2Cache / MemoryAccess）带平台限制（L2Cache 在 Atlas 推理系列与 Atlas 训练系列不支持；MemoryAccess 在 Atlas 推理系列、Atlas 训练系列、Ascend 950PR/950DT 不支持），并支持 `Custom:0x49,0x8,...` 自定义寄存器（寄存器值范围 [0x1,0x6E]，最多 8 个、逗号分隔、支持十六/十进制）。**频率类**：sys_hardware_mem_freq [1,100]Hz（950 的 Qos 与 SoC 最大可配 10000，超出按 100 采）、sys_io_sampling_freq [1,100]Hz、sys_interconnection_freq [1,50]Hz、dvpp_freq [1,100]Hz、host_sys_usage_freq [1,50] 默认 50Hz、instr_profiling_freq [300,30000]Hz。**host_sys** 取 cpu/mem/disk/network/osrt（多选逗号分隔，disk 需 iotop、osrt 需 perf+ltrace）。**落盘**：output/storage_limit（[200,4294967295]MB 须带单位，未配置时磁盘可用 <20MB 不落盘）。"

