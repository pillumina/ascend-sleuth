id: fabricmem-unified-addressing-and-transfer
type: software-fact
title: FabricMem 模式（超节点内 DRAM 统一编址 + D2RH/RH2D 单边传输：VMM 四步、开关与取值约束、依赖与硬件范围）
summary: "HIXL 的 FabricMem 传输模式：在 Atlas 800T A3 超节点内把**所有计算节点的 DRAM 统一编址**，NPU 通过 HCCS 直接访问远程节点内存，从而走 **D2RH（设备→远程主机）/RH2D（远程主机→设备）** 高带宽通道——文档给出的动机是传统 RoCE 方案满载带宽约 20GB/s、在超节点部署下成瓶颈，而 FabricMem 可把超节点内传输带宽提到百 GB/s 级。**底层是 CANN 的 Virtual Memory Manager（VMM）**：每个进程先 `aclrtMallocPhysical` 申请物理内存 → `aclrtReserveMemAddress` 申请虚拟内存 → `aclrtMapMem` 映射，然后交换物理地址、把物理地址映射到访问进程页表，最后发起 SDMA 访问（可读写任何进程的片上内存与 DRAM 内存）。**启用**：初始化引擎时 `options` 里配 `OPTION_ENABLE_USE_FABRIC_MEM=\"1\"`（`\"0\"` 关闭）。**取值约束**：`OPTION_GLOBAL_RESOURCE_CONFIG` 可配 Fabric 虚拟内存池容量、起始地址、单任务流数量以及 `transfer_config.max_transfer_count_per_batch`（默认 **1920**，FabricMem 取值范围 **[1, 1920]**，两种展开模式都做该范围校验）。**依赖**：HDK ≥ 25.5、灵衢计算网络（LingQu）≥ 1.5.0、CANN ≥ 9.0；**硬件范围仅 Atlas A3 训练系列与 Atlas A3 推理系列产品**。"

