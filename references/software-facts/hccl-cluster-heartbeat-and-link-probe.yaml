id: hccl-cluster-heartbeat-and-link-probe
type: software-fact
title: HCCL 集群心跳维测链路与建链故障探测链路（事件类型、判据窗口、日志格式）
summary: "HCCL 在两个阶段各自建了一条「自动指根节点」的旁路机制：①**集群心跳**——基于通信域信息与邻近 rank 建独立维测链路，把单点故障广播到通信域内每个 rank（HCCL 控制链路数量与数据量，不影响通信性能），探测三类事件：网络问题 ERROR CQE/Error cqe Occurred（轮询 ROCE 驱动重传超次，用 QPN 映射远端 IP）、进程卡死 STUCK/Stuck Occurred（每隔 1/3 的 HCCL_EXEC_TIMEOUT 轮询算子入/出次数）、进程退出 LOST/Heartbeat Lost Occurred（30 秒未收到远端心跳）；ERROR 日志只打印前三个有效事件，优先级 ERROR CQE > STUCK > LOST；②**建链故障探测链路**——建链失败后每个 rank 起 server 端接受探测、并向无响应的远端发起探测连接，探测失败事件沿已建链成功的链路扩散，据此直接定位故障点。两者的日志字段与「无事件时怎么办」的判据都在本条。"

