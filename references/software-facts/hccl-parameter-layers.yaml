id: hccl-parameter-layers
type: software-fact
title: HCCL 参数的四层（算子入参 / 通信域配置 / 环境变量 / 启动组网）、优先级与生效值确认方法
summary: 要调 HCCL 参数时先定位它在哪一层、会不会被上层覆盖：四层划分、常见默认值，以及用 [HCCL_ENV] 日志确认实际生效值。

