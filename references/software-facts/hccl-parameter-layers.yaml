content:
  claim: >-
    HCCL 参数分四层，调参前先确认自己在哪一层：① 算子入参（每次调用，只影响这一次——sendbuf / recvbuf / count / dataType / op / comm / stream，count 是元素个数不是字节数，AllReduce 允许 in-place）；② 通信域配置（建域时的 `HcclCommConfig`，只影响这个域——buffer 大小、确定性、通信域名、引擎、算法、重执行、超时、QoS、对称内存窗口、队列深度）；③ 环境变量（进程启动前设，影响整个进程——超时、网卡、RDMA 参数、日志）；④ 启动 / 组网参数（启动器或 rank table，影响这次建域——nRanks、rank、deviceId、rootInfo、rank table、nRoot）。
    优先级的一般规律是 ① > ② > ③ > 默认，少数字段以官方文档为准（例如 `hcclAlgo > HCCL_ALGO > 自适应`）。调参前先看启动日志里的 `[HCCL_ENV]` 行确认当前生效值——`set by default to [...]` 表示用的默认、`set by environment to [...]` 表示被环境变量覆盖；通信域级配置在建域日志里打（buffer、引擎、域名、确定性等）。
    几个常见默认值（代码常量）：`HCCL_BUFFSIZE` 与 `hcclBufferSize` 都是 200 MB（多域相乘很吃显存）；建链超时 `HCCL_CONNECT_TIMEOUT` 默认 120 秒，合法区间 120–7200 秒；算子执行 / notify 等待超时默认 1836 秒；`HCCL_RDMA_TC` 默认 132、`HCCL_RDMA_SL` 默认 4、`HCCL_RDMA_TIMEOUT` 默认 20（约 4.29 秒）、`HCCL_RDMA_RETRY_CNT` 默认 7。默认值与取值范围随版本和产品变化，以启动日志为准。
  evidence: >-
    默认值出处：`constexpr s32 HCCL_LINK_TIME_OUT_S = 120; // HCCL 默认的建链超时时间设置为120s`（src/legacy/ascend910/pub_inc/externalinput_pub.h:20，A5 树同值见 src/legacy/ascend950/framework/env_config/base_config_legacy.h:84）；`constexpr u32 HCCL_CCL_COMM_DEFAULT_BUFFER_SIZE = 200;`（externalinput_pub.h:37，A5 树 base_config_legacy.h:208）；`HCCL_RDMA_TC_DEFAULT = 132; // 默认的traffic class为132（33*4）`、`HCCL_RDMA_SL_DEFAULT = 4`、`HCCL_RDMA_TIMEOUT_DEFAULT = 20; // 默认的TIMEOUT配置为20(对应时间4.096*2^20us)`、`HCCL_RDMA_RETRY_CNT_DEFAULT = 7`（src/legacy/ascend910/framework/common/src/config/env_config.h:108-122）；执行超时 `NOTIFY_WAIT_TIMEOUT_DEFAULT = 1836`（src/base_comm/primitives/launch_context.h:24）与 `u32 notifyWaitTimeout{1836};`（src/coll_communicator_mgr/communicator/aicpu_init_param.h:21）。生效值日志格式：`HCCL_RUN_INFO("[HCCL_ENV] HCCL_CONNECT_TIMEOUT set by environment to [%d]s", timeOut);` / `HCCL_RUN_INFO("[HCCL_ENV] HCCL_CONNECT_TIMEOUT set by default to [%d]s", timeOut);`（src/legacy/ascend910/platform/common/externalinput.cc:621-623），以及 `HCCL_RUN_INFO("[HCCL_ENV] HCCL_BUFFSIZE set by default to [%u]M", cclBufferSize);`（同文件:1565）。环境变量名与归属：`HCCL_NPU_SOCKET_PORT_RANGE`（env_config.cc:115、120）、`HCCL_RDMA_TC`（:150）、`HCCL_RDMA_SL`（:166）、`HCCL_RDMA_TIMEOUT`（:184）、`HCCL_RDMA_RETRY_CNT`（:201）、`HCCL_DFS_CONFIG`（:133；cluster_monitor.cc:820 消费 cluster_heartbeat）。
  details: >-
    按场景的配方（先动哪个）：启动卡在收人阶段（V2 是 `GetConnections` 无进展，A2/A3 是 `topo exchange server get socket timeout`）→ 调大 `HCCL_CONNECT_TIMEOUT`、查 `HCCL_SOCKET_IFNAME` 与白名单；首个算子超时 → 调大 `HCCL_CONNECT_TIMEOUT`，并 warm-up 一次小算子；显存不够（多域）→ 调小 `hcclBufferSize` / `HCCL_BUFFSIZE`，或减少域数；精度不可复现 → `hcclDeterministic=1`（要保序用 2）；跨机链路抖动 → 调大 `HCCL_RDMA_TIMEOUT` / `HCCL_RDMA_RETRY_CNT`，A3 可开 `hcclRetryEnable`；RoCE 拥塞或多租户 → `HCCL_RDMA_TC` / `HCCL_RDMA_SL`、`hcclQos`；小包时延高 → `hcclOpExpansionMode=3/4`（AIV）并确认算法；大包带宽低 → 查算法（ring / 分层）、`HCCL_BUFFSIZE`、链路；心跳或监控开销大 → `HCCL_DFS_CONFIG=cluster_heartbeat:off`。
    DFX 开关同属第三层：`ASCEND_GLOBAL_LOG_LEVEL`（1 为 INFO、生产一般 3 WARNING）、`ASCEND_SLOG_PRINT_TO_STDOUT`、`HCCL_ENTRY_LOG_ENABLE`（要看 `Entry-Hccl*` 就必须开）、`HCCL_DFS_CONFIG`（子开关如 cluster_heartbeat）、`HCCL_EXEC_TIMEOUT`、`HCCL_CONNECT_TIMEOUT`、`HCCL_DIAGNOSE_ENABLE`。这些开关都有开销，生产按需开；默认值以 `[HCCL_ENV]` 行为准。
    两处版本间不一致，按现场日志判：`HCCL_EXEC_TIMEOUT` 的默认值在代码里是 1836 秒（launch_context.h:24、aicpu_init_param.h:21；legacy 侧同值见 `NOTIFY_DEFAULT_WAIT_TIME = 27 * 68`，src/legacy/ascend910/pub_inc/hccl_common.h:86），实际取值看启动日志的 `[HCCL_ENV]` 行；`HCCL_CONNECT_TIMEOUT` 代码默认 120 秒、合法区间 120–7200 秒（externalinput.cc:138 的报错文案给出区间）。另外 nRoot（scalable 的 root 数）只对 A2/A3 有意义，A5 不支持 scalable。
