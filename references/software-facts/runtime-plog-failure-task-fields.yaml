id: runtime-plog-failure-task-fields
type: software-fact
title: 从 plog 提取失败 task / 内核 / Device 异常的检索关键字与字段含义（Task run failed、fault kernel_name、The error from device）
summary: "Device 侧任务失败的证据链在 plog 里按五个关键字逐段取出：`Task run failed`（失败任务：device_id/stream_id/task_id/sqe_type/errType/sqSwStatus）、`fault kernel_name`（失败内核名 + `_high_performance` 一类后缀 + tiling key）、`retCode` 与 `Kernel task happen error`（错误码）、`The error from device(chipId:..,dieId:..)`（Device 侧异常类型，如 aivec error exception=AI 向量核异常）、`The extend info` 与 `AIC_INFO`（扩展信息与内核参数）。三类典型异常特征分别对应不同的排查方向：aivec error exception → 数组越界/内存不足/tiling 参数；数据传输失败 → 地址对齐（通常 64 字节）/结构体定义/分配接口对齐参数；task timeout → 死循环/计算量过大/资源不足。"

