id: mc2-megamoe-token-capacity
type: software-fact
title: MC2 / MegaMoe 的 token 容量与 dispatch_ffn_combine 的 workspace 构成（含 mega_moe_max_tokens 默认值）
summary: "**① MC2 token 容量是算出来的，不是一个固定值**：`set_mc2_tokens_capacity()` 按三分支取 `max_num_tokens`——开了 `enable_prefill_mc2` 取 `max_num_batched_tokens`；否则若有 cudagraph 捕获尺寸取 `max_cudagraph_capture_size`；都没有才回退 `max_num_reqs × uniform_decode_query_len`。然后 `每 rank = ceil(max_num_tokens / tp_size)`，**再统一 cap 到 512**，最后 `容量 = 每 rank × tp_size`。所以「每 rank 512」是**上限**而不是固定配置值；容量随 tp / 捕获尺寸 / 调度参数变化——这正是同一份容器换配置后『有时崩有时不崩』的来源。**② `mega_moe_max_tokens` 默认 65536**（`additional_config` 可覆盖），它被直接当作 mega_moe 分发算子的 `max_output_size` 传入。**③ `dispatch_ffn_combine` 的 workspace 按 `maxOutputSize` 线性预留**：routing 项（按 M 对齐到 256）× topK + 若干 `maxOutputSize × 常量` 项累加，因此调大上限会等比例抬高单算子 workspace 需求（本项目 GLM-5.1 量级下可达 GB 级）。"

