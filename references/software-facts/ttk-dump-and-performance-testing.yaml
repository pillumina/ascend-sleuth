id: ttk-dump-and-performance-testing
type: software-fact
title: TTK 的 Dump 调试与性能测试口径（--dump/--dump-on-fail、warmup×run 冷热两模式、四条通路的采集差异）
summary: "两件在算子级定位里最常用的事：①**Dump 调试**——`--dump in|out|golden|full`（可组合，逗号分隔）分别在「输入生成后·设备执行前」「设备执行后·精度比对前」「Golden 生成后」保存张量；`--dump-format` 取 bin（默认、无 shape）/npy（推荐，numpy.load 直读）/pt（需 torch 语义，含自定义 dtype）/print（小数据目视）；**`--dump-on-fail` 在精度比对失败时自动保存该用例全量数据（文件名带 `fail_` 前缀），通过时不保存**，与 `--dump` 可叠加；`--seed` 固定输入生成与 Golden 计算的随机性以保证可复现。约束：`--no-prof` 只允许 `--dump in,golden`，与 print 格式、`--dump-on-fail` 均不兼容；`--dump-on-fail` 与 `--validate` 不兼容。②**性能测试口径**——`--warmup`（默认 true）与 `--run`（默认 3，仿真模式 1）区分**稳态性能**（预热后采集 run 次取平均）与**冷启动性能**（`--warmup false --run 1`，反映首次执行全部开销）；**四条通路的 warmup 与统计方式各不相同**：e2e 把算子跑 1 次丢弃（预热 dispatch/autograd/首次加载/workspace 分配/SMMU·TLB），`--run` 次全部进 torch profiler 窗口取平均、读 `kernel_details.csv` 的 Duration 累加后除 run_count；kernel 与 aclnn 是 launch 空 helper kernel 预热硬件层，kernel 读 `op_summary/task_time.csv` 的 `Task Duration(us)/task_time(us)` 取 **median**，aclnn 的 `--run > 1` 时 `start_step=1` **跳过首次**（首次含 workspace 等一次性 HBM 申请开销，不计入稳态）、读 `api_statistic/op_statistic.csv` 的 Avg 列——因此 `--warmup false --run 3` 仍会跳首次，要采首次必须 `--run 1`；geir 无 warmup（每次全新子进程、冷热等价），默认只跑 1 次取 median（`--dl 1` 时跑 run 次做 MD5 校验）。读原始数据时按 `Task Type`/`kernel_type` 过滤，只保留 `KERNEL_AICORE/AIVEC` 等真实 NPU kernel 记录，排除 `MODEL_EXECUTE/NOTIFY_*` 等框架开销。"

