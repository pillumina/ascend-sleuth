id: hccl-rankgraph-and-netlayer-model
type: software-fact
title: HCCL 的 RankGraph 与 netLayer 模型：图模型的四个用途、层 ≠ 域、实例数与多 root 的区别
summary: 分不清「层 / 域 / 实例 / 多 root」时看这条：RankGraph 存什么、四个数各由谁决定、A2/A3 的算法分层与规模减压手段。

