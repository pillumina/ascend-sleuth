id: ascend-app-process-and-resource-constraints
type: software-fact
title: 应用侧进程与资源硬约束（单 Device 进程数上限 63/64、不支持 fork 后调 acl 接口、创建销毁配对、休眠前置）
summary: "三类会直接表现为「进程起不来 / 报错 / 卡死」的应用侧硬约束：①**单 Device 用户进程数上限**（Host 上限 = Device 数 × 单卡上限）——Atlas 训练系列、Atlas 推理系列、Atlas 200I/500 A2 推理产品、Ascend 950PR/950DT 为**单卡 64 个**（Atlas 训练/推理系列在**虚拟机场景降为 32 个**），**Atlas A2 与 A3 为单卡 63 个**；②**不支持用 fork（及 system、posix_spawnp 等封装了 fork 的函数）创建多个子进程后在进程中调用 acl 接口**——否则进程运行时会报错或卡死；③**创建类与销毁类接口必须配对**（aclrtCreateStream/aclrtDestroyStream、aclrtCreateEvent/aclrtDestroyEvent、aclCreateDataBuffer/aclDestroyDataBuffer 等），销毁后不能继续使用已释放资源、建议置为无效值（NULL），否则程序可能异常。另记低功耗约束：进入系统休眠前必须确保不下发 AI 推理与媒体数据处理业务、或退出业务进程，唤醒成功后再继续下发或重启业务进程。"

