title: HCCL 建链的四台状态机（socket / QP / Channel / UB jetty）与 A2/A3 legacy 建链流程
summary: 通道卡在 CONNECTING 或 qp_status 一直是 0 时看这条：先确认卡在哪台状态机，再看该阶段交换的参数与失败日志。

