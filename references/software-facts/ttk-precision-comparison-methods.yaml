id: ttk-precision-comparison-methods
type: software-fact
title: TTK 算子精度比对的 8 种方法与各 dtype 阈值（mixed/stat_rel_err/close/cosine/binary/requant/quant/cross_check）
summary: "判「算子精度是否达标」时的判据表：默认方法 **mixed（混合容差）** 逐元素判 `|a-g| <= atol + rtol*|g|` 且要求通过率 ≥ **0.99**，另有绝对误差硬上限 `max_abs_error_limit`（与 `32*ULP` 取满足任一）拦灾难性离群点；dtype 阈值——float16 rtol/atol 均 2^-9≈1.95e-3、bfloat16 均 2^-6≈1.56e-2、float32 rtol 2^-10≈9.77e-4 与 atol 2^-16≈1.53e-5、hifloat32 2^-9/2^-10、float8_e4m3fn 2^-2/2^-4、float8_e5m2 2^-1/2^-3，其他浮点回退 float32 档。**自动路由**：hifloat8 → requant（ULP 差 ≤1、ptol 0.001）、float4/int4 与 float8_e8m0 与整型/布尔 → binary（逐 bit SHA-256，无容差）、hifloat8 外的 float8 默认走 mixed。其余方法：stat_rel_err（mere 超阈值 FAIL，mare 超 10×阈值 FAIL）、close（np.isclose，rtol 0.001/0.0001、atol 1e-8）、cosine（1-cos ≤ 0.01，适合 embedding/attention 等大规模向量看趋势）、quant（浮点输入→int4/int8 输出，绝对误差 ≤1 LSB，ptol=0，只能由 Spec.tolerance 声明）、cross_check（NPU/Golden/第三方三方误差比值，L0/L1/L2 预设）。**特殊值**：双方同位同为 NaN、或同为同号 Inf → 视为一致；NaN/Inf 位置不一致 → 判无界误差直接 FAIL。"

