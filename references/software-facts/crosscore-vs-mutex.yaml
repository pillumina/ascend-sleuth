id: crosscore-vs-mutex
type: software-fact
title: CrossCore 与核内 Mutex 的分工（跨核交接 vs 核内槽复用，不可互替、方向不对称）
summary: "1C2V Mix 核里有**两套互不替代**的同步机制：CrossCore 只传递「数据就绪」与「槽位可复用」两类状态、**不搬运数值**，负责 AIC/AIV 共享资源的所有权；核内 Mutex 负责单个核心内部物理槽的复用（分别约束 AIV 的 MTE2→Vector→MTE3、AIC 的 MTE1→Mmad 与 Mmad→Fixpipe，且不使用 `PIPE_S`）。跨核方向也不对称：AIC 的一次 Set 是**一对二广播**（同组 AIV0/AIV1 都可等），而 AIV→AIC 方向 AIC 必须等两路都 Set 才能继续"

