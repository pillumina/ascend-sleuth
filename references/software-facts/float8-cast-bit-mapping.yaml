id: float8-cast-bit-mapping
type: software-fact
title: float4_e2m1 → float8_e4m3fn 无直接 Cast（位映射 + ×64 补偿，bias 需先 ÷64）
summary: "Ascend 950 不支持从 `float4_e2m1` 直接转 `float8_e4m3fn`：需走 `float4_e2m1 → bfloat16 → float32 → float8_e4m3fn` 共 3 个 Cast。等效位操作是符号位不变、指数位高位补两个 0、尾数位低位补两个 0；该结果被解释为 e4m3fn 后数值是真实值的 1/64，**必须乘 2^6 = 64 补偿**（可借 FIXPIPE 随路乘缩放因子在搬出时完成）。bias 场景下该乘法把 bias 变成 64 倍，需先把 bias 搬进 Vector 核缩小为 1/64 再参与计算"

