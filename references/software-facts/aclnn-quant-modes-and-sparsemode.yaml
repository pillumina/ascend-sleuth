id: aclnn-quant-modes-and-sparsemode
type: software-fact
title: aclnn 量化模式与 sparseMode（T/C/K/G/B 五级与五种组合 / MX 的定义 / sparseMode 0-8 表与 varlen 限制）
summary: "两块与『精度问题的成因判读』直接相关的语义。**① 量化模式（量化粒度）与 scale 的 shape**：pertensor（T）——左或右矩阵整张共用一个量化参数，左矩阵 (m,k) 时 scale 形状 (1,)；perchannel（C）——只能作用于**右矩阵**、每个 channel 独立，右矩阵 (k,n) 时 scale 形状 (n,)；pertoken（K）——只能作用于**左矩阵**、每个 token 独立，左矩阵 (m,k) 时 scale 形状 (m,)；pergroup（G）——在 **reduce 轴（k）** 上分组，group size 记 gs，左矩阵 scale 形状 (m, k/gs)、右矩阵 (k/gs, n)；perblock（B）——在所有轴上按 (bs, bs) 分块，左矩阵 scale 形状 (m/bs, k/bs)、右矩阵 (k/bs, n/bs)。**② 常见组合**：全量化（左右都量化）= T-C、K-C、G-B、T-CG、B-B；伪量化 = 只量化 weight 的 C；**MX 量化 = pergroup-pergroup（G-G）的特例：量化参数类型为 FLOAT8_E8M0 且 group size = 32**（本质是 Microscaling，靠动态调整缩放因子在极低比特下保精度）。**③ sparseMode 0-8 表**：0 defaultMask、1 allMask、2 leftUpCausal、3 rightDownCausal、4 band、5 prefix 非压缩（**varlen 场景不支持**）、6 prefix 压缩、7 varlen 外切 rightDownCausal（**仅 varlen**）、8 varlen 外切 leftUpCausal（**仅 varlen**）；attenMask 的原理是在 Mask 为 True 的位置遮蔽 QKᵀ 的值；sparseMode=0 时若 attenMask 未传入则不做 mask、**忽略 preTokens/nextTokens**；nextTokens 取负时要求 preTokens ≥ |nextTokens| 且 |nextTokens| < Skv，preTokens 取负时要求 nextTokens ≥ |preTokens| 且 |preTokens| < Sq。"

