id: shmem-usage-limits-and-troubleshooting
type: software-fact
title: SHMEM 使用限制与常见问题（对称内存分配、UB Buffer 预留、A2 16 卡跨组禁 MTE、端口桥、QP 建链超时、卡间同步须在 AIV）
summary: "SHMEM（多机多卡内存通信库）的七条使用限制与常见问题的判据。**限制**：①GM2GM 高阶 RMA 用默认 buffer **不支持并发**（会覆盖数据，需并发就用低阶接口）；②`barrier` 当前**必须在 Mix Kernel（含 mmad 与 GM2UB/UB2GM 操作）中使用**；③RDMA 高阶接口需先用 `aclshmemx_rdma_config` 配 UB Buffer 与 sync_id，预留 **≥128 字节**（不配则用默认 **190KB 处**的 UB Buffer 与 EVENT_ID0；RDMA 接口内部用 `PipeBarrier<PIPE_MTE3>` 阻塞 MTE3 流水以确保任务下发完成，**RDMA 专用 Put/Get 的 src/dst 都必须指向对称内存且各自完整传输范围不得越出所在内存分配**）；④SDMA 高阶接口经 `aclshmemx_sdma_config` 预留 **≥64 字节**（默认 191KB 处）；⑤UDMA 经 `aclshmemx_set_udma_config` 预留 **≥128 字节**（默认 189KB 处，用于经 `PIPE_MTE3` staging 暂存完整 WQE）；⑥**A2 16 卡机型**分前后两个 8P Fullmesh 组、组间仅 PCIe-SW 互连，**不支持用 MTE 接口跨组搬运**（单机用例勿跨组指定 NPU，否则可能出现流同步失败等未知报错）；⑦**A3 的 D2H/D2rH 要求 Host DRAM 可用空间大于 local_mem_size**——HCCS 总线上的 DRAM 地址范围固定，可用空间 = `lsmem` 查到的本机物理地址范围与四个固定区间（0x29580000000-0x34000000000、0xa9580000000-0xb4000000000、0x129580000000-0x134000000000、0x1a9580000000-0x1b4000000000）的**交集**，无交集则不支持该功能。**典型问题的判据**：算子**精度异常但无 error 日志**时先怀疑 **`aclshmem_malloc` 分配了非对称共享内存**（每个 rank 必须分配相同大小），开 debug 模式即可复现（A2/A3：`bash scripts/build.sh -examples -debug`；950：加 `-soc_type Ascend950`）；日志提示 `local size diffs` 说明各 PE 的 `local_mem_size` 不一致（**日志中的实际分配大小比 local_mem_size 多 6MB 是框架内部使用**；local_mem_size 需 **2MB 对齐**，否则报不同错误）；端口/网口问题按「`netstat -tuln | grep <端口>` 查占用 → 调整 `SHMEM_UID_SESSION_ID` 与实际 IP/端口」排查，default 模式（`ACLSHMEMX_INIT_WITH_DEFAULT`）每次初始化都绑定独立端口，**多实例场景用 `SHMEM_INSTANCE_PORT_RANGE=start:end` 且 ip_port 端口设 0**（框架按 instance_id 分配 start_port+instance_id），单实例多次初始化需保证上次已 finalize 或换端口；未配 `SHMEM_UID_SESSION_ID`/`SHMEM_UID_SOCK_IFNAME` 时框架自动搜索可用网口（排除 lo/docker/veth/br-/virbr/tun/tap），失败需手动配置（**两者同时配只读 SESSION_ID**；IFNAME 支持 `enpxxxx:inet4`/`inet6`/`eth0` 自动探测优先 IPv4）。**网络与建链**：**1825 网卡单机多 NPU 共用同一物理端口**时，NPU 间 RDMA 流量从同一端口出、经交换机又从同一端口回，**交换机默认丢弃此类同源同宿报文 → 必须在交换机对应接口开启端口桥 port bridge**（8 卡机型参考 NPU0/1→hrn5_1、2/3→hrn5_0、4/5→hrn5_3、6/7→hrn5_2；用 `ibv_devinfo`/`hiroce5 gids` 查 net_dev、`ifconfig <net_dev>` 查 MAC、再在交换机按 MAC 查端口，开启后 `commit` 并以 `display current-configuration | include port bridge` 验证）；**RDMA 丢包先查交换机与端侧的 TC/SL 配置是否一致**（对应 `HCCL_RDMA_TC`/`HCCL_RDMA_SL`）；**Ascend950 RDMA V2 的建链监听端口由系统自动分配、用户无需配置**（同 IP 多进程/多 instance 无需手工分配；建链端口与初始化通信端口是两回事）；建链报 `HcommChannelCreate failed: 19`（HCCL_E_NETWORK）通常是 **QP 状态迁移 INIT→RTR 超时**，依次查两端 `gid_idx` 是否一致、`ping <对端RDMA_IP>`、交换机 PFC/ECN 无损网络配置；**卡间同步接口 `aclshmemx_roce_sync_all`/`roce_barrier_all`/`roce_barrier`/`roce_team_sync` 出现某几个 PE 卡死时，要确保调用它们的算子只在 AIV 上执行**。**自建调试的坑**：加 `-O0 -g` 编译被 `-Werror` 拦下（报 `will be ignored [-Werror -Woption-ignored]`）→ 注释掉 SHMEM 根 CMakeLists.txt 的 `-Werror`；加 `-O0 -g` 后运行报 `min stack size is xxx, larger than current process default size 32768` → 在 aclInit 的 json 中配置更大的栈空间。"

