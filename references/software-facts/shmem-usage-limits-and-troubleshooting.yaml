content:
  claim: "见 summary 中逐条列出的七条使用限制与各类问题的判据。补充三条诊断要点：**① 精度问题无 error 日志是 SHMEM 的典型形态**——共享内存访问到异常数据往往源于分配不对称，因此「算子结果不对但没有任何 ERROR」时优先按 debug 模式复现（A2/A3 `bash scripts/build.sh -examples -debug`；Ascend950 `bash scripts/build.sh -soc_type Ascend950 -examples -debug`），让框架把不对称分配当场报出来，而不是继续往算子实现里找。**② 内存与端口的三个数字要记住**：RDMA/UDMA 预留 **128 字节**、SDMA **64 字节**（分别落在默认 190KB / 189KB / 191KB 处，sync EVENT_ID 默认 EVENT_ID0）；`local_mem_size` **2MB 对齐**，且日志中的实际分配比它多 **6MB**（框架内部使用）——把这两个差值当成 bug 会白查一轮。**③ 网络侧的三类根因要分开**：同源同宿报文被交换机丢弃（需端口桥）属**拓扑/交换侧**；TC/SL 不一致丢包属**QoS 配置侧**；`HcommChannelCreate failed: 19` 的 QP INIT→RTR 超时属**建链与无损网络配置侧**（gid_idx、IP 可达、PFC/ECN）——三者的检查顺序与责任方不同，混在一起查会绕远。"
  evidence: "Troubleshooting_FAQs.md：使用限制段逐条（『GM2GM的高阶 RMA 操作使用默认buffer，不支持并发操作，否则可能造成数据覆盖』『barrier接口当前必须在Mix Kernel（包含mmad和GM2UB/UB2GM操作）中使用』『使用RDMA的高阶接口前，需要先使用aclshmemx_rdma_config接口配置UB Buffer和sync_id等信息，且需要保证预留UB Buffer大小大于等于128字节。若不配置，则使用默认的190KB处的UB Buffer和EVENT_ID0』『RDMA相关接口内部使用PipeBarrier<PIPE_MTE3>阻塞MTE3流水以确保RDMA任务下发完成。RDMA 引擎专用 Put/Get 接口的 src、dst 都必须指向对称内存』『使用SDMA的高阶接口前…大于等于64字节…默认的191KB处』『使用UDMA的高阶接口前…大于等于128字节…默认的189KB处』『A2 16卡机型：NPU分为前八卡后八卡两个8P Fullmesh组…不支持直接使用MTE接口在跨组NPU间完成数据搬运』『A3 D2H/D2rH等功能，需要确保Host内存（DRAM）可用空间大于aclshmemx_init_attr_t初始化过程中pe分配的local_mem_size大小…通过lsmem查询本机物理地址范围，和如下4个地址区间取交集』）；常见问题段（『算子精度问题，无error日志，发现共享内存访问到的数据异常』→ debug 模式命令与『确保每个rank分配相同大小的共享内存』『日志中显示的实际分配大小和local_mem_size大小有6MB的差异为shmem框架内部使用空间』『此处local_mem_size大小为2MB对齐』『netstat -tuln | grep <端口号>』『SHMEM_INSTANCE_PORT_RANGE=start:end…将ip_port中的端口设为0』『同时配置时只读取SHMEM_UID_SESSION_ID』『1825 网卡在单机多 NPU 场景下…交换机默认丢弃此类同源同宿报文…需在交换机对应接口开启端口桥』8 卡机型 NPU↔网卡对应表与交换机操作步骤『display current-configuration | include port bridge』『通信丢包…检查交换机和端侧的TC与SL配置是否正确，如果不一致会出现丢包现象…HCCL_RDMA_TC和HCCL_RDMA_SL』『Ascend950 RDMA V2 建链监听端口由系统自动分配，用户无需配置』『HcommChannelCreate failed: 19（HCCL_E_NETWORK）…通常为 RDMA QP 状态迁移（INIT→RTR）超时…1. 确认 GID index 两端一致…2. 确认 RDMA 网卡间 IP 层可达…3. 检查交换机 PFC/ECN 无损网络配置』『确保当前调用上述接口的算子只在AIV上执行』『SHMEM根目录的CMakeLists.txt的-Werror选项…注释掉-Werror编译选项即可』『min stack size is xxx, larger than current process default size 32768. Please modify aclInit json』）"
