id: attention-precision-chains
type: software-fact
title: Attention 两类精度损失链（FP8 per-block 量化的 P 压 fp8 / 衰减注意力的 exp 指数上溢）与验收判据
summary: "量化与线性 attention 各有主要精度损失点：①FIA FP8 per-block 全量化里 **softmax 概率 P 被压到 fp8(E4M3)** 是最大损失点，且要求 block_size 与算子 tiling 块一致（scale shape 直接暴露粒度：query 沿 S1 每 128、key/value 沿 S2 每 256 一个 scale）；②门控/衰减类线性 attention 的 `exp(-G)` 因子在强衰减长 chunk 下会超出 BF16 安全范围（C64 平移后仍达 160）。验收判据可复用：`atol/rtol = 0.004 + 0.004·|golden|`、低精度基线 `E_npu ≤ 2·E_bf16`、`NRMSE < 0.006`"

