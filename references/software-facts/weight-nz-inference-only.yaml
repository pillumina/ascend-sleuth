id: weight-nz-inference-only
type: software-fact
title: 权重预转 FRACTAL_NZ 只适用于推理（训练每步变权重无法预处理）
summary: "Matmul 以 ND 传入权重时需在数据通路中**随路做格式转换**，引入额外带宽损耗；把权重提前转成 FRACTAL_NZ 可消除这部分开销、提高带宽利用率——但**只适用于推理**：训练场景权重每步变化，无法预处理，随路转换的额外耗时消不掉。收益随权重矩阵规模增大而变高。诊断含义：不要把推理侧的 NZ 优化建议套到训练上"

