id: torchtitan-npu-compile-backends-and-limits
type: software-fact
title: torchtitan-npu 的图编译契约（两级 backend 必须在 import torch 前定 / 按 Block 全图编译 / fallback 与动态 shape 边界 / 内核缓存与「训练成功≠融合生效」）
summary: "在 torchtitan-npu 上做 torch.compile 的性能与中断定位，先记住五条。**① 两级 backend 不能互相替代**：`compile.backend=inductor` 选 PyTorch Dynamo backend，`TORCHINDUCTOR_NPU_BACKEND=ascendc` 选 Inductor 内部的 NPU Codegen；`torch_npu._inductor` **在导入阶段完成 backend 注册，所以该环境变量必须在 `import torch` 之前设置**，同进程先导入再改环境变量无法可靠切换已初始化的 Codegen。`scripts/run_train.sh` 默认设 AscendC，**`run_train_multinodes.sh` 不补这个默认值**——多机必须在所有节点启动前显式导出同一变量，并保证所有 rank 的 backend 与 pattern 集合一致。**② 标准路径是按 TransformerBlock 编译**（上游 `apply_compile` 对每个 Block 用 `compile(..., fullgraph=True)`），Block 内无法被 Dynamo 捕获的 Python 行为会**直接报编译错误、不会静默拆图**；而 Inductor 对**已捕获图内**不支持的节点仍会用 fallback/extern kernel——**Dynamo graph break 与 Inductor fallback 是两个阶段的两种现象，排障必须区分**。**③ 「训练成功」不等于融合生效**：AscendC backend 保留不满足 lowering 条件的 fallback 节点，必须查 lowering 日志、Kernel 清单与 profiling。**④ 动态 shape 与 custom op 都有契约边界**：会打开 `capture_scalar_outputs`，但仍受 Dynamo guard/数据相关控制流/layout/stride/view/indirect indexing/SoC/dtype 限制——单一静态 shape 编译通过**不能**证明变长序列、packed layout 或不同路由 token 数能复用同一融合 Kernel。**⑤ 惰性编译与缓存隔离**：首次执行包含捕获、AOTAutograd、Inductor 调度、AutoFuse Codegen、C++ wrapper 与 AscendC Kernel 编译，**不能用于稳态性能结论**；融合 Kernel 默认缓存到 `/tmp/.npu_kernels_<user>`（可用 `TORCHINDUCTOR_NPU_EXT_CACHE_DIR` 指定），缓存依赖文件锁、不能放在无法保证锁语义的跨 OS 共享目录。"

