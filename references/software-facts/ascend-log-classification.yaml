id: ascend-log-classification
type: software-fact
title: 昇腾日志分类与统一格式
summary: 昇腾日志分系统类（Device 侧）/ 应用类（Host+Device）/ trace（内存记录、出错或退出才落盘）三类；统一格式 [Level] ModuleName(PID,PName):DateTimeMS [FileName:LineNumber]LogContent；文件名中 id=Device ID、pid=业务进程 ID、*=创建时间戳

sources:
  - type: official-doc
    url: "https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/logreference/logreference_0001.html"
    version: "CANN 商用版 9.0.0（日志参考 logreference_0001）"
    fetched_at: 2026-08-28
    verification: cross-checked-source

