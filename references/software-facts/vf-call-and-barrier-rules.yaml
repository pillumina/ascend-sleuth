id: vf-call-and-barrier-rules
type: software-fact
title: asc_vf_call 的屏障语义与 UB 屏障规则（VF 期间 MTE2 被阻塞 / VF 内 LocalMemBar 会死锁）
summary: "两条容易踩的 VF 调用规则：①`asc_vf_call` 是**屏障**——VF 执行期间 MTE2 被阻塞，预取的 `DataCopyPad` 也得等 VF 结束才能执行，且**屏障时间守恒**（3 次短 VF 合并成 1 次长 VF 不减少总阻塞）；官方模式改用 `__no_simd_vf_fusion__` + 直接调用 VF 才能拿到重叠。②**在 `asc_vf_call` 内用 `Reg::LocalMemBar` 会死锁**——同一 UB 地址的先存后读本该插屏障，但在该调用形态下会 hang，必须先切成直接调用模式"

