id: llm-datadist-link-and-kv-transfer-contract
type: software-fact
title: LLM-DataDist 建链与 KV Cache 传输契约（类 TCP 建链 / rets 逐个判 / Pull 与 Push 的层范围语义 / 角色切换前置）
summary: "PD 分离里 LLM-DataDist 的传输面契约。**① 建链是类 TCP 流程**：Server 侧初始化时提供侦听信息（`OPTION_LISTEN_IP_INFO = ip:port`），Client 侧调 `LinkLlmClusters` 发起；**Server/Client 与 prompt/decoder 角色无关**，可自行设置。**② 返回值必须逐个判**：`LinkLlmClusters(clusters, rets)` 的第一个返回值是总状态，第二个是**每个 cluster 的状态数组**——只看总返回会漏掉单集群失败（`LLM_LINK_FAILED` 的官方排查方向就是「`LinkLlmClusters` 第二个返回值中有该错误码时检查两集群间网络连接」）。建链失败的排查面固定为三条：两台机器网络是否连通、Host IP 是否正确、port 是否被占用。**③ KV Cache 生命周期**：建链前自行申请内存 → `RegisterKvCache` 注册（拿到 `cache_id`）→ 断链后 `UnregisterKvCache` 解注册。传输四个接口**都与角色无关**：`PullKvCache`/`PushKvCache`（整块）与 `PullKvBlocks`/`PushKvBlocks`（按 block 列表）。**④ 层范围参数要按模型填**：`PushKvCache` 用 `KvCacheExtParam{src_layer_range, dst_layer_range, tensor_num_per_layer}`——**每层 tensor 数量须按实际模型修改**；文档给的调度手法是「P 侧一层计算完可在传输线程立即推送」，把大部分传输时间与计算重叠。**⑤ 断链两种形态**：链路非故障场景在 Client 侧发起 `UnLinkLlmClusters`；**链路故障场景在 PD 两侧都发起强制断链**。**⑥ 角色切换前置**：`SetRole` 切换角色（并由 option 决定 Client/Server——Client 切 Server 需指定侦听 Host IP 与端口，Server 切 Client 则不指定），**切换前必须已 `UnlinkLlmClusters` 断开所有链接**，否则报 `LLM_EXIST_LINK`。"

