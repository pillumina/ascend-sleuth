content:
  claim: "PD 分离场景下 KV 传输类问题的判读顺序是**建链 → 注册 → 传输 → 断链**，每一步都有确定的判据面：建链失败只看三件事（网络连通、Host IP、端口占用）且**必须遍历 `rets` 数组**；KV 拉取失败先分 `LLM_KV_CACHE_NOT_EXIST`（cache_id 错 / Cache 已释放 / **全量侧请求未完成** / 重复拉取）与 `LLM_WAIT_PROC_TIMEOUT`（**传输接口报它 = 链路不可恢复，须重新建链**，其他接口报它只需加大超时重试）；角色切换（`SetRole`）前未断链会直接报 `LLM_EXIST_LINK`。**层范围与每层 tensor 数是模型相关参数**（`tensor_num_per_layer` 需按模型改），填错的表现是传输内容错位/精度异常而非报错。"
  evidence: "llm-datadist_develop.md：『调用LinkLlmClusters接口在PD节点之间建立通信链路，链路主要用于KV Cache的传输』『建链接口采用类TCP建链流程，Server侧初始化时提供侦听信息，由Client侧发起建链，Server/Client与prompt/decoder角色无关，可以根据需求自行设置』『当调用LinkLlmClusters接口失败时，需排查两台机器网络是否连通，Host IP是否正确，port是否被占用』；建链示例中 `LinkLlmClusters(clusters, rets)` 之后 `for (const auto &inner_ret : rets)` 逐个判 `inner_ret != LLM_SUCCESS`；『在调用LLM-DataDist建链前可自行申请一块内存，并调用RegisterKvCache接口注册到LLM-DataDist，在断链后调用UnregisterKvCache接口进行解注册』；接口表『PullKvCache｜从远端节点拉取Cache到本地Cache，与角色无关』『PullKvBlocks｜在传输Blocks Cache场景下，通过配置block列表的方式…与角色无关』『PushKvCache｜从本地节点推送Cache到远端节点，与角色无关』『PushKvBlocks｜…与角色无关』；`KvCacheExtParam` 示例含 `src_layer_range`/`dst_layer_range`/`tensor_num_per_layer` 且注释『每层tensor数量，可根据实际模型修改』，并注『P侧一层计算完可在传输线程立即推送，以实现将大部分传输时间和计算重叠』；断链『一种是通过在Client侧发起断链，常用在链路非故障场景』『一种是通过在PD两侧都发起强制断链，常用在链路故障场景』；角色切换『调用SetRole接口对LLM-DataDist的角色进行切换，并通过option切换Client或者Server』『Client切换为Server需指定侦听的Host IP和端口；Server切换为Client时，option不指定Host IP和端口』。LLM-DataDist-error-code.md：LLM_LINK_FAILED『LinkLlmClusters第二个返回值中有该错误码时，需要检查对应集群之间的网络连接』；LLM_EXIST_LINK『检查在SetRole前是否已经调用UnlinkLlmClusters断开所有的链接』；LLM_KV_CACHE_NOT_EXIST 四条排查方向；LLM_WAIT_PROC_TIMEOUT『如果是PullKvCache、PullKvBlocks等传输相关接口报该错误，该链路不可恢复，需重新建链』"
  pitfalls:
    - "**只看 `LinkLlmClusters` 的第一个返回值是漏判**：单集群失败体现在第二个返回值 `rets` 里，必须逐个检查（`UnLinkLlmClusters` 同理）"
    - "**`cache_id` 与 Cache 生命周期要对齐**：`LLM_KV_CACHE_NOT_EXIST` 的官方排查方向之一是「对应全量侧（Prompt 侧）日志中的请求是否完成」——即**D 侧拉不到可能是 P 侧还没写完**，别只在 D 侧找"
    - "**传输接口超时与普通接口超时处置不同**：`PullKvCache`/`PullKvBlocks` 报 `LLM_WAIT_PROC_TIMEOUT` 时链路已不可恢复、必须重新建链；其他接口报同一码加大超时并重试即可"
    - "**角色切换前必须先断链**：`SetRole` 前未 `UnlinkLlmClusters` 会报 `LLM_EXIST_LINK`；切换 Client→Server 要带侦听 IP/端口，Server→Client 不带"
    - "**`tensor_num_per_layer` 是模型相关参数**：文档明确『每层 tensor 数量，可根据实际模型修改』——填错不报错但传输内容错位，精度异常的现场要回查这个值"
    - "**链路故障时单侧断链可能残留资源**：故障场景应在 PD 两侧都强制断链；`LLM_NOTIFY_PROMPT_UNLINK_FAILED` 的官方处置是排查网络并**主动调 Prompt 侧 `UnlinkLlmClusters` 清理残留**"
    - "集群数量有上限（clusters 不超过 16，超出报 `LLM_CLUSTER_NUM_EXCEED_LIMIT`）——扩容 PD 节点配比时先核这个上限"
