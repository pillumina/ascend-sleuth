id: msprof-enablement-methods
type: software-fact
title: 性能数据使能方式与 mstx 打点（msprof 命令行 / acl C&C++ 接口 / acl.json / Ascend Graph / 环境变量 + 依赖工具安装）
summary: "采性能数据的五种使能方式与各自入口：①**msprof 命令行**（拉起业务采集，最常用）；②**acl C&C++ 接口**（应用内调用采集与落盘、msproftx 扩展接口、订阅算子信息，采集数据另有说明）；③**acl.json 配置文件**（字段与 PROFILING_OPTIONS 同构：switch/output/storage_limit/aicpu/aic_metrics/l2/hccl/task_time/ge_api/ascendcl）；④**Ascend Graph 接口**（构图时采集：GEInitialize 传 option `ge.exec.profilingMode`/`ge.exec.profilingOptions`，或 `aclgrphProfInit/Finalize/CreateConfig/DestroyConfig/Start/Stop` 六件套，产物落在 profiler_path）；⑤**环境变量**（TensorFlow 训练/在线推理：PROFILING_MODE + PROFILING_OPTIONS）。**mstx/msproftx 打点**：`--msproftx=on` 后用 `--mstx-domain-include` / `--mstx-domain-exclude` 按 domain 过滤（两者互斥、都不配则采全部 domain，domain 名填 `mstxDomainCreateA` 的 name、`default` 表示默认 domain，配了不存在的 domain 则结果无该数据），采集 mstx 数据**必须传入用户程序**；PyTorch 场景用 TorchNPU Profiler API。**依赖工具**：Host 侧 disk 需 iotop、osrt 需 perf 与 ltrace，装完须配用户权限且**每次重装 CANN 都要重配**；iotop 不支持容器内使用。"

