content:
  claim: "`Scatter` 把数据按索引写到目标地址时，**并发写同一地址是覆盖语义（last-writer-wins），不是可交换的归约**——与 `Gather`（逐 lane 独立读取、互不重复）不同，Scatter 的多个源写入同一目标时没有「累加」或「取最大」的约定，最终留下的是最后写入的那个值，而「最后」取决于线程/lane 的执行顺序，因此**同一输入多次运行的结果可以不同**，属非确定性来源之一。**修法**：把待写元素按 (目标地址, 组内位置) 排序，**只让每个目标地址的组尾元素执行写**，把不确定的并发覆盖转成确定的单次写；若语义上确实需要归约（相加/取最大），必须显式实现归约而不是依赖覆盖。**诊断含义**：「同一输入重跑结果不一致」且涉及 scatter/gather/histogram/embedding 累加类算子时，先确认写冲突是否被显式处理；这类问题用固定随机种子也复现不了。"
  evidence: "simt_scatter_story README（Scatter 覆盖语义 = last-writer-wins、非可交换规约；按 (dst, 位置) 排序后只让组尾写以获得确定性；与 Gather 逐 lane 独立寻址的对比）"
