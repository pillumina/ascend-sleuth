id: scatter-write-conflict
type: software-fact
title: Scatter 并发写同址的覆盖语义（last-writer-wins，结果随调度顺序变化）
summary: "`Scatter` 的并发写是**覆盖语义**（last-writer-wins），不是可交换归约——多个 lane/线程命中同一目标地址时，最终值取决于执行顺序，**同输入多次运行结果可以不同**。修法是把写操作按 (目标地址, 组内位置) 排序后**只让组尾写**，把不确定的并发覆盖变成确定的单写"

