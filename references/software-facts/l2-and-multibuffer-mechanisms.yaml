id: l2-and-multibuffer-mechanisms
type: software-fact
title: matmul 的 L2 与多缓冲机制（SWAT 提命中率 / 只读权重绕过 L2 / K 尾轮 L0C 冲突 / 2-3-4 Buffer 条件）
summary: "四个与 L2、多缓冲相关的机制：①**SWAT**（M 向固定窗口 + N 向 Z 型往复滑动）通过提高多核单次访问的 **L2 命中率**改善 MTE2，做到首轮搬运即可 MMAD 不断流，Cube 利用率可达 95%+；②**只读一次的 weight 可绕过 L2**（双页表），不适用的数据不必占 L2；③**K 尾轮会出现 L0C 读写冲突**，需在 N 方向**分步搬出**；④**2/3/4-Buffer 的使能条件**与 `cycle_wasted = cycle_vec + cycle_latency − (BufferNum−1)×cycle_datamove` 的定量判据"

