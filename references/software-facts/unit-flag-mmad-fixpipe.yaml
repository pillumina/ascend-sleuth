id: unit-flag-mmad-fixpipe
type: software-fact
title: unit_flag：按 512B 块解绑 MMAD 与 FixPipe（尾轮取值 3 / 非尾轮 2）
summary: "当计算基本块过大占满 L0C、无法开缓存机制时，MMAD（计算）与 Fixpipe（搬出）无法并行；`unit_flag` 是指令级的解绑手段：MMAD 与 FixPipe 两侧同时配置后，计算单元每完成 **512B** 数据块，FixPipe 立即搬出该块，不必等全部算完。MMAD 侧 `para.unitFlag` 取 **尾轮 3（FINAL_ACCUMULATION）/ 非尾轮 2（NO_FINAL_ACCUMULATION）/ 0（关闭）**，FixPipe 侧用 `FixpipeParams{UNITFLAG_EN_OUTER_LAST}`，并须**删掉 MMAD 与 Fixpipe 之间的 `SetFlag/WaitFlag<HardEvent::M_FIX>` 同步**——尾轮取值配错会改变累加语义，是数值错误的直接来源"

