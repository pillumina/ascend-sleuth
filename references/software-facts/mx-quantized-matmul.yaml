id: mx-quantized-matmul
type: software-fact
title: MX 量化矩阵乘约束（Cube 每拍 16×C0×16 / baseK 必须 64 倍数 / MXFP4 按 B8 搬 / scale L1 缓存 3 份）
summary: "MX（microscaling）量化的 matmul 有四条硬约束：①Cube 每拍计算量是 `16 × C0 × 16`（MXFP8 的 C0=32、MXFP4 的 C0=64），算力下界据此估算；②MMAD 要求 `baseK` 是 **64 的整数倍**，K 非对齐要补零且补零方式随排布而异；③MXFP4 的 `ND2NZ` 不支持 B4 数据类型，必须按 **B8** 搬运、`stride`/`shape` 全部除以 2、输入内轴须为偶数；④scaleA/scaleB 由 MMAD 自动参与（`L0A_MX`/`L0B_MX`），可在 **L1 缓存 3 份**以减少 scale 搬运次数"

