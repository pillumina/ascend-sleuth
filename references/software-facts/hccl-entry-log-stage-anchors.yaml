content:
  claim: >-
    建域建链的日志按固定顺序出现，断在哪一行就是卡在哪一步——前提是先选对代际：V2（A5）的类名是 `[RankInfoDetect*]`，legacy（A2/A3）是 `TopoInfoDetect` / `TopoInfoExchangeServer` 一侧，拿另一代的类名去 grep 会全空。
    V2 的八个锚点与出处：① root 起控制面 `Entry-HcclGetRootInfo V950`（root_info_detect_provider.cc:39）→ `[RankInfoDetect::GetRootHandle] rootInfo: ...`（rank_info_detect.cc:380）；② 各 rank 拨号 `[RankInfoDetectService::RecvRemoteAgentId] agentId[...]`（rank_info_detect_service.cc:220）；③ 本卡自述 `[RankInfoDetectClient::GetLocalDevInfoJson]`（rank_info_detect_client.cc:497）；④ 汇总与广播 `broadcast topoinfo success`（rank_info_dispatcher.cc:43）；⑤ 探测收尾 `[RankInfoDetect::WaitComplete] topoExchangeServer port[...]`（rank_info_detect.cc:387、410）；⑥ 建图 `[RankGraphBuilder] Build VirtualTopo success!`（rank_graph_builder.cc:50）；⑦ 建链 `[CollComm][...] prebuilt worldTeam for protocol[%d] netLayer[%u]`（coll_comm.cc:396）、`[HostRdmaConnection::CreateCqAndQp]`（host_rdma_connection.cc:103）；⑧ 域就绪 `HcclCommInitRootInfoV2 success, take time [...]us, rankNum[...], rank[...], identifier[...]`（op_base_v2.cc:1850）。
    A2/A3 的等价锚点：入口 `Entry-HcclGetRootInfo:`（op_base_host.cc:771）与 `Entry-HcclCommInitRootInfoInner:ranks[%u], rank[%u], rootinfo: host ip[%s] port[%u] nicDeploy[%d] identifier[%s], deviceLogicId[%d]`（op_base.cc:1218）；拓扑来源 `SetupGroupMember`（topoinfo_detect.cc:406）与 `TopoExchangeAgent: client connect with server`；收人阶段 `topo exchange server get socket timeout`、`GetClusterTopoInfo`（topoinfo_detect.cc:448）；广播 `broadcast topoinfo success`（topoinfo_exchange_dispatcher.cc:32）；建链在算子期才见 transport 日志；完成是 `[InitCommRootInfo]Init success`（op_base_host.cc:1160）。
    Entry 日志的约定是每个对外 API 入口打一行 `Entry-<ApiName>`，用 `HCCL_RUN_INFO`（`HCCL_LOG_RUN_INFO = 0xff`，log.h:35；同处 `HCCL_LOG_INFO = 0x1`、`WARN = 0x2`、`ERROR = 0x3`），属于不受级别过滤的 RUN 级，落 run 目录。它的用途是反推调用序列，以及在没有 ERROR、只有超时时判断「最后进的是哪个门」。
  evidence: >-
    八步锚点在代码里的位置（逐条 grep 命中）：`Entry-HcclGetRootInfo V950` 在 src/coll_communicator_mgr/rank_info_detect/root_info_detect_provider.cc:39；`GetRootHandle` 日志在 rank_info_detect.cc:380；`WaitComplete` 在 rank_info_detect.cc:387，`topoExchangeServer` 在 :410；`RecvRemoteAgentId` 在 rank_info_detect_service.cc:220；`GetLocalDevInfoJson` 在 rank_info_detect_client.cc:497；`broadcast topoinfo success` 在 rank_info_dispatcher.cc:43（legacy 侧同名在 topoinfo_exchange_dispatcher.cc:32）；`Build VirtualTopo` 在 rank_graph_builder.cc:50；`prebuilt worldTeam` 在 coll_comm.cc:396；`CreateCqAndQp` 在 host_rdma_connection.cc:103；`HcclCommInitRootInfoV2 success` 在 op_base_v2.cc:1850。legacy 侧：`Entry-HcclGetRootInfo:` 在 op_base_host.cc:771，`Entry-HcclGetRootInfoScalable` 在 op_base.cc:899，`Entry-HcclCommInitRootInfoInner:...` 在 op_base.cc:1218，`Entry-HcclCollCommInitAll` 在 op_base.cc:286，`[InitCommRootInfo]Init success` 在 op_base_host.cc:1160，`SetupGroupMember` 在 topoinfo_detect.cc:406，`GetClusterTopoInfo` 在 :448。级别常量 `constexpr u32 HCCL_LOG_RUN_INFO = 0xff;` 与 INFO/WARN/ERROR 三个值见 src/legacy/ascend950/common/log.h:30-35。
  details: >-
    读 Entry 前先纠三个易错点：真实字符串是 `Entry-HcclCommInitRootInfo`（带 Comm）；一个 API 可能打两行 Entry（入口一行、带 rootInfo 详情的交互信息一行）；`HcclCommInitClusterInfo` 的普通版没有 Entry，只有 `[HCCL_TRACE]...success`，只有 Config 变体 `HcclCommInitClusterInfoConfig` 有 Entry。
    A5（V2）的建链相关 Entry：`Entry-HcclGetRootInfo V950`、`Entry-HcclCommInitRootInfo V950, rankId[%u], rankNum[%u].`（op_base_v2.cc:1817）、带 rootInfo 展开的第二行、`HcclCommInitRootInfoV2 success, take time [...]us, rankNum[...], rank[...], identifier[...]`（:1850）、`Entry-HcclCommInitRootInfoConfig V950`、`Entry-HcclCommInitAll V950`、`Entry-HcclCommInitClusterInfoConfig V950`、`Entry-HcomInitByFile V950` / `Entry-HcomInitByString V950`（rank table 路径）、`Entry-HcclCreateSubCommConfig V950`（建子域，不重新探测）、`Entry-HcclCommDestroy V950`、`Entry-HcclCommResume V950`（快恢重建链）。
    A2/A3（legacy）的入口名：`Entry-HcclGetRootInfo:rootInfo[%p], deviceLogicId[%d]`（op_base_host.cc:771）、`Entry-HcclGetRootInfoScalable`（op_base.cc:899）、`Entry-HcclCommInitRootInfoInner:ranks[%u], rank[%u], rootinfo: ...`（op_base.cc:1218）、`Entry-HcclCommInitRootInfoConfigInner`、`Entry-HcclCommInitRootInfoScalableInner`、`Entry-HcclCollCommInitAll`（op_base.cc:286）、`Entry-HcomInitByMasterInfo`、`Entry-HcomInitByFile` / `Entry-HcomInitByString`。**legacy 树里没有不带 Inner 的 `Entry-HcclCommInitRootInfo`**；命中项一律带 `Inner` / `ConfigInner` / `ScalableInner` 后缀，按带冒号的外层名 grep 会落空。`Entry-HcclGetRootInfo` 只有 root 会打，其他 rank 直接从 Init 那行开始。
    段位判断表：只看到 `Entry-HcclGetRootInfo` 没有 success → 卡在选网卡、抢端口、建 socket，查 EI0001（网卡）、EI0020（端口）、`get hostIp fail`；`Entry-HcclCommInitRootInfo` 之后看收人与广播；`rootinfo: host ip[...]` 那行的 ip 不对 → rootInfo 分发错了，查 `MASTER_ADDR` 或带外分发；探测日志有、`Build VirtualTopo` 没有 → 卡在建图，查 topo_file_path 与机型是否匹配；`Build VirtualTopo` 有、`prebuilt worldTeam` 没有 → 卡在通道建链，查协议 / 层级的链路与 QP 资源（A2/A3 没有 worldTeam 预制，改看 transport 日志是否出现）；有 Init success → 域已建立，可以下发算子。
    日志不出现不等于没执行，三类原因：级别与去向（默认只落 `~/ascend/log/...` 不打屏，要屏幕输出得开 `ASCEND_SLOG_PRINT_TO_STDOUT=1`；多进程同机按 pid 分文件，容易 tail 错进程）；路径没走到（用 rank table 文件初始化时没有 `[RankInfoDetect*]`，走 buildFromString 那条路；`rankSize == 1` 跳过本卡自述；复用已有通信域或建子通信域不重新探测；框架延迟初始化且还没发首个集合通信时 HCCL 还没被调用；单卡训练或 backend 不是 hccl）；版本与产品差异（legacy 路径用 `TopoInfoDetect` / `TopoInfoExchangeServer`，前缀不是 `[RankInfoDetect]`）。三步确认法：开 `ASCEND_GLOBAL_LOG_LEVEL=1` 与 `ASCEND_SLOG_PRINT_TO_STDOUT=1`，grep `Entry-HcclGetRootInfo|Entry-HcclCommInitRootInfo|Entry-HcclCommInitAll|Communicator Key Info`——锚点在、细节不在是级别问题；锚点也不在是没走这条路、没执行到那一步、或看错进程与文件；两者都在但时序怪就回去对八步表。
    三个常见误读：Entry 出现不等于成功（成败看 success 行或后续日志）；只有一个 Entry 说明没执行完，但要区分卡住（什么都没有）与很快失败（有 ERROR）；多进程日志里 Entry 交错是各进程各写自己的文件，按 pid 找，别在一个文件里对时间轴。以上文案随版本可能微调，定位时按关键字匹配，不要匹配整行；行号随 `cann/hcomm` 版本漂移，按文件名 + 关键字找更稳。
