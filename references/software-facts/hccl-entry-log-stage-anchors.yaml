id: hccl-entry-log-stage-anchors
type: software-fact
title: HCCL 建域建链的日志进度锚点（八步速查、Entry-Hccl* 清单、日志不出现的三类原因，含 A2/A3 与 A5 两代关键字）
summary: 只有超时没有 ERROR、需要判断卡在哪个 API 时看这条：两代（legacy / V2）的八步锚点与 Entry 清单，选错代际会 grep 不到。

