id: simd-vf-programming-constraints
type: software-fact
title: SIMD Vector Function 约束集（入参白名单 / 硬循环退化 / Aux Scalar 仅整数 / UnalignReg ≤4）
summary: "自定义算子（Ascend C SIMD Vector Function）的一族硬约束，多数以**编译失败**或**静默退化**表现：入参类型有白名单、入参数量受 PUSH_PB 头开销限制、循环要能被识别成硬件循环否则退化为 software loop（控制流指令暴涨）、VF 内标量计算只允许 16/32 位整数（禁浮点）、非对齐暂存器 UnalignReg 上限 4 个、VF 内禁止直接访问 GM。遇到 VF 编译报错或「VF 明明是计算却慢」时按这张清单排查"

