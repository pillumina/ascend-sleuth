id: elemwise-vs-reduce-bound
type: software-fact
title: elemwise 是 throughput-bound、归约是 latency-bound（判据：循环携带依赖）
summary: "判断 Vector 算子该往哪优化，分水岭是**相邻迭代之间有没有循环携带依赖**：elemwise 每个 lane 只读写自己的位置、无依赖 → **throughput-bound**，基线已最优，手写展开或 `#pragma unroll` 基本无效（发射已打满，只多出标量地址指令）；归约是多对一、累加器要用上一步结果 → **latency-bound**，耗时 ≈ **串行步数 × 延迟**，优化方向是**多累加器展开**藏延迟、可结合时用**二分/树形折叠**减步数——而 `#pragma unroll` 对归约**基本无效**"

