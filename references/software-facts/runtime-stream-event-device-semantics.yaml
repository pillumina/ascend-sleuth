id: runtime-stream-event-device-semantics
type: software-fact
title: Runtime 的 Stream / Event / Device 语义（Device 归属、默认 Device 与默认 Stream 的创建销毁时机、同步范围与传参规则）
summary: "三条决定定位方向的语义：①**Device 归属**——Stream 与 Event 在创建时绑定 Device，只能在该 Device 上使用，Event 只能关联到与其同 Device 的 Stream；跨 Device 协调要用 Event 同步，不能跨 Device 复用 Stream（否则 aclrtMemcpyAsync 报 107003、aclrtRecordEvent/aclrtStreamWaitEvent 失败）。②**默认 Device 与默认 Stream**——aclInit 默认不设 defaultDevice；默认 Stream 在 aclrtSetDevice 或 aclrtCreateContext 时自动创建、在 aclrtResetDevice/ResetDeviceForce 时自动销毁，不能显式销毁；显式创建的 Stream 必须 aclrtDestroyStream 配对销毁。③**同步范围与选择**——aclrtSynchronizeStream 阻塞整条 Stream 的全部任务，Event（aclrtRecordEvent / aclrtSynchronizeEvent / aclrtStreamWaitEvent）精确到时间点且支持跨 Stream；单 Stream 等待用 Stream 同步、跨 Stream 协调用 Event，单流场景用 Event 属过度设计，跨流不用 Event 会导致任务依赖关系错乱。需要 Stream 参数的接口默认 Stream 传 nullptr，同步接口不涉及默认 Stream。"

