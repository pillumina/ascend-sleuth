id: n-buffer-multi-level-pingpong
type: software-fact
title: N-Buffer 多级 ping/pong（L1 / L0A-L0B / L0C 各级独立配缓冲+事件标志）
summary: "双缓冲及以上不是只在某一级加一份缓冲，而是 L1、L0A/L0B、L0C **各级各自配一对 ping/pong**，各级用独立缓冲区索引（`l1BufId = l1PingPong & 1`、`l0BufId = l0PingPong & 1`）与**独立事件标志**循环切换，才使「搬运-计算」在每一级重叠。反过来说，各级共用同一组事件标志就是串行版——这解释了「开了 double buffer 但收益不达预期」"

