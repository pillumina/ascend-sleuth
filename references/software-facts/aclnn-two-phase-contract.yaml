id: aclnn-two-phase-contract
type: software-fact
title: aclnn 两段式接口契约（一阶段 GetWorkspaceSize / 二阶段执行）
summary: "aclnn 单算子接口固定为两段：一阶段 `aclnnXxxGetWorkspaceSize` 做入参校验、动态 shape 推导、Tiling、构建 L0 计算图、算 workspace 大小；二阶段 `aclnnXxx` 由 nnopbase 按图选算子提交到 NPU。据此把报错与耗时按段归属：一阶段失败多为入参 / shape / tiling / workspace，二阶段失败多为 kernel 选择与 runtime 下发；Tiling 落在一阶段还是二阶段取决于该 L0 算子是否显式指定 workspace"

