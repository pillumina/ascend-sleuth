id: exec-npu-cmd-async-launch
type: software-fact
title: EXEC_NPU_CMD 单算子下发（V1/V2 线程归属 + 十步异步提交 TaskQueue）
summary: "torch_npu 每个算子下发的固定展开：`task_queue_enable == 2` 走 `EXEC_NPU_CMD_V2`（参数预拷贝），否则走 V1（直接转换）；两者**只差一阶段 `GetWorkspaceSize` 在哪个线程执行**——V1 在主线程、V2 在消费线程，二阶段 `aclnnXxx` 两者都在消费线程（所以只有 V1 会阻塞主线程、影响训练 step 时间）。V1 固定十步，最后一步 `OpCommand::RunOpApiV2` 提交到异步 TaskQueue。这套结构就是把「Host 侧 launch 开销」拆开归因的依据"

