content:
  claim: "FlashAttention 的四阶段 `mm1 / vec1 / mm2 / vec2` 在昇腾上由 Cube 核与 Vector 核分担，**依赖关系只有三条**：①**同一轮次**的 mm1、vec1、mm2、vec2 必须**顺序执行**；②**不同轮次之间的 vec1** 顺序执行；③**不同轮次之间的 vec2** 顺序执行。据此可以**跨轮次错位**：非同一轮次的 `mm1` 与 `vec1`/`vec2`、`mm2` 与 `vec1`/`vec2` **都可以并行**，从而实现 Cube 与 Vector 两核并行工作。**实现做法**：循环里同时推进**三代任务**——源码常量 `FIA_PRELOAD_TASK_CACHE_SIZE = 3`，用 `loop % 3`、`(loop+2) % 3`、`(loop+1) % 3` 分别取本轮 / 上一轮 / 上两轮的数据。**未排流水时的典型症状**：四阶段串行，**Cube 核执行时 Vector 空闲、Vector 执行时 Cube 空闲，两核利用率都极低**——看到「两个引擎的占用都低但 kernel 很慢」，先查是否只排了一代任务（没有跨轮次错位）。**诊断含义**：把「Cube/Vector 利用率都低」从「算力不够」区分出来；也说明这类算子加核或换 dtype 不解决问题，要改的是**任务推进的代际结构**。"
  evidence: "源 README：依赖三条的表述与该样例『典型症状：未排流水时四阶段串行，Cube 核执行时 Vector 空闲、Vector 执行时 Cube 空闲，两核利用率都极低』；源码常量『static constexpr uint32_t FIA_PRELOAD_TASK_CACHE_SIZE = 3;』与 `loop % 3` / `(loop+2) % 3` / `(loop+1) % 3` 的三代推进写法"
