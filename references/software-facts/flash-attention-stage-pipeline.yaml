id: flash-attention-stage-pipeline
type: software-fact
title: FlashAttention 四阶段的三条依赖与跨轮次错位（FIA_PRELOAD_TASK_CACHE_SIZE = 3）
summary: "FA 的 mm1/vec1/mm2/vec2 四阶段由 Cube 核与 Vector 核分担，依赖关系**只有三条**：①同一轮次的四阶段顺序执行；②不同轮次之间的 vec1 顺序执行；③不同轮次之间的 vec2 顺序执行。因此**非同一轮次的 mm1 与 vec1/vec2、mm2 与 vec1/vec2 都可并行**，实现 Cube 与 Vector 并行。做法是循环内同时推进三代任务（源码常量 `FIA_PRELOAD_TASK_CACHE_SIZE = 3`，用 `loop % 3`、`(loop+2) % 3`、`(loop+1) % 3` 取本轮/上一轮/上两轮）。**未排流水时的典型症状**：四阶段串行，Cube 执行时 Vector 空闲、Vector 执行时 Cube 空闲，两核利用率都极低"

