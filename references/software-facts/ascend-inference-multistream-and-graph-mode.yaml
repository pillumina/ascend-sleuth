content:
  claim: "**① 多流的硬件与软件条件**：Device 侧可独立调度的物理执行资源是 **Cube**（大矩阵乘类计算，多 Stream 竞争、可分核并行）、**Vector**（向量/激活/规约类）、**HCCL**（集合通信，与计算资源独立）。算子按算力使用可分为纯 Cube（如非量化 Matmul）、纯 Vector（如 RMSNorm）、混合（量化的 Matmul、flash attention 系列）三类。**两种情况下通信算子会占用 Vector**：配置 `HCCL_OP_EXPANSION_MODE=AIV`，或使用通算融合算子（同时用计算与通信单元、算子内计算与通信分片并行，适合数据量较大时）。Stream 是 Host 向 Device 下发任务的队列——**同一 Stream 内任务按入队顺序串行，Stream 之间由同步语句（Event）与调度器决定**。划分 Stream 有两种思路：把无数据依赖的分支分别放两条流；或按资源类型划分（一条计算流、一条通信流）并在其间加 Event。Event 是跨 Stream 的同步原语（A 流 `record_event` 标记时间点、B 流 `wait_event` 等待其完成），用途有二：跨流数据依赖的保序，以及**控制算子执行顺序以错开资源**（例：不用 Event 控制时可能 110us，用 Event 控制关键路径后可到 100us）。**② 三种并行形态**：**Cube 与 Vector 互补**——分离模式平台上两类单元可独立调度，把 Cube 算子与 Vector 算子交替编排在两条流（一个分支沿用主流、另一个走副流，副流结果最终回到主流）；一般 Cube 算子居多、是瓶颈，理想情况 Cube 利用率接近 100%、其他并行单元的时间被掩盖。**同类计算池分核**——小数据量场景算子对核的利用效率不高（如某算子全核耗时 T、半核耗时 1.5T，两个相近 Matmul 从串行 2T 变为各半核并行 1.5T，**优化 25%**）；量化场景的混合算子若 Vector 利用率很低，可把部分 Vector 划给并行流（需支持分离模式；如 Atlas A2/A3 的 AiCore Cube:Vector = 1:2，可划分 Cube:Vector=1:1 的混合计算流与另一条 Vector 流）；**但分核后两条流耗时往往不等，而后续计算要等两条流都完成，不等的部分会让核闲置、吃掉收益甚至导致性能劣化**（Decode 这类数据量小、算子小的场景常采用，且多在图模式下于首次图执行时确定分核比例，而两条流实际耗时会随 kv cache 长度、MoE 路由负载变化，所以需要按实测判断是否采用）。**计算与通信互补**——把通信算子切到独立 Stream 与主流计算并发；若通信占用 Vector（上述两种情形），需给通信流分配部分 Vector 核、计算流相应减核，否则两条流无法并行；**DBO（Dual Batch Overlap）**把一个 batch 的通信与另一个 batch 的计算并行，但拆分本身有代价（单个算子数据量越大硬件效率越高，拆小后带宽/指令效率下降、调度启动开销占比上升），**Decode 是访存瓶颈且两个 batch 都要加载全量 weight，会使两份 batch 计算时间近乎翻倍，因此 DBO 主要用于 Prefill 优化**。**③ 三种执行模式的多流接口不能混用**（`exe_mode` 取 `eager`/`ge_graph`/`npugraph_ex`）：eager 由脚本创建与切换 Stream（`torch.npu.Stream()`、`with torch.npu.stream(side_stream)`、`side_stream.wait_stream(main_stream)` 粗粒度汇合、`record_event`/`wait_event` 精确同步、`tensor.record_stream(stream)` 延长跨流消费 tensor 的生命周期）；ge_graph 的多流表达进图内由 GE 编译器分配逻辑 Stream（`tng.scope.npu_stream_switch('tag')`、`tng.scope.npu_wait_tensor(anchor, wait_tensor)`、`tng.scope.limit_core_num(aic, aiv)`），跨流依赖以图边显式表达；npugraph_ex 沿用 eager 的流切换并显式 `event.record()`/`event.wait()`。**在 ge_graph 模式调用 `record_event`/`wait_event` 会因外部对象语义无法接入图内而导致同步失效或编译失败**。**限核的关键约束**：`limit_core_num` 让两条并行 Stream 各分到核（例 12+24），**两条并行分支的核数之和一般等于总核数，超过会导致无法并行甚至资源互锁卡死**。**④ 图模式**：eager 是「边解释边执行」，大模型推理（尤其 Decode，单次 token 少、算子粒度小）下 Host 侧逐算子下发与运行时调度开销容易暴露成 **host bound**；图模式把前向逻辑提前捕获为计算图交给后端统一编译执行，后端据此做算子融合、常量折叠、内存复用、通信入图、多流调度与下沉执行，Host 只需一次性下发整图、Device 连续执行。**Prefill 与 Decode 的适配价值不同**：prefill 序列长度动态、单次计算量大、Host 下发开销占比低，**通常保持 eager**；decode 单 token/固定小长度、shape 更稳定、算子更小，**推荐图模式**。npugraph_ex 的捕获与复用五环节：**Dynamo compile**（Python 级 JIT，把前向的 PyTorch 操作序列提成 FX 图交给后端）→ **Guards**（对输入 shape、dtype、部分标量的假设，每次执行前校验；全部命中才复用已有图，否则重新捕获编译）→ **aclgraph Capture**（把一段稳定的 NPU 执行过程——kernel 序列与内存布局——固化）→ **Input 处理**（回放前把图内 input 类参数的输入地址更新为运行时地址；私有格式如 `FRACTAL_NZ` 的信息会被保留）→ **Replay**。仓内把捕获与编译放在 **warm-up 阶段**（先跑一遍 Decode 触发编译并缓存），正式推理只走 Guards 校验、Input 处理与 Replay，使编译开销不落在关键路径上——**因此图模式收益的前提是 Guards 稳定命中**，也解释了为什么图模式主要用于 Decode，并要求模型侧保持输入 shape 与常驻 buffer 地址稳定。**编译缓存（cache compile）**在此基础上把编译产物（图结构、kernel 序列、内存布局）序列化落盘到 `cache_dir`，实现**跨进程/跨启动复用**（图复用解决的是同一进程内多次 Decode 复用同一张图，编译缓存解决跨进程复用），**模型代码、输入 shape/dtype、编译配置或 cache_dir 任一变化即视为未命中并回退重新编译**。**⑤ 两类图模式后端的对比与选择**：`ge_graph` 把 `torch.compile` 捕获的 FX 图转成 Ascend IR 再由 GE 编译执行，图内表达能力强（TorchAir scope、通信入图、图内多流），配置走 `CompilerConfig.experimental_config`，后端 `torchair.get_npu_backend(...)`，缓存编译 `torchair.inference.cache_compile(...)`，常见 `dynamic=False`，增强能力如 `frozen_parameter`、`tiling_schedule_optimize`、`topology_sorting_strategy`；`npugraph_ex` 基于 capture & replay，体验更接近 eager，配置走 `options` kwargs，后端 `backend=\"npugraph_ex\"`，缓存编译 `torch.npu.npugraph_ex.inference.cache_compile(...)`，常见 `dynamic=True`，增强能力如 `static_kernel_compile`、`frozen_parameter`；**当前建议优先 `npugraph_ex`**（降低适配成本）。`npugraph_ex` 常保持 `dynamic=True` 并非图本身必须动态，而是与部分 FIA 算子接口有关——部分 `actual_seq_lengths` 仍以 `list[int]` 传入，强行静态化容易触发重编译；若模型没有这类 list 输入（如 deepseek_v4），建议改静态图（`enable_dynamic_graph=False`）以获得更稳定的复用与更低下发开销。**⑥ 模型代码必须满足的条件**：eager 路径先稳定（**图模式不会修复 eager 下本就存在的功能或精度问题**，接入前应确保 eager 下 Prefill 与多轮 Decode 稳定且精度符合预期）；Prefill 与 Decode 明确区分（Prefill 保持 eager、Decode 用图模式，用 `forward_metadata.is_prefill` 或独立 `prefill()`/`decode()` 区分）；动态信息显式传入（`kv_len`、`position_ids`、`actual_seq_lengths_q/kv`、`is_prefill` 由框架构造后作为显式输入，不在模型内临时生成 Python 标量或依赖隐式全局状态）；KV Cache、attention mask、position buffer 等常驻数据预分配并**原地更新**（避免 Decode 过程中 shape 或地址变化导致 guard 失败与重编译）；避免 graph break 写法（`tensor.item()`、基于 Tensor 值的 Python `if`/`while`、forward 内临时创建影响 shape 的控制分支、按 Python list/tuple 长度变化切换图内控制流）。**⑦ 高频问题速查（现象→根因→处理）**：编译前报错 → eager 路径本身不正确或输入 shape/dtype/长度组织不稳定 → 先单独验证 eager；图捕获中断 → `.item()`、Tensor 驱动的 Python 分支、`print`、自定义算子未适配 → 改写为 Tensor 逻辑或补齐入图适配；**Decode 性能没提升甚至变差 → 发生重编译或图执行没命中预期优化 → 打开重编译日志检查 guard 变化、shape、地址与缓存命中**；`actual_seq_lengths` 类型报错 → 图模式与 FIA 接口不匹配 → ge_graph 优先 Tensor + `torchair.ops`、npugraph_ex 对齐 `list[int]`；`enable_static_kernel` 报错 → **该选项只在 npugraph_ex 下可用**；`superkernel` 报错 → 当前主要在 ge_graph 模式下尝试；通信无法入图 → 集合通信入图前置处理不完整 → 按 PyTorch/TorchAir 版本检查是否需要 `torchair.patch_for_hcom()`；cache compile 不生效 → 缓存目录、输入规格或编译配置变化 → 固定 cache 目录并保持模型代码/函数名/shape/dtype/配置稳定；图模式精度异常 → KV Cache、FA 接口或原地更新语义变化 → **回退 eager 对齐，再逐项恢复图模式优化**。**⑧ 增强特性的推进顺序**：先跑通 eager 并验证功能与精度 → 打开图模式消除 graph break 与 recompile → 对比 eager 与 graph 输出（至少覆盖一轮 Prefill 与多轮 Decode）→ 再按需开 `enable_cache_compile`、`enable_static_kernel`、多流、限核或 `enable_superkernel`；`enable_static_kernel` 仅用于 npugraph_ex（ge_graph 静态图中算子默认是静态算子），`enable_superkernel` 当前主要在 ge_graph 下尝试。"
  evidence: "multi_stream_principles.md：『Cube｜大矩阵乘类计算｜多 Stream 竞争，可以进行分核并行』『同一 Stream 上的任务按入队顺序串行执行，Stream 之间的算子执行顺序由同步语句（如 Event，见下文）和调度器决定』『方案一：不使用 Event 控制，可能 Stream1 先被调度执行，耗时 110us』『方案二：使用 Event 控制顺序，关键路径更短，耗时 100us』『那么两个相近的 Matmul 的计算时间从串行的 2T 优化到各占一半核并行的 3/2 T，优化了 25%』『例如 Atlas A2/A3 平台，AiCore 中 Cube:Vector=1:2，可以划分出 Cube:Vector=1:1 的 Cube/Vector 混合计算 Stream，和另一条 Vector Stream』『分核后两条并行的 Stream 耗时不相同，而后续计算依赖两条 Stream 的结果，因此分给对应的 Stream 的核处于闲置状态，会抵消掉部分性能收益，严重情况下可能会导致没有收益甚至性能劣化』『例如 Decode 一般是访存瓶颈（weight 加载），DBO 切分的两 batch 加载的 weight 都是全量的，从而导致两份 batch 的计算时间近乎翻倍，因此 DBO 一般主要用在 Prefill 优化上』『例如在 ge_graph 模式调用 record_event / wait_event 会因外部对象语义无法接入图内而导致同步失效或编译失败』『两条并行 Stream 通常都要限核…一般并行分支所有核数加起来等于总核数，超过到导致无法并行甚至资源互锁卡死』。npu_graph_optimization.md：『eager 模式…Host 侧逐算子下发和运行时调度开销容易暴露出来，最终形成 host bound』『prefill｜序列长度动态变化，单次计算量较大｜通常保持 eager』『decode｜单 token 或固定小长度输入｜推荐使用图模式』『Guards 全部命中则复用已有图，否则触发重新捕获与编译』『因此图模式收益的前提是 Guards 稳定命中』『缓存失效：若模型代码、输入 shape / dtype、编译配置或 cache_dir 中任意一项发生变化，缓存视为未命中』『图模式不会修复 eager 下本来就存在的功能或精度问题』高频问题速查表逐行、『Decode 性能没有提升甚至变差｜发生重编译，或图执行没有命中预期优化｜打开重编译日志，检查 guard 变化、shape、地址和缓存命中情况』『enable_static_kernel 报错｜开启模式不匹配｜该选项只在 npugraph_ex 模式下使用』『先跑通 eager，并完成功能与精度验证。打开图模式，消除 graph break 和 recompile…再按需开启 enable_cache_compile、enable_static_kernel、多流、限核或模型自带的 enable_superkernel』"
