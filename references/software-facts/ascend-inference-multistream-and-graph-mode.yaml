id: ascend-inference-multistream-and-graph-mode
type: software-fact
title: 推理侧多流并行与 NPU 图模式（两种并行的成立条件、三模式接口不可混用、Guards 命中是收益前提、9 条图模式高频问题）
summary: "推理性能定位里最常被误解的两块机制。**多流**：Device 侧物理单元 Cube（大矩阵乘）、Vector（向量/激活/规约）、HCCL（集合通信）可独立调度，Stream 是 Host 向 Device 下发任务的队列（同流串行、跨流由 Event 与调度器定序）；三种并行形态——**Cube↔Vector 互补**（分离模式下两类单元可独立调度，把两类算子交替编排到主流/副流，让作为瓶颈的 Cube 保持忙碌）、**同类计算池分核**（小数据量时算子对核的利用效率不高，如某算子用全核耗时 T、用一半核耗时 1.5T，两个相近 Matmul 从串行 2T 变各半核并行 1.5T 即省 25%；两条并行流分核后耗时不等会造成核闲置，可能吃掉收益甚至劣化，需按实测调比例）、**计算与通信互补**（通信算子切独立流与计算并发；注意 `HCCL_OP_EXPANSION_MODE=AIV` 与通算融合算子会占用 Vector，此时须分核给通信流）。三种执行模式（eager / `ge_graph` / `npugraph_ex`）的多流与 Event 接口**各不相同且不能混用**（如 ge_graph 里调 `record_event`/`wait_event` 会同步失效或编译失败）；`limit_core_num(aic, aiv)` 限核时**两条并行分支的核数之和须等于总核数，超了会导致无法并行甚至资源互锁卡死**；跨流消费的短生命周期 tensor 必须 `record_stream` 延长生命周期。**图模式**：eager 在 Decode 上易 host bound，图模式把前向捕获成图后由后端统一编译执行（融合、内存复用、调度优化、下沉执行）；**Prefill 通常保持 eager、Decode 推荐图模式**（shape 稳定、算子小、易复用）；npugraph_ex 的捕获复用有五环节（Dynamo compile → Guards → aclgraph Capture → Input 处理 → Replay），**收益前提是 Guards 稳定命中**；编译缓存把编译产物落盘以跨进程复用，代码/shape/dtype/配置/cache_dir 任一变化即失效。图模式不修复 eager 下的功能与精度问题——**先让 eager 稳定再上图**。"

