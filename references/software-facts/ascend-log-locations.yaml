id: ascend-log-locations
type: software-fact
title: 昇腾日志存储路径（EP / RC / Control CPU 开放形态，含 EP 现场采集包 npu_log_collect 布局）
summary: "昇腾日志存储路径：EP 应用类 $HOME/ascend/log、系统类走 msnpureport 导出或现场采集包 npu_log_collect（driver_log/<时间戳>/slog/dev-os-id/，debug 下有 device-id 与 device-os 两级）；event 文件名时间戳是创建时间、非内容范围；RC 与 Control CPU 在 /var/log/npu/slog 分 debug/run/security 并支持老化删除"

sources:
  - type: official-doc
    url: "https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/logreference/logreference_0002.html"
    version: "CANN 商用版 9.0.0（日志参考 logreference_0002/0003/0004）"
    fetched_at: 2026-08-28
    verification: cross-checked-source

applies_to:
  platforms: [cross]
  versions:
    cann: "9.0.0"
  categories: [interrupt]

status: active
last_verified: 2026-09-16

content:
  claim: "日志存储路径按部署形态区分：Ascend EP 应用类日志默认在 $HOME/ascend/log（容器内或物理机内均可查看），系统类日志因无 Device 侧登录权限，须用 msnpureport 工具导出到 Host 查看，或直接取现场采集包（根目录 /var/log/ascend-hardware/npu_log_collect/）；Ascend RC 与 Control CPU 开放形态的系统类和应用类日志均在 /var/log/npu/slog 下按 debug/run/security 分目录（dev-os-id 系统进程 / device-app-pid 应用进程 / event 事件 / device-id 非 Control CPU，另有 slogd/slogdlog 维测日志 1MB 滚动备份）。卡级目录前缀以现场实际为准：CANN 9.0.0 troubleshooting 文档与 EP 现场采集包实测均为 dev-os-id，部分工具文档写作 device-os-X（差异见 pitfalls）。所有日志支持老化：超过配置的存储限制自动删除最早的日志目录或文件；Control CPU 开放形态默认每类型存 24 个 device-app-pid 目录、15 秒扫描一次、最多 24 个应用进程并发（超过可能导致日志丢失）。容器内查看需将日志工具动态库 libascendalog.so 及其依赖 libc_sec.so 所在路径映射进容器。"
  evidence: "日志参考 logreference_0002（EP：$HOME/ascend/log 应用日志、${INSTALL_DIR}/compiler/lib64/libascendalog.so 与 ${INSTALL_DIR}/driver/lib64/common/libc_sec.so 容器映射、msnpureport 导出系统日志）、0003（RC：/var/log/npu/slog/{debug,run,security}/device-os|device-app-pid、run/event、device-id、slogd/slogdlog 达 1MB 变 slogdlog.old）、0004（Control CPU 开放形态：每类型 24 个 device-app-pid 目录/15 秒扫描/24 并发上限、device-os 与 event 需 msnpureport 导出）——这三条文档的卡级前缀均写作 device-os。EP 现场采集包实测（2026-09-15 诊断，agent 按采集包目录结构抽取、未逐字核验原始文档，reviewer 需 spot-check）：包根 var/log/ascend-hardware/npu_log_collect/；driver_log/<采集时间戳>/slog/ 按卡分目录 dev-os-id（实测 dev-os-0..7），每卡 debug/ 内 device-id/device-id_<ts>.log（设备日志）与 device-os/device-os_<ts>.log（系统进程日志）两级并存，run/ 内 device-app-<pid>/、device-os/、event/event_<ts>.log，另有 slogd/slogdlog[.old]；driver_log/<采集时间戳>/message/ 与 slog/ 平级、同样按卡分目录（message/dev-os-id/messages[.0]）。同批官方文档对同一层级有两种写法：CANN 9.0.0 troubleshooting 用 slog/dev-os-id/run/event/（与实测一致），Ascend 950 HCCN Tool 文档写 /slog/device-os-X/debug/device-os|device-X。"
  locations:
    ep:
      app: "$HOME/ascend/log/{debug,run,security}/（含 plog 与 device-id 日志，Device 侧日志自动回传 Host，默认 2000ms 延时）"
      system: "无 Device 登录权限，两条取数路径：①用 msnpureport 工具导出到 Host 查看；②直接取现场采集包，根目录 /var/log/ascend-hardware/npu_log_collect/，顶层为 driver_log/<采集时间戳>/（内含 slog/、message/、hisi_logs/、stackcore/、system_info/）与 hccn_log/、npu_smi_log/、pcie_log/、os_info/、version_log/、install_log/、log_messages.tar.gz。采集包内 slog/ 按卡分目录 dev-os-id，每卡下 debug/、run/、slogd/ 三支：debug/ 内 device-id/（device-id_<ts>.log 设备日志）与 device-os/（device-os_<ts>.log 系统进程日志）两级并存；run/ 内 device-app-<pid>/（应用进程设备侧日志）、device-os/、event/event_<ts>.log（事件日志，含 RAS event_id）；slogd/slogdlog[.old] 为维测日志。message/ 与 slog/ 平级且同样按卡分目录：message/dev-os-id/messages[.0]。"
      container: "需映射 ${INSTALL_DIR}/compiler/lib64/libascendalog.so 与 ${INSTALL_DIR}/driver/lib64/common/libc_sec.so"
    rc:
      system: "/var/log/npu/slog/{debug,run,security}/dev-os-id/、run/event/、debug/device-id/（RC 板端路径以现场为准，前缀参考 EP 实测为 dev-os）"
      app: "/var/log/npu/slog/{debug,run,security}/device-app-pid/"
      diag: "/var/log/npu/slog/slogd/slogdlog（维测日志，达 1MB 变 slogdlog.old 备份）"
    control_cpu:
      app: "/var/log/npu/slog/{debug,run,security}/device-app-pid/"
      system: "/var/log/npu/slog/{debug,run,security}/dev-os-id/、run/event/（需 msnpureport 导出）"
      diag: "/var/log/npu/slog/slogd/slogdlog"
      aging: "默认每类型 24 个 device-app-pid 目录、15 秒扫描、最多 24 并发进程（超过可能导致日志丢失）"
  pitfalls:
    - "event_*.log 的文件名时间戳是文件创建时间，不是内容时间范围：按文件名挑日志会选错覆盖窗口。实测 event_20260625170411100.log 创建于 2026-06-25，内容覆盖 2026-08-10~09-16（HBM scrub ECC serial 2→1642）。判断某条记录是否落在问题窗口内看行内时间戳，选日志看内容时间区间。"
    - "卡级目录层级名在不同来源不一致：CANN 9.0.0 troubleshooting 文档与 EP 现场采集包实测为 dev-os-id，Ascend 950 HCCN Tool 文档的 msnpureport -f 说明写作 device-os-X。以现场实际目录为准，不按文档名硬拼路径。"
