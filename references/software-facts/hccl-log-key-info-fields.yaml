id: hccl-log-key-info-fields
type: software-fact
title: HCCL 关键日志的检索关键字与字段含义（Communicator/LocalRank Key Info、HCCL_ENV、Entry- 算子入参、task exception 三段）
summary: "从 CANN 日志里取 HCCL 证据的四个检索入口：①`Communicator Key Info` / `LocalRank Key Info`——一行的通信域关键信息（identifier/rankSize/serverNum/moduleNum/superPodNum 及两个「是否不一致」标志）与本端关键信息（userRank/hostIp/devicePhyId/server/deviceIp/superPodId/useSuperPodMode/isStandardCard），值为 1 表示是、0 表示否；②环境变量实际生效值——检索 `HCCL_ENV`（A3/A2/910/310P），Ascend 950PR/950DT 改为检索 `base_config`；③算子级下发入参——开启 `HCCL_ENTRY_LOG_ENABLE` 后 run/plog 每次下发打印 tag/sendBuf/recvBuf/count/dataType/op/localRank/streamId/comm/deviceLogicid，是比对 rank 间行为是否一致的唯一手段；④task exception 三段信息——base information(stream/taskid/tag)、groupRank information(group/rankSize/rankId)、opData information(deviceId/index/count/reduceType/src/dst)。另记通信域初始化/析构在 run 目录默认打印（ranks/rank/rootinfo/identifier）。"

