id: bf16-intermediate-precision
type: software-fact
title: BF16 中间计算的精度处理（升 FP32 计算 / 等价重结合会改变 BF16 舍入位置）
summary: "BF16 的尾数只有 8 位，两类精度事故有明确机制：①**中间结果在 BF16 上直接计算**会累积舍入误差（修法是 BF16 load → FP32 compute → BF16 store，来源实例最大偏差 0.0078125）；②**代数等价的重新结合**（如把 `(a+b)+c` 改成 `a+(b+c)`、或提前乘/除一个因子）在 BF16/FP16 上**改变舍入位置**，公式等价但结果不等——这是「改了实现方式后精度变了」的一类根因"

