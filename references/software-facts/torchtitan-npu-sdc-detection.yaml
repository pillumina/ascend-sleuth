id: torchtitan-npu-sdc-detection
type: software-fact
title: torchtitan-npu 的 SDC 检测（静默数据损坏：gradient / matmul checksum / HCCL 三路，typed 参数默认值与前置约束）
summary: "torchtitan-npu 内置的 **SDC（Silent Data Corruption，静默数据损坏）检测**，检测 torch.compile + Inductor 编译训练中的 gradient、HCCL 与 matmul checksum 异常。**默认关闭**，通过 `TrainerEx.Config.sdc` 的 typed CLI 参数按需开（`--sdc.gradient-enabled`、`--sdc.with-checksum`、`--sdc.hccl-mode 0|1|2|3`），或走 torch-npu 原生变量 `NPU_ASD_CONFIG`/`NPU_ASD_ENABLE`（Eager 模式）。**有效开启条件是 `gradient_enabled or hccl_mode != 0`**；全部默认值时 SDC 不导入 torch-npu、也不校验编译兼容性；任一 gradient tuning 参数偏离默认值时必须同时开 `--sdc.gradient-enabled`。**compiled SDC 的前置**：`compile.enable=true` 且 `compile.components` 含 `model`、`compile.backend=inductor`、**`parallelism.pipeline_parallel_degree=1`（不支持流水线并行）**。**检测时机**：HCCL 检测在模型构建完成后一次性启用，覆盖此后的 forward/backward 与训练步骤间的 collective，**不覆盖 Trainer 构造期间的初始化通信**，且启用可能带来额外性能损耗；checksum 只对训练图中的 **BF16 `aten.mm`/`aten.matmul`/`aten.bmm`** 插入 checksum custom op（`nn.Linear` 可能被编译成尚未覆盖的 `aten.addmm`）。**改模式必须重启 worker**：SDC 用进程级 torch-npu 与 Inductor 状态，不提供运行期重配置或卸载接口。"

