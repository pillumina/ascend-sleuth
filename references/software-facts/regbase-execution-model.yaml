id: regbase-execution-model
type: software-fact
title: RegBase 执行模型与收益判据（UB 往返 1.72x / IPC 上限 2 / --cce-res-usage 读寄存器与 Stack）
summary: "RegBase（`__simd_vf__` + `RegTensor`）与 MemBase（`LocalTensor` + 标准 Vector API）的差别只在 **UB 内计算方式**：MemBase 一步计算就是「UB 读 → 算 → 写回 UB」，中间结果反复落 UB 时 `RVECLD + RVECST` 可达 `RVECEX` 的 1.72x；RegBase 用显式 `Reg::LoadAlign`/`StoreAlign` + `MaskReg` 尾块，消除这段往返。IPC 上限由指令发射能力决定（Add/Mul 双发 ≤2、ReduceSum 单发 ≤1，Membar 会打断 VF 流水）；寄存器与 Stack 用量可用 `--cce-res-usage` 直接读出"

