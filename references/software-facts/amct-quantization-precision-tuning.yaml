id: amct-quantization-precision-tuning
type: software-fact
title: AMCT 量化的精度三手段（基于精度的自动量化 / 校准集 batch_num 建议 16 或 32 / skip_layers 跳过损失大的层）与损失层两步比对法
summary: "量化模型精度不够时的三条手段与一条定位法：①**基于精度的自动量化**——借助 AMCT 工具提供的 Python 接口，在保证用户所需模型精度前提下自动搜索模型的量化配置并执行**训练后量化**，生成满足精度要求的量化模型（当前 PyTorch、TensorFlow、Caffe 框架支持）。②**校准集规模**——基于精度的自动量化里手动改量化配置中的 `batch_num` 可调整校准使用的数据量，`batch_num = total_nums / batch_size`（total_nums 总图片数、batch_size 每 batch 图片数）；batch_num 越大样本越多、量化后精度损失越小，但样本过多不带来精度提升，反而占用更多内存、降低量化速度，并可能引起内存/显存/线程资源不足——**建议 batch_num × batch_size 取 16 或 32**。③**skip_layers 跳过量化损失大的层**——先用精度比对工具比对原始模型与量化后模型各层的精度，找出精度损失大的层，再在基于精度的自动量化里配 `skip_layers` 跳过（多层用逗号分隔）；若跳过某层影响模型推理结果数据，需自行调整模型再重新量化。④**量化场景精度损失层定位（两步比对，当前仅 Caffe）**——先『非量化原始模型（GPU/CPU） vs 量化原始模型（GPU/CPU）』定位**量化阶段**的精度问题，再『量化原始模型（GPU/CPU） vs 量化离线模型（关闭融合规则，NPU）』定位**模型转换阶段**的精度问题。"

