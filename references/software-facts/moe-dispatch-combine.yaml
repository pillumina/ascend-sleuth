id: moe-dispatch-combine
type: software-fact
title: MoE Dispatch/Combine 的对等内存单边写机制（mte_put / K+1 状态位 / 通信前量化收益边界）
summary: "EP 扩大后 MoE 推理的主瓶颈是 Dispatch/Combine 通信。替代传统 `alltoallv` 的做法是：基于对称共享内存按 token 逐个发送/接收，用 `mte_put` 跨 PE 单边写对端窗口偏移（`aclshmem_ptr(shmemCtx, pe) + offset`），并用 pipeline 把通信与数据整理重叠；每个 token 携带 `rank_id`/`bs_id`/`k_offset` 三元组用于算回程偏移；Combine 的同步语义是「等对应 batch 的 **K+1** 个状态位全为 1」。挂死的典型形态就是卡在等对端 flag"

