id: cv-fusion-fixpipe-ub
type: software-fact
title: Cube-Vector 融合与 Fixpipe L0C→UB 直通（仅 Ascend 950；判据 aiv_mte2_time 趋零）
summary: "Cube 累加结果默认在 L0C，传统通路是 Fixpipe 写到 GM、再由 AIV 用 MTE2 搬进 UB；**Ascend 950（dav-3510）的 Fixpipe 支持 L0C 直通 UB**，A2/A3 无此能力。融合算子（同一 launch 内 AIC 计算 + AIV 后处理）的收益判据有两条：`aic_cube_ratio` 上升（0.975 → 0.990）与 `aiv_mte2_time` 趋零（GM 中转时 57.4µs 可见，UB 直通后 ≈0.005µs）——**`aiv_mte2_time` 是否还在，就是两条通路的直接证据**"

