id: om-dynamic-shape-and-aipp-constraints
type: software-fact
title: 动态 Shape 输入与 AIPP 的组合约束（四种设置方式只能选一、AIPP 与动态维度互斥、内存按最大档申请、size=0 即动态）
summary: "动态 Shape 推理（动态 Batch / 动态分辨率 / 动态维度 / Shape 范围）与 AIPP 组合时的硬约束：①**同一模型四种动态设置方式只能选一种**——aclmdlSetDatasetTensorDesc 设 Shape 范围、aclmdlSetDynamicBatchSize 设动态 Batch、aclmdlSetDynamicHWSize 设动态分辨率、aclmdlSetInputDynamicDims 设动态维度维度值；②**AIPP（静态或动态）与动态维度（ND 格式）不能同时使用**；③**动态 AIPP + 动态 Batch**：aclmdlCreateAIPP 的 batchSize 要设为**最大 batch size**，需动态 AIPP 处理的 data 节点输入内存按**最大 Batch** 申请；④**动态 AIPP + 动态分辨率**：若开了抠图/缩放/补边则不能与动态分辨率同用；未开时 aclmdlSetAIPPSrcImageSize 的宽高必须与 aclmdlSetDynamicHWSize 的宽高相等且都取模型转换时动态分辨率**最大档位**，输入内存按最大分辨率申请；⑤**静态 AIPP + 动态分辨率**：ATC insert_op_conf 的 AIPP 配置不能开 Crop/Padding，且 src_image_size_w/h 需设为 0；⑥**动态 AIPP + 动态 Shape 范围**：动态 AIPP 的输出图片宽高要在所设 Shape 范围内。判据与阈值：aclmdlGetInputSizeByIndex / aclmdlGetOutputSizeByIndex 返回 **size 为 0 表示该输入/输出 Shape 是动态的**（可预估较大内存，或让系统内部申请输出内存，建议用 aclmdlGetOutputSizeByIndex 取到大小再申请以确保足够）。模型侧参数：动态 Batch 用 ATC `--dynamic_batch_size`、动态分辨率用 `--dynamic_image_size`、动态维度用 `--dynamic_dims`、Shape 范围用 `--input_shape`。"

