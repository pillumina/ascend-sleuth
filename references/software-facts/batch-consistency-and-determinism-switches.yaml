id: batch-consistency-and-determinism-switches
type: software-fact
title: 计算确定性开关（ACL_OPT_DETERMINISTIC 1 与 3 / torch 侧两个入口 / 逐比特一致与 batch 一致性的区别 / 版本门槛）
summary: "昇腾上「结果不一致」分两级，开关也不同级。**① 确定性（determinism，`ACL_OPT_DETERMINISTIC=1`）**：解决同一算子在同一输入下多次运行结果不同——根源是算子实现内的异步多线程执行使浮点累加顺序变化；aclnn 路径用 `aclrtSetSysParamOpt`（进程级）设 1，PyTorch 路径用 `torch.use_deterministic_algorithms`。**② Batch 一致性（batch invariance，`ACL_OPT_DETERMINISTIC=3`）**：解决『同一个 Token 无论它在批次内所处位置、批次大小、与哪些其他 Token 一同批处理，输出必须逐比特完全一致』——即同一个 token 在不同 batch 组合下结果不能漂移；aclnn 路径同样用 `aclrtSetSysParamOpt`（进程级）设 **3**，PyTorch 路径用 **`torch_npu.npu.set_deterministic_level`**。**③ 版本门槛**：batch 一致性要求 **TorchNPU ≥ 26.2.0 且 CANN ≥ 9.2.0**。**④ 默认值不统一**：部分算子 API 默认就是 batch 一致性实现、部分不是，非默认实现的部分算子才可通过上述配置手动开启——**具体以该算子自己的 aclnn API / PyTorch API 文档为准**，不要假设全栈统一。**⑤ 两者通常都不建议默认开**：开启后相关算子有性能劣化、单次运行性能可能下降；只在实验、调试、回归测试这类『需要多次运行结果相同来定位问题』的场景开。"

