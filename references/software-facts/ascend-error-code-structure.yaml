id: ascend-error-code-structure
type: software-fact
title: 昇腾 6 位错误码结构（级别位 + 模块位 + 内部码规则）
summary: 错误码 6 位：第 1 位 E/W/I（错误/告警/提示）；第 2 位模块（E1=GE、E2=FE、E3=AI CPU、E4=TEFusion、E7=Vector 算子插件、E8=Vector 算子、EB=TBE Pass、EC=Auto Tune、ED=RLTune、EE=Runtime、EF=LxFusion&AutoDeploy、EG=AOE、EH=ACL、EI=HCCL、EJ=HCCP、EK=Profiling、EL=Driver、EM=队列调度、EN=DVPP、EO=AMCT、EP=Dump、EZ=公共算子+算子 API）；后 4 位 0000-8999 用户类 / 9000-9999 内部错误码（E*9*** 联系华为）；异步多算子报错从首报错排查

