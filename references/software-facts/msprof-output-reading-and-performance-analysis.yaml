id: msprof-output-reading-and-performance-analysis
type: software-fact
title: msprof 默认产物清单与性能分析路径（timeline 三区域 / 按 Total Time 与 Task Duration 排序 / prof_rule 调优建议 / fusion_op 融合前后）
summary: "拿到一次 msprof 采集结果后怎么读：**默认配置产出的 9 类文件**——`msprof_*.json`（timeline 总表）、`step_trace_*.json`（迭代轨迹，每轮迭代耗时；单算子场景无）、`op_summary_*.csv`（AI Core 与 AI CPU 算子数据）、`op_statistic_*.csv`（算子调用次数与耗时统计）、`step_trace_*.csv`、`task_time_*.csv`（Task Scheduler 任务调度信息）、`fusion_op_*.csv`（**算子融合前后信息**；单算子场景无）、`api_statistic_*.csv`（CANN 层 API 执行耗时）、`prof_rule_0_*.json`（**调优建议**）。**读法**：json 用 Chrome 打开 `chrome://tracing` 拖入（w 放大 / s 缩小 / a 左移 / d 右移），timeline 分三区域——区域 1 CANN 层（Runtime 等组件与 Node/算子耗时）、区域 2 底层 NPU（Ascend Hardware 下各 Stream 任务流耗时、迭代轨迹、AI 处理器系统数据）、区域 3 各色块明细；从耗时较长的 API/算子/任务流顺着箭头找下发关系，再用 csv 量化。`op_statistic_*.csv` **按 Total Time 排序**找出哪类算子总耗时长（判断该类是否有优化空间）；`op_summary_*.csv` **按 Task Duration 排序**找高耗时算子、**按 Task Type 排序**看不同核（AI Core / AI CPU）上的高耗时算子。"

