id: atc-precision-mode-and-switches
type: software-fact
title: ATC 精度模式与两个默认开启的优化开关（默认 fp16 / allow_fp32_to_fp16 / keep_dtype 例外清单 / 数据缓存优化 / 融合规则）
summary: "om 模型精度问题的三个配置面：①**精度模式**——模型转换不指定精度模式时**默认用 fp16** 计算；`--precision_mode=allow_fp32_to_fp16` 表示算子支持 fp32 就用 fp32、不支持才用 fp16（高精度模式，提升精度但可能影响性能）；`--keep_dtype` 配一个算子清单文件（每行一个算子名，如 exceptionlist.cfg）让指定算子保持原始网络数据类型，用于『精度达标同时保性能』。②**两个默认开启的优化开关**——**数据缓存优化**（提高计算效率与性能，但部分算子实现未考虑的场景会影响精度）与**融合规则**（算子间融合提升效率，融合后部分实现未考虑的场景会影响精度；关闭时系统只在不影响功能前提下关部分规则，不是全部）。两者都可在精度问题时尝试关闭以定位，但关闭后达标仍需识别问题算子交技术支持，问题解决后建议恢复开启。③**判据**——精度比对工具输出的 CosineSimilarity 列范围 [-1,1]，越接近 1 表示越相近，**大部分算子低于 0.95 即说明存在精度问题**。典型溢出证据：force_fp16 下某算子输出 tensor 最大值正好 65504.0（fp16 可表达上限，范围 -65505~65504），而高精度模式下同一算子输出最大 109508.0 —— 值域溢出，该算子必须保持高精度。"

