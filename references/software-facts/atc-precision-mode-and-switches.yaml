content:
  claim: "**① 精度模式（默认 fp16）**：模型转换（ATC）时不指定网络模型或算子的精度模式，**默认采用 fp16（float16）进行计算**——这是 om 推理精度问题最常见的配置面。配置**网络模型的高精度模式**用高级参数 `--precision_mode`，取值示例 `--precision_mode=allow_fp32_to_fp16`：网络模型中算子**支持 fp32 就用 fp32**，**不支持 fp32 才用 fp16**；配置后重新转换模型再推理即可，代价是可能影响推理性能。**配置部分算子保持原始数据类型**用 `--keep_dtype`（配合 `--precision_mode` 指定网络模型的精度模式），`--keep_dtype` 指向一个算子清单文件（示例名 `exceptionlist.cfg`，**文件中每一行是一个算子的名称**，文件可放在服务器任意目录）；这是「精度达标同时保持性能」的推荐做法——不把整网都拉到高精度，只对确有精度问题的算子保持原始数据类型。**② 两个默认开启的优化开关（都会影响精度）**：**数据缓存优化**默认开启，可提高计算效率、提升性能，但部分算子在实现上可能存在未考虑的场景，从而影响精度——出现精度问题时可以尝试关闭它来定位（关闭后精度达标，说明命中这类场景，仍需识别出问题算子交技术支持，解决后建议保持开启）。**融合规则**也默认开启，算子之间会融合以提高计算效率，但融合后的部分算子在实现上可能存在未考虑的场景，导致影响精度——同样可尝试关闭来定位；注意 **关闭融合规则时系统只在『不影响功能』的前提下关闭部分融合规则，而不是全部融合规则**。**③ 判据与溢出证据**：精度比对工具输出的 **CosineSimilarity** 列，余弦相似度范围是 [-1,1]，越接近 1 表示两者越相近、越接近 -1 表示越相反，**对于大部分算子，值低于 0.95 就说明存在精度问题**。典型案例（FastRCNN，模型转换保持默认高性能模式与 force_fp16 时推理 MAP 结果为 0）：对照高精度模式后，高精度模式下 AddN 算子第 0 个输出 tensor 的最大值为 **109508.0**，而高性能模式（fp16）下同一输出最大值为 **65504.0**——正落在 FP16 可表达的值域上界（-65505~65504），即**输出值超出 fp16 类型表达范围**，需要把该算子配置为高精度模式。这个案例给出了一条可复用的判据：**先用比对定位低相似度算子，再取该算子输出的最大/最小值与 fp16 值域上界比对，越界即溢出**。"
  evidence: "config_precision_mode.md：『如果在模式转换时不指定网络模型或算子的精度模式，默认采用fp16（float16）数据类型进行计算』『使用ATC工具转换模型时，增加高级参数--precision_mode…表示如果网络模型中算子支持fp32（float32），则使用fp32；如果网络模型中算子不支持fp32，则使用fp16』『使用ATC工具转换模型时，增加高级参数--keep_dtype（指定部分算子计算时保持原始网络的数据类型）和--precision_mode…配置文件名举例为_exceptionlist.cfg_…文件中每一行是一个算子的名称』。operator_precision_issues_positioning_process.md：『当前默认开启数据缓存优化，开启数据缓存优化可提高计算效率、提升性能，但由于部分算子在实现上可能存在未考虑的场景，导致影响精度，因此在出现精度问题时可以尝试关闭数据缓存优化』『当前默认开启融合规则，开启融合规则可提高计算效率、提升性能，但算子之间可能会融合，融合后的部分算子在实现上可能存在未考虑的场景，导致影响精度…关闭某些融合规则可能会导致功能问题，因此在配置关闭融合规则后，系统在不影响功能的前提下关闭部分融合规则，而不是全部融合规则』。operator_precision_issues_cases.md：『从图中可以看CosineSimilarity这一列，余弦相似度算法比对出来的结果，范围是[-1,1]，比对的结果如果越接近1，表示两者的值越相近，越接近-1意味着两者的值越相反。对于大部分算子，值低于0.95就说明存在精度问题』『高精度模式下AddN算子输出tensor的最大值为109508.0，而高性能模式（fp16）下，输出tensor的最大值为65504.0，FP16能表达的最大值域范围为（-65505~65504）』"
