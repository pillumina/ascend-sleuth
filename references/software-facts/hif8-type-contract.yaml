id: hif8-type-contract
type: software-fact
title: HiFloat8 的类型契约（hifloat8_t 建 tensor / Cast 直转 / 按 1 Byte 搬运）
summary: "算子开发侧不需要感知 HiFloat8 的转换计算逻辑：把输入/输出数据类型设为 `hifloat8_t` 即可，支持创建该类型的 GM 与 UB（`GlobalTensor<hifloat8_t>` / `LocalTensor<hifloat8_t>`）；类型转换直接用 `AscendC::Cast<hifloat8_t, float>(dst, src, AscendC::RoundMode::CAST_ROUND, count)`，无需额外处理；`DataCopy` 按**每元素 1 Byte** 计算搬运量"

