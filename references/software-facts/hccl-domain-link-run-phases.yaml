content:
  claim: >-
    一次 HcclCommInit 里通常连续发生三件事，按「产物」而不是按「时间」分界。建域（bootstrap + 建图）产出通信域句柄、rank table、RankGraph，回答「谁在群里、rank 几号、谁能到谁走哪层」，走控制面 TCP，典型失败是收人阶段卡住（V2 的 `GetConnections` 无进展；A2/A3 现场串是 `topo exchange server get socket timeout` / `GetClusterTopoInfo`）与 EI0014 / EI0015 / EI0016 / EI0017。建链（connection setup）产出 channel 句柄（内含 QP 或 Jetty、N 个 notify（设备内存上的标志位）、rkey），按「对端 + 协议」逐对建，控制面 socket 只用来换参数、数据走硬件通道，典型失败是通道一直 CONNECTING 与 EI0006 / EI0009 / EI0019 / EI0020。运行期只下发任务（SQE / WQE + DMA + CQE / notify），失败表现为算子超时与 CQE 错误。
    建链时机按平台分，由 `CollCommInitMode` 决定：simpleMode 的注释写明给 A2/A3 使用、只把 RankGraph 与 MyRank 放进 CollComm，`InitSimpleMode` 只做这两件事随后直接置 `HCCL_COMM_STATUS_READY`，不建 team、不建 channel；fullMode 给 A5 及后续架构，`InitFullMode` 依次调 `InitWorldTeams` 与 `InitSymmetricMemory`，按层 × 协议预制 worldTeam。所以 `HcclCommInitRootInfo` 返回成功只代表「域建好了」，不代表「所有通道就绪」——A2/A3 的 channel 与 transport 在首个算子执行期按需建。
    现象归属的判断口诀：看到 rank / rank table / 层 / RankGraph / root 属建域；QP / Jetty / channel / notify / rkey / RTS 属数据面建链；`HeartBeat_<a>_to_<b>` 与 `netInstId/localId` 属心跳建链（DFX，即 Design for X 可维测性设计，是另一套东西）；SQE / WQE / CQE / transportType 属运行。
  evidence: >-
    coll_comm.h:60-66 定义 `enum class CollCommInitMode { fullMode, simpleMode }`，注释原文：fullMode「全功能模式：给A5及后续新架构使用，完整的CollComm初始化和资源管理」，simpleMode「简化模式：给A2/A3老芯片使用，由于架构限制，仅将RankGraph、MyRank等放入CollComm管理」。coll_comm.cc:228、230 按模式分派 `return InitFullMode(...)` / `return InitSimpleMode(...)`；`InitSimpleMode` 全文只做 DlHalFunctionInit、保存 rankGraph 指针、构造并 Init MyRank、置 `commStatus_ = HcclCommStatus::HCCL_COMM_STATUS_READY`（coll_comm.cc:235-262）；`InitFullMode` 在 MyRank 之后依次 `CHK_RET(InitWorldTeams());`、`CHK_RET(InitSymmetricMemory());`、`CHK_RET(InitHDCommunicate());`（coll_comm.cc:288-300）。`CreatePrebuiltWorldTeam` 组装 `HcommTeamCreateDesc`（memberNum / selfMemberId / netLayer / protocol / barrierCount，其中 UB_MEM 协议 barrierCount 为 0、其余为 1）后调 `HcommTeamCreate`，成功打 `[CollComm][%s] prebuilt worldTeam for protocol[%d] netLayer[%u], handle[%p]`（coll_comm.cc:366-396）。
  details: >-
    首个算子慢的五个原因：通道懒建（simpleMode 的 Init 不建 channel）；QP 或 Jetty 握手有往返；HCCL buffer 注册成 MR 并交换 rkey（远端内存注册键）；A5 预制 team 时按协议逐个创建；首次按拓扑选算法算切片。判别方法是看首个算子耗时是否远大于后续、以及首个算子前是否出现 `CreateCqAndQp` / `prebuilt worldTeam` / `channel` 日志；缓解手段是 warm-up 一次小算子，或复用同一通信域。运行期不再握手也不再遍历 rank 表：连接是建链期的事，对端 IP 运行期不需要知道，发给谁由算法决定（ring 只找左右 2 个邻居，mesh 找组内 N-1 个，AlltoAll 才人人对人人）。
    心跳建链与数据面建链是两套完全不同的东西。心跳在 `src/coll_communicator_mgr/dfx/cluster_monitor` 实现（不是独立进程）：UID 由 `netInstanceId/local_id` 拼成（`FormatUID`，cluster_monitor.cc:29-37）；按「平面」成环——netLayer=0 的全部 rank 按 localId 升序排成一排，netLayer≥1 取各层里与本 rank 同 localId 的节点按 netInstId 排序排成一排，每排各自成环，每 rank 连 next 与 pre 两个邻居，成员数为 2 时只连一条边（cluster_monitor.cc:236-256）；连接用 `HeartBeat_<uidA>_to_<uidB>` 专用 tag（cluster_monitor.cc:114-121），日志 `commId[%s] insert remoteUID[%s]`（:76）。丢失阈值 `HCCL_LOST_THRESHOLD = 30` 秒（heartbeat.h:51，cluster_monitor.cc:768 引用），可用 `HCCL_DFS_CONFIG=cluster_heartbeat:off` 关掉（cluster_monitor.cc:820）。心跳坏了不代表数据立刻停，但通常意味着节点或链路已出问题、随后算子超时报错；判读细节见 hccl-cluster-heartbeat-and-link-probe。
    CQE 是 Completion Queue Entry（完成队列条目），硬件完成一个任务后写进 CQ，status=0 成功、非 0 是硬件错误码。它由设备侧引擎经 task exception 回调上报到 Host（`TaskExceptionHost` 出现在 coll_comm.cc:165），ClusterMonitor 收集后经 `GetErrStatusVecFromCluserMonitor`（cluster_monitor.cc:1127）交给上层，并把 CQE 错误按事件扩散到通信域内其他 rank；A2/A3 业务侧通常转成 EI0013 或 EI0012，A5 还会有 EI0018 这条来源。
    三条硬标准判断「能开始训练」：每个 rank 都打出 Init success（root 统一收表，缺一个就 EI0015）；首个 AllReduce 返回成功且无 EI0012（SDMA 数据面异常）/ EI0015（超时）/ EI0016（不一致）；第二个 step 耗时明显回落（首个 step 的额外开销来自建链、预热、图捕获，不是域没建好）。建链卡住时可用 `HcclCommDestroy` 打断——支持通信域处于建链卡住状态时跨线程销毁。
