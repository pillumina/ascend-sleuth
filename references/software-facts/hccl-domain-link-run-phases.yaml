title: HCCL 建域 / 建链 / 运行三层划分：各层产物、参与范围、典型失败码与日志关键字
summary: 判断一个 HCCL 启动或首个算子现象属于建域、建链还是运行：三层产物与失败码各不相同，先定层再查。

