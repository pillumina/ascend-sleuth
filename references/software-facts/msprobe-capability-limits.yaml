id: msprobe-capability-limits
type: software-fact
title: msprobe 五功能的适用场景与当前版本局限性（选型与边界）
summary: msprobe 选型与能力边界：dump（API 级仅支持白名单、对 inplace 支持有限、不支持参数及参数梯度，且**加工具可能让同步问题消失**）/ 离线预检（不受累计误差影响，但依赖 GPU 环境、不支持通信算子、仅部分融合算子）/ 整网比对与可视化（可疑算子受累计误差影响、大模型耗时长）/ 训练状态监测（仅模块级统计量、仅 megatron 与 deepspeed）

