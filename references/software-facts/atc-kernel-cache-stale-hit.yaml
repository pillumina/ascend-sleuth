id: atc-kernel-cache-stale-hit
type: software-fact
title: ATC kernel 编译缓存（/root/atc_data/kernel_cache/）脏/失效命中：自定义算子 kernel 不执行，可表现为 CPU stub 与误导性报错文案
summary: "ATC 静态 kernel 编译产物缓存位于 /root/atc_data/kernel_cache/（每执行节点本地目录）。缓存命中旧或不完整的编译产物时，自定义算子的 kernel 可能不执行——图编译照常完成（该节点落 CPU 侧/mixed 模式），运行期框架回退执行 CPU stub 并主动 abort（TF 侧典型报错 'custom opp not installed or op not in NPU graph'，文案误导：opp 在位也触发）。恢复动作=逐节点清理该目录强制重新编译；验证判据=重跑后日志出现 LaunchKernelWithHandle + kernel_name。同族：数据集 helpers_cpp 编译缓存残留（MSLLM-1526）、算子缓存/编译目录残留排查方向（MSLLM-1550）。"

