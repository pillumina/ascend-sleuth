id: ttk-deterministic-levels-and-batch-consistency
type: software-fact
title: TTK 确定性等级 0–3 与 batch 一致性判据（batch relation 三字段齐全才进第二阶段）
summary: "TTK 用 `--deterministic-level`（缩写 `--dl`）控制一次执行的确定性等级：**0** 不启用确定性选项（只做普通精度校验）；**1** 同一用例的确定性执行；**2** 编译期与执行期确定性选项（通路原有的强确定性检查）；**3** 确定性执行，**且只有在「完整声明 batch relation」时才进入第二阶段**（第二阶段用 raw dump slice 比对做 FA 算子的 case 内/跨 case batch 一致性，第一阶段仍是普通精度）。**batch relation 的构成**：`batch_axis`、`batch_slice_info`、`batch_seed` **三个字段都存在且可解析**才构成；三者都没填或只填一部分时，level 3 仍正常执行确定性与精度流程、**不进入第二阶段、也不因缺字段失败**，只在执行前按用例输出一次 warning 列出缺少的字段（prepare/validate 不执行主算子，不输出该提示）。**优先级**：可在 CSV 的 `attributes` 里给单个用例写 `'batch_deterministic_level': 3`；当命令行 `--dl` 为 0（默认）时它与该用例指定 `--dl=3` 等价，**非零命令行值始终优先**（例如 `--dl=1` 会覆盖 CSV 的 level 3）；该属性只决定确定性执行等级，**不会自动构成 batch relation**。"

