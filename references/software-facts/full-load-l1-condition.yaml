id: full-load-l1-condition
type: software-fact
title: 全载（FullLoad）把小矩阵常驻 L1 的判定条件与后果
summary: "MTE2 Bound 场景下，若 A（或 B）矩阵能完整放进 L1，可一次性载入并常驻复用，把 MTE2 搬运次数从「与计算轮次成正比」降到**常数级**。判定条件三条：①分块数需超过可用核数（`tilesM=(m+255)/256`、`tilesN=(n+255)/256`，要求 `tilesM×tilesN ≥ numBlocks`）；②A 矩阵字节数 `k×m×sizeof(T)` 不超过 **L1 的一半**（`512×1024/2`，扣除自身占用后留余量）；③`m ≤ 256` 或（`m < n` 且 `tilesM×tilesN ≤ numBlocks`）。另有收益条件：`n ≥ 512` 时才显著。**条件不满足的后果被来源列为精度异常或性能退化**"

