id: ascend-trace-logs
type: software-fact
title: trace 日志机制与落盘路径（仅 Ascend EP 标准形态）
summary: trace 将软件栈维测信息记内存、运行出错或进程结束时才落盘，仅 Ascend EP 标准形态支持；根目录 $HOME/ascend/atrace（ASCEND_WORK_PATH 可重定向），事件三类 schedule/stackcore/exit；stackcore 与 *.bin 轨迹需 asys 工具解析，目录持续增长需定期清理

