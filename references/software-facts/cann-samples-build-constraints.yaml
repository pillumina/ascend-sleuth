id: cann-samples-build-constraints
type: software-fact
title: cann-samples 样例仓构建约束（Toolkit 版本 + asc-devkit 子模块 pin + 自检脚本）
summary: "cann-samples 的构建受三条约束支配：社区版 CANN Toolkit 的已验证版本为 9.0.0 / 9.1.0；矩阵乘类样例依赖 asc-devkit 子模块（Ascend C Tensor API 头文件）且仓库把它固定在某个 commit（不随上游自动跟进）；Tensor API 样例同时需要子模块头文件与 Toolkit 的 Ascend C 头文件——因此 Toolkit 版本过旧、只装 Run 包、或环境变量未 source 时会出现头文件缺失 / 符号未定义 / 编译选项报错，这三类报错先查这三条"

