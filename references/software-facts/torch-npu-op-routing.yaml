id: torch-npu-op-routing
type: software-fact
title: torch_npu 算子路由（PrivateUse1 注册 / redispatch / 兼容实现开关 / aclnn-aclop 分支）
summary: "PyTorch 张量在 NPU 上的算子调用要过三层路由：①Dispatcher 从参数提取 keyset（Autograd+PrivateUse1）并取最高优先级，Autograd 优先于 PrivateUse1，故先命中 VariableType；②redispatch 用 `ks & after_autograd_keyset` 剥离 Autograd key，下一个命中 PrivateUse1 的 `wrapper_NPU__<op>`；③wrapper 内 op_plugin 按 `CheckJitDisable()` 二选一——aclnn（主流）或 aclop（日落中）。另有 `TORCH_NPU_USE_COMPATIBLE_IMPL=1` 会让 matmul 系列不走 NPU 注册实现；matmul 的 ND/NZ × dtype × SoC 组合还会决定走 WeightNz API、标准 API 还是回退 aclop，最容易误判成 shape 问题"

