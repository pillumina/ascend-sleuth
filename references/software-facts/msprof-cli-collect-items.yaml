id: msprof-cli-collect-items
type: software-fact
title: msprof 命令行采集项开关与频率语义（task-time l0-l3、aic-mode/aic-freq、sys-* 系列范围与默认值、host-sys 依赖）
summary: "msprof 命令行采集项的取值与默认值：`--task-time` 支持 l0/l1/l2/l3（l3 为 PyPTO 算子试用特性）；`--ai-core` 默认随 `--task-time` 联动（on/l1→on，off/l0→off）；`--aic-mode` 取 task-based（**采集 AI 任务性能数据时默认**，任务粒度）或 sample-based（**采集 AI 处理器系统数据时默认**，固定周期），`--aic-freq` [1,100] 默认 100Hz（sample-based 下）；`--aic-metrics` 默认值**按平台**（Atlas 200I/500 A2 推理产品为 PipelineExecuteUtilization，其余为 PipeUtilization），含 PipelineExecuteUtilization（统计 `fixpipe_exe_ratio`）与 PipeUtilization（统计 `*_icache_miss_rate`），Custom 自定义寄存器在 CLI 侧范围为 [0x1, 0x7FFFFFFF]、最多 8 个、无对应 PMU 寄存器时结果可能为 0。频率类：`--sys-period`（不传用户程序时必选，≤30 天）、`--sys-devices`（不传用户程序时必选，传则不生效）、`--sys-hardware-mem-freq` [1,100] 默认 50、`--sys-cpu-freq` [1,50] 默认 50、`--sys-sampling-freq` [1,10] 默认 10、`--sys-pid-sampling-freq` [1,10] 默认 10、`--sys-io-sampling-freq` [1,100] 默认 100、`--sys-interconnection-freq` [1,50] 默认 50、`--dvpp-freq` [1,100] 默认 50、`--instr-profiling-freq` [300,30000] 默认 1000 **cycle**（真实采集频率 = 处理器运行频率 ÷ 该值）。"

