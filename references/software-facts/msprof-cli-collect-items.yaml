content:
  claim: "**① 算子耗时类**：`--task-time` 取 l0（仅算子下发与执行耗时，开销小、耗时统计更准）/l1（加算子基本信息，**支持采集集合通信算子数据**）/l2（再加 attr 信息）/l3（**PyPTO 算子性能数据，试用特性、不应用于生产**）/on（默认，等同 l1）/off。`--ai-core` 是 AI Core 数据采集开关，**默认值随 task-time 联动**：task-time 为 on/l1 时默认 on，为 off/l0 时默认 off。`--aicore-shape` 采 CANN 层算子 Shape 数据，**仅在 `--task-time=l0` 时生效**。`--task-memory` 采 CANN 算子级内存占用与生命周期（图模式单算子场景下按 GE 组件与算子两个维度采，单算子 API 执行场景不采 GE 组件内存；静态图与静态子图场景按算子维度采）。**② AI Core 指标类**：`--aic-mode` 取 `task-based`（以 task 为粒度采集，**采集 AI 任务性能数据时不配置则默认此值**）或 `sample-based`（以固定时间周期采集，**采集 AI 处理器系统数据时不配置则默认此值**），前提是 `--ai-core=on`；`--aic-freq` 是 sample-based 下的采样频率，默认 100、范围 1~100、单位 Hz。`--aic-metrics` 取值 ArithmeticUtilization / PipeUtilization（**统计 `*_icache_miss_rate` 需用它**）/ Memory / MemoryL0 / MemoryUB / ResourceConflictRatio / L2Cache（Atlas 推理系列产品不支持）/ PipelineExecuteUtilization（**统计 `fixpipe_exe_ratio` 需用它**；Atlas 推理系列产品、Atlas 训练系列产品、A2、A3、Ascend 950PR/950DT 均不支持）/ MemoryAccess（Atlas 200I/500 A2 推理产品、Atlas 推理系列产品、Atlas 训练系列产品、Ascend 950PR/950DT 不支持）；**默认值按平台**——Atlas 200I/500 A2 推理产品为 PipelineExecuteUtilization，其余平台为 PipeUtilization。支持 `--aic-metrics=Custom:0x49,0x8,...` 自定义寄存器：**CLI 侧取值范围 [0x1, 0x7FFFFFFF]**（与 PROFILING_OPTIONS 文档写的 [0x1,0x6E] 不同，见下『口径差异』），最多 8 个、逗号分隔、十六或十进制；并非所有取值都有对应 PMU 寄存器，**配了无对应寄存器的值则采集结果可能为 0**。**③ 系统数据类开关与频率**：`--sys-period`（系统采样时长，范围 >0 且上限 30*24*3600 秒；**不传用户程序时必选**，传用户程序时该参数不生效）、`--sys-devices`（设备 ID，可 all 或逗号分隔多卡；**不传用户程序时必选**，传用户程序时不生效）；`--sys-hardware-mem`（片上内存读写速率、QoS 传输带宽、LLC 三级缓存带宽、加速器带宽、SoC 传输带宽、组件内存占用等，默认 off；**组件内存需传入用户程序才能采到**）与其频率 `--sys-hardware-mem-freq`（范围 [1,100]、**默认 50**；Ascend 950PR/950DT 的 QoS 与 SoC 最大可配 10000，其他采集项超 100 按 100 采；A3/A2 与 Atlas 200I/500 A2 在采集任务结束后不建议改变采集频率，否则可能丢数据）；`--llc-profiling` 取 read（默认）/write，需 `--sys-hardware-mem=on`；`--sys-cpu-profiling`（AI CPU、Ctrl CPU 等，默认 off）与 `--sys-cpu-freq`（[1,50] 默认 50）；`--sys-profiling`（系统 CPU usage 与 System memory，默认 off；会调 Device 侧 Perf 工具采集）与 `--sys-sampling-freq`（[1,10] 默认 10）；`--sys-pid-profiling`（所有进程的 CPU usage 与 memory，默认 off）与 `--sys-pid-sampling-freq`（[1,10] 默认 10）；`--sys-io-profiling`（NIC/ROCE/MAC/UB 带宽，默认 off）与 `--sys-io-sampling-freq`（[1,100] **默认 100**）；`--sys-interconnection-profiling`（HCCS/CCU/PCIe/片间传输/SIO/UB，默认 off）与 `--sys-interconnection-freq`（[1,50] **默认 50**；A2/A3 采集结束后不建议改变频率）；`--dvpp-profiling` 与 `--dvpp-freq`（[1,100] 默认 50）；`--instr-profiling`（AI Core 的带宽与时延，仅 A2/A3/950，**仅单算子场景传入用户程序才能采到**；950 上可能因最后一段指令统计时间超长而不准，建议改用 msprof op）与 `--instr-profiling-freq`（[300,30000] **默认 1000、单位 cycle**——真实采集频率 = 处理器运行频率 ÷ 该取值，如 AI Core 频率 5000Hz、取值 1000 则每秒采 5 次；仅 A2/A3）；`--sys-lp`（低功耗数据，**默认 on**，仅 Ascend 950PR/950DT）与 `--sys-lp-freq`（[1,100] 默认 100，仅 950）；`--task-block`（block 级 profiling，仅 950，默认 off）。**④ Host 侧系统数据**：`--host-sys` 与 `--host-sys-usage` 二者必选其一。`--host-sys` 取 cpu（进程级 CPU 利用率与**CPU 频率**）/mem（进程级内存）/disk（进程级磁盘 I/O）/network（系统级网络 I/O）/osrt（进程级 syscall 与 pthreadcall）/numa（总读带宽、本节点/跨节点/内部读带宽及其占比），多项逗号分隔；配置该项必须再配 `--host-sys-pid` 或传入用户程序。`--host-sys-usage` 取 cpu/mem，采系统与所有进程；配了 `--host-sys-pid` 则只采指定进程。`--host-sys-usage-freq` 范围 [1,50]、默认 50Hz。**⑤ 会『采集不到数据/结果异常』的已知情形**：Ascend EP 场景下用 msprof 命令行采集**整网推理** Profiling 且**传入用户程序**时，配置 `--llc-profiling`、`--sys-cpu-profiling`、`--sys-profiling`、`--sys-pid-profiling` 后除 `--sys-cpu-profiling` 仅生成 TS CPU 数据外，其余采集项**均不生成数据**；不传入用户程序时这些采集项才有数据。Ascend 950PR/950DT 与 Atlas A3 上，`--sys-profiling`/`--sys-pid-profiling`/`--sys-cpu-profiling` **不支持同时采集共用 OS 的两个 Device**（例如 Device [0,7] 中 0-1、2-3、4-5、6-7 分别共用 OS，则 `--sys-devices` 不能同时配 0 和 1，应取 0,2,4,6 或 1,3,5,7）。Host 侧采 CPU 频率依赖内核 cpufreq 驱动（`/sys/.../scaling_cur_freq` 不存在需装驱动）；采集 disk 需 iotop、采集 osrt 需 perf 与 ltrace，**且每次重新安装 CANN 软件包都要重新配置权限**；用 ltrace 采集 osrt 会导致 CPU 占用率过高（与应用的 pthread 加解锁相关），**影响进程运行速度**；x86_64 架构 KylinV10SP1 支持 `--host-sys=osrt`，aarch64 架构不支持；虚拟化环境 Euler2.9 不支持 `--host-sys=network`；iotop 不支持在容器内使用。**口径差异（如实标注）**：`--task-time` 在 CLI 侧支持 l0/l1/l2/l3，而 PROFILING_OPTIONS 侧文档的 `task_trace`/`task_time` 只列 on/off/l0/l1；Custom 寄存器范围 CLI 侧为 [0x1, 0x7FFFFFFF]、环境变量侧文档为 [0x1, 0x6E]。两处均以各自来源为准，未做统一推断。"
  evidence: "ai_runtime_profile_data.md：『--task-time…l0：采集算子下发耗时、算子执行耗时数据…l1…该参数支持采集集合通信算子数据。l2：…（包括attr信息）…l3：采集PyPTO算子性能数据。该特性为试用特性』『--ai-core…--task-time配置为on、l1时，默认为on；--task-time配置为off、l0时，默认为off』『--aic-mode…采集AI任务性能数据时建议使用task-based，如果不配置默认为task-based』『--aic-freq…默认值100，范围1~100，单位Hz』『--aic-metrics…PipelineExecuteUtilization：计算类和搬运类指令耗时和占比，统计`fixpipe_exe_ratio`时，需要使用该取值』『配置的寄存器数最多不能超过8个…范围[0x1, 0x7FFFFFFF]』『--aicore-shape…仅在--task-time=l0时生效』。processorai_accelerator_system_data.md：『--sys-period…不传入用户程序时，该参数必选。系统的采样时长，取值范围大于0，上限为30*24*3600，单位s』『--sys-hardware-mem-freq…范围[1,100]，默认值为50』『--sys-io-sampling-freq…范围[1,100]，默认值为100』『--sys-interconnection-freq…范围[1,50]，默认值为50』『--instr-profiling-freq…范围[300,30000]，默认值为1000，单位cycle。系统对AI Core带宽和延时的真实采集频率=处理器的运行频率/该参数取值』『--sys-lp…默认值为on…仅以下型号支持该参数：Ascend 950PR/Ascend 950DT』『如果通过配置--llc-profiling、--sys-cpu-profiling、--sys-profiling和--sys-pid-profiling采集项采集相应数据，采集完成后，除--sys-cpu-profiling采集项仅生成TS CPU数据外，其余采集项均不会生成数据；但在不传入用户程序时，配置上述几个采集项均会有数据生成』『--sys-profiling、--sys-pid-profiling、--sys-cpu-profiling参数不支持同时采集共用OS的两个Device』。host_system_data.md：『--host-sys…取值包括cpu、mem、disk、network和osrt…numa』『采集Host侧CPU频率性能数据依赖内核cpufreq驱动』『使用开源工具ltrace采集osrt性能数据会导致CPU占用率过高，其与应用工程的pthread加解锁相关，会影响进程运行速度』『iotop工具不支持在容器内使用』（install_perf_iotop_ltrace.md）"
