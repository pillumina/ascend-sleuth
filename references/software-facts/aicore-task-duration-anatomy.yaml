id: aicore-task-duration-anatomy
type: software-fact
title: AICore 算子 Task Duration 分段与首指令取指链（Icache/TLB/Dcache）
summary: "profiling 里的单算子 Task Duration 由多段构成：AICore 调度器调度约 150ns、硬件初始化约 50ns、软件初始化约 1us、所有核执行结束到结果上报约 500ns，来源明写**这个时间不是固定的**——由 TilingData 大小、算子入参个数、算子初始化行为决定（复杂算子的 TilingData 初始化是软件头开销大头）。故不能拿 1us 当固定常量扣减；小算子的 Task Duration 里头开销占比可观。首次执行某 kernel 还会叠加取指冷启动：Icache Miss → 首次加载指令 TLB MISS → L2 查页表 → 可能到 GM"

