id: aclnn-type-promotion-broadcast-and-format
type: software-fact
title: aclnn 的张量语义约束（互推导/互转换/broadcast 的 <6 维限制/数据格式与维度要求/非连续 Tensor）
summary: "写或排查 aclnn 调用时的四类张量语义约束。**① 互推导（type promotion，类比 PyTorch）**：输入 aclTensor 之间数据类型不一致时，API 内部推导出一个类型并把输入都转成它再算——规则是**整数类型间可推导、整数可往浮点与复数推、浮点间可推、浮点可往复数推、复数之间可推、BOOL 可往整数/浮点/复数推**；但 **u16/u32/u64 几乎与任何类型（除自身）都不能推导（×）**，且 f32×u16、f32×u32、f32×u64、以及多数**无符号整数×浮点**的组合都是 ×（例如 f32+s8= f32、f32+u16=×、s8+u8=s16、bf16+f16=f32、bool+f32=f32）。**Tensor×Scalar 是另一张表**（如 f32 Tensor 与 f16 Scalar → f16；bool Tensor 与 f32 Scalar → f32）。**② 互转换**：当 API 输出的 aclTensor 类型与输入推导后的计算类型不一致时，内部会把结果转成输出类型——浮点间、整数间、整数→浮点/复数、浮点→复数、复数间、BOOL→整数/浮点/复数可转，其余不支持（不满足即参数校验失败 161002）。**③ broadcast 规则与硬限制**：规则 1——维度数不一致时向最长看齐、**左侧补 1**；规则 2——维度相同且某维为 1 时拉伸匹配；规则 3——维度不一致且都没有 1 的维度则报错。**硬限制**：当参与 broadcast 的两输入（或推导后）类型属于 COMPLEX64、COMPLEX128、DOUBLE、INT16、UINT16、UINT64 时，除满足广播规则外还必须满足**『连续需要广播的轴与连续不需要广播的轴合并后的维度 < 6』**，否则广播失败、算子执行报错（示例：shape 6 维且无轴可合并 → 报错；合并后为 4 维 → 成功）。**④ 数据格式与维度要求**：多数 aclnn API 支持 ND；CNN 类 API（如 aclnnConvolution）要求带业务语义的格式（已知 N/H/W/C/D/L 的含义）。支持格式为 ND/NCHW/NHWC/HWCN/NDHWC/NCDHW/NC/NCL，且**维度要与 format 表述一致**（5D → NCDHW/NDHWC/ND；4D → NCHW/NHWC/HWCN/ND；3D → NCL/ND；2D → NC/ND；其他维度 → ND）；**私有格式**（NC1HWC0、FRACTAL_Z、NC1HWC0_C04、FRACTAL_NZ、NDC1HWC0、FRACTAL_Z_3D 等）绝大多数 aclnn API 不支持，个别 API 声明支持时以其文档为准。**⑤ 非连续 Tensor**：大部分 API 支持用 **(shape, strides, offset)** 表示的 Tensor——strides 描述该维相邻元素的间隔（等于 1 才连续），offset 是首元素相对 addr 的偏移；理解这一点是排查『同一份数据换一种切片/转置后结果不对』的前提。"

