content:
  claim: "见 summary 的四类约束。三条判读要点：**① 报 161002（参数非法）时先查两件事**——输入 dtype 组合是否在推导表的 ×（尤其 u16/u32/u64 组合与『无符号整数×浮点』），以及输出的 dtype 是否落在互转换允许的范围内；这两类是 aclnn 调用最常见的『参数校验失败』根因，且与精度问题相邻（推导出的计算类型决定了实际计算精度，例如 f16×f32 推导为 f32、而 f16×f16 就是 f16 计算）。**② INT16/UINT16/UINT64/DOUBLE/复数参与 broadcast 时多一条维度限制**（合并后 < 6 维），这条限制只在上述类型上生效、很容易被忽略——现象是『同样的广播逻辑改个数据类型就报错』。**③ 私有格式（FRACTAL_NZ/NC1HWC0 等）不是通用能力**：绝大多数 aclnn API 不支持，遇到时需要按具体 API 声明判读，不要用『格式转换一下就好』的思路处理。"
  evidence: "deduction_relationship.md：『当一个API（如aclnnAdd、aclnnMul等）输入的aclTensor数据类型不一致时，API内部会推导出一个数据类型，将输入数据转换成该数据类型进行计算』与两张推导表（含 f32×u16=×、f32×s8=f32、s8×u8=s16、bf16×f16=f32、bool×f32=f32、u16/u32/u64 行几乎全为 × 等）及示例『如果输入参数的数据类型不一致，一个为float16，一个为float32，那么API内部就会将float16的数据类型转换成float32的数据类型然后进行计算』；Tensor×Scalar 示例『如果输入Tensor的数据类型为float16，输入Scalar的数据类型为float32，那么API内部就会将输入Scalar的float32数据类型转换成float16数据类型然后进行计算』。broadcast_relationship.md：三条规则与『当满足broadcast关系的两个输入a和b的数据类型或推导后的数据类型在COMPLEX64、COMPLEX128、DOUBLE、INT16、UINT16、UINT64中时…条件：连续的需要广播的轴和连续的不需要广播的轴合并之后的维度要求小于6』及两个示例。conversion_relationship.md：『当一个API（如aclnnAdd、aclnnMul等）输出的aclTensor数据类型与输入的数据类型推导后的计算类型不一致时，API内部就会将计算结果转换成输出类型对应的数据类型』与允许转换的类型清单。data_format.md：支持格式清单、维度与 format 的对应（5D/4D/3D/2D/其他）、私有格式清单与『当前绝大多数的aclnn API还不支持这些格式』。non_contiguous_tensor.md：『一个Tensor可以通过(shape, strides, offset)表示』『strides描述Tensor维度上相邻两个元素的间隔，如果在维度1上的stride为1，该维度是连续的…offset表示这个Tensor的首元素相对addr的偏移』"
