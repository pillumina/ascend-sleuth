title: HCCL 建域的两条入口（rank table 文件 / rootinfo 自发现）：root 三步、端口段、消息格式、校验错误码
summary: 建域阶段卡住或报 EI0014/EI0015/EI0016 时，先分清走的是 rank table 文件还是 rootinfo 自发现；两条入口共用建图与建链。

