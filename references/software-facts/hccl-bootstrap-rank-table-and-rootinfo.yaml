content:
  claim: >-
    rank table 没有被取消，它从「用户必填的配置入口」降级为「一种可选输入 + 内部数据模型」。建域入口按「信息从哪来、要不要探测、图新建还是复用」分四条主链路：

    路径 A 探测，`HcclGetRootInfo` → `HcclCommInitRootInfo`（主流；A2/A3 大规模可换 `HcclCommInitRootInfoScalable` 多 root）。

    路径 B 直传，`HcclCommInitClusterInfo(rankTableFile, rank, &comm)`（V2 侧读文件对应 `HcomLoadRankTableFileV2`，另有内存字符串与图模式 `HcomInitByFile` / `HcomInitByString`，全产品仍支持）。

    路径 C 批量，`HcclCommInitAll`（单机一次 `HcclGetRootInfo` 后每卡一线程并发走 A，任一失败整体回滚）。

    路径 D 子域，`HcclCreateSubCommConfig`（从父图裁剪、`adoptRankGraph` 只转移所有权，不重新探测）。

    A/B/C 的产物是同一个结构、用 `RankTableSource` 区分来源，下游都走 `RankGraphBuilder::Build` 与 Channel 建链（A5 另有一层 worldTeam 预制；A2/A3 是 simpleMode，不预制 team）；D 不重新建图、直接接管裁剪后的子图。四条链路共用资源初始化与 channel 建链，排查按入口日志先判断走哪条，差别集中在 bootstrap 段。

    rootinfo 不是满集群扫描，而是「每卡自述 + root 汇总 + 全员广播」：root 只调 `HcclGetRootInfo` 产出 rootInfo 结构（`HcclRootInfo` 的 `internal` 数组固定 4108 字节），由启动器带外分发给所有 rank；各 rank 反向连 root 报到、上报本卡自述；root 合并成全量表后回灌全员。谁调 `HcclGetRootInfo` 谁就是 root，没有选举、任期、心跳切换，master 也不主动广播。

    V2（A5）里这一步只完成探测服务器的架设：`make_shared<RankInfoDetect>()` 建的探测对象随函数返回即析构，后台 service 线程已 detach，持 socket 端口继续监听；通信域由后续 `HcclCommInitRootInfo` 的 Init 阶段创建。

    root 侧固定三步，两代实现的类名不同、动作相同：V2（A5）是 `RankInfoDetectService::Setup` 里的 `GetConnections`（等齐 nRanks，校验白名单、agentId 去重、rankSize 一致）→ `GetRankTable`（收表、合并、按 rankId 排序，step 必须匹配）→ `BroadcastRankTable`（epoll 多线程并发回灌）；A2/A3 是 `TopoInfoDetect` / `TopoInfoExchangeServer` 一侧的收人与收表（`SetupGroupMember`、`GetClusterTopoInfo`）。

    三个校验点对应三个错误码：等不齐或连接超时是 EI0015；step 不匹配、rankSize 不一致、version 不等于 2.0、rankCount 不符是 EI0016；rankId 不连续或重复、localId 冲突、各层地址数不齐是 EI0014。同一 identifier 重复初始化是 EI0003；TLS（含 Host DPU TLS）跨 rank 不一致会报错并列出各自 enable / disable / unknown 的 rank。

    V2（A5）四条链路最终都汇到 `CommunicatorImpl::Init` 的四个重载：按 `std::string` 入参、按 `RankTableInfo` 入参、按图接管（兼容入口）、按图接管加 `HcclCommConfig`（子域入口）。同一个通信器重复调 Init 打 `Repeated calling init method!` 并返回 `HCCL_E_INTERNAL`。`HcclCommInitRootInfoV2` 的 EI0003 在进 Init 之前由 `hcclGroupMap` 查重拦下：同 identifier 已登记就直接报错，与重复调 Init 是两道不同拦截。
  evidence: >-
    root 三步在代码里是一条顺序调用：`RankInfoDetectService::Setup()` 依次 `CHK_RET(GetConnections());`、`CHK_RET(GetRankTable());`、`CHK_RET(BroadcastRankTable());`，注释分别是「连接所有rank」「接收所有rank发来的localRankTable并整合为全局RankTable」「将完整RankTable广播给所有rank」（src/coll_communicator_mgr/rank_info_detect/rank_info_detect_service.cc:31-42）；step 校验失败同时报 EI0016 与 `Step mismatch: received %u, expected %u`（同文件:276-284）。rootInfo 长度是编译期常量：`HCCL_ROOT_INFO_BYTES = 4108` 与 `typedef struct HcclRootInfoDef { char internal[HCCL_ROOT_INFO_BYTES]; } HcclRootInfo;`（include/hccl/hccl_types.h:112-124）。控制面端口 `constexpr u32 HOST_CONTROL_BASE_PORT = 60016; // 控制面起始port，当前专用于拓扑探测使用，范围在[60016,60031]`（rank_info_detect.cc:28），无环境变量时走 PreemptPortManager 在该区间轮询（同文件:335）。数据面端口 `HOST_DATA_BASE_PORT = 60000`、`HOST_DATA_PORT_COUNT = 15`（rank_info_detect_client.cc:36-37），即 60000–60015。白名单 tag `rank_info_detect_default_tag`（root_handle_v2.h:22）与 A2/A3 的 `topo_detect_default_tag`（src/legacy/ascend910/framework/inc/topoinfo_struct.h:192）两套都在。A2/A3 分层减压常量 `TOPO_HIERARCHICAL_ENABLE_THRESHOLD = 32768`、`TOPO_MAX_GROUP_SIZE = 2048`（topoinfo_exchange_base.h:28、33），启用条件是 `rankSize > TOPO_HIERARCHICAL_ENABLE_THRESHOLD && !isScalable`（topoinfo_detect.cc:641）。

    V2 各入口锚点按 wiki 基线（WIKI2026102013386804，行号未在 c7e149d 复核，定位以文件名 + 函数名为准）：`HcclGetRootInfoV2`（op_base_v2.cc:600）、`HcclCommInitRootInfoV2`（:1891）、`HcclCommInitClusterInfoV2`（:327）、`HcclCommInitAllV2`（:682，执行体是非导出的 `HcclGetCommAllV2`，:628）、`HcclCreateSubCommConfigV2`（:912）、图模式 `HcomInitByFileV2` / `HcomInitByStringV2`（comm_manager.cc:596、:670）；`CommunicatorImpl::Init` 与 `Repeated calling init method!` 在 communicator_impl.cc（wiki 基线未给行号）。
  details: >-
    端口段与白名单 tag 按代际不同（V2 见上条 evidence，A2/A3 的 tag 前缀是 `topo_detect_default_tag_`）。V2（A5）在自述阶段预占数据面端口 60000–60015 并登记，供后续 QP 建链复用，避免跨阶段抢端口（rank_info_detect_client.cc:991-992 用 `HOST_DATA_BASE_PORT` 与 `HOST_DATA_BASE_PORT + HOST_DATA_PORT_COUNT` 组默认范围）；A2/A3 的对应事实是参数面 device 侧端口默认 16666，端口冲突时用 `HCCL_NPU_SOCKET_PORT_RANGE` 划范围。单卡多进程必须为每进程配不同端口，否则互相抢（EI0020）。
    「每卡自述」的内容与表形态按代际不同。V2（A5）读本机 topo.json 解析出 `level_list`（每层的 netLayer、net_instance_id、net_type、rank_addr_list），rank table 是 v2 形态；无 UB（没有 net_layer=0）时插入 `pcie_fallback=true` 的假 level0 并填本卡 vnic IP（`InsertPcieFallbackLevel0`，rank_info_detect_client.cc:65），这条日志通常是正常兜底。A2/A3 是 v1 形态（server_list → device_list，A3 多一个 super_pod_list），自述内容是 server IP、device IP、superPodId，不走 topo.json 那条。V2（A5）的自述顺序是：`rankSize == 1` 直接造单 rank 表、不起探测；优先读本机 `/etc/hccl_rootinfo.json`（存在即信任，解析失败直接报错、不静默回退）；否则向驱动要（`TopoAddrInfoGetSize` / `TopoAddrInfoGet(devPhyId)`）。
    netLayer 大于等于 3 且配了 backup_addr 的地址会先做 RDMA 探活，主地址 linkdown 时按序换备地址。什么时候还必须手写 rank table：要精确控制 IP、端口、网口（单卡多进程每进程不同端口，rank table 路径下 `HCCL_NPU_SOCKET_PORT_RANGE` 不生效，要在表里配 device_port / host_port）；要钉死一个错误拓扑或错误地址做复现与注入；老框架、老版本路径或异构非标组网；排除驱动自动推导的意外。选型建议：多机训练用 torchrun / mpirun 启动走 rootinfo（框架负责 rendezvous）；单机单进程多卡用 `HcclCommInitAll` 或 rootinfo；单卡多进程用 rootinfo + 显式端口范围；要复现拓扑问题用 rank table 文件；超大规模（A2/A3）用 scalable 多 root。
    A2/A3 与 A5 的 Entry 名不同，按代际选关键字：A2/A3 是 `Entry-HcclGetRootInfo:`（op_base_host.cc:771）、`Entry-HcclGetRootInfoScalable`（op_base.cc:899）、`Entry-HcclCommInitRootInfoInner:ranks[%u], rank[%u], rootinfo: host ip[%s] port[%u] nicDeploy[%d] identifier[%s], deviceLogicId[%d]`（op_base.cc:1218），完成行是 `[InitCommRootInfo]Init success`（op_base_host.cc:1160）——**legacy 树里没有不带 Inner 的 `Entry-HcclCommInitRootInfo`**；命中项一律带 `Inner` / `ConfigInner` / `ScalableInner` 后缀，按带冒号的外层名 grep 会落空；A5 是 `Entry-HcclGetRootInfo V950`（root_info_detect_provider.cc:39）与 `Entry-HcclCommInitRootInfo V950, rankId[%u], rankNum[%u].`（op_base_v2.cc:1817）。

    按链路读日志：路径 B 直传仍读一次 `/etc/hccl_rootinfo.json`，只为拿 `topo_file_path`（`CommunicatorImpl::InitRankGraph` 里的 `GetTopoFilePath`，文件可读就取字段，不可读退回 `TopoAddrInfoGetTopoFilePath`）；路径 D 子域不经过探测、不重建拓扑，看不到 `[RankInfoDetect*]` 探测日志。

    V2 的跨库桥接回调表（bridge）有两个：RootInfoDetectBridge 与 RankGraphBuilderBridge。槽位归 hccl_v2.so，实现编译进 hcomm.so，hcomm.so 装载期由静态对象注册，运行时 hccl_v2.so 用函数指针回调；`TopoAddrInfoGetSize` / `TopoAddrInfoGet` 在 topoaddrinfo.so 里是普通符号调用，不是 bridge。
