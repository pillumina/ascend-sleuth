id: hccl-bootstrap-rank-table-and-rootinfo
type: software-fact
title: HCCL 建域的四条入口链路（探测 / 直传 / 批量 / 子域）：root 三步、端口段、消息格式、校验错误码
summary: 建域阶段卡住或报 EI0014/EI0015/EI0016 时，先分清入口走四条主链路里的哪条（探测 / 直传 / 批量 / 子域）：差别只在 bootstrap 段，下游共用建图与建链。

