id: npu-smi-950-device-ops
type: tool
title: npu-smi（Ascend 950 版）设备查询与维护（info -t 全族 / watch 实时监控 / ECC 与告警 / TLS 证书 / 持久化模式日志转储）
summary: "950 平台 npu-smi 的查询与维护命令面。**查询**：`npu-smi info -l` 列全部设备（拿逻辑 ID）、`npu-smi info` 基本信息、`npu-smi info -m` 设备映射、`npu-smi info -t <topic> -i <dev_id>` 按主题查——`board`（NPU 详情）、`common`、`usages`（设备统计）、`health`（**健康状态**）、`power`/`temp`/`volt`（功耗/温度/电压）、`ecc`（**ECC 错误计数**）、`ecc-enable`（ECC 使能状态）、`flash`、`current-fault-event`（**当前故障事件**）、`tls-cert`/`tls-cert-period`/`tls-csr-get`（证书/到期阈值/CSR）、`sys-log-info`（日志转储配置）；`npu-smi info watch [-i <dev>] [-d <秒>] [-s <项>]` 实时监控。**维护**：`npu-smi clear -t ecc-info -i <dev>` 或 `npu-smi set -t clear-ecc-info -i <dev>` 清 ECC 计数（**两种形态**）、`npu-smi set -t clear-syslog-cfg` 把日志转储配置恢复默认并终止转储、`npu-smi set -t sys-log-enable -d <0|1>` 开关持久化模式日志转储、`npu-smi set -t tls-cert -i <dev> -f 『<device cert> <root CA> <level-2 CA>』` 预置/更新 TLS 证书、`npu-smi info -t tls-csr-get -i <dev>` 取 CSR；`upgrade`/`info`/`set`/`clear` 各有 `--help`。**判读注意**：多条告警并存时 **`health` 取最严重的那条**；**非 root 用户查 NPU 固件版本显示 `NA`**；`info -m` 的 **NPU ID 为 `-1` 表示该 NPU 不可用、映射信息无效**；温度在不同芯片间存在差异（芯片本体、TIM 材料形变、结构公差与上层应用都会影响），**没有过温告警即属正常范围**。"

