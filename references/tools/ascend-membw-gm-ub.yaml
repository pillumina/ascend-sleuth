id: ascend-membw-gm-ub
type: tool
title: mem_bandwidth（NPU 访存带宽测试：GM↔UB 三条数据流逐组扫描 + msprof 换算带宽）
summary: "mem_bandwidth：cann-samples 的最小 kernel 带宽测试样例，bw_read / bw_rw / bw_rcw 分别隔离纯读、读写拷贝、读+计算+写三条数据流，成对扫描 UB tile 大小与 buffer 数观察带宽随搬运粒度与缓冲深度的变化；kernel 自身不计时，带宽由 msprof 采 `Task Duration` 换算（读 `DATA_BYTES/时间`、读写 `2×DATA_BYTES/时间`）。仅支持 Ascend 950（dav-3510），默认单组约占 3.5 GiB（读写类 7 GiB）显存"

sources:
  - type: official-doc
    url: "https://gitcode.com/cann/cann-samples/blob/master/Samples/1_Features/hardware_features/mem_bandwidth/README.md"
    version: "cann-samples master（含源码同级 src/ 与 CMakeLists）"
