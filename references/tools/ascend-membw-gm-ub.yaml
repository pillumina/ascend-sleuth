status: active
last_verified: 2026-09-14

content:
  tool_name: "mem_bandwidth（cann-samples / Samples/1_Features/hardware_features 下的 NPU 访存带宽测试样例）"
  invocation: "先在样例仓根目录编译（`cmake -S . -B build -DNPU_ARCH=dav-3510` + `cmake --build build --target mem_bandwidth`），进 `build/Samples/1_Features/hardware_features/mem_bandwidth` 运行；无参=按默认列表成对扫描，带参=只跑一组；带宽本身不打印，用 `msprof --application=` 采集后从 `Task Duration` 换算"
  commands:
    build: "cmake -S . -B build -DNPU_ARCH=dav-3510 && cmake --build build --target mem_bandwidth（三个可执行一起编，也可 --target bw_read 单独编）"
    run_sweep: "./bw_read（无参：按下标成对扫 DEFAULT_QUE_BYTES_LIST 与 DEFAULT_BUFFER_NUM_LIST，两张表一一配对不是笛卡尔积，共 29 组）"
    run_one: "./bw_rcw 16384 4（只跑这一组：tile 16KB、buffer 数 4；两个参数要么都不给要么同时给，只给一个打印用法并返回 1）"
    collect: "msprof --application=\"./bw_read 16384 2\" --output=./prof —— **必须逐组带参采集**：无参运行连发 29 次 kernel launch，profiling 里是 29 条同名 task 记录且不携带 queBytes/bufNum，无法把某条 Task Duration 对回具体组合"
  output_meaning:
    - "三条数据流与计量：`bw_read` 只搬入、随即回收 buffer（CopyIn → Drain，不计 MTE3），带宽 = `DATA_BYTES / Task Duration`；`bw_rw` 是 `y = x` 纯拷贝（CopyIn → CopyOut，用 TQueBind 把 VECIN/VECOUT 绑成一条队列省掉 UB→UB 拷贝），带宽 = `2 × DATA_BYTES / Task Duration`；`bw_rcw` 是 `y = |x|`（两条独立队列，中间插 Abs，搬运与计算重叠），同为 `2 × DATA_BYTES / Task Duration`"
    - "stdout 每跑完一组打印一行（如 `queBytes=1024 bufNum=2 读取完成（3758096384 bytes）`），读写类额外带精度信息；**通过率的显示精度不足以判定成败**——passRate 用默认 ostream 精度输出，9.4 亿个元素里错几个照样显示 100%，判定要看进程返回码或 `bw_rcw` 的 `maxErr`（参数非法、超 UB 预算等提示一律走 stderr）"
    - "返回码：0 = 所有实际执行的组合都完成且精度通过；1 = 参数用法错误 / 参数非法被跳过 / 显式指定的组合超 UB 预算 / 精度校验失败 / 任一 ACL 调用失败 / 元素数不能被核数整除。精度失败不中断扫描（跑完全部组合才返回 1），ACL 失败立即中止"
    - "辅助指标（来源自标未经 msprof 实际输出核对，字段名取自源码注释）：`aiv_mte2_time` 搬入耗时；`aiv_mte3_time` 搬出耗时（只有 bw_rw / bw_rcw 有）；`aiv_vec_time` 用于验证 —— bw_rw 应接近 0，接近 0 才说明 TQueBind 生效、确实没有多余的 UB→UB 拷贝"
  pitfalls:
    - "架构：仅支持 `NPU_ARCH=dav-3510`（Ascend 950）。用 `dav-2201` 配置本样例被静默跳过，四个 target 都不存在，编译报 `No rule to make target`——这是架构不匹配，不是编译配置错（见 npu-arch-token-map）"
    - "内存规模：`DATA_BYTES` 默认 `56 × 64 MiB ≈ 3.5 GiB`；`bw_read` 需约 3.5 GiB device + 3.5 GiB host，`bw_rw` / `bw_rcw` 因 x 与 y 同时存在需约 7 GiB + 7 GiB。内存不足时在 `aclrtMalloc` 处经 CHECK_ACL 打印 `ACL error: <码> at <文件>:<行>` 并返回 1，且**已申请的 device 内存与 stream 不会释放**。要缩规模改 `src/bw_common.h` 的 `DATA_BYTES`，但必须保证 `DATA_BYTES / 4` 能被 AIV 核数整除（默认 56 正是为整除 56 核而选），否则直接报错退出"
    - "UB 预算：`queBytes × bufNum × 队列数 ≤ UB 容量`（dav-3510 为 248 KB，运行期由 `GetCoreMemSize` 查得）。**队列数 bw_read / bw_rw 为 1、bw_rcw 为 2**；bw_rcw 因双队列，默认列表里 `64KB×2` / `32KB×4` / `16KB×8` 三组各需 256 KB 超预算——无参运行会自动跳过这 3 组、实际只跑 26 组（属硬件容量所限，不置错误码）；但在命令行**显式指定**这类超预算组合会因该组跑不成而返回 1"
    - "`queBytes` 是**每个 buffer** 的字节数，不是整条队列的——它对应 `pipe.InitBuffer(que, bufNum, len)` 的第三个参数，单条队列实际占用 `bufNum × queBytes`；bw_rcw 有两条队列，UB 总占用还要再乘 2"
    - "数据构造：host 端用固定种子 `mt19937(12345)` 的 `uniform_real_distribution(-1.0f, 1.0f)` 填充，多次运行数据完全一致；用随机数而非全零是为避免全零内存被压缩后读出虚高带宽；每组组合都重新 `aclrtMalloc` 并刷入 device，避免上一轮的 cache 与数据残留影响测量"
    - "别引用「典型带宽数值」：来源 README 自标 TODO——各组合的实测带宽与带宽-粒度曲线、bufNum 增大是否真能加深流水重叠、29 组扫描的实际耗时都标注为『需在真机上补充』。它能测出的是**你自己环境的**带宽，来源里没有可直接引用的数值"
