id: cannsim-sim-profiling
type: tool
title: cannsim 仿真观测（SoC 级指令流水 cycle Trace + bit 级精度仿真，非上板采集；单卡/仅 AI Core 计算算子/仅 950PR）
summary: "cannsim 在 SoC 级仿真器上跑同一个 kernel（与上板二进制兼容），输出两类结果：**性能面**——cycle 级指令流水 Trace 与 VectorFunction（VF）的 load / exec / store pipe 分布；**精度面**——bit 级精度结果用于算子精度验证。它补的是上板 profiling 只见端到端耗时、无法归因到指令级的盲区。硬边界：**仅 Ascend 950PR（尝鲜版本，dav-3510）、仅单卡（代码里只能设 0 卡）、仅 AI Core 计算类算子（不支持 MC2 与 HCCL 类型算子）、不支持 arm 环境**；仿真的是独立最小 kernel 工程，不能仿真客户的训练/推理作业。"

