id: cannsim-sim-profiling
type: tool
title: cannsim 仿真性能观测（VF/算子级 cycle Trace，非上板采集）
summary: "cannsim 以 cycle 级仿真输出 VectorFunction（VF）的执行 Trace 与 load / exec / store pipe 分布，用于上板 profiling 只见端到端耗时、无法归因到指令级时的进一步观测；仅支持 Ascend 950（dav-3510），且仿真的是独立最小 kernel 工程——不能仿真客户的训练/推理作业"

