id: msopprof
type: tool
title: msopprof 算子级性能采集（流水图 + 带宽类 CSV 指标，与 TTK 配合须关 Profiling 与预热）
summary: "MindStudio 的**算子级性能采集与分析工具**：采集算子执行过程中的**硬件流水、带宽利用率**等细粒度数据，生成流水图 `visualize_data.bin`（供 MindStudio Insight 查看）与 `L2Cache.csv`、`MemoryL0.csv` 等性能数据文件。**与 TTK 配合时必须关掉 TTK 自带的 Profiling 采集与预热**（`--task-prof=false --warmup=false`），因为 TTK 内部自带采集流程会与 msopprof 的采集冲突；命令形如 `msopprof [msopprof 自身参数] python3 -m ttk kernel -i cases.csv --task-prof=false --warmup=false`（msopprof 自身参数放在 `msopprof` 与 `python3` 之间，TTK 侧仍可用自己的用例筛选与编译参数）。**CSV 关键指标口径**：`aic_main_mem_read_bw(GB/s)` 是从 GM 往外搬运的带宽（**不只是 GM 到 L1 这部分**）、`GM_to_L1_datas(KB)` 是 GM 到 L1 的搬运数据量、`GM_to_L1_bw_usage_rate(%)` 是 GM 到 L1 的带宽利用率、`aic_L1_read_bw(GB/s)` 是 L1 到 L0A/L0B 的带宽（**目前无途径分别采集这两个带宽**）；**`task duration` 与 `aiv time` 的关系**——`task duration` 一般大于 `aiv time`，因为前者含硬件调度时间、后者是纯核执行时间；两者来源不同：**`task duration` 由 stars 采集、`aiv time` 由 ffts 采集**（`aiv time` 为 Block 级子核时间）。"

