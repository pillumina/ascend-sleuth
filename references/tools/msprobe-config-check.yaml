id: msprobe-config-check
type: tool
title: msprobe config_check——训练前配置检查（双环境差异比对）
summary: msprobe config_check：对比两个训练环境下影响精度的配置差异（环境变量/第三方库版本/训练超参/权重/数据集/随机操作）；静态采集只覆盖前三项，动态采集才覆盖全部；比对输出 result.xlsx，summary 页六项 pass/error/warning，前五项必须在精度比对前 pass

sources:
  - type: official-doc
