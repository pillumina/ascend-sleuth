id: ascend-stack-view
type: tool
title: 查看 Python / C&C++ 应用程序堆栈（py-spy / gdb）
summary: 卡住进程取堆栈：Python 用 py-spy dump -p <pid> > pyspy.log（不中断进程）；C/C++ 用 gdb -p <pid> 后 bt 查看调用栈（需安装 gdb）；进程中断/卡住定位的宿主侧配合手段

