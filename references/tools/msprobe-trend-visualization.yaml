id: msprobe-trend-visualization
type: tool
title: msprobe data2db 趋势可视化——统计量按 step/rank/张量三维趋势（含 Megatron 并行切分可视化）
summary: msprobe 趋势可视化：`msprobe data2db --db <dir> --data <dump/monitor 目录>` 把 dump(L0/mix) 或 monitor(csv) 解析成 .trend.db，再用 TensorBoard 的 TREND ANALYZER 从 step/rank/张量目标三维看统计量趋势；配套 `plot_model_parallelism` 画 Megatron 切分图（各卡层与整网位置对应），支撑热力图判读

