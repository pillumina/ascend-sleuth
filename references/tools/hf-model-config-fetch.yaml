id: hf-model-config-fetch
type: tool
title: HuggingFace 模型 config/文件获取的多源策略（主站不可达时的镜像备选）
summary: 诊断需拉 HuggingFace 模型 config.json / 权重等公开文件时，huggingface.co 主站可能不可达（网络限制）——实测 hf-mirror.com 镜像可用（HTTP 200）；git 仓不存在的模型（如 Qwen/Qwen3-VL-Reranker-2B 不在 GitHub）用 HF API/镜像 resolve 路径拉取。多源尝试 + 失败记录是诊断获取纪律（EV-2026-004 #13446 实证）。

sources:
  - type: engineer-input
    engineer: ascend-sleuth agent（EV-2026-004 实施验证，2026-09-03 实测）
    input_session: "#13446 replay 复测（拉 Qwen3-VL-Reranker-2B config.json）"
    confirmed_at: 2026-09-03

related_references: []

applies_to:
  platforms: [cross]
  frameworks: [vllm-ascend]

status: active
last_verified: 2026-09-03

content:
  tool_name: "HuggingFace 文件获取（config.json / safetensors 等公开模型文件）"
  invocation: "诊断需核对模型 config（model_type/architectures/量化参数）或源码时，按序尝试：① huggingface.co resolve 路径 → ② hf-mirror.com 镜像（实测可用）→ ③ HF API models 搜索确认正确模型 id。GitHub 拉模型 repo 通常 404（模型在 HF 不在 GitHub）——不要因 gh api Not Found 就判'模型不存在'"
  commands:
    hf_main: "curl -sL https://huggingface.co/<org>/<model>/resolve/main/config.json（主站——本环境实测不可达/超时）"
    hf_mirror: "curl -sL https://hf-mirror.com/<org>/<model>/resolve/main/config.json（镜像——实测 HTTP 200 可用，2026-09-03）"
    hf_search_api: "curl -sL 'https://huggingface.co/api/models?search=<模型名片段>'（搜索确认正确模型 id；主站 API 同受网络限制时走镜像）
"
  pitfalls:
    - "huggingface.co 主站本环境不可达 ≠ 数据不存在——先试镜像/API 再判'客观缺失'（#13446 教训：旧口径直接标缺 config，实为没试对源）"
    - "模型 repo 不在 GitHub（gh api Not Found）是常态——模型托管在 HF，查 GitHub 不是正确路径"
    - "fetch 失败要记录失败尝试（trace tool_calls 含失败），备选源清单由此持续沉淀"
