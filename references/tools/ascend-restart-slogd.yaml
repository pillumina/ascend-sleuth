id: ascend-restart-slogd
type: tool
title: 重启 Device 侧日志进程 slogd
summary: 修改日志配置或日志进程异常后重启 slogd：kill -15 <pid> 让其清理共享内存后自动拉起（反复失败才用 -9），ps -elf | grep log 确认；重启后系统类日志续写未满旧文件、应用类写全新文件；需 Device 侧登录权限，EP 形态无此权限

