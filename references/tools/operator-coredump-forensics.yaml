id: operator-coredump-forensics
type: tool
title: 算子 coredump 取证（触发条件 / 产物配套 / 加载解析与有效栈帧判据 / 与在线调试互斥）
summary: 算子崩溃后的离线取证：产出 core 的触发条件、编译选项（与在线调试相反）、崩溃摘要与栈帧哪几帧不能当根因。

