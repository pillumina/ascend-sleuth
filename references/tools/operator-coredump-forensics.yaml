content:
  tool_name: "msdebug（LLDB 风格的昇腾算子调试器，含 coredump 解析）"
  invocation: >-
    在线调试：`msdebug ./test_aclnn_add_example`、`msdebug -- ./app --flag1 arg1` 或 `msdebug python3 t.py`（需先按调试用途编译，且
    `/proc/debug_switch` 为 `1`）。事后取证：先按触发条件产出 core，再 `msdebug --core <core 文件> [<kernel.o 或 -O2 -g 二进制>]`。
  commands:
    produce_core: "`export ASCEND_DUMP_SCENE=aic_err_detail_dump; export ASCEND_DUMP_PATH=<目录>; ./<算子可执行>`（不设这个变量不会生成 aic core）"
    load_core: "`msdebug --core <core 文件> <kernel.o 或带 -O2 -g 的二进制>`"
    crash_summary: "进去后 `ascend info summary`——给 `stop_reason`、崩溃核列表与 PC、dump 可读内存区域"
    backtrace: "`bt` 看调用栈（**有效性取决于 `stop_reason`**）"
    build_hint: "上板调试建议 `-O0 -g`；coredump 解析建议 `-O2 -g`（`-O0` 会展开过多 inline，栈帧更少）"
  output_meaning:
    - "`stop_reason` ∈ MTE / VEC / CUBE / CCU / FIXP_ERROR 时，`bt` 才保证准确"
    - "`bt` 的帧 `#0~#2` 常是库调用链——问题点通常更靠后，**不要把前三帧当根因**"
    - "`ascend info summary` 同时给出崩溃核列表与 PC，是多核场景判断“哪个核先挂”的入口"
  pitfalls:
    - "**抓 core 与在线调试互斥**：同一环境不要同时挂 msdebug 在线调试再抓 core"
    - "不设 `ASCEND_DUMP_SCENE` 时不会有 aic core——先确认这个变量再怀疑现场没留"
    - "**coredump 与在线调试的编译选项相反**（前者 -O2 -g、后者 -O0 -g）——用错会让栈帧残缺，看起来像“没有有用信息”"
    - "单 Device 同时只能有一个 msdebug 实例；`/proc/debug_switch` 不是 `1` 时调试功能不可用"
    - "它是**源码级**手段：需要能拿到与该 core 配套的二进制/kernel.o 才能解析出有意义的位置"
