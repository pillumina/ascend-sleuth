id: aoe-model-tuning
type: tool
title: AOE 模型调优（aoe 命令：先子图调优再算子调优 → 知识库/om/效果文件 → TUNE_BANK_PATH 指定后推理）
summary: "推理性能调优的关键工具之一（另一个是模型压缩工具 AMCT）：`aoe` 命令在 atc 参数基础上增加 `--job_type`，提供**子图调优**与**算子调优**；**一般建议先做子图调优再做算子调优**——子图调优会生成图的切分方式，之后算子已被切成最终 shape，再按最终 shape 做算子调优；顺序颠倒会因调优时的 shape 不是最终切分后的 shape 而影响调优效果。aoe 生成三类产物：**适配 AI 处理器的 om 模型文件**（`{model_name}_{timestamp}/tunespace/result/{model_name}_{timestamp}_tune.om`，或带 `_{os}_{arch}` 后缀，默认在执行 aoe 命令的当前目录下）、**基于 AI 处理器的调优知识库**（子图调优默认存 `${HOME}/Ascend/latest/data/aoe/custom/graph/${soc_version}`、算子调优存 `.../custom/op/${soc_version}`）、**调优效果文件**（当前目录下 `aoe_result_opat_{timestamp}_{pid_xxx}.json`，记录被调优的算子信息，可查阅各算子的性能提升率）。调优后需**设置 `TUNE_BANK_PATH` 环境变量指定调优知识库**再执行模型推理。"

