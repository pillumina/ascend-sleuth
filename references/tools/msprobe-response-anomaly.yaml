id: msprobe-response-anomaly
type: tool
title: msprobe response_anomaly——推理异常检测（生僻字/乱码/重复/NaN logprobs）
summary: msprobe response_anomaly：基于输出 token + topk logprobs 的**无参照**实时异常检测，返回 [is_ill, ill_type]（1=生僻字 2=乱码 3=重复 4=NaN Value）；库接口 analyze_output_anomaly(topk_logprobs, tokens, model_configs)，需先备 config.yaml 阈值与模型 token→字符类别映射；适合线上发现"输出崩溃"类故障

