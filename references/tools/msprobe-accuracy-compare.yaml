id: msprobe-accuracy-compare
type: tool
title: msprobe compare——数值精度比对（NPU vs 标杆，真实数据/统计量/MD5 三模式）
summary: msprobe compare：把 NPU dump 与 CPU/GPU/NPU 标杆 dump 逐 API 比对，输出 compare_result_{ts}.csv（多卡按 rank 分文件）；三种数据模式（真实数据/统计数据/MD5）对应三套表头与指标；加 -da 可自动识别全网首个差异节点

