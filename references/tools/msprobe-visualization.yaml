title: msprobe graph_visualize——分级可视化构图比对（TensorBoard 图/颜色判定）
summary: msprobe graph_visualize：把 dump 数据还原成模型图结构，用 TensorBoard 做结构与精度双图比对；节点颜色 error>warning>pass>未匹配，判定规则按真实数据/统计数据/MD5 三模式分列；支持溢出筛选、名称搜索、跨套件比对与多卡构图

