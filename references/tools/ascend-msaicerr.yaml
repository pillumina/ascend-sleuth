id: ascend-msaicerr
type: tool
title: msaicerr AI Core Error 专项分析工具
summary: msaicerr 分析 AI Core Error 问题（输出 info.txt 分析报告）、解析 Dump 文件、转换 Dump 数据类型、检查环境；不支持 MatmulAllReduce 类算子（7 个）的 AI Core Error 分析

sources:
  - type: official-doc
    url: "https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/troubleshooting/troubleshooting_0099.html"
