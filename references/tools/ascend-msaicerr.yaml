id: ascend-msaicerr
type: tool
title: msaicerr AI Core Error 专项分析工具（含功能约束、目录约束与四个子命令的参数口径）
summary: msaicerr 分析 AI Core Error 问题（输出 info.txt 分析报告）、解析 Dump 文件（→.bin/.npy，含算子输入输出与 workspace）、转换 Dump 数据类型（13 种 dtype）、检查环境（-e 跑内置算子样例）；不支持 MatmulAllReduce 类算子（MatmulAllReduce 全类 + 7 个具体算子）的 AI Core Error 分析；仅本地分析（工具环境须与日志所在环境一致）、依赖 python3.7.5+、不支持 Ascend RC 形态

