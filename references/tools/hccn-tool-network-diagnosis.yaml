id: hccn-tool-network-diagnosis
type: tool
title: hccn_tool（网口链路闪断 / device IP / ROCE 与 HCCS 连通性 / TLS 状态与证书）
summary: "用 hccn_tool 检查 device 侧网络链路健康与 TLS 一致性的一套命令：`-link_stat -g` 查网口 up/down 次数与闪断时间点（ERROR CQE 的常见根因）、`-ip -g`/`-vnic -g`/`-ip -inet6 -g` 查 NIC/VNIC/IPv6 地址、`-ping -g address <ip>` 与 `-hccs_ping -g address <ip>` 按 IP 类型做 ROCE 或 HCCS ping（建链超时确认连通性）、`-tls -g`/`-tls -s enable <0|1>` 查改 TLS 开关与证书（EI0016 一致性校验失败）、`-optical -g`/`-lldp -g` 查光模块在位与交换机连通（EI0009 端口 down 排查）。"

