content:
  tool_name: "hccn_tool（昇腾 device 侧网络链路与 TLS 状态检查工具；在计算节点上按 device 逻辑 ID 执行）"
  invocation: "hccn_tool -i <device_id> <检查项参数> -g（查询）/ -s（设置）；<device_id> 为 NPU 逻辑 ID（npu-smi info -l 查出的 NPU ID，批量时用 for n in {0..7}; do hccn_tool -i $n ...; done）。用于集合通信故障中确认 device 侧链路、地址、连通性与 TLS 状态——链路闪断、网卡选错、TLS 不一致三类根因都靠它出证据。"
  output_meaning:
    - "-link_stat -g：网口 up/down 计数与 link change records 时间点（如 link down count 与 LINK DOWN 时间），用于把网口闪断时间与集合通信报错时间对齐——ERROR CQE（EI0013）的典型根因"
    - "-ip -g / -vnic -g / -ip -inet6 -g：分别列出 NIC IP、VNIC IP 与 IPv6 地址；报错信息里的 src_ip/dest_ip 要先确认属于哪一类再决定怎么 ping"
    - "-ping -g address <dest_ip>：ROCE ping（对端是 NIC IP）；-hccs_ping -g address <dest_ip>：HCCS ping（对端是 VNIC IP）——建链超时（EI0006）里判定两端是否真的连通"
    - "-tls -g：逐个 device 输出 tls switch[0]（0 关闭 / 1 开启）、告警天数阈值与 pub cert/ca1/ca2 证书的 issuer 与有效期；-tls -s enable <0|1>：设置 TLS 开关"
    - "-optical -g：光模块是否在位（grep present）；-lldp -g：与交换机的 LLDP 邻居是否连通——端口 down（EI0009）时的三段式排查"
  pitfalls:
    - "先确认报错里的 IP 属于 NIC 还是 VNIC（分别用 -ip 与 -vnic 查），再用对应的 ping 方式：NIC → roce ping，VNIC → hccs ping；用错会得到「ping 得通但业务仍超时」的假结论"
    - "TLS 一致性校验（EI0016）要求报错的两端都查：日志只打印 Disable/Enable 列表中的一侧，未打印的节点即为相反配置；开关一致时还要继续比对证书是否一致"
    - "同一 device 上多进程场景下端口冲突（EI0019，默认 device 侧 16666、Host 侧 60000-60031）不是 hccn_tool 能解决的，需用 HCCL_NPU_SOCKET_PORT_RANGE / HCCL_HOST_SOCKET_PORT_RANGE 划范围"
    - "**语法版本要分清**：950 的工具是 `hccn_tool -g|-s|-t <命令> -i -u -p`（模式开关前置、三级寻址），与旧版 `hccn_tool -i <dev> -link -g` 写法不同；照抄旧文档命令在 950 上会直接报参数错误，别把它当成『工具坏了』"
    - "**`-s -stat -clear` / `-s -su_ber -clear` 会清零累计统计**（端口统计与 SU 误码）——排查前先记录原值，否则丢证据"
    - "`-g -link_stat`（历史 up/down）与 `-g -down_data`（down 时刻的信息）、`-g -adapt_status`（历史建链过程）是三份不同的证据，端口闪断类问题要一起看：先看有没有 down 记录，再看 down 时刻的 down_data，最后看建链历史"
    - "**UB ping 用 EID 而不是 IP**（`-src_eid/-dst_eid` 形如 `::40:10:0:dfdf:90`）；超节点场景排查连通性时它与 ROCE ping（-ping）和 HCCS ping（-hccs_ping）是三条不同的链路"
  commands:
    - name: 查网口闪断记录
      cmd: "hccn_tool -i 0 -link_stat -g"
      when: ERROR CQE（EI0013）报错后确认网口是否在该时间点断链
    - name: 查 NIC / VNIC / IPv6 地址
      cmd: "for n in {0..15}; do hccn_tool -i $n -ip -g ;done（VNIC 用 -vnic -g，IPv6 用 -ip -inet6 -g）"
      when: 把报错里的 src_ip/dest_ip 对应到具体 device 与地址类型
    - name: 按 IP 类型做连通性 ping
      cmd: "hccn_tool -i <node> -ping -g address <dest_ip>（ROCE）；hccn_tool -i <node> -hccs_ping -g address <dest_ip>（HCCS）"
      when: 建链超时（EI0006）双方互等、需判定链路是否连通
    - name: 查 / 改 TLS 状态与证书
      cmd: "for i in `seq 0 7`; do hccn_tool -i $i -tls -g; done；hccn_tool -i <device_id> -tls -s enable 1"
      when: EI0016 TLS 配置不一致，或需要统一开启 TLS
    - name: "【950 新语法】查询端口链路与建链历史"
      cmd: "hccn_tool -g -link -i <dev> -u <unit> -p <port>（当前链路状态 UP/DOWN）；-g -link_stat（历史 up/down 记录）；-g -down_data（**链路 down 时的信息**）；-g -adapt_status（历史建链过程状态）；-g -speed（端口速率）；-g -port_info（端口状态）"
      when: 端口 down / 链路反复闪断 / 建链异常时定位
    - name: "【950 新语法】查询端口质量与带宽"
      cmd: "hccn_tool -g -fec / -g -serdes / -g -bit_err / -g -su_ber [-mode_status|-result] / -g -credit -i -u -p；-g -peak_bw [-time <秒>] 与 -g -bandwidth [-time <秒>] 查峰值/实时带宽"
      when: 误码、FEC、SerDes 或带宽类性能问题
    - name: "【950 新语法】查询 UB 连通与 UB ping"
      cmd: "hccn_tool -g -ub_connect -i <dev>（NPU 间互联/断连状态）；hccn_tool -t -ub_ping -i <dev> -src_eid <eid> -dst_eid <eid> [-pkt <字节>] [-cnt <次数>] [-interval <秒>]"
      when: 超节点 UB 链路连通性排查（与 -ping/-hccs_ping 并列的第三种探测）
    - name: "【950 新语法】查询队列/上下文资源与设备信息"
      cmd: "hccn_tool -g -show_list -i <dev> -d <dev_name>；-g -show_res -i <dev> -d <dev_name> -resource_type <n> -key_id <n>；-g -context -i <dev> -d <dev_name> -aeqc|-ceqc <n>；-g -dev_info / -g -process / -g -version / -g -vnic / -g -cfg_recovery -i <dev>"
      when: 队列资源不足、AEQ/CEQ 上下文异常、需确认 DRV/固件版本或设备侧进程时
    - name: "【950 新语法】端口与 TLS 的维护动作"
      cmd: "hccn_tool -s -stat -clear -i -u -p（清端口统计）；-s -su_ber -clear（清 SU 误码统计）；-t -su_ber ... -mode rx_enable（设 SU 误码模式）；-t -dump -i -u -p（导出端口寄存器）；-s -upgrade_lane（端口 lane 扩展）；-s -cfg_recovery -i <dev>|-all（配置恢复）；-s -tls -i <dev> -enable <0|1> / -alarm <天数> / -path <路径> -pri <私钥> -pub <设备证书> -ca1.. -crl / -clear [-crl] [-host]"
      when: 清理统计以重测、导出寄存器取证、TLS 开关与证书轮换（EI0016 相关）
    - name: 查光模块与交换机连通
      cmd: "for i in {0..7}; do hccn_tool -i $i -optical -g; done | grep present；for i in {0..7}; do hccn_tool -i $i -lldp -g; done"
      when: EI0009 端口 down，逐层排除光模块未在位与交换机未连通
