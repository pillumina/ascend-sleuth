id: hccn-tool-network-diagnosis
type: tool
title: hccn_tool（网口链路闪断 / device IP / ROCE 与 HCCS 连通性 / TLS 状态与证书）
summary: "用 hccn_tool 检查 device 侧网络链路健康与 TLS 一致性的一套命令。**旧版写法**（模式开关在尾）：`-link_stat -g` 查网口 up/down 次数与闪断时间点（ERROR CQE 的常见根因）、`-ip -g`/`-vnic -g`/`-ip -inet6 -g` 查 NIC/VNIC/IPv6 地址、`-ping -g address <ip>` 与 `-hccs_ping -g address <ip>` 按 IP 类型做 ROCE 或 HCCS ping、`-tls -g`/`-tls -s enable <0|1>` 查改 TLS 开关与证书（EI0016）、`-optical -g`/`-lldp -g` 查光模块在位与交换机连通（EI0009 端口 down 排查）。**Ascend 950 起为新的三段式语法**：`hccn_tool -g|-s|-t <命令> -i <dev> -u <unit> -p <port>`（**模式开关前置**），命令面扩展到链路历史与建链历史、端口统计/误码/FEC/SerDes/信用与带宽、UB 连通与 UB ping、queue/context 资源、配置恢复与 TLS 证书管理——详见 content 的 950 命令族。"

