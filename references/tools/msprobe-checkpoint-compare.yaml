id: msprobe-checkpoint-compare
type: tool
title: msprobe ckpt 比对——逐参数 l2/余弦相似度（Megatron/MindSpeed）
summary: msprobe ckpt 比对：`msprobe config_check --compare <ckpt1> <ckpt2>` 逐参数输出 l2（欧氏距离）/cos（余弦相似度）/numel/shape 到 json；支持 Megatron-LM 与 MindSpeed（含 TP/PP/EP/VPP 与 megatron.core / legacy / TransformerEngine 实现）；用于验证权重转换、续训、格式往返后参数是否走样

