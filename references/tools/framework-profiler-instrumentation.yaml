content:
  tool_name: "框架侧 torch_npu.profiler 接入（训练 YAML 配置 / 推理 HTTP 启停）"
  invocation: >-
    训练：在框架 YAML 的 `training:` 段打开 `profile: true` 并给窗口（见 commands.training_yaml），启动训练即可采集，
    产物落在 `profile_save_path` 下的 `ASCEND_PROFILER_OUTPUT/` 或 `*_ascend_pt` 目录。
    推理：服务启动加 `--profiler-config '{...}'`，运行期用 HTTP 开关采集窗口。
    **外层 msprof 能包住命令时优先用 msprof**（见 msprof-collect-parse）——本词条是包不住时的那条路。
  commands:
    training_yaml: "`training: {profile: true, profile_step_start: <起始步>, profile_step_end: <结束步，-1=到结束>, profile_ranks: [<卡号，默认全卡>], profile_level: level1, profile_export_type: db, profile_save_path: <目录>}`（另有 profile_with_cpu / profile_with_stack / profile_with_memory / profile_record_shapes 四个开销开关，按需开）"
    window_math: "窗口必须落在真实 step 上：`skip_first + (wait + warmup + active) * repeat < 总 step 数`；结束为 -1 时 active 视为足够大，否则 `active = 结束 − 开始`，`active ≤ 0` 直接报错；`skip_first = max(0, 开始 − 1)`，`warmup` 在起始步为 0 时取 0、否则取 1"
    inference_start: "`python3 -m vllm.entrypoints.openai.api_server ... --profiler-config '{profiler=torch, torch_profiler_dir=./vllm_profile}'`（值为 JSON，示例里给成键值便于阅读），随后 `curl -X POST http://localhost:8000/start_profile` 开、`curl -X POST http://localhost:8000/stop_profile` 关"
    rl_two_sides: "RL 训推对比要在**同一次运行**内两侧都采：训练侧框架 `global_profiler`（tool=npu、steps、save_path）+ actor/ref 的 `profiler.enable=True` 与 `tool_config.npu.contents=['npu','cpu','shapes']`、`level=level1`；rollout 侧 `profiler.enable=True`、`tool=npu`、**`tool_config.npu.discrete=True`（不开则推理侧不独立采集）**"
    inference_export_db: "推理侧 `export_type=Text` 不会自动落 db——必须离线解析：`from torch_npu.profiler.profiler import analyse; analyse(<dir>)`（CANN 不支持 text 自动带 db 时显式 `export_type=['db']`）"
    verify_artifacts: "框架侧看 `ASCEND_PROFILER_OUTPUT/`（text 需 `trace_view.json` + `kernel_details.csv`，db 需 `ascend_pytorch_profiler_*.db`）；db 是否真有数据要查表行数（推理侧 `SELECT COUNT(*) FROM COMPUTE_TASK_INFO` > 0），不能只看文件存在"
  output_meaning:
    - "`profile_level` 决定字段面：level0 缺 shape/dtype/format/block_dim 与各类 ratio，通信带宽与通信矩阵也不产出——要判通信或算子 Bound 就别用 level0"
    - "`profile_export_type` 建议 `db`（text 与 db 不要求同时存在，但缺 db 时通信带宽/矩阵类结论不可得）"
    - "`profile_ranks` 默认 `[-1]` 全卡；只列部分卡时快慢卡类结论不能下（缺对照）"
    - "RL 两侧各自落盘、目录形态不同（训练侧自动解析出 db，推理侧常只有 text），比对前先确认两侧都解析完成"
  pitfalls:
    - "**采集窗口与真实 step 数不匹配是最高频失败**：窗口落在热身/编译段，或超出总 step 数，结果采到一半或全是噪声——先按 window_math 算一遍再启动"
    - "采集本身影响性能指标：**采集窗口内不要同时开 Dump**；单 step 采集通常已够回答瓶颈问题，不必全量"
    - "接入不得改业务逻辑，profiler 必须与被采流程同进程（主控/调度进程不执行 NPU 计算时采不到）"
    - "推理服务重启会丢现场：能用 HTTP 启停就别重启（`/start_profile` 的价值正是这个）"
