id: mssanitizer
type: tool
title: mssanitizer 算子级异常检测（memcheck / racecheck / initcheck / synccheck 四子工具，可包裹 TTK 执行）
summary: "MindStudio Sanitizer：算子级异常检测工具，四个子工具——**memcheck**（默认；非法读写、多核踩踏、非对齐访问、内存泄漏、非法释放、分配内存未使用）、**racecheck**（数据竞争 WAW/WAR/RAW）、**initcheck**（读取未初始化内存导致的脏数据）、**synccheck**（`SetFlag` 未配对、错误使用同步指令导致算子卡死）。随 CANN toolkit 自带安装，`--tool`/`-t` 指定子工具、可多次指定以同时开启（建议先 memcheck 确认无内存异常再跑其余三个）。**包裹 TTK 时必须关掉 TTK 自己的预热与 Profiling**（`--warmup=false --task-prof=false`）——否则 warmup kernel 会被插桩检测、Profiling 采集会与检测互相干扰；命令形如 `mssanitizer -t memcheck -- python3 -m ttk kernel -i cases.csv --warmup=false --task-prof=false`，**`--` 分隔是必需的**（TTK 自身参数如 `-i`、`--warmup` 会被 mssanitizer 误解析）。报告级别 **ERROR**（确定性错误：非法读写、内存泄漏、非对齐访问、内存未初始化、竞争异常）与 **WARNING**（不确定性风险：多核踩踏、内存分配未使用）。"

