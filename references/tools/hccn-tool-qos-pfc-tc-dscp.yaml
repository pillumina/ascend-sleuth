content:
  tool_name: hccn_tool 的队列流控面（PFC 优先级位图 / 优先级到 TC / DSCP 到 TC / TC 缓冲与水线）
  invocation: hccn_tool -i <dev_id> <-pfc|-prio_tc|-dscp_to_tc|-tc_cfg> -g（查询）或 -s（设置）。dev_id 取 npu-smi info 输出的 NPU ID；工具随昇腾 NPU 驱动发布，只在昇腾驱动接管的 RoCE 网口上可用，1823 网卡自身的驱动不含它。网口 link 状态为 down 时查询不支持。用于通信丢包、吞吐下降、PFC 是否真的生效这类问题：PFC 按优先级使能、缓冲按 TC 分配，两边粒度不同，必须三条命令对齐着看。
  output_meaning:
  - -pfc -g：给出 priority 0–7 与 enabled 0/1 两行，表示哪些优先级队列打开了 PFC；默认位图 0,0,0,0,1,0,0,0（仅优先级队列 4）
  - -prio_tc -g：给出 priority 0–7 与 TC 两行，表示每个优先级落到哪个 TC；默认 3,3,3,2,2,1,0,3，即优先级 0、1、2、7 进 TC3，3、4 进 TC2，5 进 TC1，6 进 TC0
  - -dscp_to_tc -g：逐行列出 DSCP 0–63 对应的 TC，加 dscp <N> 只查一条；默认 DSCP 0 对应 TC3、DSCP 33 对应 TC2、其余 DSCP 对应 TC0
  - -tc_cfg -g：给出 TC id 0–7 与 Buffer、Up waterline、Low waterline 三行，缓冲与水线按 TC 分配；实际只用前 4 个 TC，后 4 个缓冲为 0
  pitfalls:
  - PFC 按优先级使能、缓冲与水线按 TC 分配，两层粒度不同：只查 -pfc 会漏掉「使能的那个优先级映射到的 TC 缓冲为 0」这种配置没落地的情况，要再跑 -prio_tc 与 -tc_cfg 对一遍
  - TC 取值只有 0–3（-dscp_to_tc -s 的 tc 参数与 -tc_cfg 的前 4 个 TC），交换机侧是 8 个 TC（0–7）；两端能对齐的是优先级与 PFC 使能位，不是 TC 编号
  - -pfc -s 与 -prio_tc -s 会触发网口 link 闪断，跳为 down 后自动恢复；建议等 5 秒以上、link 回到 up 之后再做验证，并在业务低峰执行
  - -pfc -s 同时使能超过 4 位报 The number of pfc priority queues exceeds the maximum value(4).
  - -prio_tc -s 用到的 TC 数少于 TC 服务质量里按 ETS 配置的 TC 数时报 Get invalid parameters, please check tc_qos config.；反过来 prio_tc 没配好就配 TC 服务质量报 Get invalid parameters, please check prio_tc config.
  - 改完 prio_tc 会与 dscp_to_tc 冲突，表现为 LLDP 返回空、网络健康状态 Receive timeout、ping 失败；处置是把 dscp_to_tc 的 TC 调到不大于 prio_tc map 的最大值
  - -tc_cfg -s 的约束：所有 TC 缓冲总和不超过 1797120 B，单个非零缓冲不小于 6272 B，下水线 = 上水线 − 6144 B，配置值按 128 B 取整；后 4 个 TC 缓冲为 0 时水线也要配 0
  commands:
  - name: 查 PFC 使能位图
    cmd: hccn_tool -i <dev_id> -pfc -g
    when: 怀疑 PFC 没生效、或确认业务优先级是否真的开了流控
  - name: 查优先级到 TC 的映射
    cmd: hccn_tool -i <dev_id> -prio_tc -g
    when: 确认业务优先级落到哪个 TC，以及该 TC 有没有缓冲
  - name: 查 DSCP 到 TC 的映射
    cmd: hccn_tool -i <dev_id> -dscp_to_tc -g（单条用 -g dscp <N>）
    when: 报文标记的 DSCP 与实际落点对不上，或改过 prio_tc 之后查冲突
  - name: 查 TC 缓冲与 PFC 水线
    cmd: hccn_tool -i <dev_id> -tc_cfg -g
    when: 判断被反压的 TC 有没有分配缓冲、水线是否配反
  - name: 改 PFC 使能位图
    cmd: hccn_tool -i <dev_id> -pfc -s bitmap 0,0,0,0,1,0,0,0
    when: 需要把流控开在与交换机对齐的优先级上；最多同时使能 4 位，改完等 link 恢复
  - name: 改优先级到 TC 的映射
    cmd: hccn_tool -i <dev_id> -prio_tc -s map 3,3,3,2,2,1,0,3
    when: 优先级落点与交换机规划不一致；8 个值依次对应优先级 0–7，TC 取值 0–3，改完等 link 恢复
  - name: 改单条 DSCP 到 TC
    cmd: hccn_tool -i <dev_id> -dscp_to_tc -s dscp <N> tc <M>
    when: 报文标记的 DSCP 与 TC 的映射需要与交换机对齐
  - name: 改 TC 缓冲与水线
    cmd: hccn_tool -i <dev_id> -tc_cfg -s size 816512,81792,81792,816384,0,0,0,0 waterline 774528,45952,45952,780672,0,0,0,0
    when: 无损优先级所在 TC 的缓冲不足或水线配反；改前先 -g 记录原值与总量上限
  - name: 回退到文档默认
    cmd: hccn_tool -i <dev_id> -pfc -s bitmap 0,0,0,0,1,0,0,0；hccn_tool -i <dev_id> -prio_tc -s map 3,3,3,2,2,1,0,3
    when: 配置试错后恢复；单条 DSCP 用 -dscp_to_tc -s 改回原值，缓冲与水线照改前 -g 的记录重设
