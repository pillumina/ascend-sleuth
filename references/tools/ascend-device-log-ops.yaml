title: Device 日志排查操作（RAS 故障 ID / 资源占用 / 进程拉起与结束时间）
summary: "三组 Device 日志操作：①msnpureport -f 导出后 event_*.log 搜 event_id 取 RAS 故障码（npu-smi info -t health 兜底 8 次）；②SYSMONITOR 看 fd usage（阈值 90%）与僵尸进程（阈值 5）；③slog/dev-os-id/[debug|run]/device-id/ 下 grep ringbuffer 定进程拉起与结束时间"

