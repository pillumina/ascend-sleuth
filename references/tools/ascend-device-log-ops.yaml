id: ascend-device-log-ops
type: tool
title: Device 日志排查操作（RAS 故障 ID / 资源占用 / 进程拉起与结束时间）
summary: 三组常用 Device 日志操作：①msnpureport -f 导出后在 event_*.log 搜 event_id 查 RAS 故障码（npu-smi info -t health 兜底查最近 8 次故障）；②Device 日志 SYSMONITOR 看 fd usage（阈值 90%）与僵尸进程（阈值 5）；③导出后 device-os 日志 grep ringbuffer 确认进程拉起（create_ringbuffer）与结束（delete_ringbuffer）时间

