id: ascend-asys
type: tool
title: asys 故障信息收集与解析工具（仅 Ascend EP 形态；含收集面/约束/五类解析/四类检测的完整口径）
summary: asys 一键式收集故障信息并解析 plog 伴侣文件：collect/launch 收集（含业务复跑）、info 状态展示、health 健康检查、diagnose 压测检测（stress/hbm/cpu/aicore_stl/component）、analyze 解析（trace/coredump/stackcore/coretrace/ub/aicore_error）、profiling 性能采集、实时堆栈导出、config 电压配置获取恢复；仅支持 Ascend EP 形态，集群/容器/虚拟机/云场景不支持一键式收集。本词条同时给出**收集面与权限要求**（哪些信息需 root、三类信息各自依赖哪个环境变量）、**六条使用约束**、**五类文件解析各自的依赖工具与平台限制**（coretrace 仅 950 支持）与**检测结果判读口径**（详见 ascend-hardware-detect-triage）

