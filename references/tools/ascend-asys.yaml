id: ascend-asys
type: tool
title: asys 故障信息收集与解析工具（仅 Ascend EP 形态）
summary: asys 一键式收集故障信息并解析 plog 伴侣文件：collect/launch 收集（含业务复跑）、info 状态展示、health 健康检查、diagnose 压测检测（stress/hbm/cpu）、analyze 解析（trace/coredump/stackcore/coretrace/ub/aicore_error）、profiling 性能采集、实时堆栈导出；仅支持 Ascend EP 形态

