id: verl-uwc-weight-consistency
type: tool
title: UWC 训推权重一致性验证——RL 训练侧到 vLLM 推理侧权重同步链路三段比对
summary: UWC（Unified Weight Consistency）验证 RL 训推一体场景下「训练侧（verl+Megatron-core）→ 推理侧（vLLM）」权重同步链路的数值一致性，把链路拆成三段独立可比对：①Bridge 转换 HF↔mcore ②跨进程传输 ③vLLM 加载；容差为 P0 vs P2 atol=1e-3 / P2_sender vs P5 exact / G0 vs G1 cos>0.99；任一阶段 fail 即定位到该环节

