content:
  tool_name: "NPU 显存快照分析（memory snapshot → sqlite 分析，含 HTML 报告）"
  invocation: >-
    采集侧用 `torch_npu.npu.memory._dump_snapshot()`（或 `torch.cuda.memory._dump_snapshot()`）导出 pickle，
    **记录历史建议 `_record_memory_history(max_entries=100000)`**；分析侧先转库再按模式分析。
    本工具**只支持离线 pickle，不做实时采集**；大文件（>1GB）建议先用 `--no-indexes` 导入再手动建索引。
  commands:
    to_db: "`python3 scripts/snapshot_to_db.py <snapshot.pkl> [-o custom.db] [--no-indexes]`（pickle 支持 dict 与 list 两种形态）"
    overview: "`python3 scripts/snapshot_analyze.py <db> --mode overview`——先看总览（健康状态、碎片率、segment 数、设备概况）"
    fragment: "`--mode fragment`——碎片率与构成（空闲 = Σtotal_size − Σallocated_size；待释放 = Σ blocks.size where state='active_pending_free'）"
    leak: "`--mode leak`——单调增长与长生命周期块判定 + 按调用栈 TOP3 归因"
    oom: "`--mode oom`——回溯 OOM 前 50 条 trace，按三种模式分流（同栈重复 / 接力大分配 / 单次过大）"
    peak: "`--mode peak`——按时间重放 segment_alloc/segment_free 记录 (Reserved, Allocated, Active)，基线取前 10% 事件，峰值贡献者按 total_size 取 TOP5"
    compare: "`--mode compare --ref <另一份.db>`——两份快照对比：B 有 A 无的 address = 新增 segment；同 address 且 B.total_size 更大 = 扩容"
    all: "`--mode all -o report.html`——出交互式 HTML（五层结构：总览 → 设备详情 → 深度分析 → 堆栈归因 → 建议）"
  output_meaning:
    - "**块状态三类**：`active_allocated`（在用）、`active_pending_free`（已请求释放未完成）、`inactive`（空闲）——假性碎片判据就看 pending 这一类的占比"
    - "**段类型**：`large`（>1MB）与 `small`；segment 数量分级 `<100` 正常 / `100~200` 偏多 / `>200` 频繁"
    - "**trace action 枚举**：alloc / free_requested / free_completed / segment_alloc / segment_free / segment_map / segment_unmap / snapshot / oom——判断“谁在什么时候申请”用这张表"
    - "**健康状态合成规则**：存在 OOM 或碎片率 > 15% → 严重；碎片率 > 5% 或 segment 数 > 100 → 需关注；否则健康"
    - "**输出单位口径**：≥1GB 用 GB、≥1MB 用 MB、否则 KB；百分比一位小数；差异带正负号"
  pitfalls:
    - "**先看 pending 占比再谈碎片**：待释放占比 > 50% 时那是异步释放延迟造成的**假性碎片**，不要判成分配器碎片（会给出错误的调参方向）"
    - "**泄漏要两个条件同时成立**：单调增长**且**长生命周期块 ≥5 才算高风险；只有单调增长或只有 ≥3 个长寿块是中风险——单条不足以定性"
    - "**OOM 推断有样本下限**：分配事件不足 3 次时不给根因，写“数据不足”"
    - "**离线快照看到的是某一时刻的存量**：它回答“现在这块内存归谁、什么状态”，回答不了“它是怎么涨上来的”——增长过程要回到事件流侧（msMemScope 的曲线与 trend）"
    - "文档与实现有两处不一致（已知）：文档写“OOM 时 device_free > 1GB 判单次过大请求”但脚本无此判据；文档写“Phase 1 不解析 trace 时序”但 `--mode peak` 实际做时序重放——**以脚本行为为准**"
