id: asc-tools-ascendc-debug-suite
type: tool
title: Ascend C 算子调试工具集（cpu_debug 的 CPU 域编译 + npu_check 的 Error* 判据表 + msobjdump 的 ELF 字段 + show_kernel_debug_data + optype_collector）
summary: "asc-tools 这套工具解决算子级问题：**cpu_debug**——在 NPU 部署前先上 CPU 做功能与精度基本验证（bisheng 编译生成 CPU 域可执行程序，再用 gdb 常规调试；编译选项 `CMAKE_ASC_RUN_MODE=cpu` 与 `CMAKE_ASC_ARCHITECTURES=dav-2201`（A2/A3）/`dav-3510`（950）；**每个核函数起独立子进程模拟 NPU 执行，gdb 必须 `set follow-fork-mode child` 才能进核函数内部断点**；切回 NPU 只需清 build 重新 cmake，调试用 `#ifdef` 代码不必移除）。**npu_check**——孪生调试的检查半边，随 cpu_debug 在 CPU 域执行同步检查，产物 `*_npuchk.log` 落在可执行文件路径下 `npuchk/`；**只有 debug 阶段正常退出（无 ASSERT 校验失败）才输出完整校验日志**；判据是一套具名错误码：**ErrorRead1-4**（非法内存读取/可疑读无效数据/读越界/地址非 32 字节对齐）、**ErrorWrite1-4**（非法写/写越界/重复写未取走/地址非 32 字节对齐）、**ErrorSync1-4**（写缺 pipe barrier 或 set/wait、读同步问题、set/wait 不配对、eventID 重复）、**ErrorLeak**（申请未释放）、**ErrorFree**（重复释放）、**ErrorBuffer0-4**（未 InitBuffer 初始化、que 类型不一致、VECIN/VECOUT/VECCALC 操作不合规、操作内存不合法、TBufPool 未 InitBufPool）；另有 EnQue/DeQue 状态检查与 **GM 多核踩踏检查**（记录每核 GM 地址范围，重叠即报错，**Atomic add 场景对重叠地址不报错**）。**msobjdump**——解析/解压算子 ELF 并打印关键字段（`.ascend.meta.${id}` kernel 名、VERSION、**DEBUG 的 debugOptions 位值 0 关/1 DumpTensor·printf/2 assert/4 时间戳打点/8 内存越界检测**、DYNAMIC_PARAM、OPTIONAL_PARAM、KERNEL_TYPE、**CROSS_CORE_SYNC 硬同步（仅 A2/A3 生效）**、MIX_TASK_RATION、**DETERMINISTIC_INFO（0 非确定/1 确定）**、FUNCTION_ENTRY=TilingKey、BLOCK_NUM 暂不支持打印 0xFFFFFFFF）。**show_kernel_debug_data**——离线把 kernel 侧调试信息 bin 解析成可读格式（Dump 需 aclInit 配 `dump_kernel_data` = all/printf/tensor/assert/timestamp 与 `dump_path`，路径优先级 **ASCEND_DUMP_PATH > ASCEND_WORK_PATH > 配置文件的 dump_path**）。**optype_collector**——采集指定 SoC 的 OpType 并检测自定义算子包与内置包、自定义包之间的**重名冲突**。"

