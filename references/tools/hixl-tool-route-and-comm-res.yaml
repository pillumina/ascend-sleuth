id: hixl-tool-route-and-comm-res
type: tool
title: hixl_tool（A5/950 通信资源生成：host_route 导 EID 清单 + local_comm_res 生成 LocalCommRes JSON）
summary: "HIXL 附带的命令行工具，为分布式推理/AI 场景生成网络通信资源，**仅适用于 A5（Ascend 950）机型，不支持 A2/A3**。两个子命令：`host_route` 导出本机 Host/CPU 侧 EID（2 口 PG）与 NPU 侧 EID 到 `host_route.json`（默认 `/etc/`，权限 0600），**现已只作离线巡检/备案**；`local_comm_res` 为每个 NPU 生成 `LocalCommRes` JSON（`{prefix}_{device_id}_{phy_id}.json`），**其 route_data 由引擎内部经 DSMI + urma_admin + DCMI 自动采集，不再依赖传统 `route.conf`/procfs，也不再依赖 `host_route.json`**。产物可直接作为 HIXL API 的 `OPTION_LOCAL_COMM_RES` 选项值，或作为 Mooncake 的通信资源配置。编译：`bash build.sh --examples`（把 `ENABLE_HIXL_TOOL` 置 ON）；产物在**内部构建目录** `build/scripts/tools/hixl_tool/hixl_tool` 与 `build/src/hixl/libcann_hixl.so`，**不打进 `cann-hixl_*.run` 包**，运行前需把 `build/src/hixl` 加进 `LD_LIBRARY_PATH`（或装同版本 run 包）。环境前置：机型 A5、LCNE ≥ `UBM_2.0.0.B011`、HDK ≥ `25.1.RC1.B108`、CANN Toolkit ≥ 9.0.0，且 **hixl_tool 必须与 `libcann_hixl.so` 同版本**（同一次构建产物，勿混用）。"

