content:
  tool_name: "hixl_tool（host_route / local_comm_res）"
  invocation: "在 A5 机型上准备通信资源：先 `source ${ASCEND_HOME_PATH}/set_env.sh` 再 `bash build.sh --examples` 编出 `build/scripts/tools/hixl_tool/hixl_tool`，`export LD_LIBRARY_PATH=${PWD}/build/src/hixl:${LD_LIBRARY_PATH}` 后按子命令运行；`local_comm_res` 的产物作为 HIXL 的 `LocalCommRes` 选项值（或 Mooncake 的通信资源配置）供建链与传输使用，`host_route` 的产物仅作 EID 清单备案。"
  commands:
    build: "`bash build.sh --examples`（同时置 `ENABLE_HIXL_TOOL=ON` 触发 hixl_tool 编译）；手工配置 CMake 时用 `-D ENABLE_HIXL_TOOL=ON` 单独开启"
    run_env: "`export LD_LIBRARY_PATH=${PWD}/build/src/hixl:${LD_LIBRARY_PATH}`（否则运行时报找不到 `libcann_hixl.so`）"
    help: "**必须先写子命令再 `--help`**：`./hixl_tool host_route --help` / `./hixl_tool local_comm_res --help`"
    host_route: "`./hixl_tool host_route [--output <dir>]`（默认输出目录 `/etc/`），产出 `{output}/host_route.json`：`device_num` + `devices[].{device_id, local_eid, remote_eid}`（local_eid = Host/CPU 侧 EID（2 口 PG）、remote_eid = NPU 侧 EID）"
    local_comm_res: "`./hixl_tool local_comm_res [--topo_file_path <path>] [--device_id <id1,id2,…>] [--protocol_desc <desc>] [--output <dir>] [--file_name_prefix <prefix>]`，每设备产出 `{output}/{prefix}_{device_id}_{phy_id}.json`（默认前缀 `local_comm_res`、默认目录 `/etc/`）"
    protocol_desc: "`--protocol_desc` 取 `ub_ctp`（生成 device+host 两侧 ub_ctp 端点，走纯 URMA 流程）/ `ub_ctp:device` / `ub_ctp:host` / `uboe:device`（UBoE ScaleOut）/ `ub_rtp:device`（UB_RTP(UBG) ScaleOut），逗号分隔"
  output_meaning:
    - "`LocalCommRes` JSON 的结构可直接判读链路配置意图：`version`（当前 `1.3`）、`net_instance_id`、`server_id`（**仅当 `--protocol_desc` 含 `ub_ctp:host` 时生成，device-only 不输出**）、`endpoint_list[]` 每项含 `protocol`（`ub_ctp`/`uboe`/`ub_rtp`）、`comm_id`（EID 或 IP）、`placement`（`device`/`host`）、`plane`（`plane_pg_0`/`plane_pg_1`）、`net_instance_id`"
    - "`host_route.json` 的 `local_eid`/`remote_eid` 是排查 UB 侧连通性时的 EID 出处——UB ping 一类动作按 EID 而非 IP 寻址，EID 写错的表现是连连不上而不是报参数错误"
  pitfalls:
    - "**仅 A5（Ascend 950）**：A2/A3 上不要用本工具（先用 `npu-smi info` 确认设备名含 `Ascend950`）；工具还要求 LCNE 不低于 `UBM_2.0.0.B011`、HDK 不低于 `25.1.RC1.B108`"
    - "**版本必须同源**：`hixl_tool` 与 `libcann_hixl.so` 必须来自同一版本（用同一构建产物或与该 run 包版本一致的 HIXL 分支编译），混用不同版本是伪故障的常见来源"
    - "**产物不在 run 包里**：`hixl_tool` 只生成编译产物、不会被打入 `cann-hixl_*.run`，需要在构建目录直接用或自行拷贝分发；产物在内部构建目录 `build/` 而非安装目录 `build_out/`"
    - "**`./hixl_tool --help` 不可用**：`--help` 会被当成未知子命令——必须 `hixl_tool <subcommand> --help`"
    - "**别再按旧文档找 `route.conf`/procfs**：两个子命令的 route_data 均由引擎内部经 DSMI + urma_admin + DCMI 自动采集；`local_comm_res` 也不需要先跑 `host_route`"
    - "`uboe` 与 `ub_rtp` **互斥**、不能同时出现，且两者**仅支持 `device` placement**；不传 `--protocol_desc` 时等效于按 `InterconType` 自动选 ScaleOut + `ub_ctp:device`；`ub_ctp:device,ub_ctp:host` 与 `ub_ctp` 等价；**单独配 `ub_ctp:host` 时只保留 Host 侧端点**"
    - "容器场景需把拓扑目录映射进来（`/usr/local/Ascend/driver/topo/950/`），否则 `local_comm_res` 取不到拓扑；运行两个子命令都需要可访问 DAVINCI 设备"
