id: operator-debug-entrypoints
type: tool
title: 算子级调试与调优入口（plog 路径 / aclGetRecentErrMsg / AI Core printf·DumpTensor / AI CPU KERNEL_LOG / msprof op / cannsim record）
summary: "算子执行失败或精度异常时，按『先拿 Host 侧日志与框架错误信息 → 再往 Kernel 里加打印 → 复杂场景升级到单步调试』的顺序取信息。**① Host 侧**：plog 默认落在 `$HOME/ascend/log/debug/plog/plog-pid_*.log`；`ASCEND_SLOG_PRINT_TO_STDOUT=1` 可直接打屏（0 关闭）。**② aclnn 调用异常**：用 `aclGetRecentErrMsg()` 取最近一次异常文本（形如 `AclNN_Parameter_Error(EZ1001): Expected a proper Tensor but got null for argument addmmTennsor.self.`），**这是 aclnn 参数/校验类报错的直接文本来源**。**③ AI Core Kernel**：`AscendC::PRINTF` 打 Scalar（整数/字符/布尔），`DumpTensor` 打指定 Tensor 内容并支持附加行号一类自定义信息；算子卡死、GM/UB 访问越界等复杂场景应转 **msDebug 单步调试**，而不是继续加打印。**④ AI CPU Kernel**：用 `KERNEL_LOG_DEBUG/INFO/WARN/ERROR` 宏，**默认只打印 ERROR 级别**，要打非 ERROR 级别必须**先配 `ASCEND_GLOBAL_LOG_LEVEL`**；AI CPU 算子的 Host 侧日志获取方式与 AI Core 相同。**⑤ 性能侧按产品分流**：A2/A3 用 `msprof op ./可执行文件` 采上板流水（结果落 `OPPROF_*`，看 `ArithmeticUtilization` 判 cube/vector 占比从而定 Bound 场景），要看仿真流水图再加 `msprof op simulator --output=... --kernel-name=\"...\"`，**且需先 export `LD_LIBRARY_PATH=${INSTALL_DIR}/tools/simulator/Ascendxxxyy/lib`**；**950PR/950DT 不走 msprof op 仿真，改用 `cannsim record ./可执行文件 -s Ascend950 --gen-report`**，产物为 `cannsim_*/trace_core0.json`，用 Chrome `chrome://tracing` 打开。"

