id: op-compiler-static-kernel
type: tool
title: op_compiler 静态 Kernel 编译（dump 算子信息 → 编译 run 包 → 安装 → 匹配性校验 → 卸载）
summary: "用静态 Kernel 提升算子执行性能的工具链：**原理**——静态 Kernel 编译在编译时指定算子 shape、运行时不再指定 shape，算子编译工具按算子信息统计文件得到确定 shape 并为每个 shape 各编译一份算子二进制，从而提升执行效率（编译期已知 tensor 大小故存储利用率高、可针对实际 shape 优化、把标量计算前置到编译期以免 Scalar 操作打断并行指令、编译期知确切数据量故不额外插入同步）。**流程**：①dump 算子信息 json（PyTorch 走 Ascend PyTorch Profiler 的 `record_op_args=True`，产物默认在 `{worker_name}_{时间戳}_ascend_pt_op_args/{pid}`；acl 接口走 `aclopStartDumpArgs`/`aclopStopDumpArgs`）→ ②`op_compiler` 编译生成 `static_kernel_{datetime}_{pid}.run`（关键参数 `-p/--op_params_dir` 与 `-v/--soc_version` 必选、`-j/--job` 默认 16、`-l/--log` 默认 null、`-o/--output`）→ ③以运行用户安装 run 包（默认装到 `${install_path}/opp/static_kernel`，目录默认权限 770；多包同名算子以后装的为准）→ ④比较装前/装后的整网性能与单算子耗时验证。**适用范围**：纯静态 shape 或 shape 变化较少的动态 shape 网络；支持 Atlas 推理系列、Atlas 训练系列、A2、Ascend 950PR/950DT。**匹配性判据**：网络调整后若不再匹配，静态 Kernel 包对该算子无收益——用 `op_compiler --count -p <dir>` 统计 dump 出的 json 数目，调整后数目变大即说明有算子不再匹配。"

