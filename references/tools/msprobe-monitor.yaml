    verification: cross-checked-source

applies_to:
  platforms: [cross]
  categories: [precision, performance]

related_references: [msprobe-data-dump]

status: active
last_verified: 2026-09-09

content:
  tool_name: "msprobe monitor_v2（训练状态轻量化监测；同族另有 monitor v1）"
  invocation: "在训练过程中采集关键中间量并以 CSV 落盘，用于训练稳定性评估与异常定位：①配置要采集的监测项（module / weight_grad / optimizer / param / cc）；②训练代码里初始化并按 step 调用一次 `mon.step()`；③在 output_dir 下看 CSV。推荐策略：长期启用 weight_grad 作底座，问题发生时再按需开 module / cc 并用目标筛选压开销"
  commands:
    setup: "在训练脚本中初始化 TrainerMonitorV2（配置 monitors 与 output_dir），每个训练 step 调用一次 mon.step()"
    scenarios: "loss 上扬/尖刺 → 看 module（前向输入输出与反向梯度分布）；grad norm 异常 → 看 weight_grad（unreduced 梯度累积期 / reduced 梯度聚合前）；收敛变差或震荡 → 看 optimizer（exp_avg / exp_avg_sq）；分布式同步或通信异常 → 看 cc"
  output_meaning:
    - "输出目录：`<output_dir>/rank_<rank_id>/{module,weight_grad,optimizer,param,cc}_step{X}-{Y}.csv`；**只有 monitors 中启用的模块才生成对应 CSV**；当前仅支持 format=csv"
    - "统一表头：`vpp_stage | step | module_name | scope | micro_step(可选) | min | max | mean | norm | nans`（统计指标按 ops 展开为列，只写用户启用的指标）"
    - "module.csv：scope = forward / backward；module_name 形如 `<module_name>.<io_kind>.<idx>`，io_kind ∈ input/output/grad_input/grad_output。解读：优先看同一模块在 forward 与 backward 是否**同时**异常，以区分「前向激活异常传导」还是「梯度链路异常」"
    - "weight_grad.csv：scope = unreduced / reduced；module_name 为参数名。解读：unreduced 正常而 reduced 异常 → 偏向梯度在 step 前形态被改变/修改；unreduced 已异常 → 偏向反向链路内产生异常"
    - "optimizer.csv：scope = exp_avg / exp_avg_sq。解读：训练震荡/不收敛时对比异常前后的动量变化，判断是否优化器状态突变"
    - "param.csv：scope = param_origin / param_updated。解读：对比 step 前后参数分布变化，定位更新异常或数值突变"
    - "cc.csv：scope = comm；module_name 为通信 tag（含通信算子/序号/代码位置）。解读：先用 cc_log_only=true 拿通信日志，再用 cc_codeline 过滤无关通信，最后开统计采集定位异常通信的输入输出分布"
    - "vpp_stage 从 name 前缀 `<idx><NAME_SEP>` 推导，无前缀默认 0；micro_step 仅在启用微步能力时出现（如 weight_grad.monitor_mbs_grad=true），未开启时记录梯度累积总微步数"
  pitfalls:
    - "本文档覆盖 **monitor_v2**（轻量化监测）。同族还有 monitor v1（`user_guide/monitor_instruct.md`），配置项与 CSV 字段不同——拿 v1 的配置套 v2 会不生效，按版本查原文"
    - "只有 monitors 里启用的模块才出 CSV——目录里缺某个 CSV 不是采集失败，是没开"
    - "CSV 里的 step 与 micro_step 是两个层级：分析异常时要先确认看的是哪个粒度，别把 micro_step 当训练 step"
    - "cc 的开销最大（通信统计），排查完应及时关闭；官方推荐顺序是先 cc_log_only 再 cc_codeline 再统计，一步到位会淹没在无关通信里"
