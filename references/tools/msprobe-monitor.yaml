id: msprobe-monitor
type: tool
title: msprobe monitor——训练状态监测（v1 全功能 / v2 轻量 CSV）
summary: msprobe monitor：训练中采集权重/权重梯度/激活值/优化器状态/通信算子统计——v1（TrainerMon，README 主指向、能力最全：异常告警/堆栈/l2 特征/mbs 粒度/csv2tensorboard）与 v2（TrainerMonitorV2，轻量 CSV 子集，按 rank 落 rank_<id>/<module>_step{X}-{Y}.csv）；v1 表头 vpp_stage|name|step|micro_step|*ops，输出走 MONITOR_OUTPUT_DIR

