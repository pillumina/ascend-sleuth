id: msprobe-monitor
type: tool
title: msprobe monitor / monitor_v2——训练状态监测（CSV 字段与解读口径）
summary: msprobe monitor_v2：训练过程中按需采集模块输入输出/权重梯度/优化器动量/参数分布/通信算子统计，按 rank 落 CSV（rank_<id>/<module>_step{X}-{Y}.csv）；统一表头 vpp_stage|step|module_name|scope|指标列，各监测项有固定 scope 语义与解读方向

sources:
  - type: official-doc
    url: "https://gitcode.com/Ascend/msprobe/blob/tag_MindStudio_26.2.0.B050_003/docs/zh/user_guide/monitor_v2_instruct.md"
    version: "MindStudio 26.2.0.B050_003（msprobe docs/zh/user_guide/monitor_v2）"
