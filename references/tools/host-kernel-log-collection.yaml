id: host-kernel-log-collection
type: tool
title: Host 内核日志采集与判读（dmesg / journalctl -k / /var/log/messages）
summary: Host 侧内核日志三条入口（dmesg -T 与时间窗、journalctl -k 与 -b -1、/var/log/messages）+ 判读面（OOM killer 的 Out of memory / Memory cgroup out of memory 消息格式、重启与链路事件入口）+ 四个坑（环形缓冲被覆盖、SUSPEND 后 -T 时间不准、dmesg_restrict 权限、journal 覆盖范围）

