id: msprof-collect-parse
type: tool
title: msprof 性能数据采集与解析（--application / --output，PROF_* 输出结构）
summary: msprof 采集性能数据：`msprof --application="python3 train.py" --output=<dir>` 拉起业务并自动采集+解析导出，产物为 PROF_<时间戳>/（含 host/、device_<id>/ 原始数据、msprof_<ts>.db、mindstudio_profiler_output 汇总）；另提供解析/导出/查询数据文件信息/通信性能解析等子能力；与 msprobe 分工——msprobe 采精度数据、msprof 采性能数据

