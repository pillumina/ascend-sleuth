id: msprof-collect-parse
type: tool
title: msprof 性能数据采集与解析（命令行两种传参方式 / --type / --storage-limit / 动态与延迟采集 / PROF_* 输出结构）
summary: msprof 采集性能数据：**方式一（推荐）** `msprof python3 train.py --output=<dir>` 在命令末尾直接跟用户程序，**方式二** `msprof --application="python3 train.py"`（参数含需加引号的符号时建议写进 Shell 脚本再传）；采集后自动解析导出到 PROF_<时间戳>/（含 host/、device_<id>/ 原始数据、msprof_<ts>.db、mindstudio_profiler_output 汇总）。另有 `--type=text|db` 选解析产物格式、`--environment` 传自定义环境变量、`--storage-limit` 防落盘占满、延迟采集（--delay/--duration）与动态采集（--dynamic + start/stop/quit 交互，launch 与 attach 两种方式），以及解析/导出/查询数据文件信息/通信性能解析等子能力；与 msprobe 分工——msprobe 采精度数据、msprof 采性能数据。采集方式选择与前置约束见 ascend-profiling-collection-planning，配置项语义见 msprof-configuration-options

