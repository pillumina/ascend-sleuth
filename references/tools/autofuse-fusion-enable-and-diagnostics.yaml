id: autofuse-fusion-enable-and-diagnostics
type: tool
title: AutoFuse 自动融合的使能与未融合原因判读（torch.compile 的 ascendc 后端 + autofused_ 产物 + Fallback 原因 + DFX 融合图）
summary: "AutoFuse 是面向 Ascend C 的自动融合框架（把相邻算子合成一个、消掉中间的输入输出搬运，缓解 Vector 链路的 Memory Bound），在 PyTorch 侧通过 `torch.compile(model, dynamic=False, fullgraph=True, options={\"npu_backend\": \"ascendc\"})` 使能——**不需要单独导入 `inductor_npu_ext`**。判读融合有没有发生、为什么没发生靠三样：**① `TORCH_COMPILE_DEBUG=1` 后在当前目录 `torch_compile_debug/` 下，以 `autofused_` 为前缀的目录 = AscendC 后端生成的融合算子白盒产物（一个目录对应一个融合算子，可看融合范围与 codegen 结果），其余目录是 Inductor 原生产物——如果**没有** `autofused_` 目录，说明本次编译**没有产生任何融合算子**；② 终端里的 `Fallback aten.xxxx $reason: xx原因` 直接给出未融合的原因；③ `AUTOFUSE_DFX_FLAGS=\"--codegen_compile_debug=true;--debug_dir=/path/\"` 在指定路径落盘每个融合算子的**内部融合图 pbtxt**（可用 netron.app 打开），其中 `codegen_compile_debug=true` 还会输出每个 LLVM pass 的耗时（`-ftime-report=per-pass`）并生成编译器时间线 JSON（默认 `~/.cache/autofuse_compile_trace`，终端打印 `[CompileTrace] <路径>`）。**收益度量**：融合提升比 = (融合前所有算子耗时 − 融合后所有算子耗时) / 融合前所有算子耗时；可再对比融合算子相对单算子的 `aiv_mte2_time`（输入搬运）与 `aiv_mte3_time`（输出搬运）。"

