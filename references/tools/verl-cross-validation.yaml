id: verl-cross-validation
type: tool
title: verl 训推交叉打桩——Rollout Skip + 交叉验证（精度定界在训练还是推理）
summary: verl 交叉验证：用打桩替换一个阶段的输出实现精度定界——两种模式 ckpt（推理执行并保存 rollout 数据 / 训练执行并加载 ckpt）与 rollout（推理加载 rollout 数据跳过推理 / 训练执行并保存 ckpt），两个训练过程通过共享数据目录交换数据；另有 Rollout Skip 基础功能（跳过推理直接加载已保存的推理数据）

