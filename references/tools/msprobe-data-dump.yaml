id: msprobe-data-dump
type: tool
title: msprobe dump 精度数据采集（config.json 配置 + PrecisionDebugger 接口）
summary: msprobe dump：PyTorch 精度数据采集——config.json 配 task/dump_path/rank/step/level/scope/list/summary_mode，代码里用 PrecisionDebugger(config_path).start/stop/step 采集；输出 dump_path/step{N}/rank{N}/dump_tensor_data/*.pt + dump.json；L0 模块级 / L1 API 级 / L2 kernel 级 / mix 两级 / debug 单点

