content:
  tool_name: "profiling DB（msprof / torch_npu profiler 汇出的 sqlite 性能数据文件）"
  invocation: >-
    `msprof <app> --type=db` 或 `export_type=['db']` 采集后得到 `msprof_<时间戳>.db`；torch_npu profiler 侧产物形如
    `ascend_pytorch_profiler_<rank>.db`。查法：`sqlite3 <db> "SELECT ... "`，或 python `sqlite3.connect("file:<db>?mode=ro", uri=True)`。
    字段语义去官方《DB 格式性能数据文件参考》对（表名与字段名以那份为准，本词条只给用途索引与读法陷阱）。
  commands:
    unit_semantics: "时间=纳秒（且为本地 Unix 时间，不是相对起点）；内存=字节；带宽=字节每秒；频率=MHz。报告里换算单位要显式标注"
    join_string_ids: "名字列是整数外键，必须 JOIN 反查：`SELECT t.*, s.value FROM TASK t JOIN STRING_IDS s ON t.name = s.id`（`STRING_IDS` 为 `value`/`id` 两列）"
    open_ro: "python: `sqlite3.connect('file:<db>?mode=ro', uri=True)`——**不要加 `immutable=1`**，它跳过 WAL 恢复会导致缺表"
    list_tables: "`sqlite3 <db> '.tables'`；或 skill 侧 `get_schema.py --db_path <db> --list_db_tables`（与官方文档表名做交集/差集，用于判版本差异）"
    step_time: "`SESSION_TIME_INFO`（or `analysis.db/StepTraceTime` / `step_trace_time.csv`）取 step 级 Free / Preparation 时间——判 Host Bound 的入口"
    comm_breakdown: "`ClusterCommunicationTime`（op/group/rank/step/elapsed/wait/transit/start ts）算等待占比；域标签要 JOIN `CommunicationGroupMapping`（`pg_name`/`group_id`/`type`/`rank_set`），**不要把 group_name 当最终域标签**"
    comm_bandwidth: "`ClusterCommunicationBandwidth`（link/band type、transit size/time、bandwidth、大包比例）与 `ClusterCommunicationMatrix`（src/dst rank 对、transport/link type、bandwidth）——判慢链路"
    op_hotspot: "`COMPUTE_TASK_INFO`（算子级 task，名字 JOIN `STRING_IDS`）+ `TASK`/`CANN_API`/`PYTORCH_API`（下发面，看 `depth` 列：depth=1 可用，depth=0 多为 `ProfilerStep#` 包装、过粗）"
    api_type_filter: "`PYTORCH_API.type` 按 `ENUM_API_TYPE` 过滤：50001=op、50002=queue、50003=trace、50004=mstx——统计 API 耗时**要排除 queue**"
    aicore_freq: "`AICORE_FREQ`：正常 1800MHz、空闲 800MHz、其余为异常"
    overlap_mem_copy: "`OVERLAP_ANALYSIS` / `MEMCPY_INFO` / `HCCS` / `PCIE` / `NIC` / `ROCE`——通信与拷贝是否与计算重叠、走哪条链路"
    mstx_scopes: "`MSTX_EVENTS`（JOIN `STRING_IDS` ON message）：框架自己打的阶段范围（MSTX 默认不开采集，`msprof_tx=False` 时这张表为空）"
  output_meaning:
    - "`STRING_IDS` 是名词典：拿不到真名先查这张表，再判“是不是没采到”"
    - "`ENUM_API_TYPE`：acl=20000、model=15000、node=10000、communication=5500、runtime=5000、op=50001、queue=50002、trace=50003、mstx=50004"
    - "同一份 db 里 time 列是纳秒量级整数（本地 Unix 时间），做差即为耗时；不要与“相对 step 起点的微秒”混用"
  pitfalls:
    - "**level0 的默认值不是零**：`profiler_level` 为 level0 时 small task 的 `transit_size`/`link_type`/`transport_type`/`src_rank`/`dst_rank` 可能是库内默认值——判 unknown，不要据此下“没有通信/带宽为 0”的结论；缺通信带宽与矩阵时先要求按 level1 重采"
    - "**不要重算库算好的派生列**：`transit_size`/`bandwidth`/`transit_time`/`wait_time` 直接取，别自己按别列推（通信侧尤其）"
    - "主查询不带聚合也不带 `LIMIT` 会把整张表刷进上下文——先聚合再下钻"
    - "`PRAGMA table_info` 给的字段面与“本次采集实际开了什么”不是一回事，不能当 schema 权威"
    - "表在文档里有、库里没有 = 本次采集没开该能力（或版本差异），不是数据缺失；反过来库里多出的表说明用的是更新版本"
