id: ascend-log-levels
type: tool
title: 设置日志级别（应用类环境变量 / 系统类 msnpureport 或 slog.conf）
summary: 日志级别序 0 DEBUG < 1 INFO < 2 WARNING < 3 ERROR < 4 NULL 不输出；调试日志默认 ERROR 可调、安全日志默认 DEBUG 不可调、运行日志默认 INFO 不可调；应用类用 ASCEND_GLOBAL_LOG_LEVEL 等环境变量，系统类 EP 用 msnpureport、RC 改 slog.conf 后重启 slogd

