id: src-code-discovery
type: tool
title: 源码位置发现（src_fetch.py --find \<签名\>：枚举组织仓 → 给候选 → 唯一候选自动取，歧义交回工程师）
summary: "报错指向框架/算子/运行时层、而工作区里没有对应源码仓时，用 `python3 scripts/src_fetch.py --find \"<报错签名>\" --ref <版本>` 定位并取源码：脚本枚举组织仓库清单（CANN 走 `cann` 组织，匿名 API）、按签名里的接口前缀与算子名给**带理由的候选表**（默认前 3 个），再逐个试该 ref——**只有一个候选能解析出该版本就自动取回**，多个候选则停下来把候选表与各自解析结果交给工程师选。退出码即结论：`0` = 已取回该版本（stdout 末行 = 绝对路径）、`3` = 候选 ≥2 或一个都解析不到（**要问工程师选哪个，别猜**）、`4` = 拉取失败。辅助入口：`--offline`（不联网，只按签名关键词表给候选）、`--self-test`（校验候选匹配表）、`--list-versions`（本地缓存有哪些仓与版本，命中即复用不重拉）。**候选匹配表是数据不是记忆**：签名关键词、判别词、兜底标记、仓描述都在 `scripts/src_fetch.py` 的 `ORG_SIGNATURE_REPOS`/`ORG_SIGNATURE_KEYWORDS`，改了跑 `--self-test`。"

sources:
  - type: official-doc
    url: "scripts/src_fetch.py（本仓自有工具；退出码契约写在模块 docstring，匹配表在 ORG_SIGNATURE_REPOS / ORG_SIGNATURE_KEYWORDS）"
    version: "候选匹配与退出码契约：`--find` 分支 + `candidate_repos()` + `self_test()`；组织清单复用 `scripts/gc_docs.py` 的 `/orgs/<org>/repos` 分页；本词条逐字核对这两处源码"
    fetched_at: 2026-09-22
    verification: cross-checked-source

applies_to:
  platforms: [cross]
  frameworks: [aclnn, ascendc, ascendcl, hccl, ge, torch_npu, vllm-ascend]
  categories: [interrupt, precision, performance]

related_references: [cann-source-location, operator-debug-entrypoints, ascend-log-locations, runtime-async-error-triage]

status: active
last_verified: 2026-09-22

content:
  tool_name: "src_fetch.py --find（源码位置发现：签名 → 候选仓 → 按版本取）"
  invocation: >-
    深度排查需要读框架/算子/运行时源码、而工作区里没有该仓时运行；也用于「报错只给了签名、
    不知道在哪个仓」的场景。取源码的普通形态（已知仓名）是 `python3 scripts/src_fetch.py
    <org/repo> --ref <tag|commit>`——`--find` 只是把「哪个 org/repo」这一步从人的记忆变成可复现的一步。
  commands:
    find: "python3 scripts/src_fetch.py --find \"<报错签名>\" --ref <版本>（枚举 cann 组织仓 → 候选表 → 逐个试该 ref；唯一能解析的候选自动取回，多个则交回候选表。签名必填）"
    find_offline: "python3 scripts/src_fetch.py --find \"<签名>\" --ref <版本> --offline（不联网：候选只来自签名关键词表、不克隆，只有本地已核对通过的同版本才复用；用于断网现场与 CI）"
    find_org: "python3 scripts/src_fetch.py --find \"<签名>\" --ref <版本> --org <组织>（换组织；默认 cann）"
    fetch_known: "python3 scripts/src_fetch.py cann/ops-nn --ref v9.1.1（已知仓时直接用；已知表见 `--list`，缓存见 `--list-versions`）"
    self_test: "python3 scripts/src_fetch.py --self-test（校验签名→候选仓匹配表：关键词大小写、仓名存在性、真实签名命中）"
    list_versions: "python3 scripts/src_fetch.py --list-versions [repo]（本地缓存有哪些仓与版本：命中即复用、不重拉）"
  output_meaning:
    exit_0: "该版本已在本地产出并通过核对；stdout 末行 = 版本目录绝对路径（唯一候选自动取回时也走这里）"
    exit_3: "没拿到：候选 ≥2（同名 tag 不足以定位，附候选表与每个候选的解析结果）或 ref 解析不了（附可用 tag 提示）——**这一步要问工程师选哪个仓，不许猜**"
    exit_4: "拉取失败：候选源都不可达/克隆失败/拉到的提交与 ref 不符（网络、私网、凭据）"
    exit_5: "本地有该版本目录但核对不通过（内容不是该 ref / 被外部改动）——确认后加 --force 重拉"
    candidates: "候选表每行是 `n) <org>/<repo> —— <该仓是干什么的>`；判据提示写在表尾（接口前缀/命名空间比算子名硬）。**兜底候选**（只命中 aclnn 这类公共前缀、没有算子名判别词）不算『唯一候选』——脚本会 exit 3 并要求补算子名/接口名或问工程师"
  pitfalls:
    - "**不要向工程师要 URL**：把「源码在哪个仓」当问题问人，是把可枚举的事实变成别人的记忆负担。先枚举组织仓给候选；只有候选都试不通、或仓是私有的，才问人——问也要带候选表，让他选一个数字而不是写一个地址。"
    - "**非零退出 = 没拿到这个版本的源码**：不要拿本地其他版本的目录去读（那是错版本的证据），也不要用 web 搜索结果代替源码（搜上游 issue/PR 状态是另一回事）。"
    - "**同名 tag 不是定位证据**：CANN 各仓共用 CANN 发布号，`v9.1.1` 在多仓同时存在；定位靠报错栈里的命名空间/接口前缀。候选 ≥2 时脚本故意不自动取——自动取错仓会产出错版本的证据，比不取更糟。"
    - "镜像内代码 / fork / 定制构建不能按 tag 推断：必须按冻结 commit 取（`--ref <commit>`）。"
    - "候选匹配表里关键词含大写会**静默零候选**（表现为「上游没有这个仓」）；改表后跑 `--self-test`。"
    - "**显式给的仓名优先于候选表**：`--find \"<签名>\" <org/repo>` 会以给定的仓为准（候选表只作对照），不再套 `--org`；裸仓名才按 `--org` 组织下试、再回退 GitHub 同名仓。" 
  evidence: "退出码与末行契约见 `scripts/src_fetch.py` 模块 docstring；候选匹配与自测见 `candidate_repos()` / `self_test()`（2026-09-22 实测：`--self-test` 12 条真实签名通过；`--find \"HcclAllReduce failed\" --ref v9.1.1` 唯一候选 hccl 并取回（exit 0）；`--find \"aclnnBatchMatMul failed\" --ref v9.1.1` 给出 ops-math 与兜底 ops-nn，脚本 exit 3 并交回候选表——正是「不能替人选」的实测形态；`--find \"aclnn error\"` 只命中 ops-nn 这一个**兜底**候选，脚本仍 exit 3 要求补算子名，不自动取）。"
