id: msprobe-compile-precision-checker
type: tool
title: msprobe PrecisionChecker——eager 与 compile 逐模块精度比对（single-pass / two-pass）
summary: msprobe PrecisionChecker：给启用 torch.compile 后出现的 loss 抖动/收敛变差/输出不一致定位差异来源——wrap 标记模块后分别以 eager 与 compile 执行，逐模块比对前向输出与输入梯度；训练场景用 single-pass（install+collect），推理/eval 用 two-pass（compare）；判定看逐模块 FORWARD OUTPUT/BACKWARD，loss_eager 为 NaN 属预期

