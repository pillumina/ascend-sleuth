id: msprobe-data-load
type: tool
title: msprobe load 精度数据覆盖加载（隔离前序累计误差）
summary: msprobe load：用已采集的模块级（L0）输入 tensor 覆盖目标模块的实际输入，隔离前序模块累计误差、精准定位本模块及下游问题；config.json 顶层 load 段配 path/modules/step/rank/dump_after_load；要求源 dump 与目标模型模块结构、命名严格一致

