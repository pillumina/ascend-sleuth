id: msprof-timeline-lane-reading
type: tool
title: msprof 硬件流水时间线泳道读法（泳道名格式 / 指令名 / 时间轴三段式）
summary: "读 MindStudio 硬件流水时间线（Profiling 导出）的方法：每个 pipe 一条泳道，泳道名格式为 `0X.<PIPE>.<NN> [<kernel名>_<shape>_<子块>] <core号>`，同一 pipe 会按子块/核拆成多条泳道；泳道上的指令块可直接读出指令名（`MOV_OUT_TO_L1`、`MOV_SRC`、`MMAD`、`FIX_LOC_TO_DST` 等）；时间轴为 `时:分:秒.毫秒 微秒 纳秒` 三段式。判『计算闲置』只需看 `06.CUBE` 泳道是否空白而其相邻 MTE1/MTE2 段仍在活动"

