id: torchtitan-npu-training-metrics-and-debugging
type: tool
title: torchtitan-npu 训练可观测面（Memory Snapshot 抓 OOM/泄漏 + NPU 适配 Profiling 的周期/绝对步数采集与离线解析）
summary: "torchtitan-npu 的两条观测路径，都通过**分层 CLI 参数**（默认全关）启用。**① Memory Snapshot**（查 OOM 与内存泄漏）：`--profiler.enable-memory-snapshot` 定时采集（`--profiler.profile-freq` 默认 10 步一次，`--profiler.save-memory-snapshot-folder` 默认 `profiling/memory_snapshot`），产物是 `.pickle`，用 PyTorch 官方 **memory_viz** 打开；**发生 OOM 时会自动转储当前快照**（不必等下一个采集周期）。**② Profiling**（查性能瓶颈）：基于 `torch_npu.profiler`，采集 CPU/NPU 活动、内存、调用栈、张量形状并给出 AI 算力利用率。原生参数 `--profiler.enable-profiling`、`--profiler.save-traces-folder`（默认 `profiling/traces`）、`--profiler.profile-freq`（10）、`--profiler.profiler-warmup`（3）、`--profiler.profiler-active`（1）、`--profiler.profiler-repeat`、`--profiler.profiler-skip-first`；NPU 专属参数放在 `profiler.extension.*`：`--profiler.extension.profile-ranks`（默认 `[-1]` 表示所有 rank）、`--profiler.extension.profiler-start/end`（绝对步数窗口，含 start、不含 end，两者须同时设）、`--profiler.extension.profile-with-memory`、`--profiler.extension.profile-with-stack`、`--profiler.extension.enable-online-parse`（默认 true）。**离线解析**用 `scripts/parse_profiling_data.py <单个 *_ascend_pt 或其父目录>`，产出 `kernel_details.csv`、`api_statistic.csv`、`ascend_pytorch_profiler_0.db`（MindStudio Insight / Chrome Tracing 可开）、`trace_view.json`。"

