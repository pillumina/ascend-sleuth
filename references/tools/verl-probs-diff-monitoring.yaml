title: verl 逐 token prob diff 监控——rollout 与 actor 前向的概率差
summary: verl 逐 token prob diff 监控：逐 token 计算 rollout（vLLM）与 actor 前向（训练引擎）对同一 response 的对数概率差，输出到训练日志并落 npy；前提必须设 actor_rollout_ref.rollout.calculate_log_probs=True；偏差来源三类——权重同步滞后 / 算子精度差异 / 推理与训练模式差异

