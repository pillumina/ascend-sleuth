id: msdebug-operator-source-debug
type: tool
title: msdebug 算子源码级调试（lldb 定制 + stub 劫持在 AiCore 上打断点；需 root 开 /proc/debug_switch 与 DWARF）
summary: "MindStudio 的算子**源码级调试工具**（底层基于 lldb 定制）：通过注入 `libruntime_stub.so` 劫持库拦截运行时 `libruntime.so` 里的 kernel 启动调用，从而在 **AiCore 上**（不是宿主机 CPU 上）对核函数源码设置断点，做源码级断点/单步/变量查看，定位算子的行为错误与数据异常。**两个硬前提**：①待调试 kernel 的产物（`.o`/fatbin）必须带 DWARF（`.debug_info`/`.debug_line`）——用 TTK 时需让 kernel **自编译并带调试信息**（msdebug 下 TTK 会自动以 `-O0 -g` 自编译，但必须传 `-b=false`，若传 `-b=release` 会复用内置包、无 DWARF、无法源码断点）；②**需要 root 权限开启 `/proc/debug_switch`**（默认关闭），特权不足的共享开发机/普通容器可能开不了，需系统管理员处理；**容器/云环境 `/proc` 常被隔离，容器内看到 1 可能是虚假状态**，需在宿主机真实开启——开关置不上 1 则断点功能不可用。用法：`msdebug -- <cmd>` 进入 `(msdebug)` 交互提示符（对应 lldb 的 `(lldb)`），再 `run` 真正拉起被调试命令；自动化场景用 `msdebug-mi -- <cmd>`（输出结构化 MI 协议）。"

