content:
  tool_name: "msdebug（MindStudio 算子源码级调试工具；基于 lldb 定制，工具的 Ascend 版本为 26.0.0 / lldb 19.1.7）"
  invocation: "以**包裹**被调试命令的形式启动：`msdebug -- <被调试命令>`（进入 `(msdebug)` 交互提示符，再输入 `run` 或 `process launch` 真正启动）；脚本/工具自动化驱动改用 `msdebug-mi -- <被调试命令>`（输出结构化 MI 协议）。工具本体是 bash 包装脚本（设置 `LD_LIBRARY_PATH`、`TERMINFO` 后再调用 `msdebug.bin`），因此直接执行 `msdebug` 即可，无需手动设置工具自身库路径。环境要求：Python 3.8+、完成 CANN 包安装（含 firmware/driver 适配）、并安装 MindStudio 算子工具。"
  commands:
    enable_kernel_debug: "以 root 身份把 `/proc/debug_switch` 置为 1（默认关闭）——置不上则 msDebug 断点功能不可用；容器/云环境需在宿主机真实开启"
    interactive: "msdebug -- python3 -m ttk kernel -i cases.csv -d=true -c=false -b=false -t=<用例名>（进入 (msdebug) 提示符后输入 run 启动）"
    machine_interface: "msdebug-mi -- <被调试命令>（结构化 MI 协议输出，供脚本/工具驱动）"
    set_breakpoint: "b <文件>:<行号>（`breakpoint set` 的简写）——须等 kernel 真正拉起后再设"
    stub_log: "export DEBUGGER_RT_STUB_LOG=1（打印完整 stub 日志，用于确认劫持是否生效）"
  output_meaning:
    - "进入 `(msdebug)` 交互提示符等价于 lldb 的 `(lldb)`；`run` 之后 TTK 会先起主进程、再派 profiling 子进程编译并拉起 kernel，**等待约 60~100 秒**（含 `-O0 -g` 编译时间）才会到可打断点的时点"
    - "断点命中标志：`stop reason = breakpoint`，且 `frame #0` 显示的是源码行"
    - "`breakpoint 1: no locations (pending on future shared library load)` 表示断点设得太早、kernel 尚未拉起——属正常现象，待 kernel launch 后再重新 `b`，或用 `process interrupt` 强制停下再设"
  pitfalls:
    - "**`-b=false` 必须**：TTK 的 `-b=release` 会复用内置包（无 DWARF），无法做源码级断点；配合 msdebug 时用 `-d=true`（动态 kernel 编译 + 执行，自编译才能带调试信息）、`-c=false`（关闭 const 场景减少干扰）、`-t=<用例名>`（只跑指定用例）"
    - "调试信息不需要手工注入：msdebug 下 TTK 会自动以 `-O0 -g` 自编译 kernel 使其带 DWARF"
    - "看不到 stub 劫持日志说明劫持未生效，应先排查环境与补丁；需要完整日志时 `export DEBUGGER_RT_STUB_LOG=1`"
    - "**root 与 `/proc` 的陷阱**：`/proc/debug_switch` 默认关闭且需 root 开启，容器/云环境 `/proc` 常被隔离——**容器内读到 1 可能是虚假状态**，真实能力要在宿主机确认"
