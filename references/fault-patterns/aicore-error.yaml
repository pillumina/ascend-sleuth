id: aicore-error-fault-patterns
type: fault-pattern
title: AI Core Error 典型问题案例（12 条）
summary: AI Core Error 典型案例：HBM 比特 ECC / icache 校验 / AI Core 硬件故障 / 索引越界 / 系统环境硬件 / 单算子运行报错 / atomic 溢出 / 地址异常 / args 不一致 / Dump 失败 / args 错误 / AI Core 超时

sources:
  - type: official-doc
