id: hccl-comm-init-and-link-faults
type: fault-pattern
title: HCCL 通信域初始化与参数面建链阶段故障（16 条，EI0001/EI0004/EI0005/EI0006/EI0014/EI0015/EI0016/EI0019）
summary: "HCCL 前两个阶段的故障对照表。通信域初始化：环境变量取值非法或 Host 网卡不存在（EI0001）、rank table 路径/字段/device_ip 校验失败（EI0004/EI0014）、superDeviceId 重复（EI0014，A3 逻辑超节点误配）、TLS 配置不一致（EI0016）、server 端口绑定失败（EI0019 socket type=2）、topo 探测超时（EI0015，未连接 rank 判定）；参数面建链：端口绑定失败（EI0019 socket type=0/1，默认 16666）、参数一致性校验失败（EI0005）、建链超时（EI0006，含沿算子依赖链级联传播与五个排查点）。每条给出现场关键字、根因与处理动作。"

