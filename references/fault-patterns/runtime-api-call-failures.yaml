id: runtime-api-call-failures
type: fault-pattern
title: Runtime（AscendCL）接口调用失败与资源不足（14 条，107xxx/207xxx/100002/EE1023/ACL Graph 捕获限制/输出全 0）
summary: "Runtime 接口层的失败对照表。接口返回码：`aclInit` 107000（配置路径/权限/json 层级超 10 层）与 100002（重复初始化，可忽略）、`aclrtSetDevice` 107001（Device ID 越界或驱动未加载）、未 SetDevice 直接调运行时接口、`aclrtMalloc` 207001（内存不足或大页策略不当）、`aclrtMemcpyAsync` 107003（Stream 不属于当前 Device 的 Context）、跨 Device 用 Stream/Event、跨 Device P2P 未查能力/未开启/未用 P2P 策略、IPC 共享内存页表未对齐、`207000`（Runtime 与 CANN 版本不匹配）、EE1023 硬件资源不足（Stream/Notify/Event/异步拷贝队列四类，按 plog retCode 分流）、ACL Graph 捕获期三类限制（捕获区间内同步或查询、GLOBAL 模式调内存同步接口、用默认 Stream 捕获）、算子输出全 0。每条给出现场关键字、根因与处理动作。"

