id: op-internal-sync-and-reduction
type: fault-pattern
title: 算子内同步与归约问题（跨核同步挂死 / 归约非确定 / 优化开关反降）
summary: "算子内部（kernel 里）的同步与归约有三类典型故障：①跨核 CrossCore Set/Wait 未成对 → 对侧永久等待（表现为 hang）；②多核归约的累加顺序引入非确定性 → 同输入多次运行结果不一致；③归约沿尾维跨块折叠未显式 MERGING → 静默错值。另附一条「优化开关打开后反而变慢」的反直觉形态（unit_flag 使能后 fixpipe 段变长）"

