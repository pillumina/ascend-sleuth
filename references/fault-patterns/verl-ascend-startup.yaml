id: verl-ascend-startup-fault-patterns
type: fault-pattern
title: verl + 昇腾训练启动/运行故障（6 条）
summary: verl+昇腾部署训练启动或运行失败故障模式对照——按可 grep 的日志签名命中根因与处理：HCCL 初始化错误码 5/7 判别（配置 vs HDK）、aclnn 算子崩溃（CANN/镜像版本）、Qwen3-MoE patch 失败（transformers 版本）、设备检测硬编码（verl 版本）、Ray actor CPU-only（device 配置）；全部 case-derived，源为 6 条 VERL Tier 2 case
sources:
- type: case-derived
  cases: [VERL-5074, VERL-6608, VERL-6885, VERL-6707, VERL-6756, VERL-6741]
  extracted_at: '2026-08-31'
  extraction_method: to-reference --ingest-cases
applies_to:
  frameworks: [verl]
  categories: [interrupt]
related_references:
- verl-ascend-startup-triage
status: draft
last_verified: '2026-08-31'
content:
  patterns:
  - pattern: verl GRPO 启动报 hcclCommInitRootInfoConfig error code 5
    symptoms: ["hcclCommInitRootInfoConfig", "error code is 5", "HCCL function error"]
    cause: verl/trainer/runtime_env.yaml 的 HCCL_HOST_SOCKET_PORT_RANGE/HCCL_NPU_SOCKET_PORT_RANGE 设为 auto，与 A2 不兼容（verl 侧配置问题，非 HDK）
    fix: 删除 runtime_env.yaml 中两行 auto 端口 range（或显式端口段）；备选回退 verl commit f31df344（可能引入其他报错）
    source_cases: [VERL-5074]
  - pattern: verl GRPO TP2 多卡报 hcclCommInitRootInfoConfig error code 7
    symptoms: ["hcclCommInitRootInfoConfig", "error code is 7"]
    cause: HDK 版本与 verl 镜像组合不兼容（官方推荐 26.0.rc1 触发，25.5.1 验证可跑）
    fix: 更换 Ascend HDK 至兼容版本（镜像不含 HDK，参考 verl install_guidance.rst 自选安装）
    source_cases: [VERL-6608]
  - pattern: vision GRPO 反向崩溃 aclnnConvolutionBackwardGetWorkspaceSize
    symptoms: ["aclnnConvolutionBackwardGetWorkspaceSize", "ConvolutionBackward"]
    cause: verl 0.8.0.dev0 + vllm-ascend 0.18.1 + CANN 8.5.0 版本组合级崩溃（卷积层 backward workspace size 获取失败）
    fix: 升级至 verl 9.0.0 / CANN 9.0.0 官方镜像（quay.io/ascend/verl:verl-9.0.0-a3-...）
    source_cases: [VERL-6885]
  - pattern: Qwen3-MoE NPU fused kernel patch 失败
    symptoms: ["npu_patch", "Qwen3Moe", "fused kernel"]
    cause: verl/models/transformers/npu_patch.py 按 Transformers 4.57 编写，5.x 下 Qwen3MoeSparseMoeBlock 接口不兼容（gate 变 router module，返回 router_logits/routing_weights/selected_experts）
    fix: 升级 verl（含 PR 6708，兼容两种 transformers 风格）；临时规避降级 transformers 4.57
    source_cases: [VERL-6707]
  - pattern: get_npu_versions() 硬编码 device ID 致 NPU 版本检测失败
    symptoms: ["get_npu_versions", "NPU 版本检测失败"]
    cause: verl <=0.7.1 的 get_npu_versions() 硬编码 NPU device ID（VERL-6756 为 1、VERL-6751 为 7），chip ID 不同的机器上检测失败
    fix: 升级 verl 至含 PR 6043（device.py 修复）的版本
    source_cases: [VERL-6756]
  - pattern: Ray actor 被识别为 CPU-only（PlatformNPU not available）
    symptoms: ["CPU-only actor", "registered but not available"]
    cause: verl 版本不正确或未显式配置设备，Ray actor 未绑定 NPU（根因未代码级定论，低置信）
    fix: 训练脚本配置 trainer.device='npu' 并确认 verl 版本与镜像匹配
    source_cases: [VERL-6741]
