id: hccl-op-exec-and-cluster-event-faults
type: fault-pattern
title: HCCL 算子执行阶段故障与集群异常事件（9 条，EI0002/EI0011/EI0012/EI0013、task exception、心跳事件）
summary: "HCCL 第三阶段（通信算子下发执行）故障对照表。执行超时 EI0002 先按「全量超时 vs 非全量超时」分流——非全量时无日志的 rank 或首报错是别的错的 rank 才是根因，全量时比对各 rank 算子参数与下发时间差；同一通信域算子被下发到不同 stream 并发执行会因通信域内资源复用导致 notify 被错误消耗，表现为超时或精度异常；另有 QP 内存 OOM（EI0011）、SDMA 页表转换失败（EI0012）、RoCE 重传超时（EI0013）、AIV 模式算子失败与 task exception（Notify/SDMA）失败类型判定。集群心跳事件（Stuck/Lost/Error CQE）用于在无首报错时定位根节点。"

