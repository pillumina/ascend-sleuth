id: operator-compute-failure-modes
type: fault-pattern
title: 算子级计算失败的十类模式（信号 / 要看哪些证据 / 常见误报 / 优化方向 / 置信度条件）
summary: 算子级十类失败模式，每条带信号、要看的证据与**常见误报**（最短 kernel 的 ratio 是噪声、NZ 加速被两端搬运吃掉等）。

