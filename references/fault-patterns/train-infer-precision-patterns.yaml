content:
  patterns:
    - pattern: 融合实现差异被报成模块缺失
      symptoms:
        - "训练侧与推理侧的模块/算子名对不上，比对工具报某模块在另一侧缺失"
        - "已知成对的融合差异：`linear_q_down_proj` / `linear_kv_down_proj` 与 `fused_qkv_a_proj`"
      cause: "两侧实现粒度不同（一侧融合、一侧拆分），不是真的缺算子"
      fix: "以输出是否对齐为判据：输出对齐而内部不一致要降级为结构差异；只对输出也错位的模块继续追"
    - pattern: 两侧采集未配对（比对前提不成立）
      symptoms:
        - "两侧 dump/比对结果都在，但逐 step 对不上、差异全网络化"
        - "配对的样本数远小于预期"
      cause: "按目录顺序或本地 step 号强行配对；validation/warmup/dummy 数据混进来了"
      fix: "按“样本身份 + 计算片段 + 权重版本”重新配对；无证据的候选**报未配对**而不是取第一条"
    - pattern: 融合算子 vs 单算子的差异分级误判
      symptoms:
        - "训练侧一个融合 kernel，推理侧若干个独立 kernel，逐算子表上呈一对一不齐"
      cause: "两侧后端实现不同（如训练侧走 FlashAttentionScore、推理侧走 FusedInferAttentionScore；归一化侧 AscendRMSNorm 对 torch_norm 等）"
      fix: "按四级定性强弱：一方融合另一方多个独立 kernel = 高；融合程度不同或不同后端做同一数学运算 = 中；语义等价或单侧有等价替代 = 低；相同基本算子 = 极低。高与中两档要给出源码路径映射作为依据"
    - pattern: 推理侧 profiling 没有 db（以为采到了）
      symptoms:
        - "推理侧采集目录里有文件，但查不到算子表；`SELECT COUNT(*) FROM COMPUTE_TASK_INFO` 返回 0 或该表不存在"
      cause: "推理侧默认 `export_type=Text`，不会自动落 db"
      fix: "显式离线解析：`from torch_npu.profiler.profiler import analyse; analyse(dir)`，CANN 版本不支持 text 自动带 db 时显式传 `export_type=['db']`；**证据闭环是算子行数 > 0**，不是文件存在"
    - pattern: 推理乱码 / 复读 / 空回复（现象绑触发条件）
      symptoms:
        - "持续输出换行符（`'\\n'`）"
        - "短序列复读、量化权重下更明显"
        - "首 token 起乱码，或长序列后段复读"
        - "多并发下空回复/乱码、回复里混入其它请求内容"
      cause: "每种现象都绑定具体触发条件（格式化输出约束与采样完整性冲突、量化权重遗漏 bias、某算子在小 shape 下的 tiling、KV Cache 打满触发重算、chunked prefill 与调度组合等）——**同一个现象对应多个不同根因**"
      fix: "先核对触发条件（是否启用了该量化权重/该组合开关/该并发水平）再定位到算子；从现象直接推断算子是本类问题的典型误诊"
    - pattern: 用 statistics 比对结果断言张量一致
      symptoms:
        - "统计量 dump 两侧一致，于是判定该算子精度正常"
      cause: "统计量相同不证明张量相等；采集关联成立也不代表精度一致"
      fix: "要判张量级一致性就采 tensor 模式（逐元素核验用 tensor、链路/统计筛查才用 statistics），并在结论里写清用的是哪一档"
