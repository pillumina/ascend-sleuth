content:
  patterns:
    - pattern: fork 方式创建子进程导致应用进程卡死
      symptoms: ["py-spy 栈含 fork|popen_fork", "gdb 栈含 acquire_lock", "multiprocessing/pool.py"]
      cause: Python 3.8-3.11 未指定或显式指定 fork 创建子进程时复制主进程锁状态，子进程再触发获取锁导致死锁（python/cpython issue 74580）
      fix: 升级 Python 3.8-3.11 补丁版本，或修改业务代码显式用 forkserver/spawn 启动方式
