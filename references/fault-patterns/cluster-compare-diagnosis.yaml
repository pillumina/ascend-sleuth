id: cluster-compare-diagnosis
type: fault-pattern
title: 双集群 profiling 比对判据（显著性门控 / 贡献度 / 劣化分级 / 有效吞吐与慢卡线索）
summary: 对比"同一个任务在两个集群/两个版本上"的性能时的判据表。**先过显著性门控再算贡献度**：Stage 变化幅度 `|ΔStage / Stage_A| < 1%` 时贡献度降级为 `—`（不算），只有 `|增幅| ≥ 1%` 才进入归因。**贡献度 = ΔX / ΔStage × 100%**，语义是"占 Stage 变化量的比例"——**可以 > 100%、也可以为负，不得解读成占总时间的比例**；命中 `comm_contrib > 50` 判通信主因、否则 `compute_contrib > 50` 判计算主因、都不满足写"劣化来源分散"。**劣化分级**：Stage 变化 `> 10%` 严重、`> 5%` 中度、`> 0` 轻微，否则算改善。**带宽要按有效吞吐比**（`Σtransit_size / Σtransit_time`）：有效吞吐降 ≥15% 才是真实链路劣化（P0）、≥5% 为次要（P1）；**均值带宽降 ≥10% 而有效吞吐没降 = 统计口径差异（占比不同），不作为链路劣化依据**。快慢卡线索：某 rank 的 Stage 时间偏离所有 rank 均值超过 10% 即标记；rank 间 `(max − min) / min × 100 > 3%` 提示存在慢卡线索（**报告模板层有此判据，脚本只出逐 rank 差值与趋势**）。**两条纪律**：集群 A 恒为基准、B 为对比，一切差值都是 `B − A`；两集群 rank 集合不重叠时**不做配对**，避免假的 ±100%。单位口径：DB 与 TEXT-CSV 为 μs、TEXT-JSON 为 ms——比之前先对齐。

