id: msprof-tool-fault-patterns
type: fault-pattern
title: msprof 采集/解析工具故障（PROF 无呈现 / host 目录为空 / 路径与安装问题）
summary: msprof 自身使用故障的现象→根因→处理：PROF 拖入 Insight 无呈现（缺 mindstudio_profiler_output，用 --export=on 补解析）/ host 目录为空（查 PLOG：磁盘空间、目录权限）/ 动态采集落盘路径按脚本相对路径而非配置路径 / 安装包提示 /root 空间不足（TMPDIR 切换解压目录）；排查首选 PLOG（~/ascend/log）

sources:
  - type: official-doc
    url: "https://gitcode.com/Ascend/msprof/blob/tag_MindStudio_26.2.0.B060_001/docs/zh/support/faq.md"
    version: "MindStudio 26.2.0.B060_001（msprof docs/zh/support/faq）"
