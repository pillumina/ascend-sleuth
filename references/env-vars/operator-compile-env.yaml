content:
  variables:
  - name: ASCEND_MAX_OP_CACHE_SIZE
    description: 启用算子编译缓存功能时，可通过此环境变量限制某个AI处理器下缓存文件夹的磁盘空间的大小。默认为500，单位为MB。 - 当编译缓存文件的大小超过此环境变量的设置值，且超过半小时缓存文件未被访问时，缓存文件就会老化。 - 若需要关闭编译缓存老化功能，可将环境变量“ASCEND_MAX_OP_CACHE_SIZE”设置为“-1”，此时访问算子缓存时不会更新访问时间，算子编译缓存不会老化，磁盘空间使用默认大小500MB。 算子编译时，不会因为编译缓存文件大小超过设置值而中断，所以当此环境变量的值设置过小时，会出现实际编译缓存文件大小超过此设置值的情况。
    example: export ASCEND_MAX_OP_CACHE_SIZE=500
    url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0021.html
  - name: ASCEND_REMAIN_CACHE_SIZE_RATIO
    description: 启用算子编译缓存功能时，当编译缓存空间大小达到ASCEND_MAX_OP_CACHE_SIZE而需要删除旧的kernel文件时，系统需要保留缓存的空间大小比例，默认为50，单位为百分比。
    example: export ASCEND_REMAIN_CACHE_SIZE_RATIO=50
    url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0022.html
  - name: IGNORE_INFER_ERROR
    description: 该环境变量为试验特性，后续版本可能会存在变更。 算子入图时，跳过算子原型交付件校验的开关。交付件包括shape推导等算子入图适配函数的实现。 - 非空：算子入图交付件缺失场景下，算子编译时跳过校验报错，快速恢复用例。 - 不配置：（默认值）算子入图交付件缺失时，算子编译报错。
    example: 如下示例中的取值“1”仅为参考样例，可以设置为其他非空字符串。  export IGNORE_INFER_ERROR=1
    url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0142.html
  - name: TE_PARALLEL_COMPILER
    description: 算子最大并行编译进程数，当该参数大于1时，系统将开启并行编译功能。 网络模型较大时，可通过配置此环境变量开启算子的并行编译功能。
    example: export TE_PARALLEL_COMPILER=8
    url: https://www.hiascend.com/document/detail/zh/canncommercial/900/maintenref/envvar/envref_07_0020.html
