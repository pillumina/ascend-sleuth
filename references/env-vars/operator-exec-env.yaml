id: operator-exec-env
type: env-var-table
title: 算子执行环境变量
summary: CANN 环境变量参考（envref 系列）：算子执行，1 个变量；description 为官方原文，platforms 取自官方 models 声明
sources:
- type: official-doc
  url: CANN 环境变量参考（华为，hiascend.com maintenref/envvar）
