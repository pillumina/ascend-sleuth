# ascend-sleuth 面板（常驻插件包）：诊断 + 指标（ascend-panel）、自演进（ev-panel）三个 tab；整页内另有知识库子页。
#
# 装法：plugin_manager install_bundle(target: <本目录绝对路径>)。装进当前 profile 后
# 每个会话都在、重启不丢。host 半一条 connection RPC 路由承载两个面板的所有端点，
# client 半注册三个 conversation.view tab（id: ascend-diagnose / ascend-metrics / ascend-evolve），
# 另在侧栏页脚注册一个「诊断记录」入口（sidebar.footer.action）与它的浮层本体（shell.overlay）——
# 两者都不替换自带组件，只是附加。
#
# lib/index.js 与 lib/client.js 是生成物（scripts/build_panel_bundle.js），勿手改。
#
# 自动收尾插件 dsh-sleuth-autoclose 是面板包的依赖，随面板一起装；面板开关只启用/停用定时器，
# 不需要单独安装或卸载这个插件。config 是首次安装的默认值，面板保存后以
# postmortems/inbox/.groom/autoclose-config.json 为准。
- insert:
    - id: dsh-sleuth-panels
      name: 'dsh-sleuth-panels'
    - id: dsh-sleuth-autoclose
      name: 'dsh-sleuth-autoclose'
      config:
        enabled: true
        intervalMinutes: 1440
        runOnStart: true
