# VLLM-ASC-10876 —— DeepSeek-V4-Flash chunked prefill 偶发超长（forward_ms 4s+ / TTFT P90 ~7.3s）：
#   triton rms kernel TOTAL_BATCH 误标 tl.constexpr → batch shape 变化即重编译
# 来源：https://github.com/vllm-project/vllm-ascend/issues/10876
# fix：PR #11211（Delete the tl.constexpr of total_batch param in triton_rms_kernel，merged 2026-07-03，76d338a72）
#      main 2026-07-03 合入；tag ancestry 校验含于 v0.23.0rc1（2026-07-19）；同 fix 关联 #11209（triton_q_rms 偶现 ~3s 卡顿）
# pre-triage: variant_of VLLM-ASC-13973 —— 同 dsa_cp/prefill 性能族（13973=v0.26 解耦+SFA DCP block table 宽度，机制=通信量/元数据；
#     本条=v0.21 dsa_cp_forward_prefill 内 rms kernel constexpr 重编译尖峰，机制=kernel 重编译），同功能路径不同机制版本
# verification: upstream-fix-merged（fix PR #11211）
# 脱敏：未引用线程内内网 IP/密钥
