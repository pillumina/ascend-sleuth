# VLLM-ASC-13973 —— P 节点 prefill 吞吐回归：dsa-cp 与共享专家 DP 解耦引入额外 fc1 通信 + SFA DCP block table 宽度用错
# 来源：https://github.com/vllm-project/vllm-ascend/issues/13973
# fix 跟踪：config workaround "shared_expert_dp_enabled": true（评论#3 官方确认）；SFA DCP block table 宽度已改回 local
# investigation_quality: high（assessment.jsonl #13973）
# 批量导入：docs/eval-reports/0001-vllm-ascend-batch-plan.md（Phase B，第 2 批）
# 脱敏：扫描 body/comments 未发现内网 IP/token/密码，无需替换
# 注意：performance 定性+定量 case——quickly_check 用指标阈值断言，不用 grep 错误签名

cases:
  - id: VLLM-ASC-13973
    title: "v0.26 P 节点 prefill 回归：dsa-cp 与共享专家 DP 解耦致共享专家走 fc1 额外两次通信 + SFA DCP block table 宽度用错致 kv_gather_ids 冲高（TTFT 7.1x）"

    category: performance
    tags: [prefill, regression, dcp, sfa, block-table, shared-expert, ttft, glm5]

    # 线程 Hardware 仅写 "Ascend 910 × 16 cards"，未明确 910B/910C → 不填 platforms
    compat:
      - framework: vllm-ascend
        ranges: ["0.26.0rc"]           # v0.23 同拓扑无此回归；SFA block table 宽度修复已落地
      - framework: torch-npu
        ranges: ["<=2.10.0.post2"]     # 线程实测版本

    investigation_quality: high        # to-postmortem 标的调查质量，groom 据此设初始 score
    confidence:                        # groom 维护
      hits: 0
      misdiagnoses: 0
      score: 0.6                       # high → 初始 0.6
      last_hit: ""

    symptoms:
      - "GLM-5.2 w4a8 PD 分离 P 节点（kv_role=kv_producer），v0.23→v0.26 相同 DCP=8/TP=8/EP=32 拓扑下 prefill 吞吐 38811→29911 tok/s"
      - "TTFT P50 7617ms→54296ms（~7.1x 劣化），QPS 1.69→1.14"
      - "profiler（同 P 节点 rank0）：DCP collective 通信量 ~5-6x，step time 非重叠通信占比 1.58%→8.19%；DispatchFFNCombineW4A8 单算子 15.2ms→22.6ms ×78 层"
      - "开启 prefix cache 时 SFA DCP replicated/gather metadata 扫宽表，kv_gather_ids 周期性冲高（unique()/host 侧同步成本放大）"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/13973"


    verification:

      source: upstream-maintainer-confirmed

      detail: 'issue #13973'

    quickly_check:
      # performance 类：数值/指标断言而非错误签名 grep
      primary:
        command_template: "grep -E 'TTFT.*P50|prompt.*tok/s' {{bench_report_path}}"
        rank_selector: coordinator
        expected: "metric:TTFT P50 <= 20000ms 且 P0 prompt throughput >= 35000 tok/s（v0.23: 7617ms / 38811 tok/s；v0.26 回归: 54296ms / 29911 tok/s）"
        note: "TTFT 可比（同为 cc=64 单 prefill 墙钟）；QPS/TPOT 因两版 output-len 不同（700 vs 1）不可直接比"
      fallback:
        command_template: "grep -E 'communication|comm' {{profiler_step_trace_csv}}"
        rank_selector: coordinator
        expected: "metric:step 内非重叠通信占比 < 3%（v0.23: 1.58%；v0.26 回归: 8.19%）"

    diagnosis:
      - step: 1
        check: "指标判别：同拓扑下 TTFT P50 是否 >2x v0.23 基线、吞吐是否下降 ~23%？"
        expected: "是（v0.26.0rc 指纹；profiler_metadata 确认 parallel_group_info 一致、enable_sparse_sfa_c8 两边相同）"
      - step: 2
        command_template: "grep -E 'shared_expert_dp_enabled' {{launch_config}}"
        rank_selector: coordinator
        expected: "已显式开启 \"shared_expert_dp_enabled\": true"
        fix_on_mismatch: "--additional-config '{\"shared_expert_dp_enabled\": true}'"
        rollback: "移除该配置项（恢复 v0.26 默认解耦行为）"
        note: "v0.26 dsa-cp 与共享专家 DP 解耦，未开启时共享专家走 fc1 引入额外两个通信——配置持平 v0.23 通信量"
      - step: 3
        check: "代码级根因验证：SFA DCP block table 宽度"
        expected: "v0.26 父类 AscendSFAMetadataBuilder.build() 新增 _build_with_metadata_view()，DCP 子类调 super().build() → 第二层 _build() 拿到的是 replicated 宽表而非 local 表，invalid tail 非零 block id 被 unique() 扫入 kv_gather_ids"
        note: "官方已改回 local 宽度；开 prefix cache 才触发此路径"
      - step: 4
        check: "bench 对齐坑：v0.23 用 output-len=700（prefill+decode）、v0.26 用 output-len=1（纯 prefill）"
        note: "QPS/throughput/TPOT 不可直接比；TTFT 与 profiler 指标不受 output-len 影响，是可靠判别量"

    severity: service-affecting         # 性能劣化但服务可用
    fix_side_effects: [requires-restart]
    fix_type: config-change             # 另有代码修复（SFA DCP block table 宽度）随版本落地

    root_cause: >
      两个叠加因素：(1) v0.26 将 dsa-cp 与共享专家 DP 特性解耦，未显式开启 shared_expert_dp_enabled 时
      共享专家启用 fc1，引入额外两次通信，DCP collective 通信量 ~5-6x；(2) 开 prefix cache 时 SFA DCP
      metadata 构造用错 block table 宽度——父类 AscendSFAMetadataBuilder.build() 新增 _build_with_metadata_view()，
      DCP 子类调用 super().build() 使第二层 _build() 看到 replicated 宽表而非原始 local 表，invalid tail
      非零 block id 被 unique() 扫进去，kv_gather_ids 周期性冲高，host 侧同步与 metadata 构造成本放大。

    fix: >
      (1) 显式开启 additional-config 中 "shared_expert_dp_enabled": true 持平 v0.23 通信量；
      (2) SFA DCP block table 宽度改回 local 宽度（官方已修复，随版本升级落地）。
    rollback: "关闭 shared_expert_dp_enabled（恢复 v0.26 默认）或回退 v0.23"
