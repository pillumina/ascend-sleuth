# VLLM-ASC-8938 —— 1P2 + KV Pool：P0/P1 服务同时拉起时 ZMQ 端口抢占，P1 拉起失败 "Address already in use"
# 来源：https://github.com/vllm-project/vllm-ascend/issues/8938
# pre-triage: new_pattern（PD 分离 KV Pool 端口配置类，与现有 case 无重叠）
# 社区确认：ZMQ 端口绑定无重试机制，设置 kv_port 后未复现（zmc1997 确认）
# investigation_quality: medium（用户复现 + 维护者给配置 + 设置后未复现）
# 导入管道：issue-ingest skill 第二轮（triaged 池）

cases:
  - id: VLLM-ASC-8938
    title: "1P2 + KV Pool 场景 P0/P1 服务极短时间内同时拉起时，P1 报 ZMQError: Address already in use（ZMQ 端口绑定无重试、端口抢占）——配置 kv_port 解决"

    category: interrupt
    tags: [pd-disaggregation, kv-pool, zmq, port]

    platforms: ["cross"]

    compat:
      - framework: vllm-ascend

    investigation_quality: medium
    confidence:
      hits: 0
      misdiagnoses: 0
      score: 0.4                # medium（用户复现 + 维护者配置 + 未复现验证）

    symptoms:
      - "1P2 + KV Pool：P0 服务拉起成功后，偶现 P1 服务拉起失败，报错 ZMQError: Address already in use"
      - "P0、P1 服务在极短时间内同时拉起时，ZMQ 端口绑定无重试机制，存在端口抢占现象"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/8938"


    verification:

      source: upstream-maintainer-confirmed

      detail: 'issue #8938'

    quickly_check:
      primary:
        command_template: "grep -E 'ZMQError|Address already in use' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:ZMQError|Address already in use"
      fallback:
        command_template: "grep -iE 'kv_port|kv-pool|ZMQ' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:kv_port|kv-pool|ZMQ"

    diagnosis:
      - step: 1
        check: "症状判别：PD 分离 + KV Pool 场景，P 节点服务拉起报 ZMQError: Address already in use？"
        expected: "是——P0/P1 同时拉起时 ZMQ 端口绑定无重试，端口抢占"
      - step: 2
        check: "修复：为 P 节点配置 kv_port（如 kv_port=60000）避免默认端口冲突"
        expected: "设置 kv_port 后问题未复现（zmc1997 确认）"

    severity: benign
    fix_side_effects: [requires-restart]
    fix_type: config-change

    root_cause: >
      1P2 + KV Pool 场景下，P0/P1 服务在极短时间内同时拉起时，ZMQ 端口绑定无重试机制，
      存在端口抢占现象，P1 服务拉起失败（ZMQError: Address already in use）。

    fix: >
      为 P 节点显式配置 kv_port（如 kv_port=60000），避免默认端口冲突；设置后问题未复现。
