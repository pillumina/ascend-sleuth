# VLLM-ASC-12461 —— 多节点 EP + FusedMoE MC2 通信算子在 ROCE 网络触发 aicore exception → SUSPECT REMOTE ERROR 507057
# 来源：https://github.com/vllm-project/vllm-ascend/issues/12461
# 并入变体：VLLM-ASC-9503（GLM-5.1 双机 MoeDistributeDispatchV2 算子错误——维护者确认 RoCE 兼容性，升级 0.20.2rc1+ 解决，2026-08 groom）
# fix 跟踪：0.20.2rc1+ 修复（ZYang6263 确认）；12461 原结论"无官方修复"已被 9503 的升级修复更新（HCCS workaround 保留为不能升级时的退避）
# investigation_quality: high（用户消融排除 speculative 路径 + plog aicore 定位 MTE DDR 越界 + fault kernel 名 + 环境对照 + 维护者确认修复）
# 批量导入：docs/eval-reports/0001-vllm-ascend-batch-plan.md（batch 1，2026-08）+ issue-ingest skill（9503，2026-08）

cases:
  - id: VLLM-ASC-12461
    title: "多节点 EP + FusedMoE MC2 通信算子（MoeDistributeDispatchV2）在 ROCE 网络触发 aicore exception（MTE DDR 越界）→ SUSPECT REMOTE ERROR 507057 启动失败；HCCS 可跑通，升级 0.20.2rc1+ 修复"

    category: interrupt
    tags: [multi-node, ep, mc2, roce, fusedmoe]

    platforms: ["A3-910C"]
    compat:
      - framework: vllm-ascend
        ranges: ["<0.20.2rc1"]        # 触发 <0.20.2rc1（12461: <=0.21.0 / 9503: 0.19.1rc1）；0.20.2rc1+ 修复（ZYang6263 确认）

    investigation_quality: high
    confidence:
      hits: 0
      misdiagnoses: 0
      score: 0.6
      last_hit: ""

    symptoms:
      - "2×A3 多节点 + EP + MTP(num_speculative_tokens=4) 启动即失败：RuntimeError: SUSPECT REMOTE ERROR, error code is 507057（synchronize stream with timeout failed）"
      - "plog：aicore exception，MTE 指令 DDR 地址越界（errCode 0x800000, subErrType 4），fault kernel_name=MoeDistributeDispatchV2"
      - "单节点 TP16+PP2（不跨节点 EP）可跑通；多节点 EP 在 MLAPO 与 GEMM 路径均失败（FusedMoE kernel 内）"
      - "关闭 speculative decode 同样报错（同栈）——非 MTP/dummy_run 问题"
      - "变体 9503：GLM-5.1-w8a8 双机（0.19.1rc1）报 MoeDistributeDispatchV2 算子错误——维护者确认 RoCE 组网已知兼容性问题，升级 0.20.2rc1+ 解决"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/12461"
      - "https://github.com/vllm-project/vllm-ascend/issues/9503"

    quickly_check:
      primary:
        command_template: "grep 'SUSPECT REMOTE ERROR' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:.*SUSPECT REMOTE ERROR.*507057"
      fallback:
        command_template: "grep -iE '507057|aicore exception|MoeDistributeDispatchV2' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:.*(507057|aicore exception|MoeDistributeDispatchV2)"

    diagnosis:
      - step: 1
        check: "症状判别：是否多节点 EP 场景（≥2 节点 + --enable-expert-parallel）？错误是否出现在 MoE forward / dummy_run 编译期 synchronize？"
        expected: "是——栈在 model_runner profile_run → _dummy_run → MoE forward 的 torch.npu.synchronize()"
      - step: 2
        check: "判别：单节点 TP16+PP2 能跑、多节点 EP 必现 → 跨节点 EP 通信路径问题"
        expected: "日志 'MoE comm method selected: soc=AscendDeviceType.A3, method=MoECommType.MC2' 确认走 MC2 通信算子；fault kernel=MoeDistributeDispatchV2"
      - step: 3
        check: "workaround 验证：改用 HCCS 网络部署是否可跑通？"
        expected: "可跑通（线程用户自证：常规 ROCE 网络对 MC2 算子支持异常，HCCS 正常）；保证 ROCE 对 MC2 支持或走 ALLTOALL 路径"
      - step: 4
        check: "忽略项：关闭 speculative decode 后同栈报错（评论#1）→ 不是 MTP/dummy_run 的问题；QuantBatchMatmulV3 launch failed (361001) 是 MC2 失败后的次级报错，不要追它的调用链"
        note: "12461 原判'官方未出修复'；9503 变体确认 0.20.2rc1+ 修复（ZYang6263）——先升级再考虑 workaround"
      - step: 5
        check: "修复优先：升级 vllm-ascend 到 0.20.2rc1 或更新版本"
        expected: "算子错误解决（9503 维护者确认新版本可解决）"
        note: "不能升级时退避 HCCS 网络或单节点内 EP（step 3）"

    severity: service-affecting
    fix_side_effects: [requires-restart]
    fix_type: config-change

    root_cause: >
      多节点（跨服务器）EP 下，vllm_ascend FusedMoE 的 MC2 通信算子（MoeDistributeDispatchV2，
      Ascend 特有 MoECommType.MC2）在常规 ROCE 网络上触发 aicore exception：MTE 指令 DDR 地址
      越界（errCode 0x800000），NPU 侧异常上抛为 'SUSPECT REMOTE ERROR, error code is 507057'
      （synchronize stream with timeout failed），多节点 EP 启动/编译失败。属 ROCE 组网对 MC2
      算子的兼容性问题：HCCS 网络可正常跑通；**0.20.2rc1+ 已修复**（9503 维护者确认），12461
      原"无官方修复"结论过时。

    fix: >
      优先升级 vllm-ascend 到 0.20.2rc1 或更新版本（ZYang6263 确认可解决）；不能升级时，
      多节点 EP 部署改用 HCCS 网络（用户验证可跑通）或退避单节点内 EP（TP16+PP2）。
    rollback: "恢复 ROCE 网络配置（若其 MC2 支持异常则问题复现）"
