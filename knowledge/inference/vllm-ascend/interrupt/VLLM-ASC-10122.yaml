# VLLM-ASC-10122 —— 310P 跑 Qwen3.6-27B-W8A8 推理报 507015 aicore exception：QuantBatchMatMulV3 量化算子 CANN 版本 bug
# 来源：https://github.com/vllm-project/vllm-ascend/issues/10122
# 社区确认：量化运算算子在该 CANN 版本有问题，修复已合入 CANN 9.1.0.beta2 分支，等待社区版发布
# investigation_quality: medium（单用户复现 + 维护者确认根因 + 修复已合入待发布）
# 导入管道：issue-ingest skill（2026-08，triaged 池）

cases:
  - id: VLLM-ASC-10122
    title: "310P（Qwen3.6-27B-W8A8 serve）推理报 507015 aicore exception：fault kernel_name=QuantBatchMatMulV3 量化算子在该 CANN 版本有 bug，升级到 ≥9.1.0.beta2 修复"

    category: interrupt
    tags: [qwen3.6, w8a8, quantization, 507015, aicore]

    platforms: ["310P"]

    compat:
      - framework: vllm-ascend
        cann: "<9.1.0.beta2"    # 触发版本；修复已合入 CANN 9.1.0.beta2，待社区版发布

    investigation_quality: medium
    confidence:
      hits: 0
      misdiagnoses: 0
      score: 0.4                # medium（单用户 + 维护者确认根因，修复待社区发布验证）

    symptoms:
      - "310P 上 vllm serve 跑 Qwen3.6-27B-W8A8，推理报 ERR00100 PTA call acl api failed，error code is 507015"
      - "AclNN_Runtime_Error(EZ9903)：aclrtLaunchKernelWithHostArgs failed: 507015，Kernel task happen error, retCode=0x26, [aicore exception]"
      - "报错定位到 fault kernel_name=QuantBatchMatMulV3_NZ_NZ_int8_int8_fp16_high_performance_21（量化 matmul 算子），error code=0x26"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/10122"


    verification:

      source: upstream-maintainer-confirmed

      detail: 'issue #10122'

    quickly_check:
      primary:
        command_template: "grep -E \"QuantBatchMatMulV3|507015\" {{log_path}}"
        rank_selector: all_failed
        expected: "regex:QuantBatchMatMulV3|507015"
      fallback:
        command_template: "grep -E 'aicore exception|AclNN_Runtime_Error' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:aicore exception|AclNN_Runtime_Error"

    diagnosis:
      - step: 1
        check: "症状判别：310P + w8a8 量化模型推理报 507015 aicore exception，fault kernel_name 含 QuantBatchMatMulV3（量化 matmul 算子）？"
        expected: "是——量化算子（QuantBatchMatMulV3）在该 CANN 版本执行异常"
        note: "错误码 507015 是 aicore execution 异常（新码，未入 cann-runtime 错误码表）"
      - step: 2
        check: "版本判别：CANN 版本是否低于 9.1.0.beta2？"
        expected: "低于——量化算子 bug 的修复已合入 CANN 9.1.0.beta2，社区版发布前该版本触发"
      - step: 3
        check: "修复：升级 CANN 到含修复的版本（≥9.1.0.beta2），vllm-ascend 镜像同步升级"
        expected: "量化算子执行正常、推理恢复（修复合入 beta2 分支，等待社区版发布后升级验证）"

    severity: service-affecting
    fix_side_effects: [requires-restart]    # 升级 CANN 需重启服务
    fix_type: config-change                  # 版本升级（CANN ≥9.1.0.beta2）

    root_cause: >
      310P 上 Qwen3.6-27B-W8A8 推理触发 QuantBatchMatMulV3（量化 batch matmul）算子执行
      aicore exception（507015 / error code 0x26）。社区确认该量化运算算子在触发使用的
      CANN 版本存在 bug，修复已合入 CANN 9.1.0.beta2 分支（社区版发布前无法通过镜像直接
      升级规避）。

    fix: >
      升级 CANN 到含 QuantBatchMatMulV3 修复的版本（≥9.1.0.beta2），并同步升级 vllm-ascend
      镜像；社区版发布前等待 CANN 社区版本（维护者确认修复已合入 beta2 分支）。
