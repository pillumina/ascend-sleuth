    diagnosis:
      - step: 1
        check: "症状判别：Qwen3.5/Qwen3-VL 多模态请求下 Worker 报 ValueError: Attempted to assign N = N multimodal tokens to M placeholders？"
        expected: "是——多模态 embedding token 数（本例 65）与 prompt 内 placeholder 数（3905）不匹配，merge 阶段 raise"
      - step: 2
        check: "代码点确认：栈是否到 vllm_ascend/patch/worker/patch_multimodal_merge.py:48 _merge_multimodal_embeddings（vllm qwen3_5.py embed_input_ids 调起），V1 + 多模态 + 高并发请求触发？"
        expected: "是——vllm-ascend patch 层 merge 的计数校验在 embed_input_ids 阶段直接失败，非量化/通信/权重问题"
      - step: 3
        check: "级联鉴别：同 Worker 先报的 ERR01001 OPS invalid parameter 是否独立问题？"
        expected: "同请求则属 merge 错位路径伴随报错，勿单独按 CANN 算子 bug 排查；若仅 ERR01001 无本 ValueError 文本，走通用算子错误通道而非本 case"
