      - step: 4
        check: "修复状态：上游 PR #7055（patch_multimodal_merge.py pre-check 告警 + patch_qwen3_vl.py tokenizer 级 _get_merged_lt_splits/_find_mm_placeholders 修正）closed 且 merged=false，线程无其他已合修复/无 workaround——如何处置？"
        expected: "规避=手动应用 PR #7055 diff 或等上游重新合入后升级；修复落地前勿宣称已解决（无维护者验收），groom 跟进后续 issue 回填 compat"

    severity: service-affecting
    fix_type: pending-investigation   # 上游无已合修复（PR #7055 closed/merged=false）；修复方向=code-patch（pre-check + tokenizer 级 placeholder 检测）但未发布

    root_cause: >
      vllm-ascend 以 patch/worker/patch_multimodal_merge.py 覆写 vLLM 的 _merge_multimodal_embeddings
      合并 Qwen3.5/Qwen3-VL 多模态 embedding 到 prompt 视觉 placeholder 位置；多模态高并发请求下出现
      placeholder 计数（3905）≫ 实际多模态 embedding token 数（65）的错位，patch 在
      patch_multimodal_merge.py:48 计数校验不通过直接 raise ValueError（Attempted to assign 65 = 65
      multimodal tokens to 3905 placeholders），worker execute_model 崩溃。PR #7055 作者判定为 patch 层
      多模态 token/placeholder 计数不匹配（mm embedding token 可少于 placeholder → 计数不匹配/index 越界），
      需 merge 前 pre-check 计数（告警而非崩溃）+ tokenizer 级修正 Qwen3-VL placeholder 检测。PR 未合入，
      机制结论为作者 + patch 分析级，无上游最终确认。

    fix: >
      上游无已合修复。PR #7055（closed, merged=false）给出方向：patch_multimodal_merge.py 加 pre-check——
      embedding token 数与 placeholder 数不匹配时告警而非 raise；新增 patch_qwen3_vl.py tokenizer 级修正
      Qwen3-VL _get_merged_lt_splits()/_find_mm_placeholders() 的 placeholder 检测。线程无 workaround；
      当前只能手动应用 PR #7055 diff 或等上游重新合入后升级。
    rollback: "手动应用 PR diff 属源码级改动，回退 vllm-ascend 版本即可复原；无部署参数性 workaround"
