      - "栈到 vllm_ascend/patch/worker/patch_multimodal_merge.py:48 _merge_multimodal_embeddings raise（vllm qwen3_5.py:690 embed_input_ids → _merge_multimodal_embeddings），V1 executor 多卡（tp/dp/EP）"
      - "同段日志该 Worker 先报 ERR01001 OPS invalid parameter（伴随/级联，判型以 ValueError 文本为准）"

