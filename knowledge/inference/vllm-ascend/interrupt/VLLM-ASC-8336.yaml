      - "崩溃点 vllm_ascend/patch/platform/patch_balance_schedule.py:297 scheduler.schedule() 内 'if request.status == RequestStatus.WAITING_FOR_FSM:'（enum.py:786 __getattr__ 抛缺成员）"
      - "级联：AsyncLLM output_handler failed → vllm.v1.engine.exceptions.EngineDeadError → serving.py completion stream generator 多行报错 → WorkerProc shutting down，服务退出"
      - "空闲启动正常、请求进入后才崩；workaround：去掉 export VLLM_ASCEND_BALANCE_SCHEDULING=1 不再崩但性能下降（xuyucheng220 实测）"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/8336"
      - "https://github.com/vllm-project/vllm-ascend/pull/8448"
      # 上游 vllm#38048：引入 RequestStatus.WAITING_FOR_FSM 的修复（被 #8448 以 vLLM v0.19.1 带入）
      - "https://github.com/vllm-project/vllm/pull/38048"


    verification:

      source: upstream-fix-merged

      detail: 'fix PR #8448'

    quickly_check:
