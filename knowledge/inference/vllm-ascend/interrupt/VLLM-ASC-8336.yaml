    severity: service-affecting
    fix_side_effects: [requires-restart]      # 升级或改 env-var 均需重启服务
    fix_type: code-patch                      # PR #8448 升级配套 vLLM v0.19.1；workaround 为 env-var（去掉 VLLM_ASCEND_BALANCE_SCHEDULING=1）

    root_cause: >
      balance scheduling 是 vllm-ascend 自定义调度 patch（vllm_ascend/patch/platform/patch_balance_schedule.py），
      重写 scheduler.schedule() 做请求平衡；其中 line 297 用 request.status == RequestStatus.WAITING_FOR_FSM
      把等待 FSM（结构化输出/工具调用 grammar 态）的请求单独处理。该枚举成员由上游 vllm#38048 引入、
      随配套 vLLM v0.19.1 才存在；issue 环境（vllm-ascend main/dev 0.17.0rc2.dev312+g1eb0cc0e4 + 配套 vLLM
      v0.19.0，2026-04-16）的 RequestStatus 尚无 WAITING_FOR_FSM，首个进入调度的请求即触发 enum.__getattr__
      AttributeError → EngineCore fatal。与模型量化方式/芯片无关，是调度 patch 代码与配套引擎版本的错位。

    fix: >
      升级到包含 PR #8448 的 vllm-ascend（配套 vLLM 升至 v0.19.1，经上游 vllm#38048 补齐 RequestStatus.
      WAITING_FOR_FSM；LoganJane 2026-06-11 确认最新 release/rc 已解决，issue completed 关闭）。
      临时 workaround：去掉 export VLLM_ASCEND_BALANCE_SCHEDULING=1（关闭 balance scheduling 规避崩溃，
      用户实测性能下降）。
    rollback: "升级环境恢复 export VLLM_ASCEND_BALANCE_SCHEDULING=1 不再复现；配套 vLLM 仍 <0.19.1 时恢复该开关即复现崩溃"
