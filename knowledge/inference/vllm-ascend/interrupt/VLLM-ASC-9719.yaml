# VLLM-ASC-9719 —— minimax W8A8（m2.5-w8a8-quarot）拉起 OOM、权重显存翻倍：config.json 含 quantization_config（顶层键）但 modelslim per-layer 数据未加载——modelslim_config.py maybe_update_config 卫语句 if self.quant_description: return 误跳过 quant_model_description.json → 全层退化 bf16（~27GB→~54GB/shard）
# 来源：https://github.com/vllm-project/vllm-ascend/issues/9719（同族 #9894：官方结论=下载的权重版本错误，config.json 不应含 quantization_config，重下正确权重）
# fix 跟踪：无 merged fix PR——PR #9734（改卫语句为 any(k.endswith('.weight'))）被维护者 kunpengW-code 拒绝（"modelslim 导出的权重不应含 quantization_config，纳入会掩盖错误权重定位"，closed 未合入）；官方解=修正权重文件（重下 modelslim 正确导出，config.json 无 quantization_config），见 issue #9894；issue 9719/9894 均 closed completed
# investigation_quality: high（pokomenMaster 源码级定位卫语句 + 显存实测对照 ~27→54GB + 维护者确认权重格式结论）
# pre-triage: variant_of VLLM-ASC-10610 —— 同 vllm_ascend/quantization/modelslim_config.py 的 quant_description 加载族；增量=10610 为 quant_description 缺 per-layer key → KeyError（格式对、schema 缺），本条为顶层键占位致卫语句误判跳过 per-layer json → 全层 bf16 退化 2× 显存（权重文件错误型，官方解=修正权重）
# verification: upstream-maintainer-confirmed（无 merged fix PR；resolution 由维护者确认）
# 脱敏：issue 无内网 IP/密钥
# 建议命名空间：inference/vllm-ascend/interrupt/
# 导入管道：issue-ingest r2-sed-g4（2026-09，postmortems/inbox 草稿，待 groom 分诊转正）

# groom 升格：2026-W36 round3（vllm-ascend 第 2 轮全自动沉淀）——schema 校验通过

cases:
  - id: VLLM-ASC-9719
    title: "Minimax W8A8（minimax-m2.5-w8a8-quarot）启动 OOM、权重显存翻倍（~27GB→~54GB/shard）：config.json 含 quantization_config 顶层键导致 modelslim_config.py maybe_update_config 卫语句 if self.quant_description: return 跳过 per-layer quant_model_description.json → 全层退 bf16；官方解=重下正确权重（config.json 不应含 quantization_config）"

    category: interrupt
    tags: [minimax, w8a8, modelslim, quantization, oom, double-memory, config-guard, weight-format]

    # 平台：issue 未明示（Ascend NPU 通用）；vLLM 0.20.2 + vllm-ascend main commit 2e94f541
    compat:
      - framework: vllm-ascend
        ranges: ["0.20.2"]            # 用户实测版本（main commit 2e94f541）
        note: "触发条件=config.json 含 quantization_config（modelslim 权重导出错误变体），与版本关联弱"

    investigation_quality: high
    confidence:
      hits: 0
      misdiagnoses: 0

    symptoms:
      - "Minimax m2.5-w8a8-quarot（W8A8）启动失败：加载权重显存约为预期的 2 倍（~27GB→~54GB/shard），触发 OOM"
      - "vLLM 0.20.2 + vllm-ascend main（commit 2e94f541）出现；历史版本正常"
      - "模型 config.json 含 quantization_config（顶层键：quant_method/bits/group_size 等，无 per-layer .weight 键）"
      - "代码层：vllm_ascend/quantization/modelslim_config.py AscendModelSlimConfig.maybe_update_config 的卫语句 if self.quant_description: return 直接跳过加载 quant_model_description.json（per-layer 量化数据）"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/9719"
      - "https://github.com/vllm-project/vllm-ascend/issues/9894"
      - "https://github.com/vllm-project/vllm-ascend/pull/9734"

    verification:
      source: upstream-maintainer-confirmed
      detail: "PR #9734（pokomenMaster：卫语句改 any(k.endswith('.weight')) + create_scheme_for_layer 返回 None + 防御回退）被维护者 kunpengW-code 拒绝未合入：'This is probably a weight format issue. The quantization weights generated by Modelslim should not contain quantization_config in the config.json'；官方结论在 #9894：下载的权重版本错误，检查 config.json 是否含 quantization_config，含则重新下载（正确权重链接 modelscope Eco-Tech/MiniMax-M2.5-w8a8-QuaRot）"

    quickly_check:
      primary:
        command_template: "python3 -c \"import json;c=json.load(open('{{model_dir}}/config.json'));print('quantization_config' in c)\""
        rank_selector: coordinator
        expected: "regex:True"
        note: "primary=配置检查：config.json 是否含 quantization_config（含→候选本 case）"
      fallback:
        command_template: "grep -aEi 'out of memory|OOM|weight.*(double|twice)|bf16' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:out of memory|OOM|weight.*(double|twice)|bf16"
        note: "模型加载期显存翻倍/OOM + 日志无 per-layer 量化加载迹象"

    diagnosis:
      - step: 1
        check: "配置判别：模型 config.json 是否含 quantization_config（顶层键，如 quant_method/bits/group_size），而模型为 modelslim 导出的 w8a8 权重？"
        expected: "是——modelslim 导出权重本不应带 quantization_config；带了会导致 per-layer json 被跳过"
      - step: 2
        check: "机制确认（可选源码）：AscendModelSlimConfig.maybe_update_config 卫语句 if self.quant_description: return——from_config 已把顶层键塞进 quant_description（非空）→ 跳过加载 quant_model_description.json（per-layer .weight 数据）→ get_quant_method 无法判定层 scheme → 全层回退 bf16？"
        expected: "是——量化权重按 bf16 加载，显存 ~2×，OOM"
      - step: 3
        check: "修复（官方解）：重新下载正确的 modelslim 权重（config.json 不含 quantization_config）后重启；代码侧 #9734 改动被维护者拒绝（会掩盖权重错误），不采用"
        expected: "正确权重下显存回到预期 int8 占用（~27GB/shard），服务拉起"
      - step: 4
        check: "判别：若 config.json 无 quantization_config 仍 2× 显存/OOM → 不是本条（查模型加载/量化路径其他 case，如 10610/12685）"
        expected: "排除本 case，转查其他量化加载族"
        note: "正确 modelslim 导出：quant_model_description.json 存在且 config.json 无 quantization_config"

    severity: service-affecting
    fix_side_effects: [requires-restart]
    fix_type: config-change           # 权重文件修正（重下正确导出），非代码 fix

    root_cause: >
      正确 modelslim 导出的权重，config.json 不应包含 quantization_config 字段。当 config.json 携带
      quantization_config（如 minimax-m2.5-w8a8-quarot 的错误下载变体，含 quant_method/bits/group_size
      等顶层键但无任何 .weight 结尾的 per-layer 键）时，vllm-ascend 加载管道调用
      AscendModelSlimConfig.from_config 把这些顶层键填入 self.quant_description（非空），随后
      maybe_update_config 的卫语句 `if self.quant_description: return` 判断为真 → 跳过加载
      quant_model_description.json（真正的 per-layer 量化类型）→ get_quant_method 无法判定各层
      scheme → 全部 Linear 回退 unquantized（bf16）加载 → 权重显存翻倍（~27GB→~54GB/shard）→ OOM
      启动失败。维护者拒绝代码侧卫语句修复（PR #9734，会掩盖错误权重定位），官方解为修正权重文件。

    fix: >
      检查 <model_dir>/config.json：若含 quantization_config → 该权重版本错误，从官方源重新下载
      （modelscope Eco-Tech/MiniMax-M2.5-w8a8-QuaRot 等正确导出，config.json 无 quantization_config），
      重启服务；正确权重下显存回到 int8 预期占用（~27GB/shard）。
    rollback: "错误权重文件即复现 2× 显存/OOM（重下正确权重可验证因果）"
