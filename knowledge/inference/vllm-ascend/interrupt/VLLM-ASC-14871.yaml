    severity: service-affecting
    fix_side_effects: [requires-code-change]   # 升级到含 PR #14504 的构建（代码级修复，需更新镜像/重启服务）
    fix_type: code-patch

    root_cause: >
      vllm-ascend 的 recompute scheduler（PD 分离 decode 用）自 PR #12541 起在
      recompute_scheduler.py:1088 update_from_output 读 request.async_tokens_to_discard 做
      spec-decode 相关判断；该属性在配对的上游 vLLM（v0.27.1 及当时 main）Request 类上不存在，
      仓库内亦无定义/setattr（全仓库唯一读取点）——main2main 同步缺口。spec-decode 请求每个
      decode step 都填充 scheduled_spec_token_ids，使 and 链必然触达缺失属性 → 首个请求即抛
      AttributeError，V1/V2 runner 同崩（scheduler core 与 runner 无关）。
      PR #14504 将 recompute scheduler 同步到配对 vLLM（v0.27.1 / vLLM main ba07e4a48）修复。

    fix: >
      升级 vllm-ascend 到含 PR #14504（[Misc][Core][P/D] Add main2main 0.27.1 for Recompute
      scheduler，merged 2026-08-25，merge_commit 07482eb3）的构建/后续版本；issue #14871 已
      closed completed（报者确认）。未升级前的规避：去掉 speculative decoding（--speculative-config，
      issue 消融验证同一拓扑正常）或关闭 recompute_scheduler_enable。
    rollback: "回退到含 #12541、未含 #14504 的构建即复现——升级为代码级修复，无参数回滚"
