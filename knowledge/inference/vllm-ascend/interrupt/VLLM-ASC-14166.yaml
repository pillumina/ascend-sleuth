# VLLM-ASC-14166 —— A5 950DT 启动 DSV4-Flash-0731：torch-npu 缺 MoeInitRoutingV3 算子二进制
# 来源：https://github.com/vllm-project/vllm-ascend/issues/14166
# fix 跟踪：无 PR；用户实测安装 torch-npu 2.10.0.post4 后不再报错（官方确认修复版本）
# investigation_quality: low（assessment.jsonl #14166）
# 批量导入：docs/eval-reports/0001-vllm-ascend-batch-plan.md（Phase B）

cases:
  - id: VLLM-ASC-14166
    title: "A5 950DT 启动 DeepSeek-V4-Flash-0731 报 MoeInitRoutingV3 找不到二进制（torch-npu 需 >=2.10.0.post4）"

    category: interrupt
    tags: [a5, torch-npu, moe, missing-operator, version-compat]

    platforms: ["A5-950"]
    compat:
      - framework: torch-npu
        ranges: ["<2.10.0.post4"]   # 实测：2.10.0.post2 失败（Cannot find binary for op MoeInitRoutingV3）；post4 修复

    investigation_quality: low
    confidence:
      hits: 0
      misdiagnoses: 0
      score: 0.1                    # 初始值（investigation_quality=low → 0.1）

    symptoms:
      - "A5 950DT 启动 deepseek v4 flash 0731 报 MoeInitRoutingV3 算子错误，profile_run 阶段崩溃"
      - "Cannot find binary for op MoeInitRoutingV3 / launch failed for MoeInitRoutingV3, errno:561000（Execution_Error EZ1009）"
      - "安装 torch-npu 2.10.0.post4 后，已经不报 aclnnMoeInitRoutingV3 算子的错误"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/14166"


    verification:

      source: upstream-maintainer-confirmed

      detail: 'issue #14166'

    quickly_check:
      primary:
        command_template: "grep 'Cannot find binary for op MoeInitRoutingV3' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:.*Cannot find binary for op MoeInitRoutingV3"
      fallback:
        command_template: "grep -E 'MoeInitRoutingV3.*561000|errno:561000' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:.*(MoeInitRoutingV3|561000)"

    diagnosis:
      - step: 1
        check: "平台是否为 A5（950/950DT）？"
        expected: "是（npu-smi 显示 Ascend950DT）"
      - step: 2
        check: "torch-npu 版本是否 < 2.10.0.post4？"
        expected: "是（2.10.0.post2 实测失败）——op-plugin 未内置 MoeInitRoutingV3 二进制"
      - step: 3
        check: "错误签名是否为 Cannot find binary for op MoeInitRoutingV3, errno:561000？"
        expected: "是；注意报错尾部 npu_grouped_matmul ... 161002 是连锁次级错误，非独立根因"
      - step: 4
        check: "升级 torch-npu 到 2.10.0.post4 后是否不再报错？"
        expected: "是（用户实测确认）"

    severity: service-affecting
    fix_side_effects: [requires-restart]
    fix_type: config-change         # 版本升级型（依赖包升级）

    root_cause: >
      torch-npu 2.10.0.post2（及更早）的 op-plugin 未内置 MoeInitRoutingV3 算子的二进制实现，
      A5 上启动 DSV4-Flash-0731 走 MoE 路由（moe_runner/fused_moe）时 kernel 找不到二进制
      （errno:561000），profile_run 阶段崩溃；torch-npu 2.10.0.post4 起补齐该算子。

    fix: "升级 torch-npu 到 >=2.10.0.post4 后重启服务（vllm serve 命令不变）"
    rollback: "回退 torch-npu 版本即恢复报错（不建议）；如必须回退需先确认环境内其他算子对该版本的依赖"
