# VLLM-ASC-1991 —— 310P/300I 平台 pooling 模型（Qwen3-Embedding-4B）支持缺失：加载报 CustomQwen3 'layers' ValueError 或 ACL SetPrecisionMode 500001，PR #8846 补 310P 非因果 attention/mask 路径后可用
# 来源：https://github.com/vllm-project/vllm-ascend/issues/1991
# fix 跟踪：PR #8846 [Feature] Support pooling models on 310P platform（merged 2026-05-27 realliujiaxu；310P E2E：embedding/classification/scoring）；issue 同日 yiz-liu 关闭（completed）→ 用 main/下一发布版
# investigation_quality: medium（上游 PR 代码级支持 + E2E；issue 线程无逐层排查，早期即"未支持"回复）
# pre-triage: variant_of VLLM-ASC-15086 —— 同"not-supported 启动失败 → 查上游支持合入版本 → 升级"族（15086=K3 registry 版本错位；本条=310P pooling 路径缺失）；相似在诊断路径、根因/修复不同 → groom 复核 variant/new
# verification: upstream-fix-merged（fix PR #8846，merged 2026-05-27）
# 脱敏：issue 无内网 IP/密钥/token；正文未引用含路径的 user-attachments 内容
# 建议命名空间：inference/vllm-ascend/interrupt/
# 导入管道：issue-ingest r2-sed-g1（2026-09，postmortems/inbox 草稿，待 groom 分诊转正）

# groom 升格：2026-W36 round3（vllm-ascend 第 2 轮全自动沉淀）——schema 校验通过

cases:
  - id: VLLM-ASC-1991
    title: "Qwen3-Embedding-4B（pooling 模型）在 300I Duo/310P3 上无法启动：模型加载报 ValueError: no module or parameter named 'layers' in CustomQwen3ForCausalLM（或 worker init 报 ACL SetPrecisionMode 500001）——310P 平台 pooling 支持缺失，升级到含 PR #8846 的版本（main/后续发布）可用"

    category: interrupt
    tags: [310p, 300i-duo, pooling, embedding, qwen3-embedding, not-supported, startup-failure, upgrade]
    platforms: ["310P"]               # Atlas 300I Duo（芯片 310P3）

    compat:
      - framework: vllm-ascend
        ranges: ["<0.20.2"]           # 0.9.2rc1 实测失败；fix 合入 main 2026-05-27（PR#8846，当时 main=v0.20.2）；预计随 v0.20.2rc1(06-03)/v0.21.0rc1(06-16) 发布，groom 回填精确首版
        cann: ["8.1.RC1"]             # 触发环境；与 CANN 版本无关（支持缺失不是 CANN bug）

    investigation_quality: medium
    confidence:
      hits: 0
      misdiagnoses: 0

    symptoms:
      - "300I Duo（310P3）上用 vllm-ascend v0.9.2rc1-310p 镜像起 Qwen3-Embedding-4B（--tensor-parallel-size 2）服务，worker init_device 报 RuntimeError: SetPrecisionMode ... AclSetCompileopt(ACL_PRECISION_MODE), error code is 500001 → GE/OpCompileProcessor init failed"
      - "310P3 复现同模型：模型加载报 ValueError: There is no module or parameter named 'layers' in CustomQwen3ForCausalLM（vllm_ascend/models/qwen3.py load_weights）"
      - "同一套件跑普通 causal LM（Qwen3 系）无此问题——只有 pooling/embedding 形态失败"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/1991"
      - "https://github.com/vllm-project/vllm-ascend/pull/8846"

    verification:
      source: upstream-fix-merged
      detail: "PR #8846（merged 2026-05-27，realliujiaxu）：补 310P pooling 模型支持（非因果 attention mask + flash attention forward），附 310P E2E（classification/embedding/scoring）；issue #1991 同日由 yiz-liu 关闭 completed"

    quickly_check:
      primary:
        command_template: "grep -aE 'There is no module or parameter named .layers. in CustomQwen3ForCausalLM|no module or parameter named .layers. in CustomQwen3' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:no module or parameter named .layers. in CustomQwen3"
      fallback:
        command_template: "grep -aE 'ACL_PRECISION_MODE.*500001|error code is 500001|Found pooling configuration' {{log_path}}"
        rank_selector: all_failed
        expected: "regex:(ACL_PRECISION_MODE.*500001|error code is 500001|Found pooling configuration)"

    diagnosis:
      - step: 1
        check: "平台判别：npu-smi 是否为 310P/300I（Atlas 300I Duo 等 310 系）？"
        expected: "是 310 系 → 走本 case；910B/A3/A5 同类 pooling 报错另查"
      - step: 2
        check: "模型形态判别：启动日志是否出现 'Found pooling configuration'/'This model supports multiple tasks ... Defaulting to embed'（pooling 模型）？"
        expected: "是——Qwen3-Embedding 等 pooling 模型，非普通 causal LM"
      - step: 3
        check: "报错签名判别：CustomQwen3 'layers' ValueError 或 ACL_PRECISION_MODE 500001 / GE init failed？"
        expected: "命中任一 —— 310P pooling 支持缺失的不同表现；两个签名都可指向本 case，勿把 500001 当 CANN/环境问题排查"
        note: "'layers' ValueError 与 500001 是同一根因（pooling 模型在 310P 未适配）在不同子路径的级联表现"
      - step: 4
        check: "修复：升级 vllm-ascend 到含 PR #8846 的版本（main 或下一发布版），300I 另加 --enforce-eager"
        expected: "310P 上 embedding/classification/scoring 可正常拉起（PR 附 E2E）；旧版本无代码级规避"
        fix_on_mismatch: "升级后再验证；仍失败则查模型/量化在该版本的支持矩阵"
        rollback: "回退旧版本（复现确认支持缺失，非环境问题）"

    severity: service-affecting         # 服务无法启动
    fix_side_effects: [requires-restart]   # 升级重启
    fix_type: config-change             # 版本升级（非配置/环境错误）

    root_cause: >
      310P/300I（310 系）平台的 pooling（embedding/classification/scoring）模型支持缺失：vllm-ascend
      310P 路径没有 pooling 模型所需的非因果（non-causal）attention 处理，模型加载落到
      CustomQwen3ForCausalLM 的权重映射时报 'no module or parameter named layers'（310P3 复现签名），
      或在 300I Duo 上以 ACL SetPrecisionMode 500001 / GE init failed 形式崩在 init_device（300I 侧
      叠加仅支持 eager 模式）。PR #8846 为该平台实现 pooling 的 attention mask 生成与 flash attention
      forward，合入后 310P 可用——属平台支持补全（feature gap），非 CANN/驱动/配置缺陷。

    fix: >
      升级 vllm-ascend 到含 PR #8846 的版本（main 2026-05-27 合入；v0.20.2rc1/v0.21.0rc1 起预计含，
      groom 回填首版），310P/300I 上即可运行 pooling 模型；300I 另需 --enforce-eager（不支持图模式）。
      旧版本无 workaround——签名（'layers' ValueError / 500001）均指向平台支持缺失，不要按环境问题重装驱动/CANN。
    rollback: "回退旧版本（复现确认是版本支持差）"
