# VLLM-ASC-7993 —— A2 + MiniMax-M2.5-w8a8-QuaRot FULL_DECODE_ONLY 图模式偶现 FIA 算子越界/内存访问错误（fftsplus aicore error）
# 来源: https://github.com/vllm-project/vllm-ascend/issues/7993
# fix 跟踪: 无 vllm-ascend PR；评论#8 定位为 CANN runtime graph 下 attention update_param args copy 保序缺失（x86 >1k/ARM >4k 走异步拷贝分支），修复合入 CANN 9.0；issue 报者自关 completed 2026-04-23；同族 #7593
# investigation_quality: medium（完整 runtime plog + launch args copy 机制定位 + ARM/x86 阈值差异说明；无官方代码级确认，CANN 修复不可在 repo 核验）
# 批量导入：r2-sed-g2（2026-09）
# pre-triage: new_pattern（现库无 FIA/graph args copy runtime bug case；邻近 VLLM-ASC-12983 为 310P 图模式缺 free-mask 算子，不同根因）

# 建议命名空间：inference/vllm-ascend/interrupt/
# groom 升格：2026-W36 round3（vllm-ascend 第 2 轮全自动沉淀）——schema 校验通过

cases:
  - id: VLLM-ASC-7993
    title: "A2（910B）跑 MiniMax-M2.5-w8a8-QuaRot（FULL_DECODE_ONLY 图模式）推理偶现崩溃：runtime 报 fftsplus FIA 算子越界/内存访问错误（aicore/aivector error、sq sw status error、model stream execute failed）——CANN runtime graph 下 attention update_param 的 args copy 保序缺失（x86>1k/ARM>4k 异步拷贝分支拿到错误地址），CANN 9.0 修复"
    category: interrupt
    tags: [fia, attention, cudagraph, full-decode-only, graph-mode, runtime, args-copy, cann-version, intermittent, minimax, m2.5, quarot, 910b]

    platforms: ["A2-910B"]
    compat:
      - framework: vllm-ascend
        ranges: ["<=0.18.0"]        # 0.18 触发、0.14 不触发（评论#0 对照）；修复在 CANN ≥9.0（runtime），非 vllm-ascend 代码
        cann: ["<9.0"]              # 修复合入 CANN 9.0

    investigation_quality: medium
    confidence:
      hits: 0
      misdiagnoses: 0
      # score 草稿期不写，groom 首次评估后计算

    symptoms:
      - "A2 + minimax-m2.5-w8a8-quarot + FULL_DECODE_ONLY 图模式（+ auto-tool-choice/minimax_m2 parser）推理偶现崩溃"
      - "runtime plog 首错：there is an exception of fftsplus aicore error / fftsplus aivector error（core dump，MTE error info 非零，extend info subErrType=4 'D-cache 读写 UB 时总线返回非零'）"
      - "伴随 Task run failed, ... sqe_type=7(notify wait), errType=0x20(sq sw status error) 与 the model stream execute failed"
      - "0.18 触发、0.14 不触发（同环境对照）；x86 更易触发（阈值更低）"
      - "修复：CANN ≥9.0（runtime graph 下 attention update_param args copy 保序缺失修复，thread 评论#8）"

    references:
      - "https://github.com/vllm-project/vllm-ascend/issues/7993"

    verification:
      source: investigation
      detail: 'issue #7993 无 vllm-ascend PR；评论#8 报者 runtime 级定位（图模式 args copy 异步分支未保序），修复合入闭源 CANN 9.0，thread 自述、无外部 repo 证据可核'

    quickly_check:
      primary:
        command_template: "grep -aE 'fftsplus (aicore|aivector) error' {{plog}}"
        rank_selector: all_failed
        expected: "regex:fftsplus (aicore|aivector) error"
      fallback:
        command_template: "grep -aE 'Task run failed.*sqe_type=7|model stream execute failed' {{plog}}"
        rank_selector: all_failed
        expected: "regex:(Task run failed.*sqe_type=7|model stream execute failed)"

    diagnosis:
      - step: 1
        check: "症状判别：图模式（FULL_DECODE_ONLY/ACL graph）下 MoE/attention 推理偶现 runtime 崩溃，plog 首错为 fftsplus aicore/aivector error + sq sw status error（subErrType=4）？"
        expected: "是——特征为 launch 期地址类错误（FIA/attention update 路径），非算子数值类"
      - step: 2
        check: "定位方向：是否为图模式下 attention update_param kernel launch 的 args copy 异步分支未保序（arg size 超过阈值 x86>1k/ARM>4k）导致 FIA 算子拿到旧/错地址？"
        expected: "是——thread 报者定位（评论#8）：FIA 算子 arg size 2k+ 命中异步拷贝分支，x86 阈值 1k 更易触发；CANN 9.0 修复"
      - step: 3
        check: "修复：升级 CANN ≥9.0 后同压测观察崩溃是否消失"
        expected: "CANN 9.0 已合入修复（thread 自述；外部核验受限）"
      - step: 4
        check: "忽略项：① runtime 异常后的多行 stars_engine/device_error_core_proc [ERROR] 是同一崩溃登记输出；② thread 中 TP2_EP2 加载期 WorkerProc failed to start 是另一现象（fourierr，未定论），勿混判"
        note: "与 VLLM-ASC-12983（310P 图模式缺 free-mask 算子 107030）表面都带'图模式崩溃'，但根因在 CANN runtime vs 镜像算子缺失，判型以本 case 的 fftsplus/sq sw status 签名区分"

    severity: service-affecting
    fix_side_effects: [requires-restart]
    fix_type: config-change                        # 版本升级（CANN ≥9.0，runtime 修复；无 vllm-ascend 代码 fix）

    root_cause: >
      CANN runtime 图模式（ACL graph）下，attention 的 update_param 在 kernel launch 环节执行
      args copy：runtime 按 arg size 选择拷贝方式，size 超过阈值（x86 机器 >1k，ARM 机器 >4k）
      时走异步拷贝分支，当前实现未保证拷贝顺序（保序缺失），FIA（fused attention）算子可能读到
      旧的/错误的参数地址 → 偶现越界与内存访问错误（fftsplus aicore/aivector error、sq sw status
      error、model stream execute failed）。x86 阈值更低故更易触发。修复合入 CANN 9.0（runtime），
      vllm-ascend 无代码改动。

    fix: >
      升级 CANN ≥9.0（runtime 修复合入 CANN 9.0，thread 评论#8）。无配置 workaround；
      0.14 不触发的对照仅用于说明回归引入面，不作规避手段。
    rollback: "回退 CANN <9.0 即回到缺陷面"
