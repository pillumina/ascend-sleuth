# metrics 阈值与可解读性下限（**数据，不是散文**）
#
# 谁读：`scripts/metrics_health.py`（闭环检测器）；`docs/guide/metrics.md` 的周批流程第 2 步。
#
# 为什么单独成文件（2026-09-10 审计）：
#   阈值原先散在 `docs/plan/roadmap.md`（闸门叙述）、ADR-0004（容量数值）、`docs/guide/metrics.md`（口径）
#   与 groom 的信号表里，**没有任何一处能被脚本读** —— 于是"指标越界"永远不会自己喊：
#   实测某格 `interrupt=85/30`（soft_cap 的 2.8 倍）、结构快照 10 天没更新、反馈捕获为 0
#   （命中/误诊没有分母），而周批第 4 步 `verify_metrics.py --check` 照样 exit 0
#   （它只验结构：period 唯一 / 字段白名单 / 比例字段合法）。
#   阈值落成数据 = 检测器有判据可读（原则二：不变量写进结构），且改判据只改一处。
#
# 改这里 = 改判据：同步 `docs/guide/metrics.md` 的「闸门与可解读性」节、`docs/plan/roadmap.md` 的闸门描述。

freshness:
  # 诊断侧 live 快照：超期 = 趋势断档（季度回顾要读连续 live 快照）
  live_snapshot_max_age_days: 7
  # 结构侧（容量 / case 数 / reference 数）：超期 = 治理信号过期（格子压线时最要命）
  structural_max_age_days: 7

gates:
  # 容量线按**阶段一实读 token** 判，不按条数（2026-09-29 统一，见 docs/adr/0004 的读侧一节）：
  #   被约束的量是"查问题时第一眼要读进来多少字"（B_ctx）；条数只是它的代理，且代理关系随内容变
  #   （实测每条 177 token，而旧政策按 70 估 → 估小了 3.6 倍，才让 93 条看起来"贴着线"）。
  #   数字现算：`python3 scripts/index_read_cost.py`。条数仍在容量台账里显示，但**不触发动作**。
  - id: cell_read_soft_tok
    dimension: capacity_cell_read_tok
    op: ">"
    value: 8000
    meaning: 格子阶段一实读超评估线（约常驻指令面的 38%）
    action: 评估能否再省：先看行宽/字段，再看平台轴切分（python3 scripts/index_read_cost.py）
  - id: cell_read_hard_tok
    dimension: capacity_cell_read_tok
    op: ">="
    value: 20000
    meaning: 格子阶段一实读超硬线（与常驻指令面同量级）
    action: 强制处理：先瘦身，再评估平台轴切分（不预拆目录；动作见 EV-2026-160/161）
  # 兜底视图（category 未判出来时才读）**接上同一条线，单列一个 dimension**：
  #   此前它被明确写在线外（"兜底视图更贵，要治得单独立项"），后果是全系统最贵的一次读
  #   ——vllm-ascend 兜底视图 24270 tok——不在任何判据里，`index_read_cost.py --json` 也退 0。
  #   数值沿用同一套推导（硬线 = 常驻指令面量级；软线 = 其 38%），不是给这条路新拍的数：
  #   线本来就有，缺的是把它接到这条读取路径上。单列 dimension 是为了让"哪条路径越线"看得出来。
  - id: fallback_read_soft_tok
    dimension: capacity_fallback_read_tok
    op: ">"
    value: 8000
    meaning: 兜底视图（category 未定才读）超评估线
    action: 评估能否再省：先看行宽/字段，再看是否改两步法（先读窄视图再读类视图）
  - id: fallback_read_hard_tok
    dimension: capacity_fallback_read_tok
    op: ">="
    value: 20000
    meaning: 兜底视图超硬线（与类视图、常驻指令面同量级）
    action: 强制处理：优先按平台轴切分或改两步法（窄视图 → 类视图）；不预拆目录
  # 先验层（references/）与阶段二候选全文**故意不设线**（2026-09-29）：
  #   先验层是检索式读取（一次 grep + ≤5 行），token 成本不随库大小线性涨——它的退化形态是
  #   "翻不到"，量化量是**检索残量**（平台 + 类别两刀切完剩多少行，`index_read_cost.py` 现算）。
  #   阶段二的上限是"读几条候选"，压低字数等于压低证据量。
  #   两者都只量不判：按准入判据（机械可判 + 确定性后果 + 已复发 ≥2 次），现在缺的是第三项，
  #   所以先有数（原则八：可观测先于改进），攒到期数够了再定线。
  - id: feedback_capture_floor
    dimension: feedback_capture_total
    op: "<="
    value: 0
    meaning: 本期捕获到 fix 结果的 session 为 0
    action: 命中率/误诊率/归因比无分母——不得据此下"无异常"结论；groom 摘要提示补反馈

# 可解读性下限：分母为 0（或来源无数据）的指标必须被标成"不可解读"，而不是安静地写成 0
readability:
  - metric: misdiagnosis_rate
    rule: source_nonzero
    source: feedback_capture
    why: 反馈捕获为 0 时，命中样本从未被人验证过——"0/N"只表示"没人回报"，不表示"没有误诊"
  - metric: attribution_ratio
    rule: any_gt_0
    why: 全 0 会被读成"无归因问题"，实际是"没有一个 not_resolved 触发过归因"（没数据）
