# metrics/timeline.yaml —— 指标时序数据（机器可读，CI 校验，append-only）
#
# 每个快照 = 一个 period 条目，字段集合由 scripts/trace_metrics.py 固定生成，
# 人复核后追加。字段合法性由 scripts/verify_metrics.py --check 校验（CI 强制），
# 防格式漂移（曾发生 W28/W35 字段完全不同、跨期不可比的教训）。
#
# kind: live（活诊断周期快照）| replay（回放评估）| example（示例，展示格式用）
# 只有 live 参与趋势对比；replay/example 供参考，不参与跨期趋势。
#
# 机制说明、指标定义、汇总职责见 docs/metrics.md（稳定文档层，机制变才变）。

